name: Чат сделки — оценка хода моделью (пилот, тень)

# Решение владельца 19.10.2026: по новым сообщениям чата открытых сделок
# реализации и пресейла модель ставит сделке оценку (идёт / ждёт / стоит, куда
# движется, риск, на ком мяч, ближайший срок). Бюджет — 5 долларов в день, итог —
# в закрытую базу. Сутки — по Москве: каждый вызов модели, удачный или нет, пишется
# в deal_chat_spend, и прогон берёт себе не больше остатка суток; budget_usd больше
# пяти не принимается — два прогона в день предел не удвоят. Оценки — в таблицах
# library/supabase/deal_chat_schema.sql; после записи свод по сделкам уходит в
# закрытый ключ KV realctx:v1 (scripts/realization_ctx.py), и вкладка «Реализация»
# показывает его (решение владельца 23.10.2026). Правила отбора, подготовки и
# проверки ответа — в шапке scripts/chat_context.py.
#
# РЕЖИМЫ. dry (по умолчанию) — модель не вызывается вовсе: счёт сделок-кандидатов,
# чатов с новыми сообщениями людей и оценка токенов и долларов; база открывается
# только на чтение (курсор «что уже оценено»), без секрета базы — всё считается
# новым. live — сначала проверки на чистой одноразовой базе, потом схема в
# рабочей базе, потом чтение, оценка и запись. Курсор сдвигается только вместе с
# записанной оценкой, одной транзакцией.
#
# ПОРТАЛ. Очередь bitrix-portal — общая с прочими чтениями портала; бюджет 1
# запрос/с (рядом может идти пересборка дашборда, как у зондов); один запрос на
# чат; первый отказ по лимиту останавливает чтение.
#
# ЧАСТИ (правило дробления 22.09.2026) — вход parts: 10, 25 или 50. Сделки
# выгружаются из портала один раз, первые limit чатов очереди режутся на смежные
# отрезки, и части идут ПОДРЯД в одном процессе (как library-deal-links), поэтому
# BITRIX_PARALLEL=1, а бюджет и суточный остаток — общие. Каждая оценка пишется
# своей транзакцией: оборванная часть уносит только несделанное, следующий прогон
# начнёт с него — очередь «давно не читанные первыми».
#
# СРОК. Через 45 минут скрипт сам перестаёт читать и звать модель и печатает итог —
# раньше, чем timeout-minutes снимет шаг вместе с журналом расхода.
#
# В ЖУРНАЛ — ТОЛЬКО АГРЕГАТЫ (правило 17): ни текста сообщений, ни имён, ни
# номеров сделок и чатов. Артефактов и кэша нет: текст чатов живёт в памяти
# процесса до конца шага.
#
# РАСПИСАНИЕ (решение владельца 23.10.2026): каждую ночь в 04:07 UTC (07:07 МСК) —
# repository_dispatch «chat-context» от Cloudflare-планировщика (scheduler/worker.js).
# У dispatch нет входов: режим live, суточный проход, бюджет 5, чатов 400, частей 10.
#
# ФАКТЫ И «ГЛАВНОЕ» (решение владельца 25.10.2026, chat-ctx-2): тот же вызов модели
# выписывает из сообщений суммы, сведения о договоре и сигналы сорсинга и отмечает 0–3
# пункта «что важно» по всему контексту сделки. Цитата факта — до 200 знаков, без
# контактов и имён, только в закрытой базе (deal_chat_facts).
#
# РАЗОВОЕ ЧТЕНИЕ ИСТОРИИ (решение владельца 25.10.2026: «Да, и прочитать историю разово
# до $20») — вход pass = history, только вручную: старые сообщения открытых сделок, до
# 300 на чат, со своей статьёй расхода «история» (20 долларов за всё время, держит база —
# deal_chat_take_budget), суточный предел 5 долларов она не трогает. Порядок: dry (счёт
# чатов, страниц, сообщений, оценка на сделку и подписанная экстраполяция на всех) → live
# limit 10 (проба) → live limit 60, повторять, пока кандидатов не 0 или журнал не скажет
# «разовый бюджет исчерпан» (выход кодом 0 до чтения портала). Код 1 или сработавший гейт
# (прогон откачен целиком) — стоп и разбор, не повтор: повтор возьмёт те же сделки и заплатит
# за них снова (ревью 28.10.2026). Ночной запуск — всегда суточный.
on:
  repository_dispatch:
    types: [chat-context]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry — счёт и оценка расхода без модели; live — оценка и запись в базу"
        type: choice
        options: [dry, live]
        default: dry
      pass:
        description: "daily — новые сообщения (суточный предел $5); history — разовое чтение истории (своя статья, $20 за всё время)"
        type: choice
        options: [daily, history]
        default: daily
      budget_usd:
        description: "Предел расхода на модель за прогон, долларов (daily 0…5, history 0…20; и не больше остатка статьи)"
        default: "5"
      limit:
        description: "Сколько чатов сделок прочитать (daily 1…400, history 1…60; вне предела прогон не идёт)"
        default: "100"
      parts:
        # Распоряжение владельца 22.09.2026: «всегда дели минимум на 10». Меньше
        # десяти здесь не бывает — список начинается с 10.
        description: "На сколько частей делить очередь прогона"
        type: choice
        options: ["10", "25", "50"]
        default: "10"

permissions:
  contents: read

concurrency:
  # общая очередь чтения портала (CLAUDE.md, «Битрикс не перегружать»)
  group: bitrix-portal
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ночной запуск (dispatch) входов не несёт — его значения здесь
      MODE: ${{ github.event_name == 'repository_dispatch' && 'live' || inputs.mode }}
      PASS: ${{ github.event_name == 'repository_dispatch' && 'daily' || inputs.pass }}
      BUDGET: ${{ github.event_name == 'repository_dispatch' && '5' || inputs.budget_usd }}
      LIMIT: ${{ github.event_name == 'repository_dispatch' && '400' || inputs.limit }}
      PARTS: ${{ github.event_name == 'repository_dispatch' && '10' || inputs.parts }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        # anthropic — в requirements.txt (версия закреплена); psycopg2 — курсор и
        # запись; pytest — проверкам на чистой базе перед записью; openpyxl, xlrd, pypdf,
        # pyyaml, pillow — свод для вкладки пересчитывает исход договоров тем же кодом,
        # что прогон чтения (scripts/contract_terms.py), и его зависимости — те же
        run: pip install --quiet -r requirements.txt pytest psycopg2-binary==2.9.10 openpyxl xlrd pypdf pyyaml pillow==12.3.0

      - name: Проверка входов и секретов
        env:
          B: ${{ secrets.BITRIX_WEBHOOK_URL }}
          # ключ модели — только в live: холостой прогон его не видит и в проверке
          A: ${{ (github.event_name == 'repository_dispatch' || inputs.mode == 'live') && secrets.ANTHROPIC_API_KEY || '' }}
          S: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [[ "$BUDGET" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "::error::budget_usd — не число"; exit 1; }
          # имена переменных оболочки — только латиница
          case "$PASS" in
            daily)   CAP=5;  CAP_WHAT="5 долларов в сутки"; LMAX=400 ;;
            history) CAP=20; CAP_WHAT="20 долларов на разовое чтение истории"; LMAX=60 ;;
            *) echo "::error::pass — daily или history"; exit 1 ;;
          esac
          awk -v b="$BUDGET" -v p="$CAP" 'BEGIN { exit !(b + 0 <= p + 0) }' \
            || { echo "::error::budget_usd больше $CAP — предел владельца $CAP_WHAT"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo "::error::limit — не целое"; exit 1; }
          # предел — как у бюджета: вне 1…LMAX прогон не идёт, а не урезается молча
          # (ЛИМИТ_МАКС и ЛИМИТ_ИСТОРИИ scripts/chat_context.py; ревью 28.10.2026)
          [ "$LIMIT" -ge 1 ] && [ "$LIMIT" -le "$LMAX" ] \
            || { echo "::error::limit вне 1…$LMAX для прохода $PASS"; exit 1; }
          [ -n "${B:-}" ] || { echo "::error::нет секрета BITRIX_WEBHOOK_URL"; exit 1; }
          if [ "$MODE" = live ]; then
            [ -n "${A:-}" ] || { echo "::error::нет секрета ANTHROPIC_API_KEY — оценка моделью невозможна"; exit 1; }
            [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL — оценки некуда писать"; exit 1; }
          fi
          echo "режим $MODE, проход $PASS, бюджет $BUDGET, чатов не больше $LIMIT, частей $PARTS"

      # Проверки записи — на своей чистой базе ПЕРЕД рабочей: пропущенная
      # проверка — не пройденная проверка. База в локали UTF-8 (правило 21а).
      - name: Проверки на чистой базе
        if: env.MODE == 'live'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-client
          sudo pg_ctlcluster "$(pg_lsclusters -h | awk 'NR==1{print $1}')" main start
          sudo -u postgres psql -q -c "alter user postgres password 'ci'"
          sudo -u postgres createdb -T template0 --locale=C.UTF-8 --encoding=UTF8 library_sql_test
          LIBRARY_SQL_TEST_DSN="postgresql://postgres:ci@127.0.0.1:5432/library_sql_test" \
            python -m pytest tests/test_chat_context.py tests/test_chat_context_sql.py -q

      # Схема перед записью: файл идемпотентен и ни от чего не зависит.
      - name: Схема в рабочей базе
        if: env.MODE == 'live'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql "$SUPABASE_DB_URL" -q -v ON_ERROR_STOP=1 -f library/supabase/deal_chat_schema.sql

      # Сводка по сделке (решение владельца 25.10.2026): стадия, шаг регламента, сроки,
      # заказы, договоры, экономика — без имён; пишет сборка дашборда после деплоя
      # (deploy.yml → закрытый ключ dealdigest:v1). Читается в файл на раннере; нет ключа
      # или доступа — модель видит стадию из портала, прошлую оценку и факты. Старше
      # chat_context.СВОДКА_ЧАСОВ — не используется. В журнал — только счётчики.
      - name: Сводка по сделкам (KV dealdigest:v1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/dealdigest_kv.py --fetch "$RUNNER_TEMP/dealdigest.json" \
            || echo "::warning::сводка по сделкам не прочитана — модель увидит только стадию"

      - name: Оценка
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          # вебхук владельца — только чтение чатов сделок (решение 19.10.2026)
          BITRIX_CHAT_WEBHOOK_URL: ${{ secrets.BITRIX_CHAT_WEBHOOK_URL }}
          # второй читатель чатов — руководитель реализации (решение 22.10.2026)
          BITRIX_CHAT_WEBHOOK_URL_2: ${{ secrets.BITRIX_CHAT_WEBHOOK_URL_2 }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # ключ модели — только в live: холостому прогону он не нужен
          ANTHROPIC_API_KEY: ${{ (github.event_name == 'repository_dispatch' || inputs.mode == 'live') && secrets.ANTHROPIC_API_KEY || '' }}
          SERVICE_ACCOUNT_IDS: ${{ vars.SERVICE_ACCOUNT_IDS }}
          BITRIX_RPS: "1.0"
          BITRIX_PARALLEL: "1"
          # попытка — в ключе: откат повторного запуска не трогает оценки первой попытки
          RUN_ID: chat-ctx-${{ github.run_id }}-${{ github.run_attempt }}
          # сводка по сделке (стадия, сроки, заказы, договоры, экономика — без имён) — файл
          # из закрытого ключа dealdigest:v1 (шаг выше); нет файла — модель видит стадию из
          # портала, прошлую оценку и факты
          DEALDIGEST_PATH: ${{ runner.temp }}/dealdigest.json
        run: python scripts/chat_context.py --mode "$MODE" --pass "$PASS" --budget "$BUDGET" --limit "$LIMIT" --parts "$PARTS"

      # Свод по сделкам → закрытый ключ KV realctx:v1 для вкладки «Реализация». И после
      # неудачной оценки: свод читает только непомеченные оценки, а договоры в нём —
      # из своей таблицы. В журнал — только счётчики.
      - name: Свод чатов и договоров в закрытый ключ
        if: ${{ !cancelled() && env.MODE == 'live' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/realization_ctx.py --publish
