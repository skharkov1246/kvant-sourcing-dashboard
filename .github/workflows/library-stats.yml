name: Библиотека — сводка и переклассификация

# Ручные действия над уже накопленной базой. Битрикс не нужен ни одному: все
# работают с тем, что уже лежит в Supabase, ничего не скачивают и не пересобирают.
#
#   stats          — сколько чего в базе: строки по таблицам, спрос по сегментам,
#                    состояние вложений, правки инженеров. Ничего не меняет.
#   diag           — из чего состоят позиции без сегмента: есть ли у них
#                    классифицированные соседи и каких слов не хватает словарю.
#                    Ничего не меняет.
#   diag-junk      — то же по СТРОКАМ, помеченным как текст документа: два
#                    частотных списка рядом — самая наглядная проверка разметки.
#   mark           — вхолостую: сколько строк правило сочло текстом тендерного
#                    документа и шесть гейтов приёмки. Ничего не меняет.
#   mark-apply     — запись пометок. Запись отменяется сама, если гейты не сошлись.
#   mark-revert    — снять пометки прогона (вход run_id). Секунды.
#   reclassify     — вхолостую: сколько позиций без сегмента удалось бы разобрать
#                    и каким правилом. Ничего не меняет.
#   reclassify-apply — то же самое с записью сегмента в lib_demand.
#   bridge         — чем ещё связать артикул котировки с каталогом: вклад каждого
#                    ключа и его неоднозначность порознь, плюс расхождение ключа
#                    самого каталога. Ничего не меняет.
#   crossref       — чем наполнятся карточка товара и карточка поставщика.
#                    Ничего не меняет.
#   demand         — профиль спроса: что у нас спрашивают, насколько
#                    концентрированно, и по чему мы на рынок не выходили вовсе.
#                    Ничего не меняет.
#   funnel         — где теряются предложения поставщиков: воронка разбора по
#                    ФАЙЛАМ, с разрезом по коду разборщика, пути и шапке.
#                    Ничего не меняет.
#   sides          — ЧТО ИЗ «НАШЕГО СПРОСА» НА САМОМ ДЕЛЕ НЕ СПРОС: раскладка
#                    строк спроса по полю карточки. В полях СДЕЛОК лежат не только
#                    спецификации заказчика, но и наши исходящие ТКП, экономика
#                    проекта и входящие предложения — их позиции сейчас считаются
#                    нашим спросом. Ничего не меняет.
#   codes          — СКОЛЬКО КОДОВ С ЦЕНОЙ И БЕЗ. Три ответа, а не один: коды,
#                    которые мы спрашивали; коды, по которым цена есть; коды
#                    каталога. Добавляет ОДНУ строку агрегатов в lib_metric_runs —
#                    точку истории, из которой берётся динамика день ко дню.
#   dynamics       — ДИНАМИКА КОДОВ ПО ДНЯМ за неделю: сколько было неделю назад,
#                    сколько прибавлялось каждый день (новые файлы, переразбор,
#                    распознавание) и сколько ушло. Только выборки — работает и при
#                    базе в режиме только чтения. Ничего не меняет.
#   match          — ОТВЕЧАЕТ ЛИ ПРЕДЛОЖЕНИЕ НА НАШУ ЗАЯВКУ: сопоставление кодов
#                    двумя встречными долями — со стороны предложения и со стороны
#                    заявки. Вторая закупочная: по скольким нашим позициям пришла
#                    цена. Ничего не меняет.
#   part           — ВСЁ, ЧТО БАЗА ЗНАЕТ ОБ ОДНОМ АРТИКУЛЕ: каталог, семья по
#                    основе номера, взаимозаменяемость, машины, поставщики, спрос
#                    и цены с коммерческими условиями. Номер задаётся входом
#                    «part». Ничего не меняет.
#   calibration    — ПОЧЕМУ цена не прочитана: правило прогоняется заново по
#                    уже сохранённым строкам предложений, и отказы раскладываются
#                    по воротам. Заодно — цена денежного подавления в
#                    распознавании артикула и сетка кандидатов на послабление,
#                    каждый с проверкой на удержание. Ничего не меняет.
#   code-rule      — ЧТО СНИМАЕТ ПРАВИЛО «ПРАВДОПОДОБНЫЙ КОД»: марки стали, размеры
#                    и стандарты, стоявшие кодом, — по классам, в спросе, ценах и
#                    номенклатуре; сколько строк цены осталось без кода (стало
#                    хуже) и сколько вернёт переразбор; контроль по каталогу;
#                    количества, которые не читаются. Только выборки. Ничего не
#                    меняет.
#   brand-models   — КАКИЕ БРЕНДЫ И МОДЕЛИ МАШИН У НАС В СПРОСЕ И В ПРЕДЛОЖЕНИЯХ:
#                    по бренду — строки спроса, сделки, строки цены, карточки и
#                    модели рядов dict/model_series.json рядом. Порядок наполнения
#                    брендов модельными рядами. Частями по диапазону id (вход
#                    parts). Только выборки. Ничего не меняет.
#   offer-role     — ПРЯМОЕ ПРЕДЛОЖЕНИЕ ИЛИ ТРЕЙДЕР (решение владельца 26.09.2026):
#                    предложения «разбор КП» по роли компании — прямых, трейдеров,
#                    не определено, по причинам и по источнику бренда позиции;
#                    сверка с прежним правилом ревизии (у скольких стало хуже).
#                    Правило — library/offer_role.py. Частями по остатку id (вход
#                    parts). Только выборки. Ничего не меняет.
#   dealer-link    — ДИЛЕРЫ РАЗВЕДКИ БРЕНДОВ → РЕЕСТР КОМПАНИЙ: сколько записей
#                    dealers (data/brand_research) с доменом и ИНН, сколько
#                    сведено доменом или ИНН (по виду: своя площадка, официальный
#                    дилер, дилер), споры, кандидаты по имени (только кандидат).
#                    Правило — library/dealer_link.py (сопоставитель
#                    supplier_link). Одной частью: сотни записей из файлов и три
#                    выборки реестра. Только выборки. Ничего не меняет.
#
# В журнал прогона выводятся ТОЛЬКО агрегаты: репозиторий публичный, а в базе
# лежат коммерческие данные заказчиков. Ни наименований позиций, ни номеров
# сделок, ни почт авторов правок в выводе нет — запросы написаны так, что вернуть
# содержимое строки они не могут.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Что делать"
        type: choice
        default: stats
        options: [stats, diag, diag-junk, mark, mark-apply, mark-revert, reclassify,
                  reclassify-apply, bridge, crossref, demand, funnel,
                  calibration, part, match, codes, sides, dynamics, code-rule,
                  brand-models, offer-role, dealer-link]
      part:
        description: "Артикул для поиска — только для part (например 6265ZZ)"
        type: string
        default: ""
      part_detail:
        description: "part: выводить названия компаний и цены построчно. ЖУРНАЛ ПУБЛИЧНЫЙ"
        type: boolean
        default: false
      note:
        description: "Оговорка к точке истории — только для codes (например «во время переразбора»)"
        type: string
        default: ""
      run_id:
        description: "Ключ прогона разметки — только для mark-revert"
        default: ""
      parts:
        description: "Частей обхода — только для brand-models и offer-role"
        type: choice
        default: "16"
        options: ["10", "16", "25", "50"]
      rule_deal:
        description: "Наследовать сегмент по сделке (слабое правило, для reclassify)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: library-stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимости
        run: pip install --quiet psycopg2-binary==2.9.10

      - name: Проверка секрета
        env:
          S: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL"; exit 1; }
          case "$S" in
            *pooler.supabase.com*) echo "строка подключения через pooler — годится" ;;
            *) echo "::warning::строка не похожа на Session pooler; прямое подключение идёт по IPv6 и с раннера GitHub не соединится" ;;
          esac

      - name: Сводка по базе
        if: inputs.job == 'stats'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/library_stats.py

      - name: Разведка по позициям без сегмента
        if: inputs.job == 'diag'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python library/diag_demand.py

      - name: Разведка по помеченному тексту документов
        if: inputs.job == 'diag-junk'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: junk
        run: python library/diag_demand.py

      - name: Разметка вхолостую — гейты приёмки
        if: inputs.job == 'mark'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python library/mark_prose.py

      - name: Разметка с записью
        if: inputs.job == 'mark-apply'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          APPLY: "1"
        run: python library/mark_prose.py

      - name: Откат разметки
        if: inputs.job == 'mark-revert'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REVERT: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [ -n "${REVERT:-}" ] || { echo "::error::для отката нужен вход run_id"; exit 1; }
          python library/mark_prose.py

      - name: Переклассификация вхолостую
        if: inputs.job == 'reclassify'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RULE_DEAL: ${{ inputs.rule_deal && '1' || '' }}
        run: python library/reclassify.py

      - name: Переклассификация с записью
        if: inputs.job == 'reclassify-apply'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RULE_DEAL: ${{ inputs.rule_deal && '1' || '' }}
          APPLY: "1"
        run: python library/reclassify.py

      # ЗАМЕРЫ БЕЗ БИТРИКСА. Оба живут ещё и в прогоне разбора котировок, но там
      # они ждут чтения 22 015 карточек портала — шесть минут ради запроса к базе,
      # который идёт секунды. Отдельный вход нужен, чтобы перемерять после правки
      # запроса, а не подгадывать к ночному прогону.
      - name: Чем ещё связать артикул с каталогом
        if: inputs.job == 'bridge'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/catalog_bridge.py

      - name: Чем наполнятся карточки товара и поставщика
        if: inputs.job == 'crossref'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/cross_ref_coverage.py

      - name: Профиль спроса
        if: inputs.job == 'demand'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/demand_profile.py

      - name: Где теряются предложения поставщиков
        if: inputs.job == 'funnel'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/quote_parse_funnel.py

      - name: Почему цена не прочитана
        if: inputs.job == 'calibration'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LIMIT: "300000"
        run: python scripts/quote_price_calibration.py

      # ЗАМЕР ПИШЕТ ТОЧКУ ИСТОРИИ. До 22.09.2026 числовой истории не было вовсе:
      # цифры печатались в этот лог и пропадали через девяносто дней. Теперь
      # каждый прогон добавляет строку агрегатов в lib_metric_runs, ключуясь
      # своим номером, — из них рисуется динамика день ко дню.
      - name: Что из «нашего спроса» не спрос
        if: inputs.job == 'sides'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/demand_sides.py

      - name: Сколько кодов с ценой и без
        if: inputs.job == 'codes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WRITE: "1"
          RUN_KEY: ${{ github.run_id }}
          NOTE: ${{ inputs.note }}
        run: python scripts/codes_with_prices.py

      # ДИНАМИКА КОДОВ ПО ДНЯМ: сколько было неделю назад и сколько прибавлялось
      # каждый день — новыми файлами, переразбором, распознаванием, и сколько
      # ушло. Только выборки, без временных таблиц: работает и при базе в
      # режиме только чтения. Ничего не пишет.
      - name: Динамика кодов по дням
        if: inputs.job == 'dynamics'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/codes_dynamics.py

      # Правило «правдоподобный код» (library/docfilter.py) действует при чтении
      # на всю базу; замер говорит, сколько и чего оно сняло и у скольких стало
      # хуже (CLAUDE.md, правила 0 и 3). Выражение берётся из кода, функция
      # lib_pn_plausible в базе не нужна. Только выборки.
      - name: Что снимает правило правдоподобного кода
        if: inputs.job == 'code-rule'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PARTS: "16"
        run: python scripts/code_rule_measure.py

      # Бренды и модели машин в спросе и предложениях: порядок наполнения
      # брендов модельными рядами (распоряжение владельца 25.09.2026). Только
      # выборки; агрегаты — в журнал и файлом-артефактом.
      - name: Бренды и модели в спросе и предложениях
        if: inputs.job == 'brand-models'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PARTS: ${{ inputs.parts }}
          OUT: brand_models.json
        run: python scripts/brand_models.py

      - name: Агрегаты брендов и моделей файлом
        if: inputs.job == 'brand-models' && always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-models
          path: brand_models.json
          if-no-files-found: ignore

      # Роль предложения: прямое (от самого бренда или изготовителя) или от
      # трейдера. Замер вхолостую перед тем, как роль появится на карточках
      # (CLAUDE.md, правило 3). Только выборки, в журнал — только агрегаты.
      - name: Прямые предложения и трейдеры
        if: inputs.job == 'offer-role'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PARTS: ${{ inputs.parts }}
        run: python scripts/offer_role_measure.py

      # Дилеры разведки брендов → реестр компаний: сведение доменом и ИНН,
      # имя — только кандидат. Замер вхолостую перед тем, как причина роли
      # «официальный дилер» пойдёт в снимок (CLAUDE.md, правило 3).
      - name: Дилеры разведки брендов в реестре компаний
        if: inputs.job == 'dealer-link'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python library/dealer_link.py

      - name: Отвечает ли предложение на нашу заявку
        if: inputs.job == 'match'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/offer_match.py

      - name: Всё об одном артикуле
        if: inputs.job == 'part'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PN: ${{ inputs.part }}
          # Названия компаний и цены построчно — только по явному включению:
          # репозиторий публичный, журнал прогона виден всем (CLAUDE.md, 17).
          ПОДРОБНО: ${{ inputs.part_detail && '1' || '' }}
        run: python scripts/part_lookup.py

      - name: Сводка после
        if: inputs.job == 'reclassify-apply' || inputs.job == 'mark-apply' || inputs.job == 'mark-revert'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/library_stats.py
