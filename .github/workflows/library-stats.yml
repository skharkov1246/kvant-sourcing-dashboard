name: Библиотека — сводка и переклассификация

# Два ручных действия над уже накопленной базой. Битрикс не нужен: оба работают
# только с тем, что уже лежит в Supabase, ничего не скачивают и не пересобирают.
#
#   stats          — сколько чего в базе: строки по таблицам, спрос по сегментам,
#                    состояние вложений, правки инженеров. Ничего не меняет.
#   diag           — из чего состоят позиции без сегмента: есть ли у них
#                    классифицированные соседи и каких слов не хватает словарю.
#                    Ничего не меняет.
#   diag-junk      — то же по СТРОКАМ, помеченным как текст документа: два
#                    частотных списка рядом — самая наглядная проверка разметки.
#   mark           — вхолостую: сколько строк правило сочло текстом тендерного
#                    документа и шесть гейтов приёмки. Ничего не меняет.
#   mark-apply     — запись пометок. Запись отменяется сама, если гейты не сошлись.
#   mark-revert    — снять пометки прогона (вход run_id). Секунды.
#   reclassify     — вхолостую: сколько позиций без сегмента удалось бы разобрать
#                    и каким правилом. Ничего не меняет.
#   reclassify-apply — то же самое с записью сегмента в lib_demand.
#
# В журнал прогона выводятся ТОЛЬКО агрегаты: репозиторий публичный, а в базе
# лежат коммерческие данные заказчиков. Ни наименований позиций, ни номеров
# сделок, ни почт авторов правок в выводе нет — запросы написаны так, что вернуть
# содержимое строки они не могут.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Что делать"
        type: choice
        default: stats
        options: [stats, diag, diag-junk, mark, mark-apply, mark-revert, reclassify, reclassify-apply]
      run_id:
        description: "Ключ прогона разметки — только для mark-revert"
        default: ""
      rule_deal:
        description: "Наследовать сегмент по сделке (слабое правило, для reclassify)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: library-stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимости
        run: pip install --quiet psycopg2-binary==2.9.10

      - name: Проверка секрета
        env:
          S: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL"; exit 1; }
          case "$S" in
            *pooler.supabase.com*) echo "строка подключения через pooler — годится" ;;
            *) echo "::warning::строка не похожа на Session pooler; прямое подключение идёт по IPv6 и с раннера GitHub не соединится" ;;
          esac

      - name: Сводка по базе
        if: inputs.job == 'stats'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/library_stats.py

      - name: Разведка по позициям без сегмента
        if: inputs.job == 'diag'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python library/diag_demand.py

      - name: Разведка по помеченному тексту документов
        if: inputs.job == 'diag-junk'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: junk
        run: python library/diag_demand.py

      - name: Разметка вхолостую — гейты приёмки
        if: inputs.job == 'mark'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python library/mark_prose.py

      - name: Разметка с записью
        if: inputs.job == 'mark-apply'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          APPLY: "1"
        run: python library/mark_prose.py

      - name: Откат разметки
        if: inputs.job == 'mark-revert'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REVERT: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [ -n "${REVERT:-}" ] || { echo "::error::для отката нужен вход run_id"; exit 1; }
          python library/mark_prose.py

      - name: Переклассификация вхолостую
        if: inputs.job == 'reclassify'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RULE_DEAL: ${{ inputs.rule_deal && '1' || '' }}
        run: python library/reclassify.py

      - name: Переклассификация с записью
        if: inputs.job == 'reclassify-apply'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RULE_DEAL: ${{ inputs.rule_deal && '1' || '' }}
          APPLY: "1"
        run: python library/reclassify.py

      - name: Сводка после
        if: inputs.job == 'reclassify-apply' || inputs.job == 'mark-apply' || inputs.job == 'mark-revert'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/library_stats.py
