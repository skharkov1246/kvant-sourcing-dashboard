name: Библиотека — ежедневное пополнение

# ТОЛЬКО НОВОЕ И ИЗМЕНЁННОЕ ЗА СУТКИ. Распоряжение владельца 24.09.2026:
# «каждый новый запрос, новый спрос и предложение — ежедневно». Прогон читает
# сделки и карточки запросов, созданные или изменённые после прошлого УСПЕШНОГО
# прохода (library/increment.py), и отдаёт их новые вложения в разбор, цены и
# распознавание. Нагрузка на портал — десятки запросов на обход плюс по одному
# на новый файл, а не тысячи, как у сплошного обхода (CLAUDE.md, «Битрикс не
# перегружать»).
#
# ОТМЕТКА ДВИГАЕТСЯ ПОСЛЕДНИМ ШАГОМ. Упадёт любой шаг — отметка остаётся
# прежней, и следующий запуск перечитает то же окно; уже разобранные файлы
# отсеются по lib_files, повторной записи не будет.
#
# ПИСЬМА ПОСТАВЩИКОВ (группа mail-supplier, library/mail_source.письма_прохода)
# — после сделок и карточек, со СВОЕЙ отметкой последним шагом: упавший разбор
# писем не держит отметку сделок и карточек, а отметку писем без записи не
# двигает. В общем шаге «начало» письма тоже никого не держат: сбой чтения верха
# писем или неверный вход писем там — предупреждение, и отказывает только шаг
# писем (library/increment.py). Ручная пачка писем (library-mail.yml) идёт от
# старых к новым по своей отметке; ежедневный проход — от своей, первый раз не
# глубже mail_days дней. Письмо, разобранное одним, другой отсеивает по
# lib_files (ключи файлов одни). Читают они одинаково: оба зовут parse-env.
# Режим — вход mail:
#   dry   — холостой замер: разбор, цены и компании контактов считаются и
#           печатаются, в базу не пишется ничего, отметка писем не двигается;
#   apply — запись и отметка;
#   off   — письма не читаются вовсе.
# НОЧЬЮ — off, РУКАМИ — dry по умолчанию. У repository_dispatch входов нет, и
# действует умолчание в env задания (MAIL_DAILY). Ночью dry нельзя: замер
# отметку не пишет, поэтому КАЖДАЯ ночь была бы первым проходом заново — до
# 1 000 писем за 7 дней и закачка всех их вложений, 1 700–2 500 запросов к
# порталу за ночь вместо десятков (CLAUDE.md, «Битрикс не перегружать», п. 7;
# ревизия 27.09.2026). Порядок (правило 3 — сначала мерить): один ручной запуск
# с mail=dry → разбор замера → ручной запуск с mail=apply (первая отметка) →
# правка ночного умолчания 'off' → 'apply' в env задания ниже.
#
# ОТКАТ ПРОХОДА ПИСЕМ — руками, с SUPABASE_DB_URL (library/increment.py):
#   ROLLBACK=<прогон> python library/increment.py откат письма   — счёт;
#   то же с APPLY=1 — снять. Только последний проход (иначе письма его окна не
#   перечитает никто — отказ); упавший — по строке шага, которую разбор пишет
#   до первой записи; снятый по таймауту — ещё с ROLLBACK_TO=<конец задания>.
#
# ПОКА ТОЛЬКО РУЧНОЙ ЗАПУСК. Расписание — решение владельца (CLAUDE.md: правки
# планировщика — с его согласия). Предложение: ежедневно в 02:40 UTC (05:40 МСК),
# после ночного разбора котировок (01:07 UTC) и до утреннего деплоя (06:07 UTC).
#
# В репозиторий и в артефакты не пишется ничего, в журнал — только агрегаты
# (правило 17).
on:
  # Ежедневно в 02:07 UTC — repository_dispatch «library-daily» от Cloudflare-
  # планировщика (scheduler/worker.js; расписание утвердил владелец 24.09.2026).
  # У dispatch нет входов, поэтому распознавание включается и тогда, когда
  # inputs.ocr пуст (см. условия шагов ниже).
  repository_dispatch:
    types: [library-daily]
  workflow_dispatch:
    inputs:
      ocr:
        description: "Распознавать новые сканы (tesseract)"
        type: boolean
        default: true
      mail:
        # Умолчание ручного запуска — замер. Ночное (repository_dispatch) — своё,
        # в env задания: off, пока запись не включена (тест сверяет оба).
        description: "Письма поставщиков: dry — холостой замер, apply — запись и отметка, off — не читать"
        type: choice
        options: ["dry", "apply", "off"]
        default: "dry"
      mail_days:
        description: "Первый проход писем (пока нет отметки): не глубже стольких последних дней"
        default: "7"
      mail_limit:
        description: "Не больше стольких писем за проход (остальное — следующим, от границы)"
        default: "1000"

permissions:
  contents: read

concurrency:
  # Общая очередь чтения портала. Помни: ожидающий в группе ОДИН, новая
  # постановка снимает ожидающую (CLAUDE.md, стиль работы).
  group: bitrix-portal
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Прогон один и читает портал одним процессом за раз: бюджет целиком его,
      # но с запасом — рядом может идти деплой дашборда.
      BITRIX_RPS: "1.0"
      BITRIX_PARALLEL: "1"
      SHARDS: "1"
      SHARD: "0"
      INCREMENT: "1"
      # Письма поставщиков (library/increment.py): режим, окно первого прохода
      # и лимит писем на проход. У repository_dispatch входов нет — действуют
      # умолчания после «||». Окно и лимит — те же, что у входов выше; режим
      # ночью — off (см. шапку: ночной dry повторял бы первый проход каждую
      # ночь). Запись ночью — заменить 'off' на 'apply' после первой отметки.
      MAIL_DAILY: ${{ inputs.mail || 'off' }}
      MAIL_FIRST_DAYS: ${{ inputs.mail_days || '7' }}
      MAIL_DAILY_LIMIT: ${{ inputs.mail_limit || '1000' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ПАКЕТЫ И ФЛАГИ РАЗБОРА — ТЕ ЖЕ, ЧТО У РУЧНОГО ПЕРЕРАЗБОРА И НОЧНОГО
      # РАЗБОРА КОТИРОВОК (одна точка: .github/actions/parse-env), плюс
      # распознавание. Распоряжение владельца 26.09.2026: считать так же, как
      # руками, — с ослабленной шапкой и каскадом (прежде их здесь не было).
      #
      # ОЦЕНКА ВРЕМЕНИ И НАГРУЗКИ (журналы 25–26.09.2026, агрегаты): было 13–46
      # мин (46 — первый проход с окном в три дня, 1 153 файла сделок); запросов
      # за проход 500–1 700 при 1/с. Стало: + LibreOffice ≈ 1 мин; каскад зовёт
      # его лишь на офисных файлах, которые не прочитал свой читатель (≈ 1 с на
      # файл). Повтор «не скачался» берёт только файлы из окна изменённых сделок
      # и карточек — единицы за сутки, предел 150 на шаг: не больше 150 × 3
      # попытки = 450 запросов (≈ 7,5 мин при 1/с). Худший случай ≈ 60 мин при
      # timeout-minutes 180.
      - name: Окружение разбора (пакеты, распознавание и флаги)
        uses: ./.github/actions/parse-env
        with:
          ocr: "true"

      - name: Проверка секретов
        env:
          B: ${{ secrets.BITRIX_WEBHOOK_URL }}
          S: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${B:-}" ] || { echo "::error::нет секрета BITRIX_WEBHOOK_URL"; exit 1; }
          [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL"; exit 1; }
          echo "секреты на месте"

      - name: Начало прохода — время и наибольшие номера
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python library/increment.py начало
          python library/increment.py окно

      - name: Разбор — новые вложения сделок (спрос)
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: deals
          WORKERS: "4"
        run: python library/indexer.py

      - name: Разбор — новые КП в карточках запросов (предложение и цены)
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: rfq
          WORKERS: "4"
        run: python library/indexer.py

      - name: Распознавание новых сканов — сделки
        if: github.event_name == 'repository_dispatch' || inputs.ocr
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: deals
          APPLY: "1"
        run: python library/ocr.py

      - name: Распознавание новых сканов — карточки запросов
        if: github.event_name == 'repository_dispatch' || inputs.ocr
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: rfq
          APPLY: "1"
        run: python library/ocr.py

      # Только если все шаги выше прошли (без if: always): упавший проход
      # отметку не двигает.
      - name: Отметка успешного прохода — сделки и карточки
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python library/increment.py отметка

      # ПИСЬМА ПОСТАВЩИКОВ — ПОСЛЕ ОТМЕТКИ СДЕЛОК И КАРТОЧЕК: их падение (портал,
      # отказ Диска) не держит чужую отметку, а свою не двигает.
      #
      # НАГРУЗКА (CLAUDE.md, «Битрикс не перегружать», п. 5). Запросов за проход:
      #   1 (наибольший номер, шаг «начало») + ⌈писем/50⌉ (список по ключу, тела
      #   приходят в нём же — за тело портал не платит) + 1 (страница перекрытия)
      #   + ⌈контактов/50⌉…×2 (компания контакта) + 2 на НОВОЕ вложение
      #   (disk.file.get и закачка; разобранное прежде отсеивается по lib_files
      #   ДО Диска и не стоит ничего).
      # Итого ≈ 2 × новых вложений + писем/50 + контактов/50 + 2. Входящих писем
      # компаний и контактов в CRM 58 284 за всю историю (замер 24.09.2026),
      # вложения — у половины–двух третей писем. При 100 письмах в сутки и ~1,2
      # вложения на письмо — около 250 запросов, ~4 мин при 1/с. Первый проход
      # (7 дней, ~700 писем) — около 1 700 запросов, ~30 мин. Потолок —
      # mail_limit (1 000 писем): около 2 500 запросов, ~42 мин; вместе с худшим
      # проходом сделок и карточек (≈ 60 мин) — в timeout-minutes 180 и до
      # деплоя 06:07 UTC. Настоящее число писем в сутки печатает первый замер.
      #
      # Цены из КП во вложениях (MAIL_PRICES) и поставщик письма контакта
      # (MAIL_CONTACT_COMPANY) — как у ручной пачки с prices и contact_company;
      # тела писем (MAIL_BODIES) — как у неё же по умолчанию.
      - name: Разбор — письма поставщиков (предложения и цены)
        if: env.MAIL_DAILY != 'off'
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          # Вложения писем лежат на Дисках владельцев ящиков — основной вебхук
          # получает ACCESS_DENIED (зонд 25.09.2026), нужен вебхук файлов.
          BITRIX_FILES_WEBHOOK_URL: ${{ secrets.BITRIX_FILES_WEBHOOK_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: mail
          MAIL_GROUP: mail-supplier
          MAIL_FILES: "1"
          MAIL_BODIES: "1"
          MAIL_PRICES: "1"
          MAIL_CONTACT_COMPANY: "1"
          WORKERS: "4"
        run: |
          set -euo pipefail
          if [ -z "${BITRIX_FILES_WEBHOOK_URL:-}" ]; then
            echo "::warning::нет секрета BITRIX_FILES_WEBHOOK_URL — вложения писем пойдут основным вебхуком (на Дисках ящиков это ACCESS_DENIED)"
          fi
          # Запись — только в режиме apply; иначе холостой замер, и разбор сам
          # говорит об этом в журнале (граница прохода не отдаётся).
          if [ "$MAIL_DAILY" = "apply" ]; then
            export APPLY=1
          else
            export APPLY=""
            echo "письма поставщиков: режим $MAIL_DAILY — холостой замер, в базу не пишется ничего"
          fi
          python library/indexer.py

      # Своя отметка писем — последним шагом и без if: пишется, только если
      # разбор писем прошёл С ЗАПИСЬЮ и отдал границу (INCREMENT_MAIL_TO);
      # при замере и выключенных письмах шаг говорит, что отметка стоит.
      - name: Отметка успешного прохода — письма поставщиков
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python library/increment.py отметка письма

  # СНИМОК СДЕЛОК, ЗАПРОСОВ И ЗАКАЗОВ ПОСТАВЩИКАМ (deals:v1) — для конструктора
  # отчётов /reports (распоряжение владельца 02.10.2026). Отдельным заданием
  # после пополнения: его сбой не трогает отметки пополнения, а падение
  # пополнения не оставляет отчёты без свежего снимка (if: always()). Очередь
  # чтения портала та же — задание идёт внутри этого же прогона.
  #
  # Режим — DEALS_NIGHTLY: dry — холостой замер (снимок собирается, в KV не
  # пишется), apply — запись, off — не собирать. Замер снят 02.10.2026
  # (deals-publish.yml, прогон 37001049083): карточек 18 403 из 18 403, заказов
  # 1 238 из 1 238, 686 запросов к порталу без отказов, снимок 4,3 МиБ из 8.
  # Ночная запись включена с разрешения владельца 02.10.2026.
  deals:
    needs: daily
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BITRIX_RPS: "1.0"
      BITRIX_PARALLEL: "1"
      DEALS_NIGHTLY: apply
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install --quiet requests python-dotenv pytest pyyaml
      - name: Проверки сборки снимка
        run: python -m pytest tests/test_publish_deals.py -q
      - name: Снимок сделок, запросов и заказов поставщикам
        if: env.DEALS_NIGHTLY != 'off'
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DEALS_NIGHTLY" = "apply" ]; then args+=(--apply); fi
          python scripts/publish_deals.py "${args[@]}"
