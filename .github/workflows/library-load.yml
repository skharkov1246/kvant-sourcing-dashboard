name: Библиотека — загрузка справочников

# Переносит в Supabase то, что уже собрано в файлах репозитория: исполнителей,
# каталог запчастей, машины и узлы. Разбор вложений Битрикса здесь ни при чём —
# это другой поток данных (library-index.yml), и запускать их порознь правильно:
# у загрузки справочников нет ни сети наружу, ни многочасового прогона.
#
# Только ручной запуск. БЕЗ входа «apply» каждый загрузчик идёт вхолостую:
# считает и печатает агрегаты, в базу не пишет. Так и задумано — сначала
# смотрим, что получится, потом пишем.
#
# В журнал прогона идут только агрегаты: ни имён компаний, ни контактов, ни
# наименований позиций. Репозиторий публичный, журналы прогонов тоже.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "Что загружать"
        type: choice
        default: "все"
        options: ["все", "исполнители", "запчасти", "машины и узлы", "ремонт и дефекты",
                  "взаимозаменяемость", "связать статьи", "таможня", "расход ГПУ",
                  "деньги на кону"]
      apply:
        description: "Писать в базу (без галочки — холостой прогон)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: library-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install --quiet psycopg2-binary requests

      - name: Проверка секрета
        env:
          S: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL"; exit 1; }
          case "$S" in
            *pooler.supabase.com*) echo "строка подключения через pooler — годится" ;;
            *) echo "::warning::строка не похожа на Session pooler; прямое подключение идёт по IPv6 и с раннера GitHub не соединится" ;;
          esac

      # ПОРЯДОК ВАЖЕН. Исполнители идут первыми: ребро «запчасть → исполнитель»
      # ищет компанию по нормализованному ключу, и без загруженных компаний все
      # рёбра молча потеряются. Машины и узлы — перед ремонтом: операции и
      # дефекты ссылаются на узел, которого до того в базе нет.
      - name: Загрузка
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          APPLY: ${{ inputs.apply && '1' || '' }}
          W: ${{ inputs.what }}
        run: |
          set -uo pipefail
          # Ни один загрузчик не отменяет остальные: отказ запоминается, job
          # падает в конце. Иначе сбой первого тихо оставил бы базу наполовину
          # загруженной (так уже было с миграциями, zip-db.yml).
          rc=0
          run () {   # run <файл> <что это>
            echo "::group::$2"
            if python "$1"; then echo "— $2: готово"; else echo "::error::$2 — отказ"; rc=1; fi
            echo "::endgroup::"
          }
          [ "$W" = "все" ] || [ "$W" = "исполнители" ]   && run library/load_suppliers.py "исполнители"
          [ "$W" = "все" ] || [ "$W" = "запчасти" ]      && run library/load_parts.py     "каталог запчастей"
          [ "$W" = "все" ] || [ "$W" = "машины и узлы" ] && run library/load_equipment.py "машины, узлы и связки"
          [ "$W" = "все" ] || [ "$W" = "ремонт и дефекты" ] && run library/load_repair.py "операции и дефекты"
          [ "$W" = "все" ] || [ "$W" = "взаимозаменяемость" ] && run library/load_crossrefs.py "взаимозаменяемость, ведомости, шифровки"
          # Таможня идёт после машин и узлов: у декларации есть узел, выведенный
          # из описания товара, и ссылка ставится только на существующий узел.
          # После исполнителей — ребро «деталь → экспортёр» ищет компанию по
          # нормализованному ключу, как и остальные рёбра.
          [ "$W" = "все" ] || [ "$W" = "таможня" ] && run library/load_customs.py "таможенные декларации"
          # Расход — после машин и узлов: строка расхода ссылается и на машину,
          # и на узел, и ставится только существующая ссылка.
          [ "$W" = "все" ] || [ "$W" = "расход ГПУ" ] && run library/load_consumption.py "расход и стоимость обслуживания"
          # Деньги на кону — после каталога: очередь работ ссылается на деталь,
          # и без каталога 751 строка из 754 осталась бы без связи.
          [ "$W" = "все" ] || [ "$W" = "деньги на кону" ] && run library/load_exposure.py "очередь работ по деньгам"
          # Статьи связываются последними: связь ставится на узел и машину,
          # которых до загрузки справочников в базе нет.
          [ "$W" = "все" ] || [ "$W" = "связать статьи" ] && run library/link_knowledge.py "связь статей с узлом и машиной"
          [ "$rc" = 0 ] && echo "✓ загрузка завершена" || echo "✗ часть загрузчиков не отработала"
          exit "$rc"
