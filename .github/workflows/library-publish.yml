name: Библиотека — публикация проверенных материалов

# Private content travels from Supabase/owner drafts directly to the existing
# private KV. Never place it in checkout files, logs, or Actions artifacts.
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [library-update]
  push:
    branches: [main]
    paths:
      - scripts/publish_library.py
      - scripts/publish_library_v2.py
      - public/library_v2.js
      - .github/workflows/library-publish.yml

permissions:
  contents: read

concurrency:
  group: library-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Установка зависимости
        run: python -m pip install --quiet --disable-pip-version-check psycopg2-binary==2.9.10
      - name: Проверка очереди и публикация библиотеки
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/publish_library_v2.py
