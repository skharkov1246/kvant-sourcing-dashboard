name: Библиотека — публикация проверенных материалов

# Private content travels from Supabase/owner drafts directly to the existing
# private KV. Never place it in checkout files, logs, or Actions artifacts.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Проверить текущую публикацию или опубликовать материалы"
        required: true
        type: choice
        default: audit
        options:
          - audit
          - publish
  repository_dispatch:
    types: [library-update]
  push:
    branches: [main]
    paths:
      - scripts/publish_library.py
      - scripts/publish_library_v2.py
      - public/library_v2.js
      - .github/workflows/library-publish.yml

permissions:
  contents: read

concurrency:
  group: library-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Установка зависимости
        run: python -m pip install --quiet --disable-pip-version-check psycopg2-binary==2.9.10
      - name: Проверка очереди и публикация библиотеки
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONDONTWRITEBYTECODE: "1"
          # Read only the exact immutable blob from the last failed release.
          LIBRARY_AUDIT_BLOB_SHA256: "88e797a19cdf780a3369c8fd2833111667117464fcbcce4f3e9e63de704a3a29"
          LIBRARY_AUDIT_BLOB_BYTES: "442083"
          LIBRARY_PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
        run: python scripts/publish_library_v2.py
