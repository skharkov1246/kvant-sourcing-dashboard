name: GT bitrix refresh

# Дважды в неделю обновляет метки «был ли запрос в компанию из нашего Bitrix»
# на ГТУ-библиотеке (gt/): тянет свежие СП-166 «Запросы поставщикам» → bitrix_gt.json,
# пересобирает страницы gt/public/ и коммитит. Пуш в main сам триггерит zip-deploy
# (paths gt/**) → сайт обновится. Задача владельца от 17.08.2026.
# Лёгкий: один прогон ~2-3 мин + деплой; 2 раза в неделю — не жжёт лимит Actions.
on:
  repository_dispatch:
    types: [gt-bitrix]        # точный запуск: планировщик, пн и чт 03:00 UTC (раскладка 24.09.2026)
  schedule:
    - cron: "17 3 * * 1,4"    # резерв: пн и чт 03:17 UTC; GitHub-крон может опаздывать
  workflow_dispatch: {}

permissions:
  contents: write             # коммитим обновлённый снапшот и пересобранные страницы
  actions: read               # страж резервного крона читает историю своего прогона

concurrency:
  group: gt-bitrix-refresh
  cancel-in-progress: false

jobs:
  # РЕЗЕРВНЫЙ КРОН НЕ ДУБЛИРУЕТ ПЛАНИРОВЩИК. Если сегодня уже прошёл запуск от
  # планировщика (repository_dispatch), резерв выходит сразу: второй полный проход
  # по порталу за сутки — это лишняя нагрузка на Битрикс (CLAUDE.md, «Битрикс не
  # перегружать»). Смотрим только историю своего прогона, без обращения к порталу.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gt-bitrix.yml/runs?event=repository_dispatch&status=success&created=%3E%3D$since&per_page=1" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_count', 0))")
            [ "${n:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "резервный запуск пропускается: $skip (событие $EVENT)"

  refresh:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: Свежие запросы из Bitrix → gt/data/bitrix_gt.json
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python gt/tools/bitrix_gt.py
      - name: Пересборка страниц gt/
        run: |
          set -euo pipefail
          python gt/build.py
          python gt/tools/build_rfq.py
          python gt/tools/build_lot.py
      # Сам bitrix_gt.json из индекса исключён как волатильный (см. bot_files()
      # в scripts/build_index.py), но бот переписывает и страницы gt/public,
      # поэтому каталог с индексом пересобираем — чтобы производные файлы
      # не разъезжались с данными.
      - name: Пересборка каталога и поискового индекса
        run: |
          set -euo pipefail
          python scripts/build_catalog.py
          python scripts/build_index.py
      - name: Коммит, если есть изменения
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gt/data/bitrix_gt.json gt/public/ data/catalog.json data/index.json
          if git diff --cached --quiet; then
            echo "запросы Bitrix без изменений — деплой не нужен"
          else
            git commit -m "chore: обновление Bitrix-меток ГТУ-библиотеки ($(date -u +%F))"
            git push
          fi
