name: Daily chat snapshot

# Суточный скан чатов сделок (тяжёлый: сотни запросов) — РАЗ В СУТКИ, не при каждой пересборке.
# Снимок в двух частях (19.10.2026, chat_scan.py): data/chat_snapshot.json — только числа
# по сотрудникам (среднее за неделю собирает дашборд); «ждут ответа» с названиями сделок
# и оценки сотрудников — в KV Cloudflare, ключ chat:v1. Сначала пишется и сверяется KV,
# потом файл; не записался KV — файл не трогается. В журнал — только числа (правило 17).
# Надёжный триггер — repository_dispatch {"event_type":"scan"} от Cloudflare-планировщика в 00:00 МСК;
# cron — резерв. AI-оценку (вовлечённость/проф.) НЕ трогает (её ставит Opus отдельно).
on:
  repository_dispatch:
    types: [scan]
  schedule:
    - cron: "0 21 * * *"      # 00:00 МСК (резерв; GitHub-крон может опаздывать)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Вхолостую: скан и счётчики, без записи в KV и без коммита"
        type: boolean
        default: false

permissions:
  contents: write             # коммитим обновлённый снимок

concurrency:
  group: chat-scan
  cancel-in-progress: false

jobs:
  # Резерв дублировал планировщик один в один: за 49 суток 50 прогонов по dispatch
  # и ровно 50 по расписанию — каждый скан выполнялся дважды в сутки вместо одного.
  # Тот же приём, что в deploy.yml: крон-прогон пропускается, если успешный скан
  # был меньше FRESH_H часов назад. Планировщик умолкнет — резерв сработает.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.build }}
    steps:
      - name: Нужен ли скан
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FRESH_H: "20"
        run: |
          set -uo pipefail
          go() { echo "build=true" >> "$GITHUB_OUTPUT"; echo "→ сканируем: $1"; exit 0; }
          [ "$EVENT" = "schedule" ] || go "триггер $EVENT, не резервный крон"
          body=$(curl -sS --max-time 30 \
                   -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$REPO/actions/workflows/scan.yml/runs?status=success&per_page=20") \
            || go "API недоступен (fail-open)"
          last=$(printf '%s' "$body" | jq -r --arg id "$RUN_ID" \
                   '[.workflow_runs[]? | select((.id|tostring) != $id) | .updated_at] | max // empty') \
            || go "не разобрал ответ API (fail-open)"
          [ -n "$last" ] || go "успешных сканов в истории нет"
          last_s=$(date -u -d "$last" +%s 2>/dev/null) || go "не разобрал дату (fail-open)"
          [ -n "$last_s" ] || go "не разобрал дату (fail-open)"
          age=$(( ( $(date -u +%s) - last_s ) / 60 ))
          echo "последний успешный скан: $last (${age} мин назад), порог ${FRESH_H} ч"
          [ "$age" -lt $(( FRESH_H * 60 )) ] || go "снимок старше порога"
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "→ пропуск: снимок собран ${age} мин назад, резерв не нужен"

  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: Скан чатов сделок → снимок
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY:-false}" = "true" ]; then args+=(--dry-run); fi
          python chat_scan.py "${args[@]}"
      - name: Коммит снимка
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chat_snapshot.json
          if git diff --cached --quiet; then
            echo "снимок без изменений"
            exit 0
          fi
          git commit -m "chore: суточный снимок чатов сделок ($(date -u +%F))"
          # Перенос закрытых полей в KV меняет форму снимка (ключи верхнего уровня,
          # главная коллекция, чувствительность), и build_catalog --check краснел бы
          # в гейте каждого PR. Каталог — вторым коммитом (CLAUDE.md, правило 6);
          # при обычном суточном снимке форма та же и шаг ничего не делает.
          if ! python scripts/build_catalog.py --check; then
            python scripts/build_catalog.py
            # Блок каталога в docs/kb/INDEX.md собирается из data/catalog.json: без
            # пересборки гейт «База знаний» краснеет на main и в каждом PR (20.10.2026).
            python scripts/kb_check.py --fix || echo "::warning::база знаний: замечания помимо блока каталога"
            git add data/catalog.json docs/kb/INDEX.md
            git diff --cached --quiet || git commit -m "chore: каталог данных после снимка чатов ($(date -u +%F))"
          fi
          git push
