name: Bitrix probe (диагностика данных)

# Разовый диагностический зонд: ТОЛЬКО ручной запуск (workflow_dispatch).
# Читает Bitrix (и при наличии — Яндекс.Диск) через секреты CI, печатает диагностику в лог —
# сами секреты не выводятся. Ничего не деплоит, минут ест ~1-3. Скрипт: scripts/bitrix_probe.py
# или другой зонд из закрытого списка входа `script` (свои проверки у каждого зонда — в своём
# файле: bitrix_probe.py покрыт тестами ролей, и разовый вопрос его не переписывает).
# Запуск на ветке: gh workflow run probe.yml --ref <ветка> — выполнит версию скрипта с той ветки.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Какой зонд запустить"
        type: choice
        default: bitrix_probe.py
        options: [bitrix_probe.py, probe_mail_files.py, probe_conversion.py, probe_presale.py, probe_2526.py, probe_fields.py, probe_pace.py, probe_won.py, probe_kp_rules.py, probe_realization.py, probe_contracts.py, probe_category.py, probe_money.py, probe_econ_files.py, probe_contract_gaps.py, probe_real_segments.py, probe_money_sources.py, probe_regulation.py, probe_deal_rfq.py, probe_presale_reg.py]
      limit:
        description: "Размер выборки (только для зондов, которые его читают; пусто — по умолчанию)"
        required: false
        default: ""
      parts:
        # Распоряжение 22.09.2026 о дроблении: шаги по сделкам зонда идут столькими
        # смежными частями по номеру (читают probe_money_sources.py и probe_regulation.py).
        description: "Число частей обхода по сделкам (PROBE_PARTS)"
        type: choice
        default: "10"
        options: ["10", "25", "50"]
      query:
        description: "Только для probe_deal_rfq.py: sha256 токенов названия сделки через запятую (hex), никогда не сам текст — журнал публичный"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Общая очередь чтения портала (CLAUDE.md, «Битрикс не перегружать»): зонд
  # читает Битрикс так же, как остальные прогоны, и стоит с ними в одной группе.
  group: bitrix-portal
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - name: Зонд
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          BITRIX_FILES_WEBHOOK_URL: ${{ secrets.BITRIX_FILES_WEBHOOK_URL }}
          PROBE_SCRIPT: ${{ inputs.script || 'bitrix_probe.py' }}
          # размер выборки для зондов, которые его читают (probe_contract_gaps.py); пусто — свой по умолчанию
          PROBE_LIMIT: ${{ inputs.limit || '' }}
          PROBE_PARTS: ${{ inputs.parts || '10' }}
          # probe_deal_rfq.py (v61): вход query (хеши токенов названия одной сделки) читается из файла
          # события ($GITHUB_EVENT_PATH), а не из env — env шага печатается в публичном журнале;
          # ≈ 60–150 запросов (запасной шаг — до ≈ 200 сверх, если помещается), предел 300
          # Один процесс в общей очереди, с запасом: рядом может идти пересборка
          # дашборда (её группа своя). probe_conversion.py, probe_2526.py и probe_pace.py — ~20–45 мин при 1/с (≈950–1300 запросов);
          # ставить вне 01:00–05:30 UTC и не на :07, проверив, что очередь пуста.
          # probe_money_sources.py (v59) — ≈ 350–450 запросов, предел 550 (~8–10 мин):
          # окна 07:20–11:00 и 13:20–17:00 UTC, без идущего деплоя (критика v59, G39).
          # Если cbr.ru не отвечает раннеру, курсы ЦБ берутся с зеркала cbr-xml-daily.ru
          # запросом на нужную дату (до 900 запросов, ~4–6 мин; это не Битрикс).
          # probe_regulation.py (v60, регламент ОРК) — ≈ 830 запросов, предел 1 100 (~15 мин):
          # окна 07:20–11:00 и 13:20–17:00 UTC, не на деплой в :07 и не на скан чатов в 21:00.
          # probe_presale_reg.py (v62, пресейл по регламенту сорсера v1.4) — ≈ 430 запросов при 10 частях
          # (≈ 250 сделок пресейла; 50 частей ≈ 620), ориентир 600, предел 1 000 (~8–12 мин); окна те же.
          BITRIX_RPS: "1.0"
          BITRIX_PARALLEL: "1"
          BITRIX_WAIT_BUDGET: "900"
        run: python "scripts/$PROBE_SCRIPT"
