name: Bitrix probe (диагностика данных)

# Разовый диагностический зонд: ТОЛЬКО ручной запуск (workflow_dispatch).
# Читает Bitrix (и при наличии — Яндекс.Диск) через секреты CI, печатает диагностику в лог —
# сами секреты не выводятся. Ничего не деплоит, минут ест ~1-3. Скрипт: scripts/bitrix_probe.py
# или другой зонд из закрытого списка входа `script` (свои проверки у каждого зонда — в своём
# файле: bitrix_probe.py покрыт тестами ролей, и разовый вопрос его не переписывает).
# Запуск на ветке: gh workflow run probe.yml --ref <ветка> — выполнит версию скрипта с той ветки.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Какой зонд запустить"
        type: choice
        default: bitrix_probe.py
        options: [bitrix_probe.py, probe_mail_files.py]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - name: Зонд
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          BITRIX_FILES_WEBHOOK_URL: ${{ secrets.BITRIX_FILES_WEBHOOK_URL }}
          PROBE_SCRIPT: ${{ inputs.script || 'bitrix_probe.py' }}
        run: python "scripts/$PROBE_SCRIPT"
