name: Счётчики — точки замеров в KV

# Кладёт точки числовых замеров в KV Cloudflare (ключ counters:v1), откуда их
# читает страница /counters на портале.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ПРОГОН, ЕСЛИ ЭТО ДЕЛАЕТ НОЧНОЙ РАЗБОР. Ночной разбор меряет и
# публикует по расписанию — этого достаточно для обычной жизни. Но замер можно
# сделать руками в любой момент («Библиотека — сводка и переклассификация» →
# codes), и тогда точка лежит в базе, а страница показывает вчерашнее до
# следующей ночи. Этот прогон — способ донести её сразу.
#
# Расписания здесь НЕТ намеренно: оно в ночном разборе, где публикация идёт после
# замера. Второе расписание означало бы два писателя одного ключа по часам —
# ровно то, от чего предостерегает пояснение в scripts/publish_counters.py.
#
# Битрикс не читается, поэтому общей очереди чтения портала здесь не нужно. Своя
# группа нужна другому: два одновременных прогона писали бы один ключ.
#
# ПО УМОЛЧАНИЮ ВХОЛОСТУЮ: читает базу, собирает снимок, печатает счётчики и
# размер — и в KV ничего не пишет. Запись включается галкой.
#
# В журнал идут ТОЛЬКО агрегаты: репозиторий публичный (CLAUDE.md, правило 17).
# В таблице замеров по построению лежат одни числа, их и печатаем.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Записать снимок в KV (иначе вхолостую)"
        type: boolean
        default: false
      measure:
        description: "Сначала перемерить коды и цены (добавит точку истории)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: counters-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install --quiet psycopg2-binary==2.9.10 pytest

      - name: Проверка секретов
        env:
          S: ${{ secrets.SUPABASE_DB_URL }}
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL"; exit 1; }
          if [ "$APPLY" = "true" ]; then
            [ -n "${T:-}" ] || { echo "::error::запись запрошена, но нет CLOUDFLARE_API_TOKEN"; exit 1; }
            [ -n "${A:-}" ] || { echo "::error::запись запрошена, но нет CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          else
            echo "холостой прогон: ключи Cloudflare не нужны"
          fi

      - name: Проверки сборки снимка
        run: python -m pytest tests/test_publish_counters.py -q

      # ЗАМЕР ПЕРЕД ПУБЛИКАЦИЕЙ — ПО ЖЕЛАНИЮ. Обычно точка уже в базе, и мерить
      # заново значит тратить минуту на то же число. Галка нужна, когда точку
      # хочется получить и донести одним действием.
      - name: Перемерить коды и цены
        if: inputs.measure
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WRITE: "1"
          RUN_KEY: ${{ github.run_id }}
        run: python scripts/codes_with_prices.py

      - name: Снимок точек
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          # Не «[ ... ] && args=...»: при APPLY=false тест вернёт ненулевой код,
          # он станет кодом последней команды, и set -e уронит шаг до запуска.
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          set +e
          python scripts/publish_counters.py "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" = 2 ]; then
            echo "::error::снимок точек не помещается в предел. Для истории замеров"
            echo "это означает ошибку публикатора, а не рост: сотни точек по десятку"
            echo "чисел — это десятки килобайт. Смотреть, что попало в nums."
            exit 1
          fi
          exit "$rc"
