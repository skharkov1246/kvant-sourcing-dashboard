name: Поставщики — замер сведения

# Один ручной замер перед сведением шести реестров поставщиков. Ничего не меняет:
# только читает и печатает числа.
#
# Читает ПОРТАЛ напрямую, а не выгрузку в Supabase. Первая версия читала kb_rfq,
# и прогон 20.09.2026 упал: «таблицы kb_rfq в базе нет». base/RUNBOOK.md описывает
# заливку базы знаний в PostgreSQL как порядок действий, а не как факт, — я принял
# намерение за состояние. Портал же содержит первоисточник.
#
# Зачем. Поставщики агрегируются по ТЕКСТУ названия, хотя идентификатор компании
# портала лежит в той же таблице. Перевод ключа зависит целиком от данных, а
# правило 3 CLAUDE.md запрещает применять правило до замера. Здесь считаются
# четыре числа, без которых перевод делать нельзя: карточки без идентификатора,
# написаний на компанию, компаний на написание, и переживут ли перевод джойны
# base/quote.py.
#
# В журнал выводятся ТОЛЬКО агрегаты: репозиторий публичный. Ни одного названия
# компании, ни одной почты, ни одного номера сделки — запросы написаны так, что
# вернуть содержимое строки они не могут (CLAUDE.md, правило 17).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supplier-merge-stats
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install --quiet requests

      - name: Проверка секрета
        env:
          S: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -n "${S:-}" ] || { echo "::error::нет секрета BITRIX_WEBHOOK_URL"; exit 1; }
          echo "секрет портала на месте"

      - name: Замер сведения поставщиков
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python scripts/supplier_merge_stats.py

      # Распоряжение владельца 20.09.2026: компании проверять по ИНН или
      # налоговому номеру, чего нет в Bitrix — завести. Сначала надо знать,
      # скольких не хватает. Реквизиты (crm.requisite.list) в репозитории не
      # читались ни разу, поэтому ни один прежний замер ИНН не видел.
      #
      # В журнал идут только счётчики: ИНН контрагентов — чувствительные данные
      # (их помечает scripts/build_catalog.py), репозиторий публичный.
      - name: Заполненность ИНН и налоговых номеров
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python scripts/supplier_inn_coverage.py

      # ОТЗЫВЧИВОСТЬ ПОСТАВЩИКА. Отклик на запрос 20 % (176 КП из 862) — цифра
      # общая, и по ней нельзя сделать ничего. Этот замер раскладывает её по
      # компаниям и отвечает на главный вопрос: на скольких поставщиках она
      # вообще осмысленна. Медиана запросов на компанию — один, а доля «0 %
      # ответов» по одному запросу и по сорока — разные утверждения.
      #
      # Хранение метрики строится ПОСЛЕ этого замера, а не до (правило 3).
      - name: Отзывчивость поставщиков
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python scripts/supplier_responsiveness.py

      # КОТИРОВКА КАК ДОКУМЕНТ — замер под этап 3. Прежде чем строить хранение
      # котировки (валюта, базис цены, единица, наличие тремя осями), надо знать,
      # из чего его наполнять: сколько карточек несут сумму, в каких валютах и у
      # скольких приложено КП именно ОТ ПОСТАВЩИКА, а не наш собственный запрос.
      - name: Что известно о цене в карточках
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python scripts/quote_coverage.py

      # СКОЛЬКО КОТИРОВОК УЖЕ РАЗОБРАНО. Читает базу, а не портал: lib_files
      # хранит и поле, из которого взят файл, и статус разбора, и число
      # найденных позиций. Лишний проход по порталу тут не нужен.
      #
      # Шаг не обязателен: без секрета базы он честно говорит об этом и не
      # роняет прогон — остальные замеры портальные и от базы не зависят.
      - name: Сколько котировок уже разобрано
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          pip install --quiet psycopg2-binary==2.9.10
          python scripts/quote_parse_coverage.py
