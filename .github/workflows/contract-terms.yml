name: Договоры — чтение условий (пилот)

# Чтение договоров (решение владельца 19.10.2026): последние сделки реализации (по
# умолчанию 30), бюджет модели на прогон (по умолчанию 10 USD). Скрипт —
# scripts/contract_terms.py, навык contract-review.
#
# РАСПИСАНИЕ (решение владельца 23.10.2026): раз в неделю, в воскресенье 05:07 UTC
# (08:07 МСК) — repository_dispatch «contract-terms» от Cloudflare-планировщика
# (scheduler/worker.js). У dispatch нет входов: live, все открытые сделки реализации
# (до 400), бюджет 10 USD, срок чтения 150 минут. Прочитанный раньше файл (тот же
# sha256) модели второй раз не отдаётся — платятся только новые и изменённые; что не
# уложилось в бюджет или срок, дочитает следующая неделя. После записи свод по
# сделкам уходит в закрытый ключ KV realctx:v1 — его показывает вкладка «Реализация».
#
# ДОКУМЕНТЫ СДЕЛКИ (зонд v57, 25.10.2026): карточки договоров СП-1174, СП-1192 и прежних
# СП-132, СП-175 со связью со сделкой или только с её живым заказом; рамочные над её
# спецификациями; Purchase order живого заказа без документа поставщика.
#
# РАЗОВОЕ ДОЧИТЫВАНИЕ (решение владельца 25.10.2026: до $70 один раз, дальше $10 в
# неделю) — ручной запуск: mode live, open, deals 400, budget_usd 70, deadline_min 150.
# Читает от новых сделок к старым, внутри сделки — спецификации, Purchase order,
# рамочные; что не уложилось, дочитают недельные прогоны (прочитанное — даром по sha256).
#
#   mode dry  (по умолчанию) — отбор сделок и документов, счёт карточек, файлов по
#             источникам и сторон, оценка страниц и денег. Модель не
#             зовётся, файлы не качаются, база не трогается; секреты модели и базы
#             в шаг не передаются вовсе.
#   mode live — закачка файлов → модель извлекает условия с цитатой и страницей →
#             строки в закрытую базу (contract_terms, contract_b2b_flags; схема —
#             library/supabase/contract_terms_schema.sql, live применяет её сам
#             после проверок на чистой базе).
#
# Порядок: сначала dry, по его оценке — live. Журнал публичный: в нём только
# агрегаты (CLAUDE.md, правило 17) — ни номеров сделок, ни названий, ни цитат, ни
# условий. Ни артефактов, ни кэша: файлы договоров и ответы модели не покидают
# раннер, кроме строк в закрытой базе.
on:
  repository_dispatch:
    types: [contract-terms]
  workflow_dispatch:
    inputs:
      deals:
        description: "Сколько последних не проигранных сделок реализации читать (1–400)"
        default: "30"
      budget_usd:
        description: "Бюджет модели на прогон, USD: потолок цены следующего файла не помещается — чтение останавливается"
        default: "10"
      mode:
        description: "dry — счёт и оценка; live — закачка, модель, запись в базу"
        type: choice
        default: dry
        options: [dry, live]
      open:
        description: "Только открытые сделки реализации (как недельный прогон)"
        type: boolean
        default: false
      deadline_min:
        description: "Срок чтения, минут (1–150): после него файлы не начинаются, прогон дописывает флаги и итог; job ограничен 180 минутами"
        default: "40"

permissions:
  contents: read

concurrency:
  # Общая очередь чтения портала (CLAUDE.md, «Битрикс не перегружать»): прогон
  # читает Битрикс и качает файлы — стоит в одной группе с зондами и разбором.
  group: bitrix-portal
  cancel-in-progress: false

jobs:
  terms:
    runs-on: ubuntu-latest
    # недельный прогон читает до 150 минут (срок чтения), ручной — deadline_min (до 150)
    timeout-minutes: 180
    env:
      # недельный запуск (dispatch) входов не несёт — его значения здесь
      MODE: ${{ github.event_name == 'repository_dispatch' && 'live' || inputs.mode }}
      DEALS: ${{ github.event_name == 'repository_dispatch' && '400' || inputs.deals }}
      BUDGET_USD: ${{ github.event_name == 'repository_dispatch' && '10' || inputs.budget_usd }}
      OPEN: ${{ (github.event_name == 'repository_dispatch' || inputs.open) && '--open' || '' }}
      DEADLINE_MIN: ${{ github.event_name == 'repository_dispatch' && '150' || inputs.deadline_min || '40' }}
    steps:
      # Входы ручного запуска — до установки и до первого запроса к порталу. Срок считается
      # от начала чтения, не job: до него установка, проверки и чистая база (5–6 минут),
      # после последней проверки срока — один файл (ожидание лимита портала до 15 минут,
      # закачка, вызов модели до 5 минут), запись и свод: запас 30 минут. 0 — «без срока»
      # у скрипта — здесь не берётся: прогон без срока убил бы таймаут до записи флагов.
      - name: Проверка входов
        run: |
          set -euo pipefail
          if ! [[ "$DEADLINE_MIN" =~ ^[0-9]+([.][0-9]+)?$ ]] \
             || awk -v d="$DEADLINE_MIN" 'BEGIN { exit !(d < 1 || d > 150) }'; then
            echo "::error::deadline_min вне [1; 150] минут: job ограничен 180 минутами"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        # openpyxl, xlrd и psycopg2 тянет indexer (закачка файлов тем же путём, что
        # у разбора), pypdf — счёт страниц PDF в read_llm, pillow — сканы TIFF/BMP
        # и тяжёлые фото в PNG (без него такой файл — статус format, а сделка без
        # флагов). Прогон держит ключ модели и строку базы — pillow прибит версией.
        run: pip install --quiet --disable-pip-version-check -r requirements.txt
             psycopg2-binary==2.9.10 pillow==12.3.0 openpyxl xlrd pypdf pytest pyyaml

      - name: Проверки конвейера (без сети)
        # Правила отбора, стороны, бюджета и журнала — до первого запроса к порталу
        # и до первого оплаченного вызова модели.
        run: python -m pytest tests/test_contract_terms.py -q

      # Проверки записи — на своей чистой базе ПЕРЕД рабочей: пропущенная проверка —
      # не пройденная. База в локали UTF-8 (правило 21а).
      - name: Проверки на чистой базе
        if: env.MODE == 'live'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-client
          sudo pg_ctlcluster "$(pg_lsclusters -h | awk 'NR==1{print $1}')" main start
          sudo -u postgres psql -q -c "alter user postgres password 'ci'"
          sudo -u postgres createdb -T template0 --locale=C.UTF-8 --encoding=UTF8 library_sql_test
          LIBRARY_SQL_TEST_DSN="postgresql://postgres:ci@127.0.0.1:5432/library_sql_test" \
            python -m pytest tests/test_contract_terms_sql.py -q

      # Схема перед записью: файл идемпотентен (правило 21) и ни от чего не зависит;
      # общий прогон миграций (zip-db.yml) для пилота не нужен.
      - name: Схема в рабочей базе
        if: env.MODE == 'live'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -q -v ON_ERROR_STOP=1 -f library/supabase/contract_terms_schema.sql

      - name: Чтение договоров
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          BITRIX_FILES_WEBHOOK_URL: ${{ secrets.BITRIX_FILES_WEBHOOK_URL }}
          # Ключ модели и строка базы — только в live: холостому прогону они не нужны.
          ANTHROPIC_API_KEY: ${{ (github.event_name == 'repository_dispatch' || inputs.mode == 'live') && secrets.ANTHROPIC_API_KEY || '' }}
          SUPABASE_DB_URL: ${{ (github.event_name == 'repository_dispatch' || inputs.mode == 'live') && secrets.SUPABASE_DB_URL || '' }}
          RUN_ID: ct-${{ github.run_id }}-${{ github.run_attempt }}
          # Один процесс в общей очереди, с запасом: рядом может идти пересборка
          # дашборда (её группа своя). Отбор: поля пяти типов, справочник стадий
          # заказов (запрос на воронку) и по запросу на 50 сделок, заказов или
          # рамочных у каждого из четырёх типов договоров и у заказов — на 400 сделок
          # порядка 150–200 запросов, 3–4 минуты при 1 запросе/с; в live — плюс по
          # запросу на файл (файл, встреченный второй раз, не качается).
          BITRIX_RPS: "1.0"
          BITRIX_PARALLEL: "1"
          BITRIX_WAIT_BUDGET: "900"
          # Предел страниц (и кадров скана), которые модель читает в одном файле.
          # Файл длиннее модели НЕ отдаётся (статус limit, сделка без флагов):
          # условия из части договора дали бы ложные флаги. 100 — модель по умолчанию
          # (окно 1 млн токенов) берёт до 600 страниц PDF; потолок цены такого
          # файла до вызова ≈ $3,4 — бюджет проверяется перед каждым вызовом.
          LLM_READ_MAX_PAGES: "100"
          # Одна попытка вызова: оборванная посреди потока могла быть оплачена, а
          # бюджет проверяется перед вызовом. Непрочитанное дочитает следующий
          # прогон, прочитанное возьмёт из базы даром (sha256).
          LLM_READ_RETRIES: "1"
          # Один вызов — не дольше 5 минут: срок прогона (--deadline-min до 150) плюс
          # установка, один файл после срока (ожидание лимита, закачка, вызов) и запись
          # помещаются в timeout-minutes job.
          LLM_READ_TIMEOUT: "300"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/contract_terms.py --mode "$MODE" --deals "$DEALS" --budget "$BUDGET_USD"
             --deadline-min "$DEADLINE_MIN" $OPEN

      # Свод по сделкам → закрытый ключ KV realctx:v1 для вкладки «Реализация».
      # И при красном гейте стороны: исходы такого прогона не пишутся, свод берёт
      # последний прошедший. В журнал — только счётчики.
      - name: Свод чатов и договоров в закрытый ключ
        if: ${{ !cancelled() && env.MODE == 'live' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/realization_ctx.py --publish
