name: Bitrix ТКП по сделке

# Выгружает цены из ВЛОЖЕННЫХ ФАЙЛОВ сделки и привязанных СП-166 «Запросы
# поставщикам»: в товарных строках их нет, они лежат в ТКП, прайсах и входящих КП.
# Запускается только руками — это чтение коммерческих данных, расписанию тут делать
# нечего.
#
# ДВА ВЫХОДА, и они разного режима:
#   артефакт tkp-full  — полная выгрузка С ЦЕНАМИ. Живёт 7 дней, в репозиторий НЕ
#                        попадает: репозиторий публичный (SECURITY.md, правило 5).
#   коммит             — gt/data/bitrix_tkp_index.json, опись БЕЗ цен: происхождение
#                        файла, способ разбора, число строк, артикулы с ценой.
#                        Этого хватает, чтобы свести выгрузку с заявкой.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Подстрока в названии сделки
        default: ЛУКОЙЛ
        required: true
      commit_index:
        description: Коммитить опись без цен в репозиторий
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bitrix-tkp
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install --quiet -r requirements.txt openpyxl xlrd pypdf

      - name: Выгрузка цен из вложений
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -n "${BITRIX_WEBHOOK_URL:-}" ] || { echo "::error::нет секрета BITRIX_WEBHOOK_URL"; exit 1; }
          mkdir -p out
          python gt/tools/bitrix_tkp.py \
            --keyword "${{ inputs.keyword }}" \
            --out-full out/tkp_full.json \
            --out-index gt/data/bitrix_tkp_index.json

      # Страховка от утечки: если в описи вдруг окажется слово «price» с числом —
      # коммит не делаем. Дешевле перестраховаться, чем вычищать историю git.
      - name: Проверка, что в описи нет цен
        run: |
          set -euo pipefail
          if grep -qE '"price"[[:space:]]*:[[:space:]]*[0-9]' gt/data/bitrix_tkp_index.json; then
            echo "::error::в описи найдены цены — коммит отменён"
            exit 1
          fi
          echo "✓ цен в описи нет"

      - name: Полная выгрузка — артефактом, не в репозиторий
        uses: actions/upload-artifact@v4
        with:
          name: tkp-full
          path: out/tkp_full.json
          retention-days: 7

      - name: Коммит описи без цен
        if: ${{ inputs.commit_index }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gt/data/bitrix_tkp_index.json
          git diff --cached --quiet && { echo "опись не изменилась"; exit 0; }
          git commit -m "Опись вложений ТКП из Bitrix (без цен)"
          git push
