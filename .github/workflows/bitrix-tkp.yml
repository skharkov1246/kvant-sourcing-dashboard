name: Bitrix входящие КП по сделке

# Адресный обход: сделка → запросы поставщикам → таймлайн → дела → чат, и только
# потом файлы, по одному. Никаких массовых выгрузок (распоряжение владельца
# 17.09.2026): они бесполезны и жгут ресурс.
#
# ТРИ ДЕФЕКТА ПЕРВОЙ ВЕРСИИ, из-за которых прогон на 28 минутах унёс всё:
#   артефакт выгружался без if: always() — при убитом шаге не выгружался вовсе;
#   страж цен стоял ПЕРЕД артефактом и в случае срабатывания убивал его вместе
#     с результатом;
#   у шага не было своего таймаута, поэтому его резал таймаут задания, и
#     последующие шаги не выполнялись.
# Здесь: артефакт первым и всегда, у шага свой таймаут меньше задания, страж
# стоит после артефакта и валит только коммит.
on:
  workflow_dispatch:
    inputs:
      deal:
        description: id одной сделки (точнее и быстрее ключевого слова)
        required: false
      keyword:
        description: подстрока в названии сделки, если id неизвестен
        default: ЛУКОЙЛ
        required: false
      dry_run:
        description: холостой прогон — показать найденные файлы, ничего не качая
        type: boolean
        default: true
      all_files:
        description: качать и наши исходящие запросы тоже
        type: boolean
        default: false
      max_files:
        description: предел числа файлов
        # Замер холостого прогона 17.09.2026: к разбору 1219 файлов (наша цена
        # 157, входящее 581, неопознанное 481). Прежние 400 отрезали бы две
        # трети — и не хвост, а середину: 400 покрывают «нашу цену», входящие и
        # только треть неопознанного.
        default: "900"
        required: false

permissions:
  contents: write

concurrency:
  group: bitrix-tkp
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install --quiet -r requirements.txt openpyxl xlrd pypdf

      - name: Выгрузка входящих КП
        id: extract
        timeout-minutes: 100         # меньше таймаута задания: последующие шаги успеют
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"      # прогресс виден по ходу, а не блоками
        run: |
          set -euo pipefail
          [ -n "${BITRIX_WEBHOOK_URL:-}" ] || { echo "::error::нет секрета BITRIX_WEBHOOK_URL"; exit 1; }
          mkdir -p out
          ARGS=""
          if [ -n "${{ inputs.deal }}" ]; then ARGS="--deal ${{ inputs.deal }}"
          else ARGS="--keyword ${{ inputs.keyword }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.all_files }}" = "true" ]; then ARGS="$ARGS --all-files"; fi
          python gt/tools/bitrix_tkp.py $ARGS \
            --max-files "${{ inputs.max_files }}" \
            --out-full out/tkp_full.json \
            --out-index gt/data/bitrix_tkp_index.json

      # ПЕРВЫМ и ВСЕГДА: даже если шаг выше убит таймаутом, частичный результат
      # уже записан по ходу и должен уехать владельцу.
      - name: Выгрузка результата артефактом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkp-full
          path: |
            out/tkp_full.json
            gt/data/bitrix_tkp_index.json
          if-no-files-found: warn
          retention-days: 7

      # Документ собирается ЗДЕСЬ, а не в сессии агента: у агента нет секрета
      # вебхука, а артефакт он скачать не может. Иначе цены остаются в раннере
      # и до владельца не доходят вовсе.
      - name: Свод выставленных цен с рынком (PDF)
        if: always() && inputs.dry_run != true
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s out/tkp_full.json || { echo "выгрузки нет — документ собирать нечем"; exit 0; }
          python gt/tools/ship_offer.py --tkp out/tkp_full.json \
            --out "${{ runner.temp }}/pdf/КП-ЛУКОЙЛ-ЗАПАС-НА-СНИЖЕНИЕ.pdf"

      - name: Выгрузка документа артефактом
        if: always() && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: tkp-pdf
          path: ${{ runner.temp }}/pdf/*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Проверка, что в описи нет цен
        if: always()
        id: guard
        run: |
          set -euo pipefail
          test -f gt/data/bitrix_tkp_index.json || { echo "описи нет — нечего коммитить"; exit 0; }
          if grep -qE '"price"[[:space:]]*:[[:space:]]*[0-9]' gt/data/bitrix_tkp_index.json; then
            echo "::error::в описи найдены цены — коммит отменён"
            exit 1
          fi
          echo "✓ цен в описи нет"

      - name: Коммит описи без цен
        if: success() && steps.guard.outcome == 'success'
        run: |
          set -euo pipefail
          test -f gt/data/bitrix_tkp_index.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gt/data/bitrix_tkp_index.json
          git diff --cached --quiet && { echo "опись не изменилась"; exit 0; }
          git commit -m "Опись входящих КП из Bitrix (без цен)"
          # Прогон длится десятки минут, и за это время в ветку успевают лечь
          # чужие коммиты — прогон 17.09.2026 потерял из-за этого готовую опись:
          # commit прошёл, push отбился «fetch first». Поэтому подтягиваем чужое
          # перебазированием и повторяем; своё при этом не теряется, чужое не
          # затирается (никакого --force).
          for i in 1 2 3 4; do
            git push && exit 0
            echo "push отбит, подтягиваю ветку (попытка $i)"
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
            sleep $((i * 3))
          done
          echo "::error::опись не удалось запушить за четыре попытки"
          exit 1
