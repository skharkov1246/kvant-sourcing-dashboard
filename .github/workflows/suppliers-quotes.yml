name: Поставщики — разбор котировок (сам по ночам)

# РАЗБИРАЕТ ФАЙЛЫ КП ИЗ КАРТОЧЕК ЗАПРОСОВ И ДОЕДАЕТ ОСТАТОК САМ.
#
# Зачем отдельный прогон, а не вход в «разборе вложений». Тот запускается руками
# и по умолчанию читает сделки; ночью нужен именно rfq, с тем же набором частей
# и без ручного ввода. Распоряжение владельца 21.09.2026: «сделай так, чтобы само
# работало, от меня уже больше ничего не проси».
#
# ПОЧЕМУ ЭТО СХОДИТСЯ БЕЗ ПРИСМОТРА. Разобранное отмечается в lib_files, поэтому
# каждая ночь продолжает с места остановки, а не начинает заново. Когда файлы
# кончатся, прогон за минуту скажет «нечего делать» и завершится.
#
# ОКНО ШИРОКОЕ НАМЕРЕННО. Замер 21.09.2026: за 1 200 дней нашлось 3 200 карточек
# из 21 865 — большинство запросов старше трёх лет. Узкое окно молча оставило бы
# за бортом основную часть котировок.
#
# Очередь на портал общая со всеми прогонами, читающими Bitrix: одновременный
# запуск двух таких прогонов дал HTTP 429 (08:38 того же дня).
#
# В репозиторий и артефакты не пишется ничего, в журнал — только агрегаты
# (CLAUDE.md, правило 17).
on:
  schedule:
    - cron: "40 1 * * *"          # 01:40 UTC — 04:40 МСК, портал свободен
  workflow_dispatch:
    inputs:
      limit:
        description: "Ограничение файлов на часть (0 — без ограничения)"
        default: "0"

permissions:
  contents: read

concurrency:
  # ОБЩАЯ ОЧЕРЕДЬ ЧТЕНИЯ ПОРТАЛА — см. пояснение в suppliers-publish.yml.
  group: bitrix-portal
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # ОДНА ЧАСТЬ, А НЕ ДВЕНАДЦАТЬ. Каждая часть вычитывает ВЕСЬ список карточек
    # СП-166, чтобы выбрать из него свою долю файлов: 21 865 карточек — это 438
    # запросов на обход. Двенадцать частей давали 5 256 запросов и по 36 в
    # секунду при лимите портала около двух. Прогон 21.09.2026 10:43 упал всеми
    # двенадцатью частями разом: «crm.item.list: не удалось выполнить за 6
    # попыток (HTTP 429)».
    #
    # Раньше этого не было видно: отказ портала выдавался за конец данных, и
    # части «успешно» разбирали каждая свой огрызок списка.
    #
    # Одна часть читает список один раз и качает файлы своими WORKERS потоками —
    # скачивание идёт прямыми ссылками, лимит REST на него не распространяется.
    # Ночью торопиться некуда; когда понадобится быстрее, делить надо не файлы
    # по хешу, а карточки по диапазону id, чтобы обход списка не повторялся.
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install --quiet requests openpyxl xlrd pypdf psycopg2-binary

      - name: Проверка секретов
        env:
          B: ${{ secrets.BITRIX_WEBHOOK_URL }}
          S: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${B:-}" ] || { echo "::error::нет секрета BITRIX_WEBHOOK_URL"; exit 1; }
          [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL"; exit 1; }
          echo "секреты на месте"

      - name: Разбор части ${{ matrix.shard }}
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: rfq
          SHARDS: "1"
          SHARD: ${{ matrix.shard }}
          WORKERS: "8"
          # Двадцать лет: фактически всё, что есть в портале. Значение по
          # умолчанию у inputs при запуске по расписанию пустое, поэтому число
          # стоит здесь, а не во входе.
          DAYS: "7300"
          LIMIT: ${{ inputs.limit || '0' }}
        run: python library/indexer.py

  # Замер идёт ОТДЕЛЬНОЙ работой после всех частей: каждая часть знает только
  # свою долю, а важен итог по базе. Без него прогон отчитывался бы числом
  # разобранных файлов — а он затевался ради цены, и мерить его надо ценой.
  # Имя работы латиницей: GitHub принимает в id работы только
  # [A-Za-z_][A-Za-z0-9_-]* (CLAUDE.md, стиль работы — то же правило, что для
  # имён переменных в bash).
  measure:
    name: Замер цен по базе
    needs: quotes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # requests — для имён компаний и брендов из Битрикса в снимке брендов
      # (scripts/publish_brands.py → bitrix_client.py).
      - name: Установка зависимостей
        run: pip install --quiet psycopg2-binary requests
      - name: Что дал разбор в ценах
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/quote_price_coverage.py

      # Второй замер — тем же прогоном и по той же базе: цены меряются воронкой
      # «сколько строк пригодно», а перекрёстная система — связями «позиция ↔
      # поставщик». Это разные вопросы: миллион строк от одной компании даёт
      # отличную воронку и пустую карточку товара.
      - name: Чем наполнятся карточки товара и поставщика
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/cross_ref_coverage.py

      # ЧЕМ ЕЩЁ СВЯЗАТЬ АРТИКУЛ С КАТАЛОГОМ. По основному номеру в каталог
      # попадают 6 % артикулов котировок, а до машины доходят 2 %. От этой
      # связи зависят три раздела карточки товара — «чем закрыть», «где стоит»,
      # «кто делает», — и без неё они пусты у девяти позиций из десяти. Замер
      # показывает вклад каждого ключа И его неоднозначность: мост, ведущий к
      # нескольким деталям, применять нельзя, он заполнит разделы чужой машиной.
      - name: Чем ещё связать артикул с каталогом
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/catalog_bridge.py

      # Снимок для страниц — сразу за замером и тем же прогоном: разбор менял
      # данные, и оставить страницу на вчерашнем снимке значит показывать
      # владельцу не то, что в базе. Отказ публикации прогон не валит: разбор
      # уже сделан, и терять его из-за недоступного Cloudflare незачем.
      # ГЛУШИТЕЛЬ СНЯТ И ЗАМЕНЁН РАЗБОРОМ КОДА ВОЗВРАТА. Прежде continue-on-error
      # накрывал разом две беды разной природы: недоступный Cloudflare (пройдёт
      # сам, разбор терять незачем) и переполнение предела снимка (само не
      # пройдёт, страница навсегда останется на вчерашнем снимке, а прогон
      # отчитается успехом). Вторая беда не гипотетическая: запас формы — 1,35 от
      # нынешнего объёма, а позиции растут с каждым разбором.
      - name: Снимок перекрёстной системы в KV
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          python scripts/publish_crossref.py --apply
          rc=$?
          set -e
          if [ "$rc" = 2 ]; then
            echo "::error::снимок не помещается в предел KV. Это НЕ сбой сети: сам"
            echo "он не пройдёт, и карточка товара останется на вчерашнем снимке."
            echo "Что делать — расписано заранее в library/crossref.py над"
            echo "ПОТОЛОК_ПОЗИЦИЙ: указатель и подробности порознь, предложения по"
            echo "корзинам. Прогон красится намеренно."
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::warning::публикация не состоялась (код $rc) — вероятно, недоступен"
            echo "Cloudflare. Разбор сохранён, прогон не валится."
          fi

      # КАРТОЧКИ БРЕНДОВ И СВОДКА «КОД · ЦЕНА · БРЕНД · ПОСТАВЩИК» (этап 8.1).
      # Сразу за номенклатурой, в том же прогоне и по той же базе: иначе /brands и
      # /nomenclature показали бы разные котировки. Имена компаний и брендов
      # карточки — из Битрикса по номерам (владелец выгружать их не будет); сбой
      # портала публикацию не срывает, имена остаются номерами. В журнал —
      # только агрегаты: числа, размеры ключей, заполненность по полям.
      # Разбор кода возврата тот же, что у номенклатуры: 2 — снимок не влез в
      # предел и сам не пройдёт, прогон красится; иное — вероятно, сеть.
      - name: Карточки брендов и сводка кодов в KV
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          python scripts/publish_brands.py --apply
          rc=$?
          set -e
          if [ "$rc" = 2 ]; then
            echo "::error::один из ключей снимка брендов не помещается в предел KV. Сам"
            echo "он не пройдёт: страница «Бренды и коды» останется на вчерашнем снимке."
            echo "Размеры ключей — в журнале шага выше; делить надо тот, что вырос"
            echo "(library/brands.py: КОРЗИН, пары и указатель — отдельными ключами)."
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::warning::публикация брендов не состоялась (код $rc) — вероятно, недоступен"
            echo "Cloudflare или база. Разбор сохранён, прогон не валится."
          fi

      # ЗАМЕР КОДОВ И ЕГО ПУБЛИКАЦИЯ. Ночной разбор меняет ровно то, что этот
      # замер считает: сколько кодов закрыто ценой. Замер после разбора — точка
      # истории на каждую ночь, из неё и складывается динамика день ко дню; без
      # этого шага точки появлялись бы только тогда, когда их запросят руками.
      #
      # Порядок важен: сначала замер (он пишет точку в базу), потом публикация
      # (она переносит точки в KV). Обратный порядок опубликовал бы вчерашнюю
      # историю и отстал ровно на сутки.
      - name: Замер «сколько кодов с ценой» — точка истории
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WRITE: "1"
          RUN_KEY: ${{ github.run_id }}
        run: python scripts/codes_with_prices.py

      - name: Точки замеров в KV
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          python scripts/publish_counters.py --apply
          rc=$?
          set -e
          if [ "$rc" = 2 ]; then
            echo "::error::снимок точек не помещается в предел. Для истории замеров"
            echo "это означает ошибку публикатора, а не рост: сотни точек по десятку"
            echo "чисел — это десятки килобайт. Смотреть, что попало в nums."
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::warning::публикация точек не состоялась (код $rc). Точки лежат в"
            echo "lib_metric_runs, следующая ночь их опубликует — терять нечего."
          fi
