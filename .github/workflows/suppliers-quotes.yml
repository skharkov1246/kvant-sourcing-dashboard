name: Поставщики — разбор котировок (сам по ночам)

# РАЗБИРАЕТ ФАЙЛЫ КП ИЗ КАРТОЧЕК ЗАПРОСОВ И ДОЕДАЕТ ОСТАТОК САМ.
#
# Зачем отдельный прогон, а не вход в «разборе вложений». Тот запускается руками
# и по умолчанию читает сделки; ночью нужен именно rfq, с тем же набором частей
# и без ручного ввода. Распоряжение владельца 21.09.2026: «сделай так, чтобы само
# работало, от меня уже больше ничего не проси».
#
# ПОЧЕМУ ЭТО СХОДИТСЯ БЕЗ ПРИСМОТРА. Разобранное отмечается в lib_files, поэтому
# каждая ночь продолжает с места остановки, а не начинает заново. Когда файлы
# кончатся, прогон за минуту скажет «нечего делать» и завершится.
#
# ОКНО ШИРОКОЕ НАМЕРЕННО. Замер 21.09.2026: за 1 200 дней нашлось 3 200 карточек
# из 21 865 — большинство запросов старше трёх лет. Узкое окно молча оставило бы
# за бортом основную часть котировок.
#
# Очередь на портал общая со всеми прогонами, читающими Bitrix: одновременный
# запуск двух таких прогонов дал HTTP 429 (08:38 того же дня).
#
# В репозиторий и артефакты не пишется ничего, в журнал — только агрегаты
# (CLAUDE.md, правило 17).
on:
  schedule:
    - cron: "40 1 * * *"          # 01:40 UTC — 04:40 МСК, портал свободен
  workflow_dispatch:
    inputs:
      limit:
        description: "Ограничение файлов на часть (0 — без ограничения)"
        default: "0"

permissions:
  contents: read

concurrency:
  # ОБЩАЯ ОЧЕРЕДЬ ЧТЕНИЯ ПОРТАЛА — см. пояснение в suppliers-publish.yml.
  group: bitrix-portal
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # ОДНА ЧАСТЬ, А НЕ ДВЕНАДЦАТЬ. Каждая часть вычитывает ВЕСЬ список карточек
    # СП-166, чтобы выбрать из него свою долю файлов: 21 865 карточек — это 438
    # запросов на обход. Двенадцать частей давали 5 256 запросов и по 36 в
    # секунду при лимите портала около двух. Прогон 21.09.2026 10:43 упал всеми
    # двенадцатью частями разом: «crm.item.list: не удалось выполнить за 6
    # попыток (HTTP 429)».
    #
    # Раньше этого не было видно: отказ портала выдавался за конец данных, и
    # части «успешно» разбирали каждая свой огрызок списка.
    #
    # Одна часть читает список один раз и качает файлы своими WORKERS потоками —
    # скачивание идёт прямыми ссылками, лимит REST на него не распространяется.
    # Ночью торопиться некуда; когда понадобится быстрее, делить надо не файлы
    # по хешу, а карточки по диапазону id, чтобы обход списка не повторялся.
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install --quiet requests openpyxl xlrd pypdf psycopg2-binary

      - name: Проверка секретов
        env:
          B: ${{ secrets.BITRIX_WEBHOOK_URL }}
          S: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${B:-}" ] || { echo "::error::нет секрета BITRIX_WEBHOOK_URL"; exit 1; }
          [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL"; exit 1; }
          echo "секреты на месте"

      - name: Разбор части ${{ matrix.shard }}
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: rfq
          SHARDS: "1"
          SHARD: ${{ matrix.shard }}
          WORKERS: "8"
          # Двадцать лет: фактически всё, что есть в портале. Значение по
          # умолчанию у inputs при запуске по расписанию пустое, поэтому число
          # стоит здесь, а не во входе.
          DAYS: "7300"
          LIMIT: ${{ inputs.limit || '0' }}
        run: python library/indexer.py

  # Замер идёт ОТДЕЛЬНОЙ работой после всех частей: каждая часть знает только
  # свою долю, а важен итог по базе. Без него прогон отчитывался бы числом
  # разобранных файлов — а он затевался ради цены, и мерить его надо ценой.
  # Имя работы латиницей: GitHub принимает в id работы только
  # [A-Za-z_][A-Za-z0-9_-]* (CLAUDE.md, стиль работы — то же правило, что для
  # имён переменных в bash).
  measure:
    name: Замер цен по базе
    needs: quotes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install --quiet psycopg2-binary
      - name: Что дал разбор в ценах
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/quote_price_coverage.py

      # Второй замер — тем же прогоном и по той же базе: цены меряются воронкой
      # «сколько строк пригодно», а перекрёстная система — связями «позиция ↔
      # поставщик». Это разные вопросы: миллион строк от одной компании даёт
      # отличную воронку и пустую карточку товара.
      - name: Чем наполнятся карточки товара и поставщика
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/cross_ref_coverage.py

      # Снимок для страниц — сразу за замером и тем же прогоном: разбор менял
      # данные, и оставить страницу на вчерашнем снимке значит показывать
      # владельцу не то, что в базе. Отказ публикации прогон не валит: разбор
      # уже сделан, и терять его из-за недоступного Cloudflare незачем.
      - name: Снимок перекрёстной системы в KV
        if: always()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/publish_crossref.py --apply
