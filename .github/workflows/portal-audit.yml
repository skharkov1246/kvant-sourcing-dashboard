name: Ревизия вкладок портала — дефекты и польза

# Проходит по всем вкладкам портала тем же снимком KV, который видит страница
# (/suppliers, /nomenclature, /brands, /counters, /library, плюс словарь брендов
# dict/oem.json), и меряет по каждому полю, у скольких значений дефект, а по
# вкладке — сколько в ней пользы для сорсера. Распоряжение владельца 24.09.2026:
# «на ещё одну пятую ресурса постоянно просто проходиться по всем вкладкам и
# смотреть, насколько адекватна информация там и насколько она полезна».
# Порядок работы по итогам — навык .claude/skills/portal-audit/SKILL.md.
#
# ТОЛЬКО РУЧНОЙ ЗАПУСК. Расписание — решение владельца: он подключит прогон к
# планировщику сам. Второе расписание здесь означало бы два писателя audit:v1.
#
# БИТРИКС И БАЗА НЕ ЧИТАЮТСЯ. Поэтому прогон стоит в СВОЕЙ группе, а не в
# bitrix-portal: постановка туда сняла бы ожидающий ночной разбор (CLAUDE.md —
# в группе ждёт один). Своя группа нужна, чтобы два прогона не писали audit:v1
# наперегонки.
#
# ПО УМОЛЧАНИЮ ВХОЛОСТУЮ: печатает таблицы и ничего не пишет. Галка apply
# кладёт итог (только агрегаты) в KV-ключ audit:v1 — оттуда его сможет
# показать вкладка «Счётчики».
#
# В журнал идут ТОЛЬКО агрегаты (CLAUDE.md, правило 17): коды проверок,
# счётчики, доли и образцы с цифрами «9» и буквами «a»/«я». Артефактов нет.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Записать итог ревизии в KV (audit:v1), иначе вхолостую"
        type: boolean
        default: false
      only:
        description: "Вкладки через запятую (suppliers,nomenclature,brands,counters,library,dict); пусто — все"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: portal-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        # Ревизия — на стандартной библиотеке: клиент KV из publish_suppliers и
        # publish_library_v2 берёт psycopg2 только внутри функций записи базы,
        # до которых ревизия не доходит. pytest — для проверок ниже.
        run: pip install --quiet pytest

      - name: Проверка секретов
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Имена переменных — латиницей (CLAUDE.md, стиль работы).
          [ -n "${T:-}" ] || { echo "::error::нет секрета CLOUDFLARE_API_TOKEN — снимки не прочитать"; exit 1; }
          [ -n "${A:-}" ] || { echo "::error::нет секрета CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "секреты Cloudflare на месте"

      - name: Проверки ревизии на выдуманных снимках
        run: python -m pytest tests/test_portal_audit.py -q

      - name: Ревизия вкладок
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLY: ${{ inputs.apply }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          # Запись включается окружением, а не аргументом: так её не включить
          # опечаткой в строке запуска.
          if [ "$APPLY" = "true" ]; then export AUDIT_APPLY=1; fi
          python scripts/portal_audit.py "${args[@]}"
