name: ZIP base deploy

# Сборка сайта базы ЗИП (zip/) и деплой на Cloudflare Pages (проект kvant-zip).
# Данные в сайт вшиваются как SEED из zip/data/*.json (офлайн-фолбэк); на бою
# сайт читает те же данные из Supabase. Секреты CF — те же, что у дашборда.
on:
  push:
    branches: [main]
    paths: ["zip/**", "gt/**", ".github/workflows/zip-deploy.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zip-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Сборка index.html из шаблона и данных
        run: |
          set -euo pipefail
          python zip/build.py
          test -f zip/public/index.html
          test -f zip/public/vendor/supabase.js

      - name: Фиксация версии wrangler на прогон
        run: |
          set -euo pipefail
          v="$(npm view wrangler version)"
          echo "WRANGLER_VERSION=$v" >> "$GITHUB_ENV"
          echo "wrangler зафиксирован на $v (одна версия на все шаги прогона)"

      - name: Деплой на Cloudflare Pages (kvant-zip)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # создать проект, если его ещё нет (иначе тихо пропустить)
          npx --yes wrangler@${WRANGLER_VERSION} pages project create kvant-zip \
            --production-branch=main 2>/dev/null || true
          # ASCII commit-message: иначе wrangler цепляет кириллицу git-коммита → CF отвергает (8000111).
          # Автоповтор: Cloudflare изредка отдаёт транзиентную «Failed to publish your Function.
          # Unknown internal error» — повторяем до 3 раз.
          ok=0
          for i in 1 2 3; do
            if npx --yes wrangler@${WRANGLER_VERSION} pages deploy zip/public \
                 --project-name=kvant-zip --branch=main \
                 --commit-dirty=true --commit-message="zip auto deploy"; then
              ok=1; break
            fi
            echo "⚠ деплой упал (попытка $i/3) — повтор через 20с…"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::деплой не удался после 3 попыток"; exit 1; }
