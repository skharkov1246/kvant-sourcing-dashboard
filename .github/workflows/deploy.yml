name: Daily dashboard refresh

# Каждые 2 часа (и на push в main) тянет свежие данные из Bitrix, пересобирает дашборд
# и заливает его на Cloudflare Pages (вход через Cloudflare Access; гейт public/_worker.js).
on:
  # GitHub schedule НЕнадёжен (приватные репо душатся — по факту срабатывает ~раз в сутки).
  # Поэтому НАДЁЖНЫЙ триггер — repository_dispatch от внешнего планировщика (см. АВТООБНОВЛЕНИЕ.md),
  # а cron оставлен как backup. Пересборка идемпотентна; concurrency не даёт деплоям пересечься.
  repository_dispatch:
    types: [rebuild]           # внешний планировщик POST-ит /dispatches {"event_type":"rebuild"} каждые 2ч
  schedule:
    - cron: "7 */6 * * *"      # backup каждые 6 часов в :07 UTC (реже — экономия минут Actions; GitHub может пропускать)
  push:
    branches: [main]           # коммит в main → немедленная пересборка/деплой
    # Список того, от чего дашборд и портал ДЕЙСТВИТЕЛЬНО зависят (allowlist).
    # Раньше здесь был обратный список (paths-ignore) из четырёх сайтов, и любой
    # коммит мимо него запускал ~12 мин пересборки. Замер по main за 30 суток:
    # 123 коммита из 168 запускали пересборку, а нужна она была 11 — 91% прогонов
    # пересобирали дашборд из-за правок, которые его не касаются (библиотека ГТУ,
    # ГШО, PN-wizard, навыки, суточные снимки бота).
    # Правило: сюда попадает только то, что читает main.py/dashboard.py при сборке
    # или лежит в public/ и уезжает на Pages этим же workflow. У остальных сайтов
    # свои workflow (ove-, gpu-, zip-, factory-, gidromet-deploy.yml).
    paths:
      - "main.py"
      - "dashboard.py"
      - "bitrix_client.py"
      - "config.py"
      - "metrics.py"
      - "company.py"
      - "advisor.py"
      - "reps.py"
      - "kam.py"
      - "people.py"
      - "contracts.py"
      - "insights.py"
      - "stages.py"
      - "period.py"
      - "premia.py"
      - "presale.py"
      - "kprules.py"
      - "lifecycle.py"
      - "ork.py"                # регламент ОРК: шаги, нормы, сегменты (26.10.2026)
      - "orkview.py"            # раздел «ork» вкладки «Реализация»
      - "data/workcal_ru.json"  # производственный календарь РФ — нормы ОРК в рабочих днях
      - "chat_activity.py"
      - "dealctx.py"            # чаты и договоры во вкладке «Реализация» (23.10.2026)
      - "contract_b2b.py"       # тексты флагов сверки договоров — их читает dealctx.py
      - "dealdigest.py"         # сводка по сделке для модели → KV dealdigest:v1 (25.10.2026)
      - "rzhist.py"             # история счётов «Реализации» → KV rzhist:v1 (30.10.2026)
      - "scripts/realization_hist_kv.py"  # чтение и запись ключа rzhist:v1 — шаги до и после сборки
      - "reqlines.py"           # строки запроса — сквозной счёт КП по строкам (31.10.2026)
      - "handover.py"           # подтверждение готовности к передаче в ОРК — шаг до приёмки (01.11.2026)
      - "scripts/reqlines_kv.py"  # чтение и запись ключа reqlines:v1 — шаги до и после сборки
      - "kamqueue.py"
      - "kaminc.py"
      - "history.py"
      # «Реализация» в € по ЦБ на дату КП (26.10.2026): курсы и правила зонда v59 — импортом
      - "base/fx.py"
      - "scripts/probe_money_sources.py"
      - "scripts/probe_conversion.py"
      - "scripts/probe_money.py"
      - "library/company_names.py"
      - "chat_scan.py"          # шаг «Закрытая часть снимка чатов» запускает его при сборке
      - "requirements.txt"
      - "templates/**"          # вёрстка дашборда
      - "public/**"             # то, что уезжает на Cloudflare Pages, включая гейт
      - "access/**"             # общие модули гейта, копии которых лежат в public/_worker.js
      - "scripts/validate_dashboard.py"
      - ".github/workflows/deploy.yml"
    # data/** намеренно НЕ в списке: суточный снимок чатов пишет бот (~30 коммитов
    # в месяц), и каждый запускал полную пересборку. Снимок влияет на одну метрику —
    # недельное среднее реакции коммерсантов; ближайшая плановая пересборка
    # (планировщик каждые ~6 ч) его подхватит. Цена — задержка до 6 ч на этой метрике,
    # выигрыш — ~360 мин Actions в месяц.
  workflow_dispatch: {}        # ручной запуск (вкладка Actions / gh workflow run)

permissions:
  contents: read

concurrency:
  group: dashboard-deploy    # не запускать два деплоя одновременно
  cancel-in-progress: false

jobs:
  # Резервный крон дублировал внешний планировщик: за 11 суток (27.08–07.09.2026)
  # workflow отработал 100 раз — 45 по dispatch и 39 по расписанию, то есть
  # ~7,6 пересборок в сутки там, где хватает 4. Каждая — ~12 мин Actions.
  # Этот job (≈10 с) спрашивает у API возраст последней УСПЕШНОЙ пересборки и
  # пропускает крон-прогон, если она свежее FRESH_H часов. Роль резерва цела:
  # умолкнет планировщик — возраст перевалит за порог и ближайший крон соберёт.
  # Порог 4 ч < FRESH=7 ч на шкале свежести дашборда, поэтому даже худший случай
  # (пропуск + 6 ч до следующего крона) не красит индикатор.
  # Любой другой триггер (dispatch, push, ручной) проходит без проверки.
  # Ошибка API = собираем (fail-open) — лучше лишняя пересборка, чем пропущенная.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Нужна ли пересборка
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FRESH_H: "4"
        run: |
          set -uo pipefail
          go() { echo "build=true" >> "$GITHUB_OUTPUT"; echo "→ собираем: $1"; exit 0; }
          [ "$EVENT" = "schedule" ] || go "триггер $EVENT, не резервный крон"
          body=$(curl -sS --max-time 30 \
                   -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$REPO/actions/workflows/deploy.yml/runs?status=success&per_page=20") \
            || go "API недоступен (fail-open)"
          last=$(printf '%s' "$body" | jq -r --arg id "$RUN_ID" \
                   '[.workflow_runs[]? | select((.id|tostring) != $id) | .updated_at] | max // empty') \
            || go "не разобрал ответ API (fail-open)"
          [ -n "$last" ] || go "успешных пересборок в истории нет"
          last_s=$(date -u -d "$last" +%s 2>/dev/null) || go "не разобрал дату (fail-open)"
          [ -n "$last_s" ] || go "не разобрал дату (fail-open)"
          age=$(( ( $(date -u +%s) - last_s ) / 60 ))
          echo "последняя успешная пересборка: $last (${age} мин назад), порог ${FRESH_H} ч"
          [ "$age" -lt $(( FRESH_H * 60 )) ] || go "дашборд старше порога"
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "→ пропуск: планировщик отработал ${age} мин назад, резерв не нужен"

  build-and-deploy:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35          # прогон занимает ~12 мин; всё, что дольше, — зависание
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      # Закрытая часть снимка чатов («ждут ответа» с названиями сделок, оценки
      # сотрудников) лежит в KV chat:v1, а не в публичном data/chat_snapshot.json
      # (chat_scan.py). Читается в файл на раннере и отдаётся сборке путём;
      # в журнал — только счётчики. Нет ключа или доступа — вкладка «Коммерсанты»
      # соберётся на числах, без списка «ждут ответа» и оценок; деплой не падает.
      - name: Закрытая часть снимка чатов (KV chat:v1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python chat_scan.py --fetch-private "$RUNNER_TEMP/chat_private.json" \
            || echo "::warning::закрытая часть снимка чатов не прочитана — «Коммерсанты» без списка «ждут ответа» и оценок"

      # Свод оценок чатов и разбора договоров по сделкам (решение владельца 23.10.2026)
      # лежит в KV realctx:v1: его пишут ночная оценка чатов и недельное чтение договоров
      # (scripts/realization_ctx.py --publish). Читается в файл на раннере (realization_ctx_kv.py); в журнал —
      # только счётчики. Нет ключа — «Реализация» соберётся без чатов и договоров.
      - name: Свод чатов и договоров (KV realctx:v1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/realization_ctx_kv.py "$RUNNER_TEMP/realctx.json" \
            || echo "::warning::свод чатов и договоров не прочитан — «Реализация» без чатов и договоров"

      # История счётов «Реализации» — «±N за неделю» у чисел «Недели» (решение владельца 30.10.2026,
      # п. 1): закрытый ключ rzhist:v1, по точке счётов на день (только числа заказов и сделок, не
      # больше 400 дней). Читается в файл на раннере (RZHIST_PATH); в журнал — только счёт точек.
      # Нет ключа или доступа — вкладка соберётся с одной сегодняшней точкой («история с …»).
      - name: История счётов «Реализации» (KV rzhist:v1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/realization_hist_kv.py --fetch "$RUNNER_TEMP/rzhist.json" \
            || echo "::warning::история счётов «Реализации» не прочитана — «за неделю» без прошлых точек"

      # Строки запроса «Сорсинга» — сквозной счёт КП по строкам (решение владельца 31.10.2026):
      # закрытый ключ reqlines:v1 — строк в каждом файле «Request file» (номер файла → число и хэш), чтобы
      # файл разбирался один раз. Нет ключа — сборка разберёт до 300 новых файлов сама.
      - name: Строки запроса «Сорсинга» (KV reqlines:v1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/reqlines_kv.py --fetch "$RUNNER_TEMP/reqlines.json" \
            || echo "::warning::кэш строк запроса не прочитан — сборка разберёт файлы заново (до 300)"

      - name: Генерация дашборда (окно 01.05.2026 → сегодня)
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          # вебхук владельца — только чтение чатов сделок (решение 19.10.2026); нет — читает вебхук сборки
          BITRIX_CHAT_WEBHOOK_URL: ${{ secrets.BITRIX_CHAT_WEBHOOK_URL }}
          # второй читатель чатов — руководитель реализации (решение 22.10.2026)
          BITRIX_CHAT_WEBHOOK_URL_2: ${{ secrets.BITRIX_CHAT_WEBHOOK_URL_2 }}
          CHAT_PRIVATE_PATH: ${{ runner.temp }}/chat_private.json
          REALCTX_PATH: ${{ runner.temp }}/realctx.json
          # сводка по сделке для ночной оценки чатов (dealdigest.py) — файл на раннере;
          # в ключ dealdigest:v1 её кладёт шаг после деплоя
          DEALDIGEST_OUT: ${{ runner.temp }}/dealdigest.json
          # история счётов «Реализации»: прочитанная (rzhist.json) и сегодняшняя точка — её шаг
          # после деплоя кладёт в ключ rzhist:v1
          RZHIST_PATH: ${{ runner.temp }}/rzhist.json
          RZHIST_OUT: ${{ runner.temp }}/rzhist_today.json
          # строки запроса: прочитанный кэш (reqlines.json) и кэш сборки — его шаг после деплоя кладёт в reqlines:v1
          REQLINES_PATH: ${{ runner.temp }}/reqlines.json
          REQLINES_OUT: ${{ runner.temp }}/reqlines_out.json
          # вебхук файлов — только чтение вложений первого письма запроса (строки «a», reqlines.py;
          # решение владельца 31.10.2026); нет — вложения не читаются, строки — из текста письма
          BITRIX_FILES_WEBHOOK_URL: ${{ secrets.BITRIX_FILES_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Идентификаторы служебных учётных записей портала через запятую
          # (Settings → Secrets and variables → Actions → Variables). Их карточки
          # засчитываются живому сорсеру, а не роботу. Переменная не задана —
          # берётся умолчание из config.SERVICE_ACCOUNT_DEFAULT; чтобы выключить
          # разбор, задайте значение «off». Кандидатов дашборд предлагает сам —
          # вкладка «Кто заводит запросы».
          SERVICE_ACCOUNT_IDS: ${{ vars.SERVICE_ACCOUNT_IDS }}
        run: |
          set -euo pipefail
          # инсайты по правилам: ключ Claude (ANTHROPIC_API_KEY) не задан.
          # появится ключ — убери --no-llm и задай секрет → будут инсайты от Claude.
          python main.py --no-llm
          mkdir -p public
          latest="$(ls -t reports/dashboard_*.html | head -1)"
          cp "$latest" public/index.html
          echo "index.html ← $latest ($(wc -c < public/index.html) байт)"

      # Барьер перед деплоем: незаменённые плейсхолдеры, пустые KPI, JS-ошибки рендера.
      # Если проверка не прошла — деплой не выполняется и на сайте остаётся
      # предыдущая рабочая версия (это лучше, чем выкатить пустой дашборд).
      - name: Проверка собранного дашборда
        run: python scripts/validate_dashboard.py public/index.html

      - name: Фиксация версии wrangler на прогон
        run: |
          set -euo pipefail
          v="$(npm view wrangler version)"
          echo "WRANGLER_VERSION=$v" >> "$GITHUB_ENV"
          echo "wrangler зафиксирован на $v (одна версия на все шаги прогона)"

      - name: Деплой на Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # создать проект, если его ещё нет (иначе тихо пропустить)
          npx --yes wrangler@${WRANGLER_VERSION} pages project create kvant-sourcing-f122 \
            --production-branch=main 2>/dev/null || true
          # --commit-message ASCII: иначе wrangler цепляет кириллическое сообщение
          # git-коммита и Cloudflare отвергает деплой (code 8000111).
          # автоповтор: Cloudflare изредка отдаёт транзиентную ошибку публикации
          ok=0
          for i in 1 2 3; do
            if npx --yes wrangler@${WRANGLER_VERSION} pages deploy public \
                 --project-name=kvant-sourcing-f122 --branch=main \
                 --commit-dirty=true --commit-message="auto deploy"; then
              ok=1; break
            fi
            echo "деплой упал (попытка $i/3) — повтор через 20 с"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::деплой не удался после 3 попыток"; exit 1; }

      # Сводка по сделке для модели (решение владельца 25.10.2026): стадия, шаг регламента,
      # сроки, заказы, договоры, экономика — те же числа, что на только что выложенной вкладке,
      # без имён. Публикуется ПОСЛЕ деплоя (на сайте и в ключе — одна сборка) в закрытый ключ
      # dealdigest:v1; его читает ночная оценка чатов (chat-context.yml). В журнал — только
      # счётчики. Не вышло — предупреждение: сайт уже выложен, сводка устареет сама.
      - name: Сводка по сделкам в закрытый ключ (KV dealdigest:v1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/dealdigest_kv.py --publish "$RUNNER_TEMP/dealdigest.json" \
            || echo "::warning::сводка по сделкам не опубликована — ночная оценка чатов увидит только стадию"

      # Точка счётов «Реализации» за сегодня — в закрытый ключ rzhist:v1 ПОСЛЕ деплоя (на сайте и в
      # ключе — одна сборка). Ключ читается заново и сливается: одна точка на день по Москве, тот же
      # день перезаписывается, не больше 400 дней. В журнал — только счёты. Не вышло — предупреждение:
      # сайт уже выложен, точка дня допишется следующей сборкой.
      - name: История счётов «Реализации» в закрытый ключ (KV rzhist:v1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/realization_hist_kv.py --publish "$RUNNER_TEMP/rzhist_today.json" \
            || echo "::warning::история счётов «Реализации» не записана — точка дня допишется следующей сборкой"

      # Строки файлов «Request file» — в закрытый ключ reqlines:v1 ПОСЛЕ деплоя: ключ читается заново и
      # сливается (новые номера файлов дописываются). Не вышло — предупреждение: следующая сборка разберёт
      # эти файлы ещё раз.
      - name: Строки запроса в закрытый ключ (KV reqlines:v1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/reqlines_kv.py --publish "$RUNNER_TEMP/reqlines_out.json" \
            || echo "::warning::кэш строк запроса не записан — следующая сборка разберёт эти файлы ещё раз"

      - name: Причина падения (в сводку прогона)
        if: failure()
        run: |
          {
            echo "## Пересборка дашборда не удалась"
            echo ""
            echo "Сайт не тронут — на нём осталась предыдущая рабочая версия."
            echo ""
            echo "Что смотреть по шагу, на котором остановился прогон:"
            echo "- **Генерация** — код 2 значит «данные Bitrix не прошли проверку достаточности»"
            echo "  (неполная выгрузка). Код 1 — ошибка в коде или недоступный портал."
            echo "- **Проверка собранного дашборда** — рассинхрон шаблона и dashboard.py"
            echo "  либо JS-ошибка рендера."
            echo "- **Деплой** — Cloudflare отверг публикацию (3 попытки исчерпаны)."
          } >> "$GITHUB_STEP_SUMMARY"
