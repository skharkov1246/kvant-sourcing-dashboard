name: ZIP base — apply DB migrations

# Применяет zip/supabase/migrations.sql к Supabase (Postgres) базы ЗИП.
# Запуск вручную (workflow_dispatch). Нужен секрет SUPABASE_DB_URL.
#
# ВАЖНО, КАКУЮ ИМЕННО СТРОКУ БРАТЬ. В Supabase кнопка «Connect» вверху страницы
# проекта показывает три варианта. Здесь годится ТОЛЬКО «Session pooler»:
#   • Direct connection (db.<ref>.supabase.co:5432) — по умолчанию IPv6, а раннеры
#     GitHub ходят по IPv4, соединения не будет;
#   • Transaction pooler (порт 6543) — без поддержки подготовленных запросов;
#   • Session pooler (aws-<регион>.pooler.supabase.com:5432) — всегда IPv4, подходит.
# Пользователь в такой строке имеет вид postgres.<ref>, пароль подставляется вместо
# [YOUR-PASSWORD]. Идемпотентно — можно гонять повторно.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zip-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установка psql (если нет)
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Применить миграции
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Секрет SUPABASE_DB_URL не задан. Settings → Secrets → Actions → New secret."
            exit 1
          fi
          # ПОРЯДОК ВАЖЕН. Сначала мелкие схемы, в конце — тяжёлая библиотека:
          # её колонки fts перестраивают таблицы целиком и на больших данных идут
          # минутами. 11.09.2026 прогон №4 упал на statement timeout в
          # library/supabase/schema.sql, и из-за set -e до gt_notes дело не дошло —
          # правки инженеров остались без общей базы.
          #
          # И ни один файл больше не отменяет остальные: неудача запоминается,
          # следующие файлы всё равно применяются, job падает в конце.
          rc=0
          apply () {   # apply <файл> <что это>
            echo "::group::$2 ($1)"
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$1"; then
              echo "— $2: применено"
            else
              echo "::error file=$1::$2 — не применено, см. журнал шага"
              rc=1
            fi
            echo "::endgroup::"
          }
          apply gt/supabase/migrations.sql  "правки инженеров ГТУ"
          apply zip/supabase/migrations.sql "схема базы ЗИП"
          apply zip/supabase/seed_r1700.sql "досье машины R1700G (данные)"
          apply library/supabase/schema.sql "схема библиотеки рынков"
          apply library/supabase/schema_junk.sql "разметка текста документов"
          apply library/supabase/suppliers_schema.sql "схема поставщиков"
          apply library/supabase/brands_schema.sql "реестр брендов (этап 8.2)"
          # Связь реестра разведки (lib_suppliers) с реестром компаний
          # (sup_entity) — шаг 4 портала. После схемы библиотеки и схемы
          # поставщиков: таблица ссылается на обе и без них падает с названной
          # причиной. До portal_*: карточки читают её вид, но спрашивают о нём
          # при вызове, так что и обратный порядок их не сломал бы. Строк файл
          # не пишет — их пишет прогон «Поставщики — связь разведки с реестром».
          apply library/supabase/supplier_link_schema.sql "связь разведки с реестром компаний"
          # Происхождение дилеров разведки брендов, заведённых в реестр компаний.
          # После схемы поставщиков (ссылается на sup_entity). Строк файл не
          # пишет — их пишет прогон «Поставщики — дилеры разведки брендов в реестр».
          apply library/supabase/research_dealers_schema.sql "дилеры разведки брендов в реестре компаний"
          # Единый поиск портала: функция portal_search и индексы малых таблиц.
          # После всех схем библиотеки — она читает их таблицы; реестра брендов
          # и вида имён поставщиков может не быть, это она проверяет сама.
          apply library/supabase/portal_schema.sql "единый поиск портала"
          # Карточки портала: portal_code, portal_brand, portal_supplier (страница
          # /p). После поиска — берут его индексы lib_parts_kv_key и
          # lib_part_alt_key; опоры, которых может не быть, проверяют сами.
          apply library/supabase/portal_entity_schema.sql "карточки портала: код, бренд, поставщик"
          # ПОСЛЕДНИМ И ВСЕГДА. zip/supabase/migrations.sql выше заново выдаёт роли
          # anon полный доступ к таблицам ЗИП — так она написана. Ужесточение обязано
          # идти после неё, иначе каждый прогон миграций молча открывает базу обратно.
          # Здесь только ступень 1 (таблицы, которых браузер не запрашивает вовсе);
          # ступень 2 применяется отдельно, прогоном «ЗИП — ужесточение доступа».
          apply zip/supabase/migrations_rls_stage1.sql "ужесточение доступа, ступень 1"
          [ "$rc" = 0 ] && echo "✓ миграции применены" || echo "✗ часть миграций не применилась"
          exit "$rc"
