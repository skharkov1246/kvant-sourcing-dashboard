name: Разведка разбора (сторона документа, шапка таблицы)

# ЧТО ИЗ «НАШЕГО СПРОСА» НА САМОМ ДЕЛЕ НЕ СПРОС. Раскладка строк спроса по полю
# карточки и по СТОРОНЕ документа: заявка заказчика, наше исходящее, предложение
# поставщика, внутренний файл.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ПРОГОН, А НЕ ЗАДАНИЕ В «Библиотека — сводка». Тот прогон
# намеренно не ходит в Битрикс: все его задания работают с накопленной базой.
# А здесь Битрикс нужен по существу — в lib_files хранится КОД поля, названия нет,
# и без названия сторону документа не определить. Один вызов crm.item.fields на
# тип сущности, читает, ничего не пишет.
#
# Поэтому и общая очередь чтения портала: прогон лёгкий, но параллельно с разбором
# вложений он всё равно добавляет запросов, а 21.09.2026 именно одновременность
# двух чтений дала HTTP 429 и убила оба.
#
# В журнал — только агрегаты (правило 17). Коды и названия полей — это настройки
# нашего же Битрикса, а не данные заказчиков.
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Дозаполнить сторону у уже разобранных файлов (иначе только замер)"
        type: boolean
        default: false
      apply:
        description: "backfill: писать в базу (иначе холостой прогон)"
        type: boolean
        default: false
      headers:
        description: "Разведка: почему шапка таблицы не узнана (перечитывает выборку файлов)"
        type: boolean
        default: false
      limit:
        description: "headers: сколько файлов перечитать"
        default: "200"

permissions:
  contents: read

concurrency:
  group: bitrix-portal
  cancel-in-progress: false

jobs:
  sides:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        # openpyxl и xlrd нужны РАЗВЕДКЕ ШАПКИ: она перечитывает файлы теми же
        # `indexer.rows_from_*`, что и разбор, а те подтягивают библиотеку внутри
        # функции. Прогон 35837112523 упал на ModuleNotFoundError через тринадцать
        # секунд после того, как напечатал главный ответ, — разбивка уже была в
        # журнале, а выборка не перечиталась. Список тот же, что в library-index.
        run: pip install --quiet -r requirements.txt psycopg2-binary==2.9.10 pytest
             openpyxl xlrd pypdf

      - name: Проверка секретов
        env:
          S: ${{ secrets.SUPABASE_DB_URL }}
          B: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -n "${S:-}" ] || { echo "::error::нет секрета SUPABASE_DB_URL"; exit 1; }
          if [ -n "${B:-}" ]; then
            echo "вебхук Битрикса есть — названия полей будут получены"
          else
            echo "::warning::нет BITRIX_WEBHOOK_URL: раскладки по сторонам не будет,"
            echo "останется только раскладка по кодам полей"
          fi

      - name: Проверки правила стороны документа
        run: python -m pytest tests/test_doc_side.py -q

      # ДОЗАПОЛНЕНИЕ. У файлов, разобранных до 22.09.2026, колонки стороны пусты,
      # а именно на них стоят все замеры спроса. Без дозаполнения отбор «заявки
      # заказчика» дал бы почти пустой результат, и это выглядело бы как «заявок
      # мало», а не как «сторона не проставлена».
      - name: Дозаполнить сторону у разобранных файлов
        if: inputs.backfill
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          APPLY: ${{ inputs.apply && '1' || '' }}
        run: python scripts/backfill_doc_side.py

      # РАЗВЕДКА ШАПКИ. Живёт здесь, а не отдельным прогоном: ей нужен тот же
      # портал и та же очередь чтения. Воронка 22.09.2026 назвала этот резерв
      # главным — 720 файлов с восстановленной таблицей дают цену в 0,8 % случаев
      # против 71,5 % там, где шапка нашлась.
      - name: Почему шапка таблицы не узнана
        if: inputs.headers
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          LIMIT: ${{ inputs.limit }}
        run: python scripts/header_recon.py

      - name: Сторона документа у строк спроса
        if: ${{ !inputs.headers }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python scripts/demand_sides.py
