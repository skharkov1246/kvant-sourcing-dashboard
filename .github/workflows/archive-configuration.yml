name: Archive configuration metadata

on:
  push:
    branches: [main]
    paths:
      - scripts/check_archive_configuration.py
      - tests/test_archive_configuration.py
      - .github/workflows/archive-configuration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline diagnostic tests
        run: python -m unittest discover -s tests -p test_archive_configuration.py -v
      - name: Read fixed Pages configuration metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/check_archive_configuration.py
