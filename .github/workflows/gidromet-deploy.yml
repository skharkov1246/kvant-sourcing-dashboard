name: Gidromet site deploy

# Сборка и деплой сайта инженерного заключения по гидрометаллургической переработке
# медно-золотого концентрата карельского месторождения (gidromet/) на Cloudflare Pages
# (проект kvant-gidromet). Отдельный проект Pages — дашборд сорсеров, сайт ОВЭ-75,
# база ЗИП, ГПУ-библиотека и сайт базового проекта ГОКа не затрагиваются.
#
# Гейт доступа: gidromet/public/_worker.js (Basic Auth, единый пароль компании из секрета
# GitHub BASIC_AUTH_PASS + именной вход BASIC_AUTH_USERS). Сайт закрыт по распоряжению
# владельца 07.09.2026; следующий шаг — периметр Cloudflare Access.
#
# Страница собирается из gidromet/site/index.template.html и gidromet/data/*.json
# скриптом gidromet/build.py и получается самодостаточной: весь CSS и JS встроены,
# внешних ресурсов нет.
on:
  push:
    branches: [main]
    paths: ["gidromet/**", ".github/workflows/gidromet-deploy.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gidromet-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Сборка index.html из шаблона и данных
        run: python3 gidromet/build.py

      - name: Проверка страницы
        run: |
          set -euo pipefail
          test -f gidromet/public/index.html
          # гейт обязателен: без него сайт открыт всему интернету
          test -f gidromet/public/_worker.js || { echo "::error::нет gidromet/public/_worker.js — сайт был бы открыт"; exit 1; }
          # страница обязана быть самодостаточной: внешние ресурсы в Pages не подтянутся
          if grep -Eq '(src|href)="https?://' gidromet/public/index.html; then
            echo "::error::в странице есть ссылки на внешние ресурсы — встройте их"
            exit 1
          fi
          # незаменённые плейсхолдеры означают рассинхрон шаблона и build.py
          if grep -q '__[A-Z_]*_JSON__' gidromet/public/index.html; then
            echo "::error::в собранной странице остались плейсхолдеры"
            exit 1
          fi

      - name: Фиксация версии wrangler на прогон
        run: |
          set -euo pipefail
          v="$(npm view wrangler version)"
          echo "WRANGLER_VERSION=$v" >> "$GITHUB_ENV"
          echo "wrangler зафиксирован на $v (одна версия на все шаги прогона)"

      - name: Деплой на Cloudflare Pages (kvant-gidromet)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          BASIC_AUTH_USERS: ${{ secrets.BASIC_AUTH_USERS }}
        run: |
          set -euo pipefail
          # создать проект, если его ещё нет (иначе тихо пропустить)
          npx --yes wrangler@${WRANGLER_VERSION} pages project create kvant-gidromet \
            --production-branch=main 2>/dev/null || true
          # единый пароль компании из секрета GitHub → секрет проекта Pages (fail-closed без него)
          if [ -n "${BASIC_AUTH_PASS:-}" ]; then
            printf '%s' "$BASIC_AUTH_PASS" \
              | npx --yes wrangler@${WRANGLER_VERSION} pages secret put BASIC_AUTH_PASS --project-name=kvant-gidromet \
              || echo "::warning::не удалось задать секрет BASIC_AUTH_PASS в CI"
          else
            echo "::warning::GitHub-секрет BASIC_AUTH_PASS пуст — сайт отдаст 503, пока пароль не задан"
          fi
          # именной вход: таблица «email хэш сайты» из секрета BASIC_AUTH_USERS (пусто — только общий пароль)
          if [ -n "${BASIC_AUTH_USERS:-}" ]; then
            printf '%s' "$BASIC_AUTH_USERS" \
              | npx --yes wrangler@${WRANGLER_VERSION} pages secret put BASIC_AUTH_USERS --project-name=kvant-gidromet \
              || echo "::warning::не удалось задать секрет BASIC_AUTH_USERS в CI"
          fi
          # ASCII commit-message: иначе wrangler цепляет кириллицу git-коммита → CF отвергает (8000111).
          ok=0
          for i in 1 2 3; do
            if npx --yes wrangler@${WRANGLER_VERSION} pages deploy gidromet/public \
                 --project-name=kvant-gidromet --branch=main \
                 --commit-dirty=true --commit-message="gidromet site deploy"; then
              ok=1; break
            fi
            echo "деплой упал (попытка $i/3) — повтор через 20 с"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::деплой не удался после 3 попыток"; exit 1; }
