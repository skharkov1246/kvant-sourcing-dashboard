<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Поставщики · КВАНТ</title>
<style>
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/ibm-plex-sans-var-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/ibm-plex-sans-var-lat.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
:root{--bg:#0e1116;--card:#151a22;--raised:#1a222e;--line:#2a3341;--ink:#e7ecf3;--dim:#a0acbd;--accent:#73b6ff;--green:#86d9b1;--amber:#e7c488;--red:#f5a7a7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif}
button,input{font:inherit}button{cursor:pointer}a{color:var(--accent);text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}.wrap{max-width:1320px;margin:auto;padding:27px 28px 60px}
.skip{position:absolute;left:20px;top:-70px;padding:10px;background:var(--card);z-index:4}.skip:focus{top:10px}
.topbar{display:flex;align-items:center;gap:16px;justify-content:space-between;color:var(--dim);font-size:13px}.topbar a{text-decoration:none}
.access-label{display:flex;align-items:center;gap:7px}.access-label:before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:32px 0 24px;flex-wrap:wrap}
.eyebrow{font-size:11px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(26px,3vw,35px);line-height:1.2;letter-spacing:-.02em;margin:8px 0 12px;font-weight:600}
.intro{margin:0;max-width:66ch;color:var(--dim)}
.published{min-width:165px;font-size:12px;color:var(--dim);text-align:right;line-height:1.7}.published strong{display:block;font-weight:400;color:var(--ink)}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 24px}
.total{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:18px 20px}
.total strong{display:block;font-size:27px;font-weight:400;line-height:1;margin-bottom:9px}
.total span{color:var(--dim);font-size:13px}
.caveat{border:1px solid #524733;background:#1d1c19;border-radius:9px;padding:15px 18px;margin:0 0 24px;color:#d3cbbb;font-size:13px}
.caveat strong{color:var(--amber);font-weight:500}
.innq{border:1px solid #524733;background:#1d1c19;border-radius:9px;padding:15px 18px;margin:0 0 24px}
.innq h2{margin:0 0 6px;font-size:16px;color:var(--amber);font-weight:500}
.innq-why{margin:0 0 14px;color:#d3cbbb;font-size:13px;line-height:1.5}
.innq-row{border-top:1px solid #33302a;padding:9px 0;display:grid;
          grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline}
.innq-row:first-child{border-top:0}
.innq-name{color:#e8e2d6;font-size:13px;word-break:break-word}
.innq-reason{color:#9c9384;font-size:12px;display:block;margin-top:2px}
.innq-cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.innq-cards a{color:#8fb8ff;text-decoration:none;font-size:12px;border:1px solid #2f3b52;
              border-radius:5px;padding:1px 7px;white-space:nowrap}
.innq-cards a:hover{background:#1a2740}
.search-row{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:19px;flex-wrap:wrap}
.search-box{position:relative;max-width:650px;flex:1;min-width:220px}
.search-box input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:12px 15px;min-height:48px;appearance:none}
.search-box input::placeholder{color:var(--dim)}
.result-count{color:var(--dim);font-size:13px;margin:0;min-width:120px}
.table-wrap{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:9px;margin:20px 0;scrollbar-width:thin}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
th{background:#1a222d;color:var(--dim);font-size:11px;font-weight:400;white-space:nowrap}
th,td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}td{color:#c4cedb;max-width:300px;overflow-wrap:anywhere}
.num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;white-space:nowrap;color:var(--ink)}
.row-link{background:none;border:0;color:var(--accent);padding:0;text-align:left;font:inherit;line-height:1.5}
.more{margin:0 0 26px}
.status{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:28px;margin:18px 0;color:var(--dim)}
.status h2{font-size:19px;color:var(--ink);font-weight:500;margin:0 0 7px}.status p{max-width:70ch;margin:0}
.status.error{border-color:#594047}.status.error h2{color:var(--red)}
.card{border-top:1px solid var(--line);margin-top:8px;padding-top:24px}
.card h2{font-size:23px;font-weight:500;margin:0 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.card .num{display:block;margin-bottom:18px}
.back{border:0;background:transparent;color:var(--accent);padding:0;margin:0 0 16px;min-height:36px}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 22px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin:0 0 20px}
dt{font-size:11px;color:var(--dim);margin:0 0 3px}dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.section-title{font-size:15px;font-weight:500;margin:22px 0 10px}
.field-note{font-size:12px;color:var(--dim);margin:-10px 0 20px}
.locked{color:var(--amber)}.none{color:var(--dim)}.warn{color:var(--amber)}
.rfq{white-space:nowrap}.rfq b{font-weight:500;color:var(--ink)}.rfq .thin{color:var(--dim);font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){.wrap{padding:20px 17px 40px}.hero{display:block}.published{text-align:left;margin-top:16px}
.search-row{display:block}.result-count{margin-top:10px}.search-box input{font-size:16px}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#main">Перейти к списку</a>
<div class="wrap">
  <nav class="topbar" aria-label="Портал"><a href="/">← Портал КВАНТ</a><span class="access-label">Закрытый раздел</span></nav>
  <header class="hero">
    <div>
      <div class="eyebrow">КВАНТ · цепочка поставки</div>
      <h1>Поставщики</h1>
      <p class="intro">Сведённый реестр компаний: один вечный номер на одну компанию, сколько бы раз она ни встретилась в шести исходных списках.</p>
    </div>
    <div class="published" id="published">Загружаем…</div>
  </header>
  <div class="totals" id="totals" hidden></div>
  <p class="caveat" id="caveat" hidden></p>
  <section class="innq" id="innq" hidden>
    <h2 id="innq-head"></h2>
    <p class="innq-why" id="innq-why"></p>
    <div id="innq-list"></div>
  </section>
  <main id="main">
    <div class="status" id="status"><h2>Загружаем реестр</h2><p>Секунду.</p></div>
    <div id="list" hidden>
      <div class="search-row">
        <div class="search-box">
          <label for="search" class="sr-only">Поиск по названию, номеру, ИНН или домену</label>
          <input type="search" id="search" placeholder="Название, номер, ИНН или домен" autocomplete="off" spellcheck="false">
        </div>
        <p class="result-count" id="count" role="status" aria-live="polite"></p>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">Номер</th><th scope="col">Название</th><th scope="col">ИНН</th><th scope="col">Домен</th><th scope="col">Запросы</th><th scope="col">Откуда</th><th scope="col">Чем слито</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="more" id="more" hidden></p>
    </div>
    <section class="card" id="card" hidden aria-live="polite"></section>
  </main>
</div>
<script>
"use strict";
// Резка полей делается на сервере: закрытое право приходит как {закрыто:"<право>"}.
// Страница только показывает разницу между «нет данных» и «нет доступа» — скрывать
// стилями нечего, закрытого значения в ответе уже нет.
var ПРАВА = { suppliers_pii: "контакты", suppliers_fin: "договоры и деньги" };
var ШАГ = 200;
var данные = null, отфильтровано = [], показано = 0;
var $ = function (id) { return document.getElementById(id); };

function текст(el, v) { el.textContent = v == null ? "" : String(v); return el; }
function узел(тег, класс, v) {
  var el = document.createElement(тег);
  if (класс) el.className = класс;
  if (v !== undefined) текст(el, v);
  return el;
}
function пара(dl, подпись, v) {
  var box = узел("div");
  box.appendChild(узел("dt", null, подпись));
  box.appendChild(узел("dd")).appendChild(значение(v));
  dl.appendChild(box);
}
function закрыто(v) { return v !== null && typeof v === "object" && !Array.isArray(v) && typeof v["закрыто"] === "string"; }
function число(n) { return typeof n === "number" ? n.toLocaleString("ru-RU") : "—"; }
// Заголовок читает владелец, и «2 компаний» в нём — брак. 11–14 идут по форме
// «компаний», хотя оканчиваются на 1–4: это исключение, а не общее правило.
function склонение(n, одна, две, много) {
  if (typeof n !== "number") return много;
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return много;
  if (b === 1) return одна;
  if (b >= 2 && b <= 4) return две;
  return много;
}
function дата(s) {
  if (!s) return "неизвестно";
  var t = Date.parse(s);
  return isFinite(t) ? new Date(t).toLocaleString("ru-RU", { dateStyle: "long", timeStyle: "short" }) : "неизвестно";
}

// Объект в данных — это обычно человек или контакт. Показываем имя, а не JSON:
// сырой JSON на странице означает, что поле не описали, и читать его нельзя.
function коротко(x) {
  if (x == null) return "";
  if (typeof x !== "object") return String(x);
  var имя = x.name || x.title || x.value || x.email || x.phone;
  return имя ? String(имя) : JSON.stringify(x);
}

function значение(v) {
  // Три разных состояния, и путать их нельзя: закрыто правом, пусто, есть значение.
  if (закрыто(v)) {
    var имя = ПРАВА[v["закрыто"]] || v["закрыто"];
    return узел("span", "locked", "Нет доступа · " + имя);
  }
  if (v == null || v === "" || (Array.isArray(v) && !v.length)) return узел("span", "none", "Нет данных");
  if (Array.isArray(v)) return узел("span", null, v.map(коротко).join(", "));
  if (typeof v === "object") return узел("span", null, коротко(v));
  // Деньги и счётчики читаются глазами, а не парсером: 1 234 567, не 1234567.
  if (typeof v === "number") return узел("span", null, число(v));
  return узел("span", null, v);
}

// Несколько доменов у одной записи — признак склеенных компаний. Оговорка
// наверху говорит, сколько их всего; без пометки на строке её нельзя проверить.
function склейка(v) { return typeof v === "string" && v.indexOf(", ") >= 0; }

// ОТЗЫВЧИВОСТЬ ПОКАЗЫВАЕТСЯ СО ЗНАМЕНАТЕЛЕМ, А ДОЛЯ — ТОЛЬКО ОТ ТРЁХ ЗАПРОСОВ.
// Замер 20.09.2026: у 72,5 % компаний ровно один запрос. Там доля принимает два
// значения, 0 или 100, и это не отзывчивость, а один случай. Ставить такую
// компанию в один ряд с той, у кого тридцать запросов, значит врать порядком.
var МИН_ДЛЯ_ДОЛИ = 3;

function отзывчивость(r) {
  if (закрыто(r)) return значение(r);
  if (!r || typeof r !== "object" || !r.sent) return узел("span", "none", "Не писали");
  var el = узел("span", "rfq");
  el.appendChild(узел("b", null, число(r.sent)));
  el.appendChild(document.createTextNode(" запрос" + окончание(r.sent) + " · КП " + число(r.quoted)));
  var хвост = r.sent >= МИН_ДЛЯ_ДОЛИ
    ? " · " + Math.round(100 * r.answered / r.sent) + " % ответов"
    : " · мало данных";
  el.appendChild(узел("span", "thin", хвост));
  el.title = "отправлено " + r.sent + ", ответов " + r.answered + ", КП " + r.quoted
    + ", промолчал " + r.silent + ", без зафиксированного исхода " + r.no_outcome;
  return el;
}

function окончание(n) {
  var д = n % 10, дд = n % 100;
  if (дд >= 11 && дд <= 14) return "ов";
  return д === 1 ? "" : (д >= 2 && д <= 4 ? "а" : "ов");
}

function строка(e) {
  var tr = document.createElement("tr");
  tr.appendChild(узел("td", "num", e.number || "—"));
  var td = узел("td");
  var b = узел("button", "row-link", e.name || "без названия");
  b.type = "button";
  b.addEventListener("click", function () { открыть(e); });
  td.appendChild(b);
  tr.appendChild(td);
  var домен = значение(e.domain);
  if (склейка(e.domain)) {
    домен.className = "warn";
    домен.title = "несколько доменов у одной записи — вероятно, склеены две компании";
  }
  tr.appendChild(узел("td")).appendChild(значение(e.inn));
  tr.appendChild(узел("td")).appendChild(домен);
  tr.appendChild(узел("td")).appendChild(отзывчивость(e.rfq));
  [(e.sources || []).join(", "), e.merged_by].forEach(function (v) {
    tr.appendChild(узел("td")).appendChild(значение(v));
  });
  return tr;
}

function дорисовать() {
  var frag = document.createDocumentFragment();
  var до = Math.min(показано + ШАГ, отфильтровано.length);
  for (var i = показано; i < до; i++) frag.appendChild(строка(отфильтровано[i]));
  $("rows").appendChild(frag);
  показано = до;
  var ост = отфильтровано.length - показано;
  var more = $("more");
  more.textContent = "";
  more.hidden = ост <= 0;
  if (ост > 0) {
    var b = узел("button", "row-link", "Показать ещё " + число(Math.min(ост, ШАГ)) + " из " + число(ост));
    b.type = "button";
    b.addEventListener("click", дорисовать);
    more.appendChild(b);
  }
}

function искать() {
  var q = $("search").value.trim().toLowerCase();
  отфильтровано = !q ? данные.entities : данные.entities.filter(function (e) {
    return [e.number, e.name, e.inn, e.domain].some(function (v) {
      return typeof v === "string" && v.toLowerCase().indexOf(q) >= 0;
    });
  });
  $("rows").textContent = "";
  показано = 0;
  текст($("count"), число(отфильтровано.length) + " из " + число(данные.entities.length));
  дорисовать();
}

function раздел(заголовок, поля, сущность) {
  var есть = поля.some(function (п) { return п[1] in сущность; });
  if (!есть) return null;
  var frag = document.createDocumentFragment();
  frag.appendChild(узел("h3", "section-title", заголовок));
  var dl = узел("dl");
  поля.forEach(function (п) {
    if (!(п[1] in сущность)) return;
    пара(dl, п[0], сущность[п[1]]);
  });
  frag.appendChild(dl);
  return frag;
}

function открыть(e) {
  var card = $("card");
  card.textContent = "";
  var back = узел("button", "back", "← К списку");
  back.type = "button";
  back.addEventListener("click", function () { card.hidden = true; $("list").hidden = false; $("search").focus(); });
  card.appendChild(back);
  card.appendChild(узел("h2", null, e.name || "без названия"));
  card.appendChild(узел("span", "num", e.number || "номер не выдан"));
  if (склейка(e.domain)) {
    card.appendChild(узел("p", "caveat", "У записи несколько доменов. Это признак того, что "
      + "сведение склеило две разные компании: данные ниже могут относиться к обеим."));
  }

  var основа = узел("dl");
  [["ИНН", "inn"], ["Домен", "domain"], ["Страна", "country"], ["Правовая форма", "legal_form"],
   ["Откуда сведено", "sources"], ["Чем слито", "merged_by"], ["Позиций в каталоге", "parts"]].forEach(function (п) {
    пара(основа, п[0], e[п[1]]);
  });
  card.appendChild(основа);

  if (e.rfq && typeof e.rfq === "object" && !закрыто(e.rfq) && e.rfq.sent) {
    card.appendChild(узел("h3", "section-title", "История запросов"));
    var dl = узел("dl");
    пара(dl, "Отправлено запросов", e.rfq.sent);
    пара(dl, "Ответил", e.rfq.answered);
    пара(dl, "Дал цену", e.rfq.quoted);
    пара(dl, "Промолчал в срок", e.rfq.silent);
    пара(dl, "Исход не зафиксирован", e.rfq.no_outcome);
    card.appendChild(dl);
    card.appendChild(узел("p", "field-note", e.rfq.sent >= МИН_ДЛЯ_ДОЛИ
      ? "Доля ответов: " + Math.round(100 * e.rfq.answered / e.rfq.sent) + " % "
        + "(" + e.rfq.answered + " из " + e.rfq.sent + ")."
      : "Запросов меньше трёх — доля ответов здесь не показывается: она приняла бы "
        + "два значения, ноль или сто, и это был бы один случай, а не свойство."));
  }

  [раздел("Контакты", [["Люди", "persons"], ["Почта", "emails"], ["Телефоны", "phones"], ["Каналы", "contacts"]], e),
   раздел("Договоры и деньги", [["Условия", "terms"], ["Оплата", "payment"], ["Лимиты", "limits"], ["Договоры", "contracts"], ["Закупки", "spend"]], e)]
    .forEach(function (ф) { if (ф) card.appendChild(ф); });

  $("list").hidden = true;
  card.hidden = false;
  card.scrollIntoView({ block: "start" });
}

function сводка(d) {
  var t = d.totals || {};
  var поля = [["Компаний в реестре", t.entities], ["С вечным номером", t.numbered],
              ["В очереди проверки", t.review_open], ["С ИНН", t.with_inn],
              ["Карточек ждут ИНН", t.inn_cards]];
  var box = $("totals");
  var видно = false;
  поля.forEach(function (п) {
    if (typeof п[1] !== "number") return;
    видно = true;
    var el = узел("div", "total");
    el.appendChild(узел("strong", null, число(п[1])));
    el.appendChild(узел("span", null, п[0]));
    box.appendChild(el);
  });
  box.hidden = !видно;
  if (d.caveat) { текст($("caveat"), d.caveat).hidden = false; }
  очередь_инн(d);
}

// Тот же адрес карточки компании, что в остальных страницах портала.
var BXLINK = "https://kvantpro.bitrix24.ru/crm/company/details/";

// ОЧЕРЕДЬ НА ИНН — СПИСОК РАБОТЫ. Показывать её числом бессмысленно: чтобы снять
// спор, надо открыть конкретные карточки, поэтому каждая идёт ссылкой. Раздел
// прячется целиком, когда очереди нет: пустой список читался бы как «проверено
// и пусто», а это разные вещи.
function очередь_инн(d) {
  var очередь = Array.isArray(d.inn_queue) ? d.inn_queue : [];
  if (!очередь.length) return;
  var t = d.totals || {};
  текст($("innq-head"), "Ждут ИНН: " + число(t.inn_entities) + " "
        + склонение(t.inn_entities, "компания", "компании", "компаний") + ", "
        + число(t.inn_cards) + " "
        + склонение(t.inn_cards, "карточку", "карточки", "карточек") + " заполнить");
  текст($("innq-why"),
        "Этим компаниям не выдан вечный номер: опознать их доменом и именем нельзя, "
        + "решает налоговый номер. Заполнять нужно только эти карточки — остальным "
        + "компаниям реестра ИНН для сведения не требуется. Проставится номер — "
        + "следующий прогон сведения запишет их сам.");
  var box = $("innq-list");
  очередь.forEach(function (строка) {
    var row = узел("div", "innq-row");
    var left = узел("div", null);
    left.appendChild(узел("span", "innq-name", (строка.names || []).join(" · ")));
    if (строка.reason) left.appendChild(узел("span", "innq-reason", строка.reason));
    row.appendChild(left);
    var cards = узел("div", "innq-cards");
    (строка.cards || []).forEach(function (id) {
      var a = узел("a", null, "№ " + id);
      a.href = BXLINK + encodeURIComponent(id) + "/";
      a.target = "_blank";
      a.rel = "noopener";
      cards.appendChild(a);
    });
    row.appendChild(cards);
    box.appendChild(row);
  });
  $("innq").hidden = false;
}

function ошибка(h, p) {
  var s = $("status");
  s.className = "status error";
  s.textContent = "";
  s.appendChild(узел("h2", null, h));
  s.appendChild(узел("p", null, p));
  s.hidden = false;
}

fetch("/api/suppliers", { headers: { Accept: "application/json" } }).then(function (r) {
  if (r.status === 403) throw new Error("forbidden");
  if (!r.ok) throw new Error("http");
  return r.json();
}).then(function (d) {
  данные = d;
  данные.entities = Array.isArray(d.entities) ? d.entities : [];
  var pub = $("published");
  pub.textContent = "Снимок";
  pub.appendChild(узел("strong", null, дата(d.published_at)));
  сводка(d);
  if (!данные.entities.length) {
    var st = $("status");
    st.textContent = "";
    st.appendChild(узел("h2", null, "Снимок ещё не опубликован"));
    st.appendChild(узел("p", null, "Реестр сведён в базе, но публикатор снимка пока не отработал. Здесь появится список, как только он пройдёт."));
    return;
  }
  $("status").hidden = true;
  $("list").hidden = false;
  $("search").addEventListener("input", искать);
  искать();
}).catch(function (e) {
  if (e && e.message === "forbidden") {
    ошибка("Раздел закрыт", "Права «Поставщики» у вашей учётной записи нет. Запросите его у владельца портала.");
  } else {
    ошибка("Реестр не открылся", "Не удалось получить данные. Обновите страницу; если повторится — скажите владельцу портала.");
  }
});
</script>
</body>
</html>
