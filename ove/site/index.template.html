<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОВЭ-75 — комплекс обжиг · выщелачивание · электроэкстракция, КГМК Мончегорск</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --mut:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s1-soft:#cde2fb; --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --serious:#ec835a;
  --chip:#eef2f7;
  --l1:#e2653c; --l2:#3f7fd0; --l3:#159c72; --l4:#8b5cd6;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --mut:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s1-soft:#184f95; --chip:#262624;
    --l1:#f0805c; --l2:#5d99e2; --l3:#2fb98d; --l4:#a47ce6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --mut:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s1-soft:#184f95; --chip:#262624;
  --l1:#f0805c; --l2:#5d99e2; --l3:#2fb98d; --l4:#a47ce6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
a{color:var(--s1);text-decoration:none} a:hover{text-decoration:underline}
header{padding:18px 22px 0}
h1{font-size:21px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:12.5px}
nav{position:sticky;top:0;z-index:5;background:var(--page);display:flex;gap:4px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--grid)}
nav button{border:1px solid var(--border);background:var(--surface);color:var(--ink2);padding:6px 13px;border-radius:18px;font:600 13px system-ui;cursor:pointer}
nav button.on{background:var(--s1);border-color:var(--s1);color:#fff}
main{padding:16px 22px 40px;max-width:1280px}
section{display:none} section.on{display:block}
h2{font-size:16px;margin:20px 0 8px}
h3{font-size:14px;margin:16px 0 6px}
p{margin:8px 0}
.mut{color:var(--mut);font-size:12px}
.k{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:132px;flex:1 1 132px}
.tile b{display:block;font-size:21px;line-height:1.2}
.tile span{color:var(--ink2);font-size:12px}
.box{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--good);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px}
.box.warn{border-left-color:var(--crit)}
.box.info{border-left-color:var(--s1)}
.box.amber{border-left-color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;min-width:0}
.card h3{margin-top:0}
.card p,.card li,.box{overflow-wrap:anywhere}
a.src{overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:8px 0;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--chip);text-align:left;font-size:11.5px;color:var(--ink2);white-space:nowrap;position:sticky;top:0}
th,td{padding:6px 9px;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:0}
td b{font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;background:var(--chip);border-radius:9px;padding:1px 8px;font-size:11px;color:var(--ink2);margin:1px 2px 1px 0;white-space:nowrap}
.lot1{background:var(--l1);color:#fff}.lot2{background:var(--l2);color:#fff}.lot3{background:var(--l3);color:#fff}.lot4{background:var(--l4);color:#fff}
.lot0{background:var(--chip);color:var(--ink2);border:1px dashed var(--axis)}
.tierA{color:var(--good);font-weight:700}.tierB{color:var(--warn);font-weight:700}.tierC{color:var(--crit);font-weight:700}
.hi{color:var(--crit);font-weight:700}.mid{color:var(--warn);font-weight:700}.lo{color:var(--ink2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.filters input,.filters select{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font:13px system-ui;max-width:100%}
.filters input[type=text]{min-width:min(240px,100%)}
.count{color:var(--ink2);font-size:12px;margin-left:auto}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);padding:6px 12px;border-radius:8px;font:600 12px system-ui;cursor:pointer}
.btn.on{background:var(--s1);border-color:var(--s1);color:#fff}
ul,ol{margin:6px 0;padding-left:20px} li{margin:3px 0}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin:10px 0}
.step{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 11px;flex:1 1 190px;min-width:0;border-top:3px solid var(--axis)}
.step.bi{border-top-color:var(--s1)}
.step b{font-size:12.5px;display:block;margin-bottom:3px}
.step .mut{font-size:11px}
.tl{border-left:2px solid var(--grid);margin-left:9px;padding-left:16px}
.tl .ev{position:relative;margin:0 0 14px}
.tl .ev::before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--axis);border:2px solid var(--page)}
.tl .ev.now::before{background:var(--s1)}
.tl .ev h3{margin:0 0 2px}
.rng{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.rng label{font-size:12.5px;color:var(--ink2);min-width:min(230px,100%)}
.rng input[type=range]{flex:1 1 160px;min-width:120px;accent-color:var(--s1)}
.rng output{font-variant-numeric:tabular-nums;font-weight:700;min-width:56px;text-align:right}
.bar{height:9px;border-radius:5px;background:var(--chip);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--s1)}
footer{padding:0 22px 24px;color:var(--mut);font-size:11.5px;max-width:1280px}
@media (max-width:700px){
  main,header,nav,footer{padding-left:12px;padding-right:12px}
  h1{font-size:18px} .tile b{font-size:18px}
}
</style>
</head>
<body>
<header>
  <h1>ОВЭ-75 — обжиг · выщелачивание · электроэкстракция</h1>
  <div class="sub">АО «Кольская ГМК», г. Мончегорск · комплекс на 75 000 т катодной меди в год · разбор тендерного пакета Базового инжиниринга (ТЗ v3.6 + приложения №1–7). Сборка: __BUILT_AT__</div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const P = __PROJECT_JSON__;
const LOTS = __LOTS_JSON__;
const EQ = __EQUIP_JSON__;
const FLOW = __FLOW_JSON__;
const RES = __RES_JSON__;
const AUTO = __AUTO_JSON__;
const WORLD = __WORLD_JSON__;
const CHINA = __CHINA_JSON__;
const TENDER = __TENDER_JSON__;
const CAPEX = __CAPEX_JSON__;
const SUP = __SUP_JSON__;
const BX = __BITRIX_JSON__;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n,d=0) => (n===''||n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
/* **жирный** в текстах данных — единственная разметка, которую пропускаем */
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const lotTag = n => n===0||n===null||n===undefined ? '<span class="tag lot0">вне БИ</span>'
  : (n===9 ? '<span class="tag">все лоты</span>' : `<span class="tag lot${n}">Лот №${n}</span>`);
const lotName = n => (LOTS.lots.find(l=>l.id===n)||{}).name || 'Вне БИ';
/* ссылка на источник: показываем хост, а не полный URL — длинные URL рвут вёрстку на узких экранах */
function srcLink(u){
  if(!/^https?:/.test(String(u||''))) return esc(u);
  let host = u; try{ host = new URL(u).hostname.replace(/^www\./,''); }catch(e){}
  return `<a class="src" href="${esc(u)}" target="_blank" rel="noopener">${esc(host)}</a>`;
}

/* ================= Обзор ================= */
function rOverview(){
  const feed = P.feed.map(f=>`<tr><td><b>${esc(f.name)}</b><div class="mut">${esc(f.source)}</div></td>
    <td class="num">${nf(f.t_year)}</td><td>${esc(f.chem)}</td><td>${esc(f.moisture)}</td><td>${esc(f.transport)}</td></tr>`).join('');
  const bi = LOTS.objects.filter(o=>o.bi).length, tot = LOTS.objects.length;
  return `
  <div class="k">
    <div class="tile"><b>75 000 т</b><span>катодной меди М00к в год</span></div>
    <div class="tile"><b>4</b><span>лота Базового инжиниринга</span></div>
    <div class="tile"><b>${bi} из ${tot}</b><span>объектов требуют БИ</span></div>
    <div class="tile"><b>180</b><span>электролизных ванн</span></div>
    <div class="tile"><b>107,9 тыс. т</b><span>сырья в год (сух.)</span></div>
    <div class="tile"><b>2–3 ТКП</b><span>на каждую позицию оборудования</span></div>
  </div>
  <div class="box info"><b>Что это за проект.</b> ${esc(P.title)}. Заказчик — ${esc(P.customer)}, генеральный проектировщик — ${esc(P.genproject)}. ${esc(P.executor)}. Шифр проекта: <b>${esc(P.code)}</b>.</div>
  <div class="box amber"><b>Первый этап — торги за Базовый инжиниринг.</b> Разыгрывается четырьмя лотами: Цех обжига, Участок купоросов, Отделение электроэкстракции, Склад готовой продукции. Разбор требований и план подготовки — на вкладке «Торги за БИ».</div>

  <h2>Технологическая цепочка</h2>
  <div class="flow">${FLOW.chain.map(c=>`<div class="step ${c.bi?'bi':''}">
    <b>${esc(c.area)}</b>${c.lot?lotTag(c.lot):'<span class="tag lot0">вне БИ</span>'}
    <div class="mut">${c.ops.length} операц${c.ops.length===1?'ия':(c.ops.length<5?'ии':'ий')}</div></div>`).join('')}</div>
  <div class="mut">Синяя рамка сверху — объект входит в периметр Базового инжиниринга. Подробности по каждому — вкладка «Блоки и лоты».</div>

  <h2>Сырьё</h2>
  <div class="tblwrap"><table><thead><tr><th>Компонент / источник</th><th>т/год (сух.)</th><th>Химический состав, %</th><th>Влажность</th><th>Как поступает</th></tr></thead>
  <tbody>${feed}</tbody></table></div>
  <div class="mut">Медный концентрат ОРФ: ${nf(P.feed[0].to_roast_t_year)} т/год идёт на шихту для обжига, ${nf(P.feed[0].bypass_t_year)} т/год — в Гидрометаллургический цех без обжига.</div>

  <h2>Продукция</h2>
  <div class="grid">
    <div class="card"><h3>${esc(P.product.name)}</h3>
      <p>${esc(P.product.grade)}</p>
      <p class="mut">Мощность: <b>${nf(P.product.capacity_t_year)} т/год</b>. SEN ${esc(P.product.sen)}. Сумма примесей по ГОСТ ${esc(P.product.impurities_sum_gost)}.</p>
      <p class="mut">Ожидаемые примеси: ${esc(P.product.impurities_expected)}</p></div>
    ${P.byproducts.map(b=>`<div class="card"><h3>${esc(b.name)}</h3><p>→ ${esc(b.dest)}</p><p class="mut">${esc(b.note)}</p></div>`).join('')}
  </div>

  <h2>Площадка строительства</h2>
  <div class="grid">
    <div class="card"><h3>Климат и нагрузки</h3><ul>
      <li>Строительно-климатическая зона: ${esc(P.site.climate_zone)}</li>
      <li>Температура наиболее холодных суток: ${esc(P.site.t_cold_day_098)} (обесп. 0,98) / ${esc(P.site.t_cold_day_092)} (0,92)</li>
      <li>Наиболее холодная пятидневка: ${esc(P.site.t_cold_5day_098)} (0,98) / ${esc(P.site.t_cold_5day_092)} (0,92)</li>
      <li>Отопительный период: ${esc(P.site.heating_period)}</li>
      <li>Снег: ${esc(P.site.snow)}</li>
      <li>Ветер: ${esc(P.site.wind)}</li>
      <li>Сейсмичность: ${esc(P.site.seismic)}</li>
      <li>Грунты: ${esc(P.site.soils)}</li>
    </ul></div>
    <div class="card"><h3>Расположение и ограничения</h3>
      <p>${esc(P.location)}</p>
      <p class="mut">${esc(P.site.geomorphology)}</p>
      <p><b>${esc(P.site.grid)}</b></p>
      <h3>Режимы работы</h3><ul>${P.regimes.map(r=>`<li><b>${esc(r.unit)}</b>: ${r.days} дней/год, ${nf(r.hours)} ч — ${esc(r.note)}</li>`).join('')}</ul>
      <p class="mut">${esc(P.losses)}</p></div>
  </div>

  <h2>Предыстория проекта</h2>
  ${P.background.map(b=>`<div class="box">${md(b)}</div>`).join('')}
  <h3>Документы-предшественники, на которые опираются ИД</h3>
  <ul class="mut">${P.history_refs.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>

  <h2>Состав тендерного пакета</h2>
  <div class="tblwrap"><table><thead><tr><th>№</th><th>Приложение</th><th>Что внутри</th></tr></thead>
  <tbody>${LOTS.appendices.map(a=>`<tr><td><b>${esc(a.n)}</b></td><td>${esc(a.name)}</td><td class="mut">${esc(a.note)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ================= Этапы ================= */
const STAGES = __STAGES_JSON__;
function rStages(){
  return `
  <div class="box info">${esc(STAGES.note)}</div>
  <h2>Жизненный цикл проекта</h2>
  <div class="tl">${STAGES.stages.map(s=>`<div class="ev ${s.now?'now':''}">
    <h3>${s.n}. ${esc(s.name)} <span class="tag">${esc(s.code)}</span>${s.now?'<span class="tag lot3">сейчас</span>':''}</h3>
    <p>${esc(s.definition)}</p>
    ${s.who?`<p class="mut"><b>Кто:</b> ${esc(s.who)}</p>`:''}
    ${s.output?`<p class="mut"><b>На выходе:</b></p><ul class="mut">${s.output.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}
    ${s.handover?`<p class="mut"><b>Передача:</b> ${esc(s.handover)}</p>`:''}
    ${s.risk?`<div class="box warn" style="margin:6px 0"><b>Риск:</b> ${esc(s.risk)}</div>`:''}
  </div>`).join('')}</div>

  <h2>Как устроен сам этап БИ — от ИД до сдачи</h2>
  <div class="tblwrap"><table><thead><tr><th>Шаг</th><th>Содержание</th></tr></thead>
  <tbody>${STAGES.bi_workflow.map((w,i)=>`<tr><td><b>${i+1}. ${esc(w.step)}</b></td><td>${esc(w.what)}</td></tr>`).join('')}</tbody></table></div>

  <h2>Прочие условия ТЗ</h2>
  ${LOTS.other_terms.map(t=>`<div class="box">${esc(t)}</div>`).join('')}`;
}

/* ================= Блоки и лоты ================= */
function rBlocks(){
  const obj = LOTS.objects.map(o=>`<tr>
    <td>${esc(o.n)}</td>
    <td><b>${esc(o.name)}</b>${o.parts?`<div class="mut">${o.parts.map(esc).join(' · ')}</div>`:''}</td>
    <td>${esc(o.build)}</td>
    <td>${o.bi?lotTag(o.lot):'<span class="mut">не требуется</span>'}</td></tr>`).join('');
  const lots = LOTS.lots.map(l=>`<div class="card" id="lot${l.id}">
    <h3>${lotTag(l.id)} ${esc(l.name)} <span class="tag">${esc(l.tag)}</span></h3>
    <p class="mut">Режим: ${esc(l.regime)}</p>
    <p>${md(l.scope)}</p>
    <h3>Участки</h3><ul>${l.areas.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
    <div class="grid2">
      <div><h3>Вход</h3><ul class="mut">${l.feed.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
      <div><h3>Выход</h3><ul class="mut">${l.products.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
    </div>
    <h3>Границы проектирования</h3>
    <div class="tblwrap"><table><thead><tr><th>№</th><th>Продукт / ресурс</th><th>Граница</th></tr></thead>
      <tbody>${l.boundaries.map(b=>`<tr><td>${esc(b.n)}</td><td>${esc(b.item)}</td><td class="mut">${esc(b.border)}</td></tr>`).join('')}</tbody></table></div>
    ${l.special?`<div class="box amber"><b>Особое требование:</b> ${md(l.special)}</div>`:''}
    ${l.pack_req?`<div class="box"><b>Требование сбыта:</b> ${esc(l.pack_req)}</div>`:''}
    ${l.not_in_bi?`<div class="box warn"><b>НЕ входит в состав БИ по этому лоту</b> (приведено в ТЗ для сведения Исполнителя): ${l.not_in_bi.map(esc).join(' · ')}</div>`:''}
    ${l.extra_pz&&l.extra_pz.length?`<h3>Сверх общего состава — пояснительная записка</h3><ul>${l.extra_pz.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${l.extra_gr&&l.extra_gr.length?`<h3>Сверх общего состава — графическая часть</h3><ul>${l.extra_gr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${l.no_pid?`<div class="mut">Единственный лот, для которого ТЗ не требует P&amp;ID.</div>`:''}
  </div>`).join('');

  return `
  <h2>Перечень объектов комплекса</h2>
  <div class="tblwrap"><table><thead><tr><th>№ п/п</th><th>Объект</th><th>Строительство</th><th>Базовый инжиниринг</th></tr></thead>
  <tbody>${obj}</tbody></table></div>

  <h2>Технологическая цепочка по операциям</h2>
  ${FLOW.chain.map(c=>`<div class="card">
    <h3>${esc(c.area)} ${c.lot?lotTag(c.lot):'<span class="tag lot0">вне БИ</span>'}</h3>
    <ol>${c.ops.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></div>`).join('')}

  <h2>Материальные потоки между переделами</h2>
  <div class="tblwrap"><table><thead><tr><th>Откуда</th><th>Куда</th><th>Что</th><th>Количество / граница</th></tr></thead>
  <tbody>${FLOW.streams.map(s=>`<tr${s.key?' style="font-weight:600"':''}><td>${esc(s.from)}</td><td>${esc(s.to)}</td><td>${esc(s.what)}</td><td class="mut">${esc(s.qty)}</td></tr>`).join('')}</tbody></table></div>

  <h2>Лоты Базового инжиниринга</h2>
  ${lots}

  <h2>Общий состав БИ — одинаков для всех лотов</h2>
  <div class="grid2">
    <div class="card"><h3>Пояснительная записка</h3><ul>${LOTS.common_pz.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="card"><h3>Графическая часть и приложения</h3><ul>${LOTS.common_gr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  </div>
  <div class="card"><h3>Стоимость поставки — требуется по каждому лоту</h3><ul>${LOTS.cost_req.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`;
}

/* ================= Оборудование ================= */

/* ================= CAPEX ================= */
const CP = {fx:CAPEX.params.fx.value, lang:CAPEX.params.lang.value, cont:CAPEX.params.cont.value};
function capexCalc(){
  const eq = CAPEX.equipment.reduce((a,e)=>({low:a.low+e.low, base:a.base+e.base, high:a.high+e.high}), {low:0,base:0,high:0});
  const direct = CAPEX.nonequip.filter(n=>n.mode==='direct')
    .reduce((a,n)=>({low:a.low+n.low, base:a.base+n.base, high:a.high+n.high}), {low:0,base:0,high:0});
  const out = {};
  for(const k of ['low','base','high']){
    const eqInst = eq[k]*CP.lang;              // оборудование → смонтированный объект
    const tic = eqInst + direct[k];            // + прямые строительные и сетевые затраты
    let soft = 0;
    for(const n of CAPEX.nonequip){
      if(n.mode==='pct_tic') soft += tic*n.pct/100;
      if(n.mode==='pct_eq')  soft += eq[k]*n.pct/100;
    }
    const sub = tic + soft;
    out[k] = {eq:eq[k], eqInst, direct:direct[k], tic, soft, sub, cont:sub*CP.cont/100, total:sub*(1+CP.cont/100)};
  }
  return out;
}

    perT<8000 ? 'Ниже ориентира — ожидаемо: ОВЭ-75 не строит плавку и частично использует существующие здания ЦЭМ и ГМУ.'
  : perT<12000 ? 'Внутри ориентира. Для проекта без плавки и с частичным использованием существующих зданий это скорее верхняя граница разумного — стоит перепроверить коэффициент обвязки и строительные строки.'
  : 'Выше ориентира — при таких параметрах модель почти наверняка завышает. Проверьте коэффициент обвязки, строительные строки и резерв.'}</div>`;
}
function rCapex(){
  const d = CAPEX.disclaimer;
  const byLot = {};
  CAPEX.equipment.forEach(e=>{byLot[e.lot]=(byLot[e.lot]||0)+e.base});
  const maxLot = Math.max(...Object.values(byLot));
  return `
  <div class="box warn"><b>${esc(d.class)} · точность ${esc(d.accuracy)}.</b> ${esc(d.text)}</div>
  <div class="box info"><b>Метод.</b> ${esc(d.method)} ${esc(d.basis_note)}</div>

  <h2>Параметры расчёта</h2>
  <div class="card">
    ${Object.entries(CAPEX.params).map(([k,p])=>`<div class="rng">
      <label for="cp_${k}">${esc(p.label)}</label>
      <input type="range" id="cp_${k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}">
      <output id="cpo_${k}">${p.value}</output>
    </div><div class="mut" style="margin:-2px 0 8px">${esc(p.note)}</div>`).join('')}
  </div>

  <h2>Результат</h2>
  <div id="cpres"></div>

  <h2>Структура стоимости оборудования по лотам</h2>
  <div class="tblwrap"><table><thead><tr><th>Лот</th><th>Оборудование, млн $ (база)</th><th></th></tr></thead>
  <tbody>${Object.entries(byLot).sort((a,b)=>b[1]-a[1]).map(([l,v])=>`<tr>
    <td>${lotTag(Number(l))} ${esc(lotName(Number(l)))}</td><td class="num"><b>${nf(v,1)}</b></td>
    <td style="width:40%"><div class="bar"><i style="width:${v/maxLot*100}%"></i></div></td></tr>`).join('')}</tbody></table></div>

  <h2>Оборудование — построчно</h2>
  <div class="tblwrap"><table><thead><tr>
    <th>Лот</th><th>Позиция</th><th>Кол-во</th><th>Низ</th><th>База</th><th>Верх</th><th>Уверенность</th><th>Основание</th>
  </tr></thead><tbody>${CAPEX.equipment.map(e=>`<tr${e.key?' style="font-weight:600"':''}>
    <td>${lotTag(e.lot)}</td><td>${esc(e.name)}${e.optional?' <span class="tag">опция</span>':''}</td><td>${esc(e.qty)}</td>
    <td class="num">${nf(e.low,1)}</td><td class="num">${nf(e.base,1)}</td><td class="num">${nf(e.high,1)}</td>
    <td class="${e.conf==='высокая'?'tierA':(e.conf==='средняя'?'tierB':'tierC')}">${esc(e.conf)}</td>
    <td class="mut">${esc(e.basis)}</td></tr>`).join('')}</tbody></table></div>
  <div class="mut">Суммы в млн долларов США. «Уверенность» — насколько надёжна оценка до получения ТКП.</div>

  <h2>Затраты помимо оборудования</h2>
  <div class="tblwrap"><table><thead><tr><th>Статья</th><th>Способ счёта</th><th>Значение</th><th>Основание</th></tr></thead>
  <tbody>${CAPEX.nonequip.map(n=>`<tr><td><b>${esc(n.name)}</b></td>
    <td>${n.mode==='direct'?'прямая сумма':(n.mode==='pct_tic'?'% от стоимости строительства':'% от стоимости оборудования')}</td>
    <td class="num">${n.mode==='direct'?`${nf(n.low,0)} … <b>${nf(n.base,0)}</b> … ${nf(n.high,0)} млн $`:`<b>${n.pct} %</b>`}</td>
    <td class="mut">${esc(n.basis)}</td></tr>`).join('')}</tbody></table></div>

  <h2>Что в модель не входит</h2>
  <ul>${CAPEX.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`;
}

/* ================= Автоматизация (в составе «Этапов») ================= */
function rAuto(){
  return `
  <div class="box info"><b>Источник:</b> ${esc(AUTO.source)}</div>
  <div class="box amber"><b>${esc(AUTO.ml_requirement.title)}.</b> ${esc(AUTO.ml_requirement.text)} <span class="mut">${esc(AUTO.ml_requirement.source)}</span></div>

  <h2>Системы, которые надо предусмотреть</h2>
  ${AUTO.systems.map(s=>`<div class="card"><h3>${esc(s.code)} — ${esc(s.name)}</h3>
    <p class="mut">Структура: ${esc(s.structure)}</p>
    ${s.levels.length?`<div class="tblwrap"><table><thead><tr><th>Уровень</th><th>Состав и функции</th></tr></thead>
      <tbody>${s.levels.map(l=>`<tr><td><b>${esc(l.lvl)}</b></td><td>${esc(l.what)}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${s.functions.length?`<h3>Функции</h3><ul>${s.functions.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    <h3>Ключевые требования</h3><ul>${s.key_reqs.map(f=>`<li>${md(f)}</li>`).join('')}</ul></div>`).join('')}

  <h2>Электропитание</h2><ul>${AUTO.power.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <h2>Защита от внешних воздействий и шкафное оборудование</h2><ul>${AUTO.protection.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <h2>Сетевое оборудование</h2><ul>${AUTO.network.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <h2>Документация по автоматизации</h2><ul>${AUTO.docs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <h2>Метрологическое обеспечение</h2><ul>${AUTO.metrology.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <div class="mut">Утверждённые Заказчиком производители — на вкладке «Поставщики».</div>`;
}

/* ================= Каркас ================= */
const TABS = [
  ['overview','Обзор'], ['stages','Этапы'], ['blocks','Блоки и лоты'], ['equip','Оборудование'],
  ['sup','Поставщики'], ['auto','Автоматизация'], ['world','Мировой опыт'], ['china','Китай'],
  ['tender','Торги за БИ'], ['capex','Стройка · CAPEX']
];
const R = {overview:rOverview, stages:rStages, blocks:rBlocks, equip:rEquip, sup:rSup,
           auto:rAuto, world:rWorld, china:rChina, tender:rTender, capex:rCapex};
const nav = document.getElementById('nav'), main = document.getElementById('main');
nav.innerHTML = TABS.map(([id,t])=>`<button data-t="${id}">${esc(t)}</button>`).join('');
main.innerHTML = TABS.map(([id])=>`<section id="s-${id}"></section>`).join('');
document.getElementById('foot').innerHTML =
  `Разбор тендерного пакета «ТЗ на БИ ОВЭ-75 v.3.6» и приложений №1–7 (ИД ч.1 и ч.2, электроснабжение, ЦИМ, ОАСУ, здания ЦЭМ и ГМУ). ` +
  `Технологические данные — из документов Заказчика и ИД ООО «Институт Гипроникель». Внешние факты о компаниях проверены 13.08.2026 и снабжены ссылками. ` +
  `Оценка CAPEX — модель порядка величины, не смета. Сборка: __BUILT_AT__`;

const rendered = {};
function bindEquip(){
  const q=document.getElementById('eqq'), s=document.getElementById('eqlot'), k=document.getElementById('eqkey');
  q.addEventListener('input', ()=>{eqFilter.q=q.value; eqPaint();});
  s.addEventListener('change', ()=>{eqFilter.lot=s.value; eqPaint();});
  k.addEventListener('click', ()=>{eqFilter.key=!eqFilter.key; k.classList.toggle('on',eqFilter.key); eqPaint();});
  eqPaint();
}
function bindCapex(){
  for(const key of Object.keys(CAPEX.params)){
    const el=document.getElementById('cp_'+key), out=document.getElementById('cpo_'+key);
    el.addEventListener('input', ()=>{ CP[key]=Number(el.value); out.textContent=el.value; capexPaint(); });
  }
  capexPaint();
}
function show(id){
  for(const [tid] of TABS){
    document.querySelector(`[data-t="${tid}"]`).classList.toggle('on', tid===id);
    document.getElementById(`s-${tid}`).classList.toggle('on', tid===id);
  }
  if(!rendered[id]){
    document.getElementById(`s-${id}`).innerHTML = R[id]();
    rendered[id]=1;
    if(id==='equip') bindEquip();
    if(id==='capex') bindCapex();
  }
  location.hash = id;
  window.scrollTo(0,0);
}
nav.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.t); });
show(TABS.some(([id])=>id===location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
</script>
</body>
</html>
