kind":"факт"},{"fact":"Юридическое правопреемство от Hatch отсутствует: Дельта учреждена физлицами, Hatch Pty Ltd в составе владельцев нет; переход — де-факто (команда, офисы, компетенции), а не де-юре. Формальных документов о передаче бизнеса открытыми источниками не подтверждено.","src":"не подтверждено (вывод из данных ЕГРЮЛ-карточек РБК/СБИС)","checked":"2026-08-13","kind":"оценка"},{"fact":"Биографии учредителей (Сирач, Елькин) в связке с Hatch открытыми источниками не подтверждены — только общее заявление сайта Дельты о происхождении команды из Хэтч.","src":"не подтверждено","checked":"2026-08-13","kind":"факт"},{"fact":"Численность «среднесписочная 1 сотрудник» в карточке РБК относится к головному юрлицу и расходится с заявленными 120+; вероятно, штат оформлен в филиале/по договорам — реальный масштаб команды ближе к заявленному, судя по выручке ~865 млн руб.","src":"https://companies.rbc.ru/id/1227700758438-...","checked":"2026-08-13","kind":"оценка"},{"fact":"Не путать с однофамильцами: ООО «Дельта Инжиниринг» (Челябинск, КИПиА), ООО «Дельта Инжиниринг» (Москва, ИНН 9724090943, торговля) — другие компании, к конкуренту отношения не имеют.","src":"https://www.rusprofile.ru/id/1227700432222","checked":"2026-08-13","kind":"факт"}],"hatch":[{"fact":"Hatch Ltd — частная инжиниринговая компания (штаб-квартира Миссиссога, Канада; основана в 1955), ~10 000 сотрудников (2023), 70+ офисов; сектора: горная металлургия, энергетика, инфраструктура; в металлургии — медь, никель, алюминий, золото, железо, литий; клиенты Rio Tinto, Vale, Barrick.","src":"https://en.wikipedia.org/wiki/Hatch_Ltd","checked":"2026-08-13"},{"fact":"ООО «Хэтч Инжиниринг и Консалтинг» (ИНН 7702647722, ОГРН 1077758247808) — российская дочка Hatch с 2007 г.; 99,9% у Hatch Pty Ltd (Австралия); персонал сократился с 99 чел. (2022) до 1 чел. (2025).","src":"https://spark-interfax.ru/moskva-tverskoi/ooo-khetch-inzhiniring-i-konsalting-inn-7702647722-ogrn-1077758247808-977f87fd20de434c9f607a77d30680c5","checked":"2026-08-13"},{"fact":"Официальный уход из РФ (заявление Hatch от 06.09.2023, портал Leave Russia, статус «clean break»): до вторжения — несколько сотен сотрудников в двух офисах; офис СПб закрыт навсегда, московский — только до завершения расчётов; остался 1 сотрудник; намерения возвращаться нет.","src":"https://leave-russia.org/hatch-ltd","checked":"2026-08-13"},{"fact":"Медь/электрометаллургия Hatch: услуги по EW/ER-цехам — диагностика танк-хаусов, компоновка ванн, ошиновка и контактные системы, вентиляция, краны, обучение, EPCM; фирменные технологии HELM Tracker™ (поиск коротких замыканий) и HELM Director (планирование съёма/обслуживания).","src":"https://www.hatch.com/Expertise/Services-and-Technologies/Electrometallurgy","checked":"2026-08-13"},{"fact":"Референс Hatch по медному электролизу: Tenke Fungurume (Freeport-McMoRan, ДР Конго, 2011–2012) — детальный инжиниринг, закупки и сопровождение строительства расширения, включая новый электролизный цех (EW tankhouse); рост производства меди со 125 до 190 тыс. т/год, кобальта с 10 до 20 тыс. т/год.","src":"https://www.hatch.com/projects/metals-and-minerals/tenke-fungurume-mine","checked":"2026-08-13"},{"fact":"Kamoa-Kakula (Ivanhoe Mines, ДРК): Hatch выполняла независимый аудит углеродных метрик проекта (2020). Участие Hatch в проектировании самого медеплавильного завода Kamoa открытыми источниками не подтверждено.","src":"https://www.ivanhoemines.com/news-stories/news-release/kamoa-kakulas-off-take-agreements-signed-for-phase-1-blister-copper-and-copper-concentrate/","checked":"2026-08-13"},{"fact":"Обжиг в кипящем слое: у Hatch есть собственные разработки печей КС (например, демонстрационный обжиговый аппарат для золотых концентратов DST, техдоклад 2014) — компетенция, унаследованная командой; но технология печей КС для цинка/меди исторически ассоциирована с Metso/Outotec и Lurgi.","src":"https://www.hatch.com/About-Us/Publications/Technical-Papers/2014/09/Gold-Concentrate-Roaster-for-Sulphur-Carbon-and-Arsenic-Removal","checked":"2026-08-13"},{"fact":"Важно: после «clean break» референсы, лицензии, софт и библиотеки Hatch формально Дельте не принадлежат — предъявлять проекты Hatch как свои она может только через персональный опыт сотрудников (оценка).","src":"https://leave-russia.org/hatch-ltd","checked":"2026-08-13"}],"strength":["Печь КС Лота №1 — их разработка (ИД ч.1): конструктив зафиксирован в обязательных исходных данных","Ванны Лота №3 — их разработка (Приложение В, документ D202415-PM032-240-242-0001)","Фонд рабочего времени проекта опирается на их отчёт OVE-D-HATCH-PM-REP-00003-R","Автор конструкции ванн, вшитой в тендерные ИД: Приложение В — её документ D202415-PM032-240-242-0001 (ред. 1, 14.04.2025), характеристики «согласованы с Заказчиком». По позиции «ванны» Лота №3 ей не нужно ничего разрабатывать — всё уже сделано и оплачено предыдущим договором.","Инсайдерское знание проекта: в ОВЭ с 2019 г. (ТЭП, оценка технологии и капзатрат, электроэкстракция, ГД-моделирование печи КС); на руках полный комплект проекта D202415 (схемы, 3D, расчёты), которого нет у других участников.","Работающие отношения с Заказчиком: два проекта для КГМК (ОВЭ 2019–2025 и диверсификация никеля 2021–2023), плюс Норникель в списке клиентов; знакомые Заказчику люди и стандарты документации (шифры, формат ИТ).","Наследие Hatch: методология мирового уровня по EW-цехам (диагностика танк-хаусов, ошиновка, вентиляция, краны — Tenke Fungurume и др.), Mine-to-Mill, цифровое моделирование (CFD/DEM/FEM); 120+ инженеров.","Заявленные патенты на ванны электроэкстракции и полимербетонные технологии: могут одновременно быть их ТКП на изготовление ванн и юридическим рычагом против чужих копий их конструкции (оценка)."],"weakness":["Молодое юрлицо со слабым балансом: регистрация 15.11.2022, УК 100 тыс. руб., прибыль ~0,2 млн руб. при выручке ~865 млн руб. — почти нулевая маржа; банковские гарантии и обеспечение по крупному БИ с поставкой могут стать проблемой (оценка по данным карточки РБК).","Разрыв с глобальной Hatch: «clean break», референсы/лицензии/софт Hatch формально не их; корпоративного бэкапа мировой компании больше нет.","Портфель последних лет (под брендом Дельта) смещён в ГОКи, золото и железо (Стойленский, Ковдор, Быстринское, Гросс, Суздаль); реализованных электролизных цехов «под ключ» после 2022 г. в открытых источниках не видно.","По Лотам №1 (обжиг+фильтрация), №2 (купоросы: выпарка/кристаллизация в Hastelloy G-35/904L) и №4 (склад ГП) встроенного преимущества нет: технологию держат Заказчик и институт-разработчик ИД, а печи КС — не фирменная поляна Дельты.","Позиция «архитектора ИД» уязвима процедурно: участие разработчика части исходных данных в конкурсе по этим же ИД — классический конфликт интересов, который другие участники вправе поднять в разъяснениях (оценка).","Кадровая концентрация: компетенция — это конкретные люди экс-Hatch; уход нескольких ключевых инженеров (электрометаллургия) ослабляет их сильнее, чем крупную компанию (оценка)."],"implications":[{"title":"По ваннам Лота №3 преимущество Дельты решающее — но лот шире ванн","text":"Конструкция ванн задана её проектом и «согласована с Заказчиком» — конкурировать «другой ванной» бессмысленно и запрещено логикой ИД. Однако по ТЗ в Лот №3 входят также КСМ, спецкраны с позиционированием, ошиновка, укрытия, аноды/матрицы, АСУ электроэкстракции и компоновка в существующем корпусе ЦЭМ (2 серии × 90 ванн, шаг колонн 24 м) — по этим позициям у Дельты нет эксклюзива, а требования к роботизации (машинное зрение, реестр матриц, автоматический пробоотбор) написаны нейтрально."},{"title":"Конфликт интересов есть, но опираться на него надо аккуратно","text":"Формально автор Приложения В играет в конкурсе, где его же документ — часть задания: это информационная асимметрия (у него весь проект D202415, у остальных — только «исходные требования»). Опора: письменные запросы разъяснений с требованием выдать всем участникам полный комплект по ваннам (чертежи, 3D, спецификации, АТС D202415-24000-210-282-0001) и подтвердить обязательность характеристик Прил. В для всех. Лобовая атака «отстраните Дельту» контрпродуктивна: Заказчик сам вложил её документ в ИД — значит, её участие его устраивает (оценка)."},{"title":"Ванны как «данность» снимают с нас проектный риск — и это можно продать","text":"Раз конструкция ванн принята Заказчиком, ответственность за неё несёт принятое решение Заказчика, а не Исполнитель БИ. Наша оферта может прямо фиксировать: ванны — по Приложению В ИД (référence design), наша ценность — интеграция: компоновка, краны/КСМ, ошиновка с двойным контактом, аспирация, АСУ, стоимость. Это превращает их козырь в общую спецификацию (оценка)."},{"title":"Реальные шансы на победу — Лоты №1, №2, №4 и ценовая игра по №3","text":"По обжигу (печь КС, фильтрация), купоросному участку (выпарка/кристаллизация, спецстали) и складу ГП у Дельты нет вшитых решений в ИД — там конкуренция по компетенции и цене. По Лоту №3 их слабое место — экономика: почти нулевая маржа и потребность в обеспечении; агрессивная, но обоснованная цена с 2–3 реальными ТКП изготовителей ванн по заданной геометрии (включая производителей КНР, прямо перечисленных в ИД) бьёт по ним больнее всего (оценка)."}],"our_moves":[{"n":1,"title":"Выравнять информационное поле по ваннам","text":"В окно разъяснений письменно запросить у организатора полный комплект проекта Дельты по электроэкстракции: чертежи ванн, 3D, спецификации, аппаратурно-технологическую схему D202415-24000-210-282-0001 (она указана в Прил. В как источник) и подтверждение, что характеристики Прил. В обязательны для всех участников. Каждый невыданный документ — фиксируем как асимметрию."},{"n":2,"title":"Принять ванну Дельты как спецификацию и обвязать её лучше","text":"Оферта по Лоту №3: ванны строго по Прил. В (полимербетон, 84 катода/85 анодов, 8485×1155×1650, 280 А/м2), 2–3 независимых ТКП изготовителей по этой геометрии (включая названных в ИД производителей КНР — Sichuan Precision/copperepc и др., плюс российские полимербетонщики); центр тяжести предложения — КСМ, спецкраны, ошиновка с двойным контактом, аспирация, АСУ (нагрузки, шунтирование, реестр матриц) и компоновка в существующем ЦЭМ."},{"n":3,"title":"Патентная разведка до подачи","text":"Заказать поиск по ФИПС: патентообладатель «Дельта Инжиниринг и Консалтинг» (сайт заявляет патенты на ванны электроэкстракции; в выдаче мелькают «способ изготовления полимербетонной ванны» и «способ удаления шлама»). Понять, что именно закрыто: если запатентован способ изготовления — изготовитель ванн по их геометрии должен иметь обходную технологию или лицензию; заложить это в ТКП и в риски."},{"n":4,"title":"Максимум ресурсов — на Лоты №1, №2, №4","text":"Собрать сильные референсы и партнёрства по обжигу в КС (технологические партнёры, ГД-моделирование), выпарке/кристаллизации купоросов (Hastelloy G-35/904L, вакуум-кристаллизация) и автоматизированному складу ГП. Здесь Дельта играет без форы, а мы можем выиграть содержанием."},{"n":5,"title":"Квалификационная атака по надёжности — цифрами, без эмоций","text":"В сравнительных материалах для Заказчика подчёркивать проверяемые вещи: юрлицо конкурента образца 11.2022, УК 100 тыс. руб., прибыль ~0,2 млн руб. при выручке ~865 млн руб. (карточка РБК), формальный разрыв с Hatch («clean break», leave-russia.org) — против нашей финансовой устойчивости и гарантий. Не утверждать ничего сверх открытых данных."},{"n":6,"title":"Мониторинг Дельты до вскрытия","text":"Отслеживать: изменения в ЕГРЮЛ (смена гендиректора на Елькина И.Б. в 01.2026 уже сигнал), новые патенты, вакансии по электролизу/Мончегорску на hh.ru (у них активный работодательский профиль), упоминания в закупках Норникеля. Любая утечка о том, что Дельте отдают Лот №3 без конкурса или с преференцией — повод пересчитать нашу ставку по остальным лотам."}],"publish":true,"publish_note":"Публикуется на закрытом Basic Auth сайте — решение владельца от 13.08.2026. Содержит персональные и финансовые данные из открытых реестров; на открытый ресурс не выносить.","corrections":[{"date":"2026-08-13","text":"Первоначальный вывод «встроенного преимущества у Дельты нет по Лотам №1, №2 и №4» оказался неверным для Лота №1: печь КС спроектирована Hatch, это прямо написано в ИД части 1 в двух местах, плюс фонд рабочего времени опирается на их отчёт. Скорректировано: преимущество конкурента охватывает Лот №1 и Лот №3. Незатронутыми остаются Лоты №2 и №4."}]};
const PARTNER = {"updated":"2026-08-13","decision":"Базовый партнёр — China Nerin Engineering Co., Ltd. (SSE 603257, Наньчан; институт с 1957 г., 1800+ инженеров) вместе со 100% дочкой Jiangxi Nerin Equipment Co., Ltd. Это единственный из кандидатов носитель проверяемого EPC/EPCM-опыта мирового уровня именно по меди: полный EPC медьзавода JCC Guoxing (Яньтай) 180 кт/г катодной меди с электролизом на постоянных нержавеющих катодах (пуск 06.2023), Chifeng Yunnan Copper 400 кт/г (пуск 05.2019), Guixi 1100 кт/г, базовый инжиниринг и EPCM плавзавода Kamoa-Kakula 500 кт/г (ДР Конго, контракт 18.11.2021), AMIN Индонезия 900 кт/г концентрата, Adani Индия 500 кт/г. Их опыт закрывает квалификацию по Лоту 3 (электроэкстракция, КСМ, краны — плюс собственный OEM в группе) полностью и по Лоту 1 частично (газоочистка и сернокислотные переделы подтверждены; печь КС медного концентрата открытыми источниками НЕ подтверждена — в КНР эта технология исторически у ENFI). Тёплый вход уже есть: с Jiangxi Nerin Equipment мы в переписке по спецкранам с 03.04.2026 (Bitrix).\n\nZhuzhou Tianqiao Crane (SZSE 002523) и Jiangxi Tianxin — усилители по оборудованию Лота 3 (спецкраны, КСМ, линии подготовки основ), но не носители квалификации лота: Tianqiao — крановый OEM без EPC-опыта (экспорт в т.ч. в Россию — плюс), Tianxin — малое юрлицо (капитал 24 млн юаней, ~70 сотрудников), финансовые пороги квалификации скорее всего не пройдёт. По Лоту 2 (кристаллизация купоросов) и Лоту 4 (автоматизированный склад готовой продукции) подтверждённого профильного опыта НЕТ ни у одного из кандидатов — это надо признать: под Лот 2 привлекать специализированных поставщиков выпарки/MVR-кристаллизации (Metalcess, Jiangsu Sunevap — tier C, референсы самодекларированные), под Лот 4 заявлять опыт «в составе EPC-проектов» Nerin (оценка, отдельных референсов нет) либо искать отдельного партнёра. Важно: китайский OEM «линии подготовки основ», с которым мы работали (кандидат «б» владельца), по выгрузке Bitrix не идентифицируется — в классе stripper только российский трейдер ООО ТК «ИноксМаркет» (Selected, 26.12.2025); нужно поднять карточку сделки и выяснить фактического производителя линии.\n\nСхему оформлять консорциумом (или генподряд КВАНТ + субподряд партнёра на ту часть работ, к которой привязан его опыт) с письменным согласием партнёра на использование референсов и подтверждающими письмами конечных заказчиков. Главный риск всей схемы — осторожность китайских публичных компаний к структурам Норникеля (КГМК — дочка Норникеля): в январе 2026 г. китайский партнёр вышел из проекта медного завода Норникеля в Китае (Bloomberg, 26.01.2026). Закладывать время на санкционный комплаенс партнёра и держать запасного кандидата.","candidates":[{"name":"China Nerin Engineering Co., Ltd. (中国瑞林工程技术股份有限公司)","role":"EPC","profile":"Инжиниринговая компания полного цикла по цветной металлургии, Наньчан (пров. Цзянси). Происходит из Наньчанского института цветной металлургии (осн. 1957, один из 8 головных отраслевых институтов минметаллургии КНР); современное юрлицо — с 1986 (по Yahoo Finance); IPO на основной площадке Шанхайской биржи 08.04.2025, тикер 603257. 1800+ технических специалистов, 647 патентов (260 изобретений), проекты в 70+ странах. Ключевые компетенции (по собственному сайту): флэш-плавка, боковое дутьё (NGL), электрорафинирование меди, гидрометаллургия меди, сернокислотные производства, автоматизация. Опыт работы в РФ открытыми источниками не подтверждён.","refs":[{"project":"JCC Guoxing (Yantai) Copper — гринфилд-медьзавод","what":"Полный EPC всего передела: side-blown + top-blown + анодные печи + электролиз на постоянных нержавеющих катодах; 180 кт/г катодной меди","year":"пуск 12.06.2023","src":"https://www.nerin.com/html/en/news/2249.html","checked":"2026-08-13"},{"project":"Chifeng Yunnan Copper","what":"Проектирование медьзавода 400 кт/г катодной меди + 1690 кт/г серной кислоты (side-blown + top-blown + анодные печи)","year":"пуск 18.05.2019","src":"http://www.nerin.com/html/en it":{"lot1":"Частично. Газоочистка, утилизация SO2 и сернокислотные цеха подтверждены (Chifeng 1690 кт/г кислоты; Yantai — ионно-жидкостная десульфуризация, глубокая очистка стоков; собственная технология высококонцентрированной конверсии). Но обжиг в печи КС медного концентрата под выщелачивание открытыми источниками НЕ подтверждён: лидер по печам КС в КНР — ENFI (первый роастер 109 м2 в 1992, >90% крупных цинковых заводов КНР; enfi-cemsa.com, проверено 2026-08-13). Оценка: Nerin годится как проектировщик газового тракта/кислоты, печь КС — риск.","lot2":"Не подтверждено. Явных референсов кристаллизации медного/никелевого купороса в открытых источниках нет. Оценка: в составе полных EPC медьзаводов Nerin проектирует узлы очистки электролита (обезмеживание, вывод никеля), но заявлять как профильный опыт лота нельзя без документов от Nerin.","lot3":"Прямое попадание, лучший кандидат. Электролиз на постоянных катодах в составе EPC (Yantai 180 кт/г, 2023), электрорафинирование — заявленная ключевая компетенция, Guixi 1100 кт/г. Оборудование цеха (КСМ, краны, bails) — у 100% дочки Jiangxi Nerin Equipment. Нюанс: Yantai — электрорафинирование, а не электроэкстракция; прямой референс EW-цеха (180 ванн, sulfate EW) запросить у Nerin отдельно.","lot4":"Не подтверждено. Отдельных референсов автоматизированных складов готовой продукции нет; есть общие компетенции «интеллектуализации» производств (самодекларация сайта). Оценка: можно заявить только в составе EPC-объёма."},"tier":"A"},{"name":"Jiangxi Nerin Equipment Co., Ltd. (江西瑞林装备有限公司)","role":"оборудование","profile":"100% дочерняя компания China Nerin Engineering (подтверждено PatSnap и сайтом nerin.com), производственно-исследовательская площадка группы по интеллектуальному металлургическому оборудованию: печь NGL, катодосдирочные машины (КСМ), краны цеха электролиза и bails, литейные машины. Разработчик крупнейшей в мире двухколёсной карусельной литейной машины 26 м, 150 т/ч (введена, новость Nerin 2024). Именно с этим юр 2028","Ключевой персонал под проект: CV главных инженеров проекта (медь, электролиз, обжиг/кислота), численность и владение английским/русским","Опыт РФ/ЕАЭС: выполненные поставки/проекты в РФ (контракты, ГТД), опыт сертификации ТР ТС (EAC), опыт адаптации проектной документации под ГОСТ/СП/ФНП, наличие партнёра-адаптера в РФ; если нет — письменное подтверждение готовности работать под нормоконтролем КВАНТ","Санкционный комплаенс: письменное подтверждение готовности работать с заказчиком контура Норникеля, схема расчётов (CNY), позиция комплаенс-департамента (для публичных компаний — критично)","Согласие на использование референсов и наименования партнёра в составе заявки КВАНТ + проект консорциального соглашения или договора о намерениях (teaming agreement) с распределением объёмов по лотам","Банковские подтверждения: готовность предоставить гарантии исполнения/аванса от банков, приемлемых для заказчика; кредитный рейтинг","HSE-статистика за 3 года (LTIFR, смертельные случаи), политика HSE — если заказчик оценивает подрядчиков по промбезопасности"],"risks":[{"title":"Опыт не у заявителя — риск незачёта квалификации","text":"Заказчики контура Норникеля обычно засчитывают опыт субподрядчика/члена консорциума только при документально оформленной роли этого лица в исполнении договора и на тот объём, к которому опыт относится. Заявка, где КВАНТ — заявитель, а весь опыт — у стороннего китайского партнёра без юридической связки, может быть отклонена по формальному критерию.","action":"Дословно разобрать квалификационные требования конкурсной документации (чей опыт допускается: заявителя, генподрядчика, субподрядчика, консорциума). Оформить консорциум/простое товарищество либо генподряд КВАНТ + номинированный субподрядчик с гарантией выполнения им ключевых работ (инжиниринг передела). Приложить teaming agreement, согласие партнёра и письма конечных заказчиков. В заявке писать роль партнёра явно: «базовый инжиниринг выполняет China Nerin, адаптацию под нормы РФ и общую координацию — КВАНТ»."},{"title":"Осторожность китайских публичных компаний к структурам Норникеля","text":"КГМК — дочка Норникеля. Bloomberg (26.01.2026): китайский партнёр вышел из проекта медного завода Норникеля в Китае; Asia Financial отмечает настороженность китайских компаний из-за санкционного фона. Nerin (SSE 603257, IPO апрель 2025) и Tianqiao (SZSE 002523) — публичные, их комплаенс может запретить или затянуть участие; отказ возможен на поздней стадии.","action":"Начинать с комплаенс-запроса, а не с коммерции: письмо о структуре сделки (расчёты в CNY, договор с КВАНТ, а не с КГМК напрямую), NDA. Параллельно держать запасного партнёра (непубличные OEM: Tianxin, Lufeng). Закладывать 4-8 недель на решение комплаенса партнёра до дедлайна подачи."},{"title":"Нормативный разрыв: проект по нормам РФ (ГОСТ/СП/ФНП)","text":"Опыт работы Nerin/Tianqiao/Tianxin с российской нормативкой открытыми источниками не подтверждён. Базовый инжиниринг, выполненный по китайским GB-нормам без адаптации, не пройдёт экспертизу, а заказчик может потребовать подтверждение такого опыта в квалификации.","action":"В схеме разделения работ закрепить за КВАНТ нормоконтроль, адаптацию и выпуск документации по ГОСТ/СП; запросить у партнёра примеры международных проектов по не-китайским нормам (Kamoa — по стандартам Ivanhoe/международным). В заявке подать это как готовую двухуровневую схему, а не как риск."},{"title":"Слабые звенья по Лотам 1, 2, 4","text":"Факт: ни у одного кандидата нет открыто подтверждённых референсов печей КС для медного концентрата (Лот 1, печь), кристаллизации купоросов (Лот 2) и автоматизированных складов (Лот 4). Печи КС в КНР — компетенция ENFI; кристаллизация — нишевые Metalcess/Sunevap без публичных референс-листов.","action":"По Лоту 1 квалифицироваться газоочисткой/кислотой Nerin и прицельно запросить у Nerin наличие обжиговых референсов (в открытых источниках их нет — возможно, есть в закрытом референс-листе); рассмотреть отдельный контакт с ENFI. По Лоту 2 — запросить референс-листы Metalcess/Sunevap/Jingjin (фильтрация уже Selected у нас). По Лоту 4 честно оценить шансы: если требования жёсткие — не заявляться или искать профильного партнёра по складской автоматизации."},{"title":"Самодекларированные референсы OEM могут не пройти верификацию","text":"Клиентские листы Tianxin, Sanyou, Lufeng, Metalcess взяты с их сайтов/маркетплейсов без названий проектов, годов и контактов. Заказчик при проверке может их не засчитать, а обнаруженное несоответствие ударит по всей заявке.","action":"До включения в заявку запросить по каждому референсу: контракт/акт, контакт заказчика, фото смонтированного оборудования. В заявку включать только референсы, подтверждённые документами. Формулировки в заявке — строго по документам партнёра, без усиления."},{"title":"Партнёр малого масштаба не пройдёт финансовые пороги","text":"Tianxin: капитал 24 млн юаней (~330 млн руб.), ~70 сотрудников. Типовые пороги (выручка от сопоставимой с ценой лота, опыт договоров сопоставимой цены) такое юрлицо не пройдёт, даже при идеальном продуктовом соответствии.","action":"Нишевых OEM (Tianxin, Sanyou, Lufeng) заявлять только субпоставщиками оборудования внутри лота, носителем квалификации делать Nerin (группу). Пороговые значения проверить сразу после выхода документации."}]};
const MKT = {"updated":"2026-08-13","summary":"Рынок под ОВЭ-75 разорван на три контура. Западные носители технологии — Metso/Outotec (обжиг КС, КСМ, ошиновка, фильтрация), Glencore ISAKIDD (постоянные катоды), Alfa Laval, Konecranes, FLSmidth, GEA — из РФ ушли или свернули бизнес (Metso завершила сворачивание в I кв. 2023 со списанием EUR 150 млн; Konecranes ликвидировал российскую дочку; Alfa Laval не принимает заказы с 03.03.2022). Показателен прецедент «Уралэлектромеди» — единственного в РФ цеха ЭВ-меди на постоянных катодах: ванны туда поставила CTI (Бельгия), краны — KUNZ (Австрия), КСМ построена на роботах KUKA. Этот канал закрыт, а собственного производства полимербетонных ванн и роботизированных КСМ в РФ не возникло. Китай закрывает всю цепочку электролизного зала проверяемыми производителями: Zhuzhou Tianqiao (краны электролиза меди/свинца/цинка, биржевая компания с 1956 г.), Jiangxi Tianxin (КСМ цепные и роботизированные + спецкраны), China Nerin (технология постоянных катодов, EPC 180 тыс. т катодной меди), Sanyou (катодные матрицы, КСМ, кромочные планки), Hengshui Gains и Jiubo (полимербетонные ванны), Jiangsu Saideli (пульсирующие центрифуги, >7000 машин с 1965 г.), Fujian Longking (электрофильтры), Jingjin (фильтр-прессы, уже Selected в нашем Bitrix).\n\nРоссийское машиностроение полностью закрывает «котельно-сварную» половину проекта: ЗиО-Подольск и Сибэнергомаш-БКЗ (котлы-утилизаторы, тягодутьевые машины, типоряд ДН), Кондор-Эко/ФИНГО (электрофильтры и рукавные фильтры, референсы в цветной металлургии), Уралхиммаш (ёмкостное, реакторное, выпарное и теплообменное оборудование из коррозионностойких сталей и титана), Ридан (пластинчатые ТО полного цикла, Дзержинск), Электровыпрямитель Саранск (преобразователи для электролиза цветных металлов), ГЕОН/Иннотек (барабанные вакуум-фильтры). Печь КС, котёл-утилизатор, бункера, газоходы, баки, эжекторы, ошиновка — это изделия «по заданию», где РФ-изготовление конкурентно и снимает санкционно-логистические риски; дефицит РФ — ванны, КСМ, центрифуги, катодно-анодное хозяйство под ЭВ.\n\nГлавный ценообразующий фактор — материал. По листу 904L дороже 316L примерно в 2–3 раза ($4,5–8,5 тыс./т против $2,5–4,0 тыс./т), а Hastelloy G-35 — на порядок: $48–78/кг FOB КНР, т.е. ~10–25× к 316L. На готовом аппарате это даёт ×2–4 по 904L и кратно больше по G-35 (доля материала в цене аппарата 30–50 %). Поэтому крупнейший рычаг CAPEX всего проекта — согласованное применение 904L вместо G-35 там, где ИД это допускает (каскад выщелачивания, репульпатор 4.1.21, фильтры 4.1.20, теплообменник 4.1.17). Металлы LME (медь $14 376/т, никель $16 725/т, свинец $1 880/т на 12.08.2026) — прозрачный базис для проверки любых ТКП по ошиновке, анодам и матрицам: медь на историческом максимуме делает ошиновку и первичную загрузку электродов дороже, чем закладывалось год назад.\n\nМаржа контракта делается в трёх местах. Первое — материальные решения: перевод каскада с G-35 на 904L и честный конкурс «РФ-изготовление против КНР-поставки» по сварной номенклатуре (разница «купить готовое» против «металл + работа РФ-завода» на баках, бункерах, газоходах и эжекторах — до 2–3×). Второе — три позиции с максимальным разбросом нашей модели: каскад выщелачивания (USD 6–16 млн), КСМ (7–16 млн), печь КС (6–14 млн) — здесь каждое полученное ТКП сдвигает оценку лота на миллионы. Третье — границы поставки: КСМ с линией подготовки основ, краны (модернизация существующих кранов ЦЭМ вместо покупки двух новых), выпрямители вне БИ. Из 29 разобранных позиций вердикт «изготовить в РФ» — по 8, «гибрид» — по 9, «купить» — по 12, причём больше половины «купить» — это конкурс РФ/КНР, а не безальтернативный импорт.","makeorbuy":[{"cls":"roaster","lot":1,"name":"Печь кипящего слоя 10–16 т/ч (кислородное дутьё 96 % O₂)","buy":{"price":"USD 6–14 млн (база 9) за печь с обвязкой — ориентир из нашей факторной модели capex.json (AACE 5, −30/+50 %), цен в тендерном пакете нет — требует ТКП","who":["Серийного рынка нет — изделие-проект","КНР редел», иначе сравнение недостоверно. Валюту приводить к USD по курсу одной даты; рублёвые ТКП — без НДС. Побеждает минимальный PV при выполнении всех обязательных требований (материал, референс, ЗИП, РФ-автоматика)","checklist":["Единый базис поставки во всех запросах: DAP Мончегорск (или DAP склад Заказчика) — если поставщик даёт EXW/FOB, логистику досчитываем мы и указываем это в сравнении","Материал контактных частей прописан явно (316L / 904L / G-35 / титан) — ТКП без материала к оценке не принимается (правило sourcing_rules)","Границы поставки перечислены пунктами: что в комплекте (насосы, вакуум-станция, линия подготовки основ при КСМ, АСУ нижнего уровня), что нет","Шеф-монтаж и ПНР: отдельной строкой — ставка чел-дня, расчётное число дней, условия проживания/виз (для КНР — реалистичность заезда в Мончегорск)","ЗИП на 2 года по Прил. №5 — поимённой ведомостью с ценами за штуку (не «5 % от стоимости»), отдельно быстроизнашиваемые (сита центрифуг, ткани, аноды/матрицы, футеровки)","Гарантия: месяцев от ввода в эксплуатацию И от отгрузки (обе цифры), что покрывает, время реакции, наличие сервис-инженеров, доступных для выезда в РФ","Срок изготовления календарным графиком с привязкой платежей; для ОДЦИ — график включается в комплект исходных требований БИ","FAT/SAT: программа приёмочных испытаний с численными критериями (влажность кека 10 %, остаточная запылённость, 120 матриц/ч, сдирка без сращивания) — до контракта","Автоматика: агрегат «без мозгов» либо с контроллерами из перечня Прил. №5; протоколы (Modbus/4–20 мА), запас I/O 30 %","Документация: комплект на русском, паспорта сосудов по ТР ТС 032/010, для СИ — Госреестр РФ с первичной поверкой","Санкционная оговорка: происхождение компонентов (роботы, приводы, подшипники), план замены при отказе субпоставщика, запрет реэкспортных условий, которые поставщик не может выполнить","Валюта и формула пересчёта; для биржевых позиций — формула LME + передел с датой фиксации","Референс-лист по продукту и среде (не по классу): «фильтр-пресс на горячем кислом сульфатном растворе», с контактами для проверки","Штрафные санкции за срок и за недостижение гарантийных показателей — симметричные авансу","Условия платежа: аванс ≤30 % против банковской гарантии; для КНР — аккредитив в юанях через банки, работающие с РФ (проверить заранее)"],"text":"Смысл методики: голая цена железа сравнивает поставщиков нечестно — китайское ТКП выигрывает на EXW и проигрывает на шеф-монтаже, ЗИП и рисках графика; российское — наоборот. Поэтому каждое ТКП приводится к одной точке (DAP Мончегорск, с ЗИП на 2 года, с шеф-монтажом, с гарантией от ввода) и одной дате по валюте и LME. Партнёр выбирается по минимальной приведённой стоимости при выполнении обязательных фильтров: подтверждённый референс по продукту и среде, явный материал, совместимость с РФ-автоматикой по Прил. №5, реалистичный план сервиса в Мончегорске. Для позиций непрерывного расхода (аноды, матрицы, ткани, сита) в PV добавляется стоимость 10-летнего потребления — здесь локализация в РФ почти всегда выигрывает у импорта. Это же и есть критерий «покупать или делать»: если PV покупки превышает PV связки «наша РД + РФ-завод + покупные комплектующие» с учётом риска качества — делаем; печать «сделай сам» ставим только там, где риск процесса не на нас или закрыт FAT."},"margin":[{"position":"Каскад выщелачивания (7 аппаратов, G-35/904L) — лот 0","spread":"USD 6–16 млн в модели (разброс 10 млн, максимальный в проекте)","why":"Разброс порождён материальной развилкой: лист G-35 $48–78/кг против 904L $4,5–8,5/кг. Согласование 904L (ИД допускает) + РФ-изготовление корпусов вместо импорта «под ключ» — крупнейшая одиночная экономия проекта; одновременно это аргумент выбора нас как исполнителя БИ"},{"position":"Роботизированная КСМ — лот 3","spread":"USD 7–16 млн (разброс 9 млн)","why":"Западный референс (Outotec) недоступен, китайские производители (Tianxin, Nerin, Sanyou) дают цену существенно ниже западного бенчмарка, но с разбросом качества. Жёсткий FAT по нашей программе конвертирует этот разброс в экономию без потери гарантий; граница поставки (линия подготовки основ) — ещё 0,5–1,5 млн"},{"position":"Печь КС с обвязкой — лот 1","spread":"USD 6–14 млн (разброс 8 млн)","why":"Изделие-проект без серийного рынка: цена «под ключ» у EPC против «наша РД + РФ-корпус + футеровка» отличается кратно. Здесь сорсинг = инжиниринг: чем больше проектной работы забираем в БИ, тем дешевле железо"},{"position":"Выпрямители 3 × 47 кА — лот 0/3","spread":"USD 4,5–12 млн (разброс 7,5 млн)","why":"Сравнивать по ОЖЦ: разница КПД в 1 % на 47 кА — сотни МВт·ч в год. РФ-производитель (Электровыпрямитель) против КНР — торг не о железе, а о потерях, сервисе на 20 лет и трансформаторах в комплекте"},{"position":"Спецкраны электролизного зала — лот 3","spread":"USD 3–8 млн (разброс 5 млн)","why":"Развилка «модернизация существующих кранов ЦЭМ против двух новых КНР-кранов» — решается обмерным обследованием, которое стоит копейки против ставки; ИД сам подсказывает дешёвый путь"},{"position":"Ошиновка + первичная загрузка электродов (медь, свинец, нержавейка) — лот 3","spread":"суммарно USD 10,3–24,5 млн (ошиновка 2,5–6,5 + аноды 4–9 + матрицы 3,8–9)","why":"Треть стоимости — биржевой металл (медь $14 376/т на максимуме). Маржа делается формулой цены (LME + передел), моментом фиксации LME, локализацией передела в РФ и разделением «первичная загрузка у производителя КСМ / замещение — своё производство»"},{"position":"Сварная номенклатура «изготовления» (бункера, баки, газоходы, эжекторы, циркбаки) — все лоты","spread":"суммарно ~USD 5–15 млн по строкам модели; разброс «готовое против металл+работа» до 2–3×","why":"Каждая позиция мала, но их много, и все они — типовой РФ-передел без санкционных рисков. Собственная РД + прямой заказ металла + завод-партнёр убирают маржу комплектовщиков на всём пакете сразу"}]};

/* **жирный** в текстах данных — единственная разметка, которую пропускаем */

const lotName = n => (LOTS.lots.find(l=>l.id===n)||{}).name || 'Вне БИ';
/* ссылка на источник: показываем хост, а не полный URL — длинные URL рвут вёрстку на узких экранах */
function srcLink(u){
  if(!/^https?:/.test(String(u||''))) return esc(u);
  let host = u; try{ host = new URL(u).hostname.replace(/^www\./,''); }catch(e){}
  return `<a class="src" href="${esc(u)}" target="_blank" rel="noopener">${esc(host)}</a>`;
}

let eqFilter = {lot:'', q:'', key:false};
function eqRows(){
  const t = eqFilter.q.toLowerCase();
  return EQ.items.filter(i=>
    (eqFilter.lot===''||String(i.lot)===eqFilter.lot) &&
    (!eqFilter.key||i.key) &&
    (!t||[i.name,i.model,i.area,i.purpose,i.material,i.status,i.note].join(' ').toLowerCase().includes(t)));
}
function eqPaint(){
  const rows = eqRows();
  const el = document.getElementById('eqbody');
  if(!el) return;
  el.innerHTML = rows.map(i=>`<tr>
    <td>${lotTag(i.lot)}<div class="mut">${esc(i.area)}</div></td>
    <td><b>${esc(i.name)}</b>${i.key?' <span class="tag lot1">ключевое</span>':''}
        ${i.model&&i.model!=='—'?`<div class="mut">${esc(i.model)}</div>`:''}
        ${i.pos?`<div class="mut">поз. ${esc(i.pos)}</div>`:''}</td>
    <td>${esc(i.param)}</td>
    <td class="num">${esc(i.qty)}</td>
    <td>${esc(i.dims||'—')}${i.power?`<div class="mut">${esc(i.power)}</div>`:''}</td>
    <td>${esc(i.material||'—')}</td>

/* ================= Поставщики ================= */
/* Правки сорсера: статус запроса, статус работы, заметка — в localStorage этого
   браузера. Механика та же, что в ГТУ-библиотеке: «⬇ правки» выгружает файлом,
   «⬆ импорт» объединяет чужой файл, CSV — для выгрузки в работу. */
let ED;
try{ ED = JSON.parse(localStorage.getItem('ove_edits_v1')) || {}; }catch(e){ ED = {}; }
ED.rfq = ED.rfq||{}; ED.work = ED.work||{}; ED.note = ED.note||{}; ED.add = ED.add||[];
function saveED(){ try{ localStorage.setItem('ove_edits_v1', JSON.stringify(ED)); }catch(e){} }

const RFQ_ST  = [['','не запрашивали'],['sent','запросили'],['no','не запрашивать']];
const WORK_ST = [['','не работаем'],['yes','работаем'],['kp','есть КП'],['stop','отказ']];
const RFQ_NAME = Object.fromEntries(RFQ_ST), WORK_NAME = Object.fromEntries(WORK_ST);
const nrm = s => String(s||'').toLowerCase().replace(/[«»"'.,()]/g,' ').replace(/\s+/g,' ').trim();
const ckey = (cls,name) => cls+'|'+nrm(name);

/* в колонках Мир/КНР/РФ иногда стоит не компания, а пояснение — на них регуляторы не вешаем */
const NOT_CAND = ['уточн','см.','полный перечень','кандидат-партнёр','типовое изделие','рынок рф',
                  'отечественные','профильные','типоряд','рассмотреть','рынок кнр'];
const isCand = n => { const t = nrm(n); return t.length>2 && t.length<=60 && !NOT_CAND.some(p=>t.startsWith(p)); };

function candsOf(p){
  const bx = (BX.classes||{})[p.cls] || [];
  const out = new Map();
  const put = (name, origin) => {
    if(!isCand(name)) return;
    const k = ckey(p.cls, name);
    if(!out.has(k)) out.set(k, {key:k, name, origins:new Set()});
    out.get(k).origins.add(origin);
  };
  (p.world||[]).forEach(n=>put(n,'Мир'));
  (p.cn||[]).forEach(n=>put(n,'КНР'));
  (p.ru||[]).forEach(n=>put(n,'РФ'));
  [...new Set(bx.map(r=>r.company))].filter(c=>c&&c!=='—').forEach(n=>put(n,'Bitrix'));
  (ED.add||[]).filter(a=>a.cls===p.cls).forEach(a=>put(a.name,'свой'));
  return [...out.values()];
}
const noteRows = p => [...(p.world||[]),...(p.cn||[]),...(p.ru||[])].filter(n=>!isCand(n));

function supPaint(){
  const el = document.getElementById('supbody'); if(!el) return;
  const fl = document.getElementById('suplot').value;
  const ft = document.getElementById('suptier').value;
  const fs = document.getElementById('supst').value;
  const pos = SUP.positions.filter(p=>(fl===''||String(p.lot)===fl) && (ft===''||p.tier===ft));
  let shown = 0, nCand = 0, nSent = 0, nWork = 0;
  const html = pos.map(p=>{
    let cands = candsOf(p);
    if(fs==='sent') cands = cands.filter(c=>ED.rfq[c.key]==='sent');
    else if(fs==='none') cands = cands.filter(c=>!ED.rfq[c.key]);
    else if(fs==='work') cands = cands.filter(c=>ED.work[c.key]==='yes'||ED.work[c.key]==='kp');
    if(fs!=='' && !cands.length) return '';
    shown++;
    nCand += cands.length;
    cands.forEach(c=>{ if(ED.rfq[c.key]==='sent') nSent++; if(ED.work[c.key]==='yes'||ED.work[c.key]==='kp') nWork++; });
    return `<div class="card">
      <h3>${lotTag(p.lot)} ${esc(p.name)} <span class="tier${esc(p.tier)}">уровень ${esc(p.tier)}</span></h3>
      <div class="mut">${esc(p.spec)}</div>
      <div class="tblwrap"><table><thead><tr>
        <th>Кандидат</th><th>Откуда</th><th>Запрос</th><th>Работа</th><th>Заметка</th></tr></thead>
      <tbody>${cands.length ? cands.map(c=>`<tr>
        <td><b>${esc(c.name)}</b></td>
        <td>${[...c.origins].map(o=>`<span class="tag${o==='Bitrix'?' lot3':''}">${esc(o)}</span>`).join('')}</td>
        <td><select class="mini" data-k="${esc(c.key)}" data-f="rfq">
          ${RFQ_ST.map(([v,n])=>`<option value="${v}"${v===(ED.rfq[c.key]||'')?' selected':''}>${n}</option>`).join('')}</select></td>
        <td><select class="mini" data-k="${esc(c.key)}" data-f="work">
          ${WORK_ST.map(([v,n])=>`<option value="${v}"${v===(ED.work[c.key]||'')?' selected':''}>${n}</option>`).join('')}</select></td>
        <td><input class="mini note" data-k="${esc(c.key)}" data-f="note" value="${esc(ED.note[c.key]||'')}" placeholder="цена, срок, контакт…"></td>
      </tr>`).join('') : '<tr><td colspan="5" class="mut">Кандидатов нет — искать с нуля</td></tr>'}</tbody></table></div>
      ${noteRows(p).length?`<div class="mut">${noteRows(p).map(esc).join(' · ')}</div>`:''}
      ${p.gift?`<div class="box amber"><b>Подсказка из документов Заказчика:</b> ${esc(p.gift)}</div>`:''}
      <div class="box"><b>Что спрашивать:</b> ${esc(p.ask)}</div>
      <div class="addrow"><input class="mini" id="add_${esc(p.cls)}" placeholder="добавить своего поставщика">
        <button class="btn addbtn" data-cls="${esc(p.cls)}">+ добавить</button></div>
    </div>`;}).join('');
  el.innerHTML = html || '<div class="box mut">Под фильтр ничего не попало</div>';
  document.getElementById('supcount').textContent =
    `${shown} из ${SUP.positions.length} позиций · ${nCand} кандидатов · запросили ${nSent} · работаем ${nWork}`;
}
function supCSV(){
  const lines = ['лот;позиция;уровень;кандидат;откуда;запрос;работа;заметка'];
  for(const p of SUP.positions) for(const c of candsOf(p))
    lines.push([p.lot,p.name,p.tier,c.name,[...c.origins].join('/'),
      RFQ_NAME[ED.rfq[c.key]||''],WORK_NAME[ED.work[c.key]||''],ED.note[c.key]||'']
      .map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';'));
  const blob = new Blob(["﻿"+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ove_sourcing.csv'; a.click();
}
function supExport(){
  const blob = new Blob([JSON.stringify(ED,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ove_edits_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function supImport(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  f.text().then(t=>{
    try{
      const e = JSON.parse(t);
      Object.assign(ED.rfq, e.rfq||{}); Object.assign(ED.work, e.work||{}); Object.assign(ED.note, e.note||{});
      for(const a of (e.add||[])) if(!ED.add.some(x=>x.cls===a.cls && nrm(x.name)===nrm(a.name))) ED.add.push(a);
      saveED(); supPaint();
    }catch(err){ alert('Не удалось прочитать файл правок: '+err.message); }
  });
}
function bindSup(){
  ['suplot','suptier','supst'].forEach(id=>document.getElementById(id).addEventListener('change', supPaint));
  const root = document.getElementById('supbody');
  root.addEventListener('change', e=>{
    const el = e.target.closest('select.mini'); if(!el) return;
    ED[el.dataset.f][el.dataset.k] = el.value; saveED(); supPaint();
  });
  root.addEventListener('input', e=>{
    const el = e.target.closest('input.note'); if(!el) return;
    ED.note[el.dataset.k] = el.value; saveED();
  });
  root.addEventListener('click', e=>{
    const b = e.target.closest('.addbtn'); if(!b) return;
    const inp = document.getElementById('add_'+b.dataset.cls);
    const name = (inp.value||'').trim();
    if(!name) return;
    ED.add.push({cls:b.dataset.cls, name}); saveED(); supPaint();
  });
  document.getElementById('supcsv').addEventListener('click', supCSV);
  document.getElementById('supexp').addEventListener('click', supExport);
  document.getElementById('supimp').addEventListener('change', function(){ supImport(this); });
  supPaint();
}

/* ================= CAPEX ================= */
const CP = {fx:CAPEX.params.fx.value, lang:CAPEX.params.lang.value, cont:CAPEX.params.cont.value};
function capexCalc(){
  const eq = CAPEX.equipment.reduce((a,e)=>({low:a.low+e.low, base:a.base+e.base, high:a.high+e.high}), {low:0,base:0,high:0});
  const direct = CAPEX.nonequip.filter(n=>n.mode==='direct')
    .reduce((a,n)=>({low:a.low+n.low, base:a.base+n.base, high:a.high+n.high}), {low:0,base:0,high:0});
  const out = {};
  for(const k of ['low','base','high']){
    const eqInst = eq[k]*CP.lang;              // оборудование → смонтированный объект
    const tic = eqInst + direct[k];            // + прямые строительные и сетевые затраты
    let soft = 0;
    for(const n of CAPEX.nonequip){
      if(n.mode==='pct_tic') soft += tic*n.pct/100;
      if(n.mode==='pct_eq')  soft += eq[k]*n.pct/100;
    }
    const sub = tic + soft;
    out[k] = {eq:eq[k], eqInst, direct:direct[k], tic, soft, sub, cont:sub*CP.cont/100, total:sub*(1+CP.cont/100)};
  }
  return out;
}
function capexPaint(){

/* ================= Партнёр ================= */
function rPartner(){
  if(!PARTNER) return `<div class="box warn"><b>Раздел собирается.</b> Опыт в квалификационной части заявки прикладывается не КВАНТ, а китайского партнёра, который идёт вместе с нами. Здесь будет: досье на кандидатов — China Nerin Engineering и связанная Jiangxi Nerin Equipment, а также поставщик по линии подготовки катодных основ; их проверяемые референсы по меди с названиями проектов, мощностями и годами; соответствие опыта каждому из четырёх лотов по отдельности; перечень документов, которые надо запросить у партнёра для квалификационной части (референс-листы с контактами заказчиков, сертификаты, лицензии, финотчётность, подтверждение мощностей); и риски самой схемы — как Заказчик отнесётся к тому, что опыт не у заявителя, и нужна ли консорциальная или субподрядная конструкция.</div>`;
  const tcls = t => t==='A'?'tierA':(t==='B'?'tierB':'tierC');
  return `
  <div class="box info"><b>Решение.</b> ${md(PARTNER.decision).replace(/\n{2,}/g,'</p><p>').replace(/^/,'<p>').replace(/$/,'</p>')}</div>
  <h2>Кандидаты в партнёры</h2>
  ${(PARTNER.candidates||[]).map(c=>`<div class="card">
    <h3>${esc(c.name)} <span class="tag ${tcls(c.tier)}">уровень ${esc(c.tier)}</span> <span class="tag">${esc(c.role)}</span></h3>
    <p>${esc(c.profile)}</p>
    ${(c.refs||[]).length?`<div class="tblwrap"><table><thead><tr><th>Проект</th><th>Что сделано</th><th>Год</th><th>Источник</th></tr></thead>
      <tbody>${c.refs.map(r=>`<tr><td><b>${esc(r.project)}</b></td><td>${esc(r.what)}</td><td class="mut">${esc(r.year)}</td>
      <td class="mut">${srcLink(r.src)}${r.checked?` · ${esc(r.checked)}`:''}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${c.fit?`<div class="tblwrap"><table><thead><tr>${[1,2,3,4].map(n=>`<th>Лот №${n}</th>`).join('')}</tr></thead>
      <tbody><tr>${[1,2,3,4].map(n=>`<td>${esc(c.fit['lot'+n]||'—')}</td>`).join('')}</tr></tbody></table></div>`:''}
  </div>`).join('')}
  ${(PARTNER.already_contacted||[]).length?`<h2>С кем мы уже контактировали</h2>
    <div class="tblwrap"><table><thead><tr><th>Компания</th><th>Классы оборудования</th><th>Примечание</th></tr></thead>
    <tbody>${PARTNER.already_contacted.map(c=>`<tr><td><b>${esc(c.company)}</b></td>
    <td>${(c.classes||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</td><td class="mut">${esc(c.note||'')}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${(PARTNER.docs_to_request||[]).length?`<h2>Что запросить у партнёра для квалификационной части</h2><ol>${PARTNER.docs_to_request.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
  ${(PARTNER.risks||[]).length?`<h2>Риски партнёрской схемы</h2>${PARTNER.risks.map(r=>`<div class="card"><h3>${esc(r.title)}</h3>
    <p>${esc(r.text)}</p><p><b>Что делать:</b> ${esc(r.action)}</p></div>`).join('')}`:''}
  <div class="mut">Обновлено ${esc(PARTNER.updated||'')}.</div>`;
}

/* ================= Маркетинг: купить или сделать самим ================= */
const kindTag = k => k==='факт' ? '<span class="tag lot3">факт</span>' : '<span class="tag">оценка</span>';
const VCLS = {'купить':'tierA','изготовить в РФ':'tierB','гибрид':'tierC'};
let mbFilter = '';
function mbPaint(){
  const el = document.getElementById('mbbody'); if(!el) return;
  const rows = MKT.makeorbuy.filter(x=>!mbFilter||x.verdict===mbFilter);
  el.innerHTML = rows.map(x=>`<div class="card">
    <h3>${lotTag(x.lot)} ${esc(x.name)} <span class="${VCLS[x.verdict]||''}">${esc(x.verdict)}</span></h3>
    <p><b>Почему:</b> ${esc(x.why)}</p>
    <div class="grid2">
      <div class="card" style="margin:0"><h3>Купить готовое ${kindTag(x.buy.kind)}</h3>
        <p><b>${esc(x.buy.price)}</b></p>
        <p class="mut">${(x.buy.who||[]).map(esc).join(' · ')||'—'}</p>
        ${x.buy.lead?`<p class="mut">Срок: ${esc(x.buy.lead)}</p>`:''}
        ${(x.buy.risks||[]).length?`<ul class="mut">${x.buy.risks.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
        ${x.buy.src?`<p class="mut">${srcLink(x.buy.src)}</p>`:''}</div>
      <div class="card" style="margin:0"><h3>Изготовить в РФ ${x.make_ru?kindTag(x.make_ru.kind):''}</h3>
        ${x.make_ru?`<p><b>${x.make_ru.feasible?'Реально':'Не реально'}</b>${x.make_ru.price?` — ${esc(x.make_ru.price)}`:''}</p>
        <p class="mut">${(x.make_ru.who||[]).map(esc).join(' · ')||'—'}</p>
        ${(x.make_ru.risks||[]).length?`<ul class="mut">${x.make_ru.risks.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}`:'<p class="mut">—</p>'}</div>
    </div>
    ${x.make_self?`<div class="box"><b>Сделать самим:</b> ${x.make_self.feasible?'реально':'не реально'} — ${esc(x.make_self.note||'')}</div>`:''}
  </div>`).join('') || '<div class="box mut">Под фильтр ничего не попало</div>';
  document.getElementById('mbcount').textContent = `${rows.length} из ${MKT.makeorbuy.length}`;
}
function bindMkt(){
  if(!MKT) return;
  document.getElementById('mbverdict').addEventListener('change', e=>{ mbFilter = e.target.value; mbPaint(); });
  mbPaint();
}
function rMarket(){
  if(!MKT) return `<div class="box warn"><b>Раздел собирается.</b> Здесь будет рыночный разбор: по каждой ключевой позиции — купить готовое против изготовить в России по нашему заданию, с ценовыми ориентирами и рисками; сравнение сплавов Hastelloy G-35, 904L и 316L, которое определяет стоимость гидрометаллургии кратно; картина рынка после ухода западных поставщиков; методика приведения предложений партнёров к одной базе для честного сравнения по цене; и позиции с наибольшим разбросом цен, где сорсинг даёт максимальный эффект.</div>`;
  const cnt = {}; MKT.makeorbuy.forEach(x=>{cnt[x.verdict]=(cnt[x.verdict]||0)+1});
  return `
  <div class="box info">${md(MKT.summary).replace(/\n{2,}/g,'</p><p>').replace(/^/,'<p>').replace(/$/,'</p>')}</div>
  <div class="k">
    ${Object.entries(cnt).map(([v,n])=>`<div class="tile"><b class="${VCLS[v]||''}">${n}</b><span>${esc(v)}</span></div>`).join('')}
    <div class="tile"><b>${MKT.makeorbuy.length}</b><span>позиций разобрано</span></div>
  </div>

  <h2>Сплавы: чем определяется стоимость гидрометаллургии</h2>
  <div class="box amber"><b>Главный рычаг сметы.</b> ИД требует Hastelloy G-35 для горячих кислых концентрированных растворов, но тут же допускает замену: «взамен Hastelloy G-35 возможно использование стали 904L». Разница в цене между этими двумя допустимыми вариантами — кратная, и она целиком в нашей власти на стадии БИ.</div>
  <div class="tblwrap"><table><thead><tr><th>Сплав</th><th>Против 316L</th><th>Цена</th><th>Тип</th><th>Источник</th></tr></thead>
  <tbody>${MKT.materials.map(m=>`<tr><td><b>${esc(m.alloy)}</b></td><td class="hi">${esc(m.vs316l)}</td>
    <td>${esc(m.price)}</td><td>${kindTag(m.kind)}</td><td class="mut">${srcLink(m.src)}${m.checked?` · ${esc(m.checked)}`:''}</td></tr>`).join('')}</tbody></table></div>

  <h2>Купить или сделать самим</h2>
  <div class="filters">
    <select id="mbverdict"><option value="">Все вердикты</option>${Object.keys(cnt).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>
    <span class="count" id="mbcount"></span>
  </div>
  <div id="mbbody"></div>

  <h2>Картина рынка</h2>
  ${MKT.market.map(m=>`<div class="card"><h3>${esc(m.class)} ${kindTag(m.kind)}</h3><p>${esc(m.picture)}</p>
    <p class="mut">${srcLink(m.src)}${m.checked?` · ${esc(m.checked)}`:''}</p></div>`).join('')}

  <h2>Как сравнивать партнёров по цене честно</h2>
  <div class="card"><div class="quote">${esc(MKT.partner_method.formula)}</div>
    <p>${esc(MKT.partner_method.text)}</p>
    <h3>Что обязательно включать в запрос, иначе предложения несопоставимы</h3>
    <ol>${MKT.partner_method.checklist.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>

  <h2>Где делается маржа</h2>
  <div class="tblwrap"><table><thead><tr><th>Позиция</th><th>Разброс цен</th><th>Почему</th></tr></thead>
  <tbody>${MKT.margin.map(m=>`<tr><td><b>${esc(m.position)}</b></td><td class="hi">${esc(m.spread)}</td><td>${esc(m.why)}</td></tr>`).join('')}</tbody></table></div>
  <div class="mut">Обновлено ${esc(MKT.updated||'')}. Цен в тендерном пакете нет — все ориентиры помечены как оценка и требуют подтверждения ТКП.</div>`;
}

/* ================= Альтернатива зашитому решению ================= */
function rAlt(){
  if(!ALT) return `<div class="box warn"><b>Раздел собирается.</b> Здесь будет аргументационный блок для нашего БИ и ТКП: почему зашитые в исходные данные решения Hatch и Дельты — не обязательные, а один из вариантов. Юридическая опора из самих документов Заказчика, честная матрица сравнения китайской альтернативы с решениями Дельты по десяти критериям — включая те, где выигрывает Дельта, готовые формулировки для пояснительной записки, ТКП и запроса Заказчику, и риски нашего же предложения.</div>`;
  const wcls = w => w==='КНР'?'tierA':(w==='паритет'?'tierB':'tierC');
  const fav = f => f==='нас'?'<span class="tag lot3">в нашу пользу</span>':(f==='Заказчика'?'<span class="tag lot1">против нас</span>':'<span class="tag">нейтрально</span>');
  return `
  <div class="box info">${md(ALT.summary).replace(/\n{2,}/g,'</p><p>').replace(/^/,'<p>').replace(/$/,'</p>')}</div>
  <h2>На каком основании мы вправе предлагать альтернативу</h2>
  <div class="tblwrap"><table><thead><tr><th>Цитата из документов Заказчика</th><th>Где</th><th>Как читается</th><th>Кому в пользу</th></tr></thead>
  <tbody>${(ALT.legal||[]).map(l=>`<tr><td class="quote" style="border:0;padding:6px 9px">«${esc(l.quote)}»</td>
    <td class="mut">${esc(l.where)}</td><td>${esc(l.reading)}</td><td>${fav(l.favors)}</td></tr>`).join('')}</tbody></table></div>

  ${(ALT.matrix||[]).map(m=>{
    const w = {}; m.criteria.forEach(c=>{w[c.winner]=(w[c.winner]||0)+1});
    return `<h2>${esc(m.object)}</h2>
    <div class="k">${Object.entries(w).map(([k,v])=>`<div class="tile"><b class="${wcls(k)}">${v}</b><span>${k==='КНР'?'за китайский вариант':(k==='паритет'?'паритет':'за решение Дельты')}</span></div>`).join('')}</div>
    <div class="tblwrap"><table><thead><tr><th>№</th><th>Критерий</th><th>Китайский вариант</th><th>Решение Дельты / Hatch</th><th>Кто сильнее</th><th>Обоснование</th></tr></thead>
    <tbody>${m.criteria.map(c=>`<tr><td>${c.n}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.cn)}</td><td>${esc(c.delta)}</td>
      <td class="${wcls(c.winner)}">${esc(c.winner)}</td><td class="mut">${esc(c.why)} ${kindTag(c.kind)}</td></tr>`).join('')}</tbody></table></div>`;}).join('')}

  <h2>Готовые формулировки в документы</h2>
  ${(ALT.wording||[]).map(w=>`<div class="card"><h3>${esc(w.target)}</h3><div class="quote">${esc(w.text)}</div></div>`).join('')}

  <h2>Чем рискуем мы сами, предлагая альтернативу</h2>
  ${(ALT.risks||[]).map(r=>`<div class="card"><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p>
    <p><b>Что делать:</b> ${esc(r.mitigation)}</p></div>`).join('')}
  <div class="mut">Обновлено ${esc(ALT.updated||'')}.</div>`;
}

/* ================= Каркас ================= */
const TABS = [
  ['overview','Обзор'], ['stages','Этапы'], ['blocks','Блоки и лоты'], ['bi','Базовый проект'],
  ['equip','Оборудование'], ['sup','Поставщики'], ['market','Маркетинг'], ['alt','Альтернатива'],
  ['auto','Автоматизация'], ['world','Мировой опыт'], ['china','Китай'],
  ['partner','Партнёр'], ['competitor','Конкурент'], ['tender','Торги за БИ'], ['capex','Стройка · CAPEX']
];
const R = {overview:rOverview, stages:rStages, blocks:rBlocks, bi:rBI, equip:rEquip, sup:rSup,
           market:rMarket, alt:rAlt, auto:rAuto, world:rWorld, china:rChina,
           partner:rPartner, competitor:rComp, tender:rTender, capex:rCapex};
const nav = document.getElementById('nav'), main = document.getElementById('main');
nav.innerHTML = TABS.map(([id,t])=>`<button data-t="${id}">${esc(t)}</button>`).join('');
main.innerHTML = TABS.map(([id])=>`<section id="s-${id}"></section>`).join('');
document.getElementById('foot').innerHTML =
  `Разбор тендерного пакета «ТЗ на БИ ОВЭ-75 v.3.6» и приложений №1–7 (ИД ч.1 и ч.2, электроснабжение, ЦИМ, ОАСУ, здания ЦЭМ и ГМУ). ` +
  `Технологические данные — из документов Заказчика и ИД ООО «Институт Гипроникель». Внешние факты о компаниях проверены 13.08.2026 и снабжены ссылками. ` +
  `Оценка CAPEX — модель порядка величины, не смета. Сборка: 2026-08-13`;

const rendered = {};
function bindEquip(){
  const q=document.getElementById('eqq'), s=document.getElementById('eqlot'), k=document.getElementById('eqkey');
  q.addEventListener('input', ()=>{eqFilter.q=q.value; eqPaint();});
  s.addEventListener('change', ()=>{eqFilter.lot=s.value; eqPaint();});
  k.addEventListener('click', ()=>{eqFilter.key=!eqFilter.key; k.classList.toggle('on',eqFilter.key); eqPaint();});
  eqPaint();
}
function bindBI(){
  if(!BI.length) return;
  document.querySelectorAll('.bilot').forEach(b=>b.addEventListener('click', ()=>{
    biLot = Number(b.dataset.i);
    document.querySelectorAll('.bilot').forEach(x=>x.classList.toggle('on', x===b));
    biPaint();
  }));
  biPaint();
}
function bindCapex(){
  for(const key of Object.keys(CAPEX.params)){
    const el=document.getElementById('cp_'+key), out=document.getElementById('cpo_'+key);
    el.addEventListener('input', ()=>{ CP[key]=Number(el.value); out.textContent=el.value; capexPaint(); });
  }
  capexPaint();
}
function show(id){
  for(const [tid] of TABS){
    document.querySelector(`[data-t="${tid}"]`).classList.toggle('on', tid===id);
    document.getElementById(`s-${tid}`).classList.toggle('on', tid===id);
  }
  if(!rendered[id]){
    document.getElementById(`s-${id}`).innerHTML = R[id]();
    rendered[id]=1;
    if(id==='equip') bindEquip();
    if(id==='capex') bindCapex();
    if(id==='bi') bindBI();
    if(id==='sup') bindSup();
  }
  location.hash = id;
  window.scrollTo(0,0);
}
nav.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.t); });
show(TABS.some(([id])=>id===location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
</script>
</body>
</html>
