ной продувки (0,205–0,324 м³/ч). (5) TIA-406 газ за КУ 400 °C: рост — признак загрязнения поверхностей, автозапуск виброочистки/обстукивания по циклограмме и по ΔT. (6) PDI-407…409 перепады по КУ, циклону (868/2232 Па), ЭФ (≤200 Па) — диагностика забивания трактов. (7) ЭФ: управление агрегатами ОПМД-400 — автоматическое поддержание тока на грани искрения (46,4–57,6 кВ), циклограммы встряхивания полей со сдвигом от отгрузки пыли; TSA-410 блокировка полей при T газа <320 °C (БИ; риск росы SO₃ — расчётная точка росы уточняется) и при уровне max в пылесборнике; допусковый контроль изоляторных коробок. (8) **PIC-411 разрежение перед дымососом** — резервный к PIC-306 канал регулирования тяги; АВР дымососов: автозапуск резервного с перестановкой перекидных шиберов за ≤60 с (БИ). (9) QIRC-412 SO₂/O₂ + пылемер QI-413 в газоходе СКЦ — коммерческий/технологический контроль границы (15,59 % SO₂, ≤0,1 г/нм³). (10) Холодильники: TIC-414/415 T материала на выходе 70 °C → ПИД → клапаны расхода оборотной воды (176,9 и 2,2 м³/ч); FSA-416 протока воды каждого контура — блокировка шнека при потере протока (защита от прогара); TIA-417 воды на выходе 35 °C (предупр. 45 °C — БИ); SIC токовая защита шнеков с реверс-алгоритмом расклинивания. (11) Силосы: WIA-418 вес (CLF-300), разрешение налива цементовоза по весу и T ≤65 °C, автоматика дисковых затворов и аспирации налива.\n\n**Участок аспирации.** PDIC-501 перепад на рукавном фильтре → импульсная регенерация в диапазоне 800–1500 Па (БИ); PIC-502 разрежение в коллекторе → ЧРП дымососа аспирации; TIA-503 температура газов (защита рукавов, байпас при перегреве); QI-504 пылемер на свече; LIA-505 бункера фильтра → шнек возврата пыли. Блокировочная матрица «аспирация-технология»: запрет пуска любого пылящего механизма без подтверждения разрежения в его отсосе; выдержка останова аспирации 120 с после останова технологии (продувка). Полный перечень контуров (~45 позиций регулирования, ~120 блокировок) оформляется в БИ таблицей по форме Прил. №5: контур, связи, уставки сигнализаций/блокировок, формализованный алгоритм.","items":[{"label":"Главный контур печи","value":"TIC слоя 930 °C → каскад на дозатор шихты; аварийные границы 700/970 °C","src":"ИД табл. 23 п.233; разд. 2.4 (границы пуска/остановки)"},{"label":"Контур соотношения дутья","value":"FFIC воздух/O₂: 52,0 % (осн.) / 30,8 % (вспом.) O₂","src":"ИД табл. 23 п.200, 224"},{"label":"Контур давления под сводом","value":"PIC → ЧРП дымососа; уставка +50…100 Па (ИД) / знак уточнить (ТЗ: разрежение)","src":"ИД табл. 23 п.229; ТЗ п.3.5"},{"label":"Контур слоя/выгрузки","value":"PDIC «коробка–слой» 52,3 кПа → дроссельный затвор огарка","src":"ИД табл. 23 п.228; разд. 2.3"},{"label":"Уровень барабана КУ","value":"трёхимпульсный регулятор питания; ПАЗ по упуску воды","src":"решение БИ; ФНП № 536"},{"label":"Защита ЭФ","value":"блокировка полей при T<320 °C (точка росы SO₃) и max пыли","src":"решение БИ; ИД табл. 23 п.275 (SO₃ 0,75 %)"},{"label":"Защита холодильников","value":"блокировка шнека при потере протока воды; T воды предупр. 45 °C","src":"решение БИ; ИД табл. 23 п.435-437"},{"label":"Объём реестра","value":"~45 контуров регулирования, ~120 блокировок","src":"оценка Исполнителя по составу оборудования"}],"gost":[{"doc":"ГОСТ 21.408-2013","what":"Выполнение схем автоматизации (P&ID/АТХ), перечни контуров и блокировок"},{"doc":"ГОСТ 21.208-2013","what":"Условные графические обозначения приборов на P&ID"},{"doc":"ФНП № 512 от 09.12.2020","what":"Обязательные защиты печи (отсечка дутья, продувка азотом, контроль факела горелок)"},{"doc":"ФНП № 536 от 15.12.2020","what":"Защиты котла-утилизатора (уровень, давление, предохранительные клапаны)"},{"doc":"ГОСТ 12.2.003-91","what":"Блокировки ограждений шнеков, конвейеров, затворов"},{"doc":"ГОСТ Р 8.596-2002","what":"Аттестация измерительных каналов контуров, участвующих в защитах"}],"open":["Знак и величина уставки давления под сводом (противоречие ИД п.229 «+50…100 Па» и ТЗ «разрежение») — снять запросом Гипроникелю до выпуска P&ID","Точка росы SO₃ для уставки защиты ЭФ — расчёт по фактической влажности и SO₃ на стадии БИ","Карта уставок сигнализаций/блокировок в полном объёме — итерация с Заказчиком (форма Прил. №5)","Число и расстановка термопар слоя (5–8 шт.) — согласовать с поставщиком печи"]},{"id":"s15-komponovka","title":"Основные компоновочные решения (планы, разрезы, высотная схема)","kind":"graf","body":"Компоновка выполняется на сетке колонн **6/12 м** (ТЗ п.3.5): продольный шаг 6 м, пролёты кратны 12 м. Принятая структура главного корпуса — четыре температурно-технологических блока в одном здании плюс наружная этажерка: **(А) отделение фильтрации** (пролёт 12 м): барабанные вакуум-фильтры на отметке +6,0 (предварительно) с разгрузкой кека на конвейер под фильтром; вакуум-станция, ёмкость и насосы фильтрата — на 0,000; **(Б) отделение шихтовки** (пролёт 12–24 м): бункерная этажерка — верх загрузочных конвейеров ~+14…16, приёмные бункеры 60/20/10/50 м³, под ними питатели и весовые дозаторы (+7…8), смеситель СШ-25 (+5), наклонный конвейер УКВ-320-Ц-95 на расходные бункеры 2×60 м³ у печи; станция растаривания биг-бэгов и пост разгрузки цементной меди — на 0,000 у ворот (граница по ТЗ); **(В) отделение обжига и котла-утилизатора** (пролёт 24 м как 2×12 м): печь КС на собственном опорном каркасе — подина на отметке **+4,5 (предварительно)**: под печью размещаются газовая коробка, дутьевой коллектор, обслуживание сопел и аварийная донная выгрузка в кюбель на 0,000; свод печи ~+13,7; котёл-утилизатор — рядом на самостоятельном каркасе, барабан на верхней отметке (~+18…20 — по КД завода), пылевой бункер КУ снизу с шнеком на +4…5; между печью и КУ — короткий газоход Ø2000; **(Г) отделение газоочистки**: циклон СЦН-50 (высота 6,1 м) на этажерке с бункером над шнеком грубой пыли; два ЭФ УГТ1-20-4 (18,1×4,8 м в плане, высота 18,7 м) на осях с шагом, кратным 6 м, с проходом обслуживания между ними; дымососы на 0,000 на индивидуальных фундаментах; далее газоход Ø1100 на эстакаде в СКЦ. Воздуходувка дутья — в отдельном шумоизолированном помещении на 0,000 вблизи печи (короткий напорный тракт). Мазутный узел (топка-смеситель, горелочные рампы) — у печи с противопожарными отступами.\n\n**Высотная схема построена на самотёке твёрдых потоков** — обоснование: (1) огарок 930 °C выгружается через сливной порог печи (отметка порога над подиной — по высоте слоя ~1,9–2,1 м, т.е. ~+6,4…6,6) непосредственно в загрузочный патрубок холодильника D2424-6, установленного под порогом (+5,2…5,5 — уточняется КД печи): транспортирование раскалённого огарка механизмами исключено; (2) пыль из конусов КУ, циклона и ЭФ ссыпается вертикально на шнековые транспортёры (углы конусов ≥60° > угла откоса пыли 30–42° с запасом на комкуемость); (3) холодильники выдают охлаждённый материал на шнеки, поднимающие его в силосные башни; (4) **силосные башни вынесены в пристройку/на улицу у автопроезда**: низ конуса на +4,2 — над цементовозом (габарит 4,0 м + зазор), верх ~+17; налив — самотёком через герметичный гофрорукав DN100; (5) газовый тракт спроектирован «сверху вниз по пыли»: горизонтальные участки минимизированы, скорость 9–10 м/с самоочищающая, ревизионные люки в местах поворотов (требование ИД — контроль настылей). Подъём шихты (единственный поток «вверх») — наклонными винтовыми и ленточными конвейерами с углом ≤20°.\n\nОбслуживание: мостовой кран пролёта печи/КУ (г/п — по монтажной единице, предварительно 20/5 т — уточняется массой барабана КУ), кран-балки над дымососами (5 т) и в отделении фильтрации; монтажные проёмы в перекрытиях над печью и ЭФ; лестницы и площадки — у всех приводов, затворов, точек КИП (Прил. №5: СИ на высоте ≤1,7 м от площадок, исключение лесов и стремянок). Компоновка предъявляет: планы на отметках 0,000 / +4,5 / +6,0 / +8,0 / +14 и характерные разрезы по печи-КУ и по ЭФ-дымососам с привязкой к осям и отметкам перекрытий. Проезд автоцементовозов и вывоза кюбелей — сквозной, с воротами в торцах.","items":[{"label":"Сетка колонн","value":"6/12 м (пролёты 12 и 24 м, шаг 6 м)","src":"ТЗ п.3.5"},{"label":"Отметка подины печи (предв.)","value":"+4,5 — под печью газовая коробка и донная выгрузка","src":"решение БИ (геометрия печи — ИД табл. 23 п.214)"},{"label":"Габарит ЭФ","value":"18 110 × 4 790 × 18 695 мм, 2 шт.","src":"ИД табл. 23 п.354"},{"label":"Высота циклона","value":"6 100 мм (+ бункер 8,5 м³)","src":"ИД табл. 23 п.301-302"},{"label":"Силос огарка: низ конуса","value":"+4,2 (цементовоз H=4,0 м + зазор)","src":"решение БИ; габарит цементовоза — ИД табл. 23 п.496"},{"label":"Скорость газа в газоходе","value":"9–10 м/с — самоочищающая","src":"расчёт Исполнителя по ИД табл. 23 п.400, 406"},{"label":"Угол конусов пылевых бункеров","value":"≥60° при угле откоса пыли 30–42°","src":"решение БИ; ИД табл. 20"}],"gost":[{"doc":"СП 56.13330.2021","what":"Производственные здания — объёмно-планировочные решения, эвакуация, категории помещений"},{"doc":"СП 43.13330.2012","what":"Сооружения промышленных предприятий — этажерки, бункеры, силосы, галереи, эстакады газохода"},{"doc":"СП 4.13130.2013","what":"Противопожарные расстояния и отступы (мазутный узел, кабельные трассы)"},{"doc":"ФНП № 512 от 09.12.2020","what":"Проходы и площадки обслуживания печей, требования к путям обслуживания горячих трактов"},{"doc":"СП 1.13130.2020","what":"Эвакуационные пути и выходы многоуровневых этажерок"}],"open":["Отметка и конструкция опорного каркаса печи — по КД разработчика печи (HATCH/лицензиат)","Компоновка и отметки котла-утилизатора (барабан, опуски, ремонтные зоны) — по КД завода-изготовителя","Размещение ЭФ (в здании / на открытой площадке с шатром) — теплотехническое сравнение на стадии БИ (риск росы при −40 °C против стоимости корпуса)","Трасса газохода в СКЦ (длина, число опор, компенсаторы) — по генплану привязки цеха"]},{"id":"s16-konstrukcii","title":"Планы строительных конструкций с нагрузками","kind":"graf","body":"Каркас здания — стальной рамно-связевой (скорость монтажа в условиях Заполярья, ремонтопригодность), колонны по сетке 6/12 м, покрытие по фермам, ограждение — сэндвич-панели с расчётом на W₀ = 0,30 кПа и снеговую 3,2 кПа (V район; на перепадах высот блоков — снеговые мешки по СП 20.13330, коэффициент μ до 2–3 в зонах примыкания этажерки к пролёту печи). Внутренние этажерки бункерного хозяйства и газоочистки — самостоятельные стальные каркасы, **конструктивно отделённые от каркаса здания** (исключение передачи технологических вибраций и температурных деформаций).\n\n**Реестр основных технологических нагрузок для планов конструкций** (постоянная + длительная от заполнения, по ИД табл. 25 «НЗП»): приёмный бункер концентрата 60 м³ — 132,6 т материала; бункер оборотного огарка 50 м³ — 149,3 т; бункер кека 20 м³ — 27,0 т; бункер цементной меди 10 м³ — 30,0 т; расходные бункеры 2×60 м³ — 125,0 т суммарно; смеситель с заполнением ~8 т; печь КС — 139 т слоя + футеровка и корпус (масса металлоконструкций и футеровки печи — по КД, предварительная оценка Исполнителя 200–230 т: шамот ~135 т при толщине 350 мм, подина ~30 т, корпус и свод ~40–60 т); котёл-утилизатор — масса по КД завода + 30,4 т пыли в бункере (15 м³ × 2,025 т/м³); циклон 1,19 т + 16,2 т пыли; каждый ЭФ 72,6 т + 17,1 т пыли; холодильник D2424-6 с заполнением ~13 т + вода в рубашке; силосная башня огарка — **221 т материала** (100 м³ × ~2,2 т/м³ насыпной уплотнённой) + собственный вес; силос пыли 17,1 т. Газоходы Ø2000/Ø1100 с футеровкой ШЛ-0,4 — линейная нагрузка на опоры и температурные усилия от компенсаторов (тракт до 400–920 °C); в НЗП газоходов заложено до 50 т пылевых отложений на тракте «печь–КУ» и 50 т на «КУ–циклон» — **пылевая нагрузка газоходов учитывается в расчёте опор как длительная**, это прямое следствие данных ИД табл. 25.\n\nПолезные нагрузки на перекрытия обслуживания — 4,0 кПа (площадки КИП и проходы), 10 кПа — ремонтные зоны и зоны складирования футеровки при капремонте (кампания печи 3 года, разовая перекладка ~135 т шамота — предусмотреть зону раскладки и путь подачи). Крановые нагрузки мостового крана пролёта печи/КУ — по г/п (предварительно 20/5 т) с вертикальными и горизонтальными составляющими по СП 20.13330 разд. 9. Температурные воздействия: локальный нагрев конструкций у печи и газоходов — тепловые экраны и вентилируемые зазоры, расчётный перепад для этажерки печи ±40 °C. Все узлы опирания оборудования снабжаются планами нагрузок: N (пост.), N (длит., заполнение), V (динамика — см. раздел фундаментов), M от эксцентриситетов конусов.","items":[{"label":"Снег / ветер","value":"3,2 кПа (V район) / W₀ 0,30 кПа (II район)","src":"ТЗ п.2.9.3-2.9.4"},{"label":"Слой в печи","value":"139 т единовременно","src":"ИД табл. 23 п.230; табл. 25"},{"label":"Масса печи (оценка)","value":"200–230 т конструкция+футеровка (уточняется КД)","src":"оценка Исполнителя по геометрии ИД табл. 23 п.214-216"},{"label":"Силос огарка","value":"221 т материала (100 м³)","src":"ИД табл. 25"},{"label":"ЭФ с пылью","value":"72,6 + 17,1 = 89,7 т на опоры каждого","src":"ИД табл. 23 п.355; табл. 25"},{"label":"Пыль в газоходах","value":"до 50 т на участок «печь–КУ» и «КУ–циклон»","src":"ИД табл. 25 (НЗП газоходных трактов)"},{"label":"Бункеры шихтовки (заполнение)","value":"132,6 / 149,3 / 27,0 / 30,0 / 125,0 т","src":"ИД табл. 25"}],"gost":[{"doc":"СП 20.13330.2016","what":"Нагрузки и воздействия: сочетания, снеговые мешки, крановые нагрузки (разд. 9)"},{"doc":"СП 16.13330.2017","what":"Стальные конструкции — расчёт каркасов, этажерок, опор газоходов"},{"doc":"СП 63.13330.2018","what":"Железобетонные конструкции — фундаменты, подпорные элементы, перекрытия на 0,000"},{"doc":"СП 43.13330.2012","what":"Бункеры и силосы: давление сыпучего на стенки (с учётом сводообразования и обрушения), опорные узлы"},{"doc":"СП 14.13330.2018","what":"Проверка при сейсмичности 6 баллов (справочно; спецмероприятия как правило не требуются)"},{"doc":"ГОСТ 27751-2014","what":"Надёжность строительных конструкций — класс сооружения КС-2/КС-3 (уточнить для этажерки печи)"}],"open":["Массы КУ, барабана, воздуходувки, рукавных фильтров — по ТКП/КД заводов (закладываются в планы нагрузок итерацией)","Класс ответственности этажерки печи (КС-2 или КС-3) — согласовать с генпроектировщиком","Нагрузки от эстакады газохода в СКЦ — после трассировки по генплану"]},{"id":"s17-fundamenty","title":"Планы фундаментов с нагрузками, включая динамические","kind":"graf","body":"Грунтовые условия площадки благоприятные (особых условий нет — ТЗ п.2.9.6); тип фундаментов — монолитные ж/б на естественном основании (уточняется ИГИ конкретного пятна). **Статические нагрузки** — по реестру раздела конструкций; ниже — фундаменты с динамической составляющей, рассчитываемые по **СП 26.13330.2012 «Фундаменты машин с динамическими нагрузками»**.\n\n(1) **Дымососы ДН-15БНЖ (2 шт.)** — главный источник динамики: ротор с двигателем 400 кВт, **n = 1500 об/мин (частота вынуждающей силы 25 Гц)**, масса агрегата 5,64 т (дымосос 3,32 + двигатель 2,32). Фундамент — массивный ж/б блок на общей раме под улитку и двигатель; ориентировочная масса блока — 8–12-кратная масса агрегата (45–70 т, уточняется расчётом амплитуд); нормативная динамическая нагрузка — от остаточного дисбаланса ротора по паспорту (класс балансировки G6.3 — запросить в ОЛ), расчёт амплитуд колебаний на отметке опор — не более допускаемых по СП 26.13330 для машин с вращающимися частями; отстройка собственных частот фундамента от 25 Гц не менее ±25 %. Виброизоляция от каркаса здания — фундамент отделён сквозным швом; газоход присоединяется через мягкие вставки/линзовые компенсаторы (исключение передачи вибрации на тракт и обратной «раскачки» опор). Предусмотреть штатные точки вибромониторинга (2 канала на подшипник, СКЗ виброскорости, интеграция в АСУТП).\n\n(2) **Воздуходувка дутья** — тип не выбран (центробежная одно/двухступенчатая, ~315–400 кВт, обороты 3000 об/мин или выше при мультипликаторе — 50+ Гц); фундамент проектируется по паспортным динамическим нагрузкам поставщика; до выбора машины в планах резервируется блок 6×4 м с допуском по массе до 60 т. (3) **Печь КС** — квазистатическая, но с пульсационной составляющей кипящего слоя (пульсации перепада 48–53 кПа на площади 28,3 м² — знакопеременная составляющая до ~1–2 % статики в полосе 0,5–5 Гц); фундамент печи — плита под опорный каркас, проверка на резонанс с низшими тонами каркаса. (4) **Смеситель СШ-25, шнековые холодильники, конвейеры** — малые динамические добавки (коэффициент динамичности 1,1–1,2 к статике); вибраторы бункеров и виброразгружатели силосов — локальные импульсные нагрузки, гасятся конструкцией силоса (проверка узлов крепления на усталость). (5) **ЭФ** — статика 89,7 т + импульсы встряхивания молотками (учитываются коэффициентом 1,1). (6) **Мостовой кран** — горизонтальные тормозные силы на колонны по СП 20.13330.\n\nВсе фундаменты под «мокрые» и пылевые зоны (холодильники, силосы, фильтрация) — с бортиками и трапами; фундаменты у цементной меди — с кислотостойким покрытием пола (ИД разд. 2.2: полы из кислотоупорного бетона с дренажными канавками). Анкеровка — закладные и фундаментные болты по ГОСТ 24379.1-2012. На планах фундаментов для каждого узла приводится таблица: N ст., N длит., F дин. (амплитуда, частота), допускаемая амплитуда, привязка болтов.","items":[{"label":"Дымосос: частота возмущения","value":"25 Гц (1500 об/мин), агрегат 5,64 т","src":"ИД табл. 23 п.391-392, 397"},{"label":"Масса фундамента дымососа (предв.)","value":"45–70 т (8–12 × масса агрегата), отстройка от 25 Гц ±25 %","src":"решение БИ по СП 26.13330"},{"label":"Воздуходувка: резерв под фундамент","value":"блок 6×4 м, до 60 т — до выбора машины","src":"решение БИ (машина не выбрана — см. открытые вопросы)"},{"label":"Пульсации слоя печи","value":"перепад 48–53 кПа на 28,27 м², полоса 0,5–5 Гц","src":"ИД табл. 23 п.215, 226-228 (пульсации — природа КС)"},{"label":"Класс балансировки роторов","value":"G6.3 — включить в опросные листы","src":"решение БИ (ГОСТ ИСО 21940-11)"}],"gost":[{"doc":"СП 26.13330.2012","what":"Фундаменты машин с динамическими нагрузками — дымососы, воздуходувка; допускаемые амплитуды"},{"doc":"СП 22.13330.2016","what":"Основания зданий и сооружений — несущая способность и осадки"},{"doc":"ГОСТ 24379.1-2012","what":"Болты фундаментные — анкеровка оборудования"},{"doc":"ГОСТ ИСО 21940-11-2019","what":"Балансировка роторов — назначение класса G для дымососов/воздуходувки (уточнить номер применяемой части)"},{"doc":"ГОСТ 12.1.012-2004","what":"Вибрационная безопасность — уровни на рабочих местах у дымососов"}],"open":["ИГИ пятна застройки (модуль деформации, УГВ) — задание на изыскания в составе БИ","Паспортные динамические нагрузки дымососа и воздуходувки — по ОЛ поставщиков","Необходимость виброизоляторов под дымосос (пружинные блоки) против массивного фундамента — ТЭО на стадии БИ"]},{"id":"s18-montazh","title":"Требования к монтажу (включая вес самых тяжёлых частей)","kind":"graf","body":"**Самые тяжёлые и крупногабаритные единицы** (определяют такелажную схему): электрофильтр УГТ1-20-4 — **72,6 т общий вес** при габарите 18,1×4,8×18,7 м; поставка секциями: корпус (царги), блоки осадительных/коронирующих электродов, бункер; максимальный монтажный блок — по разбивке завода (предварительно 15–20 т — корпусная секция); монтаж — гусеничным/автокраном соответствующей грузовысотной характеристики до закрытия теплового контура (ЭФ монтируются первыми либо через монтажный проём). Котёл-утилизатор: наиболее тяжёлая единица — **барабан** (масса по КД завода; по аналогам КУ печей КС — ориентировочно 15–25 т, уточнить в ОЛ) на верхней отметке ~+18…20 — требуется кран большой грузовысотности или накатка по временным путям; панели «лист-полутруба» — блоками по 3–8 т. Печь КС: корпус Ø6–8,4 м — негабарит, поставка царгами с укрупнительной сборкой на площадке у оси печи; масса самой тяжёлой царги — по КД (оценочно 10–15 т); футеровка ~135 т шамота — ручная кладка по проекту футеровки с регламентированной сушкой 10–30 сут (дрова + горелки МГМГ-10, кривая сушки — по проекту футеровки). Дымосос: улитка 3,32 т + двигатель 2,32 т; холодильник D2424-6 — двухшнековый блок ~9,6 м длиной (масса — в ОЛ, оценочно 12–18 т); силосная башня 100 м³ — цельносварная обечайка (транспортный негабарит — согласование перевозки) либо полистовая сборка на месте.\n\n**Порядок и требования**: (1) монтаж по ППР(м), разрабатываемому на базе настоящих требований БИ; последовательность: фундаменты и подливка → крупногабарит до закрытия контура (ЭФ, КУ, печь, силосы) → каркас и кровля → трубопроводы/газоходы → КИП; (2) мостовой кран пролёта печи/КУ вводится в строй на раннем этапе и используется как монтажный механизм для внутренних узлов (г/п проверяется по барабану КУ); (3) сварка газоходов 09Г2С и коллекторов КУ — аттестованные технологии (НАКС) с контролем по СП 70.13330 и ФНП № 536 для элементов под давлением; футеровка газоходов легковесом ШЛ-0,4 — после испытаний на плотность; (4) кислородопровод — обезжиривание, монтаж по ФНП № 486; (5) выверка динамического оборудования: соосность валов дымососов/двигателей лазерной центровкой (допуски — по паспорту, класс G6.3), подливка безусадочными составами; (6) холодные испытания трактов: воздушная опрессовка газового тракта с проверкой присосов (норма подсосов по ИД: КУ 4,9 %, циклон 3,1 %, ЭФ 1,5 % — приёмочный критерий герметичности), гидроиспытания КУ по ФНП № 536; (7) монтаж в зимний период — тепляки для бетонных и футеровочных работ (расчётная температура −40 °C); (8) весовой контроль негабаритов при перевозке по площадке — согласование маршрутов с КГМК. В составе БИ выдаётся ведомость монтажных блоков с массами, размерами и отметками установки + требования к такелажной оснастке.","items":[{"label":"Самая тяжёлая единица газоочистки","value":"ЭФ 72,6 т (секциями по 15–20 т)","src":"ИД табл. 23 п.354-355; разбивка — оценка Исполнителя"},{"label":"Дымосос / двигатель","value":"3,32 т / 2,32 т","src":"ИД табл. 23 п.392, 397"},{"label":"Циклон","value":"1,189 т, H=6,1 м — единым блоком","src":"ИД табл. 23 п.302, 312"},{"label":"Футеровка печи","value":"~135 т шамота; сушка 10–30 сут по регламенту","src":"оценка по геометрии ИД; сроки — ИД разд. 6"},{"label":"Критерий герметичности тракта","value":"подсосы: КУ ≤4,9 %, циклон ≤3,1 %, ЭФ ≤1,5 %","src":"ИД табл. 23 п.273, 313, 356"},{"label":"Кампания печи / капремонт","value":"3 года / 29–31 сут (охлаждение 2, разборка 10, кладка 14, сушка 3–5)","src":"ИД разд. 6"}],"gost":[{"doc":"СП 75.13330.2011","what":"Технологическое оборудование и трубопроводы — правила производства и приёмки монтажных работ"},{"doc":"СП 70.13330.2012","what":"Несущие и ограждающие конструкции — монтаж каркаса, сварные соединения"},{"doc":"ГОСТ 24444-87","what":"Оборудование технологическое — требования монтажной технологичности (закладывается в ОЛ)"},{"doc":"ФНП № 461 от 26.11.2020","what":"Подъёмные сооружения — краны, ППР с применением ПС, такелаж"},{"doc":"ФНП № 536 от 15.12.2020","what":"Монтаж и гидроиспытания котла-утилизатора и паропроводов"},{"doc":"ФНП № 486 от 26.11.2020","what":"Монтаж и обезжиривание кислородных линий"}],"open":["Массы и разбивка на монтажные блоки КУ, печи, холодильников, воздуходувки — по КД заводов (ведомость блоков — итерация после ТКП)","Способ доставки силоса 100 м³ (цельный негабарит / полистовая сборка) — логистическая проработка","Грузоподъёмность и режим работы мостового крана — после фиксации массы барабана КУ"]},{"id":"s19-spec","title":"Спецификации, опросные листы, нетиповое оборудование и оборудование длительного цикла изготовления","kind":"graf","body":"**Спецификация основного и вспомогательного оборудования** оформляется по ГОСТ 21.110-2013 с обязательными графами ТЗ п.3.5: технические характеристики, габариты, масса, энергопотребление; базовое наполнение — из ИД табл. 23/24Б/25 (позиции, типоразмеры, массы: ЭФ 72,6 т, циклон 1,19 т, дымосос 3,32+2,32 т и т.д.) с дополнением данными ТКП. **Спецификация нетипового оборудования** с техтребованиями к проектированию, изготовлению и поставке + эскизные чертежи (ГОСТ 2.119-2013): печь КС (корпус, свод, газораспределительная подина с 583 соплами ХН78Т, пороги выгрузки с дроссельным затвором и ножевой шиберной задвижкой, шнековый забрасыватель), котёл-утилизатор (перепроектирование под параметры ИД), топка-смеситель дутья, приёмные/расходные бункеры с футеровкой PE500, силосные башни, укрытия и узлы аспирации, газоходы Ø2000/Ø1100 с футеровкой.\n\n**Комплект опросных листов** (по одному на каждую позицию основного технологического, электротехнического и КИП-оборудования — формы КГМК): в ОЛ обязательно вносятся параметры двух вариантов обжига (осн./вспом.) как два расчётных режима — газовый тракт, КУ и дымососы выбираются по вспомогательному (больший объём газа), кислородный узел — по основному; для динамических машин — требование паспортных динамических нагрузок и класса балансировки; для ЭФ — гарантия ≤0,1 г/нм³ при 21 830 нм³/ч; для рукавных фильтров аспирации — ≤10 мг/нм³; для всех СИ — внесение в Госреестр РФ и первичная поверка (Прил. №5).\n\n**Оборудование длительного цикла изготовления** (исходные требования выдаются в первоочередном порядке для контрактации до завершения БИ): печь КС с футеровкой (цикл проектирования+изготовления 12–18 мес — оценка), котёл-утилизатор (12–16 мес), электрофильтры (10–14 мес), воздуходувка (8–12 мес), дымососы, холодильники Holo-Screw Flite (импортозамещение — проработка аналогов), силосные башни, агрегаты питания ЭФ, КТП и ЧРП 6 кВ. По каждой позиции — не менее 2–3 ТКП (ТЗ п.3.6). Импортозамещение по Прил. №5 (оборудование и ПО автоматизации — производства РФ; отступления — по согласованию с Заказчиком) распространяется и на приводную технику.","items":[{"label":"Объём комплекта ОЛ (оценка)","value":"~35–45 позиций технологического + электро + КИП","src":"состав по ИД табл. 24Б; оценка Исполнителя"},{"label":"Определяющий режим для газового тракта","value":"вспомогательный (21 830 нм³/ч, 5 426 Па)","src":"ИД табл. 23 п.357, 398; разд. 2.5"},{"label":"Определяющий режим для кислородного узла","value":"основной (4 687 нм³/ч O₂)","src":"ИД табл. 23 п.198"},{"label":"Длительный цикл (оценка сроков)","value":"печь 12–18 мес; КУ 12–16; ЭФ 10–14 мес","src":"оценка Исполнителя (уточняется ТКП)"}],"gost":[{"doc":"ГОСТ 21.110-2013","what":"Спецификация оборудования, изделий и материалов"},{"doc":"ГОСТ 2.119-2013","what":"Эскизный проект — состав эскизных чертежей нетипового оборудования"},{"doc":"ГОСТ 15.005-86","what":"Создание изделий единичного и мелкосерийного производства — печь, КУ, нетиповые металлоконструкции (уточнить применимость с Заказчиком)"},{"doc":"ТР ТС 010/2011, ТР ТС 032/2013","what":"Обязательная оценка соответствия — фиксируется в ОЛ"}],"open":["Формы опросных листов КГМК — запросить у Заказчика до выпуска комплекта","Перечень оборудования, передаваемого в ЦИМ (Приложение №4) — увязка атрибутов спецификации с моделью","Статус проекта печи HATCH (права, актуализация под РФ-изготовителя) — решение Заказчика"]},{"id":"s20-teplo-vrednosti","title":"Тепловыделения и выделения вредностей от оборудования в помещения цеха","kind":"calc","body":"**Тепловыделения.** Базовая статья — потери печи КС в окружающую среду: 10 % теплового баланса = **3,67 ГДж/ч (1,02 МВт) осн. / 6,46 ГДж/ч (1,79 МВт) вспом.** (ИД табл. 23 п.240); большая часть рассеивается поверхностями печи (корпус ~200 м², температура наружной поверхности при шамотной футеровке — 60–90 °C расчётно) и газоходом Ø2000 в помещение отделения обжига. Дополнительно в цех поступают: потери изолированных поверхностей КУ, газоходов и паропроводов (при нормируемой плотности потока по СП 61.13330 ~150–300 Вт/м² на горячих трактах — суммарно 0,2–0,4 МВт, уточняется расчётом изоляции); тепло от электроприводов (~10 % потребляемой мощности ≈ 20–60 кВт); тепло охлаждаемых продуктов на открытых участках шнеков (малое, тракты закрыты). **Итого проектная оценка тепловыделений в объём цеха 1,3–2,2 МВт** — определяющая нагрузка для воздухообмена: летом — аэрация/механическая вытяжка из верхней зоны отделения обжига, зимой тепловыделения частично замещают отопление (дежурное отопление +5 °C в нерабочих зонах, воздушно-тепловые завесы ворот — климат −40 °C). Точный тепловой паспорт по помещениям выдаётся в БИ таблицей «аппарат → поверхность, м² → t поверхности → Вт».\n\n**Вредности.** (1) SO₂: источники — надслоевое пространство печи (+50–100 Па) через неплотности загрузочного узла и порогов, ревизионные люки при обслуживании; мероприятия: аспирация укрытий узлов печи, поддержание минимального избыточного давления/перевод на разрежение (вопрос уставки — см. P&ID), газоанализаторы СО₂/SO₂ рабочей зоны с сигнализацией при ПДКрз 10 мг/м³ (ГОСТ 12.1.005). (2) Пыль медьсодержащая (Cu, Ni — с учётом канцерогенности Ni): источники — пересыпки, растаривание, налив; мероприятия: герметизация + аспирация с возвратом пыли, уборка полов промышленными пылесосами/гидросмывом (сухая пыль II класса опасности — ИД разд. 6), контроль воздуха рабочей зоны по программе производственного контроля (СП 2.2.3670-20). (3) Тепловое излучение у печи и порогов выгрузки (930 °C) — экранирование, ограничение времени пребывания, СИЗ; облучённость на рабочих местах ≤140 Вт/м² по СанПиН 1.2.3685-21 (уточняется расчётом). (4) Шум: дымососы 400 кВт, воздуходувка — шумоизолированные помещения/кожухи, цель ≤80 дБА на рабочих местах (ГОСТ 12.1.003). (5) Вибрация — виброизоляция фундаментов (см. раздел 17). Категории помещений по пожарной опасности: мазутный узел — В1-В2; электропомещения — В1-В3; основные технологические отделения — Д/Г (негорючие материалы при высоких температурах); уточняется расчётом по СП 12.13130.2009.","items":[{"label":"Потери печи в окружающую среду","value":"1,02 / 1,79 МВт (10 % баланса)","src":"ИД табл. 23 п.240 (пересчёт в МВт)"},{"label":"Суммарные тепловыделения в цех (предв.)","value":"1,3–2,2 МВт","src":"оценка Исполнителя (печь по ИД + изоляция по СП 61.13330)"},{"label":"ПДКрз SO₂","value":"10 мг/м³ — уставка газоанализаторов рабочей зоны","src":"ГОСТ 12.1.005-88"},{"label":"Класс опасности пыли концентрата","value":"II (не горюч, взрывобезопасен)","src":"ИД разд. 6 (ТУ 24.44.11-237-48200234-2017)"},{"label":"Цель по шуму","value":"≤80 дБА на рабочих местах","src":"ГОСТ 12.1.003-2014; СанПиН 1.2.3685-21"}],"gost":[{"doc":"СП 60.13330.2020","what":"Вентиляция и отопление — ассимиляция 1,3–2,2 МВт тепловыделений, воздушные завесы"},{"doc":"СП 61.13330.2012","what":"Нормы плотности теплового потока изоляции — основа расчёта тепловыделений трактов"},{"doc":"ГОСТ 12.1.005-88 и СанПиН 1.2.3685-21","what":"ПДК рабочей зоны (SO₂, медь, никель), микроклимат, тепловое облучение"},{"doc":"СП 2.2.3670-20","what":"Санитарные требования к условиям труда — производственный контроль"},{"doc":"ГОСТ 12.1.003-2014 / ГОСТ 12.1.012-2004","what":"Шум и вибрация — дымососы, воздуходувка"},{"doc":"СП 12.13130.2009","what":"Категорирование помещений по взрывопожарной опасности"}],"open":["Тепловой паспорт по помещениям (поверхности, температуры) — после расчёта изоляции на стадии БИ","Карта источников выделений и воздухообмен по помещениям — раздел ОВ на стадии БИ/ОТР","Категории помещений по СП 12.13130 — расчёт после фиксации мазутного хозяйства"]},{"id":"s21-stoimost","title":"Стоимость поставки по Лоту №1 (методика и состав)","kind":"pz","body":"Стоимость комплектной поставки формируется в составе БИ по требованиям ТЗ п.3.6: (1) **по каждой позиции оборудования — не менее 2–3 ТКП** потенциальных поставщиков; референсные изготовители зафиксированы в ИД (печь — по проекту HATCH; КУ — Белэнергомаш-БЗЭМ / Энергоцветмет; циклон — Энергомаш (Тверь) по разработке НИИОГАЗ; ЭФ — «Атмосфера» (Семибратово); дымососы — «Армавент»; питатели — Gornorud; дозаторы — «Агроэскорт»; конвейеры — КЗМКО; смеситель — НПО «Спайдермаш»; холодильники — Hyquip Rotolok / YT Conveyor; силосы — НПО «Спецнефтемаш»; станция растаривания — КИП-Сервис; цементовозы — Tongcheng) — по каждой группе добавляются альтернативные РФ-поставщики; (2) **оценка общей стоимости комплектной поставки** технологического оборудования и материалов в границах п.3.3 ТЗ — включая трубопроводы, газоходы с футеровкой, технологические металлоконструкции (этажерки, площадки обслуживания), теплоизоляцию, КИПиА и АСУТП с прикладным ПО, электрооборудование в согласованных границах, ЗИП на ПНР и 2 года (АСУТП — ≥10 % и ≥1 шт. каждого наименования по Прил. №5).\n\nСтруктура сводки стоимости: оборудование по группам (шихтоподготовка / печной комплекс / газоочистка / охлаждение-отгрузка / аспирация / КИПиА и АСУТП / электро) + материалы (газоходы, трубопроводы, металлоконструкции, футеровка, изоляция) + услуги (шеф-монтаж, ПНР, обучение, документация ЦИМ по Прил. №4). По валютным позициям (холодильники Holo-Screw Flite, цементовозы) — курсовые оговорки и таможенные платежи отдельной строкой; приоритет — производство РФ (Прил. №5). Итоговая стоимость Лота №1 в настоящем документе **не приводится до получения ТКП** — выпуск сводки предусмотрен отдельным этапом календарного плана БИ; для бюджетных решений Заказчика первыми контрактуются позиции длительного цикла (печь, КУ, ЭФ).","items":[{"label":"Число ТКП на позицию","value":"не менее 2–3","src":"ТЗ п.3.6"},{"label":"ЗИП АСУТП/КИП","value":"на 2 года: ≥10 % и ≥1 шт. каждого наименования","src":"Приложение №5, п.1"},{"label":"Референсные поставщики","value":"зафиксированы в ИД табл. 23/24Б — база рассылки ТКП","src":"ИД табл. 23, 24Б"}],"gost":[{"doc":"Методика 421/пр (Минстрой)","what":"При переходе к сметной стоимости на ОТР/ПД — НМЦ и конъюнктурный анализ (на стадии БИ — коммерческие ТКП; уточнить применимость с Заказчиком)"}],"open":["Сводка стоимости по ТКП — отдельный этап после рассылки ОЛ (все позиции)","Валютно-логистическая схема по импортным позициям (холодильники, цементовозы) и аналоги РФ/ЕАЭС","Границы стоимости электрооборудования (до/после КТП) — после согласования границ по Прил. №3"]}]}, null, null, null].filter(Boolean);
const COMP = {"updated":"2026-08-13","subject":"ДЕЛЬТА Инжиниринг","summary":"ООО «Дельта Инжиниринг и Консалтинг» (ИНН 9710105935, зарегистрировано 15.11.2022) — фактический преемник российской команды Hatch. Компания сама заявляет: «Опыт и компетенции наших экспертов были накоплены в ООО „Хэтч Инжиниринг и Консалтинг“ в составе крупнейшей международной инжиниринговой компании „Хэтч“ за более чем 20 лет работы» (Хэтч ИК работал в РФ с 2007 г.). Адреса совпадают с бывшими офисами Хэтч вплоть до помещения: СПб, пр. Энергетиков 4к1 стр.1, помещ. 47Н, эт. 13 и Москва, Никольская 10. Hatch Ltd (Канада, ~10 000 сотрудников) официально ушла из РФ («clean break», заявление 06.09.2023: офис СПб закрыт навсегда, в стране остался 1 сотрудник). Юридического правопреемства нет — Дельта учреждена двумя физлицами (Сирач А.Н. и Елькин И.Б. по 50%), связь ограничивается командой, офисами и наследием компетенций. Заявляют 120+ сотрудников и 500+ проектов; клиенты — Норникель, Еврохим, Полюс, Удоканская медь и др.\n\nКритический факт подтверждён по тендерным ИД: конструкция электролизных ванн Лота №3 — разработка Дельты. В НТП ч.2 (дог. 001-1146н) её документ вшит целиком как Приложение В («ДЕЛЬТА Инжиниринг и Консалтинг. Исходные требования на изготовление и поставку оборудования. Ванны электролизные», шифр D202415-PM032-240-242-0001, ред. 1 от 14.04.2025, статус «Рассмотрение Заказчиком»). Раздел 4.2.2 прямо фиксирует: «Основные характеристики электролизных ванн, приняты по данным проекта ДЕЛЬТА (приложение В) и согласованы с Заказчиком», а раздел 3: «Габариты и конструкция элементов ванны по проекту Дельта, приложение В». Всего 4 текстовых упоминания плюс само приложение. Более того, документ Дельты составлен «в рамках выполнения работ по договору АО „Кольская ГМК“… производительностью 50 000 т катодной меди в год» — то есть Дельта уже имеет собственный контракт с КГМК по этому же комплексу ОВЭ (на её сайте проект значится как «2019–2025», включая ТЭП участка электроэкстракции и гидродинамическое моделирование печи КС). ИД на 75 тыс. т масштабируют её же ванну со 140 шт. (4 ряда × 35) до 180 шт. (2 серии × 90).\n\nЧто это значит (оценка): по позиции «ванны» Лота №3 у Дельты решающая фора — конструкция её, согласована Заказчиком, сайт компании заявляет патенты на ванны электроэкстракции, и у неё на руках весь остальной комплект проекта D202415 (схемы, 3D, расчёты), которого нет у других участников. Но Лот №3 существенно шире ванн: по ТЗ в него входят КСМ, спецкраны с позиционированием, ошиновка, аспирационные укрытия, аноды/матрицы, АСУ и компоновка в существующем здании ЦЭМ — здесь поле ровное. Формальный конфликт интересов (автор части ИД участвует в конкурсе по этим ИД) существует, но Заказчик сам вложил документ Дельты в ИД и «согласовал» характеристики — атаковать это в лоб рискованно; рабочий ход — письменно требовать равного информационного пакета для всех участников.\n\nГде выигрывать (оценка): Лоты №1 (цех обжига + фильтрация), №2 (купоросный участок) и №4 (склад ГП) — там встроенного преимущества у Дельты нет, а её публичный портфель последних лет смещён в ГОКи/золото/железо. По Лоту №3 — принять геометрию ванн как заданную спецификацию, дать 2–3 независимых ТКП на изготовление ванн по этой геометрии и отстроиться исполнением: роботизация КСМ, краны, АСУ, компоновка, цена. Их уязвимости: молодое юрлицо (УК 100 тыс. руб.), маржа около нуля (~0,2 млн руб. прибыли при ~865 млн руб. выручки по карточке РБК), разрыв с глобальной Hatch — референсы Hatch формально им не принадлежат.","in_tender":[{"quote":"Конструкция печи КС, применяемой для обжига шихты на основе медного концентрата ОРФ, спроектирована специалистами инжиниринг-консалтинговой компанией HATCH, имеющих большой опыт в разработке установок подобного рода для процесса обжига пиритных золотосодержащих концентратов в Австралии и Южной Африке, медных, медно-кобальтовых и медно-никелевых руд в Замбии и Канаде, свинцово-цинковых концентратов в Казахстане и т.д.","where":"ИД часть 1 (пирометаллургия), раздел 2.3 «Обжиг шихты в печи КС»","meaning":"Ключевой агрегат Лота №1 — печь КС — тоже разработка Hatch, чья российская команда сегодня работает в Дельте. Преимущество конкурента распространяется не только на Лот №3, как считалось изначально, но и на Лот №1."},{"quote":"Печь круглая в поперечном сечении, имеет конусное расширение по всей высоте, начиная от подины. Загрузка печи осуществляется шнековым забрасывателем. Имеет несекционированную газовую коробку. Печь разработана компанией HATCH.","where":"ИД часть 1, таблица 23, строка 212 «Используемое оборудование»","meaning":"Конструктив печи зафиксирован в обязательных исходных данных как решение Hatch: круглое сечение, конусное расширение по всей высоте, несекционированная газовая коробка, шнековый забрасыватель. Проектировать придётся под этот конструктив."},{"quote":"Согласно рекомендациям специалистов компании HATH International, утвержденным рабочей группой проекта ОВЭ 150 и приведенным в итоговом отчете OVE-D-HATCH-PM-REP-00003-R, 336 час/год приходится на плановые простои, а остальные 510 час/год на внеплановые простои.","where":"ИД часть 1, раздел по фонду рабочего времени","meaning":"Даже расчётный фонд рабочего времени комплекса — 7920 часов — опирается на отчёт Hatch, утверждённый рабочей группой проекта. Их методология заложена в базовые допущения проекта."},{"quote":"Приложение В. ДЕЛЬТА Инжиниринг и Консалтинг. Исходные требования на изготовление и поставку оборудования. Ванны электролизные.","where":"НТП ч.2 (дог. 001-1146н), оглавление (стр. 113) и заголовок Приложения В","meaning":"Документ конкурента вшит в тендерные ИД целиком как отдельное приложение: исходные требования на ванны для Лота №3 написаны Дельтой."},{"quote":"Электролиз в ящичных ваннах с нерастворимыми анодами и колпаками с индивидуальной торцевой аспирацией. Катодов 84 шт., анодов 85 шт. Габариты и конструкция элементов ванны по проекту Дельта, приложение В.","where":"НТП ч.2, раздел 3 «Технологические параметры», блок «Электроэкстракция меди»","meaning":"Геометрия и конструкция всех элементов ванны заданы «по проекту Дельта» — участники обязаны проектировать вокруг чужого решения (внутр. габариты 8485×1155×1650 мм, 84 катода/85 анодов, 280 А/м2)."},{"quote":"Рекомендации по выбору основного оборудования электролизного отделения приведены в таблице 4.2. Основные характеристики электролизных ванн, приняты по данным проекта ДЕЛЬТА (приложение В) и согласованы с Заказчиком.","where":"НТП ч.2, раздел 4.2.2, преамбула к таблице 4.2","meaning":"Ключевая формула: характеристики ванн не просто рекомендованы — они «согласованы с Заказчиком», т.е. для КГМК это уже принятое решение, менять его в оферте бессмысленно."},{"quote":"ИСХОДНЫЕ ТРЕБОВАНИЯ D202415-PM032-240-242-0001 на изготовление и поставку оборудования. Ванны электролизные. … 14.04.2025 ¦ 1 ¦ Рассмотрение Заказчиком ¦ И. Шунькин ¦ С. Наумов ¦ С. Наумов","where":"Приложение В, титульный лист (шифр, ревизия, подписи)","meaning":"Свежий документ (ред. 1 от 14.04.2025) с шифром проекта Дельты D202415 и фамилиями исполнителей — работа Дельты по ваннам шла параллельно подготовке тендера; в списке источников также её «Аппаратурно-технологическая схема — Отделение электроэкстракции меди» (D202415-24000-210-282-0001)."},{"quote":"Исходные требования на изготовление и поставку ванн электролизных составлены в рамках выполнения работ по договору «АО «Кольская ГМК». Строительство комплекса «Обжиг – выщелачивание – электроэкстракция производительностью 50 000 т катодной меди в год».","where":"Приложение В, «Общая часть»","meaning":"У Дельты собственный действующий/выполненный договор с КГМК по этому же комплексу ОВЭ (в версии на 50 тыс. т). Она не «один из участников», а инжиниринговый партнёр Заказчика по предыдущей стадии того же проекта."},{"quote":"Электроэкстракция меди происходит в полимербетонных ваннах (4 ряда, 140 шт.)… Ванны расположены в четыре параллельных ряда по 35 ячеек в ряду. [против] Ванны группируются в две серии… общее количество ванн составит 180 шт. (две серии по 90 шт.).","where":"Приложение В (проект Дельты на 50 тыс. т) против раздела 4.2.2 НТП (75 тыс. т)","meaning":"ИД на 75 тыс. т масштабируют ванну Дельты со 140 до 180 шт. и меняют компоновку под существующий корпус ЦЭМ (2 серии × 90, шаг колонн 24 м) — сама ванна не пересматривалась, пересчитаны количество и размещение."}],"profile":[{"fact":"ООО «Дельта Инжиниринг и Консалтинг»: ИНН 9710105935, ОГРН 1227700758438, зарегистрировано 15.11.2022; юрадрес: Москва, ул. Никольская, д. 10; филиал: СПб, пр. Энергетиков, д. 4, к. 1, стр. 1, помещ. 47Н, эт. 13.","src":"https://companies.rbc.ru/id/1227700758438-obschestvo-s-ogranichennoj-otvetstvennostyu-delta-inzhiniring-i-konsalting/","checked":"2026-08-13","kind":"факт"},{"fact":"Учредители — Сирач Андрей Николаевич (50%) и Елькин Иван Борисович (50%); гендиректор по карточке РБК (обновл. 06.03.2025) — Коваленко Ирина Владимировна; по данным выдачи Rusprofile, с января 2026 гендиректор — Елькин И.Б. Уставный капитал 100 тыс. руб.","src":"https://companies.rbc.ru/id/1227700758438-obschestvo-s-ogranichennoj-otvetstvennostyu-delta-inzhiniring-i-konsalting/","checked":"2026-08-13","kind":"факт"},{"fact":"Финансы по карточке РБК (последний отчётный год в карточке, обновл. 03.2025): выручка 864,6 млн руб., чистая прибыль 0,213 млн руб., себестоимость 843,9 млн руб. — маржа около нуля.","src":"https://companies.rbc.ru/id/1227700758438-obschestvo-s-ogranichennoj-otvetstvennostyu-delta-inzhiniring-i-konsalting/","checked":"2026-08-13","kind":"факт"},{"fact":"Сайт компании: «независимая инжиниринговая и консалтинговая компания… для предприятий горно-металлургической отрасли»; 120+ сотрудников, 500+ проектов, 20+ лет опыта; офисы СПб и Москва; клиенты: Норильский Никель, МХК Еврохим, NORDGOLD, Удоканская медь, Полюс, Металлоинвест, Полиметалл, Руссдрагмет, Росатом.","src":"https://deltaeng.ru/","checked":"2026-08-13","kind":"факт"},{"fact":"Собственные разработки по сайту: «патенты на ванны электроэкстракции», матрицы со спецпокрытием для производства ронделей, разгрузочное устройство печи кипящего слоя. Номера патентов открытым поиском не верифицированы (в выдаче агрегаторов упоминаются патент на способ изготовления полимербетонной электролизной ванны и способ удаления шлама из электролизных ванн).","src":"https://deltaeng.ru/","checked":"2026-08-13","kind":"факт"},{"fact":"Проект на сайте Дельты: АО «Кольская ГМК», Мурманская обл., медь, 2019–2025 — «Технико-экономическое предложение на поставку оборудования для переработки медного концентрата отделения разделения файнштейна, включая оценку технологии и капитальных затрат, в том числе участка электроэкстракции»; выполнялось гидродинамическое моделирование печи КС. Т.е. компания в проекте ОВЭ с 2019 г.","src":"https://deltaeng.ru/projects/","checked":"2026-08-13","kind":"факт"},{"fact":"Второй проект для КГМК: «Диверсификация никелевого производства», Мончегорск, никель, 2021–2023 — схема производства катодного никеля гальванического качества.","src":"https://deltaeng.ru/projects/","checked":"2026-08-13","kind":"факт"},{"fact":"Портфель (31 проект на сайте) смещён в ГОКи/обогащение/золото (Полюс — Олимпиада, Благодатное, Наталка; Nordgold, Быстринское, Стойленский, Ковдорский, Михайловский ГОКи); по меди — КГМК ОВЭ, Ак-Суг (ПД обогатительного комплекса, 2018–2020), «Актогай Смелтер» (Казахстан, технология производства и электрорафинирования, 2017–2018). Реализованных «под ключ» электролизных цехов под брендом Дельта (после 2022) в открытых источниках не найдено.","src":"https://deltaeng.ru/projects/","checked":"2026-08-13","kind":"факт"},{"fact":"Адреса Дельты полностью совпадают с адресами ООО «Хэтч Инжиниринг и Консалтинг»: Москва, Никольская 10 (юрадрес обеих) и СПб, пр. Энергетиков 4к1 стр.1, помещ. 47Н, эт. 13 (филиалы обеих) — компания села в бывшие офисы Хэтч.","src":"https://sbis.ru/contragents/7702647722/771001001 и https://companies.rbc.ru/id/1227700758438-...","checked":"2026-08-13","kind":"факт"},{"fact":"Юридическое правопреемство от Hatch отсутствует: Дельта учреждена физлицами, Hatch Pty Ltd в составе владельцев нет; переход — де-факто (команда, офисы, компетенции), а не де-юре. Формальных документов о передаче бизнеса открытыми источниками не подтверждено.","src":"не подтверждено (вывод из данных ЕГРЮЛ-карточек РБК/СБИС)","checked":"2026-08-13","kind":"оценка"},{"fact":"Биографии учредителей (Сирач, Елькин) в связке с Hatch открытыми источниками не подтверждены — только общее заявление сайта Дельты о происхождении команды из Хэтч.","src":"не подтверждено","checked":"2026-08-13","kind":"факт"},{"fact":"Численность «среднесписочная 1 сотрудник» в карточке РБК относится к головному юрлицу и расходится с заявленными 120+; вероятно, штат оформлен в филиале/по договорам — реальный масштаб команды ближе к заявленному, судя по выручке ~865 млн руб.","src":"https://companies.rbc.ru/id/1227700758438-...","checked":"2026-08-13","kind":"оценка"},{"fact":"Не путать с однофамильцами: ООО «Дельта Инжиниринг» (Челябинск, КИПиА), ООО «Дельта Инжиниринг» (Москва, ИНН 9724090943, торговля) — другие компании, к конкуренту отношения не имеют.","src":"https://www.rusprofile.ru/id/1227700432222","checked":"2026-08-13","kind":"факт"}],"hatch":[{"fact":"Hatch Ltd — частная инжиниринговая компания (штаб-квартира Миссиссога, Канада; основана в 1955), ~10 000 сотрудников (2023), 70+ офисов; сектора: горная металлургия, энергетика, инфраструктура; в металлургии — медь, никель, алюминий, золото, железо, литий; клиенты Rio Tinto, Vale, Barrick.","src":"https://en.wikipedia.org/wiki/Hatch_Ltd","checked":"2026-08-13"},{"fact":"ООО «Хэтч Инжиниринг и Консалтинг» (ИНН 7702647722, ОГРН 1077758247808) — российская дочка Hatch с 2007 г.; 99,9% у Hatch Pty Ltd (Австралия); персонал сократился с 99 чел. (2022) до 1 чел. (2025).","src":"https://spark-interfax.ru/moskva-tverskoi/ooo-khetch-inzhiniring-i-konsalting-inn-7702647722-ogrn-1077758247808-977f87fd20de434c9f607a77d30680c5","checked":"2026-08-13"},{"fact":"Официальный уход из РФ (заявление Hatch от 06.09.2023, портал Leave Russia, статус «clean break»): до вторжения — несколько сотен сотрудников в двух офисах; офис СПб закрыт навсегда, московский — только до завершения расчётов; остался 1 сотрудник; намерения возвращаться нет.","src":"https://leave-russia.org/hatch-ltd","checked":"2026-08-13"},{"fact":"Медь/электрометаллургия Hatch: услуги по EW/ER-цехам — диагностика танк-хаусов, компоновка ванн, ошиновка и контактные системы, вентиляция, краны, обучение, EPCM; фирменные технологии HELM Tracker™ (поиск коротких замыканий) и HELM Director (планирование съёма/обслуживания).","src":"https://www.hatch.com/Expertise/Services-and-Technologies/Electrometallurgy","checked":"2026-08-13"},{"fact":"Референс Hatch по медному электролизу: Tenke Fungurume (Freeport-McMoRan, ДР Конго, 2011–2012) — детальный инжиниринг, закупки и сопровождение строительства расширения, включая новый электролизный цех (EW tankhouse); рост производства меди со 125 до 190 тыс. т/год, кобальта с 10 до 20 тыс. т/год.","src":"https://www.hatch.com/projects/metals-and-minerals/tenke-fungurume-mine","checked":"2026-08-13"},{"fact":"Kamoa-Kakula (Ivanhoe Mines, ДРК): Hatch выполняла независимый аудит углеродных метрик проекта (2020). Участие Hatch в проектировании самого медеплавильного завода Kamoa открытыми источниками не подтверждено.","src":"https://www.ivanhoemines.com/news-stories/news-release/kamoa-kakulas-off-take-agreements-signed-for-phase-1-blister-copper-and-copper-concentrate/","checked":"2026-08-13"},{"fact":"Обжиг в кипящем слое: у Hatch есть собственные разработки печей КС (например, демонстрационный обжиговый аппарат для золотых концентратов DST, техдоклад 2014) — компетенция, унаследованная командой; но технология печей КС для цинка/меди исторически ассоциирована с Metso/Outotec и Lurgi.","src":"https://www.hatch.com/About-Us/Publications/Technical-Papers/2014/09/Gold-Concentrate-Roaster-for-Sulphur-Carbon-and-Arsenic-Removal","checked":"2026-08-13"},{"fact":"Важно: после «clean break» референсы, лицензии, софт и библиотеки Hatch формально Дельте не принадлежат — предъявлять проекты Hatch как свои она может только через персональный опыт сотрудников (оценка).","src":"https://leave-russia.org/hatch-ltd","checked":"2026-08-13"}],"strength":["Печь КС Лота №1 — их разработка (ИД ч.1): конструктив зафиксирован в обязательных исходных данных","Ванны Лота №3 — их разработка (Приложение В, документ D202415-PM032-240-242-0001)","Фонд рабочего времени проекта опирается на их отчёт OVE-D-HATCH-PM-REP-00003-R","Автор конструкции ванн, вшитой в тендерные ИД: Приложение В — её документ D202415-PM032-240-242-0001 (ред. 1, 14.04.2025), характеристики «согласованы с Заказчиком». По позиции «ванны» Лота №3 ей не нужно ничего разрабатывать — всё уже сделано и оплачено предыдущим договором.","Инсайдерское знание проекта: в ОВЭ с 2019 г. (ТЭП, оценка технологии и капзатрат, электроэкстракция, ГД-моделирование печи КС); на руках полный комплект проекта D202415 (схемы, 3D, расчёты), которого нет у других участников.","Работающие отношения с Заказчиком: два проекта для КГМК (ОВЭ 2019–2025 и диверсификация никеля 2021–2023), плюс Норникель в списке клиентов; знакомые Заказчику люди и стандарты документации (шифры, формат ИТ).","Наследие Hatch: методология мирового уровня по EW-цехам (диагностика танк-хаусов, ошиновка, вентиляция, краны — Tenke Fungurume и др.), Mine-to-Mill, цифровое моделирование (CFD/DEM/FEM); 120+ инженеров.","Заявленные патенты на ванны электроэкстракции и полимербетонные технологии: могут одновременно быть их ТКП на изготовление ванн и юридическим рычагом против чужих копий их конструкции (оценка)."],"weakness":["Молодое юрлицо со слабым балансом: регистрация 15.11.2022, УК 100 тыс. руб., прибыль ~0,2 млн руб. при выручке ~865 млн руб. — почти нулевая маржа; банковские гарантии и обеспечение по крупному БИ с поставкой могут стать проблемой (оценка по данным карточки РБК).","Разрыв с глобальной Hatch: «clean break», референсы/лицензии/софт Hatch формально не их; корпоративного бэкапа мировой компании больше нет.","Портфель последних лет (под брендом Дельта) смещён в ГОКи, золото и железо (Стойленский, Ковдор, Быстринское, Гросс, Суздаль); реализованных электролизных цехов «под ключ» после 2022 г. в открытых источниках не видно.","По Лотам №1 (обжиг+фильтрация), №2 (купоросы: выпарка/кристаллизация в Hastelloy G-35/904L) и №4 (склад ГП) встроенного преимущества нет: технологию держат Заказчик и институт-разработчик ИД, а печи КС — не фирменная поляна Дельты.","Позиция «архитектора ИД» уязвима процедурно: участие разработчика части исходных данных в конкурсе по этим же ИД — классический конфликт интересов, который другие участники вправе поднять в разъяснениях (оценка).","Кадровая концентрация: компетенция — это конкретные люди экс-Hatch; уход нескольких ключевых инженеров (электрометаллургия) ослабляет их сильнее, чем крупную компанию (оценка)."],"implications":[{"title":"По ваннам Лота №3 преимущество Дельты решающее — но лот шире ванн","text":"Конструкция ванн задана её проектом и «согласована с Заказчиком» — конкурировать «другой ванной» бессмысленно и запрещено логикой ИД. Однако по ТЗ в Лот №3 входят также КСМ, спецкраны с позиционированием, ошиновка, укрытия, аноды/матрицы, АСУ электроэкстракции и компоновка в существующем корпусе ЦЭМ (2 серии × 90 ванн, шаг колонн 24 м) — по этим позициям у Дельты нет эксклюзива, а требования к роботизации (машинное зрение, реестр матриц, автоматический пробоотбор) написаны нейтрально."},{"title":"Конфликт интересов есть, но опираться на него надо аккуратно","text":"Формально автор Приложения В играет в конкурсе, где его же документ — часть задания: это информационная асимметрия (у него весь проект D202415, у остальных — только «исходные требования»). Опора: письменные запросы разъяснений с требованием выдать всем участникам полный комплект по ваннам (чертежи, 3D, спецификации, АТС D202415-24000-210-282-0001) и подтвердить обязательность характеристик Прил. В для всех. Лобовая атака «отстраните Дельту» контрпродуктивна: Заказчик сам вложил её документ в ИД — значит, её участие его устраивает (оценка)."},{"title":"Ванны как «данность» снимают с нас проектный риск — и это можно продать","text":"Раз конструкция ванн принята Заказчиком, ответственность за неё несёт принятое решение Заказчика, а не Исполнитель БИ. Наша оферта может прямо фиксировать: ванны — по Приложению В ИД (référence design), наша ценность — интеграция: компоновка, краны/КСМ, ошиновка с двойным контактом, аспирация, АСУ, стоимость. Это превращает их козырь в общую спецификацию (оценка)."},{"title":"Реальные шансы на победу — Лоты №1, №2, №4 и ценовая игра по №3","text":"По обжигу (печь КС, фильтрация), купоросному участку (выпарка/кристаллизация, спецстали) и складу ГП у Дельты нет вшитых решений в ИД — там конкуренция по компетенции и цене. По Лоту №3 их слабое место — экономика: почти нулевая маржа и потребность в обеспечении; агрессивная, но обоснованная цена с 2–3 реальными ТКП изготовителей ванн по заданной геометрии (включая производителей КНР, прямо перечисленных в ИД) бьёт по ним больнее всего (оценка)."}],"our_moves":[{"n":1,"title":"Выравнять информационное поле по ваннам","text":"В окно разъяснений письменно запросить у организатора полный комплект проекта Дельты по электроэкстракции: чертежи ванн, 3D, спецификации, аппаратурно-технологическую схему D202415-24000-210-282-0001 (она указана в Прил. В как источник) и подтверждение, что характеристики Прил. В обязательны для всех участников. Каждый невыданный документ — фиксируем как асимметрию."},{"n":2,"title":"Принять ванну Дельты как спецификацию и обвязать её лучше","text":"Оферта по Лоту №3: ванны строго по Прил. В (полимербетон, 84 катода/85 анодов, 8485×1155×1650, 280 А/м2), 2–3 независимых ТКП изготовителей по этой геометрии (включая названных в ИД производителей КНР — Sichuan Precision/copperepc и др., плюс российские полимербетонщики); центр тяжести предложения — КСМ, спецкраны, ошиновка с двойным контактом, аспирация, АСУ (нагрузки, шунтирование, реестр матриц) и компоновка в существующем ЦЭМ."},{"n":3,"title":"Патентная разведка до подачи","text":"Заказать поиск по ФИПС: патентообладатель «Дельта Инжиниринг и Консалтинг» (сайт заявляет патенты на ванны электроэкстракции; в выдаче мелькают «способ изготовления полимербетонной ванны» и «способ удаления шлама»). Понять, что именно закрыто: если запатентован способ изготовления — изготовитель ванн по их геометрии должен иметь обходную технологию или лицензию; заложить это в ТКП и в риски."},{"n":4,"title":"Максимум ресурсов — на Лоты №1, №2, №4","text":"Собрать сильные референсы и партнёрства по обжигу в КС (технологические партнёры, ГД-моделирование), выпарке/кристаллизации купоросов (Hastelloy G-35/904L, вакуум-кристаллизация) и автоматизированному складу ГП. Здесь Дельта играет без форы, а мы можем выиграть содержанием."},{"n":5,"title":"Квалификационная атака по надёжности — цифрами, без эмоций","text":"В сравнительных материалах для Заказчика подчёркивать проверяемые вещи: юрлицо конкурента образца 11.2022, УК 100 тыс. руб., прибыль ~0,2 млн руб. при выручке ~865 млн руб. (карточка РБК), формальный разрыв с Hatch («clean break», leave-russia.org) — против нашей финансовой устойчивости и гарантий. Не утверждать ничего сверх открытых данных."},{"n":6,"title":"Мониторинг Дельты до вскрытия","text":"Отслеживать: изменения в ЕГРЮЛ (смена гендиректора на Елькина И.Б. в 01.2026 уже сигнал), новые патенты, вакансии по электролизу/Мончегорску на hh.ru (у них активный работодательский профиль), упоминания в закупках Норникеля. Любая утечка о том, что Дельте отдают Лот №3 без конкурса или с преференцией — повод пересчитать нашу ставку по остальным лотам."}],"publish":true,"publish_note":"Публикуется на закрытом Basic Auth сайте — решение владельца от 13.08.2026. Содержит персональные и финансовые данные из открытых реестров; на открытый ресурс не выносить.","corrections":[{"date":"2026-08-13","text":"Первоначальный вывод «встроенного преимущества у Дельты нет по Лотам №1, №2 и №4» оказался неверным для Лота №1: печь КС спроектирована Hatch, это прямо написано в ИД части 1 в двух местах, плюс фонд рабочего времени опирается на их отчёт. Скорректировано: преимущество конкурента охватывает Лот №1 и Лот №3. Незатронутыми остаются Лоты №2 и №4."}]};
const PARTNER = {"updated":"2026-08-13","decision":"Базовый партнёр — China Nerin Engineering Co., Ltd. (SSE 603257, Наньчан; институт с 1957 г., 1800+ инженеров) вместе со 100% дочкой Jiangxi Nerin Equipment Co., Ltd. Это единственный из кандидатов носитель проверяемого EPC/EPCM-опыта мирового уровня именно по меди: полный EPC медьзавода JCC Guoxing (Яньтай) 180 кт/г катодной меди с электролизом на постоянных нержавеющих катодах (пуск 06.2023), Chifeng Yunnan Copper 400 кт/г (пуск 05.2019), Guixi 1100 кт/г, базовый инжиниринг и EPCM плавзавода Kamoa-Kakula 500 кт/г (ДР Конго, контракт 18.11.2021), AMIN Индонезия 900 кт/г концентрата, Adani Индия 500 кт/г. Их опыт закрывает квалификацию по Лоту 3 (электроэкстракция, КСМ, краны — плюс собственный OEM в группе) полностью и по Лоту 1 частично (газоочистка и сернокислотные переделы подтверждены; печь КС медного концентрата открытыми источниками НЕ подтверждена — в КНР эта технология исторически у ENFI). Тёплый вход уже есть: с Jiangxi Nerin Equipment мы в переписке по спецкранам с 03.04.2026 (Bitrix).\n\nZhuzhou Tianqiao Crane (SZSE 002523) и Jiangxi Tianxin — усилители по оборудованию Лота 3 (спецкраны, КСМ, линии подготовки основ), но не носители квалификации лота: Tianqiao — крановый OEM без EPC-опыта (экспорт в т.ч. в Россию — плюс), Tianxin — малое юрлицо (капитал 24 млн юаней, ~70 сотрудников), финансовые пороги квалификации скорее всего не пройдёт. По Лоту 2 (кристаллизация купоросов) и Лоту 4 (автоматизированный склад готовой продукции) подтверждённого профильного опыта НЕТ ни у одного из кандидатов — это надо признать: под Лот 2 привлекать специализированных поставщиков выпарки/MVR-кристаллизации (Metalcess, Jiangsu Sunevap — tier C, референсы самодекларированные), под Лот 4 заявлять опыт «в составе EPC-проектов» Nerin (оценка, отдельных референсов нет) либо искать отдельного партнёра. Важно: китайский OEM «линии подготовки основ», с которым мы работали (кандидат «б» владельца), по выгрузке Bitrix не идентифицируется — в классе stripper только российский трейдер ООО ТК «ИноксМаркет» (Selected, 26.12.2025); нужно поднять карточку сделки и выяснить фактического производителя линии.\n\nСхему оформлять консорциумом (или генподряд КВАНТ + субподряд партнёра на ту часть работ, к которой привязан его опыт) с письменным согласием партнёра на использование референсов и подтверждающими письмами конечных заказчиков. Главный риск всей схемы — осторожность китайских публичных компаний к структурам Норникеля (КГМК — дочка Норникеля): в январе 2026 г. китайский партнёр вышел из проекта медного завода Норникеля в Китае (Bloomberg, 26.01.2026). Закладывать время на санкционный комплаенс партнёра и держать запасного кандидата.","candidates":[{"name":"China Nerin Engineering Co., Ltd. (中国瑞林工程技术股份有限公司)","role":"EPC","profile":"Инжиниринговая компания полного цикла по цветной металлургии, Наньчан (пров. Цзянси). Происходит из Наньчанского института цветной металлургии (осн. 1957, один из 8 головных отраслевых институтов минметаллургии КНР); современное юрлицо — с 1986 (по Yahoo Finance); IPO на основной площадке Шанхайской биржи 08.04.2025, тикер 603257. 1800+ технических специалистов, 647 патентов (260 изобретений), проекты в 70+ странах. Ключевые компетенции (по собственному сайту): флэш-плавка, боковое дутьё (NGL), электрорафинирование меди, гидрометаллургия меди, сернокислотные производства, автоматизация. Опыт работы в РФ открытыми источниками не подтверждён.","refs":[{"project":"JCC Guoxing (Yantai) Copper — гринфилд-медьзавод","what":"Полный EPC всего передела: side-blown + top-blown + анодные печи + электролиз на постоянных нержавеющих катодах; 180 кт/г катодной меди","year":"пуск 12.06.2023","src":"https://www.nerin.com/html/en/news/2249.html","checked":"2026-08-13"},{"project":"Chifeng Yunnan Copper","what":"Проектирование медьзавода 400 кт/г катодной меди + 1690 кт/г серной кислоты (side-blown + top-blown + анодные печи)","year":"пуск 18.05.2019","src":"http://www.nerin.com/html/en/news/1612.html","checked":"2026-08-13"},{"project":"Guixi Smelter (Jiangxi Copper)","what":"Генпроектировщик крупнейшего медьзавода КНР: 1100 кт/г катодной меди, 2000 кт/г серной кислоты; нац. премии качества","year":"этапы разных лет, на странице год не указан","src":"https://www.nerin.com/html/en/products/metallurgy/2516.html","checked":"2026-08-13"},{"project":"Kamoa-Kakula Copper Smelter, ДР Конго (Ivanhoe/Zijin)","what":"Базовый инжиниринг + EPCM (проектирование, управление закупками/строительством/пуском) direct-to-blister флэш-плавки 500 кт/г анодной меди, 800-1000 кт/г кислоты; технология Metso Outotec","year":"контракт 18.11.2021, в постройке (>50% на 2024)","src":"https://www.ivanhoemines.com/news-stories/news-release/kamoa-copper-awards-china-nerin-engineering-contract-for-direct-to-blister-copper-smelter/ ; https://www.nerin.com/html/en/news/2460.html","checked":"2026-08-13"},{"project":"PT Amman Mineral Industri (AMIN), Индонезия","what":"Генеральное проектирование медьзавода на 900 кт/г концентрата + поставка собственных технологий/оборудования","year":"стройка/пуско-наладка на 2024","src":"https://www.nerin.com/html/en/news/2460.html","checked":"2026-08-13"},{"project":"ADANI 500 кт/г гринфилд-медьзавод, Индия","what":"Проектирование + поставка собственного оборудования","year":"в постройке на 2024","src":"https://www.nerin.com/html/en/news/2460.html","checked":"2026-08-13"},{"project":"Chinalco Southeast Copper (Ningde)","what":"Проект медеплавильной базы: 400 кт/г катодной меди, 1462 кт/г серной кислоты","year":"на странице год не указан","src":"http://www.nerin.com/html/en/products/metallurgy/2518.html","checked":"2026-08-13"},{"project":"Guangxi Nanguo Copper, фаза I","what":"Проектирование медьзавода 300 кт/г катодной меди, 1200 кт/г кислоты; успешный пуск с первого раза","year":"на странице год не указан","src":"https://www.nerin.com/html/en/products/metallurgy/1872.html ; http://www.nerin.com/html/en/news/1603.html","checked":"2026-08-13"}],"f росить референс-листы Metalcess/Sunevap/Jingjin (фильтрация уже Selected у нас). По Лоту 4 честно оценить шансы: если требования жёсткие — не заявляться или искать профильного партнёра по складской автоматизации."},{"title":"Самодекларированные референсы OEM могут не пройти верификацию","text":"Клиентские листы Tianxin, Sanyou, Lufeng, Metalcess взяты с их сайтов/маркетплейсов без названий проектов, годов и контактов. Заказчик при проверке может их не засчитать, а обнаруженное несоответствие ударит по всей заявке.","action":"До включения в заявку запросить по каждому референсу: контракт/акт, контакт заказчика, фото смонтированного оборудования. В заявку включать только референсы, подтверждённые документами. Формулировки в заявке — строго по документам партнёра, без усиления."},{"title":"Партнёр малого масштаба не пройдёт финансовые пороги","text":"Tianxin: капитал 24 млн юаней (~330 млн руб.), ~70 сотрудников. Типовые пороги (выручка от сопоставимой с ценой лота, опыт договоров сопоставимой цены) такое юрлицо не пройдёт, даже при идеальном продуктовом соответствии.","action":"Нишевых OEM (Tianxin, Sanyou, Lufeng) заявлять только субпоставщиками оборудования внутри лота, носителем квалификации делать Nerin (группу). Пороговые значения проверить сразу после выхода документации."}]};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n,d=0) => (n===''||n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
/* **жирный** в текстах данных — единственная разметка, которую пропускаем */
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const lotTag = n => n===0||n===null||n===undefined ? '<span class="tag lot0">вне БИ</span>'
  : (n===9 ? '<span class="tag">все лоты</span>' : `<span class="tag lot${n}">Лот №${n}</span>`);
const lotName = n => (LOTS.lots.find(l=>l.id===n)||{}).name || 'Вне БИ';
/* ссылка на источник: показываем хост, а не полный URL — длинные URL рвут вёрстку на узких экранах */
function srcLink(u){
  if(!/^https?:/.test(String(u||''))) return esc(u);
  let host = u; try{ host = new URL(u).hostname.replace(/^www\./,''); }catch(e){}
  return `<a class="src" href="${esc(u)}" target="_blank" rel="noopener">${esc(host)}</a>`;
}

let eqFilter = {lot:'', q:'', key:false};
function eqRows(){
  const t = eqFilter.q.toLowerCase();
  return EQ.items.filter(i=>
    (eqFilter.lot===''||String(i.lot)===eqFilter.lot) &&
    (!eqFilter.key||i.key) &&
    (!t||[i.name,i.model,i.area,i.purpose,i.material,i.status,i.note].join(' ').toLowerCase().includes(t)));
}
function eqPaint(){
  const rows = eqRows();
  const el = document.getElementById('eqbody');
  if(!el) return;
  el.innerHTML = rows.map(i=>`<tr>
    <td>${lotTag(i.lot)}<div class="mut">${esc(i.area)}</div></td>
    <td><b>${esc(i.name)}</b>${i.key?' <span class="tag lot1">ключевое</span>':''}
        ${i.model&&i.model!=='—'?`<div class="mut">${esc(i.model)}</div>`:''}
        ${i.pos?`<div class="mut">поз. ${esc(i.pos)}</div>`:''}</td>
    <td>${esc(i.param)}</td>
    <td class="num">${esc(i.qty)}</td>
    <td>${esc(i.dims||'—')}${i.power?`<div class="mut">${esc(i.power)}</div>`:''}</td>
    <td>${esc(i.material||'—')}</td>

/* ================= Поставщики ================= */
/* Правки сорсера: статус запроса, статус работы, заметка — в localStorage этого
   браузера. Механика та же, что в ГТУ-библиотеке: «⬇ правки» выгружает файлом,
   «⬆ импорт» объединяет чужой файл, CSV — для выгрузки в работу. */
let ED;
try{ ED = JSON.parse(localStorage.getItem('ove_edits_v1')) || {}; }catch(e){ ED = {}; }
ED.rfq = ED.rfq||{}; ED.work = ED.work||{}; ED.note = ED.note||{}; ED.add = ED.add||[];
function saveED(){ try{ localStorage.setItem('ove_edits_v1', JSON.stringify(ED)); }catch(e){} }

const RFQ_ST  = [['','не запрашивали'],['sent','запросили'],['no','не запрашивать']];
const WORK_ST = [['','не работаем'],['yes','работаем'],['kp','есть КП'],['stop','отказ']];
const RFQ_NAME = Object.fromEntries(RFQ_ST), WORK_NAME = Object.fromEntries(WORK_ST);
const nrm = s => String(s||'').toLowerCase().replace(/[«»"'.,()]/g,' ').replace(/\s+/g,' ').trim();
const ckey = (cls,name) => cls+'|'+nrm(name);

/* в колонках Мир/КНР/РФ иногда стоит не компания, а пояснение — на них регуляторы не вешаем */
const NOT_CAND = ['уточн','см.','полный перечень','кандидат-партнёр','типовое изделие','рынок рф',
                  'отечественные','профильные','типоряд','рассмотреть','рынок кнр'];
const isCand = n => { const t = nrm(n); return t.length>2 && t.length<=60 && !NOT_CAND.some(p=>t.startsWith(p)); };

function candsOf(p){
  const bx = (BX.classes||{})[p.cls] || [];
  const out = new Map();
  const put = (name, origin) => {
    if(!isCand(name)) return;
    const k = ckey(p.cls, name);
    if(!out.has(k)) out.set(k, {key:k, name, origins:new Set()});
    out.get(k).origins.add(origin);
  };
  (p.world||[]).forEach(n=>put(n,'Мир'));
  (p.cn||[]).forEach(n=>put(n,'КНР'));
  (p.ru||[]).forEach(n=>put(n,'РФ'));
  [...new Set(bx.map(r=>r.company))].filter(c=>c&&c!=='—').forEach(n=>put(n,'Bitrix'));
  (ED.add||[]).filter(a=>a.cls===p.cls).forEach(a=>put(a.name,'свой'));
  return [...out.values()];
}
const noteRows = p => [...(p.world||[]),...(p.cn||[]),...(p.ru||[])].filter(n=>!isCand(n));

function supPaint(){
  const el = document.getElementById('supbody'); if(!el) return;
  const fl = document.getElementById('suplot').value;
  const ft = document.getElementById('suptier').value;
  const fs = document.getElementById('supst').value;
  const pos = SUP.positions.filter(p=>(fl===''||String(p.lot)===fl) && (ft===''||p.tier===ft));
  let shown = 0, nCand = 0, nSent = 0, nWork = 0;
  const html = pos.map(p=>{
    let cands = candsOf(p);
    if(fs==='sent') cands = cands.filter(c=>ED.rfq[c.key]==='sent');
    else if(fs==='none') cands = cands.filter(c=>!ED.rfq[c.key]);
    else if(fs==='work') cands = cands.filter(c=>ED.work[c.key]==='yes'||ED.work[c.key]==='kp');
    if(fs!=='' && !cands.length) return '';
    shown++;
    nCand += cands.length;
    cands.forEach(c=>{ if(ED.rfq[c.key]==='sent') nSent++; if(ED.work[c.key]==='yes'||ED.work[c.key]==='kp') nWork++; });
    return `<div class="card">
      <h3>${lotTag(p.lot)} ${esc(p.name)} <span class="tier${esc(p.tier)}">уровень ${esc(p.tier)}</span></h3>
      <div class="mut">${esc(p.spec)}</div>
      <div class="tblwrap"><table><thead><tr>
        <th>Кандидат</th><th>Откуда</th><th>Запрос</th><th>Работа</th><th>Заметка</th></tr></thead>
      <tbody>${cands.length ? cands.map(c=>`<tr>
        <td><b>${esc(c.name)}</b></td>
        <td>${[...c.origins].map(o=>`<span class="tag${o==='Bitrix'?' lot3':''}">${esc(o)}</span>`).join('')}</td>
        <td><select class="mini" data-k="${esc(c.key)}" data-f="rfq">
          ${RFQ_ST.map(([v,n])=>`<option value="${v}"${v===(ED.rfq[c.key]||'')?' selected':''}>${n}</option>`).join('')}</select></td>
        <td><select class="mini" data-k="${esc(c.key)}" data-f="work">
          ${WORK_ST.map(([v,n])=>`<option value="${v}"${v===(ED.work[c.key]||'')?' selected':''}>${n}</option>`).join('')}</select></td>
        <td><input class="mini note" data-k="${esc(c.key)}" data-f="note" value="${esc(ED.note[c.key]||'')}" placeholder="цена, срок, контакт…"></td>
      </tr>`).join('') : '<tr><td colspan="5" class="mut">Кандидатов нет — искать с нуля</td></tr>'}</tbody></table></div>
      ${noteRows(p).length?`<div class="mut">${noteRows(p).map(esc).join(' · ')}</div>`:''}
      ${p.gift?`<div class="box amber"><b>Подсказка из документов Заказчика:</b> ${esc(p.gift)}</div>`:''}
      <div class="box"><b>Что спрашивать:</b> ${esc(p.ask)}</div>
      <div class="addrow"><input class="mini" id="add_${esc(p.cls)}" placeholder="добавить своего поставщика">
        <button class="btn addbtn" data-cls="${esc(p.cls)}">+ добавить</button></div>
    </div>`;}).join('');
  el.innerHTML = html || '<div class="box mut">Под фильтр ничего не попало</div>';
  document.getElementById('supcount').textContent =
    `${shown} из ${SUP.positions.length} позиций · ${nCand} кандидатов · запросили ${nSent} · работаем ${nWork}`;
}
function supCSV(){
  const lines = ['лот;позиция;уровень;кандидат;откуда;запрос;работа;заметка'];
  for(const p of SUP.positions) for(const c of candsOf(p))
    lines.push([p.lot,p.name,p.tier,c.name,[...c.origins].join('/'),
      RFQ_NAME[ED.rfq[c.key]||''],WORK_NAME[ED.work[c.key]||''],ED.note[c.key]||'']
      .map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';'));
  const blob = new Blob(["﻿"+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ove_sourcing.csv'; a.click();
}
function supExport(){
  const blob = new Blob([JSON.stringify(ED,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ove_edits_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function supImport(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  f.text().then(t=>{
    try{
      const e = JSON.parse(t);
      Object.assign(ED.rfq, e.rfq||{}); Object.assign(ED.work, e.work||{}); Object.assign(ED.note, e.note||{});
      for(const a of (e.add||[])) if(!ED.add.some(x=>x.cls===a.cls && nrm(x.name)===nrm(a.name))) ED.add.push(a);
      saveED(); supPaint();
    }catch(err){ alert('Не удалось прочитать файл правок: '+err.message); }
  });
}
function bindSup(){
  ['suplot','suptier','supst'].forEach(id=>document.getElementById(id).addEventListener('change', supPaint));
  const root = document.getElementById('supbody');
  root.addEventListener('change', e=>{
    const el = e.target.closest('select.mini'); if(!el) return;
    ED[el.dataset.f][el.dataset.k] = el.value; saveED(); supPaint();
  });
  root.addEventListener('input', e=>{
    const el = e.target.closest('input.note'); if(!el) return;
    ED.note[el.dataset.k] = el.value; saveED();
  });
  root.addEventListener('click', e=>{
    const b = e.target.closest('.addbtn'); if(!b) return;
    const inp = document.getElementById('add_'+b.dataset.cls);
    const name = (inp.value||'').trim();
    if(!name) return;
    ED.add.push({cls:b.dataset.cls, name}); saveED(); supPaint();
  });
  document.getElementById('supcsv').addEventListener('click', supCSV);
  document.getElementById('supexp').addEventListener('click', supExport);
  document.getElementById('supimp').addEventListener('change', function(){ supImport(this); });
  supPaint();
}

/* ================= CAPEX ================= */
const CP = {fx:CAPEX.params.fx.value, lang:CAPEX.params.lang.value, cont:CAPEX.params.cont.value};
function capexCalc(){
  const eq = CAPEX.equipment.reduce((a,e)=>({low:a.low+e.low, base:a.base+e.base, high:a.high+e.high}), {low:0,base:0,high:0});
  const direct = CAPEX.nonequip.filter(n=>n.mode==='direct')
    .reduce((a,n)=>({low:a.low+n.low, base:a.base+n.base, high:a.high+n.high}), {low:0,base:0,high:0});
  const out = {};
  for(const k of ['low','base','high']){
    const eqInst = eq[k]*CP.lang;              // оборудование → смонтированный объект
    const tic = eqInst + direct[k];            // + прямые строительные и сетевые затраты
    let soft = 0;
    for(const n of CAPEX.nonequip){
      if(n.mode==='pct_tic') soft += tic*n.pct/100;
      if(n.mode==='pct_eq')  soft += eq[k]*n.pct/100;
    }
    const sub = tic + soft;
    out[k] = {eq:eq[k], eqInst, direct:direct[k], tic, soft, sub, cont:sub*CP.cont/100, total:sub*(1+CP.cont/100)};
  }
  return out;
}
function capexPaint(){
