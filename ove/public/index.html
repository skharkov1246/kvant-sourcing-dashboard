/* ================= Партнёр ================= */
function rPartner(){
  if(!PARTNER) return `<div class="box warn"><b>Раздел собирается.</b> Опыт в квалификационной части заявки прикладывается не КВАНТ, а китайского партнёра, который идёт вместе с нами. Здесь будет: досье на кандидатов — China Nerin Engineering и связанная Jiangxi Nerin Equipment, а также поставщик по линии подготовки катодных основ; их проверяемые референсы по меди с названиями проектов, мощностями и годами; соответствие опыта каждому из четырёх лотов по отдельности; перечень документов, которые надо запросить у партнёра для квалификационной части (референс-листы с контактами заказчиков, сертификаты, лицензии, финотчётность, подтверждение мощностей); и риски самой схемы — как Заказчик отнесётся к тому, что опыт не у заявителя, и нужна ли консорциальная или субподрядная конструкция.</div>`;
  const tcls = t => t==='A'?'tierA':(t==='B'?'tierB':'tierC');
  return `
  <div class="box info"><b>Решение.</b> ${md(PARTNER.decision).replace(/\n{2,}/g,'</p><p>').replace(/^/,'<p>').replace(/$/,'</p>')}</div>
  <h2>Кандидаты в партнёры</h2>
  ${(PARTNER.candidates||[]).map(c=>`<div class="card">
    <h3>${esc(c.name)} <span class="tag ${tcls(c.tier)}">уровень ${esc(c.tier)}</span> <span class="tag">${esc(c.role)}</span></h3>
    <p>${esc(c.profile)}</p>
    ${(c.refs||[]).length?`<div class="tblwrap"><table><thead><tr><th>Проект</th><th>Что сделано</th><th>Год</th><th>Источник</th></tr></thead>
      <tbody>${c.refs.map(r=>`<tr><td><b>${esc(r.project)}</b></td><td>${esc(r.what)}</td><td class="mut">${esc(r.year)}</td>
      <td class="mut">${srcLink(r.src)}${r.checked?` · ${esc(r.checked)}`:''}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${c.fit?`<div class="tblwrap"><table><thead><tr>${[1,2,3,4].map(n=>`<th>Лот №${n}</th>`).join('')}</tr></thead>
      <tbody><tr>${[1,2,3,4].map(n=>`<td>${esc(c.fit['lot'+n]||'—')}</td>`).join('')}</tr></tbody></table></div>`:''}
  </div>`).join('')}
  ${(PARTNER.already_contacted||[]).length?`<h2>С кем мы уже контактировали</h2>
    <div class="tblwrap"><table><thead><tr><th>Компания</th><th>Классы оборудования</th><th>Примечание</th></tr></thead>
    <tbody>${PARTNER.already_contacted.map(c=>`<tr><td><b>${esc(c.company)}</b></td>
    <td>${(c.classes||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</td><td class="mut">${esc(c.note||'')}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${(PARTNER.docs_to_request||[]).length?`<h2>Что запросить у партнёра для квалификационной части</h2><ol>${PARTNER.docs_to_request.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
  ${(PARTNER.risks||[]).length?`<h2>Риски партнёрской схемы</h2>${PARTNER.risks.map(r=>`<div class="card"><h3>${esc(r.title)}</h3>
    <p>${esc(r.text)}</p><p><b>Что делать:</b> ${esc(r.action)}</p></div>`).join('')}`:''}
  <div class="mut">Обновлено ${esc(PARTNER.updated||'')}.</div>`;
}

/* ================= Каркас ================= */
const TABS = [
  ['overview','Обзор'], ['stages','Этапы'], ['blocks','Блоки и лоты'], ['bi','Базовый проект'],
  ['equip','Оборудование'], ['sup','Поставщики'], ['auto','Автоматизация'],
  ['world','Мировой опыт'], ['china','Китай'], ['partner','Партнёр'], ['competitor','Конкурент'],
  ['tender','Торги за БИ'], ['capex','Стройка · CAPEX']
];
const R = {overview:rOverview, stages:rStages, blocks:rBlocks, bi:rBI, equip:rEquip, sup:rSup,
           auto:rAuto, world:rWorld, china:rChina, partner:rPartner, competitor:rComp,
           tender:rTender, capex:rCapex};
const nav = document.getElementById('nav'), main = document.getElementById('main');
nav.innerHTML = TABS.map(([id,t])=>`<button data-t="${id}">${esc(t)}</button>`).join('');
main.innerHTML = TABS.map(([id])=>`<section id="s-${id}"></section>`).join('');
document.getElementById('foot').innerHTML =
  `Разбор тендерного пакета «ТЗ на БИ ОВЭ-75 v.3.6» и приложений №1–7 (ИД ч.1 и ч.2, электроснабжение, ЦИМ, ОАСУ, здания ЦЭМ и ГМУ). ` +
  `Технологические данные — из документов Заказчика и ИД ООО «Институт Гипроникель». Внешние факты о компаниях проверены 13.08.2026 и снабжены ссылками. ` +
  `Оценка CAPEX — модель порядка величины, не смета. Сборка: 2026-08-13`;

const rendered = {};
function bindEquip(){
  const q=document.getElementById('eqq'), s=document.getElementById('eqlot'), k=document.getElementById('eqkey');
  q.addEventListener('input', ()=>{eqFilter.q=q.value; eqPaint();});
  s.addEventListener('change', ()=>{eqFilter.lot=s.value; eqPaint();});
  k.addEventListener('click', ()=>{eqFilter.key=!eqFilter.key; k.classList.toggle('on',eqFilter.key); eqPaint();});
  eqPaint();
}
function bindBI(){
  if(!BI.length) return;
  document.querySelectorAll('.bilot').forEach(b=>b.addEventListener('click', ()=>{
    biLot = Number(b.dataset.i);
    document.querySelectorAll('.bilot').forEach(x=>x.classList.toggle('on', x===b));
    biPaint();
  }));
  biPaint();
}
function bindCapex(){
  for(const key of Object.keys(CAPEX.params)){
    const el=document.getElementById('cp_'+key), out=document.getElementById('cpo_'+key);
    el.addEventListener('input', ()=>{ CP[key]=Number(el.value); out.textContent=el.value; capexPaint(); });
  }
  capexPaint();
}
function show(id){
  for(const [tid] of TABS){
    document.querySelector(`[data-t="${tid}"]`).classList.toggle('on', tid===id);
    document.getElementById(`s-${tid}`).classList.toggle('on', tid===id);
  }
  if(!rendered[id]){
    document.getElementById(`s-${id}`).innerHTML = R[id]();
    rendered[id]=1;
    if(id==='equip') bindEquip();
    if(id==='capex') bindCapex();
    if(id==='bi') bindBI();
    if(id==='sup') bindSup();
  }
  location.hash = id;
  window.scrollTo(0,0);
}
nav.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.t); });
show(TABS.some(([id])=>id===location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
</script>
</body>
</html>
