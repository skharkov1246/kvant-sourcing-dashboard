+11+3+15+2×1,5+1,5 = 44,5 кВт; итого ≈ 114 кВт без вакуум-насосов (ВВН1-6/ВВН1-3 — по каталогу изготовителя), мешалок обогреваемых баков, транспортёра и фасовки. Полная установленная мощность участка оценочно 160–220 кВт — уточняется комплектацией; питание 0,4 кВ от шкафов управления (граница 4.3.7), сведения по электроснабжению — по Приложению №3.\n\nСЖАТЫЙ ВОЗДУХ КИП: 250–400 кПа, осушенный (класс по ГОСТ на чистоту сжатого воздуха — уточнить с воздухоподготовкой по Прил. №5); расход — по числу пневмоприводов и шкафов с подпором (оценочно 30–60 нм³/ч, уточняется).\n\nРасходные коэффициенты на 1 т смешанного купороса (расчёт БИ): пар ≈ 5,4 т/т; электроэнергия — по факту комплектации; оборотная вода ≈ 710 м³/т (оборот).","items":[{"label":"Пар технологический","value":"≈4,3–4,4 т/ч (глухой 3,0 + острый 1,36); 36,3 тыс. т/год + обогрев баков (уточняется)","src":"ИД табл. 3.1, рис. 4.4/4.5; расчёт БИ"},{"label":"Вода кислой СОВ","value":"568 м³/ч оборот; тепло на градирню ≈3,1 МВт; профицит конденсата ≈4,7 м³/ч в производство","src":"ИД рис. 4.4/4.5, п. 1.3.12; расчёт БИ"},{"label":"Электроэнергия","value":"≈114 кВт по спецификациям ИД; полная — оценочно 160–220 кВт (уточнить)","src":"ИД рис. 4.4/4.5; оценка БИ"},{"label":"Пар по гидрометаллургии всего","value":"28 846 Гкал/год (0,417 Гкал/т Cu) — контекст","src":"ИД табл. 8.5"}],"gost":[{"doc":"Приложение №3 к ТЗ","what":"Общие требования по электроснабжению и электрооборудованию (однолинейные схемы, спецификации, ОЛ)"},{"doc":"ПУЭ (изд. 7)","what":"Выбор и прокладка электрооборудования 0,4 кВ в химически активной среде"}],"open":["Табл. 8.3, 8.4 ИД (вода СОВ и пар по потребителям) переданы изображениями — запросить редактируемые данные","Мощности ВВН1-6/ВВН1-3, мешалок, фасовки — по ОЛ изготовителей","ТУ на подключение пара, воды, воздуха, электроэнергии — при БИ/ОТР"]},{"id":"oborud","title":"Перечень основного и вспомогательного оборудования; опросные листы; монтаж","kind":"pz","body":"Состав по ТЗ п. 4.4 и спецификациям ИД (рис. 4.4/4.5, табл. 4.1); материал основного оборудования — 904L или аналог; запас производительности 30 %.\n\nНИТКА 1 (медный купорос): выпарной аппарат I ступени (D 2,0 м, V 34,5 м³, подогреватель 63 м², циркнасос 633 м³/ч/22 кВт, седиментационный цилиндр 0,3 м², труба контура 1,01 м³); выпарной аппарат II ступени (унифицирован, без подогревателя); паровой эжектор (0,75 т/ч, 6 атм, всас 0,013–0,02 атм, 0,375 т/ч по соковому); барометрический конденсатор D 2,0 м (380 м³/ч); ПЭБ (эжектор 0,27 т/ч + конденсатор D 0,5 м, 32 м³/ч + ВВН1-6); репульпатор 2,5 м³ с насосом 21 м³/ч; пульсирующие центрифуги 2 шт. × 2,5 т/ч (1800 об/мин, 15 кВт); бак фугата 1 м³ с 2 погружными насосами 1,5 м³/ч.\n\nНИТКА 2 (смешанный купорос): выпарной аппарат I ступени (D 1,3 м, V 8,9 м³, подогреватель 25 м², циркнасос 251 м³/ч/11 кВт); выпарной аппарат II ступени (унифицирован); эжектор 0,18 т/ч (0,090 т/ч по соковому); барометрический конденсатор D 1,0 м (138 м³/ч); ПЭБ (эжектор 0,16 т/ч + конденсатор D 0,5 м, 18 м³/ч + ВВН1-3); репульпатор 1,2 м³ с насосом 10 м³/ч; центрифуги 2 шт. × 1,5 т/ч; баки фугата и промвод по 1,0 м³ с погружными насосами; ленточный транспортёр купороса; узел фасовки в биг-беги с ПЭ-вкладышем (весовой дозатор коммерческого учёта, пробоотбор).\n\nОБЩЕЕ: баки питания/маточников с мешалками и погружными насосами (в т.ч. обогреваемые поз. 4.1.5, 4.1.26, бак 4.1.22), репульпатор растворения купороса 5–8 м³ с обогревом острым паром; трубопроводы, арматура (904L/полимеры), теплоизоляция; металлоконструкции этажерок; АСУ с КИПиА.\n\nОПРОСНЫЕ ЛИСТЫ (комплект БИ): на выпарные аппараты с подогревателями, эжекторы и ПЭБ, барометрические конденсаторы, центрифуги, насосы, узел фасовки, ВВН — с указанием сред, составов (в т.ч. Cl⁻ 20–35 г/м³), материала 904L, режимов вакуума и требований к сварке/контролю. Оборудование длительного цикла изготовления — выпарные аппараты и теплообменники в 904L (исходные требования — в составе БИ).\n\nМОНТАЖ: самые тяжёлые единицы — испарители нитки 1 (масса по ОЛ изготовителя; при интегральной поставке ориентировочно 8–15 т) — превышают грузоподъёмность существующих кранов ГМУ (5/7,5 т): предусмотреть укрупнительную сборку из транспортабельных частей или монтаж мобильным краном через монтажный проём; требования к монтажу с весами частей — обязательный раздел БИ (ТЗ п. 4.5).","items":[{"label":"Испарители","value":"4 шт.: 2 × (D 2,0 м; 34,5 м³) и 2 × (D 1,3 м; 8,9 м³); напряжённость парового пространства 22 800/22 000 м³/(м²·ч), потоки пара 49 417 / 23 032 / 17 647 / 5530 м³/ч","src":"ИД рис. 4.4/4.5; табл. 4.1"},{"label":"Центрифуги","value":"2 × 2,5 т/ч + 2 × 1,5 т/ч, пульсирующие, 1800 об/мин","src":"ИД табл. 4.1, рис. 4.4/4.5"},{"label":"Вакуумное хозяйство","value":"2 эжектора II ступеней + 2 ПЭБ (ВВН1-6, ВВН1-3) + 2 барометрических конденсатора (D 2,0 и 1,0 м) + 2 конденсатора ПЭБ (D 0,5 м)","src":"ИД рис. 4.4/4.5"},{"label":"Материал","value":"904L или аналог — все аппараты и трубопроводы растворного тракта","src":"ИД разд. 4.2.1"}],"gost":[{"doc":"ГОСТ 34233.1/34233.2-2017","what":"Прочностные расчёты сосудов в составе ОЛ и техтребований"},{"doc":"ТР ТС 010/2011","what":"Безопасность машин и оборудования — декларирование/сертификация комплектных машин (центрифуги, насосы)"}],"open":["Количественная спецификация с массами и энергопотреблением — после получения ТКП (2–3 на позицию)","Габарит/масса испарителей и разбивка на транспортабельные части — по данным изготовителей"]},{"id":"postavka","title":"Стоимость поставки по Лоту №2 (порядок формирования)","kind":"pz","body":"В составе БИ приводится: (1) стоимость оборудования по данным технико-коммерческих предложений потенциальных поставщиков — не менее 2–3 ТКП на каждую позицию (испарительные установки 904L, центрифуги, вакуумное хозяйство, фасовка, насосы, АСУ); (2) оценка общей стоимости комплектной поставки технологического оборудования и материалов (трубопроводы, металлоконструкции этажерок, теплоизоляция, арматура, КИПиА) в границах п. 4.3 ТЗ — с учётом поставки АСУ с прикладным программным обеспечением.\n\nРекомендуемая структура запроса ТКП: лот целиком у комплектного поставщика вакуум-кристаллизационных установок (обе нитки «под ключ» с гарантиями по производительности и влажности купороса 4–6 %) + альтернативная разбивка на пакеты (аппараты 904L / центрифуги / вакуумное хозяйство / фасовка / АСУ) для конкуренции. В опросные листы включить технологические гарантии: производительность по купоросам (1,70 и 0,80 т/ч), остаточная влажность, содержание примесей в медном купоросе (Ni ≤ 0,29 %), удельные расходы пара, стойкость материала.\n\nВалютно-логистические условия, сроки изготовления (аппараты 904L — длительный цикл), шеф-монтаж и ПНР — отдельными строками оценки. Стоимостные данные в настоящем разделе не приводятся до получения ТКП.","items":[{"label":"Требование ТЗ","value":"≥2–3 ТКП на каждую позицию; оценка комплектной поставки с АСУ и ППО","src":"ТЗ, раздел «Стоимость поставки по Лоту №2»"}],"gost":[],"open":["Перечень потенциальных поставщиков вакуум-кристаллизационных установок в 904L (РФ/дружественные юрисдикции) — рынок сузился, проработать на этапе запросов","Валюта и базис поставки, график платежей — коммерческий блок Заказчика"]}]}, {"lot":3,"name":"Отделение электроэкстракции меди","sections":[{"id":"obshchie-svedeniya","title":"Общие сведения, продукция и режим работы","kind":"pz","body":"Отделение электроэкстракции меди — завершающий передел комплекса КГМК.ОВЭ-75 («обжиг – выщелачивание – электроэкстракция», 75 000 т катодной меди в год). Размещается в существующем корпусе электрорафинирования меди металлургического цеха (ЦЭМ) промплощадки АО «Кольская ГМК», г. Мончегорск. Продукция — медь катодная марки М00к по ГОСТ 859-2014 в виде целых катодных листов (выпуск также по требованиям BS EN 1978:1998 / ЛБМ, требование ИД ч.2 п. 1.2.1); SEN 420–450 мм. Второй продукт — оборотный раствор («бедный» электролит) состава 35 Cu / 20 Ni / 1,6 Co / 2,6 Fe / 120 H2SO4 кг/м³: основная часть возвращается на усреднение с богатым фильтратом (1038 тыс. м³/год), меньшая (27,3 тыс. м³/год) отсекается на выщелачивание огарка и растворение кристаллов медного купороса (ТЗ п. 5.1). Питание отделения — фильтрат контрольной фильтрации (богатый раствор) через фланец трубопровода от ёмкости поз. 4.1.19 (граница 5.2.1).\n\nРежим работы: круглосуточный, 358 дней в году, 8584,8 ч (КИО ванн 98 %); прочее оборудование гидрометаллургии — 8322 ч (КИО 95 %). Расчётная часовая производительность по катодной меди 8066,1 кг/ч, что за 8584,8 ч даёт 8066,1 × 8584,8 / 1000 ≈ 69 250 т/год — расчётная загрузка по сценарным условиям ИД (перспективная средняя загрузка КГМК 2029–2039 гг.). Номинальная мощность 75 000 т/год обеспечивается запасом оборудования: при работе всех 180 ванн на номинальной плотности тока 280 А/м² выпуск составит 49,63 × 180 × 8584,8 / 1000 ≈ 76 700 т/год (см. раздел электрического расчёта).\n\nСостав основного оборудования в границах БИ (ТЗ п. 5.3): циркуляционные баки, аноды, катодные матрицы, электролизные ванны, аспирационные укрытия ванн, роботизированная катодосдирочная машина (КСМ), оборудование формирования пакетов и автоматической изоляции кромок матриц, специальные автоматические краны с системой позиционирования, ошиновка ванн, автоматизированная транспортировка пакетов на СГП, АСУ с прикладным ПО. Помещение электролизного зала: категория В2 по взрывопожарной опасности (СП 12.13130), среда химически активная (аэрозоли H2SO4, Cu, Ni), климатическое исполнение оборудования УХЛ3 по ГОСТ 15150-69, температура в помещении +12…+24 °С, относительная влажность > 75 % (ИД ч.2, прил. В).","items":[{"label":"Продукция","value":"Медь катодная М00к по ГОСТ 859-2014 (BS EN 1978:1998), SEN 420–450 мм","src":"ИД ч.2 разд. 1.2, табл. 1.1"},{"label":"Ожидаемые примеси","value":"S 0,0006; Fe 0,0002; Ni 0,0003; Ag 0,0005; Pb 0,00004 % — с запасом внутри норм М00к (сумма ≤ 0,0065 %)","src":"ИД ч.2 табл. 1.1"},{"label":"Режим работы","value":"358 сут/год, 8584,8 ч, КИО ванн 98 %","src":"ТЗ п. 5.3; ИД ч.2 табл. 3.1"},{"label":"Производительность","value":"8066,1 кг/ч; ≈69,25 тыс. т/год расчётная; 75 тыс. т/год номинал с запасом до ≈76,7 тыс. т/год при 280 А/м²","src":"ИД ч.2 табл. 4.2; расчёт"},{"label":"Ванны","value":"180 шт. = 2 серии × 90 (2 ряда по 45), запас 10 % (расчётно 163 шт.)","src":"ИД ч.2 п. 4.2.2"},{"label":"Оборотный раствор","value":"35 Cu / 20 Ni / 1,6 Co / 2,6 Fe / 120 H2SO4 кг/м³; Cl⁻ 25–30 г/м³","src":"ТЗ п. 5.1; ИД ч.2 табл. 3.1"}],"gost":[{"doc":"ГОСТ 859-2014","what":"Марка катодной меди М00к, нормы по примесям"},{"doc":"ГОСТ 15150-69","what":"Климатическое исполнение УХЛ3 оборудования"},{"doc":"СП 12.13130.2009","what":"Категория помещения В2 по взрывопожарной опасности (по ИД/Дельта)"}],"open":["Качество катодной меди уточняется на стадии освоения производства (ИД ч.2 п. 1.2.1)","Сведение баланса 69,25 тыс. т/год (расчёт ИД) и 75 тыс. т/год (номинал проекта) закрепить в БИ протоколом с Заказчиком"]},{"id":"tekhprocess","title":"Описание технологического процесса по операциям","kind":"pz","body":"1) ЦИРКУЛЯЦИЯ И КОНДИЦИОНИРОВАНИЕ ЭЛЕКТРОЛИТА. Каждая серия (90 ванн) имеет раздельную циркуляцию: циркуляционный бак питания поз. 4.2.1 (300 м³, с перегородкой) → циркуляционные насосы (вне БИ) → пластинчатый холодильник поз. 4.2.2 → напорный коллектор → индивидуальные подводы в ванны → самотёчный перелив «бедного» электролита обратно в бак. В пространство бака перед перегородкой поступает бедный электролит из ванн; из него же отбирается поток на выщелачивание (124,7 м³/ч в приёмный бак поз. 4.1.8 ГМУ) и на растворение медного купороса (3,2–3,5 м³/ч). В зону смешения за перегородкой подаются: богатый фильтрат контрольной фильтрации (124–125 м³/ч, ≈102,9 кг/м³ Cu), растворы коллоидной добавки гуартек, антиаэрозольная добавка FC-1100, серная кислота, растворы промывки катодов от КСМ, растворы системы аспирации, зумпфовые воды и подпиточная вода по балансу. Раствор питания ванн отбирается из зоны за перегородкой: состав после усреднения 40 Cu / 20 Ni / 2,6 Fe / 1,3 Co / 112 H2SO4 кг/м³, температура 50 °С. Кондиционирование: поддержание Cu 35–40 кг/м³, H2SO4 113–120 кг/м³, Cl⁻ 25–30 г/м³ (дозирование HCl 33 % или раствора NaCl), температуры 50 °С, концентраций добавок (гуартек 0,25 кг/т, FC-1100 0,20 кг/т Cu). Предельные примеси: Ni ≤ 20 г/л (лидирующая), Fe ≤ 3 г/л — баланс держится отсечкой части фильтрата на купоросы (вне Лота №3).\n\n2) ЭЛЕКТРОЭКСТРАКЦИЯ. Электролиз в ящичных полимербетонных ваннах (Unicell или аналог, конструкция по проекту ДЕЛЬТА) с нерастворимыми анодами: в ванне 84 катодные матрицы (нерж. 316L, рабочее полотно 1000×1000×3,25 мм, две стороны — 2,0 м²) и 85 анодов (холоднокатаный Pb–Ca(0,06–0,08 %)–Sn(1,35–1,5 %), рабочая часть 940×952×6 мм), шаг электродов 95 мм. На катоде разряжается Cu²⁺, на аноде выделяется кислород и регенерируется H2SO4. Съём меди из электролита 5,0 кг/м³ (40 → 35 кг/м³ при удельном расходе ≈9,1 м³/ч на ванну; полный обмен объёма ванны ≈1,4 ч). Цикл наращивания катодного осадка 6–7 сут (масса катода-«книжки» 76,8–89,7 кг без матрицы); за цикл из ванны трижды выгружается по 1/3 матриц (28 шт.) с равномерным шагом — «шахматный» график, не прерывающий ток серии. Срок анодной кампании 5–7 лет, матриц — 6 лет.\n\n3) АСПИРАЦИЯ ВАНН. Каждая ванна укрыта легкосъёмным колпаком, интегрированным с бортовым (торцевым) отсосом; отсосы объединяются в общий газоход (система аспирации и скруббер — вне БИ, граница — фланец отсоса каждого укрытия, п. 5.2.4). Интенсивность отсоса должна исключать достижение точки росы под колпаком; коллекторы — с периодической автоматической промывкой водой от накопления сухих солей, слив промывных растворов — в циркуляцию. На период обслуживания ванны колпак снимается («матрёшкой» на соседний или на грузозахват крана), отсос от вскрытой ванны дросселируется для сохранения разрежения в остальных. Дополнительно к колпакам в электролит дозируется FC-1100 (подавление кислотного тумана до < 0,2 мг/м³ H2SO4 в воздухе), зал обеспечивается общеобменной приточно-вытяжной вентиляцией повышенной кратности (вне БИ).\n\n4) ОБРАБОТКА КАТОДОВ НА КСМ. Спецкран подаёт борону с 28 матрицами на приёмный конвейер КСМ (принята производительность 120 матриц/ч при расчётной 105). Далее автоматически: двухстадийная промывка горячей водой (I ст. 25 м³/ч, 60–80 °С оборотная; II ст. 4 м³/ч, 90–115 °С свежая) в камере с туманоуловителем; поштучная передача роботами на станцию сдирки; прокатка валками, надрыв кромки, отделение двух пластин SPLIT-системой без сращивания по нижней кромке (требование сбыта); оптический контроль матриц машинным зрением с автоматической отбраковкой (повреждения обрамления, геометрии, чистоты поверхности) и учётом в электронном реестре парка матриц; кондиционные и подменные матрицы собираются на разгрузочном конвейере в полную ванновую загрузку под борону (шаг 100 мм). Катоды укладываются в стопы с весовым контролем, маркировкой, увязкой тремя коррозионностойкими лентами (пакет 2500 ± 50 кг по требованию сбыта; референс КСМ — 1400–2000 кг, привести к 2500 в опросном листе), автоматическим пробоотбором (пресс, пробы цилиндрической формы «конвертом») и «перфорацией» пакета профилированием части листов под грузозахваты СГП. Промывные воды КСМ возвращаются в циркуляционный бак; при Cu ≥ 1,6 г/л и H2SO4 ≥ 2 г/л вода считается грязной и скачивается в ГМО.\n\n5) ЧИСТКА ВАНН ОТ СВИНЦОВОГО ШЛАМА. Периодичность — по регламенту не чаще 1 раза в год на ванну (расчётная периодичность полной чистки 5 лет, совмещается со сменой анодов). Последовательность: ванна шунтируется закорачивающей рамой (масса 8,7 т, опирается на борта соседних ванн) так, чтобы аноды не оказались в режиме КЗ; электроды полностью выгружаются краном (аноды — на стеллаж разбраковки/промывки); ванна опорожняется переносной помпой в сливной карман; под донную пробку (дно с уклоном к центру) по подванным рельсам подводится мобильный опрокидывающийся нутч-фильтр (вне БИ); плотный слой шлама смывается струёй воды через донное отверстие; шлам промывается горячей водой (40–70 °С, 2 м³/т) и обезвоживается на стационарной вакуумной площадке; выгрузка опрокидыванием в транспортную тару. Выход шлама с ванны за чистку ≈1,44 т (насыпной вес влажного 3,2 т/м³), годовой ≈25,9–30 т (сух.), влажность отмытого 20–30 %, Pb ≈50 %. Фильтрат и промводы — в репульпатор поз. 4.1.21 ГМУ. Промытый шлам утилизируется совместно с отработанными анодами в специализированной организации.","items":[{"label":"Поток питания на серию","value":"800–825 м³/ч (сумма на 2 серии 1600–1650 м³/ч); ≈9,1 м³/ч на ванну","src":"ИД ч.2 табл. 3.1; табл. 4.2"},{"label":"Съём меди в ванне","value":"5,0 кг/м³ (40 → 35 кг/м³)","src":"ИД ч.2 табл. 3.1"},{"label":"Цикл наращивания","value":"6–7 сут; выгрузка 3 × 1/3 матриц (по 28 шт.)","src":"ИД ч.2 табл. 3.1; ТЗ п. 5.3"},{"label":"КСМ","value":"120 матриц/ч принято (расчёт 105); промывка 2 стадии; SPLIT без сращивания нижней кромки","src":"ИД ч.2 табл. 4.2, п. 4.2.2; ТЗ п. 5.3"},{"label":"Чистка ванн","value":"≤1 раз/год; шунтирование рамой 8,7 т; шлам 1,44 т/ванну; вода 2 м³/т, 40–70 °С","src":"ИД ч.2 п. 4.2.2, табл. 3.1"},{"label":"Аноды/матрицы","value":"Аноды Pb–Ca–Sn 85 шт./ванну (кампания 5–7 лет); матрицы 316L 84 шт./ванну (6 лет)","src":"ИД ч.2 п. 1.3.8–1.3.9, табл. 3.1"}],"gost":[{"doc":"ФНП «Правила безопасности процессов получения или применения металлов» (приказ Ростехнадзора от 09.12.2020 № 512)","what":"Требования к электролизному производству, обслуживанию ванн, ГПМ в техпроцессе"},{"doc":"ГОСТ 12.1.005-88","what":"ПДК в воздухе рабочей зоны: H2SO4 (аэрозоль) 1 мг/м³, Cu 0,5 мг/м³, соли Ni 0,005 мг/м³"},{"doc":"ГОСТ 12.4.021-75","what":"Системы вентиляционные — требования к аспирации и общеобменной вентиляции"}],"open":["Отсос от вскрытой ванны при снятом колпаке: величина дросселирования и схема — определяется на стадии БИ совместно с проектировщиком аспирации (вне БИ)","Замена FC-1100: производство 3М остановлено (ИД ч.2, прил. Б) — в БИ заложить аналоги (Eagles 1100, ChemShi NF-100) с испытаниями","Масса пакета: референс КСМ 1400–2000 кг против требования сбыта 2500 ± 50 кг — закрепить 2500 кг в опросном листе КСМ"]},{"id":"raschet-elektricheskiy","title":"Электрический расчёт серии электролиза","kind":"calc","body":"ИСХОДНЫЕ: 180 ванн в 2 серии по 90 (последовательное соединение ванн в серии по постоянному току); в ванне 84 катода рабочей площадью 2,0 м² (обе стороны); катодный выход по току η = 89 %; электрохимический эквивалент меди q = M/(z·F) = 63,546/(2 × 26,8014) = 1,1855 г/(А·ч).\n\n1) АКТИВНАЯ ПЛОЩАДЬ И ТОКИ. Площадь осаждения ванны S = 84 × 2,0 = 168 м². Номинальный ток серии при расчётной плотности тока 280 А/м²: I_ном = 280 × 168 = 47 040 А ≈ 47,0 кА — по нему выбраны выпрямители (47,0 кА; 3 шт: по одному на серию + общий резервный, ошиновка допускает работу резерва на любую серию; вне БИ). Фактический (среднеэксплуатационный) ток серии I_факт = 42,45 кА, чему отвечает фактическая плотность тока j = 42 450/168 = 252,7 А/м². Номинальная средняя токовая нагрузка на электрод 47 040/84 = 560 А (ИД табл. 3.1).\n\n2) ОБОСНОВАНИЕ j = 252,7 А/м². Требуемый часовой съём меди 8066,1 кг/ч обеспечивается при 280 А/м² расчётным числом ванн n = 8066,1/49,49 = 163 шт. (49,49 кг/ч — производительность ванны при 280 А/м² по ИД; проверка по Фарадею: 1,1855 × 47 040 × 0,89 = 49,63 кг/ч, сходимость 0,3 %). Принято 180 ванн (запас 10 % на неравномерность поставки сырья, ИД табл. 3.1). При том же съёме металла, распределённом на 180 ванн: m_ванны = 8066,1/180 = 44,81 кг/ч, откуда I = m/(q·η) = 44 810/(1,1855 × 0,89) = 42 470 А ≈ 42,45 кА и j = 252,7 А/м². Снижение рабочей плотности тока на 10 % относительно номинала даёт: запас на форсировку до 280 А/м² при пиковой поставке сырья и выводе ванн в чистку; более равномерный и плотный осадок (ниже риск дендритов и КЗ); снижение напряжения ванны и удельного расхода электроэнергии; снижение туманообразования. Верхний предел кратковременно — 420 А/м² на оставшихся электродах при изъятии 1/3 катодов (280 × 3/2 = 420, прил. В ДЕЛЬТА).\n\n3) НАПРЯЖЕНИЯ. Номинальное напряжение ванны U_в = 2,05 В (ИД табл. 3.1; структура: равновесная ЭДС ≈0,9 В + перенапряжения O2/Cu + омические потери в электролите, контактах и электродах), максимальное 2,5 В (конец кампании анодов, загрязнение контактов; по прил. В ДЕЛЬТА проектное до 2,71 В). Падение в межванновой ошиновке 0,06 В/ванну. Напряжение серии: U_с = 90 × (2,05 + 0,06) = 189,9 ≈ 190 В (ном); максимальное 90 × 2,5 ≈ 225 В — отвечает номиналу выпрямителя 227 В, потолок 250 В покрывает деградационные режимы и запас регулирования. Мощность серии P = 190 × 42,45 = 8,06 МВт; двух серий — 16,1 МВт постоянного тока.\n\n4) УДЕЛЬНЫЙ РАСХОД ЭЛЕКТРОЭНЕРГИИ. w = U_в/(q·η) = 2,05/(0,0011855 × 0,89) = 1943 ≈ 1940 кВт·ч/т (ИД табл. 3.1 — на шинах ванн, без потерь в магистральных шинах и преобразователях, как оговорено в разд. 8 ИД). С учётом межванновой ошиновки (2,11 В) — ≈2000 кВт·ч/т. Годовое потребление технологической энергии постоянного тока 134 484 тыс. кВт·ч (табл. 8.5), что при 69 245 т/год даёт 1,942 МВт·ч/т — сходится. Потери в преобразователях и магистральных шинах (КПД тракта ≈0,96–0,97) добавляют ≈60–80 кВт·ч/т — уточняется в БИ по данным поставщика выпрямителей (вне БИ).\n\n5) ТЕПЛОВЫДЕЛЕНИЕ В ЭЛЕКТРОЛИТ. Полная электрическая мощность двух серий 16,1 МВт. Полезно связывается в электрохимическом превращении I·U_тн, где U_тн — термонейтральное напряжение реакции CuSO4(р-р) + H2O → Cu + H2SO4(р-р) + ½O2 (оценочно 1,15–1,25 В; принять уточнённое значение по термодинамическому расчёту на стадии БИ). Тепловыделение в электролит двух серий: Q = 2 × 90 × I × (U_в − U_тн) = 2 × 90 × 42 450 × (2,05 − 1,20) ≈ 6,5 МВт (оценка). Из них ≈3,77 МВт снимается холодильниками циркуляции (раздел теплового баланса), остальное — испарение с зеркала ванн в аспирацию, потери с поверхностей ванн и трубопроводов (температура наружной стенки ванны ≤ 40 °С), вынос с катодами и отсекаемыми потоками. Полный тепловой баланс сводится в БИ.","items":[{"label":"Площадь осаждения ванны","value":"S = 84 × 2,0 = 168 м²","src":"ИД ч.2 табл. 3.1"},{"label":"Ток серии ном./факт.","value":"47,04 кА (280 А/м²) / 42,45 кА (252,7 А/м²)","src":"ИД ч.2 табл. 4.2; расчёт"},{"label":"Число ванн","value":"n = 8066,1/49,49 = 163 расч. → 180 принято (запас 1,104)","src":"ИД ч.2 табл. 4.2"},{"label":"Напряжение ванны / серии","value":"2,05 В ном (макс 2,5; проектное 2,71) / 190 В ном (макс ≈225 В)","src":"ИД ч.2 табл. 3.1; прил. В"},{"label":"Выпрямители (вне БИ)","value":"3 × (227 В ном / 250 В макс; 47,0 кА); резерв на любую серию","src":"ИД ч.2 табл. 4.2, п. 4.2.2"},{"label":"Удельный расход","value":"1940 кВт·ч/т на шинах ванн; ≈2000 с ошиновкой; 1,942 МВт·ч/т по году","src":"ИД ч.2 табл. 3.1, 8.5"},{"label":"Мощность пост. тока","value":"8,06 МВт на серию; 16,1 МВт на отделение","src":"расчёт: 190 В × 42,45 кА × 2"},{"label":"Тепловыделение в электролит","value":"≈6,5 МВт (оценка при U_тн ≈ 1,2 В); съём холодильниками 3,77 МВт","src":"расчёт; ИД ч.2 табл. 3.1"}],"gost":[{"doc":"ПУЭ (изд. 7), разд. 7.10 «Электролизные установки и установки гальванических покрытий»","what":"Требования к электролизным установкам: изоляция, проходы, контроль изоляции, электрический разрыв в трубопроводах"},{"doc":"ПУЭ (изд. 7), п. 1.2.17–1.2.21","what":"Категорирование надёжности электроснабжения; электролиз с непрерывным циклом — I категория (АСУ — I особая)"},{"doc":"ГОСТ 12.1.019-2017 (ССБТ. Электробезопасность)","what":"Общие требования электробезопасности при постоянном токе до 250 В"},{"doc":"ГОСТ 12.2.007.0-75","what":"Безопасность электротехнических изделий (ошиновка, шкафы)"}],"open":["Точное термонейтральное напряжение U_тн для рабочего электролита — термодинамический расчёт на стадии БИ","Потери в магистральных шинах и преобразователях — по данным поставщика выпрямителей (вне БИ), для сводного энергобаланса","ТУ на присоединение к сетям (граница 5.2.7) — запрашиваются по расчёту нагрузок БИ"]},{"id":"balans-tsirkulyatsii","title":"Тепловой и материальный баланс контура циркуляции","kind":"calc","body":"МАТЕРИАЛЬНЫЙ БАЛАНС КОНТУРА (на две серии, часовой). Вход в циркуляционные баки: бедный электролит из ванн 1600–1650 м³/ч (самотёк); богатый фильтрат контрольной фильтрации 124–125 м³/ч (102,9 кг/м³ Cu); промывные воды КСМ и системы аспирации, зумпфовые возвраты, растворы добавок, серная кислота и вода по балансу (в балансе растворов ИД предусмотрен резерв поступления воды; неиспользуемый резерв обязан компенсироваться подачей свежей производственной воды — ИД разд. 5). Выход: питание ванн 1600–1650 м³/ч (40 Cu/112 H2SO4, 50 °С); отсечка на выщелачивание 124,7 м³/ч (= 1038 тыс. м³/год при 8322 ч); на растворение медного купороса 3,2–3,5 м³/ч (= 27,3 тыс. м³/год). Съём меди в ваннах 5 кг/м³ × ≈1634 м³/ч ≈ 8,17 т/ч ≈ производительность 8,066 т/ч с учётом фактических концентраций. Кислотный баланс: на каждый кг осаждённой меди регенерируется 1,543 кг H2SO4 (98,08/63,55), т.е. ≈12,4 т/ч кислоты возвращается с бедным электролитом на выщелачивание — этим определяется кислотность оборотного раствора 120 кг/м³.\n\nТЕПЛОВОЙ БАЛАНС. Приход тепла: джоулево тепловыделение ванн ≈6,5 МВт (оценка, см. электрический расчёт); богатый фильтрат поступает с ≈65–75 °С через теплообменник поз. 4.1.17 (вне БИ), где отдаёт тепло оборотному раствору на выщелачивание. Расход тепла: съём в пластинчатых холодильниках поз. 4.2.2; испарение с зеркала ванн под колпаками (уносится аспирацией); теплопотери поверхностей (стенка ванны ≤ 40 °С); вынос с отсекаемыми потоками и катодами.\n\nРАСЧЁТ ХОЛОДИЛЬНИКОВ. По ИД: весь поток питания охлаждается с 50,0 до 48,2 °С перед подачей в ванны (ΔT = 1,8 °С — в ваннах раствор снова нагревается до 50 °С). Q = G·ρ·c·ΔT = (1634,5/3600) м³/с × 1200 кг/м³ × 3,85 кДж/(кг·К) × 1,8 К = 3772 кВт ≈ 3780 кВт (ИД табл. 3.1). Охлаждающая вода нейтральной СОВ: 216 м³/ч суммарно, нагрев 22,5 → 37,5 °С (проверка: 216/3600 × 1000 × 4,19 × 15 = 3770 кВт — сходится). Принято 2 пластинчатых теплообменника по 2500 кВт (по одному на серию), суммарно 5000 кВт — коэффициент запаса 5000/3772 = 1,33. Запас обоснован: загрязнение пластин (гипсовые инкрустации — по опыту ГМУ требуется резерв поверхности на чистку), летний максимум температуры оборотной воды, форсировка тока до 280 А/м² (тепловыделение растёт ≈ пропорционально j², до +23 %), пусковые режимы.\n\nЧТО ЗАДАЁТ ТЕМПЕРАТУРНЫЙ РЕЖИМ 50 °С: сверху — рост кислотного туманообразования, ускоренная коррозия анодов и деструкция гуартека, размягчение ПП-обрамления матриц (ограничение 55 °С макс по прил. В); снизу — рост вязкости и удельного сопротивления электролита (рост U_в и удельного расхода), падение качества осадка и, критически, риск кристаллизации сульфатов при охлаждении растворов ниже 30–40 °С (ИД п. 4.2.1) с зарастанием трубопроводов и оборудования. Поэтому контур работает в узком коридоре 50 ± 2 °С со съёмом строго дозированного избытка джоулева тепла; холодильники ставятся на общем потоке ПЕРЕД ваннами (100 % потока через аппарат), а не в байпасе — это выравнивает температуру по всем 90 ваннам серии. Теплообменники в поставку Лота №3 не входят (перечень «не в БИ»), но их тепловые параметры — задание Лота №3 смежному проектировщику.","items":[{"label":"Поток циркуляции","value":"1600–1650 м³/ч на 2 серии (≈817 м³/ч на серию; 9,1 м³/ч на ванну)","src":"ИД ч.2 табл. 3.1"},{"label":"Циркуляционные баки","value":"2 × 300 м³ (расчёт 408,6 м³ = 0,25 ч × 1634,5 м³/ч; запас 1,25 по рабочему объёму)","src":"ИД ч.2 табл. 4.2"},{"label":"Тепловой поток на съём","value":"Q = 3772 кВт (1634,5 м³/ч; 50 → 48,2 °С; c ≈ 3,85 кДж/(кг·К), ρ = 1200 кг/м³)","src":"ИД ч.2 табл. 3.1; проверочный расчёт"},{"label":"Холодильники","value":"2 × 2500 кВт (запас 1,33); вода 216 м³/ч, 22,5 → 37,5 °С","src":"ИД ч.2 табл. 4.2, табл. 3.1"},{"label":"Температурный коридор","value":"50 ± 2 °С; макс 55 °С; кристаллизация солей ниже 30–40 °С","src":"ИД ч.2 табл. 3.1, п. 4.2.1, прил. В"},{"label":"Отсечки из контура","value":"124,7 м³/ч на выщелачивание; 3,2–3,5 м³/ч на растворение купороса","src":"ИД ч.2 табл. 3.1; ТЗ п. 5.1"}],"gost":[{"doc":"ГОСТ 34347-2017 / ТР ТС 032/2013","what":"Сосуды и аппараты стальные сварные; безопасность оборудования под давлением — применимость к теплообменникам уточнить по параметрам (уточнить номер/применимость)"},{"doc":"СанПиН 1.2.3685-21","what":"Гигиенические нормативы микроклимата и воздуха рабочей зоны при тепловыделениях"}],"open":["Сводный тепловой баланс отделения (испарение с зеркала, потери поверхностей, унос аспирацией) — определяется на стадии БИ","Расход оборотной воды нейтральной СОВ на скруббер аспирации — не учтён в ИД, определяется в составе проекта (ИД п. 4.1.2)","Подтверждение теплофизических свойств электролита (c, ρ, вязкость при 45–55 °С) лабораторией Заказчика"]}]}, {"lot":4,"name":"Склад готовой продукции — инженерные решения БИ","sections":[{"id":"obshchie","title":"Общие сведения об объекте, назначении, месте расположения","kind":"pz","body":"Склад готовой продукции (СГП) — завершающее звено комплекса ОВЭ-75: приём пакетов катодной меди с выходного конвейера катодосдирочной машины (КСМ), защитная упаковка, маркировка, коммерческий учёт, формирование отгрузочных партий и отгрузка железнодорожным и автомобильным транспортом. Границы проектирования (ТЗ п. 6.2): от передаточных ворот из отделения электроэкстракции меди до ворот отгрузки ж/д транспортом и ворот отгрузки автотранспортом.\n\nСГП размещается смежно с отделением электроэкстракции в существующем корпусе электрорафинирования меди (ЦЭМ, Приложение №6 к ТЗ, чертежи ФМ-594хх): «как правило, в непосредственной близости к электролизному отделению расположен склад готовой продукции» (ИД ч.2 разд. 4.2.2); на плане ЦЭМ (ФМ-59415) зона склада готовой продукции выделена исторической планировкой. Ключевое требование ТЗ (п. 6.3): полностью автоматическое складирование с подсистемами позиционирования, завязанными на выходной конвейер КСМ, — все операции от приёмки пакетов до отгрузки партий в транспорт выполняются в автоматическом режиме; автоматизация — сквозная, с выводом показателей в единую диспетчерскую (ТЗ п. 2.10).\n\nРежим приёмки — непрерывный, синхронно с электролизом (358 дней, 8585 ч/год); режим отгрузки — по графику подачи вагонов/автотранспорта. Продукция — медь катодная М00к по ГОСТ 859-2014 (BS EN 1978:1998, требования ЛБМ) в виде пакетов катодных листов.","items":[{"label":"Границы","value":"Передаточные ворота из электроэкстракции → ворота отгрузки ж/д и авто","src":"ТЗ п. 6.2"},{"label":"Размещение","value":"Существующее здание ЦЭМ (пролёты 24 м, крановый пролёт 22 м, шаг колонн вдоль 6 м, длина корпуса ≈180 м, парапет ≈ +17,8)","src":"ИД ч.2 разд. 4.2.2; Прил. №6 (ФМ-59413, ФМ-59415)"},{"label":"Режим приёмки","value":"Круглосуточно, 358 сут/год (8585 ч) — по режиму электролиза","src":"ТЗ п. 5.4 (режим электроэкстракции)"},{"label":"Автоматизация","value":"Полностью автоматический режим всех операций; позиционирование, завязанное на конвейер КСМ","src":"ТЗ п. 6.3"}],"gost":[{"doc":"СП 57.13330.2011","what":"Складские здания — объёмно-планировочные требования к зоне СГП"},{"doc":"СП 56.13330 (действующая редакция)","what":"Производственные здания — совмещение склада с производственным корпусом ЦЭМ"}],"open":["Точные границы зоны СГП в ЦЭМ и трассировка передаточного конвейера — по компоновке Лота №3 (КСМ) и обследованию здания","График подачи вагонов и автотранспорта — исходные данные сбытового блока"]},{"id":"product","title":"Данные об обрабатываемой продукции; параметры пакета","kind":"pz","body":"Продукция — пакеты (стопы) медных катодов с КСМ. Базовые параметры пакета противоречиво заданы в двух местах ИД и гармонизируются так: референсная КСМ формирует пакеты 1400–2000 кг (ИД ч.2, описание КСМ), однако по требованию сбытового блока (ИД п. 1.3.11, 4.2.2; ТЗ Лот №3) пакеты массой 2500 ± 50 кг должны быть увязаны тремя металлическими лентами из коррозионностойкого материала. Для расчётов СГП принят целевой пакет 2500 ± 50 кг; оборудование приёмки и хранения проверяется на диапазон 1400–2500 кг (переходные периоды, неполные пакеты).\n\nРАСЧЁТНЫЕ ПАРАМЕТРЫ ПАКЕТА (показаны с выводом):\n— Масса катодного листа: при токовой нагрузке 560 А/электрод, наращивании 6–7 сут и катодном выходе по току 89 % (ИД табл. 3.1) масса меди на матрицу m = I·τ·q·η = 560 × (6,5·24) × 1,1852 г/(А·ч) × 0,89 ≈ 92 кг, т.е. ≈46 кг на один лист (система SPLIT — два листа с матрицы). Пакет 2500 кг ≈ 54 листа (27 матриц).\n— Габарит в плане ≈ 1000 × 1000 мм (рабочий размер катода по ИД табл. 3.1).\n— Высота пакета: сплошная медь 2500/8920 = 0,28 м; с коэффициентом неплотности укладки листов 1,5–1,8 → 0,42–0,50 м (уточняется по данным поставщика КСМ).\n— Опора пакета: без деревянных брусков — нижние листы профилируются в пределах КСМ («перфорация» для вилочных и крановых захватов); конфигурация профилирования должна быть увязана с грузозахватами СГП (ТЗ п. 5.3) — интерфейсное требование Лот №3 ↔ Лот №4.\n— Увязка: 3 ленты из материала, стойкого к коррозии при длительной морской транспортировке и хранении под открытым небом; исключаются материалы, требующие особой сертификации или утилизации (ИД п. 1.3.11).\n\nПоток продукции: 75 000 т/год = 30 000 пакетов/год (по 2,5 т); среднесуточно 75 000/358 = 209,5 т/сут = 84 пакета/сут; среднечасово 75 000/8585 = 8,74 т/ч = 3,5 пакета/ч (при пакетах 1,4–2,0 т — 4,4–6,2 пакета/ч: конвейер приёмки и штабелёры проверяются на 7 пакетов/ч пиковых).","items":[{"label":"Пакет (целевой)","value":"2500 ± 50 кг; ≈54 листа × ≈46 кг; 1,0×1,0 м в плане; высота ≈0,42–0,50 м","src":"ИД п. 1.3.11; ИД табл. 3.1; расчёт БИ"},{"label":"Пакет (диапазон КСМ)","value":"1400–2000 кг — проверочный диапазон оборудования","src":"ИД ч.2 (описание КСМ)"},{"label":"Поток","value":"30 000 пакетов/год; 84 пакета/сут; 3,5 пакета/ч (пик до 7)","src":"расчёт БИ от 75 000 т/год"},{"label":"Марка продукции","value":"М00к по ГОСТ 859-2014; SEN 420–450 мм; сумма примесей ≤0,0065 %","src":"ИД табл. 1.1"}],"gost":[{"doc":"ГОСТ 859-2014","what":"Марка и химсостав катодной меди М00к"},{"doc":"BS EN 1978:1998","what":"Cu-CATH-1 — требования ЛБМ к катодам (экспортный контракт)"}],"open":["Окончательная масса и высота пакета, конфигурация профилирования опорных листов — данные поставщика КСМ (Лот №3)","Материал и сечение увязочных лент (нерж. лента) — по ТКП поставщика КСМ/упаковки"]},{"id":"tehproc","title":"Описание технологического процесса по операциям","kind":"pz","body":"ОПЕРАЦИЯ 1. Приёмка. Пакет катодов с выходного (пакеторазгрузочного) конвейера КСМ проходит через передаточные ворота на приёмную позицию СГП (роликовый/цепной конвейер приёмки). Идентификация пакета — считывание номера пакета (этикетка/QR c КСМ), привязка к плавке/партии в ИС.\n\nОПЕРАЦИЯ 2. Входной весовой контроль. Автоматическое взвешивание каждого пакета на конвейерных платформенных весах (класс точности «высокий», НПВ 3 т): сверка с данными КСМ, допусковый контроль 2500 ± 50 кг; пакеты вне допуска — на позицию разбраковки (переукладка/доукомплектование, управление от АСУ).\n\nОПЕРАЦИЯ 3. Отбор проб. По заданию АСУ часть катодов направляется на сверловку (стружка «конвертом» по полотну листа) для химанализа партии; пробоотбор автоматизирован (сверловочный стенд), возврат листов в пакет.\n\nОПЕРАЦИЯ 4. Защитная упаковка и маркировка. Контроль/дотяжка увязки (3 коррозионностойкие ленты), при необходимости — защитная упаковка партии по требованию контракта; печать и нанесение этикеток (номер пакета, партия, масса брутто/нетто, марка М00к, производитель, дата) — принтеры термо (Zebra) и лазерный по Прил. №5; маркировка — по ГОСТ 14192-96.\n\nОПЕРАЦИЯ 5. Адресное размещение. Автопогрузчик-штабелёр по команде АСУ забирает пакет с позиции выдачи и ставит его по адресу в зоне хранения — по размеченным линиям, в стопы до 2 ярусов (базово); АСУ ведёт карту склада («что и где стоит») и назначает адреса по алгоритму (партия, срок, тип отгрузки).\n\nОПЕРАЦИЯ 6. Хранение и набор партии. Накопление отгрузочной партии (группа вагонов/судовая партия) с резервированием адресов; статус партии — после подтверждения химанализа проб.\n\nОПЕРАЦИЯ 7. Отгрузка ж/д. Подача вагонов к внутреннему фронту (ворота ж/д); погрузка: в полувагоны — мостовым краном с автоматической траверсой (захват за профилированные листы), в крытые вагоны — штабелёрами через дверной проём; вариант определяется родом подвижного состава (задание сбыта) — в БИ прорабатываются оба. Контроль массы — вагонные весы; размещение и крепление — по ТУ размещения и крепления грузов (ЦМ-943, уточнить редакцию).\n\nОПЕРАЦИЯ 8. Отгрузка авто. Погрузка штабелёром в автотранспорт у ворот автоотгрузки (2 поста), контроль — автомобильные весы.\n\nОПЕРАЦИЯ 9. Учёт и документы. Все взвешивания — в АИС весоизмерения с передачей в ХТД PIMS; формирование партийной и отгрузочной документации — автоматически (интеграция с ИС КСМ, которая «обеспечивает формирование партий отгружаемой продукции с оформлением стандартизированной сопровождаемой документации», ТЗ п. 5.3).\n\nВсе операции — в автоматическом режиме; ручной режим — наладка и нештатные ситуации (ТЗ п. 6.3).","items":[{"label":"Темп приёмки","value":"3,5 пакета/ч средний, до 7 пакетов/ч пиковый","src":"расчёт БИ"},{"label":"Темп отгрузки","value":"84 пакета/сут ≈ 3 полувагона/сут (27 пакетов = 67,5 т на вагон г/п ~69–70 т)","src":"расчёт БИ"},{"label":"Ярусность хранения","value":"2 яруса базово (высота стопы ≈0,9–1,1 м); 3 яруса — по результатам обследования пола","src":"решение БИ"},{"label":"Отбор проб","value":"Сверловка части катодов по заданию АСУ (требование ТЗ п. 6.4)","src":"ТЗ п. 6.4"}],"gost":[{"doc":"ГОСТ 14192-96","what":"Маркировка грузов"},{"doc":"ТУ размещения и крепления грузов в вагонах и контейнерах (ЦМ-943)","what":"Схемы размещения и крепления пакетов в вагонах — уточнить действующую редакцию"},{"doc":"Правила по охране труда при погрузочно-разгрузочных работах (приказ Минтруда № 753н от 28.10.2020)","what":"Организация ПРР на фронтах отгрузки"},{"doc":"ГОСТ 12.3.009-76","what":"Работы погрузочно-разгрузочные — общие требования безопасности"}],"open":["Род подвижного состава (полувагон/крытый) и размер отгрузочной партии — задание сбытового блока","Схемы размещения и крепления пакетов в вагоне (НТУ/МТУ) — разработка на стадии ОТР/РД"]},{"id":"emkost","title":"Расчёт потребной ёмкости склада (буфера)","kind":"calc","body":"ИСХОДНОЕ: производство 75 000 т/год; приёмка непрерывная 209,5 т/сут (84 пакета/сут); отгрузка дискретная (подача вагонов, накопление партий).\n\nШАГ 1. Суточный поток: 75 000 / 358 = 209,5 т/сут = 83,8 ≈ 84 пакета/сут (по 2,5 т).\n\nШАГ 2. Составляющие буфера:\n— накопление отгрузочной партии: маршрутная группа, например 20 полувагонов × 27 пакетов × 2,5 т = 1350 т (6,4 сут производства); одновременно начинается набор следующей партии;\n— страховой запас на неподачу вагонов/непогоду: 2–3 сут = 420–630 т;\n— технологический запас на подтверждение качества партии (химанализ проб): 1–2 сут = 210–420 т.\nДиапазон проверки — отраслевой норматив хранения ГП 7–15 сут: 7 × 209,5 = 1467 т (587 пакетов); 15 × 209,5 = 3143 т (1257 пакетов).\n\nШАГ 3. Принятая расчётная ёмкость: 3000 т = 1200 пакетов ≈ 14,3 сут производства — покрывает партию 1350 т в наборе + готовую партию в ожидании подачи + страховой и технологический запасы. Минимально допустимая ёмкость (только при ритмичной подаче вагонов, партии ≤700 т) — 1500 т (7 сут, 600 пакетов).\n\nШАГ 4. Пятно хранения: 1200 пакетов / 2 яруса = 600 позиций × (1,1 × 1,1 м с зазорами 100 мм) = 726 м² чистого пятна; с проездами и маневровыми полосами штабелёров (коэффициент использования площади 0,45) — ≈1600 м² зона хранения. Итого с зонами приёмки/упаковки/весовой/разбраковки (400–500 м²) и фронтами отгрузки — ориентировочно 2500–3000 м² (см. раздел «Компоновка»).\n\nВЫВОД: потребный буфер СГП — 1200 пакетов (3000 т, ≈14 сут); размер подтверждается заданием сбыта по партиям — при судовых партиях >3000 т ёмкость пересматривается в бóльшую сторону (резерв площади предусмотреть).","items":[{"label":"Приёмка","value":"209,5 т/сут = 84 пакета/сут (75 000 т / 358 сут / 2,5 т)","src":"расчёт БИ"},{"label":"Партия ж/д (пример)","value":"Полувагон 27 пакетов = 67,5 т; маршрут 20 вагонов = 1350 т = 6,4 сут производства","src":"расчёт БИ (г/п полувагона ~69–70 т)"},{"label":"Принятый буфер","value":"1200 пакетов = 3000 т ≈ 14,3 суток (диапазон проверки 7–15 сут = 1467–3143 т)","src":"расчёт БИ"},{"label":"Пятно хранения","value":"600 позиций × 1,21 м² = 726 м²; с проездами (К=0,45) ≈ 1600 м²","src":"расчёт БИ"}],"gost":[],"open":["Размер и периодичность отгрузочных партий (маршруты, судовые партии) — задание сбытового блока: финальная калибровка буфера","Ярусность 2 или 3 — после обследования несущей способности пола ЦЭМ (при 3 ярусах буфер на той же площади ×1,5)"]},{"id":"komponovka","title":"Компоновочные решения склада","kind":"graf","body":"Компоновка выполняется в существующем ЦЭМ (Приложение №6): многопролётный корпус, пролёты 24 м (крановые пролёты 22 м), шаг колонн вдоль здания 6 м, длина корпуса ≈180 м; компоновку по ТЗ вести с учётом сетки колонн 6/12 м с привязкой к осям и отметкам. Зона СГП — пролёт(ы), смежные с отделением электроэкстракции, с выходами на существующие ж/д пути (историческая зона склада готовой продукции на плане ФМ-59415).\n\nЗОНИРОВАНИЕ (по ходу продукта):\n1) Зона приёмки у передаточных ворот: конвейер приёмки от КСМ, весы платформенные, позиция разбраковки, сверловочный стенд проб — ≈200–250 м².\n2) Зона упаковки/маркировки: контроль увязки, этикетирование — ≈100–150 м².\n3) Зона хранения: адресные линии стоп 1,0×1,0 м, продольные линии по 2 пакета в глубину с зазорами 100 мм; рабочие проезды штабелёров 3,5–4,0 м (фронтальный погрузчик-штабелёр г/п 3,2–5 т с пакетом 1×1 м); магистральный проезд 4,5–6 м; ≈1600 м² на 1200 пакетов в 2 яруса. В пролёте 24 м рационально: два блока линий по ~9 м глубиной + два проезда по 3,5–4 м — длина зоны хранения ≈70–90 м по шагам колонн.\n4) Ж/д фронт: внутренний путь (существующий габарит проёма проверить по ГОСТ 9238-2013), фронт на 4–6 вагонов (60–90 м), мостовой кран с траверсой (вариант при полувагонах) — либо рампа для крытых вагонов; вагонные весы на пути (демаркированная весовая зона, спецфундамент по Прил. №5).\n5) Автофронт: 2 поста у ворот автоотгрузки, автомобильные весы на подъезде (вне здания или в тамбуре), пандусы и отбойники защиты весов (Прил. №5).\n6) Инфраструктура: зарядная комната штабелёров (Li-ion, зарядка 2–3 постов), помещение операторов/серверное АСУ-АИС, санузел/бытовые — по СП 44.13330 (уточнить состав).\n\nПОТОКИ: однонаправленное движение приёмка → хранение → отгрузка без пересечения встречных потоков штабелёров; пешеходные проходы отделены разметкой и ограждением (автоматическая работа техники — контроль доступа в зону, световая/звуковая сигнализация, сканеры безопасности штабелёров).\n\nВЫСОТЫ: стопы 2 яруса ≈1,0 м — ограничений по высоте зала нет (парапет ЦЭМ ≈ +17,8); мачта штабелёра при 2-ярусном штабелировании — до 3 м, габарит проёмов ворот ≥ 3,5 м (проверить существующие ворота, при необходимости — расширение проёмов). Отметки чистого пола, уклоны и ровность — по СП 29.13330 (классы ровности под автоматическую технику — уточнить по требованиям поставщика штабелёров).","items":[{"label":"Здание","value":"ЦЭМ: пролёты 24 м (крановые 22 м), шаг 6 м, длина ≈180 м; сетка компоновки 6/12 м","src":"ИД ч.2 разд. 4.2.2; Прил. №6; ТЗ п. 6.4"},{"label":"Зона хранения","value":"≈1600 м² (1200 пакетов, 2 яруса); проезды 3,5–4 м; блоки линий по ~9 м","src":"расчёт БИ"},{"label":"Общая площадь СГП","value":"≈2500–3000 м² с зонами приёмки, упаковки, фронтов","src":"расчёт БИ"},{"label":"Ж/д фронт","value":"4–6 вагонов (60–90 м); габарит проёма — по ГОСТ 9238-2013","src":"решение БИ"}],"gost":[{"doc":"ГОСТ 9238-2013","what":"Габариты приближения строений — проём ж/д ворот и внутренний путь"},{"doc":"СП 37.13330 (актуальная редакция)","what":"Промышленный транспорт — внутренние ж/д пути и фронты погрузки"},{"doc":"СП 29.13330.2011","what":"Полы — ровность и износостойкость под автоматические штабелёры"},{"doc":"СП 57.13330.2011","what":"Складские здания"},{"doc":"123-ФЗ и СП 12.13130","what":"Категорирование помещений по пожарной опасности (медь негорюча — ожидаемо категория Д, подтвердить расчётом)"}],"open":["Обмерное обследование зоны СГП в ЦЭМ (состояние пути, ворот, пола, колонн) — первый этап БИ","Наличие/модернизация мостового крана в пролёте СГП для полувагонов — по роду подвижного состава","Класс ровности пола под выбранную модель штабелёра — по ТКП"]},{"id":"poly","title":"Нагрузки на полы и строительные конструкции","kind":"calc","body":"РАСПРЕДЕЛЁННАЯ НАГРУЗКА ОТ СТОП. Пакет 2500 кг на пятне 1,0 × 1,0 м: p₁ = m·g/A = 2500 × 9,81 / 1,0 = 24,5 кПа. Стопа 2 яруса: p₂ = 2 × 24,5 = 49,1 кПа (≈5,0 тс/м²); 3 яруса: 73,6 кПа. Нормативная полезная нагрузка зоны хранения принимается по фактической схеме складирования (СП 20.13330.2016): для 2 ярусов — 50 кПа нормативная, расчётная с γf = 1,2 → 58,9 кПа; для 3 ярусов — 73,6/88,3 кПа. Локальные давления под опорными рёбрами профилированных листов выше средних — проверяются по фактической опорной площади (данные КСМ, интерфейс Лот №3).\n\nНАГРУЗКИ ОТ ШТАБЕЛЁРА. Фронтальный погрузчик-штабелёр г/п 5 т с пакетом: полная масса ориентировочно 8–11 т, до 80 % на переднюю ось при поднятом грузе → колесо ≈ 3,5–4,5 тс на малом пятне контакта (суперэластик) — расчёт плиты пола на сосредоточенную нагрузку по СП 29.13330 определяет армирование/толщину наравне со штабельной нагрузкой; точные осевые нагрузки — по ТКП выбранной модели.\n\nКОНСТРУКЦИЯ ПОЛА: существующий пол ЦЭМ подлежит обследованию; при дефиците несущей способности — устройство новой монолитной ж/б плиты по грунту с упрочнённым верхним слоем (топпинг), швы под колею штабелёров, ровность по классу требований поставщика техники. Разметка адресных линий — износостойкая, машиночитаемая (контрастные полосы/метки для систем позиционирования).\n\nВЕСОВЫЕ ЗОНЫ: фундаменты платформенных, вагонных и автомобильных весов — специальные, демаркированные, с защитой от наездов, пандусами и ограждением (Прил. №5: «выполняются специальные работы по фундаментам, защитным ограждениям, пандусам»). Вагонные весы — собственный фундамент на пути, изолированный от плиты пола.\n\nПРОЧЕЕ: нагрузки от кранового варианта ж/д погрузки — проверка существующих подкрановых путей ЦЭМ (кран с траверсой, грузоподъёмность ≥ 3,2 т с учётом траверсы — фактическая Q крана по обследованию); климатические нагрузки на существующее здание не меняются; новые наружные элементы (навес автофронта) — снег V района 3,2 кПа, ветер II района 0,30 кПа, сейсмика 6 баллов.","items":[{"label":"Нагрузка от стоп","value":"24,5 кПа/ярус; 2 яруса — 49,1 кПа (расч. 58,9); 3 яруса — 73,6 кПа (расч. 88,3)","src":"расчёт БИ; СП 20.13330"},{"label":"Штабелёр","value":"Колесо ≈3,5–4,5 тс — расчёт плиты на сосредоточенную нагрузку","src":"оценка БИ (уточнить по ТКП)"},{"label":"Пол","value":"Обследование существующего; при дефиците — новая плита по грунту с топпингом","src":"решение БИ"},{"label":"Весовые зоны","value":"Отдельные фундаменты, демаркация, защита от наездов","src":"Прил. №5"}],"gost":[{"doc":"СП 20.13330.2016","what":"Нагрузки и воздействия — полезные нагрузки складирования, коэффициенты надёжности"},{"doc":"СП 29.13330.2011","what":"Полы — расчёт на сосредоточенные и распределённые нагрузки, ровность"},{"doc":"СП 63.13330 (актуальная редакция)","what":"Бетонные и железобетонные конструкции — новая плита пола"}],"open":["Несущая способность существующего пола и подкрановых конструкций ЦЭМ — обследование (первый этап БИ)","Фактические колёсные нагрузки и пятно контакта штабелёра — по ТКП","Опорная площадь профилированных листов пакета — данные поставщика КСМ"]},{"id":"asu","title":"АСУ склада: адресное хранение, партии, роботизированные операции","kind":"pz","body":"По ТЗ п. 6.4 АСУ СГП управляет роботами, набором партий, разбраковкой, автоматическим взвешиванием, отбором части катодов на сверловку; в программе заложен алгоритм размещения стоп катодов по территории склада автопогрузчиками-штабелёрами по размеченным линиям с памятью «что и где стоит» для последующей отгрузки потребителю.\n\nАЛГОРИТМ АДРЕСНОГО ХРАНЕНИЯ (ядро ППО):\n— Модель склада: адрес = линия (ряд) × позиция × ярус; статусы позиции (свободна/занята/зарезервирована/блокирована); атрибуты пакета (№, масса, партия, плавка, дата, статус анализа, тип отгрузки).\n— Назначение адреса: правило партийной консолидации (пакеты одной партии — смежные линии), FIFO внутри направления отгрузки, минимизация пробега штабелёра, резервирование буфера у фронтов под готовые партии; перестановки (рекомпоновка) — в окна низкой загрузки.\n— Память состояния: транзакционная БД со 100 % журналированием перемещений; восстановление карты склада после сбоя без инвентаризации (требование устойчивости ПО — Прил. №5); контрольная инвентаризация сканированием.\n— Диспетчеризация штабелёров: задания на терминалы (Wi-Fi IEEE 802.11), подтверждение сканированием этикетки на взятии/постановке; контроль позиционирования по размеченным линиям (машиночитаемая разметка/метки; технология навигации — лазерная/контурная — по ТКП поставщика системы).\n— Набор партии: план отгрузки → резервирование пакетов → маршрут комплектации → контрольное взвешивание → отгрузочная ведомость; блокировка отгрузки партии до подтверждения химанализа (интеграция со сверловкой и ЛИМС/PIMS).\n— Разбраковка: пакеты вне допуска массы/повреждённые — отдельная зона, задания на переобработку.\n\nТЕХНИЧЕСКАЯ РЕАЛИЗАЦИЯ (Прил. №5): трёхуровневая структура — датчики и приводы конвейера/весов; ПЛК REGUL RX00 (Прософт-Системы)/АБАК (Инкомсистем); верхний уровень — SCADA AlphaScada (Атомик Софт, Linux) + серверы WMS-приложения с горячим резервированием; сеть Industrial Ethernet TCP/IP; интеграции: ИС КСМ (Лот №3 — приём атрибутов пакета, график выгрузки), АИС весоизмерения (см. отдельный раздел), ХТД PIMS, СКУД (идентификация персонала), корпоративные ИС — стандартизированным методом. ИБП ≥10 мин с байпасом и SNMP; шкафы IP65 вне технологических зон; запас каналов ≥30 %; ППО — исходные коды с исключительными правами Заказчика; ЗИП на 2 года (≥10 %, ≥1 шт. каждого наименования).\n\nБЕЗОПАСНОСТЬ АВТОМАТИЧЕСКОЙ ЗОНЫ: контроль периметра (ограждение, калитки с блокировкой в СКУД), сканеры безопасности на штабелёрах, аварийные остановы по зонам, ПГС-оповещение (по требованиям Прил. №5 к системам ПГС).","items":[{"label":"Функции АСУ по ТЗ","value":"Роботы, набор партий, разбраковка, автоматическое взвешивание, отбор на сверловку, алгоритм размещения стоп с памятью","src":"ТЗ п. 6.4"},{"label":"Платформа","value":"REGUL RX00/АБАК + AlphaScada (Linux) + WMS-ППО; Industrial Ethernet TCP/IP","src":"Прил. №5"},{"label":"Интеграции","value":"ИС КСМ (Лот №3), АИС весоизмерения, ХТД PIMS, СКУД, единая диспетчерская","src":"Прил. №5; ТЗ п. 2.10, 5.3"},{"label":"ППО","value":"Исходные коды, исключительные права, бессрочные лицензии, методика восстановления","src":"Прил. №5"}],"gost":[{"doc":"ГОСТ 21.408-2013","what":"Рабочая документация автоматизации"},{"doc":"М ГК НН IT.1.8-2025; СТО 51246464-016-2015","what":"Корпоративные методики документирования АСУ (по Прил. №5)"},{"doc":"ГОСТ 12.2.007.0-75","what":"Электробезопасность электротехнических изделий (зарядная, техника)"}],"open":["Технология позиционирования штабелёров (лазерная навигация/индуктивные метки/RTLS) — по ТКП; согласовать с Заказчиком","Степень автономности штабелёров (AGV-исполнение против водительского с терминалом) — ТЭО в составе БИ","Форматы обмена с ИС КСМ (Лот №3) — межлотовый интерфейсный протокол"]},{"id":"ais","title":"АИС весоизмерения (по Приложению №5)","kind":"pz","body":"Автоматизированная информационная система весоизмерения СГП строится по разделу «Требования к автоматизированным системам весоизмерения материалов и/или транспорта» Приложения №5.\n\nТОЧКИ ВЗВЕШИВАНИЯ: (1) платформенные конвейерные весы приёмки — каждый пакет (НПВ 3 т, допусковый контроль 2500 ± 50 кг); (2) контрольные весы комплектации партии; (3) вагонные весы на внутреннем пути (статические либо для взвешивания в движении — тип по схеме учёта); (4) автомобильные весы на выезде. Всё весовое оборудование — класса точности «высокий», с открытыми программными компонентами для автоматической передачи данных; в поставке — калибровочные (поверочные) грузы соответствующего класса и ЗИП на 2 года.\n\nФУНКЦИИ АИС: идентификация оператора в каждой точке взвешивания по личному пропуску (СКУД; резерв — учётная запись); получение из систем КГМК информации для учёта; печать результатов (маркировка объекта и сопроводительный документ; два типа принтеров — термопринтер типа Zebra и лазерный); «безадресные» взвешивания по QR-коду с сохранением в центральной БД; передача «безадресных» результатов по REST (форматы сообщений уточняются на этапе реализации); получение результатов с весовых терминалов, дополнение атрибутами и передача в ХТД PIMS; работа круглосуточно, автономность и накопление данных при потере связи с PIMS.\n\nИНФРАСТРУКТУРА: связь по Industrial Ethernet (IEEE 802.3/802.11, TCP/IP); в каждой точке — преобразование и передача по оптоволокну либо витой паре, резервирование GSM-модулями; каждый шкаф — с точкой доступа Wi-Fi; линии связи до серверов сбора ХТД PIMS — в объёме проекта, точка подключения — активное сетевое оборудование в помещении серверов PIMS (согласуется с Заказчиком). Электропитание 220 В от АВР с ИБП двойного преобразования ≥20 мин, байпас, SNMP-платы; шкафы IP65 (в техзонах) / IP55 (в помещениях), на цоколе, вандалозащищённые; срок службы ≥10 лет.\n\nМЕТРОЛОГИЯ: соответствие ФЗ-102 «Об обеспечении единства измерений», ГОСТ Р 8.596-2002, ГОСТ 8.417-2024; все СИ — из Госреестра СИ РФ, с паспортами, методиками поверки и первичной поверкой (непроверенные СИ в поставку не допускаются); коммерческий учёт отгрузки — в сфере государственного регулирования ОЕИ. Установочные чертежи — на каждое СИ.","items":[{"label":"Точки взвешивания","value":"Пакетные весы приёмки (НПВ 3 т), контрольные, вагонные, автомобильные — класс «высокий»","src":"Прил. №5; решение БИ"},{"label":"Идентификация","value":"Личный пропуск через СКУД; резерв — логин/пароль","src":"Прил. №5"},{"label":"Передача данных","value":"REST («безадресные» по QR), весовые терминалы → атрибуты → ХТД PIMS; автономность при потере связи","src":"Прил. №5"},{"label":"Питание/исполнение","value":"АВР + ИБП ≥20 мин, SNMP, шкафы IP65/IP55 на цоколе, Wi-Fi точка в каждом шкафу, GSM-резерв","src":"Прил. №5"},{"label":"Комплект","value":"Поверочные грузы и ЗИП на 2 года — в поставке","src":"Прил. №5"}],"gost":[{"doc":"ФЗ-102 от 26.06.2008","what":"Обеспечение единства измерений; коммерческий учёт — сфера госрегулирования"},{"doc":"ГОСТ Р 8.596-2002","what":"Метрологическое обеспечение измерительных систем"},{"doc":"ГОСТ 8.417-2024","what":"Единицы величин"},{"doc":"ГОСТ OIML R 76-1-2011","what":"Весы неавтоматического действия — класс точности «высокий» (II) для платформенных весов"},{"doc":"ГОСТ Р 53228-2008","what":"Весы неавтоматического действия — метрологические и технические требования"},{"doc":"Стандарт на весы для взвешивания транспорта в движении","what":"Для вагонных весов в движении — уточнить номер действующего ГОСТ (взамен ГОСТ 30414-96)"}],"open":["Тип вагонных весов (статика/в движении) и НПВ — по схеме учёта и заданию сбыта","Форматы REST-сообщений и атрибутика PIMS — на этапе реализации (по Прил. №5)","Выбор конкретных моделей весов и терминалов — согласование с Заказчиком (унификация с площадкой)"]},{"id":"upakovka","title":"Требования к упаковке и маркировке под морскую транспортировку","kind":"pz","body":"Требования сформированы ИД п. 1.3.11 (требование сбытового блока) и увязаны с конструкцией пакета КСМ:\n\n1) Увязка: три металлические ленты из материала, устойчивого к коррозии в условиях длительной морской транспортировки и хранения под открытым небом (нержавеющая лента или лента с эквивалентной стойкостью; углеродистая оцинкованная — не допускается как теряющая товарный вид при морской перевозке); замки лент — того же класса стойкости.\n\n2) Исключение сертифицируемых материалов: хранение и транспортировка должны исключать материалы, требующие особой сертификации или утилизации — деревянные бруски исключены (фитосанитарная обработка по международным нормам не требуется, т.к. дерево не применяется); опора стоп — профилируемые в пределах КСМ катодные листы.\n\n3) Маркировка: на каждый пакет — две этикетки (боковые), содержание: производитель, марка М00к (Cu-CATH-1), № пакета, № партии/плавки, масса нетто/брутто, дата, штрих/QR-код для АИС; манипуляционные знаки и надписи — по ГОСТ 14192-96; требования регистрации бренда на ЛБМ (форма клейма/маркировки листов) — по контракту сбыта. Печать этикеток — стойкими к УФ и морской атмосфере материалами (термотрансфер).\n\n4) Защитная упаковка: базово пакеты не укрываются (катодная медь допускает открытое хранение); по требованию контракта — обвязка партии, угловые протекторы под ленты (полимер, не требующий сертификации), исключающие перетирание кромок листов; плёночная упаковка — только по заданию сбыта (утилизируемые материалы согласовать).\n\n5) Совместимость с логистикой: конфигурация «перфорации» (профилирования) нижних листов обеспечивает работу вилочных захватов и крановых траверс на всей цепочке (СГП → вагон → порт → судно) — интерфейсный документ с поставщиком КСМ (Лот №3) обязателен в составе БИ; допустимая высота штабелирования пакетов при перевозке и в порту — подтвердить прочностью нижнего пакета (испытания при освоении).","items":[{"label":"Увязка","value":"3 коррозионностойкие металлические ленты + стойкие замки","src":"ИД п. 1.3.11; ТЗ п. 5.3"},{"label":"Без дерева","value":"Опора — профилированные катодные листы; материалы особой сертификации/утилизации исключены","src":"ИД п. 1.3.11"},{"label":"Маркировка","value":"Этикетки с QR (2 шт./пакет), знаки по ГОСТ 14192-96, данные партии и массы из АИС","src":"решение БИ; Прил. №5"},{"label":"Условия","value":"Длительная морская транспортировка и хранение под открытым небом","src":"ИД п. 1.3.11"}],"gost":[{"doc":"ГОСТ 14192-96","what":"Маркировка грузов — манипуляционные знаки, транспортная маркировка"},{"doc":"ГОСТ 21650-76","what":"Средства скрепления тарно-штучных грузов в транспортных пакетах — применимость к лентам увязки (проверить актуальность)"},{"doc":"ГОСТ 24597-81","what":"Пакеты тарно-штучных грузов — основные параметры (справочно для габаритов пакета)"}],"open":["Спецификация ленты (марка стали, сечение, усилие натяжения) — по ТКП поставщика КСМ/обвязочного оборудования","Требования конкретного контракта сбыта (клеймение листов, форма этикетки ЛБМ) — от сбытового блока"]},{"id":"pfd","title":"Принципиальная технологическая схема (PFD)","kind":"graf","body":"Для Лота №4 по ТЗ выполняется PFD с указанием границ проектирования (схемы P&ID для СГП ТЗ не требует). Состав PFD:\n\nПОТОК ПРОДУКЦИИ: выходной конвейер КСМ → передаточные ворота (граница) → конвейер приёмки → весы поштучного взвешивания (класс «высокий») → позиция разбраковки/сверловки проб → узел контроля увязки и маркировки → позиция выдачи на штабелёр → зона адресного хранения (1200 пакетов, 2 яруса) → комплектация партии → фронт ж/д (кран-траверса или штабелёр; вагонные весы) / фронт авто (штабелёр; автомобильные весы) → ворота отгрузки (граница).\n\nИНФОРМАЦИОННЫЕ ПОТОКИ (наносятся на PFD пунктиром): ИС КСМ → АСУ СГП (атрибуты пакета); АСУ СГП ↔ АИС весоизмерения ↔ ХТД PIMS; АСУ СГП → единая диспетчерская; СКУД → АИС (идентификация).\n\nЭНЕРГОПОТОКИ: электроэнергия 0,4 кВ (конвейер, весы, зарядная станция штабелёров, маркировка), сжатый воздух (обвязка/маркировка — при необходимости по выбранному оборудованию), без технологического пара и воды.\n\nНа схеме указываются: производительности (3,5–7 пакетов/ч приёмка; 84 пакета/сут отгрузка), ёмкость хранения (1200 пакетов / 3000 т), режимы (приёмка 358 сут, отгрузка по графику подачи).","items":[{"label":"Границы на PFD","value":"Передаточные ворота (вход); ворота ж/д и авто отгрузки (выход)","src":"ТЗ п. 6.2"},{"label":"P&ID","value":"Не требуется по ТЗ для Лота №4 (только PFD и схема КТС АСУ)","src":"ТЗ п. 6.4"}],"gost":[],"open":[]},{"id":"oborud","title":"Перечень основного и вспомогательного оборудования","kind":"pz","body":"Состав по ТЗ п. 6.3 с раскрытием до позиций:\n\n1) Конвейер приёмки пакетов (интерфейс с пакеторазгрузочным конвейером КСМ) — цепной/роликовый, 7 пакетов/ч, тяжёлая серия (2,55 т), с позициями взвешивания и разбраковки.\n2) Весовое оборудование: платформенные конвейерные весы НПВ 3 т (2 шт. — приёмка и контроль комплектации), вагонные весы, автомобильные весы — класс точности «высокий», с поверочными грузами и ЗИП (Прил. №5).\n3) Стенд сверловки проб катодов с автоматизированным отбором (по заданию АСУ) и возвратом листов.\n4) Оборудование защитной упаковки и маркировки: узел контроля/дотяжки увязки (3 ленты), аппликатор/принтеры этикеток (термо Zebra + лазерный).\n5) Автопогрузчики-штабелёры г/п 3,2–5 т — 3 шт. (2 рабочих + 1 резервный; расчёт: 84 приёмка + 84 отгрузка + ~30 % внутренних перемещений ≈ 220 циклов/сут × 4 мин / КИО 0,8 ≈ 18 ч машинного времени/сут), электрические (Li-ion), с терминалами Wi-Fi, сканерами и системой позиционирования; зарядная станция 2–3 поста.\n6) Оборудование ж/д погрузки: вариант А — мостовой кран с автоматической траверсой (захват за профилированные листы) для полувагонов (использование существующего крана ЦЭМ после модернизации — приоритет, ИД разд. 4.2.2); вариант Б — погрузка штабелёрами в крытые вагоны через дверной проём с рампой.\n7) Оборудование автоотгрузки: пост погрузки, направляющие/отбойники, автомобильные весы на выезде.\n8) АСУ/АИС: ПЛК, серверы WMS (гор. резервирование), АРМ оператора, сеть, СПТ (видеонаблюдение зоны — по требованиям Прил. №5 к СПТ: SCADA «Интеллект», глубина архива ≥1,5 мес), ПГС-оповещение.\n9) Ограждение автоматической зоны, калитки СКУД, светозвуковая сигнализация.\n\nОпросные листы — на весовое оборудование, штабелёры/систему позиционирования, кран-траверсу, конвейер, сверловочный стенд, упаковочно-маркировочное оборудование. Требования к монтажу: самые тяжёлые единицы — мостовой кран (при новом исполнении) и вагонные весы; монтаж в действующем здании с сохранением работы смежных пролётов ЦЭМ.","items":[{"label":"Штабелёры","value":"3 шт. (2+1) г/п 3,2–5 т, электрические, с позиционированием; ≈220 циклов/сут","src":"расчёт БИ"},{"label":"Весы","value":"Платформенные НПВ 3 т (2), вагонные, автомобильные — класс «высокий»","src":"Прил. №5; решение БИ"},{"label":"Ж/д погрузка","value":"Кран с траверсой (полувагоны) / штабелёры (крытые вагоны) — оба варианта в БИ","src":"решение БИ; ИД разд. 4.2.2"},{"label":"Статус позиций","value":"Всё оборудование — закуп по ТКП; нестандарт — траверса и конвейер приёмки (задания на изготовление)","src":"оценка БИ"}],"gost":[{"doc":"ФНП по ПС (приказ Ростехнадзора от 26.11.2020 № 461)","what":"Мостовой кран и съёмные грузозахватные приспособления (траверса) — проектирование, освидетельствование"},{"doc":"ТР ТС 010/2011","what":"Безопасность машин и оборудования — штабелёры, конвейеры"},{"doc":"ГОСТ 12.3.020-80","what":"Процессы перемещения грузов на предприятиях — общие требования безопасности"}],"open":["Грузоподъёмность и состояние существующего крана ЦЭМ в пролёте СГП — обследование","Модели штабелёров и системы навигации — по ТКП (2–3 поставщика)","Конструкция траверсы — после фиксации профиля «перфорации» пакета (интерфейс Лот №3)"]},{"id":"energo","title":"Данные о расходах материалов и энергоресурсов; подключения","kind":"pz","body":"Технологические среды: пар и производственная вода для СГП не требуются; водоснабжение — только хозбытовое (бытовые помещения персонала контроля), водоотведение — бытовое.\n\nЭЛЕКТРОЭНЕРГИЯ (0,4 кВ, сведения по Приложению №3): потребители — конвейер приёмки, весовое оборудование, упаковка/маркировка, зарядная станция штабелёров (2–3 поста × 10–20 кВт), АСУ/АИС/СПТ с ИБП, освещение зоны (норма освещённости складской зоны с автоматической техникой и весовых — по СП 52.13330), электрообогрев весовых приямков. Установленная мощность — оценочно 100–200 кВт, уточняется по ТКП; категория надёжности: АСУ/АИС — I (ИБП), прочее — II/III по Прил. №3. Однолинейные схемы, спецификации электрооборудования и ОЛ — в составе БИ (объём по согласованным границам).\n\nСЖАТЫЙ ВОЗДУХ: только при пневмоинструменте обвязки/аппликаторах — локальный компрессор в комплекте оборудования (магистральный воздух не заводится; уточняется комплектацией).\n\nМИКРОКЛИМАТ: катодная медь допускает открытое хранение, однако для стабильной работы весов (температурный дрейф), АКБ штабелёров и персонала зона СГП — отапливаемая до +5…+10 °C (дежурное отопление); весовые и операторские помещения — +18 °C. Вентиляция — общеобменная; выбросов и вредностей технологический процесс не создаёт (категория помещений по пожарной опасности — ожидаемо Д, подтверждается расчётом).\n\nРАСХОДНЫЕ МАТЕРИАЛЫ: лента увязочная коррозионностойкая (дотяжка/замена — норматив по факту освоения), этикетки и риббоны, зарядная инфраструктура АКБ. Нормы расхода упаковочных материалов ИД (табл. 8.5 — «материалы на упаковку по действовавшему аналогу») пересматриваются под новую конфигурацию пакета — определяется поставщиком КСМ (ИД п. 1.3.11).","items":[{"label":"Электроэнергия","value":"Оценочно 100–200 кВт установленной; зарядная 2–3 × 10–20 кВт; АСУ/АИС — I категория","src":"оценка БИ; Прил. №3, №5"},{"label":"Пар/вода","value":"Технологически не требуются; хозбытовые — минимально","src":"решение БИ"},{"label":"Микроклимат","value":"Дежурное отопление +5…+10 °C; весовые/операторские +18 °C","src":"решение БИ"}],"gost":[{"doc":"Приложение №3 к ТЗ","what":"Сведения по электрооборудованию, однолинейные схемы, ОЛ"},{"doc":"СП 52.13330 (актуальная редакция)","what":"Естественное и искусственное освещение — нормы для зон автоматической техники и весовых"},{"doc":"ПУЭ (изд. 7)","what":"Электроустановки зарядной станции АКБ (выделение водорода при заряде — вентиляция зарядной)"}],"open":["ТУ на подключение электроэнергии — при БИ/ОТР","Точная установленная мощность — по спецификации после ТКП"]},{"id":"postavka","title":"Стоимость поставки по Лоту №4 (порядок формирования)","kind":"pz","body":"В составе БИ приводится: (1) стоимость оборудования по данным ТКП потенциальных поставщиков — не менее 2–3 на каждую позицию (весовое оборудование, штабелёры с системой позиционирования, конвейер приёмки, кран-траверса, упаковка/маркировка, АСУ/АИС); (2) оценка общей стоимости комплектной поставки технологического оборудования в границах п. 6.2 ТЗ.\n\nРекомендуемая пакетность запросов: пакет «интралогистика» (штабелёры + навигация + WMS-ППО) — у одного интегратора с ответственностью за сквозной алгоритм адресного хранения; пакет «весовое хозяйство + АИС» — у поставщика, унифицированного с площадкой КГМК (требование Прил. №5 об унификации и согласовании выбора); пакет «ж/д погрузка» (кран/траверса/вагонные весы). В ТКП включить гарантии производительности (7 пакетов/ч приёмка, 84 пакета/сут отгрузка), точности учёта (класс «высокий») и доступности системы (KPI автоматического режима).\n\nСтоимостные данные не приводятся до получения ТКП.","items":[{"label":"Требование ТЗ","value":"≥2–3 ТКП на позицию; оценка комплектной поставки в границах п. 6.2","src":"ТЗ, раздел «Стоимость поставки по Лоту №4»"}],"gost":[],"open":["Разделение объёмов «оборудование Лота №4» / «строительная часть» (полы, ворота, пути) — согласовать с Заказчиком: строительная часть в стоимость лота по ТЗ не входит","Перечень поставщиков интралогистики РФ с опытом металлургических складов — проработка на этапе запросов"]}]}].filter(Boolean);
const COMP = {"updated":"2026-08-13","subject":"ДЕЛЬТА Инжиниринг","summary":"ООО «Дельта Инжиниринг и Консалтинг» (ИНН 9710105935, зарегистрировано 15.11.2022) — фактический преемник российской команды Hatch. Компания сама заявляет: «Опыт и компетенции наших экспертов были накоплены в ООО „Хэтч Инжиниринг и Консалтинг“ в составе крупнейшей международной инжиниринговой компании „Хэтч“ за более чем 20 лет работы» (Хэтч ИК работал в РФ с 2007 г.). Адреса совпадают с бывшими офисами Хэтч вплоть до помещения: СПб, пр. Энергетиков 4к1 стр.1, помещ. 47Н, эт. 13 и Москва, Никольская 10. Hatch Ltd (Канада, ~10 000 сотрудников) официально ушла из РФ («clean break», заявление 06.09.2023: офис СПб закрыт навсегда, в стране остался 1 сотрудник). Юридического правопреемства нет — Дельта учреждена двумя физлицами (Сирач А.Н. и Елькин И.Б. по 50%), связь ограничивается командой, офисами и наследием компетенций. Заявляют 120+ сотрудников и 500+ проектов; клиенты — Норникель, Еврохим, Полюс, Удоканская медь и др.\n\nКритический факт подтверждён по тендерным ИД: конструкция электролизных ванн Лота №3 — разработка Дельты. В НТП ч.2 (дог. 001-1146н) её документ вшит целиком как Приложение В («ДЕЛЬТА Инжиниринг и Консалтинг. Исходные требования на изготовление и поставку оборудования. Ванны электролизные», шифр D202415-PM032-240-242-0001, ред. 1 от 14.04.2025, статус «Рассмотрение Заказчиком»). Раздел 4.2.2 прямо фиксирует: «Основные характеристики электролизных ванн, приняты по данным проекта ДЕЛЬТА (приложение В) и согласованы с Заказчиком», а раздел 3: «Габариты и конструкция элементов ванны по проекту Дельта, приложение В». Всего 4 текстовых упоминания плюс само приложение. Более того, документ Дельты составлен «в рамках выполнения работ по договору АО „Кольская ГМК“… производительностью 50 000 т катодной меди в год» — то есть Дельта уже имеет собственный контракт с КГМК по этому же комплексу ОВЭ (на её сайте проект значится как «2019–2025», включая ТЭП участка электроэкстракции и гидродинамическое моделирование печи КС). ИД на 75 тыс. т масштабируют её же ванну со 140 шт. (4 ряда × 35) до 180 шт. (2 серии × 90).\n\nЧто это значит (оценка): по позиции «ванны» Лота №3 у Дельты решающая фора — конструкция её, согласована Заказчиком, сайт компании заявляет патенты на ванны электроэкстракции, и у неё на руках весь остальной комплект проекта D202415 (схемы, 3D, расчёты), которого нет у других участников. Но Лот №3 существенно шире ванн: по ТЗ в него входят КСМ, спецкраны с позиционированием, ошиновка, аспирационные укрытия, аноды/матрицы, АСУ и компоновка в существующем здании ЦЭМ — здесь поле ровное. Формальный конфликт интересов (автор части ИД участвует в конкурсе по этим ИД) существует, но Заказчик сам вложил документ Дельты в ИД и «согласовал» характеристики — атаковать это в лоб рискованно; рабочий ход — письменно требовать равного информационного пакета для всех участников.\n\nГде выигрывать (оценка): Лоты №1 (цех обжига + фильтрация), №2 (купоросный участок) и №4 (склад ГП) — там встроенного преимущества у Дельты нет, а её публичный портфель последних лет смещён в ГОКи/золото/железо. По Лоту №3 — принять геометрию ванн как заданную спецификацию, дать 2–3 независимых ТКП на изготовление ванн по этой геометрии и отстроиться исполнением: роботизация КСМ, краны, АСУ, компоновка, цена. Их уязвимости: молодое юрлицо (УК 100 тыс. руб.), маржа около нуля (~0,2 млн руб. прибыли при ~865 млн руб. выручки по карточке РБК), разрыв с глобальной Hatch — референсы Hatch формально им не принадлежат.","in_tender":[{"quote":"Конструкция печи КС, применяемой для обжига шихты на основе медного концентрата ОРФ, спроектирована специалистами инжиниринг-консалтинговой компанией HATCH, имеющих большой опыт в разработке установок подобного рода для процесса обжига пиритных золотосодержащих концентратов в Австралии и Южной Африке, медных, медно-кобальтовых и медно-никелевых руд в Замбии и Канаде, свинцово-цинковых концентратов в Казахстане и т.д.","where":"ИД часть 1 (пирометаллургия), раздел 2.3 «Обжиг шихты в печи КС»","meaning":"Ключевой агрегат Лота №1 — печь КС — тоже разработка Hatch, чья российская команда сегодня работает в Дельте. Преимущество конкурента распространяется не только на Лот №3, как считалось изначально, но и на Лот №1."},{"quote":"Печь круглая в поперечном сечении, имеет конусное расширение по всей высоте, начиная от подины. Загрузка печи осуществляется шнековым забрасывателем. Имеет несекционированную газовую коробку. Печь разработана компанией HATCH.","where":"ИД часть 1, таблица 23, строка 212 «Используемое оборудование»","meaning":"Конструктив печи зафиксирован в обязательных исходных данных как решение Hatch: круглое сечение, конусное расширение по всей высоте, несекционированная газовая коробка, шнековый забрасыватель. Проектировать придётся под этот конструктив."},{"quote":"Согласно рекомендациям специалистов компании HATH International, утвержденным рабочей группой проекта ОВЭ 150 и приведенным в итоговом отчете OVE-D-HATCH-PM-REP-00003-R, 336 час/год приходится на плановые простои, а остальные 510 час/год на внеплановые простои.","where":"ИД часть 1, раздел по фонду рабочего времени","meaning":"Даже расчётный фонд рабочего времени комплекса — 7920 часов — опирается на отчёт Hatch, утверждённый рабочей группой проекта. Их методология заложена в базовые допущения проекта."},{"quote":"Приложение В. ДЕЛЬТА Инжиниринг и Консалтинг. Исходные требования на изготовление и поставку оборудования. Ванны электролизные.","where":"НТП ч.2 (дог. 001-1146н), оглавление (стр. 113) и заголовок Приложения В","meaning":"Документ конкурента вшит в тендерные ИД целиком как отдельное приложение: исходные требования на ванны для Лота №3 написаны Дельтой."},{"quote":"Электролиз в ящичных ваннах с нерастворимыми анодами и колпаками с индивидуальной торцевой аспирацией. Катодов 84 шт., анодов 85 шт. Габариты и конструкция элементов ванны по проекту Дельта, приложение В.","where":"НТП ч.2, раздел 3 «Технологические параметры», блок «Электроэкстракция меди»","meaning":"Геометрия и конструкция всех элементов ванны заданы «по проекту Дельта» — участники обязаны проектировать вокруг чужого решения (внутр. габариты 8485×1155×1650 мм, 84 катода/85 анодов, 280 А/м2)."},{"quote":"Рекомендации по выбору основного оборудования электролизного отделения приведены в таблице 4.2. Основные характеристики электролизных ванн, приняты по данным проекта ДЕЛЬТА (приложение В) и согласованы с Заказчиком.","where":"НТП ч.2, раздел 4.2.2, преамбула к таблице 4.2","meaning":"Ключевая формула: характеристики ванн не просто рекомендованы — они «согласованы с Заказчиком», т.е. для КГМК это уже принятое решение, менять его в оферте бессмысленно."},{"quote":"ИСХОДНЫЕ ТРЕБОВАНИЯ D202415-PM032-240-242-0001 на изготовление и поставку оборудования. Ванны электролизные. … 14.04.2025 ¦ 1 ¦ Рассмотрение Заказчиком ¦ И. Шунькин ¦ С. Наумов ¦ С. Наумов","where":"Приложение В, титульный лист (шифр, ревизия, подписи)","meaning":"Свежий документ (ред. 1 от 14.04.2025) с шифром проекта Дельты D202415 и фамилиями исполнителей — работа Дельты по ваннам шла параллельно подготовке тендера; в списке источников также её «Аппаратурно-технологическая схема — Отделение электроэкстракции меди» (D202415-24000-210-282-0001)."},{"quote":"Исходные требования на изготовление и поставку ванн электролизных составлены в рамках выполнения работ по договору «АО «Кольская ГМК». Строительство комплекса «Обжиг – выщелачивание – электроэкстракция производительностью 50 000 т катодной меди в год».","where":"Приложение В, «Общая часть»","meaning":"У Дельты собственный действующий/выполненный договор с КГМК по этому же комплексу ОВЭ (в версии на 50 тыс. т). Она не «один из участников», а инжиниринговый партнёр Заказчика по предыдущей стадии того же проекта."},{"quote":"Электроэкстракция меди происходит в полимербетонных ваннах (4 ряда, 140 шт.)… Ванны расположены в четыре параллельных ряда по 35 ячеек в ряду. [против] Ванны группируются в две серии… общее количество ванн составит 180 шт. (две серии по 90 шт.).","where":"Приложение В (проект Дельты на 50 тыс. т) против раздела 4.2.2 НТП (75 тыс. т)","meaning":"ИД на 75 тыс. т масштабируют ванну Дельты со 140 до 180 шт. и меняют компоновку под существующий корпус ЦЭМ (2 серии × 90, шаг колонн 24 м) — сама ванна не пересматривалась, пересчитаны количество и размещение."}],"profile":[{"fact":"ООО «Дельта Инжиниринг и Консалтинг»: ИНН 9710105935, ОГРН 1227700758438, зарегистрировано 15.11.2022; юрадрес: Москва, ул. Никольская, д. 10; филиал: СПб, пр. Энергетиков, д. 4, к. 1, стр. 1, помещ. 47Н, эт. 13.","src":"https://companies.rbc.ru/id/1227700758438-obschestvo-s-ogranichennoj-otvetstvennostyu-delta-inzhiniring-i-konsalting/","checked":"2026-08-13","kind":"факт"},{"fact":"Учредители — Сирач Андрей Николаевич (50%) и Елькин Иван Борисович (50%); гендиректор по карточке РБК (обновл. 06.03.2025) — Коваленко Ирина Владимировна; по данным выдачи Rusprofile, с января 2026 гендиректор — Елькин И.Б. Уставный капитал 100 тыс. руб.","src":"https://companies.rbc.ru/id/1227700758438-obschestvo-s-ogranichennoj-otvetstvennostyu-delta-inzhiniring-i-konsalting/","checked":"2026-08-13","kind":"факт"},{"fact":"Финансы по карточке РБК (последний отчётный год в карточке, обновл. 03.2025): выручка 864,6 млн руб., чистая прибыль 0,213 млн руб., себестоимость 843,9 млн руб. — маржа около нуля.","src":"https://companies.rbc.ru/id/1227700758438-obschestvo-s-ogranichennoj-otvetstvennostyu-delta-inzhiniring-i-konsalting/","checked":"2026-08-13","kind":"факт"},{"fact":"Сайт компании: «независимая инжиниринговая и консалтинговая компания… для предприятий горно-металлургической отрасли»; 120+ сотрудников, 500+ проектов, 20+ лет опыта; офисы СПб и Москва; клиенты: Норильский Никель, МХК Еврохим, NORDGOLD, Удоканская медь, Полюс, Металлоинвест, Полиметалл, Руссдрагмет, Росатом.","src":"https://deltaeng.ru/","checked":"2026-08-13","kind":"факт"},{"fact":"Собственные разработки по сайту: «патенты на ванны электроэкстракции», матрицы со спецпокрытием для производства ронделей, разгрузочное устройство печи кипящего слоя. Номера патентов открытым поиском не верифицированы (в выдаче агрегаторов упоминаются патент на способ изготовления полимербетонной электролизной ванны и способ удаления шлама из электролизных ванн).","src":"https://deltaeng.ru/","checked":"2026-08-13","kind":"факт"},{"fact":"Проект на сайте Дельты: АО «Кольская ГМК», Мурманская обл., медь, 2019–2025 — «Технико-экономическое предложение на поставку оборудования для переработки медного концентрата отделения разделения файнштейна, включая оценку технологии и капитальных затрат, в том числе участка электроэкстракции»; выполнялось гидродинамическое моделирование печи КС. Т.е. компания в проекте ОВЭ с 2019 г.","src":"https://deltaeng.ru/projects/","checked":"2026-08-13","kind":"факт"},{"fact":"Второй проект для КГМК: «Диверсификация никелевого производства», Мончегорск, никель, 2021–2023 — схема производства катодного никеля гальванического качества.","src":"https://deltaeng.ru/projects/","checked":"2026-08-13","kind":"факт"},{"fact":"Портфель (31 проект на сайте) смещён в ГОКи/обогащение/золото (Полюс — Олимпиада, Благодатное, Наталка; Nordgold, Быстринское, Стойленский, Ковдорский, Михайловский ГОКи); по меди — КГМК ОВЭ, Ак-Суг (ПД обогатительного комплекса, 2018–2020), «Актогай Смелтер» (Казахстан, технология производства и электрорафинирования, 2017–2018). Реализованных «под ключ» электролизных цехов под брендом Дельта (после 2022) в открытых источниках не найдено.","src":"https://deltaeng.ru/projects/","checked":"2026-08-13","kind":"факт"},{"fact":"Адреса Дельты полностью совпадают с адресами ООО «Хэтч Инжиниринг и Консалтинг»: Москва, Никольская 10 (юрадрес обеих) и СПб, пр. Энергетиков 4к1 стр.1, помещ. 47Н, эт. 13 (филиалы обеих) — компания села в бывшие офисы Хэтч.","src":"https://sbis.ru/contragents/7702647722/771001001 и https://companies.rbc.ru/id/1227700758438-...","checked":"2026-08-13","
