const WORLD = {"honesty":"Технологические факты о самом проекте — из ТЗ и ИД. Внешние факты о мировых компаниях снабжены ссылками на первоисточник и датой проверки (13.08.2026). Где данных нет — стоит «не проверено», ничего не додумано.","tech_position":{"title":"Где ОВЭ-75 стоит на мировой карте технологий","text":"ОВЭ — это не гидрометаллургия «из руды» (heap leach → SX-EW), а переработка высокомедного сульфидного полупродукта (67 % Cu концентрат от разделения файнштейна) по маршруту «сульфатизирующий обжиг в КС → сернокислотное выщелачивание огарка → прямая электроэкстракция без SX». Отсутствие стадии жидкостной экстракции (SX) — принципиальная особенность: раствор после выщелачивания и контрольной фильтрации сразу идёт на электроэкстракцию, а очистка от Ni/Co/Fe вынесена в кристаллизацию купоросов. Это резко сужает круг мировых аналогов: типовые проекты SX-EW под этот случай не референс.","signature":["Сульфатизирующий обжиг в печи КС (не окислительный «мёртвый» обжиг и не плавка) — целевой продукт огарок с 0,051 % S и пыли с 2,4 % S","Дутьё, обогащённое кислородом (96 % O₂) — компенсация деградации теплотворной способности шихты","Прямая электроэкстракция из сульфатного раствора без SX, при 252,7 А/м² фактической плотности тока","Двухпоточная вакуумная кристаллизация купоросов как узел вывода никеля, кобальта и железа","Целевое качество катода — М00к, сумма примесей ≤0,0065 % — на уровне электрорафинирования, а не типового EW"]},"analogues":[{"name":"Sulphating roasting (Outotec / Metso) — базовая мировая школа процесса","who":"Metso (ранее Outotec / Outokumpu Technology)","fact":"Первый сульфатизирующий обжиговый агрегат Outotec построен в Замбии около 30 лет назад; линейка охватывает обжиг меди, золота, цинка, свинца, молибдена и пирита. Для концентратов с высоким содержанием меди и низким содержанием серы наиболее выгодным решением признан подогрев обжигового воздуха — то самое решение, что заложено во вспомогательный вариант ИД ОВЭ-75.","relevance":"Прямой ю КС","world":["GE Steam Power / Alstom","Bosch Industriekessel","Balcke-Dürr"],"note":"ИД помечает КУ как «перепроектируется» — есть существующее решение под переработку"},{"class":"Электрофильтры и рукавные фильтры","world":["FLSmidth Airtech","Balcke-Dürr","Thermax"],"note":"В ИД задан УГТ1-20-4 — отечественный типоразмер"},{"class":"Дымососы","world":["Howden","TLT-Turbo"],"note":"В ИД задан ДН-15БНЖ 400 кВт / 6 кВ — отечественный типоразмер"},{"class":"Барабанные вакуум-фильтры, фильтр-прессы, сгустители","world":["Metso (Larox)","Andritz Separation","Diemme Filtration","FLSmidth","McLanahan"],"note":"Позиция с реальным выбором и живым рынком ТКП"},{"class":"Пульсирующие центрифуги","world":["Siebtechnik Tema","Andritz Separation","Ferrum AG"],"note":"Обе позиции Лота №2 — фильтрующие центрифуги с пульсирующей выгрузкой"},{"class":"Выпарные аппараты и вакуумные кристаллизаторы","world":["GEA Messo","Veolia HPD","Swenson Technology"],"note":"Материал 904L / Hastelloy G-35 — определяющий фактор цены"},{"class":"Электролизные ванны, аноды, катодные матрицы","world":["CSI Mining SA (UNICELL®)","Glencore Technology (ISAKIDD)","Metso","RSR Anodes"],"note":"180 ванн, ~15 300 анодов и ~15 120 матриц первичной загрузки"},{"class":"КСМ и обработка катодов","world":["Metso","Glencore Technology (ISAKIDD)","Mesa International"],"note":"Один из двух узлов, где ТЗ требует машинного зрения и роботизации"},{"class":"Спецкраны электролизного зала","world":["Konecranes","Kranbau Köthen","Sicoma"],"note":"2 крана, нерж. 316L, ИК-контроль КЗ в ваннах, автоматическое позиционирование"},{"class":"Теплообменники пластинчатые","world":["Alfa Laval","SPX FLOW APV","Kelvion"],"note":"5000 кВт на электролизе + 1500 кВт на подогреве бедного электролита"}],"lessons":[{"title":"Без SX круг референсов резко сужается","text":"Большинство мировых EW-проектов последних 20 лет — SX-EW на растворах кучного/чанового выщелачивания оксидных руд. Здесь SX нет, раствор идёт напрямую, а роль очистки играет кристаллизация купоросов. При подборе аналогов и ТКП это надо проговаривать поставщику явно, иначе он посчитает не тот процесс."},{"title":"Материальное исполнение — главный ценообразующий фактор гидромета","text":"ИД прямо исключает 316L для горячих кислых концентрированных солевых растворов (каскад выщелачивания поз. 4.1.10–4.1.15, репульпатор 4.1.21, фильтры 4.1.20, теплообменник 4.1.17) и требует Hastelloy G-35 (Haynes Int.) или аналог; допускается 904L. Узлы выпарки и кристаллизации купороса — 904L. Разница в цене между 316L и G-35/904L кратная."},{"title":"Исключение измельчения огарка — принятый Заказчиком риск","text":"По требованию Заказчика из проекта убрано предварительное измельчение и классификация огарка. Крупность +0,4 мм в огарке около 27 %. Компенсация — два параллельных головных репульпатора малого объёма с максимальной удельной мощностью мешалок, коническим днищем и рециркуляцией пульпы (либо воздушный аэролифт), плюс дублирование головного репульпатора на период чистки гарнисажа. Формирование гарнисажа ИД не исключает."},{"title":"Пиковый коэффициент запаса как индикатор неопределённости","text":"В табл. 4.1/4.2 ИД есть позиции с коэффициентом запаса 3,0 и 5,3 (испарители II ступени) и 2,6 (головные репульпаторы). Это места, где расчёт ещё «плавает» и где Исполнитель БИ реально влияет на CAPEX, а не просто переписывает ИД."},{"title":"Запас производительности линии обжига — 15 %, а не резервная линия","text":"ТЗ требует одну технологическую линию обжига-газоочистки с запасом производительности не менее 15 % для обеспечения ППР без остановки всего комплекса. Это ключевое проектное ограничение: резервной печи нет, надёжность обеспечивается запасом по производительности и графиком ППР."}]};

 по времени пункт всего БИ. По Лоту №1 позиций около 25, по Лоту №3 — узлы с единичными мировыми поставщиками (КСМ, спецкраны, ошиновка). Собрать 2–3 сопоставимых ТКП по каждой — работа на месяцы, начинать надо до подписания договора.","action":"Начать сбор пула поставщиков и опросных листов немедленно — не дожидаясь итогов конкурса. Это же станет главным конкурентным преимуществом в заявке."},{"level":"Высокий","title":"Технологические гарантии на поставляемое оборудование","why":"Определение БИ в ТЗ прямо включает «последующее предоставление технологических гарантий на поставляемое оборудование». Это перенос технологического риска на Исполнителя БИ.","action":"Заранее определить, на какие показатели мы готовы давать гарантию, а какие завязаны на ИД Гипроникеля, и зафиксировать разграничение ответственности в предложении."},{"level":"Высокий","title":"Материальное исполнение гидромета: Hastelloy G-35 vs 904L vs 316L","why":"ИД исключает 316L для горячих кислых концентрированных солевых растворов и требует Hastelloy G-35 или аналог (допустимо 904L). Ошибка в материале на этапе ТКП даёт кратную ошибку в стоимости.","action":"Материал контактных частей вносить в опросный лист как обязательное поле; отклонённые по материалу ТКП не принимать к оценке."},{"level":"Средний","title":"Машинное обучение в контуре управления обжигом","why":"Прямое требование Заказчика по Лоту №1. Одновременно Приложение №5 требует, чтобы всё ПО промышленной автоматизации было разработано и произведено в РФ. Готового отечественного ML-решения под сульфатизирующий обжиг в КС на рынке нет.","action":"Проработать связку: Regul/АБАК (ПЛК) + Alpha.Scada (верхний уровень) + отдельный расчётный модуль advanced process control. Заявить как отдельную позицию с понятным исполнителем."},{"level":"Средний","title":"Размещение Лотов №2 и №3 в существующих зданиях","why":"Лот №3 — в существующем корпусе ЦЭМ (шаг колонн 24 000 мм, крановый пролёт 22 000 мм), Лот №2 — в существующем ГМУ. Приложения №6 (11 листов ФМ-59410…59419) и №7 (10 листов ФМ.01648) дают только архитектурные чертежи.","action":"Заложить в график обследование зданий: фактические отметки, состояние конструкций, нагрузки от существующих кранов, реальные габариты проходов под 180 ванн и КСМ."},{"level":"Средний","title":"Границы проектирования по Лотам №2–4 уточняются Исполнителем","why":"ТЗ прямо говорит: границы уточняются по предложению Исполнителя БИ с учётом объёмов поставки и согласовываются Заказчиком. Это и возможность (расширить объём), и ловушка (взять на себя лишнее без компенсации).","action":"Границы предлагать письменно и с обоснованием, фиксировать протоколом до начала расчётов."},{"level":"Средний","title":"Дублирование позиций между лотами и вне-БИ периметром","why":"По Лоту №3 из БИ исключены шины магистральные, выпрямители, напорный и сливной трубопроводы, аспирация ванн, циркуляционные насосы, грузоподъёмное оборудование, нутч-фильтр, обработка свинцового шлама и теплообменники — но их параметры заданы в ИД и они физически стоят в том же зале.","action":"В PFD/P&ID и компоновках явно разграничить зоны ответственности, иначе на ОТР вылезут разрывы."},{"level":"Низкий","title":"Два варианта дутья в ИД","why":"Основной вариант — кислородное дутьё, вспомогательный — подогрев дутья топочными газами от мазута. ИД разработаны в обоих вариантах, оборудование топки (горелка ГМ-4,5) в перечне присутствует.","action":"В БИ считать оба варианта и явно показать, какой принят за базовый в компоновке и стоимости; топку сохранить как страховку на ПНР."},{"level":"Низкий","title":"Поэтапная сдача материалов","why":"Исполнитель предоставляет материалы БИ поэтапно по графику — для начала ОТР до полного выпуска БИ. График в ТЗ не приведён.","action":"Предложить свой график поэтапной выдачи в составе заявки — это управляемый плюс к оценке."}],"strategy":[{"n":1,"title":"Определиться с лотами: идти во все четыре или сфокусироваться","text":"Лоты №2, №3 и №4 технологически связаны одним зданием и одной АСУ; логично идти пакетом 2+3+4. Лот №1 (пирометаллургия) — другая инженерная школа и другой пул поставщиков. Заход во все четыре требует двух разных команд."},{"n":2,"title":"Главный актив КВАНТ в этой заявке — не проектирование, а пул поставщиков и ТКП","text":"Требование 2–3 ТКП на каждую позицию — это ровно то, чем занимается сорсинг КВАНТ. Проектную часть можно закрывать партнёрством с профильным институтом, а уникальный вклад показывать через скорость и глубину сбора ТКП, включая КНР."},{"n":3,"title":"Собрать опросные листы до конкурса","text":"Опросный лист на каждую позицию с обязательными полями: среда, температура, давление, материал контактных частей, производительность, габарит, масса, энергопотребление, срок изготовления. Готовый комплект — сильный аргумент в техчасти заявки."},{"n":4,"title":"Заранее закрыть три «дефицитные» позиции","text":"Печь КС с кислородным дутьём, роботизированная КСМ с машинным зрением и спецкраны с автопозиционированием — позиции, где 2–3 ТКП собрать труднее всего. Кто первым найдёт по ним реальных поставщиков, тот и выигрывает по стоимости и срокам."},{"n":5,"title":"Проработать связку по автоматизации отдельно","text":"Приложение №5 фактически задаёт архитектуру: нижний уровень — российские датчики из утверждённого перечня, средний — Regul или АБАК, верхний — Alpha.Scada на Linux с горячим резервированием. Плюс запас 30 % по I/O и SNMP-мониторинг на всём. Это готовый шаблон решения, который можно показать в заявке."},{"n":6,"title":"Не подписываться на ЦИМ, не проверив стек ПО","text":"ЦИМ выделена отдельным этапом и требует конкретного российского BIM-ПО плюс двухнедельного ритма выгрузок IFC с первых недель работ. Нужна либо своя команда на Model Studio CS / NanoCAD BIM, либо партнёр, зафиксированный до подачи."},{"n":7,"title":"Заложить обследование существующих зданий в цену и график","text":"Приложения №6 и №7 — это архитектурные листы, а не обмеры. Для компоновки 180 ванн, КСМ и двух спецкранов в действующем ЦЭМ обмерное const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n,d=0) => (n===''||n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
/* **жирный** в текстах данных — единственная разметка, которую пропускаем */
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const lotTag = n => n===0||n===null||n===undefined ? '<span class="tag lot0">вне БИ</span>'
  : (n===9 ? '<span class="tag">все лоты</span>' : `<span class="tag lot${n}">Лот №${n}</span>`);
const lotName = n => (LOTS.lots.find(l=>l.id===n)||{}).name || 'Вне БИ';
/* ссылка на источник: показываем хост, а не полный URL — длинные URL рвут вёрстку на узких экранах */
function srcLink(u){
  if(!/^https?:/.test(String(u||''))) return esc(u);
  let host = u; try{ host = new URL(u).hostname.replace(/^www\./,''); }catch(e){}
  return `<a class="src" href="${esc(u)}" target="_blank" rel="noopener">${esc(host)}</a>`;
}

let eqFilter = {lot:'', q:'', key:false};
function eqRows(){
  const t = eqFilter.q.toLowerCase();
  return EQ.items.filter(i=>
    (eqFilter.lot===''||String(i.lot)===eqFilter.lot) &&
    (!eqFilter.key||i.key) &&
    (!t||[i.name,i.model,i.area,i.purpose,i.material,i.status,i.note].join(' ').toLowerCase().includes(t)));
}
function eqPaint(){
  const rows = eqRows();

  el.innerHTML = rows.map(i=>`<tr>
    <td>${lotTag(i.lot)}<div class="mut">${esc(i.area)}</div></td>
    <td><b>${esc(i.name)}</b>${i.key?' <span class="tag lot1">ключевое</span>':''}
        ${i.model&&i.model!=='—'?`<div class="mut">${esc(i.model)}</div>`:''}

/* ================= CAPEX ================= */
const CP = {fx:CAPEX.params.fx.value, lang:CAPEX.params.lang.value, cont:CAPEX.params.cont.value};
function capexCalc(){
  const eq = CAPEX.equipment.reduce((a,e)=>({low:a.low+e.low, base:a.base+e.base, high:a.high+e.high}), {low:0,base:0,high:0});
  const direct = CAPEX.nonequip.filter(n=>n.mode==='direct')
    .reduce((a,n)=>({low:a.low+n.low, base:a.base+n.base, high:a.high+n.high}), {low:0,base:0,high:0});
  const out = {};
  for(const k of ['low','base','high']){
    const eqInst = eq[k]*CP.lang;              // оборудование → смонтированный объект
    const tic = eqInst + direct[k];            // + прямые строительные и сетевые затраты
    let soft = 0;
    for(const n of CAPEX.nonequip){
      if(n.mode==='pct_tic') soft += tic*n.pct/100;
      if(n.mode==='pct_eq')  soft += eq[k]*n.pct/100;
    }
    const sub = tic + soft;
    out[k] = {eq:eq[k], eqInst, direct:direct[k], tic, soft, sub, cont:sub*CP.cont/100, total:sub*(1+CP.cont/100)};
  }
  return out;
}

  el.innerHTML = `

const TABS = [
  ['overview','Обзор'], ['stages','Этапы'], ['blocks','Блоки и лоты'], ['equip','Оборудование'],
  ['sup','Поставщики'], ['auto','Автоматизация'], ['world','Мировой опыт'], ['china','Китай'],
  ['tender','Торги за БИ'], ['capex','Стройка · CAPEX']
];
const R = {overview:rOverview, stages:rStages, blocks:rBlocks, equip:rEquip, sup:rSup,
           auto:rAuto, world:rWorld, china:rChina, tender:rTender, capex:rCapex};
const nav = document.getElementById('nav'), main = document.getElementById('main');
nav.innerHTML = TABS.map(([id,t])=>`<button data-t="${id}">${esc(t)}</button>`).join('');
main.innerHTML = TABS.map(([id])=>`<section id="s-${id}"></section>`).join('');
document.getElementById('foot').innerHTML =
  `Разбор тендерного пакета «ТЗ на БИ ОВЭ-75 v.3.6» и приложений №1–7 (ИД ч.1 и ч.2, электроснабжение, ЦИМ, ОАСУ, здания ЦЭМ и ГМУ). ` +
  `Технологические данные — из документов Заказчика и ИД ООО «Институт Гипроникель». Внешние факты о компаниях проверены 13.08.2026 и снабжены ссылками. ` +
  `Оценка CAPEX — модель порядка величины, не смета. Сборка: 2026-08-13`;

const rendered = {};
function bindEquip(){
  const q=document.getElementById('eqq'), s=document.getElementById('eqlot'), k=document.getElementById('eqkey');
  q.addEventListener('input', ()=>{eqFilter.q=q.value; eqPaint();});
  s.addEventListener('change', ()=>{eqFilter.lot=s.value; eqPaint();});
  k.addEventListener('click', ()=>{eqFilter.key=!eqFilter.key; k.classList.toggle('on',eqFilter.key); eqPaint();});
  eqPaint();
}
function bindCapex(){
  for(const key of Object.keys(CAPEX.params)){
    const el=document.getElementById('cp_'+key), out=document.getElementById('cpo_'+key);
    el.addEventListener('input', ()=>{ CP[key]=Number(el.value); out.textContent=el.value; capexPaint(); });
  }
  capexPaint();
}
function show(id){
  for(const [tid] of TABS){
    document.querySelector(`[data-t="${tid}"]`).classList.toggle('on', tid===id);
    document.getElementById(`s-${tid}`).classList.toggle('on', tid===id);
  }
  if(!rendered[id]){
    document.getElementById(`s-${id}`).innerHTML = R[id]();
    rendered[id]=1;
    if(id==='equip') bindEquip();
    if(id==='capex') bindCapex();
  }
  location.hash = id;
  window.scrollTo(0,0);
}
nav.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.t); });
show(TABS.some(([id])=>id===location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
</script>
</body>
</html>
