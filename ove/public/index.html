const WORLD = {"honesty":"Технологические факты о самом проекте — из ТЗ и ИД. Внешние факты о мировых компаниях снабжены ссылками на первоисточник и датой проверки (13.08.2026). Где данных нет — стоит «не проверено», ничего не додумано.","tech_position":{"title":"Где ОВЭ-75 стоит на мировой карте технологий","text":"ОВЭ — это не гидрометаллургия «из руды» (heap leach → SX-EW), а переработка высокомедного сульфидного полупродукта (67 % Cu концентрат от разделения файнштейна) по маршруту «сульфатизирующий обжиг в КС → сернокислотное выщелачивание огарка → прямая электроэкстракция без SX». Отсутствие стадии жидкостной экстракции (SX) — принципиальная особенность: раствор после выщелачивания и контрольной фильтрации сразу идёт на электроэкстракцию, а очистка от Ni/Co/Fe вынесена в кристаллизацию купоросов. Это резко сужает круг мировых аналогов: типовые проекты SX-EW под этот случай не референс.","signature":["Сульфатизирующий обжиг в печи КС (не окислительный «мёртвый» обжиг и не плавка) — целевой продукт огарок с 0,051 % S и пыли с 2,4 % S","Дутьё, обогащённое кислородом (96 % O₂) — компенсация деградации теплотворной способности шихты","Прямая электроэкстракция из сульфатного раствора без SX, при 252,7 А/м² фактической плотности тока","Двухпоточная вакуумная кристаллизация купоросов как узел вывода никеля, кобальта и железа","Целевое качество катода — М00к, сумма примесей ≤0,0065 % — на уровне электрорафинирования, а не типового EW"]},"analogues":[{"name":"Sulphating roasting (Outotec / Metso) — базовая мировая школа процесса","who":"Metso (ранее Outotec / Outokumpu Technology)","fact":"Первый сульфатизирующий обжиговый агрегат Outotec построен в Замбии около 30 лет назад; линейка охватывает обжиг меди, золота, цинка, свинца, молибдена и пирита. Для концентратов с высоким содержанием меди и низким содержанием серы наиболее выгодным решением признан подогрев обжигового воздуха — то самое решение, что заложено во вспомогательный вариант ИД ОВЭ-75.","relevance":"Прямой  по времени пункт всего БИ. По Лоту №1 позиций около 25, по Лоту №3 — узлы с единичными мировыми поставщиками (КСМ, спецкраны, ошиновка). Собрать 2–3 сопоставимых ТКП по каждой — работа на месяцы, начинать надо до подписания договора.","action":"Начать сбор пула поставщиков и опросных листов немедленно — не дожидаясь итогов конкурса. Это же станет главным конкурентным преимуществом в заявке."},{"level":"Высокий","title":"Технологические гарантии на поставляемое оборудование","why":"Определение БИ в ТЗ прямо включает «последующее предоставление технологических гарантий на поставляемое оборудование». Это перенос технологического риска на Исполнителя БИ.","action":"Заранее определить, на какие показатели мы готовы давать гарантию, а какие завязаны на ИД Гипроникеля, и зафиксировать разграничение ответственности в предложении."},{"level":"Высокий","title":"Материальное исполнение гидромета: Hastelloy G-35 vs 904L vs 316L","why":"ИД исключает 316L для горячих кислых концентрированных солевых растворов и требует Hastelloy G-35 или аналог (допустимо 904L). Ошибка в материале на этапе ТКП даёт кратную ошибку в стоимости.","action":"Материал контактных частей вносить в опросный лист как обязательное поле; отклонённые по материалу ТКП не принимать к оценке."},{"level":"Средний","title":"Машинное обучение в контуре управления обжигом","why":"Прямое требование Заказчика по Лоту №1. Одновременно Приложение №5 требует, чтобы всё ПО промышленной автоматизации было разработано и произведено в РФ. Готового отечественного ML-решения под сульфатизирующий обжиг в КС на рынке нет.","action":"Проработать связку: Regul/АБАК (ПЛК) + Alpha.Scada (верхний уровень) + отдельный расчётный модуль advanced process control. Заявить как отдельную позицию с понятным исполнителем."},{"level":"Средний","title":"Размещение Лотов №2 и №3 в существующих зданиях","why":"Лот №3 — в существующем корпусе ЦЭМ (шаг колонн 24 000 мм, крановый пролёт 22 000 мм), Лот №2 — в существующем ГМУ. Приложения №6 (11 листов ФМ-59410…59419) и №7 (10 листов ФМ.01648) дают только архитектурные чертежи.","action":"Заложить в график обследование зданий: фактические отметки, состояние конструкций, нагрузки от существующих кранов, реальные габариты проходов под 180 ванн и КСМ."},{"level":"Средний","title":"Границы проектирования по Лотам №2–4 уточняются Исполнителем","why":"ТЗ прямо говорит: границы уточняются по предложению Исполнителя БИ с учётом объёмов поставки и согласовываются Заказчиком. Это и возможность (расширить объём), и ловушка (взять на себя лишнее без компенсации).","action":"Границы предлагать письменно и с обоснованием, фиксировать протоколом до начала расчётов."},{"level":"Средний","title":"Дублирование позиций между лотами и вне-БИ периметром","why":"По Лоту №3 из БИ исключены шины магистральные, выпрямители, напорный и сливной трубопроводы, аспирация ванн, циркуляционные насосы, грузоподъёмное оборудование, нутч-фильтр, обработка свинцового шлама и теплообменники — но их параметры заданы в ИД и они физически стоят в том же зале.","action":"В PFD/P&ID и компоновках явно разграничить зоны ответственности, иначе на ОТР вылезут разрывы."},{"level":"Низкий","title":"Два варианта дутья в ИД","why":"Основной вариант — кислородное дутьё, вспомогательный — подогрев дутья топочными газами от мазута. ИД разработаны в обоих вариантах, оборудование топки (горелка ГМ-4,5) в перечне присутствует.","action":"В БИ считать оба варианта и явно показать, какой принят за базовый в компоновке и стоимости; топку сохранить как страховку на ПНР."},{"level":"Низкий","title":"Поэтапная сдача материалов","why":"Исполнитель предоставляет материалы БИ поэтапно по графику — для начала ОТР до полного выпуска БИ. График в ТЗ не приведён.","action":"Предложить свой график поэтапной выдачи в составе заявки — это управляемый плюс к оценке."}],"strategy":[{"n":1,"title":"Решение принято: идём во все четыре лота","decided":true,"text":"Распоряжение владельца от 13.08.2026 — заходим во все четыре лота. Из этого следуют три обязательства. Первое: нужны две разные инженерные команды — Лот №1 это пирометаллургия (печь КС, котёл-утилизатор, газоочистка), Лоты №2–4 это гидрометаллургия и автоматизация, школы и пулы поставщиков разные. Второе: объём сбора ТКП удваивается — 2–3 предложения на каждую позицию по всем четырём лотам, а это порядка 27 закупочных позиций. Третье: заход во все лоты снимает риск «выиграли один лот, а границы стыкуются с чужим» — при полном пакете границы проектирования между лотами замыкаются на нас, и это сильный аргумент в предложении Заказчику."},{"n":2,"title":"Главный актив КВАНТ в этой заявке — не проектирование, а пул поставщиков и ТКП","text":"Требование 2–3 ТКП на каждую позицию — это ровно то, чем занимается сорсинг КВАНТ. Проектную часть можно закрывать партнёрством с профильным институтом, а уникальный вклад показывать через скорость и глубину сбора ТКП, включая КНР."},{"n":3,"title":"Собрать опросные листы до конкурса","text":"Опросный лист на каждую позицию с обязательными полями: среда, температура, давление, материал контактных частей, производительность, габарит, масса, энергопотребление, срок изготовления. Готовый комплект — сильный аргумент в техчасти заявки."},{"n":4,"title":"Заранее закрыть три «дефицитные» позиции","text":"Печь КС с кислородным дутьём, роботизированная КСМ с машинным зрением и спецкраны с автопозиционированием — позиции, где 2–3 ТКП собрать труднее всего. Кто первым найдёт по ним реальных поставщиков, тот и выигрывает по стоимости и срокам."},{"n":5,"title":"Проработать связку по автоматизации отдельно","text":"Приложение №5 фактически задаёт архитектуру: нижний уровень — российские датчики из утверждённого перечня, средний — Regul или АБАК, верхний — Alpha.Scada на Linux с горячим резервированием. Плюс запас 30 % по I/O и SNMP-мониторинг на всём. Это готовый шаблон решения, который можно показать в заявке."},{"n":6,"title":"Не подписываться на ЦИМ, не проверив стек ПО","text":"ЦИМ выделена отдельным этапом и требует конкретного российского BIM-ПО плюс двухнедельного ритма выгрузок IFC с первых недель работ. Нужна либо своя команда на Model Studio CS / NanoCAD BIM, либо партнёр, зафиксированный до подачи."},{"n":7,"title":"Заложить обследование существующих зданий в цену и график","text":"Приложения №6 и №7 — это архитектурные листы, а не обмеры. Для компоновки 180 ванн, КСМ и двух спецкранов в действующем ЦЭМ обмерное обследование обязательно."}],"actions":[{"when":"На контроле у владельца","what":"Снять с площадки SRM Норникель фактические реквизиты процедуры по ОВЭ-75: номер, состав лотов, сроки подачи, форму заявки, квалификационные требования","owner":"Владелец — ведёт сам","done":true},{"when":"Решено 13.08.2026","what":"Состав лотов определён: идём во все четыре","owner":"Владелец","done":true},{"when":"Немедленно","what":"Выбрать китайского партнёра под квалификацию и сравнить кандидатов по цене — с проработкой варианта «сделать самим» по позициям, где это реально","owner":"Руководство + сорсинг"},{"when":"Неделя 1","what":"Сформировать по каждому лоту перечень закупаемых позиций из ИД и раздать на сорсинг для сбора 2–3 ТКП","owner":"Сорсинг"},{"when":"Неделя 1–2","what":"Разработать типовые опросные листы (RU + EN) с обязательным полем материала контактных частей","owner":"Технологи + сорсинг"},{"when":"Неделя 2","what":"Запросить референс-листы у China Nerin и China ENFI по сульфатизирующему обжигу меди и медной электроэкстракции","owner":"Сорсинг КНР"},{"when":"Неделя 2–3","what":"Закрыть три дефицитные позиции: печь КС, КСМ, спецкраны — найти минимум по 2 реальных поставщика на каждую","owner":"Сорсинг"},{"when":"Неделя 3","what":"Проработать архитектуру АСУ по Приложению №5 и найти исполнителя ML-контура обжига","owner":"Автоматизация"},{"when":"Неделя 3–4","what":"Подтвердить наличие команды/партнёра по ЦИМ на российском BIM-стеке и подготовить черновик ПИМ","owner":"Проектная часть"},{"when":"До подачи","what":"Собрать сводную оценку стоимости комплектной п const BI = [{"lot":1,"name":"Цех обжига","sections":[{"id":"s01-obshchie","title":"Общие сведения об объекте, его назначении и месте расположения","kind":"pz","body":"Цех обжига — головной пирометаллургический передел комплекса «обжиг – выщелачивание – электроэкстракция» производительностью 75 000 т катодной меди в год (шифр КГМК.ОВЭ-75) на промплощадке АО «Кольская ГМК», г. Мончегорск Мурманской области (184507). Назначение цеха — окислительный обжиг «намертво» шихты на основе медного концентрата от разделения файнштейна в печи кипящего слоя (КС) с получением трёх продуктов: огарка и обжиговой пыли, направляемых на гидрометаллургическую переработку в ГМЦ, и серосодержащих газов, направляемых на производство серной кислоты в существующий СКЦ. В границах Лота №1 — пять участков: **фильтрация медного концентрата, приёмка сырья и шихтовка, обжиг, газоочистка, аспирация** (ТЗ п.2.8.3). Здание — новое строительство.\n\nПринята **одна технологическая линия** обжига-газоочистки (одна печь КС конструкции HATCH, один котёл-утилизатор, один одиночный циклон, один рабочий сухой электрофильтр при одном резервном) с запасом производительности **не менее 15 %** (коэффициент 1,15 по ИД, табл. 23 п.93) — запас обеспечивает проведение ППР оборудования без остановки всего комплекса. Режим работы — круглосуточный, 330 дней, **7920 ч/год** (письмо КГМК/6525-исх от 25.05.2026 о сценарных условиях). Технология и весь расчётный аппарат приняты в двух вариантах: **основной** — обжиг на воздушно-кислородном дутье с содержанием O₂ 52 % без подогрева, и **вспомогательный** — обжиг на дутье 30,8 % O₂, подогретом до ~455 °C смешением с топочными газами мазутной топки. Вспомогательный вариант является технологическим резервом на случай неконтролируемой агломерации частиц, залегания слоя и настылеобразования; переход между вариантами предусмотрен без остановки печи. Всё оборудование, строительные конструкции и энергетика цеха рассчитываются на огибающую двух вариантов (по газовому тракту и котлу-утилизатору определяющим является вспомогательный вариант, по кислороду — основной).\n\nУсловия площадки: строительно-климатическая зона IIА, субарктический климат; температура наиболее холодной пятидневки −34 °C (обесп. 0,98) / −30 °C (0,92), наиболее холодных суток −40 °C; отопительный период 271 сут при средней −4,5 °C; V снеговой район (3,2 кПа), II ветровой район (W₀ = 0,30 кПа, зарегистрированный порыв 33 м/с); сейсмичность 6 баллов по ОСР-2015-В; особые грунтовые условия (мерзлота, просадочность, карст) не выявлены. Компоновочные решения выполняются на сетке колонн **6/12 м** (ТЗ п.3.5). Границы проектирования — по ТЗ п.3.3: от фланца пульпопровода сгущённого концентрата на внешней стене цеха и ворот цеха (кек NNH, цементная медь) до фланцев выгрузки бункеров огарка и пыли и выходного патрубка дымососа; по мазуту, кислороду, сжатому воздуху, пару после РОУ, оборотной и химочищенной воде, электроэнергии — границы уточняются при согласовании ТУ на подключение.","items":[{"label":"Производительность комплекса","value":"75 000 т катодной меди в год","src":"ТЗ п.1.1"},{"label":"Режим работы цеха обжига","value":"330 дней, 7920 ч/год, круглосуточно, 3 смены по 8 ч","src":"ТЗ п.3.4; ИД ч.1 табл. 23 п.89-90"},{"label":"Число линий обжига / запас","value":"1 линия, запас производительности ≥15 % (K=1,15)","src":"ТЗ п.3.4; ИД табл. 23 п.91, 93"},{"label":"Расчётная снеговая нагрузка","value":"3,2 кПа (V район)","src":"ТЗ п.2.9.3"},{"label":"Ветровое давление W₀","value":"0,30 кПа (II район), порыв до 33 м/с","src":"ТЗ п.2.9.4"},{"label":"Сейсмичность","value":"6 баллов (ОСР-2015-В)","src":"ТЗ п.2.9.5"},{"label":"Температура наиболее холодной пятидневки (0,98)","value":"−34 °C","src":"ТЗ п.2.9.2"}],"gost":[{"doc":"СП 131.13330.2020","what":"Строительная климатология — подтверждение климатических параметров г. Мончегорск для расчётов ограждающих конструкций и инженерных систем"},{"doc":"СП 20.13330.2016","what":"Нагрузки и воздействия — снеговой V район, ветровой II район, сочетания нагрузок"},{"doc":"СП 14.13330.2018","what":"Строительство в сейсмических районах — при сейсмичности 6 баллов специальные антисейсмические мероприятия для зданий нормального уровня ответственности, как правило, не требуются; подтверждается расчётом на стадии БИ"},{"doc":"116-ФЗ от 21.07.1997","what":"Промышленная безопасность ОПО — цех обжига идентифицируется как ОПО (получение расплавов/применение металлов, сеть газопотребления мазута, оборудование под давлением)"},{"doc":"ФНП «Правила безопасности процессов получения или применения металлов» (приказ Ростехнадзора № 512 от 09.12.2020)","what":"Базовые требования безопасности к печи КС, газоочистке, пылеуборке, бункерному хозяйству"}],"open":["Класс опасности ОПО и границы регистрируемых объектов — идентификация на стадии БИ/ОТР","Точки подключения по всем энергоресурсам (ТЗ п.3.3.7–3.3.13) — по ТУ Заказчика в процессе разработки БИ"]},{"id":"s02-syrye-produkty","title":"Данные о сырье, продукции и производимом паре (после РОУ)","kind":"pz","body":"**Сырьё.** На шихтовку поступают три компонента. (1) Медный концентрат ОРФ — 74 516,6 т/год сухого, из которых 1 024,6 т/год (фракция −20 мкм) выводится в ГМЦ без обжига и **73 492 т/год** идёт на шихту; состав, %: 67,10 Cu; 4,20 Ni; 0,22 Co; 5,24 Fe; 23,24 S (сера практически вся сульфидная — халькозин-борнитовый твёрдый раствор Cu₂S–Cu₅FeS₄, дигенит Cu₁,₈S); ≥95 % фракции −44 мкм, средняя крупность 25,5 мкм, насыпная плотность 2210 кг/м³, температура плавления 1035–1045 °C; влажность кека после фильтрации 10 %. Поступает пульпой 70 % твёрдого по пульпопроводу с участка сгущения. (2) Медный кек NNH — **24 218,5 т/год** сухого; состав, %: 55,00 Cu; 3,00 Ni; 0,10 Co; 3,00 Fe; 20,00 S, в т.ч. сульфатной 3,88 % (ковеллин CuS + сульфаты и гидроксид меди); влажность 20 %; поставка в МКР «биг-бэг» брутто 1–2 т, растаривание на станции в цехе. (3) Цементная медь ЦЭН — **9 181,9 т/год**; состав, %: 94,00 Cu; 2,50 Ni; 0,06 Co; 0,10 Fe; 0,14 S (вся сульфатная); 0,15 Cl; металлическая медь 77,6 % + куприт; крупный неслёживающийся порошок (средняя крупность 465 мкм), влажность 12,5 % (10–15 %); поставка в титановых контейнерах, агрессивна (остаточные кислоты) — весь тракт в кислотостойком исполнении AISI 316/12Х18Н10Т. Суммарная сухая шихта — **106 892 т/год, 71 264 т меди** (ИД табл. 22). В шихту также вовлекаются оборотная пыль электрофильтра (при необходимости) и огарок на запуск печи.\n\n**Продукция цеха.** (1) Огарок печи КС — **81 896 т/год** (выход 76,98 % от сухой шихты, основной вариант); состав, %: 69,92 Cu; 4,00 Ni; 0,19 Co; 4,34 Fe; **0,051 S**; 0,010 Cl; вещественно 87,2 % тенорита CuO; остаточная сульфатная сера — нулевая, что задано требованиями выщелачивания. (2) Обжиговая пыль — суммарно **20 175 т/год** (18,96 %): пыль котла-утилизатора 9 081 т/год (S 2,15 %), одиночного циклона 8 165 т/год (S 2,27 %) — эти два потока («грубая» пыль) объединяются с огарком; пыль электрофильтра («тонкая») 2 916 т/год (S 3,44 %, Cu 63,2 %) — отдельный поток; унос в СКЦ 14 т/год. Огарок+грубая пыль и тонкая пыль охлаждаются до **70 °C** и отгружаются из бункеров-силосов в автоцементовозы. (3) Серосодержащий газ в СКЦ — 13 262 нм³/ч (осн.) / 21 830 нм³/ч (вспом.) с SO₂ **15,59 / 9,49 %**, SO₃ 0,72/0,44 %, температурой 387 °C и остаточной запылённостью ≤0,1 г/нм³; в газ переходит 21 307 т/год серы (97,13 % от прихода).\n\n**Пар.** Котёл-утилизатор вырабатывает перегретый пар **1,9 МПа (не более 1,863), 375 °C** в количестве 4,102 т/ч (осн.) / 6,476 т/ч (вспом.), т.е. 32 488 / 51 290 т/год; паропроизводительность КУ — до 7 т/ч. Весь пар редуцируется в РОУ до **0,6 МПа, 159 °C** (насыщение) с впрыском химочищенной воды (подача воды в РОУ до 3,0 т/ч из КПО ЦЭО) и выдаётся на технологические нужды площадки; граница проектирования — по ТЗ п.3.3.10. Питательная вода КУ — химочищенная, 105 °C, по нормам РД 24.032.01-91 (жёсткость ≤15 мкг-экв/кг, O₂ ≤30 мкг/кг, pH ≥8,5, нефтепродукты ≤5 мкг/кг); продувка 0,205/0,324 м³/ч.","items":[{"label":"Концентрат ОРФ на шихту","value":"73 492 т/год сух. (до 10,621 т/ч), влажность 10 %","src":"ИД табл. 22 стр.1; табл. 23 п.62, 193; ТЗ п.3.1.1"},{"label":"Кек NNH","value":"24 218,5 т/год сух. (до 3,500 т/ч), влажность 20 %","src":"ИД табл. 22 стр.2; табл. 23 п.71, 194"},{"label":"Цементная медь","value":"9 181,9 т/год (до 1,327 т/ч), влажность 12,5 %","src":"ИД табл. 22 стр.3; табл. 23 п.80, 195"},{"label":"Итого сухая шихта / медь в шихте","value":"106 892 т/год / 71 264 т/год Cu","src":"ИД табл. 22 «Итого приход»"},{"label":"Огарок: выход и сера","value":"81 896 т/год (76,98 %), S = 0,051 %","src":"ИД табл. 22 стр.4; табл. 23 п.242-243"},{"label":"Пыль суммарно","value":"20 175 т/год (18,96 %), из них тонкая (ЭФ) 2 916 т/год","src":"ИД табл. 22 стр.5-9"},{"label":"Сера в газ","value":"21 307 т/год (97,13 % прихода серы)","src":"ИД табл. 22 стр.10"},{"label":"Пар до РОУ","value":"1,9 МПа, 375 °C; 4,102/6,476 т/ч (32 488/51 290 т/год)","src":"ИД разд. 2.5; табл. 23 п.267-268, 282; табл. 26"},{"label":"Пар после РОУ","value":"0,6 МПа, 159 °C; впрыск ХОВ до 3,0 т/ч","src":"ИД разд. 2.5"},{"label":"Газ в СКЦ","value":"13 262/21 830 нм³/ч; SO₂ 15,589/9,493 %; SO₃ 0,718/0,437 %; 387 °C; пыль ≤0,1 г/нм³","src":"ИД табл. 23 п.400-403"}],"gost":[{"doc":"ГОСТ 859-2014","what":"Марки меди — конечная продукция комплекса (медь катодная), контекст требований к качеству полупродуктов цеха"},{"doc":"ГОСТ 5583-78 (ИСО 2046-73)","what":"Кислород технический газообразный — содержание O₂ 93±3 % (в расчётах 96 %), давление поставки 400–800 кПа"},{"doc":"ГОСТ 10585-2013","what":"Топливо нефтяное. Мазут — марка М-100, сернистость до 3,5 %"},{"doc":"РД 24.032.01-91","what":"Нормы качества питательной воды и пара котлов-утилизаторов — требования к подпиточной воде КУ (цитируются в ИД п.1.3.10)"},{"doc":"ТР ТС 032/2013 и ФНП № 536 от 15.12.2020","what":"Оборудование под избыточным давлением — котёл-утилизатор 1,9 МПа, паропроводы, РОУ"}],"open":["Фактический диапазон колебаний состава шихты (партионность кека NNH и цементной меди) — запросить статистику Заказчика для настройки дозирования и МЛ-модели","Баланс потребителей пара 0,6 МПа после РОУ на площадке — по ТУ Заказчика","Требования СКЦ к стабильности SO₂ и допустимым колебаниям расхода газа — согласовать с эксплуатацией СКЦ (критично для контура регулирования дымососа)"]},{"id":"s03-tehprocess","title":"Описание технологического процесса по операциям (участкам)","kind":"pz","body":"**Участок 1. Фильтрация медного концентрата.** Сгущённая пульпа (70 % твёрдого) принимается по пульпопроводу (обогреваемому в холодный период) от участка сгущения — граница по фланцу на стене цеха. Фильтрация — на **двух барабанных вакуум-фильтрах S = 32 м² каждый** (суммарно 64 м² при расчётной потребности 29,4 м² — резервирование 2×100 %  рабочий/резервный или параллельная работа на пониженной нагрузке); удельная производительность 300 кг/(м²·ч), съём кека 8,8 т/ч сухого (9,8 т/ч при влажности 10 %). Кек разгружается на ленточные конвейеры и сборным конвейером подаётся в отделение шихтовки; фильтрат (23 332 м³/год) собирается в ёмкость фильтрата и насосами возвращается в ОРФ. Вакуумная система (вакуум-насосы с ресивером и гидрозатвором), система отдувки кека и промывки полотна — комплектно с фильтрами. При аварийной остановке печи КС кек конвейерами выводится на склад сырья; лежалый кек возвращается погрузчиком в приёмный бункер (измельчение не требуется — комья непрочные).\n\n**Участок 2. Приёмка сырья и шихтовка.** Четыре приёмных бункера с футеровкой листовым PE500 и вибрационными аэраторами обрушения свода: концентрат 60 м³, кек NNH 20 м³ (загрузка со станции растаривания биг-бэгов), цементная медь 10 м³ (загрузка ковшовым погрузчиком с кислотостойким ковшом), оборотные материалы 50 м³ (огарок на запуск печи; для оборотной пыли ЭФ — 20 м³). Из каждого бункера материал выдаётся связкой «тарельчатый (дисковый) питатель → ленточный весовой дозатор → винтовой конвейер»: концентрат ZC1200 + дозатор до 16 т/ч + УКВ-320-Ц-60; кек ZC800 + до 5 т/ч + УКВ-200-Ц-60 (тракт в стали 12Х18Н10Т); цементная медь ZC300 + до 3,2 т/ч + УКВ-200-Ц-37,5 (кислотостойкое исполнение); обороты ZC300 + до 4 т/ч. Каждая линия оснащена тензодатчиками LPA-68 и **поточным микроволновым влагомером Микрорадар-113А** — дозирование ведётся по сухому весу. Смешение — в двухшнековом смесителе **СШ-25 (10–25 т/ч**, 37 кВт, AISI 316); готовая шихта (влажность 12,48 %, S 20,52 %) наклонным винтовым конвейером УКВ-320-Ц-95 подаётся в **два расходных бункера печи по 60 м³** (запас ~8 ч). Из расходного бункера — питатель ZC1500, дозатор до 25 т/ч и скоростной шнековый забрасыватель (референс — Челябинский цинковый завод), подающий шихту непосредственно в надслоевое пространство печи. Максимальная производительность линии по шихте **15,448 т/ч** (с запасом 1,15).\n\n**Участок 3. Обжиг.** Печь КС конструкции HATCH: круглая, конусно расширяющаяся от подины Ø6000 мм до Ø8390 мм на уровне газохода (угол 21°, высота 9200 мм, газоход Ø2000 мм из центра свода); подина 28,27 м² с 583 грибковыми безпровальными соплами (сталь ХН78Т, 4 отверстия Ø4 мм); футеровка — шамот Ш-22/23/5/44/45 на мертеле, листовой асбест. Дутьё — смесь технологического воздуха (80–120 кПа от воздуходувки) и технического кислорода 96 % (400–800 кПа из сети): **основной вариант 11 342 нм³/ч с 52,0 % O₂ при 25 °C; вспомогательный 19 146 нм³/ч с 30,8 % O₂, подогретого до 455 °C** топочными газами мазутной топки (горелка ГМ-4,5, мазут 300 кг/ч). Удельный расход кислорода на окисление 254,5 нм³/т шихты при α = 1,5. В слое поддерживается **930 °C**; время пребывания материала 9 ч, единовременная загрузка 139 т, слой 1647 мм (насыпной) / 1918–2144 мм (кипящий); число псевдоожижения 3,93/8,07. Тепловой эффект окисления шихты 2,378 ГДж/т. Огарок непрерывно выгружается через сливной порог в шнековый холодильник; выгрузкой управляет **дроссельный затвор по перепаду давления «газовая коробка – слой»**; крупные фракции с подины периодически выпускаются через второй порог ножевой шиберной задвижкой. Пуск после капремонта: розжиг дровами до 250–350 °C → загрузка 80–100 т огарка → разогрев тремя горелками МГМГ-10 (до 940 кг/ч мазута каждая) до 500–600 °C → выход на слабое кипение воздухом 12–13 тыс. нм³/ч → 850–880 °C → перевод на кислородно-воздушное дутьё и подача шихты. Остановка: прекращение загрузки → «прокалка» 20–30 мин до исчезновения SO₂ → отсечка дутья; при аварийной отсечке — подача азота по кислородной линии или аварийный сброс слоя через донную выгрузку.\n\n**Участок 4. Газоочистка.** Отходящий газ (12 129 нм³/ч, 913 °C, запылённость 241,5 г/нм³ — осн.; 19 934 нм³/ч, 919 °C — вспом.) последовательно проходит: **котёл-утилизатор** (проектируется заново по аналогу КУ печей КС РЦ; панели «лист-полутруба», барабан, пылевой бункер 15 м³; охлаждение до 400 °C, съём тепла 11,30/17,85 ГДж/ч, пар 4,1/6,5 т/ч; улавливание грубой пыли 1,32/1,99 т/ч при эффективности 45 %; очистка поверхностей — мехобстукивание и термоволновая) → **одиночный циклон СЦН-50-1800×1УП** (Ø1800 мм, оптимальная скорость 2,5–3,5 м/с, гидросопротивление 868/2232 Па, эффективность 73,6 %, пыль 1,19/1,96 т/ч, бункер 8,5 м³) → **сухой горизонтальный электрофильтр УГТ1-20-4** (2 шт., один в резерве; 4 поля по 2500 мм, активное сечение 20 м², площадь осаждения 455 м², скорость газа 0,4–0,8 м/с, агрегат ОПМД-400 до 80 кВ/400 мА, рабочее напряжение 46,4/57,6 кВ, эффективность 99,7 %, остаточная запылённость **0,1 г/нм³**, пыль 0,42/0,50 т/ч) → **дымосос ДН-15БНЖ** (2 шт., один в резерве; 19–78 тыс. м³/ч, 1650–7800 Па, до 400 °C, двигатель 400 кВт 6 кВ 1500 об/мин, рекомендован ЧРП) → газоход Ø1100 мм (сталь 09Г2С, футеровка ШЛ-0,4) в СКЦ. Неорганизованные подсосы по тракту: КУ 4,9 %, циклон 3,1 %, ЭФ 1,5 %. Суммарное сопротивление тракта 2547/5426 Па. Общая эффективность пылеочистки 99,95 %. Грубая пыль КУ и циклона шнеками подаётся в холодильник огарка; тонкая пыль ЭФ — в холодильник пыли. Огарок + грубая пыль (14,35 т/ч, средневзвешенно 838 °C) охлаждаются в двухшнековом холодильнике **Holo-Screw Flite D2424-6** (шнеки 2×Ø610×7315 мм, теплосъём 57 м², вода в валы, шнеки и рубашку, 176,9 м³/ч, 25→35 °C) до 70 °C за ~64 мин; тонкая пыль — в холодильнике **S710-4** (Ø187×3048 мм, 1,95 м², вода 2,2 м³/ч) до 70 °C. Охлаждённые продукты шнеками загружаются в силосные башни (огарок 100 м³ с тензоконтролем CLF-300, пыль 10 м³) и отгружаются самотёком в автоцементовозы BULL-WABCO-45 (45 м³, рабочая температура груза ≤65 °C).\n\n**Участок 5. Аспирация.** Аспирационные отсосы предусматриваются от всех источников пыления: станции растаривания биг-бэгов, приёмных и расходных бункеров (вытеснение при загрузке), узлов пересыпки конвейеров, питателей и дозаторов, смесителя, узла загрузки печи, подбункерных пространств пылесборников КУ/циклона/ЭФ, шнековых холодильников, силосных башен (при загрузке и при наливе цементовозов). Аспирационный воздух очищается в **рукавном(ых) фильтре(ах)** с импульсной регенерацией и отводится дымососом(ами) аспирации на свечу; уловленная пыль возвращается в тракт оборотных материалов (бункер оборотной пыли) — безвозвратные потери пыли исключаются. Забор запылённого воздуха от узлов с цементной медью — коррозионностойкое исполнение воздуховодов. Аспирация сблокирована с технологическим оборудованием: пуск отсосов до пуска транспорта, запрет подачи материала при неработающей аспирации.","items":[{"label":"Барабанные вакуум-фильтры","value":"2 × 32 м² (расчётно 29,4 м²), 300 кг/(м²·ч), кек 10 % влаги, 9,8 т/ч","src":"ИД табл. 23 п.50-54, 46-49"},{"label":"Смеситель шихты","value":"СШ-25, 10–25 т/ч, 2 шнека, 10–30 об/мин","src":"ИД табл. 23 п.164-167"},{"label":"Печь КС: геометрия","value":"Ø6000/8390 мм, H=9200 мм, подина 28,27 м², 583 сопла","src":"ИД табл. 23 п.214-217"},{"label":"Температура кипящего слоя / время пребывания","value":"930 °C / 9 ч; единовременно 139 т","src":"ИД табл. 23 п.230, 232-233"},{"label":"Дутьё (осн./вспом.)","value":"11 342 нм³/ч, 52,0 % O₂, 25 °C / 19 146 нм³/ч, 30,8 % O₂, 455,3 °C","src":"ИД табл. 23 п.197-200, 223-225"},{"label":"Удельная производительность подины","value":"13,113 т/(м²·сут) по шихте; 2,626 т/(м²·сут) по сере","src":"ИД табл. 23 п.218-219"},{"label":"Цепочка газоочистки","value":"КУ (η 45 %) → циклон СЦН-50 (73,6 %) → ЭФ УГТ1-20-4 (99,7 %) → ДН-15БНЖ; суммарно 99,95 %","src":"ИД разд. 2.5; табл. 23 п.292, 328, 372, 399"},{"label":"Холодильник огарка","value":"D2424-6: 14,35 т/ч с 838 до 70 °C, вода 176,9 м³/ч (25→35 °C)","src":"ИД табл. 23 п.407-440"},{"label":"Отгрузка","value":"силосы 100 и 10 м³ → цементовозы 45 м³, груз ≤65 °C","src":"ИД табл. 23 п.474-499"}],"gost":[{"doc":"ФНП № 512 от 09.12.2020 «Правила безопасности процессов получения или применения металлов»","what":"Требования к печам КС, газоходам, пылеулавливанию, аварийной выгрузке, продувке азотом, бункерам и шнековым транспортёрам"},{"doc":"ФНП № 486 от 26.11.2020 «Правила безопасности … продуктов разделения воздуха»","what":"Кислородопровод, узел смешения дутья, арматура и обезжиривание кислородных линий, отсечка O₂"},{"doc":"ГОСТ 12.4.021-75","what":"Системы вентиляционные — общие требования к аспирационным установкам, блокировка с технологическим оборудованием"},{"doc":"СП 60.13330.2020","what":"Отопление, вентиляция и кондиционирование — воздухообмен цеха, компенсация аспирационных объёмов подогретым притоком"},{"doc":"ГОСТ 390-96, ГОСТ 8691-73, ГОСТ 6137-2015, ГОСТ 2850-95","what":"Огнеупоры (шамотный кирпич, форма и размеры, мертели) и асбестовый картон для футеровки печи КС — как указано в ИД п.1.3.6-1.3.9"},{"doc":"ГОСТ 32569-2013","what":"Технологические стальные трубопроводы — мазутопроводы, кислородопровод, паропроводы в границах цеха"}],"open":["Тип и число вакуум-насосов, объём ресивера, схема отвода фильтрата вакуум-фильтров — по ТКП поставщика фильтров на стадии БИ","Конструкция и привязка скоростного шнекового забрасывателя — по данным Челябинского цинкового завода (указание ИД табл. 23 п.191)","Схема мазутного узла в границах цеха (кондиционирование, пароспутники, циркуляция) — по ТУ на подключение","Количество и производительность рукавных фильтров и дымососов аспирации — по расчёту аспирационных объёмов на стадии БИ"]},{"id":"s04-matbalans","title":"Материальные балансы (сводный и по участкам)","kind":"calc","body":"**Сводный годовой баланс передела** (ИД табл. 22, основной вариант; сухие массы). Приход: концентрат 73 492 т + кек NNH 24 219 т + цементная медь 9 182 т = **106 892 т шихты**, в ней 71 264 т Cu, 4 043 т Ni, 191,4 т Co, 4 587 т Fe, 21 936 т S, 13,8 т Cl. Расход: огарок 81 896 т (76,98 %); пыль КУ 9 081 т + пыль циклона 8 165 т + пыль ЭФ 2 916 т + пыль в СКЦ 14 т = **20 175 т пыли** (18,96 %); сера в газ 21 307 т; хлор в газ 1,78 т; согласованные потери 502 т (0,47 %: обжиг 0,12 % + перевалка/транспортировка 0,25 % + гидрометаллургия 0,10 %). Суммарный выход твёрдых продуктов 123 883 т превышает загрузку на ~16 % — это **усвоенный кислород дутья**, связанный в оксиды (CuO, NiO, Fe₃O₄) и сульфаты; невязка по каждому металлу — 0,000 %. Распределение меди: 80,35 % в огарок, 19,18 % в пыль; серы: 97,13 % в газ, 2,21 % в пыль, 0,19 % в огарок — баланс серы задаёт и производительность СКЦ, и остаточное содержание S в огарке для выщелачивания.\n\n**Баланс по участкам.** (1) Фильтрация: приход пульпы 104 994 т/год (73 496 т тв. + 31 498 т воды, 70 % тв.); расход: кек 81 662 т/год (73 496 сух. + 8 166 воды, влажность 10 %) и фильтрат 23 332 м³/год в ОРФ. Проверка: 31 498 − 8 166 = 23 332 — **баланс воды сходится точно**. (2) Шихтовка: кек концентрата 81 662 + кек NNH влажный 30 273 (24 219 / 0,80) + цементная медь влажная 10 494 (9 182 / 0,875) = 122 429 т/год влажной шихты, средняя влажность 12,48 %, средняя сера 20,52 %; часовой максимум 15,448 т/ч. (3) Обжиг: приход — шихта 13,50 т/ч сух. (номинал) + дутьё 11 342 нм³/ч; расход — огарок 10,34 т/ч ном., пыль в газ 2,55 т/ч ном., газ 12 129 нм³/ч (SO₂ 17,83 %, H₂O 21,07 %, O₂ 16,21 %). Влага шихты (~1,9 т/ч) полностью переходит в газовую фазу. (4) Газоочистка (номинал/максимум с K=1,15): улов пыли КУ 1,319 т/ч, циклона 1,186 т/ч, ЭФ 0,424 т/ч, унос в СКЦ 1,32 кг/ч; объём газа нарастает подсосами 12 129 → 12 673 → 13 066 → 13 262 нм³/ч; запылённость падает 241,5 → 127,1 → 32,6 → 0,1 г/нм³. (5) Охлаждение-отгрузка: тракт огарка 14,346 т/ч (макс.) при годовых 99 142 т (огарок 81 896 + пыль КУ 9 081 + пыль циклона 8 165); тракт тонкой пыли 0,424 т/ч (2 916 т/год).\n\n**Методическое примечание.** Все часовые потоки таблицы 23 ИД — максимальные, с коэффициентом запаса 1,15 к номиналу (81 896 / 7920 = 10,34 т/ч × 1,15 = 11,89 т/ч огарка); годовые массы таблицы 22 — номинальные. В БИ материальный баланс оформляется в двух колонках «номинал / максимум» по каждому потоку; оборудование и КИП выбираются по максимуму, ТЭП — по номиналу. По вспомогательному варианту сводный баланс перестраивается: огарок 71 816 т (67,50 %), пыль 30 663 т (28,82 %) — рост пылевыноса в 1,5 раза при том же количестве серы в газ (21 307 т); тракт грубой пыли и КУ проверяются именно на этот режим.","items":[{"label":"Приход шихты (сухой)","value":"106 892 т/год = 73 492 + 24 219 + 9 182","src":"ИД табл. 22"},{"label":"Медь в шихте","value":"71 264 т/год (69,20 % из концентрата)","src":"ИД табл. 22"},{"label":"Огарок / пыль / потери (осн.)","value":"81 896 т (76,98 %) / 20 175 т (18,96 %) / 502 т (0,47 %)","src":"ИД табл. 22 стр.4-12"},{"label":"Огарок / пыль (вспом.)","value":"71 816 т (67,50 %) / 30 663 т (28,82 %)","src":"ИД табл. 22, расход вспом. вариант"},{"label":"Сера: в газ / в пыль / в огарок","value":"21 307 т (97,13 %) / 484 т (2,21 %) / 41,6 т (0,19 %)","src":"ИД табл. 22"},{"label":"Баланс воды фильтрации","value":"31 498 (пульпа) = 8 166 (кек) + 23 332 (фильтрат) т/год","src":"расчёт по ИД табл. 23 п.42-55, сходимость 0,0 %"},{"label":"Прирост массы при обжиге","value":"+16 % к загрузке — усвоенный кислород дутья","src":"ИД табл. 22, примечание"},{"label":"Коэффициент запаса часовых потоков","value":"1,15 (проверено: 10,34 × 1,15 = 11,892 т/ч огарка)","src":"ИД табл. 23 п.93; сверка табл. 22/23"}],"gost":[{"doc":"ГОСТ 21.401-88","what":"Состав и оформление технологической части (баланс как обязательное приложение к схеме материальных потоков марки ТХ)"},{"doc":"ГОСТ 8.417-2024 (ГСИ. Единицы величин)","what":"Представление балансов в СИ (т/год, нм³/ч) — требование ТЗ п.7.1 к редактируемым исходным данным"}],"open":["Баланс по микропримесям (Zn, Pb, As, Se, Te) и драгметаллам по продуктам обжига — в ИД заданы только входные содержания; распределение принять по данным Гипроникеля на стадии БИ","Регламент вовлечения оборотной пыли ЭФ в шихту (доля, периодичность) — технологическое решение стадии БИ, влияет на баланс серы в газ"]},{"id":"s05-teplobalans","title":"Тепловые балансы основного технологического оборудования (печь КС, котёл-утилизатор, холодильники)","kind":"calc","body":"**Печь КС, основной вариант.** Приход тепла — 36,74 ГДж/ч, единственная статья — экзотермика окисления шихты (2,378 ГДж/т × 15,448 т/ч, 100 %). Расход: с отходящими газами **51,50 %** (18,92 ГДж/ч), с огарком 19,49 % (7,16 ГДж/ч), на испарение влаги шихты 14,04 % (5,16 ГДж/ч), с обжиговой пылью 4,97 % (1,83 ГДж/ч), потери в окружающую среду 10,00 % (3,67 ГДж/ч ≈ 1,02 МВт). Баланс замыкается регулированием обогащения дутья кислородом: при 52,0 % O₂ объём газов минимален и автогенный режим удерживает слой на 930 °C без топлива. **Вспомогательный вариант**: приход 64,58 ГДж/ч, из них окисление шихты 75,42 % (48,71) и физическое тепло подогретого дутья 24,58 % (15,87 ГДж/ч — мазут 300 кг/ч через топку); расход: газы 60,96 % (39,37), огарок 12,89 % (8,32), влага 10,59 % (6,84), пыль 5,56 % (3,59), потери 10 % (6,46). Вывод: при деградации теплотворности шихты дефицит тепла покрывается либо концентрацией O₂ (снижение балласта N₂), либо энтальпией дутья — оба рычага заложены в схему автоматизации.\n\n**Котёл-утилизатор.** Тепловосприятие от газа 11,30 ГДж/ч (осн.) / 17,845 ГДж/ч (вспом.) при охлаждении газа 882,8→400 °C / 887,4→400 °C (на входе в КУ температура ниже печной за счёт холодных подсосов 4,9 %). Выработка перегретого пара 1,9 МПа / 375 °C: 4,102 / 6,476 т/ч. Проверка: (h₃₇₅°C,1,9МПа ≈ 3190 кДж/кг − h₁₀₅°C ≈ 440 кДж/кг) × 4,102 т/ч = 11,28 ГДж/ч — **сходится с балансом газа в пределах 0,2 %**; продувка 0,205/0,324 м³/ч (~5 % питательной воды) и потери изоляции покрываются этой невязкой. Выбор котла выполняется по вспомогательному варианту (больший объём и энтальпия газа — ИД разд. 2.5), номинал по газу до 30 000 нм³/ч, паропроизводительность до 7 т/ч.\n\n**Шнековые холодильники.** Огарок + грубая пыль: 14,346 т/ч охлаждаются с 837,6 до 70 °C, тепло к оборотной воде 7,391 ГДж/ч (вспом. 6,833); проверка по воде: 176,9 м³/ч × 4,187 × (35−25) = 7,41 ГДж/ч — сходимость 0,3 %. Резерв теплосъёма аппарата D2424-6 — 12,66 ГДж/ч (запас 1,7). Тонкая пыль: 0,424 т/ч, 387→70 °C, 0,092 ГДж/ч, вода 2,197 м³/ч. **Сводная утилизация тепла процесса (осн. вариант)**: из 36,74 ГДж/ч выделяющегося тепла в пар полезно переводится 11,3 ГДж/ч (31 %), в оборотную воду холодильников 7,48 ГДж/ч (20 %), с газом в СКЦ уходит ~7,5 ГДж/ч (387 °C — используется автотермичностью СКЦ), потери печи/КУ/газоходов в помещение и атмосферу ~10,5 ГДж/ч. Тепловой баланс газохода ЭФ→дымосос→СКЦ подтверждает температуру на границе 387 °C (падение 13 °C от КУ за счёт подсосов и теплопотерь тракта).","items":[{"label":"Тепловой эффект окисления шихты","value":"2,3783 ГДж/т; 36,74 / 48,71 ГДж/ч в слое","src":"ИД табл. 23 п.238-239"},{"label":"Баланс печи, расход (осн.)","value":"газы 51,50 % · огарок 19,49 % · влага 14,04 % · пыль 4,97 % · потери 10,0 %","src":"ИД табл. 23 п.240"},{"label":"Баланс печи, приход (вспом.)","value":"окисление 75,42 % + подогрев дутья 24,58 %","src":"ИД табл. 23 п.240"},{"label":"Тепловосприятие КУ","value":"11,30 / 17,845 ГДж/ч; газ 882,8→400 °C","src":"ИД табл. 23 п.278-281"},{"label":"Пар КУ","value":"4,102 / 6,476 т/ч (1,9 МПа, 375 °C), сходимость с энтальпийным расчётом ≤0,2 %","src":"ИД табл. 23 п.282; проверочный расчёт Исполнителя"},{"label":"Холодильник огарка: тепло к воде","value":"7,391 / 6,833 ГДж/ч при запасе аппарата до 12,66 ГДж/ч","src":"ИД табл. 23 п.420, 438"},{"label":"Потери печи в окружающую среду","value":"10 % = 3,67 / 6,46 ГДж/ч (≈1,0 / 1,8 МВт)","src":"ИД табл. 23 п.240; пересчёт"},{"label":"Температура газа на границе с СКЦ","value":"387,0 / 386,3 °C","src":"ИД табл. 23 п.403"}],"gost":[{"doc":"ФНП № 536 от 15.12.2020","what":"Котёл-утилизатор и паропроводы 1,9 МПа: регистрация, предохранительные устройства, водно-химический режим"},{"doc":"СП 89.13330.2016 «Котельные установки»","what":"В применимой части — компоновка КУ, питательные установки, РОУ"},{"doc":"РД 24.032.01-91","what":"Нормы качества питательной воды/пара и организация химконтроля КУ"},{"doc":"СП 61.13330.2012","what":"Тепловая изоляция оборудования и трубопроводов — назначение толщин по нормированной плотности теплового потока (влияет на статью «потери в окружающую среду»)"}],"open":["Постатейный тепловой баланс КУ (радиационная/конвективные поверхности, экономайзерная часть) — расчёт завода-изготовителя (Белэнергомаш-БЗЭМ / Энергоцветмет) на стадии БИ","Тепловые потери газоходов по участкам тракта — расчёт теплоизоляции на стадии БИ","Баланс мазутной топки-смесителя (факел 1805 °C → смесь 455 °C) — поверочный расчёт при выборе горелки ГМ-4,5"]},{"id":"s06-rashody","title":"Данные о расходах материалов, топлива и энергоресурсов","kind":"calc","body":"Расходные показатели приняты по ИД табл. 26 (нормировка на 71 264 т меди в шихте, 7920 ч/год); двойные значения — основной/вспомогательный вариант. **Электроэнергия**: на напряжении 380 В — 1 524 392 кВт·ч/год (21,39 кВт·ч/т Cu; средняя нагрузка ~192 кВт: крупнейшие потребители — смеситель СШ-25 37 кВт, конвейер УКВ-320-Ц-95 30 кВт, конвейеры УКВ-320-Ц-60 2×18,4 кВт, холодильник D2424-6 15 кВт и шнеки 11–15 кВт); на 6 кВ — дымосос ДН-15БНЖ 400 кВт, 3 168 000 кВт·ч/год (44,45 кВт·ч/т); питание электрофильтра (агрегат ОПМД-400, ~32 кВт) — 253 440 кВт·ч/год (3,56 кВт·ч/т). Итого по учтённому в ИД оборудованию ≈ **4,95 млн кВт·ч/год (69,4 кВт·ч/т Cu)** без воздуходувки, вакуум-насосов фильтрации и аспирации (в табл. 26 не нормированы — досчитываются на стадии БИ).\n\n**Дутьё и сжатый воздух**: технологический воздух 0,09–0,12 МПа — 52,71 млн нм³/год (осн., 739,6 нм³/т) / 99,89 млн нм³/год (вспом., 1401,7 нм³/т); технический кислород 96 % (0,8–1,2 МПа из сети) — 37,12 млн нм³/год (520,9 нм³/т) / 24,84 млн нм³/год (348,5 нм³/т) — кислород дороже воздуха, поэтому выбор варианта — экономический компромисс «кислород против мазута»; компрессорный воздух 0,3–0,5 МПа (пневмомеханизмы печи, размыв настылей, форсунки) — 5,04 млн нм³/год (осн.) / 30,42 млн нм³/год (вспом., включая распыл мазута). **Мазут М-100** (S ≤ 3,5 %): основной вариант — только на разогревы после остановок, 468 т/год (10 остановок × 16 ч × 3 горелки МГМГ-10 по 0,975 т/ч); вспомогательный — плюс непрерывная топка ГМ-4,5 (300 кг/ч): суммарно 2 844 т/год.\n\n**Вода**: питательная химочищенная для КУ (1,9 МПа, 105 °C, от КПО ЦЭО) — 34 111 / 53 856 т/год (пар + продувка); оборотная охлаждающая для холодильников (0,6 МПа, 25→35 °C) — 1 418 448 / 1 315 156 т/год (179,1 / 166,1 м³/ч суммарно). Возврат нагретой оборотной воды +10 °C — в оборотный цикл площадки. **Огнеупоры и футеровочные материалы** (шамот Ш-22/23/5/44/45, мертель, асбест, жидкое стекло) — расход по кампании печи: капремонт 1 раз в 3 года с полной перекладкой (29–31 сут), текущие ремонты 9–12 раз в год; годовой усреднённый расход огнеупоров определяется по проекту футеровки на стадии БИ. Выдаваемые энергоресурсы: перегретый пар 32 488 / 51 290 т/год (0,456/0,720 т/т Cu) — кредитуется в ТЭП комплекса.","items":[{"label":"Электроэнергия 0,4 кВ","value":"1 524 392 кВт·ч/год (21,391 кВт·ч/т Cu)","src":"ИД табл. 26, итог"},{"label":"Электроэнергия 6 кВ (дымосос)","value":"3 168 000 кВт·ч/год (44,454 кВт·ч/т Cu)","src":"ИД табл. 26"},{"label":"Электропитание ЭФ","value":"253 440 кВт·ч/год (3,556 кВт·ч/т Cu)","src":"ИД табл. 26"},{"label":"Кислород технический 96 %","value":"37,121 / 24,837 млн нм³/год (520,9 / 348,5 нм³/т)","src":"ИД табл. 26"},{"label":"Технологический воздух","value":"52,708 / 99,887 млн нм³/год (739,6 / 1401,7 нм³/т)","src":"ИД табл. 26"},{"label":"Компрессорный воздух","value":"5,04 / 30,42 млн нм³/год (70,7 / 426,9 нм³/т)","src":"ИД табл. 26"},{"label":"Мазут М-100","value":"468 / 2 844 т/год (0,0066 / 0,0399 т/т Cu)","src":"ИД табл. 26; разд. 1.3.5"},{"label":"Питательная вода ХОВ","value":"34 111 / 53 856 т/год (1,9 МПа, 105 °C)","src":"ИД табл. 26"},{"label":"Оборотная вода","value":"1 418 448 / 1 315 156 т/год (0,6 МПа, 25→35 °C)","src":"ИД табл. 26"},{"label":"Выдача пара (кредит)","value":"32 488 / 51 290 т/год (1,9 МПа, 375 °C до РОУ)","src":"ИД табл. 26"}],"gost":[{"doc":"ГОСТ 5583-78","what":"Кислород технический — качество, давление поставки"},{"doc":"ГОСТ 10585-2013","what":"Мазут М-100 — качество топлива, сернистость"},{"doc":"ГОСТ Р 8.596-2002 и 102-ФЗ","what":"Метрологическое обеспечение узлов коммерческого/технического учёта электроэнергии, кислорода, пара, воды, мазута"},{"doc":"ГОСТ 8.586.1-2005 (ИСО 5167-1)","what":"Измерение расходов сред сужающими устройствами — узлы учёта пара и дутья (при выборе этого метода)"}],"open":["Мощность и расход воздуходувки дутья, вакуум-насосов фильтрации, дымососов аспирации — досчитать при выборе оборудования (в табл. 26 ИД отсутствуют)","Годовой расход огнеупоров и футеровочных материалов — по проекту футеровки печи КС (кампания 3 года)","Расход азота на аварийную продувку печи (подача по кислородной линии) — определить ёмкость/источник на стадии БИ"]},{"id":"s07-celevye","title":"Целевые показатели технологического процесса (выходы и составы огарка, пылей, газов для СКЦ)","kind":"pz","body":"Целевые показатели БИ формируются как технологические гарантии поставки и подлежат подтверждению при гарантийных испытаниях. **По огарку**: выход 76,98 % от сухой шихты (81 896 т/год); химсостав, %: 69,92 Cu; 4,00 Ni; 0,19 Co; 4,34 Fe; **S ≤ 0,1 (расчётно 0,051)**; Cl 0,010; сульфатная сера — отсутствие; форма меди — тенорит CuO 87,2 %, железо на 90 % связано в магнетит, никель — в бунзенит/треворит (малорастворимые при сернокислотном выщелачивании — ключевое условие селективности ГМЦ). Достигается «обжигом намертво» при 930 °C, α = 1,5 и времени пребывания 9 ч. Гранулометрия огарка — средняя крупность 0,449 мм (без измельчения, операция исключена по требованию Заказчика — контроль укрупнения возложен на температурный режим: при >960–970 °C начинается массовая агломерация, при <900 °C — истирание).\n\n**По пылям**: суммарный выход 18,96 %; «грубая» пыль (КУ + циклон, 17 246 т/год) объединяется с огарком — общий продукт тракта огарка имеет состав, %: 72,67 Cu (для смеси по табл. 23 п.477); 0,445 S; «тонкая» пыль ЭФ (2 916 т/год) — отдельный продукт: 63,18 Cu; 4,45 Ni; 6,29 Fe; **3,44 S** (сульфатной 3,36) — повышенная сульфатность и мелкодисперсность (28,8 мкм) определяют отдельный тракт и опцию возврата в шихту. Температура отгрузки обоих продуктов **70 °C** (ограничение цементовоза 65 °C по грузу — уставка контроля с запасом до 65 °C на фланце выгрузки).\n\n**По газу для СКЦ**: расход 13 262 нм³/ч (осн.) / 21 830 нм³/ч (вспом.); **SO₂ 15,59 / 9,49 %** (внутрипечное 17,83 / 10,87 % — разбавление подсосами 9,5 %); SO₃ 0,72 / 0,44 %; O₂ 16,33 / 10,66 %; H₂O 19,27 / 13,26 %; HCl ~6 ppm; температура 387 °C; запылённость **не более 0,1 г/нм³** при суммарной эффективности пылеочистки 99,955 %. Стабильность SO₂ и расхода — предмет контура стабилизации (см. раздел АСУТП): для контактного аппарата СКЦ колебания концентрации важнее абсолютного уровня. Показатели пылеочистки по ступеням: КУ 45,0 %, циклон 73,6 %, ЭФ ≥96 % (расчётно 99,69 %). **Сквозное извлечение серы в газ 97,13 %** — целевой показатель для увязки с производительностью СКЦ (21 307 т S/год ≈ 65,3 тыс. т H₂SO₄-эквивалента в год).","items":[{"label":"Сера в огарке","value":"≤0,1 % (расчёт 0,051 %), сульфатной 0,00 %","src":"ИД разд. 2.3; табл. 23 п.243"},{"label":"Медь в огарке","value":"69,92 % (CuO 87,2 % вещественно)","src":"ИД табл. 23 п.243-244"},{"label":"Тонкая пыль ЭФ","value":"2 916 т/год; Cu 63,18 %, S 3,44 %","src":"ИД табл. 22 стр.7; табл. 23 п.365"},{"label":"SO₂ в газе на СКЦ","value":"15,589 % (осн.) / 9,493 % (вспом.)","src":"ИД табл. 23 п.401"},{"label":"Запылённость газа на СКЦ","value":"≤0,1 г/нм³ (≤100 мг/нм³)","src":"ИД разд. 2.5; табл. 23 п.402"},{"label":"Температура газа на СКЦ","value":"387 °C","src":"ИД табл. 23 п.403"},{"label":"Извлечение серы в газ","value":"97,13 % (21 307 т/год)","src":"ИД табл. 22 стр.10"},{"label":"Температура отгрузки огарка/пыли","value":"70 °C (ограничение цементовоза 65 °C)","src":"ИД табл. 23 п.434, 462, 499"}],"gost":[{"doc":"ГОСТ 2.114-2016 / ТУ поставки","what":"Оформление гарантируемых показателей в технических условиях на комплектную поставку (технологические гарантии БИ)"},{"doc":"ГОСТ Р 8.596-2002","what":"Аттестация измерительных каналов, по которым подтверждаются гарантийные показатели (SO₂, запылённость, температуры)"}],"open":["Допустимые диапазоны колебаний SO₂ и расхода газа для контактного отделения СКЦ — согласовать с эксплуатацией СКЦ (задаёт жёсткость контура стабилизации)","Методика и приборы гарантийных замеров запылённости 0,1 г/нм³ (гравиметрия по точкам отбора) — программа испытаний на стадии БИ"]},{"id":"s08-oborudovanie","title":"Перечень основного и вспомогательного технологического оборудования","kind":"pz","body":"Состав оборудования принят по ИД табл. 23, 24Б и разделу НЗП; полная ведомость с характеристиками, массой и энергопотреблением оформляется спецификацией по ГОСТ 21.110-2013. **Ядро линии (нестандартное/изготовление)**: печь КС HATCH (Ø6000/8390 мм, 583 сопла, футеровка шамотом; изготовление по КД лицензиара), котёл-утилизатор (проектируется заново; изготовители-кандидаты ООО «Белэнергомаш-БЗЭМ», ОАО «Энергоцветмет»; до 30 000 нм³/ч, пар до 7 т/ч, 1,9 МПа/375 °C), скоростной шнековый забрасыватель шихты (по референсу ЧЦЗ), мазутная топка-смеситель дутья с горелкой ГМ-4,5 (5,22 МВт) и три разогревные горелки МГМГ-10.\n\n**Серийное оборудование (закуп)**: одиночный циклон СЦН-50-1800×1УП (1 шт., 1,19 т); электрофильтры УГТ1-20-4 (2 шт., по 72,6 т, габарит 18 110×4 790×18 695 мм, агрегаты ОПМД-400); дымососы ДН-15БНЖ (2 шт., двигатель ДА304-400Х-4: 400 кВт, 6 кВ, 1500 об/мин); шнековые холодильники Holo-Screw Flite D2424-6 (огарок; 57 м²) и S710-4 (тонкая пыль; 1,95 м²); барабанные вакуум-фильтры 2×32 м² с вакуум-станцией; станция растаривания биг-бэгов (ГК КИП-Сервис); дисковые питатели ZC300 (2), ZC800 (1), ZC1200 (1), ZC1500 (2); ленточные весовые дозаторы 4488 ДН-У-1-X (X = 3,2/4/5/16 — по 1 шт., X = 25 — 2 шт.); двухшнековый смеситель СШ-25; винтовые конвейеры УКВ-200/320 (7+ шт.); реверсивные ленточные конвейеры (5 шт.); силосные башни 100 м³ и 10 м³ (НПО «Спецнефтемаш») с виброразгружателями и тензоконтролем CLF-300; автоцементовозы BULL-WABCO-45 (45 м³). **Ёмкостное/бункерное хозяйство**: приёмные бункеры 60/20/10/50(+20) м³, расходные 2×60 м³ — изготовление, футеровка PE500, вибрационные аэраторы VBS.\n\nМатериальное исполнение: тракты цементной меди и шихты — AISI 316 / 12Х18Н10Т (в ИД марка стали циклона/ЭФ/дымососа напечатана как «12Х1812Т» — принимается **12Х18Н10Т**, нормализация опечатки согласована с данными табл. 24Б); газоход — 09Г2С с футеровкой легковесом ШЛ-0,4; сопла — ХН78Т. Резервирование: ЭФ 2×100 %, дымососы 2×100 %, вакуум-фильтры 2×100 % по площади, остальное — по запасу производительности 1,15. Оборудование в ИД указано с конкретными изготовителями — в БИ по каждой позиции запрашиваются ТКП не менее 2–3 поставщиков (ТЗ п.3.6) с проверкой аналогов; отклонения от референсных марок допускаются при подтверждении характеристик.","items":[{"label":"Печь КС","value":"1 шт., 10–16 т/ч по шихте, изготовление","src":"ИД табл. 24Б"},{"label":"Котёл-утилизатор","value":"1 шт., до 30 000 нм³/ч, перепроектируется","src":"ИД табл. 23 п.264-272; табл. 24Б"},{"label":"Электрофильтр УГТ1-20-4","value":"2 шт. (1 резерв), по 72,6 т","src":"ИД табл. 23 п.331, 355"},{"label":"Дымосос ДН-15БНЖ","value":"2 шт. (1 резерв), 400 кВт, 6 кВ, 1500 об/мин","src":"ИД табл. 23 п.380-392"},{"label":"Холодильники Holo-Screw Flite","value":"D2424-6 (1 шт.) и S710-4 (1 шт.), сталь 316","src":"ИД табл. 23 п.407-449"},{"label":"Вакуум-фильтры","value":"2 × 32 м² барабанные","src":"ИД табл. 23 п.52-54"},{"label":"Питатели/дозаторы/конвейеры","value":"ZC300…ZC1500 — 6 шт.; дозаторы — 6 шт.; УКВ — 7+ шт.; лента — 5 шт.","src":"ИД табл. 24Б; разд. 5 (НЗП)"},{"label":"Силосные башни","value":"100 м³ (огарок+грубая пыль) и 10 м³ (тонкая пыль)","src":"ИД табл. 23 п.475, 486"}],"gost":[{"doc":"ГОСТ 21.110-2013","what":"Правила выполнения спецификации оборудования, изделий и материалов"},{"doc":"ТР ТС 010/2011","what":"Безопасность машин и оборудования — декларирование/сертификация всех механизмов"},{"doc":"ТР ТС 032/2013","what":"Оборудование под давлением — КУ, ресиверы, паропроводы"},{"doc":"ГОСТ 15150-69","what":"Климатическое исполнение оборудования (УХЛ4 в отапливаемых помещениях; УХЛ1 — наружные установки)"},{"doc":"ГОСТ 12.2.003-91","what":"Общие требования безопасности к производственному оборудованию (ограждения, блокировки шнеков и конвейеров)"}],"open":["Замена/аналог холодильников Holo-Screw Flite (Metso-Outotec; изготовители Индия/КНР) с учётом санкционных ограничений — проработка альтернатив в ТКП","Конструкция и изготовитель печи КС: правовой режим использования проекта HATCH — уточнить у Заказчика","Тип и параметры воздуходувки дутья (ТЗ п.3.4 требует включить в БИ; в ИД характеристик нет) — выбрать на стадии БИ (см. раздел фундаментов)"]},{"id":"s09-elektro","title":"Электроснабжение и электрооборудование (по Приложению №3 к ТЗ)","kind":"pz","body":"**Электрические нагрузки.** По нормированному в ИД оборудованию: установленная мощность на 0,4 кВ ~194 кВт (средняя нагрузка 192 кВт — сходится с годовым расходом 1,524 млн кВт·ч); на 6 кВ — дымосос 400 кВт (рабочий; второй — резерв, АВР); электрофильтр — агрегат ОПМД-400 (80 кВ выпрямленного, потребление ~32 кВт, два агрегатных поста при двух ЭФ). Сверх ИД в расчётную нагрузку цеха включаются: воздуходувка дутья (оценка Исполнителя 315–400 кВт на 6 кВ или 0,4 кВ — по расчёту N = Q·Δp/η при Q до 15,7 тыс. нм³/ч и Δp ≈ 60 кПа, уточняется выбором машины), вакуум-станция фильтрации (~2×90 кВт, оценка по аналогам БОФ), дымосос(ы) и рукавные фильтры аспирации (~75–110 кВт, по расчёту аспирации), электроприводы арматуры, обогрев КИП, освещение, вентиляция, мостовые краны. **Предварительная расчётная мощность цеха 1,1–1,4 МВт** (оценка для запроса ТУ; подтверждается сводной таблицей электроприёмников на стадии БИ с указанием пусковых токов и коэффициентов одновременности — требование Приложения №3).\n\n**Категорийность по ПУЭ**: I категория — дымососы тракта (остановка эвакуации газа с SO₂ 16 % недопустима), воздуходувка дутья, питательные насосы КУ, аварийное освещение, АСУТП (по Прил. №5 — I «особая» для серверов с ИБП двойного преобразования ≥10 мин и байпасом); II категория — тракты шихтоподготовки и отгрузки (резервируются бункерными запасами); III — ремонтные потребители. Схема: двухтрансформаторная КТП 6/0,4 кВ с АВР на секционном выключателе (мощность трансформаторов — по расчётной нагрузке, предварительно 2×1000 кВА, уточняется), РУ-6 кВ для дымососов/воздуходувки; для двигателя 400 кВт 6 кВ — прямой пуск с проверкой посадки напряжения либо УПП/ЧРП (ЧРП предпочтителен и как орган регулирования тяги — см. P&ID). Компенсация реактивной мощности — конденсаторные установки 0,4 кВ до cosφ ≥ 0,95 (требование сетевой организации по ТУ).\n\n**Электробезопасность и монтаж**: заземление — контур с использованием фундаментов, TN-S для 0,4 кВ; молниезащита здания и наружных сооружений (силосы, свеча аспирации, газоход) по СО 153-34.21.122-2003 / РД 34.21.122-87; агрегаты ЭФ — отдельный контур заземления, ограждение и блокировка доступа в изоляторные коробки (80 кВ). Взрывоопасные зоны: мазутное хозяйство (класс зоны по ГОСТ IEC 60079-10-1 — мазут с t всп. >61 °C, зоны нормируются локально у форсуночного узла), кислородопровод — зоны повышенной пожароопасности (обезжиривание, запрет масел). Кабели — с медными жилами, не распространяющие горение (нг-LS), трассы КИПиА отдельно от силовых (Прил. №5); вблизи печи и газоходов — термостойкие. В составе БИ выпускаются: ПЗ с расчётом нагрузок, однолинейные схемы всех уровней, планы сетей и электрооборудования, расчёт токов КЗ для выбора аппаратов, чертежи взрывоопасных зон, спецификации и опросные листы на трансформаторы, КРУ/РУНН, ЧРП/УПП, ИБП, ДГУ (при обосновании) — объём по Приложению №3.","items":[{"label":"Нагрузка 0,4 кВ по ИД","value":"~194 кВт установленной (1,524 млн кВт·ч/год)","src":"ИД табл. 26 (суммирование Исполнителем)"},{"label":"Дымосос","value":"400 кВт, 6 кВ, 1500 об/мин, 2 шт. (1 резерв, АВР)","src":"ИД табл. 23 п.387-391"},{"label":"Электрофильтр","value":"ОПМД-400: до 80 кВ / 400 мА (~32 кВт), раб. 46,4–57,6 кВ","src":"ИД табл. 23 п.349-351, 362"},{"label":"Воздуходувка (оценка)","value":"315–400 кВт при Δp ≈ 60 кПа — определяется на стадии БИ","src":"оценка Исполнителя по ИД табл. 23 п.197-199, 226-228"},{"label":"Расчётная мощность цеха (предв.)","value":"1,1–1,4 МВт — для запроса ТУ","src":"оценка Исполнителя (сводная таблица — на стадии БИ)"},{"label":"Категория АСУТП","value":"I «особая», ИБП двойного преобразования ≥10 мин с байпасом","src":"Приложение №5, п.3.2"}],"gost":[{"doc":"ПУЭ (7 изд.)","what":"Категории надёжности (п.1.2.17–1.2.21), выбор сечений, защитные меры; классы зон"},{"doc":"СП 76.13330.2016","what":"Электротехнические устройства — производство и приёмка электромонтажных работ"},{"doc":"ГОСТ 32144-2013","what":"Нормы качества электроэнергии в точках присоединения (проверка при пуске 400-кВт двигателя)"},{"doc":"СО 153-34.21.122-2003 и РД 34.21.122-87","what":"Молниезащита здания, силосов, свечи аспирации"},{"doc":"ГОСТ IEC 60079-10-1","what":"Классификация взрывоопасных зон (мазутный узел) — требование Приложения №3"},{"doc":"ГОСТ 12.2.007.0-75","what":"Электробезопасность изделий — в т.ч. агрегаты питания ЭФ 80 кВ"},{"doc":"ТР ТС 004/2011, ТР ТС 020/2011","what":"Низковольтное оборудование и ЭМС"}],"open":["ТУ на технологическое присоединение (точки подключения 6 кВ, разрешённая мощность) — запрашиваются Заказчиком по расчёту нагрузок БИ","Необходимость ДГУ/ИБП для безаварийного останова (дожим эвакуации газа при потере сети) — анализ сценариев обесточивания на стадии БИ","Выбор пуска двигателя дымососа (прямой/УПП/ЧРП) — расчёт посадки напряжения по данным ТУ"]},{"id":"s10-vybrosy","title":"Выбросы в атмосферу: аспирационные газы до и после очистки","kind":"calc","body":"Организованный источник выброса цеха — **свеча аспирационной установки** после рукавных фильтров (технологический газ печи КС выбросом не является — он передаётся в СКЦ как сырьё, граница по выходному патрубку дымососа). Качественный состав аспирационного воздуха до очистки: пыль перерабатываемых материалов — медный концентрат (Cu 67,1 %, Ni 4,2 %; по ГОСТ 12.1.005 материал отнесён ко II классу опасности — ИД разд. 6), кек NNH (Cu 55 %, сульфаты меди), цементная медь (Cu 94 %), шихта, огарок и обжиговая пыль (CuO 70–87 %, NiO 4,7–5,7 %, CuSO₄ до 16,7 % в тонкой пыли); присутствие никеля (канцероген) определяет жёсткие требования к остаточной запылённости и контролю воздуха рабочей зоны. Газовая фаза — воздух; следовые количества SO₂ возможны от узла загрузки печи и укрытий горячих трактов (печь работает при +50–100 Па в надслоевом пространстве, поэтому укрытия узла загрузки и порогов выгрузки включаются в аспирацию с гарантированным разрежением).\n\n**Количественные показатели.** Суммарный объём аспирации определяется на стадии БИ поаппаратным расчётом отсосов (укрытия пересыпок, бункеры, растаривание, силосы, налив цементовозов); предварительная оценка Исполнителя для запроса ТКП рукавных фильтров — **20–35 тыс. м³/ч**. Запылённость до очистки — от 0,2–0,5 г/м³ (общеобменные отсосы) до 3–10 г/м³ (укрытия пересыпок и растаривание; диапазоны — опыт аналогичных переделов, подлежат уточнению). Принимаемое проектное требование к рукавным фильтрам: остаточная запылённость **не более 10 мг/нм³** (гарантия современных импульсных фильтров; закладывается в опросные листы). Верхняя оценка валового выброса пыли: 35 000 м³/ч × 10 мг/м³ × 7920 ч = **≤ 2,8 т/год** твёрдых (в пересчёте на Cu ≤ 1,9 т/год, Ni ≤ 0,13 т/год); фактические значения — по расчёту после фиксации объёмов аспирации. Уловленная фильтрами пыль (расчётно 500–2500 т/год при исходной запылённости 2–10 г/м³) полностью возвращается в технологию через бункер оборотных материалов — схема без твёрдых отходов.\n\nВ составе БИ приводится таблица «источник → объём → концентрация до/после → валовый выброс» по каждому отсосу; высота свечи и приземные концентрации проверяются расчётом рассеивания по МРР-2017 (приказ Минприроды № 273 от 06.06.2017) на стадии ОТР с учётом фоновых концентраций промплощадки; нормативы ПДВ оформляются в составе разрешительной документации Заказчика. Контроль после очистки — стационарный пылемер на свече + периодический гравиметрический отбор.","items":[{"label":"Остаточная запылённость после рукавных фильтров","value":"≤10 мг/нм³ — проектное требование к поставщику","src":"решение БИ (закладывается в ОЛ); в ИД не нормировано"},{"label":"Объём аспирации (предв.)","value":"20–35 тыс. м³/ч — уточняется поаппаратным расчётом","src":"оценка Исполнителя"},{"label":"Валовый выброс пыли (верхняя оценка)","value":"≤2,8 т/год (Cu ≤1,9; Ni ≤0,13)","src":"расчёт Исполнителя: 35 000 м³/ч × 10 мг/м³ × 7920 ч"},{"label":"Класс опасности концентрата","value":"II класс по ГОСТ 12.1.005","src":"ИД разд. 6 (ТУ 24.44.11-237-48200234-2017)"},{"label":"Возврат уловленной пыли","value":"100 % в шихту (бункер оборотных материалов)","src":"ИД разд. 2.2; ТЗ п.3.4"}],"gost":[{"doc":"96-ФЗ «Об охране атмосферного воздуха»","what":"Нормирование выбросов, инвентаризация источников"},{"doc":"Приказ Минприроды № 273 от 06.06.2017 (МРР-2017)","what":"Методы расчёта рассеивания — высота свечи, приземные концентрации"},{"doc":"ГОСТ 17.2.3.02-2014","what":"Правила установления допустимых выбросов (ПДВ)"},{"doc":"СанПиН 1.2.3685-21","what":"Гигиенические нормативы: ПДК меди, никеля (канцероген), SO₂ в атмосферном воздухе и воздухе рабочей зоны"},{"doc":"ГОСТ 12.1.005-88","what":"Воздух рабочей зоны — классификация вредных веществ, контроль (SO₂ ПДКрз 10 мг/м³)"},{"doc":"СанПиН 2.2.1/2.1.1.1200-03","what":"Санитарно-защитная зона — проверка достаточности существующей СЗЗ промплощадки КГМК"}],"open":["Поаппаратный расчёт объёмов аспирации и запылённости до очистки — стадия БИ (определяет типоразмер фильтров)","Высота и диаметр свечи — расчёт рассеивания МРР-2017 с фоном промплощадки (стадия ОТР)","Неорганизованные источники (ворота, налив цементовозов вне укрытий) — оценка и мероприятия на стадии ОТР"]},{"id":"s11-seti","title":"Предварительные данные по подключению к сетям водо-, энерго- и воздухоснабжения","kind":"pz","body":"Потребности цеха для запроса ТУ (по ИД табл. 23, 26; двойные значения осн./вспом.): **электроэнергия** — предварительно 1,1–1,4 МВт расчётной мощности, ввод 6 кВ (двигатели 400 кВт) + КТП 6/0,4 кВ; **кислород технический 96 %** — 4 687 / 3 136 нм³/ч, давление сети 0,8–1,2 МПа (поставка с существующей кислородной станции площадки; граница — фланец на стене цеха, ТЗ п.3.3.8); **технологический воздух** дутья — вырабатывается собственной воздуходувкой цеха (атмосферный забор с фильтрацией), сеть не требуется; **компрессорный воздух** 0,3–0,5 МПа — 636 / 3 841 нм³/ч в среднем (5,04 / 30,42 млн нм³/год; пики при работе форсунок и обдувке — буферный ресивер в цехе), плюс осушенный воздух КИП по ГОСТ 17433 (класс загрязнённости 1) от блока подготовки с точкой росы −40 °C; **пар** — цех является нетто-источником: выдача 4,1–6,5 т/ч (0,6 МПа, 159 °C после РОУ) в паросеть площадки, при остановках печи — обратный приём пара на разогрев мазутных спутников (величина — на стадии БИ); **химочищенная вода** — 4,3 / 6,8 т/ч (105 °C, от КПО ЦЭО; граница — всас питательных насосов КУ, ТЗ п.3.3.12); **оборотная вода** — 179,1 / 166,1 м³/ч (подача 25 °C / возврат 35 °C, 0,6 МПа; содержание взвесей ≤15 мг/л по ИД п.1.3.10); **мазут М-100** — среднегодовой расход мал (468 / 2 844 т/год), но подключение рассчитывается на максимум одновременной работы трёх МГМГ-10 (2,82 т/ч) + ГМ-4,5 (0,46 т/ч) ≈ **3,3 т/ч** с подогревом и циркуляцией (граница — фланец на стене цеха, ТЗ п.3.3.7); **хозпитьевая вода и стоки** — санитарно-бытовые нужды персонала + продувка КУ 0,21–0,32 м³/ч (после охлаждения — в утилизацию стоков согласно ИД разд. 2.5).\n\nОсобенность площадки — субарктический климат: все наружные сети (оборотная вода, мазут, пульпопровод концентрата, пар) — с тепловым сопровождением и изоляцией; пульпопровод и возврат сливов в ОРФ — косвенно обогреваемые (прямое указание ИД разд. 4). По каждой точке в БИ выдаётся: расход (номинал/максимум), параметры среды, диаметр и отметка фланца границы, требования к резервированию. Точки подключения фиксируются после получения ТУ Заказчика (ТЗ п.3.3.7–3.3.13 — «уточняется при разработке БИ и ОТР»).","items":[{"label":"Кислород из сети","value":"4 687 / 3 136 нм³/ч при 0,8–1,2 МПа","src":"ИД табл. 23 п.198; табл. 26"},{"label":"Компрессорный воздух","value":"636 / 3 841 нм³/ч средний (0,3–0,5 МПа)","src":"ИД табл. 26 (пересчёт на час)"},{"label":"ХОВ на КУ","value":"4,31 / 6,80 т/ч, 105 °C","src":"ИД табл. 26; табл. 23 п.269"},{"label":"Оборотная вода","value":"179,1 / 166,1 м³/ч, 25→35 °C, ≤15 мг/л взвесей","src":"ИД табл. 23 п.435, 463; п.1.3.10"},{"label":"Мазут: максимум подключения","value":"≈3,3 т/ч (3×МГМГ-10 + ГМ-4,5)","src":"расчёт по ИД табл. 23 п.204 и разд. 2.4"},{"label":"Выдача пара в сеть","value":"4,1 / 6,5 т/ч (0,6 МПа после РОУ)","src":"ИД разд. 2.5"}],"gost":[{"doc":"ГОСТ 17433-80","what":"Промышленная чистота. Сжатый воздух — классы загрязнённости для воздуха КИП"},{"doc":"СП 30.13330.2020","what":"Внутренний водопровод и канализация — хозбытовые системы цеха"},{"doc":"СП 61.13330.2012","what":"Тепловая изоляция наружных сетей в климате IIА"},{"doc":"ФНП № 486 от 26.11.2020","what":"Кислородопроводы от сети площадки до узла смешения"}],"open":["ТУ по всем средам (ТЗ п.3.3.7–3.3.13) — запрос Заказчику по данным настоящего раздела","Схема утилизации продувочной воды КУ (0,2–0,35 м³/ч) — увязка с очистными площадки","Баланс сжатого воздуха КИП (потребители пневмоостровов) — после расстановки арматуры на P&ID"]},{"id":"s12-asutp-ml","title":"Автоматизация цеха обжига: АСУТП и система оптимизации режимов с машинным обучением","kind":"pz","body":"**Архитектура АСУТП** — трёхуровневая по Приложению №5. Нижний уровень: датчики и ИМ, унифицированные с парком КГМК (4–20 мА/HART, Modbus; датчики положения — индуктивные), исполнение ≥IP65, температурные точки печи — термопары ТХА в защитных чехлах из жаропрочных сплавов. Средний уровень: резервированные ПЛК **REGUL RX00 (Прософт-Системы)** и/или **АБАК (НИЦ Инкомсистем)**; здесь реализуются все базовые контуры регулирования, защиты и блокировки — работоспособность передела не зависит от верхних уровней; запас каналов ввода-вывода ≥30 % по каждому типу; гальваническая развязка всех каналов; модули с защитным покрытием. Верхний уровень: SCADA **AlphaScada (АО «Атомик Софт») на ОС Linux**, горячее резервирование серверов, АРМ безвентиляторные (≤2 мониторов), архивирование в ХТД PIMS, интеграция с единой диспетчерской комплекса ОВЭ (ТЗ п.2.10: все переделы — в одну информационно-управляющую систему). Питание — I категория «особая»: ИБП двойного преобразования ≥10 мин, автоматический байпас; SNMP-мониторинг всей инфраструктуры. Сеть — Industrial Ethernet (IEEE 802.3), TCP/IP, кольцевые топологии промышленных управляемых коммутаторов; шкафы IP65 с избыточным давлением очищенного воздуха, силовые и контроллерные шкафы раздельно; пневмоострова — в отдельных шкафах пневмоуправления с воздухоподготовкой.\n\n**Система оптимизации с машинным обучением (МЛ-оптимизатор)** — прямое требование ТЗ п.3.5: автоматическое поддержание оптимальных режимов с взаимосвязанным изменением дутьевого режима, обогащения дутья кислородом, разрежения под сводом, температур в точках кипящего слоя и отходящих газов, содержания SO₂ — в функции внешних условий, сырьевой загрузки и состава шихты. Принятая архитектура — **«советчик-оптимизатор над стабилизирующим слоем ПИД»** (двухконтурная): (1) стабилизирующий слой в ПЛК — классические контуры (см. P&ID), всегда активен; (2) оптимизирующий слой — выделенный резервированный сервер в сети АСУТП (Linux), функционально: динамическая прогнозная модель печи (гибрид: физико-химический баланс по ИД табл. 22–23 + data-driven модель — градиентный бустинг/рекуррентная сеть, прогноз T слоя и SO₂ на горизонте 5–15 мин) и оптимизатор в идеологии MPC, который каждые 1–5 мин пересчитывает **уставки** контурам ПЛК: расход шихты, соотношение O₂/воздух (в пределах 50–54 % осн. / 30–32 % вспом.), тягу дымососа, уставку выгрузки огарка. Критерий: стабилизация T слоя 930 °C (коридор ±10 °C против ±25–30 при ручном ведении) и максимизация/стабилизация SO₂ в газе на СКЦ при ограничениях (T ≤ 960 °C — агломерация, ≥900 °C — истирание; O₂ в отходящих ≥ уставки дожига; предельная запылённость). Входной вектор ~40–60 тегов: 4 весовых расхода и 4 влажности компонентов шихты, расходы/давления воздуха и O₂, многоточечные T слоя (не менее 5 термопар на разных радиусах/высотах), T свода и газов по тракту, перепад «коробка–слой», разрежение/давление под сводом, газоанализ SO₂/O₂ (на выходе печи и перед СКЦ), паропроизводительность КУ (косвенный калориметр процесса), токи дымососа и воздуходувки.\n\n**Обучение и жизненный цикл модели**: первичное обучение — на архивах пусконаладки и данных печей-аналогов КС РЦ КГМК; далее — периодическое дообучение на скользящем окне (30–90 сут) с автоматической валидацией на отложенной выборке и контролем дрейфа данных; версионирование моделей, приёмка новой версии — в «теневом режиме» (советы рассчитываются, но не применяются) с KPI-сравнением. **Отказоустойчивость — ключевое проектное решение**: МЛ-слой физически не может писать в ИМ — только уставки контурам ПЛК, ограниченные в самом ПЛК жёсткими клампами (min/max) и градиентными ограничителями скорости изменения; сторожевой таймер: при потере связи с сервером, недостоверности входов (обрыв, заморозка сигнала, выход за физические границы) или отклонении прогноза от факта сверх порога — безударный откат на последние валидные уставки и ведение процесса классическими ПИД с сигнализацией оператору. Режимы управления по Прил. №5: автоматический (основной), автоматизированный (советчик), дистанционный ручной, местный наладочный. Документация АСУТП — по ГОСТ 21.408-2013 и СТО 51246464-016-2015, методология жизненного цикла — М ГК НН IT.1.8-2025; в составе БИ: структурная схема КТС, перечни сигналов (AI/AO/DI/DO/Modbus), перечень контуров и блокировок с уставками, спецификация КИПиА, опросные листы, ТЗ на МЛ-подсистему по ГОСТ 34.602.","items":[{"label":"ПЛК","value":"REGUL RX00 / АБАК, резервирование, запас каналов ≥30 %","src":"Приложение №5, п.2"},{"label":"SCADA","value":"AlphaScada (Атомик Софт), Linux, горячий резерв","src":"Приложение №5, п.2"},{"label":"Управляемые переменные МЛ-контура","value":"дутьё, доля O₂, разрежение под сводом, T слоя и газов, SO₂","src":"ТЗ п.3.5 (требование Заказчика)"},{"label":"Коридор удержания T слоя","value":"930 ±10 °C (цель МЛ; технологические границы 900–960 °C)","src":"ИД п.1.2.1, табл. 23 п.233; целевой KPI Исполнителя"},{"label":"Горизонт прогноза / цикл оптимизации","value":"5–15 мин / 1–5 мин","src":"решение БИ (архитектура MPC-советчика)"},{"label":"Отказ МЛ","value":"безударный откат на ПИД-слой ПЛК, клампы уставок в ПЛК","src":"решение БИ; Прил. №5 п.3.3 (отказ ТС не ведёт к развитию аварии)"},{"label":"Питание АСУТП","value":"I категория, ИБП ≥10 мин, байпас, SNMP","src":"Приложение №5, п.3.2"}],"gost":[{"doc":"ГОСТ 21.408-2013","what":"Правила выполнения рабочей документации автоматизации техпроцессов (основной комплект АТХ)"},{"doc":"СТО 51246464-016-2015","what":"Корпоративные правила оформления РД АСУТП (в действующей редакции) — по Прил. №5"},{"doc":"М ГК НН IT.1.8-2025","what":"Методика проектного документирования фаз жизненного цикла систем промавтоматизации «Норникеля»"},{"doc":"ГОСТ 34.602-2020","what":"ТЗ на автоматизированную систему — оформление задания на МЛ-подсистему"},{"doc":"ГОСТ Р 59276-2020","what":"Системы искусственного интеллекта. Способы обеспечения доверия — обоснование доверия к МЛ-оптимизатору (валидация, мониторинг дрейфа)"},{"doc":"ГОСТ Р 8.596-2002, 102-ФЗ, ГОСТ 8.417-2024","what":"Метрологическое обеспечение измерительных каналов; все СИ — в Госреестре, с первичной поверкой (Прил. №5)"},{"doc":"ГОСТ 21.208-2013","what":"Условные обозначения приборов и средств автоматизации в схемах"}],"open":["Согласование с Управлением автоматизации КГМК конкретных серий датчиков/ИМ (Прил. №5: из линеек, эксплуатируемых на площадке)","Программа опытно-промышленных испытаний МЛ-оптимизатора и целевые KPI (дисперсия T, стабильность SO₂, экономия O₂) — утверждается Заказчиком","Объём передачи исходных кодов ППО и МЛ-моделей (Прил. №5: исключительные права на ППО) — зафиксировать в договоре поставки","Решение о замыкании МЛ-контура (advisory → closed-loop) — по результатам ОПИ"]},{"id":"s13-pfd","title":"Принципиальная технологическая схема (PFD)","kind":"graf","body":"PFD выполняется одним листом на линию обжига с материальными потоками в номинале и максимуме (K=1,15) и таблицей потоков (номер, среда, т/ч или нм³/ч, T, P, плотность/влажность, запылённость). **Структура схемы по цепочке аппаратов** (позиции — по аппаратурной схеме ИД, рис. 1): пульпопровод сгущённого концентрата → барабанные вакуум-фильтры (поз. 2, 2×32 м²) с ёмкостью и насосами фильтрата (возврат в ОРФ) → сборный конвейер кека → приёмные бункеры (поз. 4): концентрат 60 м³, кек NNH 20 м³ (со станцией растаривания поз. 17), цементная медь 10 м³ (загрузка погрузчиком поз. 1), оборотные материалы 50 м³ → тарельчатые питатели (поз. 6) + весовые дозаторы (поз. 7) → шнековый смеситель СШ-25 (поз. 8) → наклонный конвейер → расходные бункеры 2×60 м³ (поз. 9) → питатель/дозатор → шнековый забрасыватель (поз. 10) → **печь КС (поз. 11)**. Дутьевой узел: воздуходувка → смеситель воздух/O₂ (кислород из сети через регуляторный узел) → газовая коробка печи; параллельная ветвь вспомогательного варианта: мазутная топка-смеситель (поз. 20, горелка ГМ-4,5) → подогретое дутьё 455 °C. Газовый тракт: печь → котёл-утилизатор (поз. 12; питательная линия ХОВ 105 °C, барабан, пар 1,9 МПа/375 °C → РОУ → сеть 0,6 МПа; продувка) → одиночный циклон СЦН-50 (поз. 13) → электрофильтры УГТ1-20-4 (поз. 14, 2 шт., рабочий/резерв с перекидными шиберами) → дымососы ДН-15БНЖ (поз. 15, 2 шт.) → газоход Ø1100 мм в СКЦ. Пылевые потоки: бункеры КУ и циклона → шнеки → холодильник огарка D2424-6 (поз. 16а, туда же — огарок из порогов печи); бункер ЭФ → холодильник тонкой пыли S710-4 (поз. 16б) либо возврат в бункер оборотных материалов; холодильники → шнеки → силосные башни 100 м³ (поз. 18а) и 10 м³ (поз. 18б) → автоцементовозы (поз. 19). Аспирация: сеть отсосов → рукавный фильтр → дымосос → свеча; уловленная пыль → бункер оборотных материалов.\n\n**Точки контроля, выносимые на PFD** (ключевые, полный перечень — на P&ID): весовой расход и влажность каждого компонента шихты; расход, давление и содержание O₂ дутья; T слоя (многоточечно) и T газа на выходе печи; давление под сводом; перепад «коробка–слой»; уровень/давление барабана КУ, расход и параметры пара; T газа за КУ, за циклоном, за ЭФ; запылённость и SO₂/O₂ газа перед СКЦ; T огарка и пыли после холодильников; вес силосов; разрежение в аспирационном коллекторе. На PFD наносятся границы проектирования по ТЗ п.3.3 (9 фланцевых границ) и границы поставки комплектных установок (печь, КУ, ЭФ, фильтры). Расчётная скорость газа в газоходе Ø1100 мм — 9–10 м/с при 387 °C (самоочищающаяся скорость выше скорости витания пыли ≤71 мкм) — подтверждает диаметр по ИД.","items":[{"label":"Число позиций основного оборудования на PFD","value":"~20 (по аппаратурной схеме ИД рис. 1)","src":"ИД рис. 1, экспликация"},{"label":"Фланцевые границы проектирования","value":"9 позиций по ТЗ табл. 3.3","src":"ТЗ п.3.3"},{"label":"Скорость в газоходе в СКЦ","value":"9,4 м/с (13 262 нм³/ч, 387 °C, Ø1100 мм)","src":"расчёт Исполнителя по ИД табл. 23 п.400, 403, 406"},{"label":"Табличная часть потоков","value":"два столбца: номинал / максимум (K=1,15)","src":"методика БИ; ИД табл. 23 п.93"}],"gost":[{"doc":"ГОСТ 21.401-88","what":"Технологические схемы марки ТХ — состав, условные обозначения трубопроводов и аппаратов"},{"doc":"ГОСТ 2.701-2008","what":"Виды и типы схем, общие требования к выполнению"},{"doc":"ГОСТ 21.208-2013","what":"Обозначения КИПиА на совмещённых схемах"}],"open":["Нумерация технологических позиций (единая система тегов КГМК) — согласовать с Заказчиком до выпуска PFD","Границы комплектных поставок (печь/КУ/ЭФ) — фиксируются по итогам ТКП"]},{"id":"s14-pid","title":"Предварительные схемы трубопроводов и КИПиА (P&ID) по участкам: контуры регулирования, блокировки, уставки","kind":"graf","body":"P&ID выпускаются по пяти участкам с единой системой тегов; ниже — реестр основных контуров (тип регулятора → исполнительный механизм → уставка/границы). Уставки со ссылкой на ИД — расчётные; помеченные «(БИ)» — принимаемые проектные, уточняются при пусконаладке.\n\n**Участок фильтрации.** LIC-101 уровень приёмной ёмкости пульпы → ПИД → ЧРП насоса подачи на фильтры (граница 20–80 %); FIC-102 расход пульпы на каждый фильтр → клапан (гидроабразивное исполнение); PIC-103 вакуум в ресивере → ПИД → дроссель подсоса/ЧРП вакуум-насоса, уставка −(0,06–0,08) МПа (БИ); MIC-104 влажность кека (Микрорадар-113А) → коррекция скорости барабана, цель 10 %; LICA-105 ёмкость фильтрата → пуск/стоп откачных насосов, блокировка сухого хода; QIA-106 мутность фильтрата (контроль прорыва полотна). Блокировки: остановка фильтра при потере вакуума >30 с; запрет пуска конвейера кека при неработающем сборном конвейере (цепочка «против потока»).\n\n**Участок шихтовки.** Мастер-контур FFIC-200: задание производительности по шихте (до 15,448 т/ч) распределяется регулятором соотношения на уставки четырёх весовых дозаторов WIC-201…204 (концентрат ≤10,621 / кек ≤3,500 / цементная медь ≤1,327 / обороты ≤2 т/ч — пропорции по сухому весу с коррекцией по влагомерам MI-201…204); LIA-205…209 уровни бункеров (тензодатчики LPA-68 + радарные уровнемеры) — предупредительный min/max, блокировка питателя при min-min (защита от сухого истирания) и конвейера загрузки при max-max; SIC-210 ток смесителя СШ-25 — сигнализация перегрузки, блокировка дозаторов при остановке смесителя; HS-211 маршрутизация реверсивного конвейера на расходные бункеры по LIC-212/213. Групповая блокировка: пуск тракта только при работающей аспирации (см. участок 5).\n\n**Участок обжига — определяющие контуры.** (1) **TIC-301 температура кипящего слоя**: ≥5 термопар в слое, регулируемая величина — медианное значение (защита от локальных выбросов); уставка **930 °C**; ПИД → каскадно на уставку дозатора шихты WIC-214 (главный канал, «больше шихты — больше тепла» при автогенном режиме) с динамической компенсацией по МЛ-советчику; предупредительная сигнализация 950 °C, аварийная **970 °C** (останов загрузки + холостая продувка), нижняя 900 °C (предупр.) / 700 °C (запрет автоматического ведения, переход на разогрев). (2) **FIC-302/FIC-303 + FFIC-304 дутьё**: расход воздуха (расходомер + направляющий аппарат/ЧРП воздуходувки) и кислорода (клапан О₂-исполнения) с регулятором соотношения, поддерживающим содержание O₂ в дутье **52,0 % (осн.) / 30,8 % (вспом.)**; суммарный расход 11 342 / 19 146 нм³/ч; контроль QI-305 (анализатор O₂ в дутье) — коррекция соотношения; отсечной клапан O₂ по ПАЗ. (3) **PIC-306 давление/разрежение под сводом**: уставка по ИД +50…100 Па (ТЗ формулирует как разрежение — знак уставки согласуется с Гипроникелем на БИ); ПИД → каскад на уставку тяги дымососа (ЧРП/направляющий аппарат ДН-15БНЖ); это самый быстрый контур тракта (период ~1 с). (4) **PDIC-307 перепад «газовая коробка – слой»**: номинал 52,3 / 53,3 кПа; регулирование высоты слоя → **дроссельный затвор выгрузки огарка** (открытие при превышении уставки перепада — прямое указание ИД разд. 2.3); сигнализация залегания слоя по падению амплитуды пульсаций давления (спектральный признак в ПЛК). (5) QIRC-308 SO₂ в газе на выходе печи 17,83 / 10,87 % — контроль полноты обжига, вход МЛ-модели. (6) Топка (вспом. вариант): TIC-309 температура смешанного дутья 455 °C → ПИД → клапан мазута ГМ-4,5 с регулятором соотношения «мазут/распыливающий воздух»; ПАЗ горелки по ФНП: контроль факела (2 канала), отсечка при погасании, продувка топки перед розжигом. (7) Разогревные горелки МГМГ-10: местные посты, контроль факела, паровая продувка мазутных линий. **ПАЗ печи** (жёсткая логика в ПЛК, независимая от МЛ): останов загрузки шихты при T>970 °C, при расходе дутья <70 % уставки, при остановке обоих дымососов, при перепаде «коробка–слой» вне 30–70 кПа; при полной отсечке дутья — автоматическая подача азота в кислородную линию (ИД разд. 2.4) и запрет открытия затворов; аварийная донная выгрузка — только ручным деблокируемым постом.\n\n**Участок газоочистки.** (1) **LICA-401 уровень барабана КУ** — трёхимпульсный регулятор (уровень + расход пара + расход питательной воды) → питательный клапан; аварийные уровни ±150 мм (БИ), ПАЗ по упуску воды (останов… перевод печи в горячий резерв: стоп загрузки, продувка). (2) PIC-402 давление пара 1,86 МПа → сброс в РОУ; предохранительные клапаны — 2 шт. по ТР ТС 032/2013. (3) TIC-403 пар после РОУ 159 °C → впрыск ХОВ; PIC-404 0,6 МПа → редукционный клапан. (4) QIC-405 электропроводность котловой воды → клапан непрерыв
