ной продувки (0,205–0,324 м³/ч). (5) TIA-406 газ за КУ 400 °C: рост — признак загрязнения поверхностей, автозапуск виброочистки/обстукивания по циклограмме и по ΔT. (6) PDI-407…409 перепады по КУ, циклону (868/2232 Па), ЭФ (≤200 Па) — диагностика забивания трактов. (7) ЭФ: управление агрегатами ОПМД-400 — автоматическое поддержание тока на грани искрения (46,4–57,6 кВ), циклограммы встряхивания полей со сдвигом от отгрузки пыли; TSA-410 блокировка полей при T газа <320 °C (БИ; риск росы SO₃ — расчётная точка росы уточняется) и при уровне max в пылесборнике; допусковый контроль изоляторных коробок. (8) **PIC-411 разрежение перед дымососом** — резервный к PIC-306 канал регулирования тяги; АВР дымососов: автозапуск резервного с перестановкой перекидных шиберов за ≤60 с (БИ). (9) QIRC-412 SO₂/O₂ + пылемер QI-413 в газоходе СКЦ — коммерческий/технологический контроль границы (15,59 % SO₂, ≤0,1 г/нм³). (10) Холодильники: TIC-414/415 T материала на выходе 70 °C → ПИД → клапаны расхода оборотной воды (176,9 и 2,2 м³/ч); FSA-416 протока воды каждого контура — блокировка шнека при потере протока (защита от прогара); TIA-417 воды на выходе 35 °C (предупр. 45 °C — БИ); SIC токовая защита шнеков с реверс-алгоритмом расклинивания. (11) Силосы: WIA-418 вес (CLF-300), разрешение налива цементовоза по весу и T ≤65 °C, автоматика дисковых затворов и аспирации налива.\n\n**Участок аспирации.** PDIC-501 перепад на рукавном фильтре → импульсная регенерация в диапазоне 800–1500 Па (БИ); PIC-502 разрежение в коллекторе → ЧРП дымососа аспирации; TIA-503 температура газов (защита рукавов, байпас при перегреве); QI-504 пылемер на свече; LIA-505 бункера фильтра → шнек возврата пыли. Блокировочная матрица «аспирация-технология»: запрет пуска любого пылящего механизма без подтверждения разрежения в его отсосе; выдержка останова аспирации 120 с после останова технологии (продувка). Полный перечень контуров (~45 позиций регулирования, ~120 блокировок) оформляется в БИ таблицей по форме Прил. №5: контур, связи, уставки сигнализаций/блокировок, формализованный алгоритм.","items":[{"label":"Главный контур печи","value":"TIC слоя 930 °C → каскад на дозатор шихты; аварийные границы 700/970 °C","src":"ИД табл. 23 п.233; разд. 2.4 (границы пуска/остановки)"},{"label":"Контур соотношения дутья","value":"FFIC воздух/O₂: 52,0 % (осн.) / 30,8 % (вспом.) O₂","src":"ИД табл. 23 п.200, 224"},{"label":"Контур давления под сводом","value":"PIC → ЧРП дымососа; уставка +50…100 Па (ИД) / знак уточнить (ТЗ: разрежение)","src":"ИД табл. 23 п.229; ТЗ п.3.5"},{"label":"Контур слоя/выгрузки","value":"PDIC «коробка–слой» 52,3 кПа → дроссельный затвор огарка","src":"ИД табл. 23 п.228; разд. 2.3"},{"label":"Уровень барабана КУ","value":"трёхимпульсный регулятор питания; ПАЗ по упуску воды","src":"решение БИ; ФНП № 536"},{"label":"Защита ЭФ","value":"блокировка полей при T<320 °C (точка росы SO₃) и max пыли","src":"решение БИ; ИД табл. 23 п.275 (SO₃ 0,75 %)"},{"label":"Защита холодильников","value":"блокировка шнека при потере протока воды; T воды предупр. 45 °C","src":"решение БИ; ИД табл. 23 п.435-437"},{"label":"Объём реестра","value":"~45 контуров регулирования, ~120 блокировок","src":"оценка Исполнителя по составу оборудования"}],"gost":[{"doc":"ГОСТ 21.408-2013","what":"Выполнение схем автоматизации (P&ID/АТХ), перечни контуров и блокировок"},{"doc":"ГОСТ 21.208-2013","what":"Условные графические обозначения приборов на P&ID"},{"doc":"ФНП № 512 от 09.12.2020","what":"Обязательные защиты печи (отсечка дутья, продувка азотом, контроль факела горелок)"},{"doc":"ФНП № 536 от 15.12.2020","what":"Защиты котла-утилизатора (уровень, давление, предохранительные клапаны)"},{"doc":"ГОСТ 12.2.003-91","what":"Блокировки ограждений шнеков, конвейеров, затворов"},{"doc":"ГОСТ Р 8.596-2002","what":"Аттестация измерительных каналов контуров, участвующих в защитах"}],"open":["Знак и величина уставки давления под сводом (противоречие ИД п.229 «+50…100 Па» и ТЗ «разрежение») — снять запросом Гипроникелю до выпуска P&ID","Точка росы SO₃ для уставки защиты ЭФ — расчёт по фактической влажности и SO₃ на стадии БИ","Карта уставок сигнализаций/блокировок в полном объёме — итерация с Заказчиком (форма Прил. №5)","Число и расстановка термопар слоя (5–8 шт.) — согласовать с поставщиком печи"]},{"id":"s15-komponovka","title":"Основные компоновочные решения (планы, разрезы, высотная схема)","kind":"graf","body":"Компоновка выполняется на сетке колонн **6/12 м** (ТЗ п.3.5): продольный шаг 6 м, пролёты кратны 12 м. Принятая структура главного корпуса — четыре температурно-технологических блока в одном здании плюс наружная этажерка: **(А) отделение фильтрации** (пролёт 12 м): барабанные вакуум-фильтры на отметке +6,0 (предварительно) с разгрузкой кека на конвейер под фильтром; вакуум-станция, ёмкость и насосы фильтрата — на 0,000; **(Б) отделение шихтовки** (пролёт 12–24 м): бункерная этажерка — верх загрузочных конвейеров ~+14…16, приёмные бункеры 60/20/10/50 м³, под ними питатели и весовые дозаторы (+7…8), смеситель СШ-25 (+5), наклонный конвейер УКВ-320-Ц-95 на расходные бункеры 2×60 м³ у печи; станция растаривания биг-бэгов и пост разгрузки цементной меди — на 0,000 у ворот (граница по ТЗ); **(В) отделение обжига и котла-утилизатора** (пролёт 24 м как 2×12 м): печь КС на собственном опорном каркасе — подина на отметке **+4,5 (предварительно)**: под печью размещаются газовая коробка, дутьевой коллектор, обслуживание сопел и аварийная донная выгрузка в кюбель на 0,000; свод печи ~+13,7; котёл-утилизатор — рядом на самостоятельном каркасе, барабан на верхней отметке (~+18…20 — по КД завода), пылевой бункер КУ снизу с шнеком на +4…5; между печью и КУ — короткий газоход Ø2000; **(Г) отделение газоочистки**: циклон СЦН-50 (высота 6,1 м) на этажерке с бункером над шнеком грубой пыли; два ЭФ УГТ1-20-4 (18,1×4,8 м в плане, высота 18,7 м) на осях с шагом, кратным 6 м, с проходом обслуживания между ними; дымососы на 0,000 на индивидуальных фундаментах; далее газоход Ø1100 на эстакаде в СКЦ. Воздуходувка дутья — в отдельном шумоизолированном помещении на 0,000 вблизи печи (короткий напорный тракт). Мазутный узел (топка-смеситель, горелочные рампы) — у печи с противопожарными отступами.\n\n**Высотная схема построена на самотёке твёрдых потоков** — обоснование: (1) огарок 930 °C выгружается через сливной порог печи (отметка порога над подиной — по высоте слоя ~1,9–2,1 м, т.е. ~+6,4…6,6) непосредственно в загрузочный патрубок холодильника D2424-6, установленного под порогом (+5,2…5,5 — уточняется КД печи): транспортирование раскалённого огарка механизмами исключено; (2) пыль из конусов КУ, циклона и ЭФ ссыпается вертикально на шнековые транспортёры (углы конусов ≥60° > угла откоса пыли 30–42° с запасом на комкуемость); (3) холодильники выдают охлаждённый материал на шнеки, поднимающие его в силосные башни; (4) **силосные башни вынесены в пристройку/на улицу у автопроезда**: низ конуса на +4,2 — над цементовозом (габарит 4,0 м + зазор), верх ~+17; налив — самотёком через герметичный гофрорукав DN100; (5) газовый тракт спроектирован «сверху вниз по пыли»: горизонтальные участки минимизированы, скорость 9–10 м/с самоочищающая, ревизионные люки в местах поворотов (требование ИД — контроль настылей). Подъём шихты (единственный поток «вверх») — наклонными винтовыми и ленточными конвейерами с углом ≤20°.\n\nОбслуживание: мостовой кран пролёта печи/КУ (г/п — по монтажной единице, предварительно 20/5 т — уточняется массой барабана КУ), кран-балки над дымососами (5 т) и в отделении фильтрации; монтажные проёмы в перекрытиях над печью и ЭФ; лестницы и площадки — у всех приводов, затворов, точек КИП (Прил. №5: СИ на высоте ≤1,7 м от площадок, исключение лесов и стремянок). Компоновка предъявляет: планы на отметках 0,000 / +4,5 / +6,0 / +8,0 / +14 и характерные разрезы по печи-КУ и по ЭФ-дымососам с привязкой к осям и отметкам перекрытий. Проезд автоцементовозов и вывоза кюбелей — сквозной, с воротами в торцах.","items":[{"label":"Сетка колонн","value":"6/12 м (пролёты 12 и 24 м, шаг 6 м)","src":"ТЗ п.3.5"},{"label":"Отметка подины печи (предв.)","value":"+4,5 — под печью газовая коробка и донная выгрузка","src":"решение БИ (геометрия печи — ИД табл. 23 п.214)"},{"label":"Габарит ЭФ","value":"18 110 × 4 790 × 18 695 мм, 2 шт.","src":"ИД табл. 23 п.354"},{"label":"Высота циклона","value":"6 100 мм (+ бункер 8,5 м³)","src":"ИД табл. 23 п.301-302"},{"label":"Силос огарка: низ конуса","value":"+4,2 (цементовоз H=4,0 м + зазор)","src":"решение БИ; габарит цементовоза — ИД табл. 23 п.496"},{"label":"Скорость газа в газоходе","value":"9–10 м/с — самоочищающая","src":"расчёт Исполнителя по ИД табл. 23 п.400, 406"},{"label":"Угол конусов пылевых бункеров","value":"≥60° при угле откоса пыли 30–42°","src":"решение БИ; ИД табл. 20"}],"gost":[{"doc":"СП 56.13330.2021","what":"Производственные здания — объёмно-планировочные решения, эвакуация, категории помещений"},{"doc":"СП 43.13330.2012","what":"Сооружения промышленных предприятий — этажерки, бункеры, силосы, галереи, эстакады газохода"},{"doc":"СП 4.13130.2013","what":"Противопожарные расстояния и отступы (мазутный узел, кабельные трассы)"},{"doc":"ФНП № 512 от 09.12.2020","what":"Проходы и площадки обслуживания печей, требования к путям обслуживания горячих трактов"},{"doc":"СП 1.13130.2020","what":"Эвакуационные пути и выходы многоуровневых этажерок"}],"open":["Отметка и конструкция опорного каркаса печи — по КД разработчика печи (HATCH/лицензиат)","Компоновка и отметки котла-утилизатора (барабан, опуски, ремонтные зоны) — по КД завода-изготовителя","Размещение ЭФ (в здании / на открытой площадке с шатром) — теплотехническое сравнение на стадии БИ (риск росы при −40 °C против стоимости корпуса)","Трасса газохода в СКЦ (длина, число опор, компенсаторы) — по генплану привязки цеха"]},{"id":"s16-konstrukcii","title":"Планы строительных конструкций с нагрузками","kind":"graf","body":"Каркас здания — стальной рамно-связевой (скорость монтажа в условиях Заполярья, ремонтопригодность), колонны по сетке 6/12 м, покрытие по фермам, ограждение — сэндвич-панели с расчётом на W₀ = 0,30 кПа и снеговую 3,2 кПа (V район; на перепадах высот блоков — снеговые мешки по СП 20.13330, коэффициент μ до 2–3 в зонах примыкания этажерки к пролёту печи). Внутренние этажерки бункерного хозяйства и газоочистки — самостоятельные стальные каркасы, **конструктивно отделённые от каркаса здания** (исключение передачи технологических вибраций и температурных деформаций).\n\n**Реестр основных технологических нагрузок для планов конструкций** (постоянная + длительная от заполнения, по ИД табл. 25 «НЗП»): приёмный бункер концентрата 60 м³ — 132,6 т материала; бункер оборотного огарка 50 м³ — 149,3 т; бункер кека 20 м³ — 27,0 т; бункер цементной меди 10 м³ — 30,0 т; расходные бункеры 2×60 м³ — 125,0 т суммарно; смеситель с заполнением ~8 т; печь КС — 139 т слоя + футеровка и корпус (масса металлоконструкций и футеровки печи — по КД, предварительная оценка Исполнителя 200–230 т: шамот ~135 т при толщине 350 мм, подина ~30 т, корпус и свод ~40–60 т); котёл-утилизатор — масса по КД завода + 30,4 т пыли в бункере (15 м³ × 2,025 т/м³); циклон 1,19 т + 16,2 т пыли; каждый ЭФ 72,6 т + 17,1 т пыли; холодильник D2424-6 с заполнением ~13 т + вода в рубашке; силосная башня огарка — **221 т материала** (100 м³ × ~2,2 т/м³ насыпной уплотнённой) + собственный вес; силос пыли 17,1 т. Газоходы Ø2000/Ø1100 с футеровкой ШЛ-0,4 — линейная нагрузка на опоры и температурные усилия от компенсаторов (тракт до 400–920 °C); в НЗП газоходов заложено до 50 т пылевых отложений на тракте «печь–КУ» и 50 т на «КУ–циклон» — **пылевая нагрузка газоходов учитывается в расчёте опор как длительная**, это прямое следствие данных ИД табл. 25.\n\nПолезные нагрузки на перекрытия обслуживания — 4,0 кПа (площадки КИП и проходы), 10 кПа — ремонтные зоны и зоны складирования футеровки при капремонте (кампания печи 3 года, разовая перекладка ~135 т шамота — предусмотреть зону раскладки и путь подачи). Крановые нагрузки мостового крана пролёта печи/КУ — по г/п (предварительно 20/5 т) с вертикальными и горизонтальными составляющими по СП 20.13330 разд. 9. Температурные воздействия: локальный нагрев конструкций у печи и газоходов — тепловые экраны и вентилируемые зазоры, расчётный перепад для этажерки печи ±40 °C. Все узлы опирания оборудования снабжаются планами нагрузок: N (пост.), N (длит., заполнение), V (динамика — см. раздел фундаментов), M от эксцентриситетов конусов.","items":[{"label":"Снег / ветер","value":"3,2 кПа (V район) / W₀ 0,30 кПа (II район)","src":"ТЗ п.2.9.3-2.9.4"},{"label":"Слой в печи","value":"139 т единовременно","src":"ИД табл. 23 п.230; табл. 25"},{"label":"Масса печи (оценка)","value":"200–230 т конструкция+футеровка (уточняется КД)","src":"оценка Исполнителя по геометрии ИД табл. 23 п.214-216"},{"label":"Силос огарка","value":"221 т материала (100 м³)","src":"ИД табл. 25"},{"label":"ЭФ с пылью","value":"72,6 + 17,1 = 89,7 т на опоры каждого","src":"ИД табл. 23 п.355; табл. 25"},{"label":"Пыль в газоходах","value":"до 50 т на участок «печь–КУ» и «КУ–циклон»","src":"ИД табл. 25 (НЗП газоходных трактов)"},{"label":"Бункеры шихтовки (заполнение)","value":"132,6 / 149,3 / 27,0 / 30,0 / 125,0 т","src":"ИД табл. 25"}],"gost":[{"doc":"СП 20.13330.2016","what":"Нагрузки и воздействия: сочетания, снеговые мешки, крановые нагрузки (разд. 9)"},{"doc":"СП 16.13330.2017","what":"Стальные конструкции — расчёт каркасов, этажерок, опор газоходов"},{"doc":"СП 63.13330.2018","what":"Железобетонные конструкции — фундаменты, подпорные элементы, перекрытия на 0,000"},{"doc":"СП 43.13330.2012","what":"Бункеры и силосы: давление сыпучего на стенки (с учётом сводообразования и обрушения), опорные узлы"},{"doc":"СП 14.13330.2018","what":"Проверка при сейсмичности 6 баллов (справочно; спецмероприятия как правило не требуются)"},{"doc":"ГОСТ 27751-2014","what":"Надёжность строительных конструкций — класс сооружения КС-2/КС-3 (уточнить для этажерки печи)"}],"open":["Массы КУ, барабана, воздуходувки, рукавных фильтров — по ТКП/КД заводов (закладываются в планы нагрузок итерацией)","Класс ответственности этажерки печи (КС-2 или КС-3) — согласовать с генпроектировщиком","Нагрузки от эстакады газохода в СКЦ — после трассировки по генплану"]},{"id":"s17-fundamenty","title":"Планы фундаментов с нагрузками, включая динамические","kind":"graf","body":"Грунтовые условия площадки благоприятные (особых условий нет — ТЗ п.2.9.6); тип фундаментов — монолитные ж/б на естественном основании (уточняется ИГИ конкретного пятна). **Статические нагрузки** — по реестру раздела конструкций; ниже — фундаменты с динамической составляющей, рассчитываемые по **СП 26.13330.2012 «Фундаменты машин с динамическими нагрузками»**.\n\n(1) **Дымососы ДН-15БНЖ (2 шт.)** — главный источник динамики: ротор с двигателем 400 кВт, **n = 1500 об/мин (частота вынуждающей силы 25 Гц)**, масса агрегата 5,64 т (дымосос 3,32 + двигатель 2,32). Фундамент — массивный ж/б блок на общей раме под улитку и двигатель; ориентировочная масса блока — 8–12-кратная масса агрегата (45–70 т, уточняется расчётом амплитуд); нормативная динамическая нагрузка — от остаточного дисбаланса ротора по паспорту (класс балансировки G6.3 — запросить в ОЛ), расчёт амплитуд колебаний на отметке опор — не более допускаемых по СП 26.13330 для машин с вращающимися частями; отстройка собственных частот фундамента от 25 Гц не менее ±25 %. Виброизоляция от каркаса здания — фундамент отделён сквозным швом; газоход присоединяется через мягкие вставки/линзовые компенсаторы (исключение передачи вибрации на тракт и обратной «раскачки» опор). Предусмотреть штатные точки вибромониторинга (2 канала на подшипник, СКЗ виброскорости, интеграция в АСУТП).\n\n(2) **Воздуходувка дутья** — тип не выбран (центробежная одно/двухступенчатая, ~315–400 кВт, обороты 3000 об/мин или выше при мультипликаторе — 50+ Гц); фундамент проектируется по паспортным динамическим нагрузкам поставщика; до выбора машины в планах резервируется блок 6×4 м с допуском по массе до 60 т. (3) **Печь КС** — квазистатическая, но с пульсационной составляющей кипящего слоя (пульсации перепада 48–53 кПа на площади 28,3 м² — знакопеременная составляющая до ~1–2 % статики в полосе 0,5–5 Гц); фундамент печи — плита под опорный каркас, проверка на резонанс с низшими тонами каркаса. (4) **Смеситель СШ-25, шнековые холодильники, конвейеры** — малые динамические добавки (коэффициент динамичности 1,1–1,2 к статике); вибраторы бункеров и виброразгружатели силосов — локальные импульсные нагрузки, гасятся конструкцией силоса (проверка узлов крепления на усталость). (5) **ЭФ** — статика 89,7 т + импульсы встряхивания молотками (учитываются коэффициентом 1,1). (6) **Мостовой кран** — горизонтальные тормозные силы на колонны по СП 20.13330.\n\nВсе фундаменты под «мокрые» и пылевые зоны (холодильники, силосы, фильтрация) — с бортиками и трапами; фундаменты у цементной меди — с кислотостойким покрытием пола (ИД разд. 2.2: полы из кислотоупорного бетона с дренажными канавками). Анкеровка — закладные и фундаментные болты по ГОСТ 24379.1-2012. На планах фундаментов для каждого узла приводится таблица: N ст., N длит., F дин. (амплитуда, частота), допускаемая амплитуда, привязка болтов.","items":[{"label":"Дымосос: частота возмущения","value":"25 Гц (1500 об/мин), агрегат 5,64 т","src":"ИД табл. 23 п.391-392, 397"},{"label":"Масса фундамента дымососа (предв.)","value":"45–70 т (8–12 × масса агрегата), отстройка от 25 Гц ±25 %","src":"решение БИ по СП 26.13330"},{"label":"Воздуходувка: резерв под фундамент","value":"блок 6×4 м, до 60 т — до выбора машины","src":"решение БИ (машина не выбрана — см. открытые вопросы)"},{"label":"Пульсации слоя печи","value":"перепад 48–53 кПа на 28,27 м², полоса 0,5–5 Гц","src":"ИД табл. 23 п.215, 226-228 (пульсации — природа КС)"},{"label":"Класс балансировки роторов","value":"G6.3 — включить в опросные листы","src":"решение БИ (ГОСТ ИСО 21940-11)"}],"gost":[{"doc":"СП 26.13330.2012","what":"Фундаменты машин с динамическими нагрузками — дымососы, воздуходувка; допускаемые амплитуды"},{"doc":"СП 22.13330.2016","what":"Основания зданий и сооружений — несущая способность и осадки"},{"doc":"ГОСТ 24379.1-2012","what":"Болты фундаментные — анкеровка оборудования"},{"doc":"ГОСТ ИСО 21940-11-2019","what":"Балансировка роторов — назначение класса G для дымососов/воздуходувки (уточнить номер применяемой части)"},{"doc":"ГОСТ 12.1.012-2004","what":"Вибрационная безопасность — уровни на рабочих местах у дымососов"}],"open":["ИГИ пятна застройки (модуль деформации, УГВ) — задание на изыскания в составе БИ","Паспортные динамические нагрузки дымососа и воздуходувки — по ОЛ поставщиков","Необходимость виброизоляторов под дымосос (пружинные блоки) против массивного фундамента — ТЭО на стадии БИ"]},{"id":"s18-montazh","title":"Требования к монтажу (включая вес самых тяжёлых частей)","kind":"graf","body":"**Самые тяжёлые и крупногабаритные единицы** (определяют такелажную схему): электрофильтр УГТ1-20-4 — **72,6 т общий вес** при габарите 18,1×4,8×18,7 м; поставка секциями: корпус (царги), блоки осадительных/коронирующих электродов, бункер; максимальный монтажный блок — по разбивке завода (предварительно 15–20 т — корпусная секция); монтаж — гусеничным/автокраном соответствующей грузовысотной характеристики до закрытия теплового контура (ЭФ монтируются первыми либо через монтажный проём). Котёл-утилизатор: наиболее тяжёлая единица — **барабан** (масса по КД завода; по аналогам КУ печей КС — ориентировочно 15–25 т, уточнить в ОЛ) на верхней отметке ~+18…20 — требуется кран большой грузовысотности или накатка по временным путям; панели «лист-полутруба» — блоками по 3–8 т. Печь КС: корпус Ø6–8,4 м — негабарит, поставка царгами с укрупнительной сборкой на площадке у оси печи; масса самой тяжёлой царги — по КД (оценочно 10–15 т); футеровка ~135 т шамота — ручная кладка по проекту футеровки с регламентированной сушкой 10–30 сут (дрова + горелки МГМГ-10, кривая сушки — по проекту футеровки). Дымосос: улитка 3,32 т + двигатель 2,32 т; холодильник D2424-6 — двухшнековый блок ~9,6 м длиной (масса — в ОЛ, оценочно 12–18 т); силосная башня 100 м³ — цельносварная обечайка (транспортный негабарит — согласование перевозки) либо полистовая сборка на месте.\n\n**Порядок и требования**: (1) монтаж по ППР(м), разрабатываемому на базе настоящих требований БИ; последовательность: фундаменты и подливка → крупногабарит до закрытия контура (ЭФ, КУ, печь, силосы) → каркас и кровля → трубопроводы/газоходы → КИП; (2) мостовой кран пролёта печи/КУ вводится в строй на раннем этапе и используется как монтажный механизм для внутренних узлов (г/п проверяется по барабану КУ); (3) сварка газоходов 09Г2С и коллекторов КУ — аттестованные технологии (НАКС) с контролем по СП 70.13330 и ФНП № 536 для элементов под давлением; футеровка газоходов легковесом ШЛ-0,4 — после испытаний на плотность; (4) кислородопровод — обезжиривание, монтаж по ФНП № 486; (5) выверка динамического оборудования: соосность валов дымососов/двигателей лазерной центровкой (допуски — по паспорту, класс G6.3), подливка безусадочными составами; (6) холодные испытания трактов: воздушная опрессовка газового тракта с проверкой присосов (норма подсосов по ИД: КУ 4,9 %, циклон 3,1 %, ЭФ 1,5 % — приёмочный критерий герметичности), гидроиспытания КУ по ФНП № 536; (7) монтаж в зимний период — тепляки для бетонных и футеровочных работ (расчётная температура −40 °C); (8) весовой контроль негабаритов при перевозке по площадке — согласование маршрутов с КГМК. В составе БИ выдаётся ведомость монтажных блоков с массами, размерами и отметками установки + требования к такелажной оснастке.","items":[{"label":"Самая тяжёлая единица газоочистки","value":"ЭФ 72,6 т (секциями по 15–20 т)","src":"ИД табл. 23 п.354-355; разбивка — оценка Исполнителя"},{"label":"Дымосос / двигатель","value":"3,32 т / 2,32 т","src":"ИД табл. 23 п.392, 397"},{"label":"Циклон","value":"1,189 т, H=6,1 м — единым блоком","src":"ИД табл. 23 п.302, 312"},{"label":"Футеровка печи","value":"~135 т шамота; сушка 10–30 сут по регламенту","src":"оценка по геометрии ИД; сроки — ИД разд. 6"},{"label":"Критерий герметичности тракта","value":"подсосы: КУ ≤4,9 %, циклон ≤3,1 %, ЭФ ≤1,5 %","src":"ИД табл. 23 п.273, 313, 356"},{"label":"Кампания печи / капремонт","value":"3 года / 29–31 сут (охлаждение 2, разборка 10, кладка 14, сушка 3–5)","src":"ИД разд. 6"}],"gost":[{"doc":"СП 75.13330.2011","what":"Технологическое оборудование и трубопроводы — правила производства и приёмки монтажных работ"},{"doc":"СП 70.13330.2012","what":"Несущие и ограждающие конструкции — монтаж каркаса, сварные соединения"},{"doc":"ГОСТ 24444-87","what":"Оборудование технологическое — требования монтажной технологичности (закладывается в ОЛ)"},{"doc":"ФНП № 461 от 26.11.2020","what":"Подъёмные сооружения — краны, ППР с применением ПС, такелаж"},{"doc":"ФНП № 536 от 15.12.2020","what":"Монтаж и гидроиспытания котла-утилизатора и паропроводов"},{"doc":"ФНП № 486 от 26.11.2020","what":"Монтаж и обезжиривание кислородных линий"}],"open":["Массы и разбивка на монтажные блоки КУ, печи, холодильников, воздуходувки — по КД заводов (ведомость блоков — итерация после ТКП)","Способ доставки силоса 100 м³ (цельный негабарит / полистовая сборка) — логистическая проработка","Грузоподъёмность и режим работы мостового крана — после фиксации массы барабана КУ"]},{"id":"s19-spec","title":"Спецификации, опросные листы, нетиповое оборудование и оборудование длительного цикла изготовления","kind":"graf","body":"**Спецификация основного и вспомогательного оборудования** оформляется по ГОСТ 21.110-2013 с обязательными графами ТЗ п.3.5: технические характеристики, габариты, масса, энергопотребление; базовое наполнение — из ИД табл. 23/24Б/25 (позиции, типоразмеры, массы: ЭФ 72,6 т, циклон 1,19 т, дымосос 3,32+2,32 т и т.д.) с дополнением данными ТКП. **Спецификация нетипового оборудования** с техтребованиями к проектированию, изготовлению и поставке + эскизные чертежи (ГОСТ 2.119-2013): печь КС (корпус, свод, газораспределительная подина с 583 соплами ХН78Т, пороги выгрузки с дроссельным затвором и ножевой шиберной задвижкой, шнековый забрасыватель), котёл-утилизатор (перепроектирование под параметры ИД), топка-смеситель дутья, приёмные/расходные бункеры с футеровкой PE500, силосные башни, укрытия и узлы аспирации, газоходы Ø2000/Ø1100 с футеровкой.\n\n**Комплект опросных листов** (по одному на каждую позицию основного технологического, электротехнического и КИП-оборудования — формы КГМК): в ОЛ обязательно вносятся параметры двух вариантов обжига (осн./вспом.) как два расчётных режима — газовый тракт, КУ и дымососы выбираются по вспомогательному (больший объём газа), кислородный узел — по основному; для динамических машин — требование паспортных динамических нагрузок и класса балансировки; для ЭФ — гарантия ≤0,1 г/нм³ при 21 830 нм³/ч; для рукавных фильтров аспирации — ≤10 мг/нм³; для всех СИ — внесение в Госреестр РФ и первичная поверка (Прил. №5).\n\n**Оборудование длительного цикла изготовления** (исходные требования выдаются в первоочередном порядке для контрактации до завершения БИ): печь КС с футеровкой (цикл проектирования+изготовления 12–18 мес — оценка), котёл-утилизатор (12–16 мес), электрофильтры (10–14 мес), воздуходувка (8–12 мес), дымососы, холодильники Holo-Screw Flite (импортозамещение — проработка аналогов), силосные башни, агрегаты питания ЭФ, КТП и ЧРП 6 кВ. По каждой позиции — не менее 2–3 ТКП (ТЗ п.3.6). Импортозамещение по Прил. №5 (оборудование и ПО автоматизации — производства РФ; отступления — по согласованию с Заказчиком) распространяется и на приводную технику.","items":[{"label":"Объём комплекта ОЛ (оценка)","value":"~35–45 позиций технологического + электро + КИП","src":"состав по ИД табл. 24Б; оценка Исполнителя"},{"label":"Определяющий режим для газового тракта","value":"вспомогательный (21 830 нм³/ч, 5 426 Па)","src":"ИД табл. 23 п.357, 398; разд. 2.5"},{"label":"Определяющий режим для кислородного узла","value":"основной (4 687 нм³/ч O₂)","src":"ИД табл. 23 п.198"},{"label":"Длительный цикл (оценка сроков)","value":"печь 12–18 мес; КУ 12–16; ЭФ 10–14 мес","src":"оценка Исполнителя (уточняется ТКП)"}],"gost":[{"doc":"ГОСТ 21.110-2013","what":"Спецификация оборудования, изделий и материалов"},{"doc":"ГОСТ 2.119-2013","what":"Эскизный проект — состав эскизных чертежей нетипового оборудования"},{"doc":"ГОСТ 15.005-86","what":"Создание изделий единичного и мелкосерийного производства — печь, КУ, нетиповые металлоконструкции (уточнить применимость с Заказчиком)"},{"doc":"ТР ТС 010/2011, ТР ТС 032/2013","what":"Обязательная оценка соответствия — фиксируется в ОЛ"}],"open":["Формы опросных листов КГМК — запросить у Заказчика до выпуска комплекта","Перечень оборудования, передаваемого в ЦИМ (Приложение №4) — увязка атрибутов спецификации с моделью","Статус проекта печи HATCH (права, актуализация под РФ-изготовителя) — решение Заказчика"]},{"id":"s20-teplo-vrednosti","title":"Тепловыделения и выделения вредностей от оборудования в помещения цеха","kind":"calc","body":"**Тепловыделения.** Базовая статья — потери печи КС в окружающую среду: 10 % теплового баланса = **3,67 ГДж/ч (1,02 МВт) осн. / 6,46 ГДж/ч (1,79 МВт) вспом.** (ИД табл. 23 п.240); большая часть рассеивается поверхностями печи (корпус ~200 м², температура наружной поверхности при шамотной футеровке — 60–90 °C расчётно) и газоходом Ø2000 в помещение отделения обжига. Дополнительно в цех поступают: потери изолированных поверхностей КУ, газоходов и паропроводов (при нормируемой плотности потока по СП 61.13330 ~150–300 Вт/м² на горячих трактах — суммарно 0,2–0,4 МВт, уточняется расчётом изоляции); тепло от электроприводов (~10 % потребляемой мощности ≈ 20–60 кВт); тепло охлаждаемых продуктов на открытых участках шнеков (малое, тракты закрыты). **Итого проектная оценка тепловыделений в объём цеха 1,3–2,2 МВт** — определяющая нагрузка для воздухообмена: летом — аэрация/механическая вытяжка из верхней зоны отделения обжига, зимой тепловыделения частично замещают отопление (дежурное отопление +5 °C в нерабочих зонах, воздушно-тепловые завесы ворот — климат −40 °C). Точный тепловой паспорт по помещениям выдаётся в БИ таблицей «аппарат → поверхность, м² → t поверхности → Вт».\n\n**Вредности.** (1) SO₂: источники — надслоевое пространство печи (+50–100 Па) через неплотности загрузочного узла и порогов, ревизионные люки при обслуживании; мероприятия: аспирация укрытий узлов печи, поддержание минимального избыточного давления/перевод на разрежение (вопрос уставки — см. P&ID), газоанализаторы СО₂/SO₂ рабочей зоны с сигнализацией при ПДКрз 10 мг/м³ (ГОСТ 12.1.005). (2) Пыль медьсодержащая (Cu, Ni — с учётом канцерогенности Ni): источники — пересыпки, растаривание, налив; мероприятия: герметизация + аспирация с возвратом пыли, уборка полов промышленными пылесосами/гидросмывом (сухая пыль II класса опасности — ИД разд. 6), контроль воздуха рабочей зоны по программе производственного контроля (СП 2.2.3670-20). (3) Тепловое излучение у печи и порогов выгрузки (930 °C) — экранирование, ограничение времени пребывания, СИЗ; облучённость на рабочих местах ≤140 Вт/м² по СанПиН 1.2.3685-21 (уточняется расчётом). (4) Шум: дымососы 400 кВт, воздуходувка — шумоизолированные помещения/кожухи, цель ≤80 дБА на рабочих местах (ГОСТ 12.1.003). (5) Вибрация — виброизоляция фундаментов (см. раздел 17). Категории помещений по пожарной опасности: мазутный узел — В1-В2; электропомещения — В1-В3; основные технологические отделения — Д/Г (негорючие материалы при высоких температурах); уточняется расчётом по СП 12.13130.2009.","items":[{"label":"Потери печи в окружающую среду","value":"1,02 / 1,79 МВт (10 % баланса)","src":"ИД табл. 23 п.240 (пересчёт в МВт)"},{"label":"Суммарные тепловыделения в цех (предв.)","value":"1,3–2,2 МВт","src":"оценка Исполнителя (печь по ИД + изоляция по СП 61.13330)"},{"label":"ПДКрз SO₂","value":"10 мг/м³ — уставка газоанализаторов рабочей зоны","src":"ГОСТ 12.1.005-88"},{"label":"Класс опасности пыли концентрата","value":"II (не горюч, взрывобезопасен)","src":"ИД разд. 6 (ТУ 24.44.11-237-48200234-2017)"},{"label":"Цель по шуму","value":"≤80 дБА на рабочих местах","src":"ГОСТ 12.1.003-2014; СанПиН 1.2.3685-21"}],"gost":[{"doc":"СП 60.13330.2020","what":"Вентиляция и отопление — ассимиляция 1,3–2,2 МВт тепловыделений, воздушные завесы"},{"doc":"СП 61.13330.2012","what":"Нормы плотности теплового потока изоляции — основа расчёта тепловыделений трактов"},{"doc":"ГОСТ 12.1.005-88 и СанПиН 1.2.3685-21","what":"ПДК рабочей зоны (SO₂, медь, никель), микроклимат, тепловое облучение"},{"doc":"СП 2.2.3670-20","what":"Санитарные требования к условиям труда — производственный контроль"},{"doc":"ГОСТ 12.1.003-2014 / ГОСТ 12.1.012-2004","what":"Шум и вибрация — дымососы, воздуходувка"},{"doc":"СП 12.13130.2009","what":"Категорирование помещений по взрывопожарной опасности"}],"open":["Тепловой паспорт по помещениям (поверхности, температуры) — после расчёта изоляции на стадии БИ","Карта источников выделений и воздухообмен по помещениям — раздел ОВ на стадии БИ/ОТР","Категории помещений по СП 12.13130 — расчёт после фиксации мазутного хозяйства"]},{"id":"s21-stoimost","title":"Стоимость поставки по Лоту №1 (методика и состав)","kind":"pz","body":"Стоимость комплектной поставки формируется в составе БИ по требованиям ТЗ п.3.6: (1) **по каждой позиции оборудования — не менее 2–3 ТКП** потенциальных поставщиков; референсные изготовители зафиксированы в ИД (печь — по проекту HATCH; КУ — Белэнергомаш-БЗЭМ / Энергоцветмет; циклон — Энергомаш (Тверь) по разработке НИИОГАЗ; ЭФ — «Атмосфера» (Семибратово); дымососы — «Армавент»; питатели — Gornorud; дозаторы — «Агроэскорт»; конвейеры — КЗМКО; смеситель — НПО «Спайдермаш»; холодильники — Hyquip Rotolok / YT Conveyor; силосы — НПО «Спецнефтемаш»; станция растаривания — КИП-Сервис; цементовозы — Tongcheng) — по каждой группе добавляются альтернативные РФ-поставщики; (2) **оценка общей стоимости комплектной поставки** технологического оборудования и материалов в границах п.3.3 ТЗ — включая трубопроводы, газоходы с футеровкой, технологические металлоконструкции (этажерки, площадки обслуживания), теплоизоляцию, КИПиА и АСУТП с прикладным ПО, электрооборудование в согласованных границах, ЗИП на ПНР и 2 года (АСУТП — ≥10 % и ≥1 шт. каждого наименования по Прил. №5).\n\nСтруктура сводки стоимости: оборудование по группам (шихтоподготовка / печной комплекс / газоочистка / охлаждение-отгрузка / аспирация / КИПиА и АСУТП / электро) + материалы (газоходы, трубопроводы, металлоконструкции, футеровка, изоляция) + услуги (шеф-монтаж, ПНР, обучение, документация ЦИМ по Прил. №4). По валютным позициям (холодильники Holo-Screw Flite, цементовозы) — курсовые оговорки и таможенные платежи отдельной строкой; приоритет — производство РФ (Прил. №5). Итоговая стоимость Лота №1 в настоящем документе **не приводится до получения ТКП** — выпуск сводки предусмотрен отдельным этапом календарного плана БИ; для бюджетных решений Заказчика первыми контрактуются позиции длительного цикла (печь, КУ, ЭФ).","items":[{"label":"Число ТКП на позицию","value":"не менее 2–3","src":"ТЗ п.3.6"},{"label":"ЗИП АСУТП/КИП","value":"на 2 года: ≥10 % и ≥1 шт. каждого наименования","src":"Приложение №5, п.1"},{"label":"Референсные поставщики","value":"зафиксированы в ИД табл. 23/24Б — база рассылки ТКП","src":"ИД табл. 23, 24Б"}],"gost":[{"doc":"Методика 421/пр (Минстрой)","what":"При переходе к сметной стоимости на ОТР/ПД — НМЦ и конъюнктурный анализ (на стадии БИ — коммерческие ТКП; уточнить применимость с Заказчиком)"}],"open":["Сводка стоимости по ТКП — отдельный этап после рассылки ОЛ (все позиции)","Валютно-логистическая схема по импортным позициям (холодильники, цементовозы) и аналоги РФ/ЕАЭС","Границы стоимости электрооборудования (до/после КТП) — после согласования границ по Прил. №3"]}]}, {"lot":2,"name":"Участок получения медного и медно-никелевого купороса — инженерные решения БИ","sections":[{"id":"obshchie","title":"Общие сведения об объекте, назначении, месте расположения","kind":"pz","body":"Участок получения медного и медно-никелевого купороса — узел вывода примесей из медного контура гидрометаллургического производства ОВЭ-75. Баланс примесей (Ni, Fe, Co) поддерживается отсечкой части богатого фильтрата контрольной фильтрации на двухстадийную вакуумную выпарку-кристаллизацию: на первой стадии выделяется чистый оборотный медный купорос (возвращается растворением в медный контур), на второй — товарный смешанный медно-никелевый купорос, отгружаемый на завод NNH; маточный раствор второй стадии (маточник-2) передаётся в ЦЭН. Лидирующая примесь — никель (предельное расчётное содержание в электролите 20 г/л), следующая — железо (критическая величина 3 г/л); возможное превышение перехода примесей в раствор компенсируется резервированием мощностей узлов кристаллизации (ИД ч.2 разд. 2.1) — для оборудования выделения купоросов ИД принят 30 % коэффициент запаса (ИД ч.2 разд. 4.2).\n\nУчасток размещается в существующем здании Гидрометаллургического участка (ГМУ, бывший корпус «Минпрок», чертежи Приложения №7 к ТЗ — ФМ.01648). Аппаратурная схема — по ИД ч.2 разд. 4.1.4 (рис. 4.4 — медный купорос, рис. 4.5 — смешанный купорос): каждая стадия реализована на двух последовательных ступенях выпарки-кристаллизации под разрежением, две технологически независимые нитки со своими конденсаторами, пароэжекторными блоками (ПЭБ) и центрифугами. Режим работы — круглосуточный, 345 дней в году, 8322 ч (КИО 95 %, ИД ч.1 Приложение В).","items":[{"label":"Производительность по оборотному медному купоросу","value":"≈14,1 тыс. т/год (1,70 т/ч) — расчёт по балансу меди","src":"расчёт БИ по ТЗ п. 4.1/4.2"},{"label":"Производительность по смешанному купоросу","value":"≈6,7 тыс. т/год (0,75–0,85 т/ч) — товарный продукт на NNH","src":"ИД ч.2 табл. 3.1; расчёт БИ"},{"label":"Режим работы","value":"345 сут/год, 8322 ч, круглосуточно, КИО 95 %","src":"ТЗ п. 4.4; ИД ч.1 прил. В"},{"label":"Размещение","value":"Существующее здание ГМУ («Минпрок», ФМ.01648); сетку колонн учитывать 6/12 м","src":"ТЗ п. 4.5, Приложение №7"},{"label":"Климат площадки","value":"Снеговой район V (3,2 кПа), ветровой II (0,30 кПа), t наиболее холодных суток −40 °C, сейсмичность 6 баллов (ОСР-2015-В)","src":"ТЗ разд. 2.9"},{"label":"Коэффициент запаса оборудования кристаллизации","value":"30 % (прочее гидрометаллургическое — 15 %)","src":"ИД ч.2 разд. 4.2"}],"gost":[{"doc":"СП 2.2.3670-20","what":"Санитарно-эпидемиологические требования к условиям труда на участке"},{"doc":"ГОСТ 12.1.005-88","what":"Воздух рабочей зоны: ПДК аэрозолей солей Ni 0,005 мг/м³ (1 класс), Cu 0,5 мг/м³, H₂SO₄ 1 мг/м³ (2 класс)"}],"open":["Конкретный пролёт/зона размещения участка в здании ГМУ — выделяется Заказчиком, подтверждается обмерным обследованием","Точки подключения пара, воды, воздуха (ТУ на подключение) — при разработке БИ/ОТР"]},{"id":"syrio","title":"Данные о сырье и продукции","kind":"pz","body":"Сырьё двух ниток задано ТЗ (п. 4.1) и ИД ч.2 (разд. 1.4, 2.3, табл. 3.1, 5.5, 5.7, 5.16, 5.18).\n\nНитка 1 (медный купорос): часть продукционного (богатого) раствора после контрольной фильтрации — 42,2 тыс. м³/год (5,07 м³/ч при 8322 ч; ИД табл. 3.1: 5,0–5,3 м³/ч), состав, кг/м³: Cu 102,9; Ni 20,6; Co 1,6; Fe 2,6; H₂SO₄ 17,9; температура на входе 65–75 °C.\n\nНитка 2 (смешанный купорос): маточный раствор от кристаллизации медного купороса — 11,81 тыс. м³/год (1,42 м³/ч), состав, кг/м³: Cu 60; Ni 70; Co 5,59; Fe 8,98; H₂SO₄ 61.\n\nПродукция: (1) медный купорос — кристаллогидрат CuSO₄·5H₂O (теоретически 25,45 % Cu; принятый ИД состав 25,7 % Cu — в пределах округлений при влажности 4–6 %), передаётся на растворение (граница — фланец выгрузки центрифуги); (2) смешанный медно-никелевый купорос — мелкозернёный сыпучий кристаллогидрат, влажность 4–6 %, фасуется в биг-беги с полиэтиленовым вкладышем (граница — расфасованный продукт); (3) маточник-2 — 1,8 тыс. м³/год (0,22 м³/ч), кг/м³: Ni 30,5; Cu 14,5; Co 2,5; Fe 11,3; H₂SO₄ 400 — насыщен при 20–25 °C, перед транспортировкой в ЦЭН подогревается острым паром либо разбавляется водой на 10–15 % (не охлаждать ниже 25–30 °C).","items":[{"label":"Фильтрат на кристаллизацию","value":"42,2 тыс. м³/год; Cu 102,9 / Ni 20,6 / Co 1,6 / Fe 2,6 / H₂SO₄ 17,9 кг/м³","src":"ТЗ п. 4.1"},{"label":"Маточник на смешанный купорос","value":"11,81 тыс. м³/год; Cu 60 / Ni 70 / Co 5,59 / Fe 8,98 / H₂SO₄ 61 кг/м³","src":"ТЗ п. 4.1"},{"label":"Медный купорос","value":"25,7 Cu / 0,29 Ni / 0,02 Co / 0,04 Fe / 12,83 S, %","src":"ТЗ п. 4.2"},{"label":"Смешанный купорос","value":"9,79 Cu / 11,47 Ni / 0,91 Co / 1,27 Fe / 0,07 H₂SO₄ / 12,38 S, %; влажность 4–6 %; микропримеси, г/т: Zn 210, Se 35, Te 210, As 500, Ca 2730","src":"ТЗ п. 4.2"},{"label":"Маточник-2 (в ЦЭН)","value":"1,8 тыс. м³/год; Ni 30,5 / Cu 14,5 / Co 2,5 / Fe 11,3 / H₂SO₄ 400 кг/м³; Zn 400, Se 80, Te 450, As 2500, Ca 600 г/м³","src":"ИД ч.2 п. 1.4.2.2"}],"gost":[{"doc":"ГОСТ 19347-2014","what":"«Купорос медный. Технические условия» — справочно: медный купорос участка — оборотный полупродукт, товарные требования ГОСТ к нему не предъявляются, но показатели чистоты (Fe, Ni) контролируются по логике стандарта"},{"doc":"Спецификация/ТУ приёмки NNH","what":"Требования к товарному смешанному купоросу (упаковка, влажность, примеси) — согласовать с NNH, уточнить документ"}],"open":["Составы фильтрата-1 и бедного электролита на растворение приведены в ИД табл. 5.6/5.17 (в переданной редакции — изображения): запросить у Заказчика редактируемые таблицы для замыкания баланса растворения"]},{"id":"tehproc","title":"Описание технологического процесса по операциям","kind":"pz","body":"Схема — две последовательные стадии кристаллизации, каждая на двух ступенях под разрежением; технологически это две независимые нитки с общими только системами кислой оборотной воды (СОВ) и пароснабжения (ИД ч.2 разд. 2.3, 4.1.4).\n\nОПЕРАЦИЯ 1. Приём питания. Часть фильтрата контрольной фильтрации из ёмкости поз. 4.1.19 через бак поз. 4.1.22 подаётся в выносной подогреватель I ступени нитки 1 (граница проектирования 4.3.1 — фланец от ёмкости сбора фильтрата, рис. 4.1 поз. 4.1.19).\n\nОПЕРАЦИЯ 2. Выпарка-кристаллизация медного купороса, I ступень (рис. 4.4 поз. 1). Испаритель D 2,0 м, V 34,5 м³ с выносным кожухотрубным подогревателем F = 63 м² (глухой пар) и контуром принудительной циркуляции (насос 633 м³/ч, H 4,5 м, 22 кВт). Температура в аппарате 40 °C, давление 0,06–0,08 атм; расход греющего пара 2,1 т/ч, выход сокового пара 2,2 т/ч; ж:т в пульпе 9,18, содержание твёрдого до 0,2 т/м³. Кристаллы через солевую колонну и седиментационный цилиндр выводятся вниз, маточник — на II ступень.\n\nОПЕРАЦИЯ 3. II ступень (поз. 2, аппарат унифицирован с I ступенью). Кристаллизация без нагрева — адиабатическим самоиспарением при глубоком разрежении 0,013–0,02 атм (паровой эжектор поз. 8), температура 20 °C, соковый пар 0,29 т/ч; ж:т 2,45, твёрдого до 0,6 т/м³, крупность до 2 мм.\n\nОПЕРАЦИЯ 4. Фугование. Кристаллы обеих ступеней через солевые колонны поступают в репульпатор поз. 3 (2,5 м³) и на пульсирующие центрифуги (по табл. 4.1 — 2 шт. × 2,5 т/ч, рабочая + резервная; 1800 об/мин, 15 кВт). Фугат через бак поз. 7 возвращается в солевые колонны (транспорт соли) и на II ступень.\n\nОПЕРАЦИЯ 5. Растворение медного купороса (репульпатор поз. 4.1.7, обогрев острым паром): 65–75 °C, 1,0 ч; купорос 1,6–1,8 т/ч + фильтрат-1 1,4–1,5 м³/ч + бедный электролит 3,2–3,5 м³/ч; твёрдое по питанию 350–380 кг/м³, Cu в конечном растворе 95–120 кг/м³; раствор — в репульпатор поз. 4.1.21 на контрольную фильтрацию (замыкание медного контура).\n\nОПЕРАЦИЯ 6. Выпарка-кристаллизация смешанного купороса, I ступень (рис. 4.5 поз. 1). Маточник II ступени нитки 1 через обогреваемый бак поз. 4.1.5 — в выносной подогреватель F = 25 м²; испаритель D 1,3 м, V 8,9 м³, циркуляция 251 м³/ч (11 кВт); 40 °C, 0,06–0,10 атм; греющий пар 0,85–0,95 т/ч, соковый 0,7–0,8 т/ч.\n\nОПЕРАЦИЯ 7. II ступень (поз. 2): 20 °C, 0,013–0,02 атм (эжектор поз. 6), соковый пар 0,07 т/ч; ж:т 1,70.\n\nОПЕРАЦИЯ 8. Фугование и промывка. Центрифуги 2 шт. × 1,5 т/ч (табл. 4.1); кристаллы промываются исходным фильтратом нитки 1 (0,15 м³/т) для удаления кислоты и микропримесей; промвода — в аппарат I ступени, фугат — на II ступень.\n\nОПЕРАЦИЯ 9. Фасовка: ленточный транспортёр → узел затаривания в биг-беги с ПЭ-вкладышем, взвешивание, пробоотбор, коммерческий учёт; через склад — на NNH.\n\nОПЕРАЦИЯ 10. Маточник-2 — в обогреваемый бак поз. 4.1.26 и в ЦЭН (подогрев/разбавление — см. разд. «Сырьё и продукция»).\n\nОПЕРАЦИЯ 11. Конденсация и вакуум: соковый пар I ступеней и пар эжекторов II ступеней конденсируется в барометрических конденсаторах своих ниток; разрежение конденсаторов поддерживают ПЭБ (эжектор + конденсатор ПЭБ + водокольцевой вакуум-насос). Орошение — холодной водой кислой СОВ; тёплая вода возвращается на отдельную градирню кислой СОВ.\n\nНезависимость и резервирование: останов любой нитки не останавливает вторую; на период чистки теплообменников предусмотрено опорожнение ступеней в резервный реактор каскада выщелачивания с последующим возвратом пульпы (ИД ч.2 разд. 4.2.1); центрифуги — рабочая + резервная на каждой нитке.","items":[{"label":"Температуры ступеней","value":"I ступень 40 °C, II ступень 20 °C (обе нитки)","src":"ИД ч.2 разд. 4.1.4"},{"label":"Давления","value":"I ступень 0,06–0,08 атм; II ступень 0,013–0,02 атм; конденсаторы 0,075 атм","src":"ИД ч.2 табл. 3.1, 4.1, рис. 4.4/4.5"},{"label":"Крупность кристаллов","value":"не более 2,0 мм; влажность после центрифуг 4–6 %","src":"ИД ч.2 табл. 3.1"},{"label":"Промывка смешанного купороса","value":"0,15 м³ исходного фильтрата на 1 т кристаллов","src":"ИД ч.2 табл. 3.1"},{"label":"Растворение купороса","value":"65–75 °C, 1,0 ч, Cu в конечном растворе 95–120 кг/м³","src":"ИД ч.2 табл. 3.1"}],"gost":[{"doc":"ГОСТ 32569-2013","what":"Технологические стальные трубопроводы участка (кислые растворы, пар) — устройство и эксплуатация"},{"doc":"ГОСТ 12.2.003-91","what":"Общие требования безопасности к производственному оборудованию"}],"open":["Схема сбора и возврата чистого конденсата глухого пара (в конденсатный тракт котельной/теплоцентра) — по ТУ на подключение","Точки и объёмы опорожнения ниток в резервный реактор выщелачивания — увязать с проектом участка выщелачивания (вне Лота №2)"]},{"id":"matbalans","title":"Материальные балансы по операциям","kind":"calc","body":"Балансы построены прямым счётом из потоков и составов ТЗ/ИД; годовой фонд 8322 ч. Табличные балансы ИД (табл. 5.5–5.7, 5.16–5.18) в переданной редакции — изображения; ниже — воспроизводимый расчёт БИ, невязки указаны явно.\n\nНИТКА 1 (медный купорос). Приход металлов с фильтратом: m = V·c. Cu: 42,2 тыс. м³ × 102,9 кг/м³ = 4342 т/год; Ni: 42,2 × 20,6 = 869 т; Co: 67,5 т; Fe: 109,7 т; H₂SO₄: 755 т. Расход в маточник (на нитку 2): Cu: 11,81 × 60 = 709 т; Ni: 827 т; Co: 66,0 т; Fe: 106,1 т; H₂SO₄: 720 т. Медь в купорос по разности: 4342 − 709 = 3634 т/год → масса купороса 3634 / 0,257 = 14 139 т/год = 1,70 т/ч — совпадает с питанием центрифуг по ИД (1,6–1,8 т/ч твёрдого): невязка 0,05 %. Проверка примесей в купоросе по разности: Ni (869−827)/14 139 = 0,30 % (ИД 0,29 % — сходится); Fe 0,026 % (ИД 0,04 %); Co 0,011 % (ИД 0,02 %) — расхождения в пределах округлений диапазонов табл. 3.1. Испарённая вода: 2,2 + 0,29 = 2,49 т/ч = 20,7 тыс. т/год.\n\nНИТКА 2 (смешанный купорос). Приход — маточник-1 (см. выше). Выход купороса: 0,75–0,85 т/ч → 6,24–7,07 тыс. т/год; принято 0,80 т/ч = 6658 т/год. Металлы в купоросе: Cu 6658 × 9,79 % = 652 т; Ni 764 т; Co 60,6 т; Fe 84,6 т. Маточник-2: Cu 26,1 т; Ni 54,9 т; Co 4,5 т; Fe 20,3 т; H₂SO₄ 720 т. Сходимость: Cu 709 против 652+26 = 678 (невязка 4,3 %); Ni 1,0 %; Co 1,4 %; Fe 1,1 % — невязки закрываются промводами (возврат в I ступень) и диапазонами составов; окончательное замыкание — по табл. 5.7/5.18 ИД при получении редактируемых данных. Испарённая вода: 0,77–0,87 т/ч = 6,4–7,2 тыс. т/год.\n\nРАСТВОРЕНИЕ. Приход Cu: купорос 1,70 т/ч × 25,7 % = 437 кг/ч + бедный электролит 3,2–3,5 м³/ч × 35 кг/м³ = 112–123 кг/ч + Cu фильтрата-1 (состав — табл. 5.6 ИД). Выход: 5,9–6,8 м³/ч раствора с Cu 95–120 кг/м³ = 560–710 кг/ч. Баланс замыкается в диапазонах ИД; точный состав фильтрата-1 — открытая позиция.\n\nВОДНЫЙ БАЛАНС УЧАСТКА: суммарно испаряется и конденсируется в кислую СОВ 4,67 т/ч (соковый пар 2,2+0,29+0,77+0,07 + рабочий пар эжекторов 1,36 − пар ПЭБ, учитываемый в конденсаторах ПЭБ) — это профицит воды кислой СОВ, отсекаемый в производство (ИД ч.2 п. 1.3.12, 2.5): в штатном режиме кислая СОВ свежей воды не потребляет.","items":[{"label":"Cu: фильтрат → купорос/маточник","value":"4342 = 3634 (купорос) + 709 (маточник-1) т/год; невязка 0,05 %","src":"расчёт БИ по ТЗ п. 4.1/4.2"},{"label":"Выпуск медного купороса","value":"14 139 т/год ≈ 1,70 т/ч (влажность 4–6 % — сверх сухой массы)","src":"расчёт БИ; ИД табл. 3.1 (1,6–1,8 т/ч)"},{"label":"Выпуск смешанного купороса","value":"6658 т/год (0,80 т/ч; диапазон 6,24–7,07 тыс. т/год)","src":"ИД табл. 3.1; расчёт БИ"},{"label":"Никель: фильтрат → смешанный купорос","value":"869 т/год входа; 764 т в купорос, 55 т в маточник-2 (невязка 1,0 %)","src":"расчёт БИ"},{"label":"Испарённая вода (обе нитки)","value":"3,3–3,4 т/ч сокового пара; 27–28 тыс. т/год","src":"ИД табл. 3.1; расчёт БИ"},{"label":"Профицит конденсата в кислой СОВ","value":"≈4,7 м³/ч — возврат в производство вместо свежей воды","src":"расчёт БИ; ИД п. 1.3.12"}],"gost":[],"open":["Редактируемые таблицы балансов ИД 5.5–5.7, 5.16–5.18 (переданы изображениями) — запросить для контрольной сверки","Баланс H₂SO₄ по промводам и влаге купоросов — замыкается на стадии БИ по полученным таблицам"]},{"id":"teplo","title":"Тепловой расчёт выпарки: греющий пар, теплопередача, нагрузки конденсации","kind":"calc","body":"Расчёт по данным ИД (табл. 3.1, спецификации рис. 4.4/4.5); свойства пара — по таблицам водяного пара; теплоёмкость раствора принята cₚ ≈ 3,3 кДж/(кг·К), плотность 1,25 т/м³ (сульфатные растворы 1,2–1,3 т/м³ по ИД).\n\nПОДОГРЕВАТЕЛЬ I СТУПЕНИ, НИТКА 1. Тепловая мощность: Q = D·r. При греющем паре 0,6 МПа (п. 1.3.13 ИД; r ≈ 2066 кДж/кг при T_нас ≈ 165 °C): Q = 2100 кг/ч × 2066 = 4,34 ГДж/ч = 1,21 МВт. Подогрев циркулирующего потока за проход: ΔT = Q/(G·cₚ) = 4,34·10⁶ / (633 м³/ч × 1250 кг/м³ × 3,3) = 1,7 К — классический режим принудительной циркуляции кристаллизатора (подогрев 1,5–2 К без кипения в трубках, вскипание в паровом объёме испарителя). Кратность циркуляции: 633 / 5,07 = 125. Требуемый средний коэффициент теплопередачи при полном температурном напоре (165 − 40 = 125 К, консервативно 119 К с учётом потерь): K = Q/(F·ΔT) = 1,21·10⁶ / (63 × 119) ≈ 160 Вт/(м²·К) — в 5–7 раз ниже типичных 800–1200 Вт/(м²·К) для чистой поверхности: заложенная ИД поверхность 63 м² обеспечивает работу при пониженном давлении греющего пара (малый ΔT против инкрустации) и при частичном зарастании трубок 904L — запас корректен для солевой службы.\n\nПРОВЕРКА ИСПАРЕНИЯ I СТУПЕНИ: самоиспарение перегретого питания (70 → 40 °C): W_фл = G·cₚ·ΔT / r(40 °C) = 6340 кг/ч × 3,3 × 30 / 2406 = 261 кг/ч; испарение от греющего пара: 4,34·10⁶ / 2406 = 1804 кг/ч; сумма 2065 кг/ч против 2200 кг/ч по ИД — сходимость 94 % (разница — диапазоны потоков и теплопотери).\n\nПОДОГРЕВАТЕЛЬ I СТУПЕНИ, НИТКА 2: Q = 900 × 2066 = 1,86 ГДж/ч = 0,52 МВт; ΔT за проход = 1,86·10⁶/(251×1250×3,3) = 1,8 К; K_треб = 0,52·10⁶/(25×125) ≈ 165 Вт/(м²·К) — та же проектная логика.\n\nНАГРУЗКИ КОНДЕНСАЦИИ (r при 0,075 атм ≈ 2406 кДж/кг, T_нас 40,3 °C).\n— Барометрический конденсатор нитки 1: пар 2,2 (I ст.) + 0,29 (соковый II ст.) + 0,75 (рабочий пар эжектора) = 3,24 т/ч; Q = 3240 × 2406 = 7,80 ГДж/ч = 2,17 МВт. Нагрев орошающей воды 380 м³/ч: ΔT = 7,80·10⁶/(380 000 × 4,19) = 4,9 К (22,5 → 27,4 °C); недогрев до T_нас 40,3 °C ≈ 13 К — запас по конденсации обеспечен (табл. 4.1: расчётная нагрузка 4,5 т/ч, запас 1,4).\n— Конденсатор ПЭБ нитки 1: 0,27 т/ч, Q ≈ 0,19 МВт, вода 32 м³/ч, ΔT ≈ 5,0 К.\n— Барометрический конденсатор нитки 2: 0,75 + 0,07 + 0,18 = 1,0 т/ч; Q ≈ 0,67 МВт; вода 138 м³/ч, ΔT ≈ 4,2 К.\n— Конденсатор ПЭБ нитки 2: 0,16 т/ч, Q ≈ 0,11 МВт, вода 18 м³/ч, ΔT ≈ 5,3 К.\nИТОГО тепло, отводимое в кислую СОВ (нагрузка градирни кислой СОВ от участка): ≈3,1–3,2 МВт при расходе воды 568 м³/ч.","items":[{"label":"Греющий пар I ступеней","value":"нитка 1 — 2,1 т/ч; нитка 2 — 0,85–0,95 т/ч (глухой, 0,6 МПа)","src":"ИД табл. 3.1; п. 1.3.13"},{"label":"Тепловая мощность подогревателей","value":"1,21 МВт (F=63 м²) и 0,52 МВт (F=25 м²); подогрев за проход 1,7–1,8 К","src":"расчёт БИ"},{"label":"K требуемый","value":"≈160 Вт/(м²·К) при полном ΔT — запас поверхности ×5–7 на инкрустацию","src":"расчёт БИ"},{"label":"Нагрузка конденсаторов","value":"2,17 + 0,19 + 0,67 + 0,11 ≈ 3,1 МВт; вода кислой СОВ 568 м³/ч, ΔT ≈ 5 К","src":"расчёт БИ; ИД рис. 4.4/4.5 (спецификации)"},{"label":"Сходимость испарения I ступени","value":"расчёт 2,07 т/ч против 2,2 т/ч ИД (94 %)","src":"расчёт БИ"}],"gost":[{"doc":"ГОСТ 34233.1-2017, ГОСТ 34233.2-2017","what":"Нормы и методы расчёта на прочность сосудов; проверка корпусов испарителей и конденсаторов на устойчивость от наружного давления (вакуум)"},{"doc":"ФНП (приказ Ростехнадзора от 15.12.2020 № 536)","what":"Промышленная безопасность оборудования под избыточным давлением — паровые полости подогревателей (0,6 МПа) и паропроводы"},{"doc":"ТР ТС 032/2013","what":"Паропроводы и паровые полости (изб. давление > 0,05 МПа); вакуумные корпуса аппаратов под действие ТР не подпадают (нет избыточного давления)"}],"open":["Параметры пара на границе участка (0,6 МПа от теплоцентра или редуцированный пар КУ после РОУ) — по ТУ на подключение","Точное давление греющего пара перед подогревателями (регулирование) и качество/возврат конденсата — на стадии БИ","Теплопотери корпусов и тепловыделения в помещение (требование ТЗ) — после выбора изоляции"]},{"id":"vakuum","title":"Расчёт вакуумной системы: эжекторы, ПЭБ, барометрические трубы, солевые колонны","kind":"calc","body":"Вакуумная система каждой нитки — трёхконтурная: (1) эжектор II ступени сжимает соковый пар II ступени с 0,013–0,02 атм до давления конденсатора 0,075 атм; (2) барометрический конденсатор смешивающего типа конденсирует соковый пар I ступени и выхлоп эжектора; (3) ПЭБ (эжектор + конденсатор ПЭБ + водокольцевой вакуум-насос) отсасывает парогазовую смесь из конденсатора, поддерживая 0,06–0,08 атм и удаляя неконденсирующиеся газы (подсосы воздуха).\n\nЭЖЕКТОРЫ II СТУПЕНЕЙ (по спецификациям рис. 4.4/4.5): нитка 1 — рабочий пар 0,75 т/ч при 6 атм, производительность по соковому пару 0,375 т/ч; нитка 2 — 0,18 т/ч и 0,090 т/ч. Проверка: степень сжатия 0,075/0,013…0,02 = 3,8–5,8; коэффициент эжекции u = 0,375/0,75 = 0,090/0,18 = 0,5 — для одноступенчатого пароструйного компрессора при таком сжатии и паре 0,6 МПа значение реалистично (типовой диапазон 0,4–0,6). Фактическая нагрузка по соковому пару II ступеней (0,29 и 0,07 т/ч) ниже производительности эжекторов — запас 1,3 (табл. 4.1).\n\nПЭБ: нитка 1 — эжектор 0,27 т/ч (6 атм, рабочее давление всаса 0,06 атм), конденсатор ПЭБ D 0,5 м (32 м³/ч воды), вакуум-насос ВВН1-6; нитка 2 — эжектор 0,16 т/ч, конденсатор D 0,5 м (18 м³/ч), ВВН1-3. Расчёт подсосов воздуха для подтверждения типоразмера ВВН — по нормам герметичности вакуумных систем на стадии БИ (опросные листы изготовителя).\n\nБАРОМЕТРИЧЕСКИЕ ТРУБЫ. Минимальная высота столба воды, уравновешивающего разность давлений: H_min = 10,33 × (P_атм − P_конд)/P_атм = 10,33 × (1 − 0,075) = 9,56 м (при диапазоне 0,06–0,08 атм — 9,50…9,71 м). С запасом на колебания вакуума, волну и гидравлику принято H ≈ 10,5 м от уровня воды в гидрозатворе до опорного сечения конденсатора. Диаметр трубы нитки 1 из скорости 1,1–1,2 м/с при 380 м³/ч воды + 3,24 т/ч конденсата: d = √(4·Q/(π·v)) = √(4×383/3600/(3,14×1,2)) ≈ 0,34 м → Dу 350–400 мм; нитка 2 (139 м³/ч): ≈0,20 м → Dу 200–250 мм; ПЭБ (32 и 18 м³/ч): Dу 100–125 мм. Гидрозатворы — ёмкостью не менее 1,5 объёма трубы (нитка 1: труба ≈1,0 м³ → бак ≥ 1,5–2 м³) для исключения срыва затвора при пуске/остановке.\n\nСОЛЕВЫЕ КОЛОННЫ II СТУПЕНЕЙ — гидростатические затворы на пульпе: требуемый столб H = 10,33 × (1 − P/P_атм) / ρ_отн; при P = 0,013–0,02 атм и плотности пульпы 1,3–1,45 т/м³ H ≈ 7,0–7,9 м. Это определяет высокую отметку установки испарителей II ступеней относительно репульпаторов выгрузки и является ключевым фактором вертикальной компоновки (см. раздел «Компоновка»).","items":[{"label":"Разрежения","value":"конденсаторы 0,075 атм (0,06–0,08); II ступени 0,013–0,02 атм","src":"ИД табл. 3.1, 4.1"},{"label":"Эжекторы II ступеней","value":"0,75 т/ч → 0,375 т/ч сокового (н.1); 0,18 → 0,090 т/ч (н.2); u = 0,5; сжатие 3,8–5,8","src":"ИД рис. 4.4/4.5; расчёт БИ"},{"label":"ПЭБ","value":"н.1: эжектор 0,27 т/ч + конденсатор D0,5 (32 м³/ч) + ВВН1-6; н.2: 0,16 т/ч + D0,5 (18 м³/ч) + ВВН1-3","src":"ИД рис. 4.4/4.5"},{"label":"Высота барометрических труб","value":"H_min = 9,56 м → принято ≈10,5 м; гидрозатворы ≥1,5 объёма трубы","src":"расчёт БИ"},{"label":"Диаметры барометрических труб","value":"н.1 — Dу 350–400; н.2 — Dу 200–250; ПЭБ — Dу 100–125","src":"расчёт БИ"},{"label":"Солевые колонны II ступеней","value":"гидростатический столб пульпы ≈7,0–7,9 м","src":"расчёт БИ"}],"gost":[{"doc":"ГОСТ 34233.2-2017","what":"Устойчивость вакуумных корпусов (наружное давление 0,1 МПа) — расчёт колец жёсткости испарителей и конденсаторов"}],"open":["Нормы подсоса воздуха и подтверждение типоразмеров ВВН1-6/ВВН1-3 — расчётом герметичности на стадии БИ и ОЛ изготовителя","Схема защиты от срыва вакуума (разбивка вакуума, обратные клапаны на трубах) — при разработке P&ID"]},{"id":"material","title":"Обоснование материального исполнения: 904L против 316L","kind":"pz","body":"ИД ч.2 (разд. 4.2.1, последний абзац) прямо исключает низколегированную нержавеющую сталь типа 316L для оборудования, контактирующего с горячими кислыми концентрированными сульфатными растворами, и предписывает для основного оборудования узлов выпарки и кристаллизации купоросов исполнение из стали 904L (или аналога; для наиболее агрессивных узлов выщелачивания — Hastelloy G-35 или аналог).\n\nУСЛОВИЯ СЛУЖБЫ УЧАСТКА: сернокислые растворы 15–70 г/л H₂SO₄ при 40–75 °C (маточник-2 — до 400 г/л при 20–40 °C), высокие концентрации CuSO₄/NiSO₄, хлорид-ион 20–35 г/м³, кипение под вакуумом с локальным концентрированием у поверхности нагрева, абразивное воздействие кристаллов (до 2 мм) в контуре циркуляции 633 м³/ч, переменное смачивание/паровая фаза.\n\nПОЧЕМУ НЕ 316L: сталь 316L (16–18 % Cr, 10–14 % Ni, 2–3 % Mo, без Cu) в серной кислоте средних концентраций при повышенных температурах находится в области активного растворения: по изокоррозионным диаграммам производителей нержавеющих сталей граница скорости коррозии 0,13 мм/год для 316L при 40–70 °C проходит в области разбавленных (<1–5 %) растворов; при 5–40 % H₂SO₄ и 40–70 °C скорость коррозии составляет миллиметры в год. Присутствие ионов Cu²⁺ частично пассивирует (катодный деполяризатор), но локальное подкисление в зоне кипения, хлориды и эрозия кристаллами снимают пассивность: неизбежны питтинг, щелевая коррозия под отложениями соли и эрозионно-коррозионный износ трубок подогревателей.\n\nПОЧЕМУ 904L (UNS N08904: ≈20 % Cr, 24–26 % Ni, 4–5 % Mo, 1,2–2 % Cu): легирование медью и высокий Ni/Mo дают стойкость именно в серной кислоте — классический материал сернокислотных выпарных и кристаллизационных производств; скорость коррозии <0,1–0,13 мм/год во всём рабочем диапазоне участка (до ~40 % H₂SO₄ при 40–70 °C), высокая стойкость к питтингу (PREN ≈ 34–36) и щелевой коррозии.\n\nОЦЕНКА ПОСЛЕДСТВИЙ ОШИБКИ (закладка 316L): (1) сквозная коррозия трубных пучков выносных подогревателей и зон смачивания корпусов в течение первого года-двух эксплуатации против нормативных 10+ лет; (2) загрязнение оборотного медного купороса и электролита железом и хромом — прямое нарушение баланса Fe (критическая концентрация 3 г/л в электролите; норматив Fe в купоросе 0,04 %) и риск по качеству катодов М00к (Fe ≤ 0,0010 %); (3) потеря герметичности вакуумного контура → рост давления, падение производительности кристаллизации, вывод примесей из медного контура останавливается; (4) внеплановые остановы обеих стадий (узкое место вывода Ni/Fe) с ограничением всего производства 75 тыс. т/год; (5) замена пучков и корпусов по стоимости кратно превышает первоначальную разницу цены материалов (масса основного 904L-оборудования — единицы десятков тонн, разница цены 904L/316L ~2–2,5 раза по массе). Вывод: экономия на материале несоразмерна риску; исполнение 904L (или согласованный аналог с равной стойкостью) — обязательное требование к поставщикам в опросных листах.\n\nСОПУТСТВУЮЩИЕ ТРЕБОВАНИЯ: сварка 904L по аттестованным технологиям с присадкой, не обедняющей Mo/Cu; контроль межкристаллитной коррозии сварных швов; трубопроводы и арматура растворного тракта — 904L либо неметаллы (PP/PVDF/стеклопластик по средам и температурам); барометрические конденсаторы и трубы кислой СОВ (до 0,5 г/л H₂SO₄) — кислотостойкое исполнение по ИД п. 2.5; резино-/полимерная футеровка допускается для ёмкостного парка.","items":[{"label":"Требование ИД","value":"Основное оборудование выпарки/кристаллизации — 904L или аналог; 316L исключена для горячих концентрированных растворов","src":"ИД ч.2 разд. 4.2.1"},{"label":"Состав 904L","value":"≈20 % Cr, 24–26 % Ni, 4–5 % Mo, 1,2–2 % Cu (UNS N08904)","src":"справочно (марочный состав)"},{"label":"Ключевое отличие","value":"Медь в составе 904L — стойкость в H₂SO₄; 316L при 5–40 % H₂SO₄ и 40–70 °C — активная коррозия (мм/год)","src":"изокоррозионные диаграммы производителей (граница 0,13 мм/год)"},{"label":"Цена ошибки","value":"Отказ пучков за 1–2 года, Fe/Cr в купорос и электролит (лимит Fe 3 г/л), остановка вывода примесей, риск качества М00к","src":"оценка БИ"}],"gost":[{"doc":"ГОСТ 859-2014","what":"Качество катодной меди М00к (Fe ≤ 0,0010 %) — конечный ограничитель, на который влияет загрязнение контура продуктами коррозии"},{"doc":"Стандарт на аналоги 904L (ГОСТ/ТУ изготовителя)","what":"Отечественный аналог 904L (тип 06ХН28МДТ по классу стойкости) — допускается по согласованию; марку и НТД подтвердить при ТКП, уточнить номер"}],"open":["Перечень допущенных аналогов 904L/Hastelloy G-35 от российских поставщиков — по результатам ТКП","Коррозионные испытания образцов в реальных растворах (свидетели в аппаратах) — предусмотреть программой освоения"]},{"id":"pfd","title":"Принципиальная технологическая схема (PFD)","kind":"graf","body":"PFD выполняется на базе рис. 2.3/2.4 и 4.4/4.5 ИД ч.2 с обязательным нанесением границ проектирования по ТЗ п. 4.3 и материальных потоков (годовых и часовых).\n\nСТРУКТУРА ПОТОКОВ PFD:\n1. Вход: фильтрат контрольной фильтрации 42,2 тыс. м³/год (5,07 м³/ч) — граница 4.3.1 (фланец от ёмкости поз. 4.1.19).\n2. Нитка 1: бак питания → подогреватель (63 м²) → испаритель I ст. (40 °C; 0,06–0,08 атм) → испаритель II ст. (20 °C; 0,013–0,02 атм) → солевые колонны → репульпатор → центрифуги (2×2,5 т/ч) → купорос 14,1 тыс. т/год на растворение (граница 4.3.4 — фланец выгрузки центрифуги); маточник-1 11,81 тыс. м³/год → нитка 2.\n3. Растворение: купорос + бедный электролит 3,2–3,5 м³/ч + фильтрат-1 1,4–1,5 м³/ч → раствор 95–120 г/л Cu → возврат на контрольную фильтрацию.\n4. Нитка 2: обогреваемый бак → подогреватель (25 м²) → испаритель I ст. (D 1,3 м) → испаритель II ст. → центрифуги (2×1,5 т/ч) с промывкой 0,15 м³/т → фасовка в биг-беги (граница 4.3.5); маточник-2 1,8 тыс. м³/год → ЦЭН.\n5. Пароконденсатный контур: пар 0,6 МПа (граница 4.3.3 — фланец на стене цеха) на подогреватели (3,0 т/ч) и эжекторы (1,36 т/ч); барометрические конденсаторы (0,075 атм) и конденсаторы ПЭБ; кислая СОВ 568 м³/ч (подача/возврат на градирню кислой СОВ); профицит конденсата ≈4,7 м³/ч — отсечка в производство.\n6. Вспомогательные: сжатый воздух КИП (граница 4.3.2), вода/водоотведение (4.3.6), электроэнергия 0,4 кВ (4.3.7).\n\nНа PFD указываются: температуры и давления ступеней, расходные характеристики всех потоков, резервирование (центрифуги 2×50/100 %), обозначение двух независимых ниток и точек их технологической развязки.","items":[{"label":"Основа","value":"ИД ч.2 рис. 2.3, 2.4 (принципиальные схемы) и рис. 4.4, 4.5 (схемы цепи аппаратов)","src":"ИД ч.2 разд. 2.3, 4.1.4"},{"label":"Границы на схеме","value":"4.3.1 фильтрат; 4.3.2 воздух; 4.3.3 пар; 4.3.4 медный купорос; 4.3.5 биг-беги; 4.3.6 вода; 4.3.7 0,4 кВ","src":"ТЗ п. 4.3"}],"gost":[{"doc":"ЕСКД/СПДС (ГОСТ 2.701-2008 и комплект СПДС)","what":"Правила выполнения схем; шифры и условные обозначения потоков — по стандарту Генпроектировщика (уточнить состав применяемых стандартов у Гипроникеля)"}],"open":[]},{"id":"pid","title":"Предварительные схемы P&ID и контуры КИПиА","kind":"graf","body":"P&ID разрабатываются по каждой нитке и общим системам (пар, кислая СОВ, воздух КИП) с указанием границ проектирования. Оформление — по ГОСТ 21.408-2013 и корпоративным требованиям (Приложение №5, СТО 51246464-016-2015).\n\nОСНОВНЫЕ КОНТУРЫ (на каждую нитку):\n— LIC-01/02 — уровень в испарителях I/II ступеней (радарные уровнемеры в исполнении 904L/PTFE): регулирование подачи питания (клапан на линии из бака поз. 4.1.22 / бака 4.1.5); блокировка по предельным уровням.\n— TIC-01 — температура в испарителе I ступени (уставка 40 °C): каскад на клапан греющего пара подогревателя; TI-02 — температура II ступени (20 °C, контроль).\n— PIC-01 — разрежение в барометрическом конденсаторе (уставка 0,075 атм): регулирование пара эжектора ПЭБ / клапан-разбиватель вакуума; PIC-02 — разрежение II ступени (0,013–0,02 атм): клапан рабочего пара эжектора.\n— DIC-01/02 — плотность пульпы в контурах циркуляции I/II ступеней (бесконтактные радиоизотопные или вибрационные плотномеры на байпасе): управление выгрузкой через солевые колонны (плотность раствора 1,2–1,3, пульпы до 1,45 т/м³).\n— FIC-01 — расход питания нитки (электромагнитный расходомер в футеровке PFA): 5,0–5,3 м³/ч (н.1) / 2,5–2,6 м³/ч (н.2); FIC-02 — дозирование промывного фильтрата на центрифугу н.2 (0,15 м³/т); FIQ — учёт пара на подогреватели и эжекторы.\n— LIC гидрозатворов барометрических труб и баков фугата; TIC обогреваемых баков 4.1.5/4.1.26 (30–40 °C).\n— Центрифуги: вибрация, температура подшипников, ток двигателя, частота пульсаций — комплектные контроллеры с интеграцией в АСУ (Modbus TCP); блокировки пуска по крышке/дисбалансу.\n— Насосы циркуляции и погружные: защита от сухого хода (по мощности/давлению), контроль протечек торцевых уплотнений.\n— Фасовка: весовой дозатор биг-бегов с коммерческим учётом (интеграция в АИС весоизмерения по Приложению №5, передача в ХТД PIMS).\n\nПредварительная оценка объёма: ≈70–90 аналоговых и ≈120–160 дискретных сигналов на участок (уточняется при разработке P&ID); запас каналов ввода/вывода ≥30 % (Прил. №5). Средства измерений в контакте с раствором — 904L/тантал/PTFE-футеровка; демонтаж расходомеров — через байпасные линии с отсечной арматурой (Прил. №5).","items":[{"label":"Регулируемые параметры","value":"Уровни испарителей, T I ступени 40 °C, вакуум 0,075 и 0,013–0,02 атм, плотность пульпы, расходы питания и промывки, дозирование пара","src":"ИД табл. 3.1; Прил. №5; практика вакуум-кристаллизации"},{"label":"Исполнение датчиков","value":"Контактные части 904L/PTFE; IP65; байпасы для замены без останова","src":"Прил. №5; ИД разд. 4.2.1"},{"label":"Оценка сигналов","value":"AI ≈ 70–90, DI/DO ≈ 120–160, резерв каналов ≥30 %","src":"оценка БИ; Прил. №5"}],"gost":[{"doc":"ГОСТ 21.408-2013","what":"Правила выполнения рабочей документации автоматизации техпроцессов (функциональные схемы, перечни сигналов)"},{"doc":"ГОСТ Р 8.596-2002; ФЗ-102 от 26.06.2008","what":"Метрологическое обеспечение измерительных каналов; СИ — только из Госреестра, с первичной поверкой"}],"open":["Полный перечень блокировок с уставками — к выпуску P&ID (формат по Прил. №5: позиционная привязка всех участников)","Выбор типа плотномера (радиоизотопный требует лицензирования РБ) — согласовать с Заказчиком"]},{"id":"komponovka","title":"Компоновка в существующем здании ГМУ; высотная проверка барометрических конденсаторов","kind":"graf","body":"ЗДАНИЕ (Приложение №7, чертежи ФМ.01648-АР/АР1/КО): корпус 96 × 108 м; пролёты по буквенным осям 18 + 6 + 24 + 24 + 24 м, шаг колонн по цифровым осям 6 м (компоновку по ТЗ вести с учётом сетки 6/12 м); свайное основание с ростверками, пластовый дренаж (отметки низа −1,65…−2,25); частичные этажерки/перекрытия на +5,000/+6,000; мостовые краны: Q 5 т (Lк 22,5 м) и 7,5 т (Lк 16,5 м), верх крановых рельсов +10,000/+10,500; верх покрытия по разрезам +13,400…+15,950 (парапеты до +16,500), покрытие — плиты 3×12 м, h = 455 мм.\n\nВЫСОТНАЯ ПРОВЕРКА БАРОМЕТРИЧЕСКИХ КОНДЕНСАТОРОВ (критично). Потребная вертикаль от уровня воды гидрозатвора до верха конденсатора: H = h_трубы + h_корпуса = 10,5 + (2,0…2,5) = 12,5…13,0 м, где 10,5 м — барометрическая труба (H_min = 10,33 × (1 − 0,075) = 9,56 м + запас ~0,9 м), 2,0–2,5 м — корпус конденсатора D 2,0 м с каплеотбойником и патрубками. Низ несущих ферм покрытия: оценочно +12,4…+12,9 (верх покрытия 15,35…15,95 в высоком пролёте минус плита 0,455 м минус высота фермы 24-метрового пролёта ≈2,7–3,1 м; в пролётах с покрытием +13,4…+14,15 — низ ферм ≈ +10,9…+11,0). Проверка вариантов:\n— Вариант 0 (гидрозатвор на отм. 0,000, уровень воды ≈ +0,7): верх конденсатора = 0,7 + 10,5 + 2,0…2,5 = +13,2…+13,7 — ВЫШЕ низа ферм (+12,4…+12,9) даже в высоком пролёте и выше габарита кранов; НЕ ПРОХОДИТ (дефицит 0,3–1,3 м).\n— Вариант А (рекомендуемый): заглубление гидрозатворов в приямок глубиной 2,0–2,5 м (уровень воды −1,5…−2,0): верх конденсатора = +11,0…+11,5 — проходит под низом ферм высокого пролёта с запасом ≥0,9–1,9 м; стояки размещать у колонн, вне зоны прохода кранов (верх рельса +10,5, габарит крана ~+12) либо в бескрановой зоне пролёта. Приямки в здании на свайных ростверках выполнимы между ростверками — подтвердить обследованием и расчётом (СП 43.13330, СП 45.13330); исполнение приямков кислотостойкое (кислая СОВ до 0,5 г/л H₂SO₄).\n— Вариант Б (резервный): низкоуровневые (полубарометрические) конденсаторы с конденсатными насосами в 904L — снимает высотное ограничение, добавляет насосы под вакуумом (кавитационный запас, надёжность) и УЗА; применять, если обследование запретит приямки.\nВЫВОД: полнобарометрическая схема при гидрозатворе на нулевой отметке в существующем ГМУ НЕ размещается; размещается при заглублении гидрозатворов на 2,0–2,5 м (вариант А). Решение подтверждается обмерным обследованием отметок низа ферм — включить в первый этап БИ.\n\nВЕРТИКАЛЬНАЯ УВЯЗКА ОСТАЛЬНОГО ОБОРУДОВАНИЯ: солевые колонны II ступеней требуют гидростатического столба пульпы 7,0–7,9 м — испарители II ступеней устанавливаются на этажерке (низ конуса ориентировочно +8…+9) над репульпаторами и центрифугами на отм. 0,000; альтернатива — заглубление репульпаторов (совместить с приямками гидрозатворов). Высота корпуса испарителя нитки 1 при D 2,0 м и V 34,5 м³ — оценочно 9–12 м (уточняется изготовителем): аппарат от отм. ~0…+1 до ~+10…+12 вписывается под фермы высокого пролёта. Компоновочный блок участка — 24-метровый высокий пролёт, 2–3 шага колонн (24 × 12–18 м) с этажеркой обслуживания; фасовка биг-бегов и склад — на 0,000 с проездом электропогрузчика; центрифуги — на индивидуальных виброизолированных фундаментах.\n\nМонтажная логистика: аппараты 904L заводской готовности заводятся через существующие монтажные проёмы/ворота; самые тяжёлые монтажные единицы — испарители нитки 1 (масса по данным изготовителя, ориентировочно 8–15 т без содержимого) — проверить грузоподъёмность существующих кранов (5/7,5 т): вероятен монтаж мобильным краном через проём до монтажа кровли зоны либо укрупнительная сборка из транспортабельных частей.","items":[{"label":"Параметры здания ГМУ","value":"Пролёты 18/6/24/24/24 м, шаг 6 м; краны 5 и 7,5 т, верх рельса +10,0/+10,5; верх покрытия +13,4…+15,95; плиты h=455 мм","src":"Прил. №7 (ФМ.01648-АР1 л.5, КО л.2)"},{"label":"Потребная высота конденсаторного стояка","value":"12,5–13,0 м от уровня воды гидрозатвора (труба 10,5 м + корпус 2,0–2,5 м)","src":"расчёт БИ"},{"label":"Вердикт","value":"Без приямка НЕ влезает (верх +13,2…+13,7 при низе ферм ≈ +12,4…+12,9); с приямком 2,0–2,5 м — влезает, запас ≥0,9 м","src":"расчёт БИ по Прил. №7"},{"label":"Солевые колонны II ступеней","value":"Столб пульпы 7,0–7,9 м → испарители II ступеней на этажерке +8…+9 м","src":"расчёт БИ"},{"label":"Сетка компоновки","value":"Учитывать сетку колонн 6/12 м; привязка к осям и отметкам перекрытий — обязательна (ТЗ)","src":"ТЗ п. 4.5"}],"gost":[{"doc":"СП 43.13330.2012","what":"Сооружения промышленных предприятий — приямки, этажерки, фундаменты под оборудование"},{"doc":"СП 45.13330 (актуальная редакция)","what":"Земляные сооружения, основания и фундаменты — устройство приямков возле свайных ростверков"},{"doc":"СП 16.13330.2017","what":"Стальные конструкции — этажерки обслуживания испарителей и опорные конструкции конденсаторов"},{"doc":"ФНП по ПС (приказ Ростехнадзора от 26.11.2020 № 461)","what":"Работа в зоне действия существующих мостовых кранов; габариты приближения оборудования к крановым путям"}],"open":["Обмерное обследование ГМУ: фактические отметки низа ферм, состояние конструкций, свободные зоны — первый этап БИ (обязателен)","Допустимость и привязка приямков к свайным ростверкам — по результатам обследования фундаментов","Высота и масса испарителей — по данным заводов-изготовителей (ОЛ)"]},{"id":"nagruzki","title":"Нагрузки на строительные конструкции и фундаменты (включая динамические)","kind":"graf","body":"Планы строительных конструкций и фундаментов с нагрузками — обязательный состав БИ (ТЗ п. 4.5). Основные нагрузки участка:\n\n1. Испарители нитки 1 (2 шт.): масса содержимого 34,5 м³ × 1,3 т/м³ ≈ 45 т + корпус 904L (по данным изготовителя, ориентировочно 8–15 т) + контур циркуляции ≈ 1,3 т содержимого — расчётная вертикальная нагрузка на постамент/этажерку ≈ 550–650 кН на аппарат (гидроиспытание — полное заполнение водой, проверить отдельно). Испарители нитки 2 (2 шт.): 8,9 × 1,3 ≈ 11,6 т + корпус — ≈ 160–200 кН.\n2. Барометрические конденсаторы со стояками: корпус + водяное заполнение трубы Dу 350 (~1,0 м³) — ≈ 60–90 кН на фундамент гидрозатвора; горизонтальные связи стояка к каркасу здания (проверка каркаса на дополнительные ≈5–10 кН узловых).\n3. Центрифуги пульсирующие 1800 об⁻¹ — динамические нагрузки: индивидуальные фундаменты (или виброизолированные рамы), отстроенные от резонанса; динамический коэффициент и неуравновешенные силы — по паспорту изготовителя; проектирование по нормам на фундаменты машин с динамическими нагрузками (СП 26.13330).\n4. Насосы циркуляции 633/251 м³/ч — рамные фундаменты с виброизоляцией, нагрузки < 30 кН.\n5. Этажерка испарителей II ступеней (+8…+9 м) — сталь по СП 16.13330; передача на существующие ростверки только после поверочного расчёта; при дефиците несущей способности — самостоятельные фундаменты этажерки.\n6. Приямки гидрозатворов 2,0–2,5 м — кислотостойкое исполнение, пригрузка/анкеровка от всплытия по УГВ (пластовый дренаж существует), расчёт стен на боковое давление.\n7. Перекрытие +5,000/+6,000 — размещение баков питания/фугата допускается только после поверочного расчёта существующих плит (нагрузки 15–30 кПа локально).\n\nКлиматические нагрузки на существующее здание не изменяются (оборудование внутри); снеговая V района (3,2 кПа) и ветровая II района учитываются только для новых наружных элементов (площадки, эстакады трубопроводов к градирне кислой СОВ). Сейсмичность 6 баллов — по СП 14.13330 специальные мероприятия для 6 баллов как правило не требуются; подтверждить для этажерок высотного оборудования.","items":[{"label":"Испаритель нитки 1 (заполненный)","value":"≈550–650 кН/аппарат (45 т содержимого + корпус)","src":"расчёт БИ по V=34,5 м³, ρ=1,3 т/м³"},{"label":"Испаритель нитки 2 (заполненный)","value":"≈160–200 кН/аппарат","src":"расчёт БИ по V=8,9 м³"},{"label":"Динамика","value":"Центрифуги 1800 об/мин — отдельные виброфундаменты; данные неуравновешенных сил — из ОЛ изготовителя","src":"ИД рис. 4.4/4.5; практика"},{"label":"Плита/этажерка","value":"Локальные нагрузки на перекрытия +5/+6 м — 15–30 кПа; только после поверочного расчёта","src":"оценка БИ"}],"gost":[{"doc":"СП 20.13330.2016","what":"Нагрузки и воздействия; сочетания, коэффициенты надёжности"},{"doc":"СП 26.13330 (актуальная редакция)","what":"Фундаменты машин с динамическими нагрузками — центрифуги, насосы"},{"doc":"СП 16.13330.2017","what":"Стальные конструкции этажерок"},{"doc":"СП 14.13330 (актуальная редакция)","what":"Сейсмика 6 баллов — проверка необходимости мероприятий"}],"open":["Массы и центры тяжести аппаратов, неуравновешенные силы центрифуг — по ОЛ изготовителей","Поверочные расчёты существующих ростверков, перекрытий и каркаса — по результатам обследования (первый этап БИ)"]},{"id":"asu","title":"АСУ участка с прикладным программным обеспечением","kind":"pz","body":"АСУ участка строится по требованиям Приложения №5 к ТЗ («Базовые требования при построении систем автоматизации на пл. Мончегорск») и интегрируется в единую информационно-управляющую систему комплекса с выводом всех показателей в единую диспетчерскую (ТЗ п. 2.10). Поставка АСУ — комплектная, с прикладным программным обеспечением (ТЗ, раздел «Стоимость поставки по Лоту №2»).\n\nСТРУКТУРА (3 уровня): нижний — датчики и исполнительные механизмы (унифицированные с площадкой КГМК серии, 4–20 мА/Modbus); средний — ПЛК российских производителей: REGUL RX00 (Прософт-Системы) или АБАК (НИЦ Инкомсистем), модули с защитным покрытием, гальваническая развязка всех каналов, резерв каналов и посадочных мест ≥30 %; верхний — SCADA AlphaScada (Атомик Софт) на ОС Linux, горячее резервирование серверов, безвентиляторные АРМ (≤2 мониторов).\n\nРЕЖИМЫ И ФУНКЦИИ: основной режим — автоматический (стабилизация температур 40/20 °C, вакуума 0,075 и 0,013–0,02 атм, уровней, плотности пульпы; пуск/останов ниток по отработанным последовательностям; защита при срыве вакуума, сухом ходе, переполнении гидрозатворов); дистанционный и местный — для наладки. Предупредительная/аварийная сигнализация с квитированием; архивирование и предоставление истории.\n\nЭЛЕКТРОПИТАНИЕ АСУ: 1-я категория (ПУЭ п. 1.2.17–1.2.21), серверы — 1-я особая с ИБП двойного преобразования (≥10 мин) и автоматическим байпасом; средний уровень — 24 VDC с резервированием; SNMP-мониторинг всех ИБП и сетевой инфраструктуры.\n\nКОНСТРУКТИВ: шкафы IP65 с козырьком, избыточное давление осушенного воздуха, установка вне технологических зон (отдельное помещение управления участком); кабельные трассы — стеклопластик/композит, ≥10 лет службы; разделение силовых и слаботочных трасс; пневмораспределители — в шкафах пневмоуправления с воздухоподготовкой в безопасной зоне.\n\nППО: передача исходных кодов прикладного ПО контроллеров и визуализации с комментариями (рус./англ.), исключительные права Заказчику, описание переменных при косвенной адресации, методика восстановления после сбоя; лицензии — бессрочные, полный пул на модули и ПО. Весовое хозяйство фасовки — коммерческий учёт по АИС весоизмерения (класс «высокий», передача в ХТД PIMS по REST/Ethernet — Прил. №5). ЗИП АСУТП/КИП — на 2 года, ≥10 % и не менее 1 шт. каждого наименования.","items":[{"label":"ПЛК","value":"REGUL RX00 (Прософт-Системы) / АБАК (Инкомсистем); каналы с гальванической развязкой; запас ≥30 %","src":"Прил. №5"},{"label":"SCADA","value":"AlphaScada (Атомик Софт) на Linux; горячее резервирование; Industrial Ethernet TCP/IP","src":"Прил. №5"},{"label":"Питание","value":"1-я категория, серверы — 1-я особая; ИБП ≥10 мин c байпасом и SNMP","src":"Прил. №5; ПУЭ"},{"label":"ППО","value":"Исходные коды + исключительные права; бессрочные лицензии; интеграция с ХТД PIMS","src":"Прил. №5; ТЗ (стоимость поставки Лота №2)"},{"label":"Диспетчеризация","value":"Все показатели и сигналы — в единую диспетчерскую комплекса ОВЭ-75","src":"ТЗ п. 2.10"}],"gost":[{"doc":"ГОСТ 21.408-2013","what":"Оформление рабочей документации АСУТП"},{"doc":"ПУЭ (изд. 7), п. 1.2.17–1.2.21","what":"Категорийность электроприёмников АСУ"},{"doc":"М ГК НН IT.1.8-2025; СТО 51246464-016-2015","what":"Корпоративная методика проектного документирования и правила оформления (по Прил. №5)"}],"open":["Схема комплекса технических средств АСУ (структурная) — к выпуску БИ после фиксации перечня сигналов","Согласование конкретных серий датчиков с Управлением автоматизации Заказчика"]},{"id":"energo","title":"Расходы пара, воды и энергоресурсов","kind":"calc","body":"ПАР. Глухой (на подогреватели I ступеней): 2,1 + 0,85…0,95 = 2,95–3,05 т/ч. Острый (рабочий пар эжекторов, 6 атм): 0,75 + 0,27 (ПЭБ н.1) + 0,18 + 0,16 (ПЭБ н.2) = 1,36 т/ч. Итого технологический пар участка ≈ 4,3–4,4 т/ч → 36,3 тыс. т/год (8322 ч), без учёта обогрева баков поз. 4.1.5/4.1.26, репульпатора растворения поз. 4.1.7 и подогрева маточника-2 перед транспортировкой (острый пар, периодически — определяется на стадии БИ). Источник пара — редуцированный пар котлов-утилизаторов печи КС, при недостатке — 0,6 МПа из теплоцентра (ИД п. 1.3.13). Для контекста: пар по всему гидрометаллургическому производству — 28 846 Гкал/год (0,417 Гкал/т Cu, ИД табл. 8.5); выпарка купоросов — основной потребитель. Точное распределение по табл. 8.4 ИД (передана изображением) — сверить при БИ.\n\nВОДА КИСЛОЙ СОВ (орошение конденсаторов): 380 + 32 (н.1) + 138 + 18 (н.2) = 568 м³/ч оборотной воды; кросс-проверка: годовой оборот 568 × 8322 = 4,73 млн м³ против 4546 тыс. м³/год по ИД табл. 8.5 (сходимость 96 %). Нагрев ≈ 5 К (22,5 → 27,5 °C), тепло на градирню кислой СОВ ≈ 3,1–3,2 МВт. Профицит воды (конденсат сокового и эжекторного пара) ≈ 4,7 м³/ч — отсекается в производство; в штатном режиме кислая СОВ свежую воду не потребляет (ИД п. 1.3.12, 2.5). Все элементы кислой СОВ — кислотостойкое исполнение (до 0,5 г/л H₂SO₄).\n\nЭЛЕКТРОЭНЕРГИЯ. Установленная мощность по позициям спецификаций ИД (рис. 4.4/4.5): нитка 1 — 22+22 (циркнасосы) + 7,5 (насос репульпатора) + 15 (центрифуга) + 2×1,5 (насосы фугата) = 69,5 кВт; нитка 2 — 11
