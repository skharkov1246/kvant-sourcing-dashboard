<svg id="kts-svg" class="gsvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 620" style="width:1190px;max-width:none;display:block;font-family:system-ui,sans-serif">
    <defs><marker id="mk-kts" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="context-stroke"></path></marker></defs>
    <rect x="0" y="0" width="1190" height="620" fill="#fcfcfb"></rect>
    <rect x="6" y="6" width="1178" height="608" fill="none" stroke="rgba(11,11,11,.10)"></rect>
    <text x="20" y="602" font-size="10" fill="#898781">ЭСКИЗ — не для строительства · структурная схема КТС АСУ ТП (общая для лотов) · источники: Прил. №5 к ТЗ КГМК «Базовые требования… пл. Мончегорск», выпрямители — ИД ч.2 табл. 4.2 · КВАНТ, черновик БИ</text>
    <text x="1174" y="30" font-size="12" font-weight="800" fill="#52514e" text-anchor="end">КТС АСУ ТП · СТРУКТУРНАЯ СХЕМА (ОБЩАЯ ДЛЯ ЛОТОВ)</text><rect x="16" y="46" width="912" height="150" fill="rgba(11,11,11,.10)" opacity=".22"></rect><rect x="16" y="460" width="912" height="130" fill="rgba(11,11,11,.10)" opacity=".22"></rect><path d="M16 196 L928 196" fill="none" stroke="rgba(11,11,11,.10)" stroke-width="1" stroke-dasharray="5 4"></path><path d="M16 268 L928 268" fill="none" stroke="rgba(11,11,11,.10)" stroke-width="1" stroke-dasharray="5 4"></path><path d="M16 460 L928 460" fill="none" stroke="rgba(11,11,11,.10)" stroke-width="1" stroke-dasharray="5 4"></path><path d="M934 46 L934 590" fill="none" stroke="rgba(11,11,11,.10)" stroke-width="1" stroke-dasharray="5 4"></path><text x="26" y="64" font-size="10" font-weight="800" fill="#898781">ВЕРХНИЙ УРОВЕНЬ · SCADA, СЕРВЕРЫ, АРМ</text><text x="26" y="284" font-size="10" font-weight="800" fill="#898781">СРЕДНИЙ УРОВЕНЬ · ПЛК И УСО</text><text x="26" y="478" font-size="10" font-weight="800" fill="#898781">ПОЛЕВОЙ УРОВЕНЬ</text><text x="1065" y="64" font-size="10" font-weight="800" fill="#898781" text-anchor="middle">СМЕЖНЫЕ / ВНЕШНИЕ СИСТЕМЫ</text><path d="M30 224 L944 224" fill="none" stroke="#2a78d6" stroke-width="3"></path><path d="M30 232 L944 232" fill="none" stroke="#2a78d6" stroke-width="3"></path><text x="112" y="213" font-size="9" font-weight="800" fill="#2a78d6">МАГИСТРАЛЬ INDUSTRIAL ETHERNET (IEEE 802.3) · TCP/IP</text><text x="660" y="213" font-size="9" font-weight="800" fill="#2a78d6">РЕЗЕРВИРОВАННАЯ СЕТЬ</text><text x="205" y="249" font-size="8.5" fill="#52514e">управляемые промышленные коммутаторы · кольцо / звезда / иерархия</text><text x="650" y="249" font-size="8.5" fill="#52514e">оптика SC (одномод) / витая пара кат. 5 · без вентиляторов</text><path d="M100 176 L100 222" fill="none" stroke="#2a78d6" stroke-width="2"></path><path d="M470 176 L470 222" fill="none" stroke="#2a78d6" stroke-width="2"></path><path d="M640 176 L640 222" fill="none" stroke="#2a78d6" stroke-width="2"></path><path d="M908 176 L908 222" fill="none" stroke="#2a78d6" stroke-width="2"></path><text x="914" y="205" font-size="8" fill="#898781">SNMP</text><rect x="43" y="99" width="215" height="84" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.2" opacity=".45"></rect><rect x="36" y="92" width="215" height="84" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"></rect><text x="143.5" y="109" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">СЕРВЕРЫ SCADA ×2</text><text x="143.5" y="122" font-size="9" fill="#52514e" text-anchor="middle">AlphaScada · АО «Атомик Софт» · ОС Linux</text><text x="143.5" y="134" font-size="9" fill="#52514e" text-anchor="middle">горячее резервирование верхнего уровня</text><text x="143.5" y="146" font-size="9" fill="#52514e" text-anchor="middle">ИВК: сбор, обработка, хранение,</text><text x="143.5" y="158" font-size="9" fill="#52514e" text-anchor="middle">диагностика; история процесса</text><rect x="274" y="92" width="220" height="84" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"></rect><text x="384" y="109" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">АРМ ОПЕРАТОРОВ</text><text x="384" y="122" font-size="9" fill="#52514e" text-anchor="middle">безвентиляторные, не более 2 мониторов</text><text x="384" y="134" font-size="9" fill="#52514e" text-anchor="middle">дистанционное управление, блокировки</text><text x="384" y="146" font-size="9" fill="#52514e" text-anchor="middle">мнемосхемы, тренды, история</text><text x="384" y="158" font-size="9" fill="#52514e" text-anchor="middle">сигнализация с квитированием</text><rect x="506" y="92" width="150" height="84" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"></rect><text x="581" y="109" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">ИНЖЕНЕРНАЯ СТАНЦИЯ</text><text x="581" y="122" font-size="9" fill="#52514e" text-anchor="middle">питание — I «особая»</text><text x="581" y="134" font-size="9" fill="#52514e" text-anchor="middle">категория (с ИБП)</text><rect x="679" y="99" width="252" height="84" rx="7" fill="none" stroke="#fab219" stroke-width="1.2" opacity=".45"></rect><rect x="672" y="92" width="252" height="84" rx="7" fill="#fcfcfb" stroke="#fab219" stroke-width="1.6"></rect><text x="798" y="109" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">ИБП ДВОЙНОГО ПРЕОБРАЗОВАНИЯ</text><text x="798" y="122" font-size="9" fill="#52514e" text-anchor="middle">I «особая» категория · АВР «на сеть»</text><text x="798" y="134" font-size="9" fill="#52514e" text-anchor="middle">автоматический байпас · Ethernet + SNMP</text><text x="798" y="146" font-size="9" fill="#52514e" text-anchor="middle">230 В, 50 Гц стабилизированное, 10 мин и более</text><path d="M188 232 L188 296" fill="none" stroke="#2a78d6" stroke-width="2.4"></path><path d="M635 232 L635 318" fill="none" stroke="#2a78d6" stroke-width="2.4"></path><circle cx="188" cy="228" r="3" fill="#2a78d6"></circle><circle cx="635" cy="228" r="3" fill="#2a78d6"></circle><rect x="36" y="296" width="452" height="120" rx="8" fill="none" stroke="#52514e" stroke-width="1"></rect><text x="46" y="310" font-size="8.5" fill="#898781">ШКАФЫ АСУ: IP65 · избыточное давление осушенного воздуха · вводы снизу, сальники</text><rect x="48" y="318" width="280" height="88" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"></rect><text x="188" y="335" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">ПЛК РОССИЙСКОГО ПРОИЗВОДСТВА</text><text x="188" y="348" font-size="9" fill="#52514e" text-anchor="middle">REGUL RX00 (Прософт-Системы) · АБАК («Инкомсистем»)</text><text x="188" y="360" font-size="9" fill="#52514e" text-anchor="middle">сбор и обработка, буферизация, управление,</text><text x="188" y="372" font-size="9" fill="#52514e" text-anchor="middle">защиты и блокировки по алгоритмам</text><text x="188" y="384" font-size="9" fill="#52514e" text-anchor="middle">запас каналов и мест 30 % и более · conformal coating</text><rect x="340" y="318" width="136" height="88" rx="7" fill="#fcfcfb" stroke="#fab219" stroke-width="1.6"></rect><text x="408" y="335" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">ПИТАНИЕ 24 VDC</text><text x="408" y="348" font-size="9" fill="#52514e" text-anchor="middle">I категория (ПУЭ)</text><text x="408" y="360" font-size="9" fill="#52514e" text-anchor="middle">резервирование,</text><text x="408" y="372" font-size="9" fill="#52514e" text-anchor="middle">элементы автономности</text><text x="408" y="384" font-size="9" fill="#52514e" text-anchor="middle">отдельные БП для В/В</text><rect x="527" y="325" width="230" height="88" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.2" opacity=".45" stroke-dasharray="6 4"></rect><rect x="520" y="318" width="230" height="88" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="635" y="335" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">СТАНЦИИ УДАЛЁННОГО В/В</text><text x="635" y="348" font-size="9" fill="#52514e" text-anchor="middle">выносные станции УСО</text><text x="635" y="360" font-size="9" fill="#52514e" text-anchor="middle">по отделениям и участкам</text><text x="635" y="372" font-size="9" fill="#52514e" text-anchor="middle">подключение в резервированную сеть</text><text x="635" y="384" font-size="9" fill="#52514e" text-anchor="middle">предложение БИ — уточняется</text><rect x="770" y="318" width="158" height="88" rx="7" fill="#fcfcfb" stroke="#898781" stroke-width="1.6"></rect><text x="849" y="335" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">КАБЕЛЬНЫЕ ТРАССЫ</text><text x="849" y="348" font-size="9" fill="#52514e" text-anchor="middle">композитные материалы,</text><text x="849" y="360" font-size="9" fill="#52514e" text-anchor="middle">цвет RAL 5015 · экраны</text><text x="849" y="372" font-size="9" fill="#52514e" text-anchor="middle">разнос от силовых цепей</text><text x="849" y="384" font-size="9" fill="#52514e" text-anchor="middle">ЧРП и АСУ — разные шкафы</text><rect x="36" y="424" width="714" height="30" rx="6" fill="#fcfcfb" stroke="#a34e9e" stroke-width="1.6"></rect><text x="393" y="437" font-size="9.5" font-weight="800" fill="#a34e9e" text-anchor="middle">ГАЛЬВАНИЧЕСКАЯ РАЗВЯЗКА КАЖДОГО КАНАЛА</text><text x="393" y="448" font-size="8.5" fill="#52514e" text-anchor="middle">модуль — на каждый аналоговый · реле — на каждый дискретный · развязка цифровых (кроме Ethernet), включая резервные</text><path d="M188 406 L188 424" fill="none" stroke="#a34e9e" stroke-width="1.6"></path><path d="M635 406 L635 424" fill="none" stroke="#a34e9e" stroke-width="1.6"></path><path d="M200 496 L200 458" fill="none" stroke="#a34e9e" stroke-width="1.6" marker-end="url(#mk-kts)"></path><text x="206" y="478" font-size="9" fill="#a34e9e">4–20 мА (AI) · Modbus RTU (HART — уточняется)</text><path d="M455 458 L455 496" fill="none" stroke="#a34e9e" stroke-width="1.6" marker-end="url(#mk-kts)"></path><text x="461" y="478" font-size="9" fill="#a34e9e">DI/DO · управление</text><rect x="36" y="496" width="260" height="70" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"></rect><text x="166" y="513" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">ДАТЧИКИ КИП</text><text x="166" y="526" font-size="9" fill="#52514e" text-anchor="middle">первичные преобразователи — линейки КГМК</text><text x="166" y="538" font-size="9" fill="#52514e" text-anchor="middle">(согласуются с Заказчиком)</text><text x="166" y="550" font-size="9" fill="#52514e" text-anchor="middle">индивидуальный источник питания каждого КИП</text><rect x="330" y="496" width="250" height="70" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"></rect><text x="455" y="513" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">ИСПОЛНИТЕЛЬНЫЕ МЕХАНИЗМЫ</text><text x="455" y="526" font-size="9" fill="#52514e" text-anchor="middle">элементы управления ИМ — как на КГМК</text><text x="455" y="538" font-size="9" fill="#52514e" text-anchor="middle">датчики положения — беспотенциальные,</text><text x="455" y="550" font-size="9" fill="#52514e" text-anchor="middle">предпочтителен индуктивный метод</text><rect x="614" y="496" width="250" height="70" rx="7" fill="#fcfcfb" stroke="#898781" stroke-width="1.6"></rect><text x="739" y="513" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">ШКАФЫ ПНЕВМОУПРАВЛЕНИЯ</text><text x="739" y="526" font-size="9" fill="#52514e" text-anchor="middle">пневмоострова, плиты горячей замены</text><text x="739" y="538" font-size="9" fill="#52514e" text-anchor="middle">сдвоенные блоки подготовки воздуха с байпасом</text><text x="739" y="550" font-size="9" fill="#52514e" text-anchor="middle">безопасная зона с подпором воздуха</text><path d="M614 548 L584 548" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#mk-kts)"></path><path d="M944 222 L944 121 L960 121" fill="none" stroke="#2a78d6" stroke-width="2.2"></path><path d="M944 234 L944 440 L960 440" fill="none" stroke="#2a78d6" stroke-width="2.2"></path><path d="M944 330 L960 330" fill="none" stroke="#2a78d6" stroke-width="2.2"></path><path d="M944 440 L944 538 L960 538" fill="none" stroke="#fab219" stroke-width="1.8" stroke-dasharray="5 4"></path><rect x="960" y="92" width="210" height="58" rx="7" fill="#fcfcfb" stroke="#0ca30c" stroke-width="1.6"></rect><text x="1065" y="109" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">КОРПОРАТИВНЫЕ ИС</text><text x="1065" y="122" font-size="9" fill="#52514e" text-anchor="middle">интеграция существующих ИС</text><text x="1065" y="134" font-size="9" fill="#52514e" text-anchor="middle">стандартизированным методом</text><text x="960" y="280" font-size="8.5" fill="#2a78d6">IEEE 802.3 / 802.11 (Wi-Fi) · TCP/IP</text><rect x="960" y="286" width="210" height="88" rx="7" fill="#fcfcfb" stroke="#898781" stroke-width="1.6"></rect><text x="1065" y="303" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">АИС ВЕСОИЗМЕРЕНИЯ</text><text x="1065" y="316" font-size="9" fill="#52514e" text-anchor="middle">весовые терминалы → ХТД PIMS</text><text x="1065" y="328" font-size="9" fill="#52514e" text-anchor="middle">идентификация по пропуску (СКУД)</text><text x="1065" y="340" font-size="9" fill="#52514e" text-anchor="middle">Wi-Fi точка в каждом шкафу, GSM-резерв</text><text x="1065" y="352" font-size="9" fill="#52514e" text-anchor="middle">ИБП: дв. преобразование, АВР, 20 мин</text><text x="960" y="392" font-size="8.5" fill="#2a78d6">Ethernet · IP-видео (PoE)</text><rect x="960" y="398" width="210" height="84" rx="7" fill="#fcfcfb" stroke="#898781" stroke-width="1.6"></rect><text x="1065" y="415" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">СПТ · ВИДЕОНАБЛЮДЕНИЕ</text><text x="1065" y="428" font-size="9" fill="#52514e" text-anchor="middle">SCADA «Интеллект» (ITV, Москва)</text><text x="1065" y="440" font-size="9" fill="#52514e" text-anchor="middle">IP-камеры (PoE), видеорегистратор</text><text x="1065" y="452" font-size="9" fill="#52514e" text-anchor="middle">архив не менее 1,5 месяцев</text><text x="960" y="492" font-size="8.5" fill="#fab219">Modbus TCP (вне лотов)</text><rect x="960" y="498" width="210" height="80" rx="7" fill="#fcfcfb" stroke="#fab219" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="1065" y="515" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">ВЫПРЯМИТЕЛЬНЫЕ АГРЕГАТЫ</text><text x="1065" y="528" font-size="9" fill="#52514e" text-anchor="middle">смежная поставка — вне лотов</text><text x="1065" y="540" font-size="9" fill="#52514e" text-anchor="middle">задание и телеметрия по Modbus TCP</text><text x="1065" y="552" font-size="9" fill="#52514e" text-anchor="middle">Лот №3: 3 × 47 кА / 227(250) В</text></svg>