    <text x="20" y="584" font-size="10" fill="#898781">ЭСКИЗ — не для строительства · материальные потоки СГП (Лот №4) · источники: bi_lot4.json — ТЗ п. 6.2–6.4, ИД п. 1.3.11, Прил. №5; производные величины — расчёт БИ · КВАНТ, черновик БИ</text>
    <text x="1174" y="30" font-size="12" font-weight="800" fill="#52514e" text-anchor="end">МАТЕРИАЛЬНЫЕ ПОТОКИ · ЛОТ №4 — СКЛАД ГОТОВОЙ ПРОДУКЦИИ</text><rect x="18" y="52" width="184" height="104" rx="7" fill="none" stroke="#0ca30c" stroke-width="1.6"></rect><text x="110" y="69" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ИЗ ЭЭ — ЛОТ №3</text><text x="110" y="83" font-size="9.5" fill="#52514e" text-anchor="middle">выходной конвейер КСМ</text><text x="110" y="95" font-size="9.5" fill="#52514e" text-anchor="middle">катоды М00к · 75 000 т/год</text><text x="110" y="107" font-size="9.5" fill="#52514e" text-anchor="middle">пакет 2500 ± 50 кг · 1,0 × 1,0 м</text><text x="110" y="119" font-size="9.5" fill="#52514e" text-anchor="middle">56–64 листа (при номинале ≈54)</text><text x="110" y="131" font-size="9.5" fill="#52514e" text-anchor="middle">3 ленты увязки</text><text x="110" y="143" font-size="9.5" fill="#52514e" text-anchor="middle">приёмка 358 сут (8585 ч/год)</text><line x1="208" y1="46" x2="208" y2="160" stroke="#0ca30c" stroke-width="1.2" stroke-dasharray="6 4"></line><text x="208" y="40" font-size="8" fill="#0ca30c" text-anchor="middle">передаточные ворота — граница проектирования (ТЗ п. 6.2)</text><rect x="236" y="56" width="158" height="72" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="315" y="73" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">КОНВЕЙЕР ПРИЁМКИ</text><text x="315" y="87" font-size="9.5" fill="#52514e" text-anchor="middle">3,5 пакета/ч средний</text><text x="315" y="99" font-size="9.5" fill="#52514e" text-anchor="middle">пик до 7 пакетов/ч</text><text x="315" y="111" font-size="9.5" fill="#52514e" text-anchor="middle">идентификация — QR с КСМ</text><rect x="452" y="56" width="176" height="72" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="540" y="73" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ВЕСЫ ПРИЁМКИ</text><text x="540" y="87" font-size="9.5" fill="#52514e" text-anchor="middle">платформенные · НПВ 3 т</text><text x="540" y="99" font-size="9.5" fill="#52514e" text-anchor="middle">класс точности «высокий»</text><text x="540" y="111" font-size="9.5" fill="#52514e" text-anchor="middle">допуск 2500 ± 50 кг → АИС</text><rect x="690" y="56" width="200" height="80" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="790" y="73" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">УВЯЗКА И МАРКИРОВКА</text><text x="790" y="87" font-size="9.5" fill="#52514e" text-anchor="middle">контроль/дотяжка 3 лент увязки</text><text x="790" y="99" font-size="9.5" fill="#52514e" text-anchor="middle">2 этикетки с QR на пакет</text><text x="790" y="111" font-size="9.5" fill="#52514e" text-anchor="middle">принтеры: термо (Zebra) + лазерный</text><text x="790" y="123" font-size="9.5" fill="#52514e" text-anchor="middle">маркировка — ГОСТ 14192-96</text><path d="M202 94 L236 94" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><path d="M394 94 L452 94" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><path d="M628 94 L690 94" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><text x="423" y="88" font-size="8" fill="#2a78d6" text-anchor="middle">84 пак./сут</text><path d="M540 128 L540 168 L311 168 L311 196" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><text x="430" y="161" font-size="8.5" fill="#2a78d6" text-anchor="middle">вне допуска · пробы (ТЗ п. 6.4)</text><path d="M790 136 L790 168 L660 168 L660 196" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><text x="800" y="158" font-size="8.5" fill="#2a78d6" text-anchor="start">позиция выдачи → штабелёр</text><rect x="228" y="196" width="166" height="72" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="311" y="213" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">РАЗБРАКОВКА · ПРОБЫ</text><text x="311" y="227" font-size="9.5" fill="#52514e" text-anchor="middle">пакеты вне допуска массы</text><text x="311" y="239" font-size="9.5" fill="#52514e" text-anchor="middle">сверловка проб на химанализ</text><text x="311" y="251" font-size="9.5" fill="#52514e" text-anchor="middle">возврат листов в пакет</text><path d="M394 232 L430 232" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><text x="412" y="225" font-size="8" fill="#2a78d6" text-anchor="middle">возврат</text><rect x="430" y="196" width="310" height="98" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="585" y="213" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ЗОНА АДРЕСНОГО ХРАНЕНИЯ</text><text x="585" y="227" font-size="9.5" fill="#52514e" text-anchor="middle">буфер 1200 пакетов = 3000 т ≈ 14,3 сут (расчёт БИ)</text><text x="585" y="239" font-size="9.5" fill="#52514e" text-anchor="middle">диапазон проверки 7–15 сут = 1467–3143 т</text><text x="585" y="251" font-size="9.5" fill="#52514e" text-anchor="middle">2 яруса · пятно ≈1600 м² · адресные линии 1,0 × 1,0 м</text><text x="585" y="263" font-size="9.5" fill="#52514e" text-anchor="middle">адрес = линия × позиция × ярус · FIFO · резерв партий</text><text x="585" y="275" font-size="9.5" fill="#52514e" text-anchor="middle">штабелёры 3 шт. (2 раб. + 1 рез.) · г/п 3,2–5 т · Li-ion</text><text x="610" y="308" font-size="8" fill="#898781" text-anchor="middle">3-й ярус — по результатам обследования пола (уточняется)</text><path d="M740 245 L790 245" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><rect x="790" y="210" width="184" height="90" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="882" y="227" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">КОМПЛЕКТАЦИЯ ПАРТИИ</text><text x="882" y="241" font-size="9.5" fill="#52514e" text-anchor="middle">контрольные весы · НПВ 3 т</text><text x="882" y="253" font-size="9.5" fill="#52514e" text-anchor="middle">резервирование адресов у фронтов</text><text x="882" y="265" font-size="9.5" fill="#52514e" text-anchor="middle">партия (пример): 20 ваг. = 1350 т</text><text x="882" y="277" font-size="9.5" fill="#52514e" text-anchor="middle">отгрузка — после химанализа проб</text><path d="M974 232 L988 232 L988 204 L1004 204" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><path d="M974 268 L988 268 L988 318 L1004 318" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><rect x="1004" y="168" width="170" height="92" rx="7" fill="none" stroke="#0ca30c" stroke-width="1.6"></rect><text x="1089" y="185" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ОТГРУЗКА Ж/Д</text><text x="1089" y="199" font-size="9.5" fill="#52514e" text-anchor="middle">фронт 4–6 вагонов (60–90 м)</text><text x="1089" y="211" font-size="9.5" fill="#52514e" text-anchor="middle">полувагоны — кран с траверсой</text><text x="1089" y="223" font-size="9.5" fill="#52514e" text-anchor="middle">крытые вагоны — штабелёры</text><text x="1089" y="235" font-size="9.5" fill="#52514e" text-anchor="middle">вагонные весы · ≈3 вагона/сут</text><text x="1089" y="247" font-size="9.5" fill="#52514e" text-anchor="middle">(оба варианта — БИ, уточняется)</text><rect x="1004" y="290" width="170" height="60" rx="7" fill="none" stroke="#0ca30c" stroke-width="1.6"></rect><text x="1089" y="307" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ОТГРУЗКА АВТО</text><text x="1089" y="321" font-size="9.5" fill="#52514e" text-anchor="middle">2 поста погрузки штабелёром</text><text x="1089" y="333" font-size="9.5" fill="#52514e" text-anchor="middle">автомобильные весы на выезде</text><text x="1174" y="372" font-size="8.5" fill="#0ca30c" text-anchor="end">ворота ж/д и авто — граница проектирования (ТЗ п. 6.2)</text><rect x="18" y="402" width="190" height="60" rx="7" fill="none" stroke="#898781" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="113" y="419" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ИС КСМ — ЛОТ №3</text><text x="113" y="433" font-size="9.5" fill="#52514e" text-anchor="middle">атрибуты пакета: №, масса,</text><text x="113" y="445" font-size="9.5" fill="#52514e" text-anchor="middle">партия/плавка · график выгрузки</text><rect x="18" y="490" width="190" height="56" rx="7" fill="none" stroke="#898781" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="113" y="507" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">СКУД</text><text x="113" y="521" font-size="9.5" fill="#52514e" text-anchor="middle">идентификация оператора</text><text x="113" y="533" font-size="9.5" fill="#52514e" text-anchor="middle">доступ в автоматическую зону</text><rect x="280" y="396" width="300" height="96" rx="7" fill="none" stroke="#898781" stroke-width="1.6"></rect><text x="430" y="413" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">АСУ СГП (WMS) — ТЗ п. 6.4</text><text x="430" y="427" font-size="9.5" fill="#52514e" text-anchor="middle">роботы · набор партий · разбраковка</text><text x="430" y="439" font-size="9.5" fill="#52514e" text-anchor="middle">взвешивание · отбор проб на сверловку</text><text x="430" y="451" font-size="9.5" fill="#52514e" text-anchor="middle">ПЛК REGUL RX00/АБАК · AlphaScada (Linux)</text><text x="430" y="463" font-size="9.5" fill="#52514e" text-anchor="middle">серверы WMS — горячее резервирование</text><text x="430" y="475" font-size="9.5" fill="#52514e" text-anchor="middle">карта «что и где стоит» · задания по Wi-Fi</text><rect x="640" y="396" width="300" height="96" rx="7" fill="none" stroke="#898781" stroke-width="1.6"></rect><text x="790" y="413" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">АИС ВЕСОИЗМЕРЕНИЯ — ПРИЛ. №5</text><text x="790" y="427" font-size="9.5" fill="#52514e" text-anchor="middle">весы: приёмка · контроль · вагонные · авто</text><text x="790" y="439" font-size="9.5" fill="#52514e" text-anchor="middle">класс «высокий» · СИ из Госреестра, поверка</text><text x="790" y="451" font-size="9.5" fill="#52514e" text-anchor="middle">«безадресные» по QR · передача REST</text><text x="790" y="463" font-size="9.5" fill="#52514e" text-anchor="middle">терминалы → атрибуты → ХТД PIMS</text><text x="790" y="475" font-size="9.5" fill="#52514e" text-anchor="middle">ИБП ≥20 мин · автономность без связи</text><rect x="1004" y="396" width="170" height="48" rx="7" fill="none" stroke="#898781" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="1089" y="413" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ХТД PIMS</text><text x="1089" y="427" font-size="9.5" fill="#52514e" text-anchor="middle">все результаты взвешиваний</text><rect x="1004" y="486" width="170" height="48" rx="7" fill="none" stroke="#898781" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="1089" y="503" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ЕДИНАЯ ДИСПЕТЧЕРСКАЯ</text><text x="1089" y="517" font-size="9.5" fill="#52514e" text-anchor="middle">вывод показателей (ТЗ п. 2.10)</text><path d="M208 430 L280 430" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text x="244" y="423" font-size="8" fill="#898781" text-anchor="middle">атрибуты пакета</text><path d="M580 424 L640 424" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text x="610" y="417" font-size="8" fill="#898781" text-anchor="middle">массы, допуски</text><path d="M640 452 L580 452" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text x="610" y="464" font-size="8" fill="#898781" text-anchor="middle">адреса, статусы</text><path d="M940 420 L1004 420" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text x="972" y="413" font-size="8" fill="#898781" text-anchor="middle">взвешивания</text><path d="M430 492 L430 556 L980 556 L980 510 L1004 510" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text x="700" y="550" font-size="8" fill="#898781" text-anchor="middle">показатели — в единую диспетчерскую</text><path d="M208 518 L700 518 L700 492" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text x="350" y="511" font-size="8" fill="#898781" text-anchor="middle">идентификация — в АИС</text><path d="M470 396 L470 294" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text transform="rotate(-90 462 345)" x="462" y="345" font-size="8" fill="#898781" text-anchor="middle">задания штабелёрам</text><path d="M330 396 L330 268" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text transform="rotate(-90 322 332)" x="322" y="332" font-size="8" fill="#898781" text-anchor="middle">задание на разбраковку/пробы</text><path d="M750 396 L750 316 L830 316 L830 290" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-pfd4)"></path><text x="758" y="310" font-size="8" fill="#898781" text-anchor="start">контрольное взвешивание</text><path d="M628 41 L654 41" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mk-pfd4)"></path><text x="660" y="44" font-size="8" fill="#52514e" text-anchor="start">материальный поток (пакеты)</text><path d="M822 41 L848 41" fill="none" stroke="#898781" stroke-width="1" stroke-dasharray="4 3"></path><text x="854" y="44" font-size="8" fill="#52514e" text-anchor="start">инф. связи АСУ/АИС</text><path d="M1008 41 L1034 41" fill="none" stroke="#0ca30c" stroke-width="1.2" stroke-dasharray="6 4"></path><text x="1040" y="44" font-size="8" fill="#52514e" text-anchor="start">границы (ТЗ п. 6.2)</text></svg>