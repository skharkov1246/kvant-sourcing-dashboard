<svg id="el3-svg" class="gsvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 590" style="width:1190px;max-width:none;display:block;font-family:system-ui,sans-serif">
    <defs><marker id="mk-el3" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="context-stroke"></path></marker></defs>
    <rect x="0" y="0" width="1190" height="590" fill="#fcfcfb"></rect>
    <rect x="6" y="6" width="1178" height="578" fill="none" stroke="rgba(11,11,11,.10)"></rect>
    <text x="20" y="576" font-size="10" fill="#898781">ЭСКИЗ — не для строительства · однолинейная схема-интерфейс электроснабжения отделения ЭЭ (Лот №3) · источники: база решений БИ, расчётная модель (L3-NB, EL-TOTAL), решения по АСУ · КВАНТ, черновик БИ</text>
    <text x="1174" y="30" font-size="12" font-weight="800" fill="#52514e" text-anchor="end">ОДНОЛИНЕЙНАЯ СХЕМА · ЛОТ №3 — ЭЛЕКТРОСНАБЖЕНИЕ ОТДЕЛЕНИЯ ЭЭ</text>
    <rect x="40" y="46" width="330" height="76" rx="7" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="205" y="63" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">СЕТИ ВНЕШНЕГО ЭЛ.СНАБЖЕНИЯ · ГПП</text><text x="205" y="77" font-size="9.5" fill="#52514e" text-anchor="middle">схема и номиналы ГПП в ИД не заданы — обобщённо</text><text x="205" y="89" font-size="9.5" fill="#52514e" text-anchor="middle">ТУ на присоединение (граница 5.2.7) —</text><text x="205" y="101" font-size="9.5" fill="#52514e" text-anchor="middle">запрашиваются по расчёту нагрузок БИ</text><text x="205" y="116" font-size="8.5" font-style="italic" fill="#898781" text-anchor="middle">вне лота / интерфейс</text><rect x="430" y="46" width="390" height="76" rx="7" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="625" y="63" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">РУ · ПРЕОБРАЗОВАТЕЛЬНАЯ ПОДСТАНЦИЯ</text><text x="625" y="77" font-size="9.5" fill="#52514e" text-anchor="middle">нагрузка комплекса: ср. ≈17,3 МВт / уст. ≈21 МВт (EL-TOTAL)</text><text x="625" y="89" font-size="9.5" fill="#52514e" text-anchor="middle">Лот №3 (ЭЭ) — доминанта: ср. 16,07 МВт</text><text x="625" y="101" font-size="9.5" fill="#52514e" text-anchor="middle">I категория (ПУЭ 1.2.17–21); перерыв ≤ 2 ч — пассивация анодов</text><text x="625" y="116" font-size="8.5" font-style="italic" fill="#898781" text-anchor="middle">вне лота / интерфейс</text><path d="M370 84 L430 84" fill="none" stroke="#fab219" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><path d="M625 122 L625 136 M245 136 L945 136" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="6 4"></path><path d="M245 136 L245 150" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><path d="M595 136 L595 150" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><path d="M945 136 L945 150" fill="none" stroke="#fab219" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><rect x="120" y="150" width="250" height="68" rx="7" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="245" y="167" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ВА-1 · ВЫПРЯМИТЕЛЬ СЕРИИ 1</text><text x="245" y="181" font-size="9.5" fill="#52514e" text-anchor="middle">47,0 кА; 227 В ном / 250 В макс</text><text x="245" y="193" font-size="9.5" fill="#52514e" text-anchor="middle">задание на стыке — от БИ Лота №3</text><text x="245" y="212" font-size="8.5" font-style="italic" fill="#898781" text-anchor="middle">вне лота / интерфейс</text><rect x="470" y="150" width="250" height="68" rx="7" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="595" y="167" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ВА-Р · РЕЗЕРВНЫЙ АГРЕГАТ</text><text x="595" y="181" font-size="9.5" fill="#52514e" text-anchor="middle">47,0 кА; 227 В ном / 250 В макс</text><text x="595" y="193" font-size="9.5" fill="#52514e" text-anchor="middle">перекрёстная ошиновка — на любую серию</text><text x="595" y="212" font-size="8.5" font-style="italic" fill="#898781" text-anchor="middle">вне лота / интерфейс</text><rect x="820" y="150" width="250" height="68" rx="7" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="945" y="167" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ВА-2 · ВЫПРЯМИТЕЛЬ СЕРИИ 2</text><text x="945" y="181" font-size="9.5" fill="#52514e" text-anchor="middle">47,0 кА; 227 В ном / 250 В макс</text><text x="945" y="193" font-size="9.5" fill="#52514e" text-anchor="middle">задание на стыке — от БИ Лота №3</text><text x="945" y="212" font-size="8.5" font-style="italic" fill="#898781" text-anchor="middle">вне лота / интерфейс</text><path d="M245 218 L245 336" fill="none" stroke="#fab219" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><path d="M945 218 L945 336" fill="none" stroke="#fab219" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><path d="M560 218 L560 252 L245 252" fill="none" stroke="#fab219" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><path d="M630 218 L630 252 L945 252" fill="none" stroke="#fab219" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><text x="595" y="266" font-size="8.8" fill="#fab219" text-anchor="middle">резерв — на любую серию (перекрёстная ошиновка; вне лота)</text><text x="252" y="280" font-size="8.8" fill="#898781" text-anchor="start">магистральные шины —</text><text x="252" y="291" font-size="8.8" fill="#898781" text-anchor="start">вне лота / интерфейс</text><text x="952" y="280" font-size="8.8" fill="#898781" text-anchor="start">магистральные шины —</text><text x="952" y="291" font-size="8.8" fill="#898781" text-anchor="start">вне лота / интерфейс</text><text x="595" y="298" font-size="8.5" fill="#898781" text-anchor="middle">размещение ВА — у торца корпуса ЭЭ 36 × 190 м (сценарий Б, блок L3-NB): короткие магистральные шины</text><line x1="20" y1="318" x2="1132" y2="318" stroke="#0ca30c" stroke-width="1.6" stroke-dasharray="10 6"></line><text x="24" y="311" font-size="10" font-weight="700" fill="#0ca30c" text-anchor="start">ГРАНИЦА ПОСТАВКИ ЛОТА №3 — контактные площадки концевых сборных шин первой/последней ванны серии</text><text x="1126" y="311" font-size="8.5" fill="#898781" text-anchor="end">выше — пунктир: вне лота / интерфейс · ниже — сплошное: поставка лота</text><rect x="60" y="336" width="400" height="96" rx="7" fill="none" stroke="#fab219" stroke-width="1.6"></rect><text x="260" y="353" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">СЕРИЯ 1 — 90 ВАНН ПОСЛЕДОВАТЕЛЬНО</text><text x="260" y="367" font-size="9.5" fill="#52514e" text-anchor="middle">U ванны 2,05 В ном / 2,5 В макс</text><text x="260" y="379" font-size="9.5" fill="#52514e" text-anchor="middle">U серии 190 В ном / макс ≈225 В</text><text x="260" y="391" font-size="9.5" fill="#52514e" text-anchor="middle">I: 42,45 кА эксп. · 47,04 кА ном (280 А/м²)</text><text x="260" y="403" font-size="9.5" fill="#52514e" text-anchor="middle">P ≈8,06 МВт · 84 катода в ванне, шаг 95 мм</text><rect x="480" y="336" width="220" height="96" rx="7" fill="none" stroke="#fab219" stroke-width="1.6"></rect><text x="590" y="353" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ОШИНОВКА СЕРИЙ</text><text x="590" y="367" font-size="9.5" fill="#52514e" text-anchor="middle">межванновая: 0,06 В/ванну</text><text x="590" y="379" font-size="9.5" fill="#52514e" text-anchor="middle">шины в межванновом зазоре 85 мм</text><text x="590" y="391" font-size="9.5" fill="#52514e" text-anchor="middle">шунтирование: закорач. рама 8,7 т</text><text x="590" y="403" font-size="9.5" fill="#52514e" text-anchor="middle">16,1 МВт · 1940 кВт·ч/т на шинах</text><rect x="720" y="336" width="390" height="96" rx="7" fill="none" stroke="#fab219" stroke-width="1.6"></rect><text x="915" y="353" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">СЕРИЯ 2 — 90 ВАНН ПОСЛЕДОВАТЕЛЬНО</text><text x="915" y="367" font-size="9.5" fill="#52514e" text-anchor="middle">U ванны 2,05 В ном / 2,5 В макс</text><text x="915" y="379" font-size="9.5" fill="#52514e" text-anchor="middle">U серии 190 В ном / макс ≈225 В</text><text x="915" y="391" font-size="9.5" fill="#52514e" text-anchor="middle">I: 42,45 кА эксп. · 47,04 кА ном (280 А/м²)</text><text x="915" y="403" font-size="9.5" fill="#52514e" text-anchor="middle">P ≈8,06 МВт · 84 катода в ванне, шаг 95 мм</text><path d="M460 384 L480 384" fill="none" stroke="#fab219" stroke-width="2.2"></path><path d="M700 384 L720 384" fill="none" stroke="#fab219" stroke-width="2.2"></path><rect x="40" y="476" width="350" height="72" rx="7" fill="none" stroke="#d03b3b" stroke-width="1.6"></rect><text x="215" y="493" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ИЗОЛИРУЮЩИЕ СТЫКИ И ЭЛ. РАЗРЫВЫ</text><text x="215" y="507" font-size="9.5" fill="#52514e" text-anchor="middle">разрыв на подаче/приёме растворов каждой ванны</text><text x="215" y="519" font-size="9.5" fill="#52514e" text-anchor="middle">и на коллекторах серий (ПУЭ 7.10; ИД п. 4.2.2)</text><text x="215" y="531" font-size="9.5" fill="#52514e" text-anchor="middle">изоляция ванн от конструкций; контроль изоляции</text><rect x="420" y="476" width="340" height="72" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="590" y="493" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">МОНИТОРИНГ U ПО ВАННАМ (в лоте)</text><text x="590" y="507" font-size="9.5" fill="#52514e" text-anchor="middle">90 точек на серию — мВ-измерения на шинах</text><text x="590" y="519" font-size="9.5" fill="#52514e" text-anchor="middle">U менее 1,8 В — КЗ: карта КЗ, задание крану/ИК</text><text x="590" y="531" font-size="9.5" fill="#52514e" text-anchor="middle">U более 2,5 В — деградация контактов/анодов</text><rect x="800" y="476" width="340" height="72" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="970" y="493" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">АСУ ОТДЕЛЕНИЯ (Лот №3)</text><text x="970" y="507" font-size="9.5" fill="#52514e" text-anchor="middle">питание I категории: 230 В 50 Гц, стабилизированное</text><text x="970" y="519" font-size="9.5" fill="#52514e" text-anchor="middle">серверы — I особая: ИБП двойного преобр. ≥ 10 мин</text><text x="970" y="531" font-size="9.5" fill="#52514e" text-anchor="middle">байпас ИБП, АВР, SNMP; средний уровень 24 VDC</text><path d="M150 432 L150 476" fill="none" stroke="#d03b3b" stroke-width="1.4" marker-end="url(#mk-el3)"></path><path d="M380 432 L380 454 L540 454 L540 476" fill="none" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#mk-el3)"></path><path d="M880 432 L880 454 L640 454 L640 476" fill="none" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#mk-el3)"></path><text x="457" y="450" font-size="8.8" fill="#2a78d6" text-anchor="middle">U ванн (мВ)</text><path d="M760 512 L800 512" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#mk-el3)"></path><path d="M1140 505 L1158 505 L1158 184 L1070 184" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mk-el3)"></path><text x="1147" y="358" font-size="8.8" fill="#2a78d6" text-anchor="middle" transform="rotate(-90 1147 358)">Modbus TCP (JIC-08): задание/телеметрия · I ≤ 47,0 кА · U серии ≤ 225 В</text></svg>