    <text x="20" y="382" font-size="10" fill="#898781">ЭСКИЗ — не для строительства · PFD Лот №1 «Цех обжига» · потоки и параметры — ИД табл. 22–23 (проверены расчётной моделью) · КВАНТ, черновик БИ</text>
    <text x="1174" y="30" font-size="12" font-weight="800" fill="#52514e" text-anchor="end">PFD · ЛОТ №1 — ЦЕХ ОБЖИГА</text><rect x="315" y="60" width="150" height="66" rx="7" fill="none" stroke="#e07f2e" stroke-width="1.6"></rect><text x="390" y="78" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ПЕЧЬ КС</text><text x="390" y="92" font-size="9.5" fill="#52514e" text-anchor="middle">обжиг в кипящем слое</text><text x="390" y="104" font-size="9.5" fill="#52514e" text-anchor="middle">шихта 15,45 т/ч (ИД табл. 23)</text><text x="390" y="116" font-size="9.5" fill="#52514e" text-anchor="middle">автогенно: 36,7 ГДж/ч</text><rect x="508" y="60" width="154" height="66" rx="7" fill="none" stroke="#e07f2e" stroke-width="1.6"></rect><text x="585" y="78" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">КОТЁЛ-УТИЛИЗАТОР</text><text x="585" y="92" font-size="9.5" fill="#52514e" text-anchor="middle">газ 882,8 → 400 °C</text><text x="585" y="104" font-size="9.5" fill="#52514e" text-anchor="middle">пар 1,9 МПа / 375 °C</text><text x="585" y="116" font-size="9.5" fill="#52514e" text-anchor="middle">~4,1 т/ч</text><rect x="700" y="60" width="96" height="66" rx="7" fill="none" stroke="#a34e9e" stroke-width="1.6"></rect><text x="748" y="78" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ЦИКЛОНЫ</text><text x="748" y="92" font-size="9.5" fill="#52514e" text-anchor="middle">пыль</text><text x="748" y="104" font-size="9.5" fill="#52514e" text-anchor="middle">8 165 т/год</text><rect x="820" y="60" width="124" height="66" rx="7" fill="none" stroke="#a34e9e" stroke-width="1.6"></rect><text x="882" y="78" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ЭЛЕКТРОФИЛЬТР</text><text x="882" y="92" font-size="9.5" fill="#52514e" text-anchor="middle">пыль 2 916 т/год</text><text x="882" y="104" font-size="9.5" fill="#52514e" text-anchor="middle">очистка до СКЦ</text><rect x="976" y="72" width="86" height="44" rx="7" fill="none" stroke="#e07f2e" stroke-width="1.6"></rect><text x="1019" y="98" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ДЫМОСОС</text><rect x="1090" y="48" width="84" height="90" rx="7" fill="none" stroke="#0ca30c" stroke-width="1.6"></rect><text x="1132" y="66" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">В СКЦ</text><text x="1132" y="80" font-size="9.5" fill="#52514e" text-anchor="middle">13 262 нм³/ч</text><text x="1132" y="92" font-size="9.5" fill="#52514e" text-anchor="middle">387 °C, Ø1100</text><text x="1132" y="104" font-size="9.5" fill="#52514e" text-anchor="middle">сера в газ</text><text x="1132" y="116" font-size="9.5" fill="#52514e" text-anchor="middle">21,3 тыс. т/год</text><path d="M465 93  L508 93" fill="none" stroke="#e07f2e" stroke-width="1.7" marker-end="url(#mkA)"></path><text x="486.5" y="88" font-size="9.3" fill="#e07f2e" text-anchor="middle">882,8 °C</text><path d="M662 93  L700 93" fill="none" stroke="#e07f2e" stroke-width="1.7" marker-end="url(#mkA)"></path><text x="681" y="88" font-size="9.3" fill="#e07f2e" text-anchor="middle">400 °C</text><path d="M796 93  L820 93" fill="none" stroke="#e07f2e" stroke-width="1.7" marker-end="url(#mkA)"></path><path d="M944 93  L976 93" fill="none" stroke="#e07f2e" stroke-width="1.7" marker-end="url(#mkA)"></path><text x="960" y="88" font-size="9.3" fill="#e07f2e" text-anchor="middle">387 °C</text><path d="M1062 93  L1090 93" fill="none" stroke="#e07f2e" stroke-width="1.7" marker-end="url(#mkA)"></path><rect x="20" y="40" width="150" height="50" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="95" y="58" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">ФИЛЬТРАЦИЯ КЕКА</text><text x="95" y="72" font-size="9.5" fill="#52514e" text-anchor="middle">вакуум-фильтры 2×32 м²</text><text x="95" y="84" font-size="9.5" fill="#52514e" text-anchor="middle">фильтрат → возврат в ОРФ</text><rect x="20" y="130" width="15