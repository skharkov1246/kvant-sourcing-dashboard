t-anchor="middle">донная выгрузка печи</text><text x="545" y="254" font-size="9.5" fill="#52514e" text-anchor="middle">огарок 19,5 % расхода</text><rect x="660" y="210" width="150" height="50" rx="7" fill="none" stroke="#2a78d6" stroke-width="1.6"></rect><text x="735" y="228" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">КОНВЕЙЕРЫ ОГАРКА</text><text x="735" y="242" font-size="9.5" fill="#52514e" text-anchor="middle">тракт огарка и пыли</text><rect x="880" y="196" width="214" height="78" rx="7" fill="none" stroke="#0ca30c" stroke-width="1.6"></rect><text x="987" y="214" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">НА ВЫЩЕЛАЧИВАНИЕ</text><text x="987" y="228" font-size="9.5" fill="#52514e" text-anchor="middle">огарок 81,9 тыс. т/год (77,0 %)</text><text x="987" y="240" font-size="9.5" fill="#52514e" text-anchor="middle">+ пыли 20,2 тыс. т/год (19,0 %)</text><text x="987" y="252" font-size="9.5" fill="#52514e" text-anchor="middle">сера: в огарке 0,2 %, в пыли 2,2 %</text><text x="987" y="264" font-size="9.5" fill="#52514e" text-anchor="middle">граница проектирования Лота №1</text><path d="M395 126 L395 235 L450 235" fill="none" stroke="#e07f2e" stroke-width="1.7" marker-end="url(#mkA)"></path><text x="400" y="180" font-size="9.3" fill="#e07f2e">огарок</text><path d="M640 235  L660 235" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mkA)"></path><path d="M810 235  L880 235" fill="none" stroke="#2a78d6" stroke-width="1.7" marker-end="url(#mkA)"></path><path d="M584 126 L584 168 L720 168 L720 210" fill="none" stroke="#a34e9e" stroke-width="1.5" marker-end="url(#mkA)"></path><path d="M738 126 L738 210" fill="none" stroke="#a34e9e" stroke-width="1.5" marker-end="url(#mkA)"></path><path d="M881 126 L881 168 L760 168 L760 210" fill="none" stroke="#a34e9e" stroke-width="1.5" marker-end="url(#mkA)"></path><text x="598" y="160" font-size="9.3" fill="#a34e9e">пыль КУ 9 081 т/год</text><text x="775" y="200" font-