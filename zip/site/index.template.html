<script>
const SUPA_URL="https://vpjliavuuxjcvtxbthlp.supabase.co", SUPA_KEY="sb_publishable_z74BF5VzezeQfTc9fni-ZA_HMyTKRTJ";
const SEED=[/*__SEED__*/];
const DEMAND=[/*__DEMAND__*/];
const COMPET=[/*__COMPET__*/];
const MATNODES=[/*__MATNODES__*/];
const MATSUP=[/*__MATSUP__*/];
const MATPROC=[/*__MATPROC__*/];
const MATTEXT=[/*__MATTEXT__*/][0]||"";

const $=id=>document.getElementById(id);
let POS=[], ODM={}, PRICES={}, DRAW={}, SAMPLES={}, sortK="pp", sortA=true, LIVE=false;

const SAMPC={"заказан":"#8957e5","в пути":"#1f6feb","на складе":"#0a8a5f","на тесте":"#d98e00","одобрен":"#1a7f37","брак":"#cf222e","возврат":"#8a97a6"};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function esc(s){return (s??"").toString().replace(/</g,"&lt;");}
function locBadge(s){s=s||"не начато";const c=LOCC[s]||"#8a97a6";return `<span class="loc" style="background:${c}">${esc(s)}</span>`;}
async function fetchAll(table){let all=[],from=0,sz=1000;while(true){const {data,error}=await sb.from(table).select("*").range(from,from+sz-1);if(error||!data||!data.length)break;all=all.concat(data);if(data.length<sz)break;from+=sz;}return all;}
function fromSeed(){POS=SEED.map(s=>Object.assign({},s.pos,{id:s.pos.pp}));ODM={};PRICES={};DRAW={};SAMPLES={};SEED.forEach(s=>{ODM[s.pos.pp]=(s.odm||[]).map(o=>Object.assign({},o));PRICES[s.pos.pp]=(s.prices||[]).map(o=>Object.assign({},o));SAMPLES[s.pos.pp]=(s.samples||[]).map(o=>Object.assign({},o));});}

  let ok=false;
  if(sb){try{

      LIVE=true;ok=true;}
  }catch(e){}}

  POS.sort((a,b)=>(a.pp||0)-(b.pp||0));
  POS.forEach(d=>d._s=((d.catalog_no||"")+" "+(d.name||"")+" "+(d.note||"")+" "+(d.model||"")+" "+(d.oem||"")+" "+(d.pp||"")+" "+(d.owner||"")).toLowerCase());
  const cats=[...new Set(POS.map(d=>d.category))].filter(Boolean).sort();
  $("fcat").innerHTML='<option value="">Все категории ('+POS.length+')</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  const oems=[...new Set(POS.map(d=>d.oem))].filter(Boolean).sort();
  $("foem").innerHTML='<option value="">Все OEM</option>'+oems.map(c=>`<option>${esc(c)}</option>`).join("");
  $("floc").innerHTML='<option value="">Локализация: все</option>'+LOC.map(c=>`<option>${esc(c)}</option>`).join("");
  $("mode").textContent=LIVE?"● онлайн — правки сохраняются":"● офлайн-копия (нет связи с БД)";
  $("mode").style.color=LIVE?"#1a7f37":"#9a6700";
  render();
}
// патч in-memory записи (чтобы после правки и повторного открытия карточки данные были свежими)
function patchMem(tb,id,f,val){
  const fix=arr=>{const r=(arr||[]).find(x=>x.id==id);if(r)r[f]=(val===""?null:val);};
  if(tb=="positions"){const r=POS.find(x=>x.id==id);if(r)r[f]=(val===""?null:val);}
  else if(tb=="odm_suppliers")Object.values(ODM).forEach(fix);
  else if(tb=="price_records")Object.values(PRICES).forEach(fix);
  else if(tb=="drawings")Object.values(DRAW).forEach(fix);
  else if(tb=="samples")Object.values(SAMPLES).forEach(fix);
}
async function upd(table,id,field,val){
  patchMem(table,id,field,val);
  if(!LIVE){toast("Офлайн-копия — правки не сохранятся");return;}
  const o={};o[field]=val===""?null:val;
  const {error}=await sb.from(table).update(o).eq("id",id);
  toast(error?("ошибка: "+error.message):"сохранено ✓");
}
function bdg(c){c=(c||"").toLowerCase();return c=="high"?'<span class="bdg b-h">high</span>':c=="med"?'<span class="bdg b-m">med</span>':c=="low"?'<span class="bdg b-l">low</span>':"";}
function edc(table,id,field,val){return `<span contenteditable data-tb="${table}" data-id="${id}" data-f="${field}">${esc(val)}</span>`;}
function sel(tb,id,f,val,opts){return `<select data-tb="${tb}" data-id="${id}" data-f="${f}">`+opts.map(o=>`<option ${(val||"")==o?"selected":""}>${esc(o)}</option>`).join("")+`</select>`;}
function seln(tb,id,f,val,opts){return `<select data-tb="${tb}" data-id="${id}" data-f="${f}"><option value="">—</option>`+opts.map(o=>`<option ${(val||"")==o?"selected":""}>${esc(o)}</option>`).join("")+`</select>`;}
function isActionable(d){return ACTIONABLE.includes(d.loc_status||"");}
function render(){
  const q=$("q").value.toLowerCase().trim(),fc=$("fcat").value,fe=$("foem").value,fb=$("fbtx").value,fl=$("floc").value,fcr=$("fcrit").value,fo=$("fodm").checked,fn=$("fnoodm").checked,fa=$("fact").checked;
  let a=POS.filter(d=>{const n=(ODM[d.id]||[]).length;
    if(fc&&d.category!==fc)return 0;if(fe&&d.oem!==fe)return 0;if(fb&&(d.bitrix_status||"")!==fb)return 0;
    if(fl&&(d.loc_status||"не начато")!==fl)return 0;if(fcr&&(d.criticality||"")!==fcr)return 0;
    if(fa&&!isActionable(d))return 0;
    if(fo&&!n)return 0;if(fn&&n)return 0;if(q&&!d._s.includes(q))return 0;return 1;});
  a.sort((x,y)=>{let u=x[sortK],v=y[sortK];const nu=parseFloat(u),nv=parseFloat(v);if(!isNaN(nu)&&!isNaN(nv)){u=nu;v=nv;}return (u>v?1:u<v?-1:0)*(sortA?1:-1);});
  let h=`<table><thead><tr>
   <th data-k="pp">П/П</th><th data-k="category">Категория</th><th data-k="catalog_no">Каталог №</th>
   <th data-k="name">Наименование</th><th data-k="oem">OEM</th><th data-k="loc_status">Локализация</th>
   <th data-k="price_eur_competitor">Цена «врагов» €</th><th data-k="price_min">Ориентир €</th><th>Наша цена</th><th data-k="hs_code">HS</th>

  a.forEach(d=>{const odm=ODM[d.id]||[],ns=(SAMPLES[d.id]||[]).length;
    h+=`<tr><td class="cn">${d.pp??""}</td><td class="cat">${esc(d.category)}</td><td class="cn">${esc(d.catalog_no)}</td>
     <td>${esc(d.name)}<div class="mut" style="font-size:11px">${esc(d.model||d.note)}</div></td><td>${esc(d.oem)}</td>
     <td>${locBadge(d.loc_status)}${d.criticality?` <span class="bdg">${esc(d.criticality)}</span>`:""}</td><td class="eur">${d.price_eur_competitor??""}</td>
     <td class="eur" title="${esc(d.price_src)}">${priceCell(d)}</td>
     <td class="eur">${d.plan_price??'<span class="mut">—</span>'}</td><td class="hs mut" title="${esc(d.hs_code)}">${shortHs(d.hs_code)}</td>
     <td class="odmcell" data-tg="${d.id}">${odm.length?`<b>${odm.length}:</b> `+odm.slice(0,2).map(o=>esc(o.name)).join("; ")+(odm.length>2?` +${odm.length-2}`:"")+" ▸":'<span class="mut">— нет</span> ▸'}</td>
     <td class="cn">${ns?`<b style="color:#0a8a5f">${ns}</b>`:'<span class="mut">0</span>'}</td>
     <td><select data-tb="positions" data-id="${d.id}" data-f="bitrix_status">${BX.map(s=>`<option ${(d.bitrix_status||"")==s?"selected":""}>${s||"—"}</option>`).join("")}</select></td></tr>

function buildDetail(d){const odm=ODM[d.id]||[];return masterBox(d)+materialBox(d)+infoBox(d)+bitrixBox(d)+priceBox(d)+sampleBox(d)+drawBox(d)+odmCards(d,odm);}
// классификатор позиции в узел перфоратора → рекомендация материала из стратегии
function nodeByTag(re){return MATNODES.find(m=>re.test(m.part_class||""));}
function matchNode(d){
  const s=((d.name||"")+" "+(d.note||"")+" "+(d.model||"")).toLowerCase(),cat=(d.category||"");
  if(/хвостовик|shank/.test(s))return nodeByTag(/хвостовик|shank/i);
  if(/бо[её]к|поршень|piston|striker|ударник/.test(s))return nodeByTag(/бо[её]к|piston/i);
  if(/аккумулятор|мембран|диафрагм|diaphragm/.test(s))return nodeByTag(/мембран|диафрагм|diaphragm|accumulator/i);
  if(/втулк|букс|bushing/.test(s))return nodeByTag(/втулк|букс|bushing/i);
  if(/клапан|valve|распредел/.test(s))return nodeByTag(/клапан|valve/i)||nodeByTag(/корпус|цилиндр|головк/i);
  if(/корпус|головк|цилиндр|front head|cylinder/.test(s))return nodeByTag(/корпус|цилиндр|головк/i);
  if(/коронк|штанг|drill bit|\brod\b|буров/.test(s))return nodeByTag(/буровой инструмент|коронк|drill bit/i);
  if(/уплотн|манжет|\bseal\b|кольц|u-ring|сальник/.test(s)||/^01 Перф|^03 РТИ/.test(cat))return nodeByTag(/уплотнен|манжет|seal/i)||nodeByTag(/мембран|diaphragm/i);
  if(/^02 Перф/.test(cat))return nodeByTag(/корпус|цилиндр|головк/i);
  return null;
}

function csvDl(name,rows,cols){
  const q=v=>{v=(v==null?"":String(v)).replace(/"/g,'""');return /[";\n]/.test(v)?'"'+v+'"':v;};
  const lines=[cols.join(";")].concat(rows.map(r=>cols.map(c=>q(r[c])).join(";")));
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=window.URL.createObjectURL(blob);a.download=name;a.click();
}

$("grid").addEventListener("click",async e=>{
  const tg=e.target.closest("[data-tg]");if(tg){toggleDetail(tg.dataset.tg);return;}
  const rb=e.target.closest("[data-rfq]");
  if(rb){if(!LIVE){toast("Офлайн-копия — RFQ недоступен");return;}
    const {error}=await sb.from("rfq_requests").insert({odm_supplier_id:+rb.dataset.rfq,position_id:+rb.dataset.pos,status:"queued"});
    rb.textContent=error?"ошибка":"в очереди ✓";rb.disabled=!error;toast(error?error.message:"RFQ поставлен в очередь");return;}
  const ap=e.target.closest("[data-addp]");
  if(ap){if(!LIVE){toast("Офлайн-копия — правки не сохранятся");return;}
    const pid=+ap.dataset.addp;
    const {data,error}=await sb.from("price_records").insert({position_id:pid,source:"кп",currency:"EUR",confidence:"med",created_by:"ручной"}).select();
    if(error){toast(error.message);return;}
    (PRICES[pid]=PRICES[pid]||[]).push(data[0]);toast("строка добавлена ✓");refreshDetail(pid);return;}
  const dp=e.target.closest("[data-delp]");
  if(dp){if(!LIVE){toast("Офлайн-копия");return;}
    const rid=+dp.dataset.delp,pid=+dp.dataset.pos;
    const {error}=await sb.from("price_records").delete().eq("id",rid);
    if(error){toast(error.message);return;}
    PRICES[pid]=(PRICES[pid]||[]).filter(x=>x.id!=rid);toast("удалено");refreshDetail(pid);return;}
  // + образец
  const as=e.target.closest("[data-adds]");
  if(as){if(!LIVE){toast("Офлайн-копия — правки не сохранятся");return;}
    const pid=+as.dataset.adds;
    const {data,error}=await sb.from("samples").insert({position_id:pid,status:"заказан",currency:"USD",created_by:"сайт"}).select();
    if(error){toast(error.message);return;}
    (SAMPLES[pid]=SAMPLES[pid]||[]).push(data[0]);toast("образец добавлен ✓");refreshDetail(pid);return;}
  // удалить образец (+ фото)
  const ds=e.target.closest("[data-dels]");
  if(ds){if(!LIVE){toast("Офлайн-копия");return;}
    const rid=+ds.dataset.dels,pid=+ds.dataset.pos,path=ds.dataset.path;
    if(path)await sb.storage.from("samples").remove([path]);
    const {error}=await sb.from("samples").delete().eq("id",rid);
    if(error){toast(error.message);return;}
    SAMPLES[pid]=(SAMPLES[pid]||[]).filter(x=>x.id!=rid);toast("образец удалён");refreshDetail(pid);return;}
  // скачать фото образца
  const dls=e.target.closest("[data-dls]");
  if(dls){e.preventDefault();if(!LIVE){toast("Доступно онлайн");return;}
    const {data,error}=await sb.storage.from("samples").createSignedUrl(dls.dataset.dls,120);
    if(error||!data){toast(error?error.message:"нет ссылки");return;}window.open(data.signedUrl,"_blank");return;}
  const dd=e.target.closest("[data-deld]");
  if(dd){if(!LIVE){toast("Офлайн-копия");return;}
    const rid=+dd.dataset.deld,pid=+dd.dataset.pos,path=dd.dataset.path;
    if(path)await sb.storage.from("drawings").remove([path]);
    const {error}=await sb.from("drawings").delete().eq("id",rid);
    if(error){toast(error.message);return;}
    DRAW[pid]=(DRAW[pid]||[]).filter(x=>x.id!=rid);toast("файл удалён");refreshDetail(pid);return;}
  const dl=e.target.closest("[data-dl]");
  if(dl){e.preventDefault();if(!LIVE){toast("Скачивание доступно онлайн");return;}
    const {data,error}=await sb.storage.from("drawings").createSignedUrl(dl.dataset.dl,120);
    if(error||!data){toast(error?error.message:"нет ссылки");return;}window.open(data.signedUrl,"_blank");return;}
});

function statsHtml(){
  const byCat={};let withOdm=0,noOdm=0,hi=0,me=0,lo=0,total=0,withPrice=0,priceRecs=0,drawCnt=0,sampCnt=0,actCnt=0;
  const loc={},samp={};LOC.forEach(l=>loc[l]=0);SAMP.forEach(s=>samp[s]=0);
  POS.forEach(d=>{const n=(ODM[d.id]||[]).length,pn=(PRICES[d.id]||[]).length,dn=(DRAW[d.id]||[]).length,sn=(SAMPLES[d.id]||[]);
    byCat[d.category]=byCat[d.category]||{t:0,c:0,p:0};byCat[d.category].t++;
    if(n){byCat[d.category].c++;withOdm++;}else noOdm++;
    if(pn){byCat[d.category].p++;withPrice++;priceRecs+=pn;}drawCnt+=dn;
    loc[d.loc_status||"не начато"]=(loc[d.loc_status||"не начато"]||0)+1;
    if(isActionable(d))actCnt++;
    sn.forEach(s=>{sampCnt++;samp[s.status||"заказан"]=(samp[s.status||"заказан"]||0)+1;});});
  Object.values(ODM).forEach(arr=>arr.forEach(o=>{total++;if(o.confidence=="high")hi++;else if(o.confidence=="med")me++;else if(o.confidence=="low")lo++;}));
  // топ-экономия: позиции с ≥2 ценовыми записями → разброс max-min (грубо, без учёта валют)

    <td>${bdg(cf)}</td><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">↗</a>`:""}</td></tr>`;});
  h+=`</tbody></table>`;
  if(!rows.length)h+=`<div class="mut">ничего не найдено.</div>`;
  return h;
}

function supKey(n){return (n||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/[.,]/g,"").replace(/\b(co|ltd|inc|llc|limited|the)\b/g,"").replace(/\s+/g," ").trim();}
function supList(){
  const m={};
  POS.forEach(d=>(ODM[d.id]||[]).forEach(o=>{const k=supKey(o.name);if(!k)return;
    const e=m[k]||(m[k]={disp:o.name,pps:[],cats:{},url:"",scores:[],best:""});
    if(!e.pps.includes(d.pp))e.pps.push(d.pp);
    e.cats[d.category]=(e.cats[d.category]||0)+1;
    if(!e.url&&o.catalog_url)e.url=o.catalog_url;
    const av=scoreAvg(o);if(av!="—")e.scores.push(+av);
    if(o.status=="одобрен")e.best="одобрен";else if(o.status=="в тесте"&&e.best!="одобрен")e.best="в тесте";
    if((o.name||"").length>(e.disp||"").length)e.disp=o.name;
  }));
  return Object.values(m).map(e=>{e.score=e.scores.length?(e.scores.reduce((a,b)=>a+b,0)/e.scores.length).toFixed(1):"—";return e;}).sort((a,b)=>b.pps.length-a.pps.length);
}
let SUPCACHE=[];
function supHtml(){
  const L=supList();SUPCACHE=L;
  let h=`<div class="mut" style="margin-bottom:8px">${L.length} поставщиков (заводов). Группировка: кому слать <b>один RFQ на пакет позиций</b>. Балл — средняя скоркарта по позициям. Клик по строке — список П/П; 📨 — выгрузить RFQ-пакет (CSV).</div>`;
  h+=`<input id="qsup" placeholder="поиск поставщика…" style="margin-bottom:8px;padding:6px 8px;width:300px;border:1px solid var(--ln);border-radius:6px">`;
  h+=`<table class="ot" id="suptab"><thead><tr><th>Поставщик (завод)</th><th>Позиций</th><th>Балл</th><th>Лучший статус</th><th>Топ-категории</th></tr></thead><tbody>`;
  L.forEach((s,i)=>{const tc=Object.entries(s.cats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([c,n])=>`${esc(c)} (${n})`).join(", ");
    const nm=s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.disp)}</a>`:esc(s.disp);
    h+=`<tr class="suprow" data-si="${i}" style="cursor:pointer"><td>${nm} <button class="rfq" data-rfqpack="${i}" title="выгрузить RFQ-пакет">📨</button> <span class="mut">▸</span></td><td class="cn"><b>${s.pps.length}</b></td><td class="cn">${s.score}</td><td>${s.best?`<span class="bdg ${s.best=="одобрен"?"b-h":"b-m"}">${s.best}</span>`:""}</td><td class="mut">${tc}</td></tr>
        <tr class="supdet hide" id="sd-${i}"><td colspan="5" class="cn mut" style="white-space:normal;font-size:11px">П/П (${s.pps.length}): ${s.pps.slice().sort((a,b)=>a-b).join(", ")}</td></tr>`;});
  return h+"</tbody></table>";
}
$("suppliers").addEventListener("click",e=>{
  const rb=e.target.closest("[data-rfqpack]");
  if(rb){const s=SUPCACHE[+rb.dataset.rfqpack];if(!s)return;
    const pset=new Set(s.pps);const rows=POS.filter(d=>pset.has(d.pp)).map(d=>({pp:d.pp,catalog_no:d.catalog_no,name:d.name,oem:d.oem,qty_year:d.annual_qty,target_price:d.plan_price,rec_material:(matchNode(d)||{}).alt_material||""}));
    csvDl("RFQ_"+(s.disp||"supplier").replace(/[^\w\-]+/g,"_").slice(0,40)+".csv",rows,["pp","catalog_no","name","oem","qty_year","target_price","rec_material"]);
