# Прод-стенд «КВАНТ Скан» на одном облачном сервере.
#
# Что здесь есть и чего намеренно нет:
#  * api      — HTTP-слой платформы (тот же образ, что у воркеров);
#  * caddy    — TLS и единственная дверь наружу; сертификат Let's Encrypt
#               выпускается сам, продлевается сам;
#  * poller   — опрос Bitrix отдельным процессом (падение опроса не должно
#               ронять приём событий с телефонов, §09.2). Выключен по
#               умолчанию: включается профилем, когда владелец заведёт
#               отдельный смарт-процесс под сканирование.
#
# Базы данных здесь НЕТ намеренно: PostgreSQL — управляемый в облаке
# (бэкапы, обновления, реплики — не наша забота), приложение ходит в него
# по TLS. Файлы — в S3-бакете, а не на диске сервера: диск умирает вместе
# с сервером, бакет — нет.

services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Стенд обязан кричать, а не молчать: без ключа приёмка честно
      # деградирует в ручную проверку, и это видно в /health/ready.
      PYTHONUNBUFFERED: "1"
    volumes:
      # Корневой сертификат управляемой базы: TLS-проверка имени сервера
      # остаётся строгой (sslmode=verify-full), а не отключается «чтобы
      # заработало».
      - ./certs:/app/certs:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddyfile читает {$KVANT_DOMAIN} и хеш пароля контролёра из своего
    # окружения — без env_file прокси поднимется на пустом имени и дверь
    # окажется без TLS и без пароля.
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Поллер Bitrix: docker compose --profile bitrix up -d
  poller:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./certs:/app/certs:ro
    command: ["python", "-m", "connectors.bitrix_poller"]
    profiles: ["bitrix"]
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
