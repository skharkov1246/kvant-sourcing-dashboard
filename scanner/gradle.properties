# Обязательные флаги сборки Android/KMP; без useAndroidX AGP отказывается
# собирать проект с зависимостями androidx.*.
android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# iOS-таргеты объявлены в shared, но на Linux-агенте не собираются —
# не считать это ошибкой конфигурации.
kotlin.native.ignoreDisabledTargets=true
# KGP 2.0.21 формально не тестировался с AGP 8.7.3 — связка проверена
# реальной сборкой APK, предупреждение не несёт информации.
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
