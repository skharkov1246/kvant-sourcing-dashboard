ine-business-of-ansaldo-energia"}, {"year": "2023", "what": "18.06 — санкции США запрещают американским компаниям оказывать инжиниринговые услуги в РФ", "src": ""}, {"year": "2025", "what": "Июль, 18-й пакет ЕС — немедленный запрет экспорта запчастей ГТУ по коду 841199 в РФ и Белоруссию, с запретом сервиса и ТО. Отгрузка по контрактам до 20.07.2025 — только до 20.10.2025", "src": "Отчётность Ansaldo Energia 2025"}, {"year": "2025", "what": "23.10 — Регламент (ЕС) 2025/2033 (19-й пакет) вносит товарную позицию <b>8411 целиком</b> в Приложение XXIII Регламента 833/2014. Без «ex», без порогов мощности, без изъятий для энергетики", "src": "https://eur-lex.europa.eu/eli/reg/2014/833/2026-04-24/eng"}, {"year": "2026", "what": "01.04 — возврат к прибыли, промышленный план 2026-2030. 20.07 — заказ на 8 AE64.3A для дата-центра в Техасе. 01.09 — TÜV SÜD сертифицирует GT36 на 70% H₂, DNV валидирует AE94.3A на HVO", "src": ""}], "sites": [{"name": "Генуя, Campi", "country": "Италия", "what": "Историческая площадка, Via Nicola Lorenzi 8. 219 000 м² общей, 131 000 м² застроенной, ~800 станков, ~570 чел. производства. Campi 1 — сборка средних и крупных турбин, сборка камер сгорания, механообработка роторов генераторов. Campi 2 — генераторы: медные шины статоров, статоры, испытания перед отгрузкой. Электроэрозионная обработка профилей лопаток, TIG, сварка под флюсом. Ротор GT36 — ~160 т, длина ~14 м", "src": "https://www.ansaldoenergia.com/know-how-enablers/manufacturing/factory"}, {"name": "Генуя, Fegino", "country": "Италия", "what": "Реконструирован в 2017. Механообработка роторов турбин, высокоскоростная испытательная камера роторов (spin pit), обработка, контроль и установка лопаток. <b>HGP Genoa Repair Centre</b> — электроэрозия, 3D-ремонт лопаток, <b>~5500 лопаток в год</b> (уточнено по брошюре Global Repair)", "src": ""}, {"name": "Генуя, Cornigliano", "country": "Италия", "what": "Сборочный цех, открыт 16.06.2017, инвестиции >€65 млн. 4 модульных сборочных стенда — можно о rs/manufacturing/repair-center"}, {"name": "Шанхай", "country": "Китай", "what": "Два СП: Shanghai Electric Gas Turbine Co. (SEGT) — Ansaldo 40%, выручка €168,2 млн (2025), собственный капитал отрицательный (−€3,4 млн); Ansaldo Gas Turbines High Technology (AGTT) — Ansaldo 60%, выручка €12,6 млн. Роль СП — финальная сборка, закупка вспомогательного оборудования в КНР, продажи. <b>Горячая часть в Китае НЕ локализована</b> — идёт из Генуи, поток ~€80 млн в год", "src": ""}, {"name": "Rheden", "country": "Нидерланды", "what": "<b>БОЛЬШЕ НЕ ANSALDO.</b> Ansaldo Thomassen B.V. продана Hanwha 29.06.2021 → Thomassen Energy B.V., Havelandseweg 8-d, 6991 GS Rheden, KvK 24272908, +31 26 497 5800, info@thomassen.psm.com. Профиль — рамы GE (Frame 5, 6B, 7B/E/EA, 9E, 6F) и Siemens/Westinghouse 501D. Машин Ansaldo в номенклатуре нет", "src": "https://thomassen.energy/about/"}]}, "models": [{"name": "AE94.2", "legacy": "V94.2 / SGT5-2000E", "cls": "E", "power": "190 МВт", "eff": "36,8%", "cc_eff": "55,8 / 56,2%", "rpm": "3000", "stages": "16 / 4", "combustor": "2 силосные камеры, по 8 гибридных горелок (16 всего), футеровка индивидуально заменяемыми плитками", "fleet": "120+ ед., >10 млн EOH. Плюс версия <b>AE94.2K</b> под низкокалорийные топлива (до 4000 кДж/кг и ниже) — синтез-газы, доменный и коксовый газ"}, {"name": "AE64.3A", "legacy": "V64.3A / SGT-1000F", "cls": "малый F", "power": "78 МВт", "eff": "36,9%", "cc_eff": "55,7 / 56,4%", "rpm": "5400 + редуктор", "stages": "15 / 4", "combustor": "кольцевая, 24 сухие двухтопливные горелки, индивидуально заменяемые плитки", "fleet": "73 ед., >4 млн EOH. Единственная редукторная машина семейства — работает и на 50, и на 60 Гц"}, {"name": "AE94.3A", "legacy": "V94.3A / SGT5-4000F", "cls": "F", "power": "340 МВт", "eff": "40,3%", "cc_eff": "60,0 / 60,3%", "rpm": "3000", "stages": "15 / 4", "combustor": "кольцевая «walk-in», 24 горелки DLN премикс (газ и жидкое), керамические плитки", "fleet": "96 ед. (80 в ПГУ + 16 в открытом цикле), >5 млн EOH. У Siemens по этой платформе продано 380+ машин, >29 млн EOH"}, {"name": "GT26", "legacy": "Alstom", "cls": "Advanced F", "power": "370 МВт", "eff": "41%", "cc_eff": "61,0 / 61,2%", "rpm": "3000", "stages": "22 / 1 ВД + 4 НД", "combustor": "последовательное сжигание: кольцевая EV (24 горелки) → ТВД → кольцевая SEV (24 горелки). Всего 48 горелок", "fleet": "110 ед., из них 78 на технологии Ansaldo, >9 млн EOH. Эмиссионно-соответствующая работа до 15% нагрузки ПГУ"}, {"name": "GT36-S5", "legacy": "—", "cls": "H", "power": "563 МВт", "eff": "43,0%", "cc_eff": "62,6 / 62,8%", "rpm": "3000", "stages": "15 / 4", "combustor": "can-annular с последовательным сжиганием (CPSC). ⚠ «16 жаровых труб на 50 Гц» первоисточником не подтверждено — брошюра Ansaldo ограничивается словом «cannular». <b>FlameSheet — не технология GT36</b>: это ретрофитная камера PSM для E- и F-class машин GE и Siemens", "fleet": "5 ед. (Marghera Levante, Presenzano, Tavazzano, Fusina — Италия; Minhang — Китай), >80 000 EOH к 07.2026, первая инспекция B1 пройдена. Сертификат TÜV SÜD на 70% H₂"}, {"name": "GT36-S6", "legacy": "—", "cls": "H", "power": "369 МВт", "eff": "42,3%", "cc_eff": "~62,3%", "rpm": "3600", "stages": "15 / 4", "combustor": "то же, can-annular CPSC. Число жаровых труб первоисточником не подтверждено", "fleet": "версия 60 Гц; коммерческих заказов подтвердить не удалось"}, {"name": "AE-T100", "legacy": "Turbec", "cls": "микро", "power": "100 кВт", "eff": "30%", "cc_eff": "до 90% (когенерация)", "rpm": "70 000", "stages": "1 / 1", "combustor": "одна камера типа CAN, 4,5 бар абс., TIT 950 °C", "fleet": "действующий продукт. Версии NG (газ), B (биогаз), E (внешний подвод тепла), исполнения Power only и CHP. Испытана на смеси до 80% H₂"}], "model_notes": ["<b>Что Ansaldo не публикует.</b> Для тяжёлых ГТУ в брошюрах нет степени сжатия, оборотов, температуры на входе в турбину, массы и габаритов. Ближайшие проверяемые ориентиры — паспорта Siemens на ту же платформу: SGT5-2000E — π*=12,8:1, 198 МВт / 37,6%, 558 кг/с, 536 °C; SGT5-4000F — π*=20,1:1 (329 МВт / 41%) или 21,0:1 (385 МВт / 41,5%), 724 и 800 кг/с, 599 и 619 °C, масса 318-322 т, габарит 10,8×5,2×4,8 м. Учтите: Ansaldo даёт net, Siemens — gross, напрямую цифры не сравнимы.", "<b>Версии — главный параметр подбора, важнее бренда.</b> Для V94.2 / SGT5-2000E официально существуют версии 3, 4, 5, 6, 7 — заказывать деталь без указания версии бессмысленно, физически различаются даже одноимённые лопатки. Ansaldo нумерует свои машины «Rating &lt;год&gt;» (например Rating 2010), Siemens — «Version N». Апгрейд MXL2 применим ко всем версиям; апгрейд компрессора AirFlex — только до Rating 2010 / Version 7 включительно.", "<b>Материалы горячей части V94.2 (по каталогу Sulzer, версии 3-6).</b> Рабочие лопатки 1-3 ступеней — Inconel 738LC, 4-й ступени — <b>Inconel 792</b>. Лопатка 1 ст. — MCrAlY + TBC снаружи, алюминидная диффузия внутри, тонкостенная; 2 ст. — MCrAlY, 12 охлаждающих отверстий. Сопловые 1-2 ст. — Inconel 738LC с MCrAlY + TBC; 3 ст. — у OEM был IN939, Sulzer заменил на 738LC ради ползучести.", "<b>Материалы горячей части AE64.3A (по каталогу Sulzer).</b> Рабочая лопатка 1 ст. — Ni-суперсплав направленной кристаллизации, полное внешнее TBC + внутренний алюминид, конвективно-плёночное охлаждение, 3D-профиль; 2 ст. — то же; 3 ст. — MCrAlY + внутренний алюминид, 15 радиальных охлаждающих отверстий электроэрозией. Сопловая 1 ст. — <b>Co-суперсплав</b>, 100% TBC + внутренний алюминид, веерные плёночные отверстия, showerhead, импинджмент; 2 ст. — Ni-суперсплав, 100% TBC, змеевиковое охлаждение; 3 ст. — MCrAlY + алюминид.", "<b>Апгрейды — это и есть каталог горячей части.</b> MXL2 для AE94.3A включает новую камеру сгорания с SAS-UP2, обойму сопловых аппаратов, рабочие и сопловые лопатки всех четырёх ступеней, уплотнительные кольца и новые покрытия (улучшенный подслой + увеличенная толщина TBC + высокопористый слой). Эффект в M-режиме: ГТ +25 МВт, +0,7% КПД; ПГУ 1+1 +45 МВт, +1,5%. В XL-режиме — +16 тыс. EOH к межремонтному интервалу. Для AE94.2 MXL2 даёт +1,4% КПД и интервал ТО до 50 тыс. EOH без расстыковки ротора и без изменений дисков."], "naming": [{"s": "V94.2", "a": "AE94.2 (+ AE94.2K)", "cn": "сборка Shanghai Electric", "ru": "<b>ГТЭ-160</b> — ЛМЗ / «Силовые машины» по лицензии Siemens с 1992, право продавать под своей маркой с 2001", "note": "Мировой парк семейства ~585 машин"}, {"s": "V94.3A", "a": "AE94.3A", "cn": "SEGT (финальная сборка)", "ru": "нет лицензии; в РФ стоят машины постройки Siemens", "note": "Ansaldo штатно переоснащает машины Siemens своими деталями — см. кейс A2A Piacenza"}, {"s": "V64.3A / SGT-1000F", "a": "AE64.3A", "cn": "SEGT", "ru": "нет лицензии", "note": "Разрабатывалась Siemens KWU <b>совместно с Ansaldo</b>. В РФ 13 машин, из них 12 постройки Ansaldo"}, {"s": "V84.2", "a": "нет", "cn": "—", "ru": "—", "note": "60-Гц сестра V94.2, Siemens SGT6-2000E"}, {"s": "V84.3A", "a": "нет", "cn": "—", "ru": "—", "note": "60-Гц сестра V94.3A, Siemens SGT6-4000F"}, {"s": "— (Alstom)", "a": "GT26, GT36", "cn": "GT36-S5 на Minhang", "ru": "GT26 — ТЭЦ-26 «Мосэнерго» блок 8 (288 МВт, 2011)", "note": "Наследие Alstom, куплено у GE в 2016. GT13E2 осталась у GE Vernova"}], "parts": [{"ru": "Рабочая лопатка турбины, ступени 1-4", "en": "Turbine blade / <b>TLa1, TLa2, TLa3, TLa4</b> (Turbinenlaufschaufel Stufe 1-4)", "qty": "комплект ряда", "life": "1 и 2 ст. на V94.2 v.3 — только замена, не ремонт", "note": "Немецкая позиционная система Siemens, реально используется в тендерах ESB (Ирландия). Это и есть рабочий идентификатор вместо парт-номера"}, {"ru": "Сопловая (направляющая) лопатка, ступени 1-4", "en": "Turbine vane / <b>TLe1, TLe2, TLe3, TLe4</b> (Turbinenleitschaufel Stufe 1-4)", "qty": "комплект ряда", "life": "все четыре ступени ремонтопригодны", "note": "В ремонтном лоте ESB TR810 — сопловые всех 4 ступеней плюс рабочие 3 и 4"}, {"ru": "Разъёмные уплотнительные кольца ступеней 2 и 3", "en": "Divided Seal Rings for Stages 2, 3", "qty": "комплект", "life": "—", "note": "Идут в комплекте с лопаточным аппаратом"}, {"ru": "Гибридная горелка", "en": "Dry-Low-NOx hybrid burner / H-burner", "qty": "AE94.2 — 16 (8×2 камеры); AE94.3A и AE64.3A — 24; GT26 — 48 (24 EV + 24 SEV)", "life": "полная замена комплекта при капремонте под BAT-NOx", "note": "Обозначение «HR3» в брошюрах Ansaldo и Siemens не встречается — не использовать в RFQ"}, {"ru": "Керамические плитки камеры сгорания", "en": "Ceramic tiles", "qty": "число на камеру OEM не публикует", "life": "как правило одноразовые", "note": "<b>Самая узкая позиция корзины.</b> Керамику публично не заявляет ни один из проверенных изготовителей — запрашивать по чертежу у Schunk (RB-SiC до 1380 °C, NB-SiC до 1470 °C), Saint-Gobain, Rauschert"}, {"ru": "Держатели плиток, основания под плитки", "en": "Brick holders, Base for tiles / Supporti refrattari, Basi per piastrelle", "qty": "по числу плиток", "life": "—", "note": "Единственный публичный изготовитель этой номенклатуры — <b>GFM S.p.A.</b> (Mapello, Италия)"}, {"ru": "Сегменты и пластины камеры сгорания", "en": "Segments and plates for combustion chamber", "qty": "—", "life": "—", "note": "GFM S.p.A."}, {"ru": "Жаровая труба", "en": "Flame tube / combustion liner", "qty": "по числу камер", "life": "2-4 цикла восстановления (экспертная оценка)", "note": "Материал по каталогу Sulzer — сталь 16Mo3, с кольцами крепления и держателями плиток"}, {"ru": "Смесительная камера", "en": "Mixing chamber", "qty": "по числу камер", "life": "—", "note": "Inconel 617, кольцо охлаждения со <b>144 каналами</b>. Делают Sulzer"}, {"ru": "Корпус горячего газа", "en": "Hot gas casing", "qty": "—", "life": "—", "note": "Inconel 617, TBC по внутренней втулке"}, {"ru": "K-кольца, L-кольца", "en": "K-rings, L-rings", "qty": "комплект", "life": "—", "note": "Наша сделка 5216 — «X и L-кольца для ГТУ ГТЭ-160». Делают Sulzer и Paya Mavad"}, {"ru": "Кольца охлаждения, зубчатые кольца", "en": "Cooling rings, castellation rings", "qty": "—", "life": "—", "note": "Опционально hard-face покрытие против фреттинга"}, {"ru": "Верхние и нижние плиты горелок", "en": "Upper / lower burner plates", "qty": "по числу горелок", "life": "—", "note": ""}, {"ru": "Диагональные завихрители", "en": "Diagonal swirlers", "qty": "по числу горелок", "life": "—", "note": ""}, {"ru": "Вставки горелок", "en": "Burner inserts", "qty": "по числу горелок", "life": "—", "note": "GFM S.p.A. заявляет прямо"}, {"ru": "Тепловые экраны, сегменты направляющего кольца", "en": "Heat shields, ring segments", "qty": "—", "life": "—", "note": "Sung-il (Корея) льёт эту номенклатуру; в нашей таможне AE64.3A ввозились «сегменты направляющего кольца»"}, {"ru": "Обойма сопловых аппаратов", "en": "Turbine vane carrier", "qty": "1", "life": "меняется в составе MXL2", "note": "В кейсе Piacenza Ansaldo меняла на машине Siemens вплоть до дисков компрессора CD1-CD5 и корпуса CVC1"}, {"ru": "Лопатки и направляющие компрессора, ВНА", "en": "Compressor blades / vanes, IGV", "qty": "15 или 16 ступеней", "life": "—", "note": "AirFlex — 3D-редизайн первых 6 ступеней AE94.3A"}, {"ru": "Редуктор (только AE64.3A)", "en": "Flender-Graffenstaden TX71/1C или TX80/1C", "qty": "1", "life": "капремонт по 100-128 тыс. часов", "note": "Кинематика 5400→3000 об/мин, i=1,8. Квилл-шафт, 5 подшипников. Альтернативы: MAAG тип HET (85 МВт), RENK Turbo Gear Unit"}, {"ru": "Фильтроэлементы КВОУ", "en": "Air intake filter elements", "qty": "по проекту", "life": "регламентная замена", "note": "Наша сделка 10348. Подбор по посадочному размеру, а не по OEM-номеру"}], "parts_notes": ["<b>Публичного каталога парт-номеров Ansaldo и Siemens для V-серии не существует.</b> Проверено по тендерам, каталогам и брошюрам — 8-10-значные материальные коды OEM нигде не публикуются. Вместо них отраслевой стандарт идентификации — три компонента: <b>позиционное обозначение (TLa1…TLe4) + версия горячего тракта + заводской номер машины</b>. Ansaldo и Siemens подбирают деталь по серийнику и ревизии, потому что одна и та же «лопатка 1 ступени» физически различается между версиями 3-7.", "<b>Что известно про форматы номеров.</b> У российского поставщика INTECH GmbH опубликованы реальные номера вида <b>A2A50006473</b> и <b>A2A50006106</b> для V94.2 (SGT5-2000E) — формат «A2A» + 8 цифр, похоже на внутренний код Siemens/KWU. В руководстве «Gas Turbine Description V94.2» встречаются документные номера вида W 3.1-1350-9425 (Burner Assembly) и W 3.1-3345-0001 (Hybrid Burner). Использовать как ориентир формата, не как готовый заказной номер.", "<b>Обозначения, которые реально работают в переписке:</b> TLa1-TLa4 и TLe1-TLe4 (лопатки и сопловые по ступеням), <b>Version 3/4/5/6/7</b> (ревизия горячего тракта V94.2), <b>41 MAC</b> (концепция ТО Siemens на 41 000 EOH — детали маркируются «compatible with 41 MAC»), <b>SAS-UP2</b> (новая камера сгорания AE94.3A в пакете MXL2), MXL2 / M-mode / XL-mode (апгрейд-пакеты AE-машин; <b>MXL3 существует только для GT26</b>, на AE94.2 и AE94.3A его нет), <b>TX80/1C</b> (редуктор Flender для AE64.3A), <b>eHGPI</b> (расширенная инспекция горячего тракта — закупается как отдельный тип работ).", "<b>Количества по ступеням OEM не публикует</b> — ни Ansaldo, ни Siemens, ни независимые. Комплектность берётся только из ведомости ЗИП конкретной машины по заводскому номеру и версии. Единственный числовой след в открытых источниках: в разборе разрушения лопаток SGT6-2000E фигурирует партия 89 рабочих лопаток 1 ступени, из них 64 признаны неремонтопригодными и 25 восстановлены — то есть <b>72% брака</b> при дефектации.", "<b>Интервалы обслуживания.</b> AE94.2 — 41 тыс. EOH по горячей части (с MXL2 до 50 тыс.); AE64.3A — 33 тыс. EOH; AE94.3A — до 5 лет между капремонтами, с MXL2 интервал до 41 тыс. EOH; GT26 — 32 тыс. ч, с MXL2 до 40 тыс. EOH. Реальные цифры из польских тендеров PGE: капремонт AE64.3A выполнялся <b>после 100 000 и после 128 000 часов наработки</b>, средние осмотры — примерно каждые 8 000 часов. Шкала для E-класса: малый осмотр 8 тыс. EOH, HGPI 41 тыс. EOH, капремонт 100-110 тыс.", "<b>Формула пересчёта эквивалентных часов (EOH) непублична.</b> Коэффициенты за пуск, срыв нагрузки, вид топлива, впрыск воды и пиковый режим у Siemens и Ansaldo закрыты. Панель ASME отмечала, что все OEM считают по-разному, иногда по-разному от площадки к площадке, и реальная разница в стоимости возникает между 20 и 30 часами на пуск. Отраслевая практика (оценка): нормальный пуск ≈10-20 EOH, аварийный останов ≈100+ EOH, жидкое топливо — множитель ~1,5-2. Цифры для контракта брать только из своего договора.", "<b>Что ремонтируют, а что меняют.</b> Из состава ремонтного лота ESB TR810 по V94.2 v.3: ремонтируются рабочие лопатки 3 и 4 ступеней и сопловые всех четырёх; <b>рабочие лопатки 1 и 2 ступеней в ремонт не идут — только новые</b>. Технологии ремонта Ansaldo Global Repair: ручной TIG, лазерная наплавка (LMD), фторидная ионная очистка (FIC), пайка с узким зазором и оверлейная, ЭЭО-прошивка охлаждающих отверстий, замена сот, купонный ремонт, вакуумная термообработка; покрытия VPS, HVOF, APS, шликерный и CVD-алюминид. Отдельный продукт «multireco» — продление ресурса многократным восстановлением, число циклов не публикуется."], "prices": [{"item": "Новый полный комплект лопаточного аппарата на одну V94.2 v.3: TLa1-TLa4 + TLe1-TLe4 + разъёмные уплотнительные кольца 2 и 3 ст. + монтажный крепёж", "val": "€5 000 000", "basis": "оценочная стоимость закупки ESB, ТЭЦ Poolbeg CG14, 2023", "src": "https://ted.europa.eu/en/notice/-/detail/772841-2023"}, {"item": "Ремонт 6 позиций V94.2 v.3 (TLa3, TLa4, TLe1-TLe4)", "val": "€750 000", "basis": "закупка ESB 2023, победитель EthosEnergy Light Turbines Ltd (2026)", "src": "https://ted.europa.eu/en/notice/-/detail/757055-2023"}, {"item": "Капремонт AE64.3A после 128 000 часов + редуктор TX80/1C + сервис 2023-2027", "val": "€8 288 750", "basis": "PGE Rzeszów, 2022, победитель Ansaldo Energia", "src": "https://ted.europa.eu/en/notice/-/detail/567315-2022"}, {"item": "Капремонт AE64.3A после 100 000 часов + сервис на 25 000 часов, вкл. полную замену комплекта горелок под BAT-NOx", "val": "€4 345 000", "basis": "PGE <b>Rzeszów</b>, тендер 27142-2018, победитель Ansaldo Energia (ранее ошибочно значилось Bełchatów)", "src": "https://ted.europa.eu/en/notice/-/detail/27142-2018"}, {"item": "Капремонт V94.2 + сервис 2025-2031", "val": "€14 191 220", "basis": "ТЭЦ Lublin Wrotków, 2024, победитель Ansaldo Energia", "src": "https://ted.europa.eu/en/notice/-/detail/607763-2024"}, {"item": "ТО V94.2 включая расширенный ремонт eHGPI", "val": "€12 666 640 (рамка до €75 млн)", "basis": "HEP, TE-TO Sisak, Хорватия, 2025, победитель Siemens Energy", "src": "https://ted.europa.eu/en/notice/-/detail/416550-2025"}, {"item": "Капремонт ПАРОВОЙ турбины (не ГТ)", "val": "€3 078 180", "basis": "Ørsted, Avedøre, Дания, 2026, победитель Ansaldo Energia. <b>Как якорь по V94.2 не годится</b> — это паровая турбина; оставлено для полноты картины по контрактам Ansaldo", "src": "https://ted.europa.eu/en/notice/-/detail/48859-2026"}, {"item": "LTSA на ПГУ с SGT5-4000F", "val": "€103 822 000", "basis": "Počerady, Чехия, 2019, Siemens", "src": "https://ted.europa.eu/en/notice/-/detail/169062-2019"}, {"item": "Комплект горячего тракта машины 150-200 МВт (исторический ориентир)", "val": "$1,5-2,5 млн", "basis": "ASME / Global Gas Turbine News, 2001. К 2023 цена выросла примерно в 2-2,5 раза", "src": "https://files.asme.org/igti/knowledge/articles/13047.pdf"}, {"item": "Комплект деталей камеры сгорания low-NOx (исторический ориентир)", "val": "$450-650 тыс. и выше", "basis": "там же, 2001", "src": ""}, {"item": "Срок поставки нового комплекта лопаток и сопловых V94.2", "val": "12 месяцев", "basis": "длительность контракта в извещении ESB TR4503", "src": "https://ted.europa.eu/en/notice/-/detail/713460-2025"}, {"item": "Срок ремонта комплекта лопаток", "val": "12 месяцев по контракту; 4-8 мес. «от снятия до возврата» (оценка)", "basis": "контракт ESB TR810", "src": ""}, {"item": "Экономия от восстановления против новых деталей", "val": "до 70%", "basis": "данные ЗТСР (ныне «ТурбоСервис Рус»), центр в Екатеринбурге", "src": "https://ritm-magazine.com/ru/public/turbiny-zarubezhnye-servis-rossiyskiy"}], "pn_intro": ["<b>Единого «формата Siemens» не существует.</b> Siemens — склейка из четырёх независимых инженерных школ, каждая сохранила свою нумерацию: Mülheim/KWU (V-серия), Ruston/EGT Линкольн (SGT-100…400), Finspång ex-ABB STAL (SGT-500…800), Westinghouse (501/701). Поверх — современный материальный реестр SAP. Номер из одной школы в другой не ищется.", "<b>У Ansaldo две несовместимые родословные.</b> Машины по лицензии Westinghouse (TG20B, TG50C, TG50D5, TG7–TG16) несут чисто вестингаузовскую нумерацию. Машины по лицензии Siemens (AE94.2, AE94.3A, AE64.3A) унаследовали чертёжную систему Mülheim/KWU. <b>Прямых образцов номеров AE-серии в открытых источниках не найдено</b> — это гипотеза по происхождению конструкции, не проверенный факт.", "🚨 <b>Ловушка с кириллицей — проверено побайтово, применять в каждом RFQ.</b> На странице «Интех ГмбХ» позиции 1–16 записаны КИРИЛЛИЦЕЙ: «А2А» = U+0410, U+0032, U+0410. Позиции вспомогательного набора — латиницей: «A2A» = U+0041, U+0032, U+0041. Копипаст первых 16 номеров даёт номер, который не найдётся ни в одной базе поставщика и <b>молча провалит поиск</b>. Перед отправкой RFQ прогонять нормализацию: А→A, В→B, С→C, Е→E, К→K, М→M, Н→H, О→O, Р→P, Т→T, Х→X."], "pn_formats": [{"f": "A2A + 8 цифр", "m": "V94.2 / SGT5-2000E", "w": "Каталог стандартных и быстроизнашиваемых деталей: крепёж и расходники. <b>Все 22 найденные позиции A2A — крепёж и расходники. Ни одной лопатки, ни кольцевого сегмента, ни горелки.</b> Для горячей части нумерация другая", "ex": "A2A50006355 винт с цилиндрической головкой · A2A50006365 штифт конический · A2A50005603 уплотнительная лента · A2A50203618 шайба стопорная двойная · A2A50015478 шплинт · A2A50006589/90/91/92 вкладыши подшипника · A2A50006702 штифт с насечкой · A2A50062127 штифт предохранительный · A2A50006117 шпилька 8 · A2A50005985 гайка шестигранная · A2A50000260 штифт конический · A2A50005822 винт. Набор для замены лопаток: A2A50006473 шпилька резьбовая · A2A50006106 проволока уплотнительная · A2A50006520 уплотнительная планка · A2A50006114 шпилька · A2A50005888 и A2A50005889 шпонки"}, {"f": "23-94xx-xxxxx-xxx + rev", "m": "Горячая часть V94.2", "w": "Чертёжный номер. Структура: <b>23-</b> префикс реестра/класса документа (есть не всегда) · <b>9420/9422</b> код семейства машины (94.2 → 942x) · <b>12601/12602</b> идентификатор детали, <b>последняя цифра = номер ступени</b> · <b>005</b> индекс листа/варианта · <b>rev.C/D</b> ревизия, указывается ОТДЕЛЬНО и в номер не входит. <b>Ревизия обязательна к согласованию — детали разных ревизий взаимозаменяемы не всегда.</b> Выборка 2 образца — рабочая гипотеза, не доказанная схема", "ex": "9422K12601005 rev.C — 1°stg cooling insert (дефлектор охлаждения 1-й ступени) · 23-9420-12602-005 rev.D — 2°stg cooling insert. Два номера отличаются ровно в позиции ступени при идентичных остальных полях"}, {"f": "E1B + 9 цифр", "m": "Современный материальный реестр Siemens Energy", "w": "Тот же реестр SAP, что и A2A, другой префикс сегмента («3 символа + числовой блок»)", "ex": "E1B100634166 turbine blade stage 1 · E1B100301995 2nd stage turbine nozzle · E1B100096711 guide vane 2 complete · E1B100097178 guide vane 2 temp · E1B100097202 guide vane 2 borescope · E1B100235007 burner · E1B100302521 heater"}, {"f": "6 цифр · 4 цифры+буква+2-5 цифр", "m": "Ansaldo по лицензии Westinghouse: TG20B, TG50C, TG50D5, W501D5, SW501F", "w": "Чисто вестингаузовская нумерация. К AE-серии отношения не имеет", "ex": "TG20B: 322759, 324292, 324295, 331652/653, 335930/935, 376058, 345145, 345148, 376061, 376065, 321273, 321075, 298514, 330231, 345141 · TG50C: 4089T82/83, 4089T84/85/86, 4090T22, 4091T11, 4040T88012 · TG50D5: 4274T04/49, 4281T40, 4274T50, 4281T42, 4274T76, 4274T86/87, 4274T64/65, 4217T94, 4277T03, 4274T25, 500561, 4227T15/16/17, 4272T73/83, 4220T37, 4216T97 · W501D5: 7864D08, 7864D11 (1°stg cooling insert), 1274E23, 1274E43 (2°stg cooling insert) · SW501F: 7951D97G02 (cross flame tube sleeve), 2688B18001 (eccentric taper pin)"}, {"f": "HTCT / HTCZ / GMD", "m": "GT13E2, GT26, GT36 (наследие Alstom)", "w": "Спецификация Alstom. По ней EXA (Милан) поставляет КИПиА, клапаны и электрику", "ex": "HTCT423042 P0002 термопара типа N 2000 мм × Ø2 мм · HTCT417103 P0001 пилотный соленоидный клапан NG6 · HTCT423528 P0005 предохранительный DBDS6K1 · HTCT423528 P0008 обратный S8A05 / R901454052 · HTCT423557 R0011 привод VGV ход 350 мм DC-125/070-0350-DLKZA · HTCT416528/416529/416530 R0004 соленоидные 2/2 и 3/2 24 В DC · HTCT417889 R0001 3/2-ходовой DN3,5 на 0,2–10 бар · HTCT421100 P0032 обратный DN32 ASME 150"}, {"f": "C3 / MW 33362 E / 01", "m": "Ruston / EGT (Линкольн): SGT-100/200/300/400, TA/TB/TD", "w": "<b>Это НЕ V-серия.</b> Если в RFQ уйдёт «MW…» с пометкой V94.2, поставщик либо не поймёт, либо предложит деталь не от той машины. Признак линии Ruston в описании: термины CT1/CT2 (compressor turbine) и PT1/PT2 (power turbine) — двухвальная схема; у V94.2 схема одновальная с 4 ступенями турбины. Структура: C1/C2/C3/C6/24 — префикс конфигурации (покрытие / стандарт ремонта) · MW/RW/RM/RU/RT/TB/MJ — префикс линии · 5-значное ядро (геометрия детали) · буква ревизии · вариант сборки", "ex": "Блоки ядра: 03xxx КИП · 21xxx камера сгорания и жаровая труба · 22xxx горелки · 31xxx рабочие лопатки и крепёж · 316xx лопатки силовой турбины · 33xxx сопловые и кольцевые сегменты. Доказательство: TB31082C (Ruston TB5400 CT2 blade) и MW31082G (CT2 blade) имеют одно ядро 31082 при разных префиксах — префикс это линия, ядро это геометрия. Привязки: RT → SGT-200/Tornado; RW → SGT-300; TB → Ruston TB5400"}, {"f": "7 цифр + суффикс", "m": "Finspång, ex-ABB STAL: SGT-500/600/700/800", "w": "Отдельная школа, к V-серии отношения не имеет", "ex": "2423313-1 тепловой экран уровней 1,2,3 · 2424253-F рабочая ing Plate Tla2, Locking Plate Tla3. Это и есть язык, на котором машину понимает поставщик: «лопатка 1 ступени AE64.3A» не идентифицирует ничего, «TLa1, версия горячего тракта, заводской номер машины» — идентифицирует однозначно.", "glossary": [{"ru": "Рабочая лопатка 1 ст.", "en": "Blade row 1", "de": "Laufschaufel Reihe 1 (TLa1)", "it": "Paletta rotorica 1° stadio"}, {"ru": "Сопловая лопатка 1 ст.", "en": "Vane row 1", "de": "Leitschaufel Reihe 1 (TLe1)", "it": "Paletta statorica 1° stadio"}, {"ru": "Кольцевой сегмент", "en": "Ring segment / shroud segment", "de": "Ringsegment", "it": "Segmento d'anello"}, {"ru": "Тепловой экран", "en": "Heat shield", "de": "Hitzeschild", "it": "Schermo termico"}, {"ru": "Гибридная горелка", "en": "Hybrid burner", "de": "Hybridbrenner", "it": "Bruciatore ibrido"}, {"ru": "Камера смешения", "en": "Mixing chamber", "de": "Mischkammer", "it": "Camera di miscelazione"}, {"ru": "K-кольцо", "en": "K-ring", "de": "K-Ring", "it": "Anello K"}, {"ru": "L-кольцо", "en": "L-ring", "de": "L-Ring", "it": "Anello L"}, {"ru": "Стопорная планка", "en": "Locking strip", "de": "Sicherungsleiste", "it": "Listello di bloccaggio"}, {"ru": "Стопорная пластина", "en": "Locking plate", "de": "Sicherungsblech", "it": "Piastra di bloccaggio"}, {"ru": "Уплотнительная планка", "en": "Seal strip", "de": "Dichtleiste / Dichtstreifen", "it": "Listello di tenuta"}, {"ru": "Уплотнительная лента / проволока", "en": "Sealing band / wire", "de": "Dichtband / Dichtdraht", "it": "Nastro / filo di tenuta"}, {"ru": "Пламеперебрасывающий патрубок", "en": "Cross flame tube", "de": "Flammenüberleitrohr", "it": "Tubo di attraversamento fiamma"}, {"ru": "Керамическая плитка", "en": "Ceramic tile", "de": "Keramikstein / Keramikplatte", "it": "Piastrella ceramica"}, {"ru": "Держатель плитки", "en": "Brick holder / tile holder", "de": "Steinhalter", "it": "Portapiastrella"}, {"ru": "Корпус горячего газа", "en": "Hot gas casing", "de": "Heißgasgehäuse", "it": "Cassa gas caldi"}, { тендер обязан их указать.", "<b>Дополнительный лексикон из каталога TTITL:</b> Tile holder, Dog Bone Ring, Dummy Frame, Angle Bracket Under, Sealing Plate, Leading Edge, Parallel Key, Threaded pin, Seal Wire, Lock washer."], "cer_spec": ["<b>Материал определён: плитка — не карбид кремния.</b> Это пористый оксидный огнеупор корундо-муллитового семейства, фирменное обозначение <b>SiCerm E100</b>, производится самой Siemens (прямо в патенте US11312664: «SiCerm E100, a material manufactured by Siemens»). Прежняя ориентация на Schunk и RB-SiC/NB-SiC была ошибкой класса материала: SiC в парогазовой среде камеры окисляется и по температуре не выигрывает.", "<b>Состав по патентам.</b> Тонкая фракция: Al₂O₃ ≥90 масс.% (зерно 0,8–3 мкм), ZrO₂ 0–5% (стабилизирован MgO 0,01–0,1%), TiO₂ 0–5%. Крупная фракция 60–80 масс.% — дроблёный корунд или полые корундовые сферы, 100 мкм – 6 мм. Разжижитель ~1%, вода 4–8%. В классическом варианте — <b>градиент: холодная сторона Al₂O₃, горячая сторона муллит 3Al₂O₃·2SiO₂</b>. Зерно 1,5–3,5 мм в горячей зоне, 0,6–1,4 мм в холодной.", "<b>Технология.</b> Формование — литьё шликера под давлением, мультимодальная гранулометрия (10–20% фракции 1–5 мм; 10–20% 0,5–1 мм; 60–80% менее 0,5 мм), связка ксантан ≤0,05%. Обжиг &gt;1300 °C, предпочтительно <b>&gt;1550 °C</b>. <b>Пористость 18–20% сохраняется сознательно</b> — ради термостойкости: она обеспечивается докритическим микрорастрескиванием матрицы, а не прочностью. Это огнеупорная логика, а не инженерно-керамическая.", "<b>Формулировка для ТЗ:</b> «корундо-муллитовый огнеупор, литьё шликера под давлением, пористость 18–20%, обжиг ≥1550 °C, термоудар 30 циклов 1000 °C → вода».", "<b>Механизм износа (из действующих патентов US11319257B2 и US11312664B2).</b> Муллит на горячей стороне под воздействием горячего газа переходит во «вторичный корунд», прочность падает, <b>отрывающиеся частицы эродируют покрытия лопаток</b>. Это физика ресурса плитки и объяснение, почему её нельзя «дотянуть». Оба патента описывают лечение: пропитка YAG (Y₃Al₅O₁₂) из суспензии под вакуумом либо реакционное покрытие (нитрат иттрия реагирует с Al₂O₃ тела → YAG in situ) — закрывает поверхностные поры, сохраняя внутреннюю пористость.", "<b>Косвенное, но важное.</b> Патент DE102015215208B3 (Siemens, 2015, 8 изобретателей): за каждой плиткой ставится свисток, закрытый плавкой пробкой; при потере плитки пробка плавится и свисток звучит. Это подтверждает, что <b>выпадение плиток — штатный, ожидаемый отказ</b>, а не аварийный."], "cer_patents": [{"n": "US7540155B2", "d": "Подача 04.10.2001", "w": "Градиентная плитка Al₂O₃ / муллит — ключевой патент по материалу", "s": "ИСТЁК"}, {"n": "US6832484B2", "d": "Приоритет 22.09.2000", "w": "Бандаж из керамоволокна 62% Al₂O₃ / 24% SiO₂ / 14% B₂O₃, филамент 10–12 мкм, кристаллиты ≤500 нм, до 1200 °C, кремнезёмный клей", "s": "ИСТЁК"}, {"n": "US6711899B2", "d": "Приоритет 28.08.2001", "w": "Преднапряжённый бандаж из Si₃N₄, клеевое крепление в глухих отверстиях, до 1200 °C. Смысл — удержать осколки при растрескивании", "s": "ИСТЁК"}, {"n": "US8609019B2 / US9108886B2 / US8530364B2", "d": "Подача 14.05.2009", "w": "Состав огнеупора", "s": "ИСТЁК"}, {"n": "US9221718B2", "d": "Подача 01.08.2012", "w": "Шликер для литья под давлением", "s": "Формально в силе, но ключевые параметры раскрыты"}, {"n": "US5062792A", "d": "Приоритет DE P 37 02 181.8 от 26.01.1987", "w": "<b>«Hybrid burner for a pre-mixing operation with gas and/or oil, in particular for gas turbine systems», Siemens AG. Базовая конструкция гибридной горелки открыта.</b> Формула: центральная пилотная система (газ и/или мазут) + кольцевая основная система с множеством газовых сопел и вторым рядом мазутных сопел вблизи лопаток завихрителя", "s": "ИСТЁК"}, {"n": "US5066221A, US6202401B1, US4575332A, US4073134A", "d": "1990 / 1996 / — / 1970-е (KWU)", "w": "Горелочная линия, включая акустическое подавление пульсаций (US6202401B1)", "s": "ИСТЕКЛИ"}, {"n": "EP0224817B1 / US4749029A", "d": "Приоритет 02.12 °C", "s": "EP1507116A1"}, {"z": "Керамоволоконный бандаж", "t": "≤1200 °C", "s": "US6832484"}, {"z": "Стенка камеры V94.2 за плиткой", "t": "~1060 °C", "s": "PSC 2015"}, {"z": "Оксидная керамика на десятки тыс. часов", "t": "≤1250 °C", "s": "не подтверждено"}], "cer_count": ["<b>Подтверждено Siemens Energy:</b> V94.2 — две «walk-in» силосные камеры, футерованные <b>индивидуально заменяемыми</b> керамическими плитками; 198 МВт, КПД 37,6%, 16 ступеней компрессора, 4 ступени турбины.", "<b>Горелки:</b> V94.2 — <b>8 гибридных на камеру, 16 на машину</b> (ASME/PSC 2015: «combustion chamber composed of eight burners»). V94.3A — кольцевая камера, <b>24 горелки</b>.", "<b>Число плиток ~500 на машину — НЕ подтверждено первоисточником OEM</b> (два независимых китайских отраслевых снипета). Арифметика не сходится: при плитке ~200×200 мм (типовой размер по EP1005620) две силосные камеры V94.2 дают порядка 100 м² футеруемой поверхности — это тысячи штук. Значит либо ~500 относится к одной камере или к F-классу с кольцевой камерой, либо реальная плитка существенно крупнее. <b>Точное число снимать по чертежу или дефектной ведомости конкретной машины.</b>", "<b>Сплав держателей не назван ни в одном патенте.</b> Проверено US8104287, US9657948, DE102017206502A1 — везде только «metal» / «preferably metal». Ближайшее официальное указание — EP1507116A1: на основе Fe, Cr, Ni или Co, литьё. Марку определять спектральным анализом снятой оснастки либо запрашивать у GFM S.p.A. (делает brick holders и base for tiles)."], "cer_papers": [{"n": "ASME GT2016-57505", "a": "Becchi R., Burberi E., Facchini B. (Университет Флоренции), Tarchi L. (Ergon Research), <b>Abba L. (Ansaldo Sviluppo Energia, Генуя)</b>", "w": "«Experimental Validation of an Innovative Metallic Tile Holder System for a Ceramic Combustor Liner», DOI 10.1115/GT2016-57505. <b>Керамические плитки в охлаждаемых металлических держателях в ГТУ Ansaldo AE64.3A+</b> взамен металлических Hitzeschild → <b>экономия охлаждающего воздуха до iemens Westinghouse 501F и <b>Siemens V84.2</b>; позиционируют себя как «самый полный сторонний поставщик услуг по Siemens V84.2». Номенклатура: топливные форсунки, камеры сгорания, лайнеры, caps, переходники, новые и восстановленные детали КС", "k": "+1 281-444-3535 · sales@alliedpg.com · 10131 Mills Rd, Houston TX 77070", "x": "<b>V84.2 — 60-Гц близнец V94.2 с той же камерой и гибридными горелками.</b> Керамические плитки и Ansaldo не упоминают"}, {"n": "Huarui (Jiangsu) Gas Turbine Service (华瑞（江苏）燃机服务)", "c": "КНР, Цзянсу", "w": "Полевой сервис, ремонт и производство ЗИП; заявленные модели включают <b>V94.2</b> наряду с 6B/6FA/9E/9FA, «полная локализация»", "k": "—", "x": "Источник Baidu Baike, первоисточником не подтверждено"}, {"n": "PSM / Hanwha", "c": "США", "w": "V-серию Siemens и Ansaldo <b>не заявляют</b> — проверено", "k": "—", "x": "Отсеян"}], "bom_qty": [{"m": "V64.3A / SGT-1000", "i": "Горелки", "q": "<b>24 шт на машину</b>", "p": "Дословно из извещения Teplárny Brno 297509-2020: «Dodávky <b>24 ks hořáků</b> pro plynovou turbínu Siemens SGT-1000». Оценка 50 000 000 CZK. Совпадает с брошюрой Ansaldo по AE64.3A (24 сухие двухтопливные горелки)"}, {"m": "V94.2", "i": "Горелки", "q": "<b>16 шт</b> (по 8 на силосную камеру)", "p": "Двухсилосная схема камеры сгорания"}, {"m": "V94.2", "i": "Каналы охлаждения смесительной камеры", "q": "<b>144</b>", "p": "Кольцо охлаждения, Inconel 617"}, {"m": "V94.2", "i": "Отверстия охлаждения лопатки 2-й ступени", "q": "<b>12</b>", "p": "—"}, {"m": "GT13E2", "i": "Рабочие лопатки 1 ст.", "q": "<b>63 шт</b>", "p": "ΔΕΗ, ТЭС Комотини, блоки 11/12, 157,5 МВт, 2001. Новые <b>HTCT152192P0004</b>, восстановленные <b>HTCZ461512P0001</b>"}, {"m": "GT13E2", "i": "Рабочие лопатки 2 ст.", "q": "<b>63 шт</b>", "p": "Новые <b>GMD5442439R0007</b>, восстановленные <b>HTCZ461532P0003</b>"}, {"m": "GT13E2", "i": "Рабочие лопатки 3 ст.", "q": "<b>63 шт</b>", "p": "Новые <b>GMD5442440R0007</b>, восстановленные <b>HTCZ463589P0001</b>"}, {"m": "GT13E2", "i": "Кожухи зоны 2 камеры сгорания", "q": "<b>4 шт</b> (верх/низ, внутренние + наружные), CIM Version", "p": "Комплект <b>HTCT314682R0001</b>; наружные HTCT314682P0005/P0006; внутренние HTCT314682P0002/P0008. Восстановленные: комплект HTCZ730115R0013, наружные HTCZ740458R0013, внутренние HTCZ740459R0013"}, {"m": "GT13E2", "i": "Плитки теплозащиты зоны 1 (front / inner / outer)", "q": "ремонт", "p": "Извещение 567042-2021, 1 003 754,43 €. Победители 580601-2021: <b>MAS А.Е.</b> (Афины) и <b>EXPO Energy Systems A.E.</b> (Кифисия), 3 заявки, лоты 509 815,53 € и 318 465,00 € — независимые греки отбирают объём у OEM"}, {"m": "AE64.3A", "i": "Редуктор", "q": "<b>Flender TX801C</b> (тендер PGE 27142-2018) / <b>TX80/1C</b> (тендер 567315-2022)", "p": "Типоразмер TX80 подтверждён тендерным текстом на машине AE64.3A. Замер межосевого расстояния всё равно нужен — на ТТЭЦ-1 может стоять другой типоразмер"}], "bom_kit": ["<b>Состав комплекта V94.2 Version 3</b> (ESB Poolbeg CG14/CG15, точный): TLa1, TLa2, TLa3, TLa4 (рабочие лопатки 1–4 ст.) · TLe1, TLe2, TLe3, TLe4 (сопловые 1–4 ст.) · Divided Seal Rings — <b>только ступени 2 и 3</b>, не на все четыре · Installation hardware (крепёж под всё вышеперечисленное).", "<b>Коммерческая подсказка из разделения лотов.</b> Ремонтный лот TR810 охватывает только TLa3, TLa4, TLe1–TLe4. Значит <b>TLa1 и TLa2 в ремонт не отдаются — меняются только новыми</b>. Спрос на новые TLa1/TLa2 регулярный, на их ремонт — нет.", "<b>Модель ESB, которую стоит понимать.</b> Работы монопольно у Siemens (извещение 493838-2026 TR4114 «Poolbeg Overhaul 2027» — процедура без публикации, 1 заявка, обоснование: Siemens как проектировщик станции и OEM держит ИС на турбины и генераторы и всю историю обслуживания), <b>а железо выносится на конкурс третьим сторонам</b>. Поэтому TR799/TR4503/TR810 идут отдельными закупками.", "<b>Живое окно.</b> TR799 (772841-2023, €5 млн, новый комплект лопаток V94.2) <b>так и не был присуждён</b> — извещения о результате нет вообще. ESB перезапустил закупку в октябре 2025 как TR4503, расширив с CG14 на CG14+CG15 — два комплекта одним контрактом. Тендер висит нерешённым больше двух лет.", "<b>Почему количеств по V94.2 нет в открытом доступе — системная причина.</b> Эти закупки идут переговорной процедурой с предварительной публикацией: в открытую часть попадает только состав позиций и предквалификация (PQQ), а ведомость с количествами (ITT / OPZ / Troškovnik) выдаётся уже прошедшим отбор. Открытые процедуры (греческий ΔΕΗ, чешский Teplárny Brno) публикуют количества и номера прямо в извещении — <b>именно поэтому вся конкретика выше по GT13E2, а не по V94.2</b>.", "<b>Керамических плиток V94.2 в тендерах нет вообще.</b> ~15 поисковых формулировок (ceramic tile / Hitzeschild / keramických dlaždic / heat shield) не дали ни одного релевантного извещения по газовым турбинам, кроме греческих плиток GT13E2."], "bom_req": [{"t": "Барьер входа — PQQ ESB TR4503 (54 стр.)", "r": "<b>B9.1:</b> не менее <b>5 контактных референсов</b> поставки новых лопаток V94.2 Version 3 за 10 лет, и все пять должны отработать <b>полный интервал 33 000 EOH без замечаний</b>. ESB звонит по референсам. 100 баллов, порог 61. <b>B9.5:</b> отчёты о дефектации комплектов после 33 000 EOH — доказать пригодность ко второму интервалу, по 1, 2 и 3 ступеням. <b>B9.2:</b> form/fit/function без модификации детали и без модификации турбины. <b>B9.3</b> Quality Plan на каждый комплект; <b>B9.13</b> сроки по каждой позиции; <b>B9.10</b> расчётный ресурс и интервалы; <b>B9.14</b> независимая верификация конструкции. Сертификация: EN ISO 9001, ISO 14001/EMAS, OHSAS 18001 / Safe T Cert. <b>Оборот ≥ 16 000 000 € без НДС</b> в среднем за 2 последних года. Страхование: Public/Products Liability 6,5 млн €, Employer's Liability 13 млн €, Motor 2,6 млн €. Шорт-лист — 5 лучших"}, {"t": "Прослеживаемость — Teplárny Brno 291838-2024 / 437806-2023, жёстче всех", "r": "Оригинальность подтверждается <b>идентификационной маркировкой изготовителя на самой детали</b> и в документации к ней. Детали новые, неиспользованные. Поставщик ведёт <b>детальную документацию истории демонтированных деталей</b> и предоставляет её заказчику по первому требованию. Демонтированные детали переходят в собственность заказчика. Гарантированный ресурс лопаток ≥ 33 000 EOH"}, {"t": "Эмиссия — PGE Жешув, AE64.3A", "r": "NOx &lt; 50 мг/Нм³, CO &lt; 12,5 мг/Нм³ (по ISO) при O₂ = 15%. Устойчивое горение без humming. САУ <b>INFI 90</b>. Капремонт после 100 000 EOH с полной заменой комплекта горелок под BAT-NOx"}, {"t": "Критерии оценки заявок — как считают заказчики", "r": "<b>PGE Жешув 2018:</b> цена 70% / <b>удельная цена сервиса (цена ÷ предлагаемый ресурс лопаток) 24%</b> / дневная ставка 6%. 2 заявки, победитель Ansaldo 4 345 000 €. <b>PGE Жешув 2022:</b> цена 90% / <b>предлагаемый ресурс лопаток 10%</b>. 1 заявка, Ansaldo 8 288 750 €. <b>PGE Люблин Вротков 2024:</b> критерий <b>NPV</b>, 100 баллов. 1 заявка, Ansaldo 14 191 220 €. <b>HEP Сисак 2025:</b> цена 90% / руководитель договора 10%. Siemens Energy d.o.o. 12 666 640 €. <b>Teplárny Brno 2024:</b> Siemens Energy s.r.o. 14 975 500 €"}], "bom_fmt": "Форматы номеров Alstom/GE, выведенные из греческих ведомостей: <b>HTCT / HTCZ + 6 цифр + P или R + 4 цифры</b> и <b>GMD + 7 цифр + R + 4 цифры</b>. HTCT — новая деталь, HTCZ — восстановленная: пара номеров на одну позицию (новый и ремонтный) даёт готовый ключ для поиска у любого независимого ремонтника.", "upg_matrix": [{"p": "MXL2", "m": "AE94.2", "ap": "Все версии AE/V94.2 и SGT5-2000E", "wh": "Major Overhaul, <b>без раскрутки ротора</b>", "gt": "+13 МВт, +1,4% КПД", "cc": "ПГУ 1+1: +16 МВт, +1,5%", "xl": "+8 kEOH", "iv": "до 50 kEOH", "c": "Полный новый комплект лопаток и НА; новые статорные уплотнительные кольца; доработка АСУ ТП; оценка осевого усилия с возможной адаптацией опорного и упорного подшипников; апгрейд камеры сгорания. 3D-лопатки, улучшенные покрытия и охлаждение, <b>расширенное ТБП на смесительной камере и внутреннем корпусе</b>. <b>Диски ротора и система вторичного воздуха НЕ меняются</b> — комплект чисто ЛПЧ, роторных работ нет. Целевой рейтинг 190 МВт / 36,3%"}, {"p": "MXL2", "m": "AE94.3A", "ap": "Все версии AE/V94.3A и SGT5-4000F", "wh": "Major Overhaul", "gt": "+25 МВт, +0,7%", "cc": "ПГУ 1+1: +45 МВт, +1,5%", "xl": "+16 kEOH", "iv": "до 41 kEOH", "c": "Новая камера сгорания SAS-UP2; замена обоймы НА турбины (turbine vane carrier) с оптимизированным охлаждением; лопатки и НА ступеней 1–4; улучшенные уплотнительные кольца; улучшенный bond coat + увеличенная толщина ТБП + дополнительное высокопористое ТБП; снижение расхода вторичного воздуха"}, {"p": "MXL2", "m": "GT26", "ap": "База Rating 2006 и раньше", "wh": "—", "gt": "—", "cc": "+25 МВт, +0,8%, +4000 ч", "xl": "+12 МВт, +0,5%, +12 000 ч", "iv": "40 000 EOH", "c": "Переработаны все 4 ступени ТНД: 3D-профилирование, увеличенный диаметр проточной части на выходе, усиленное ТБП, снижено число НА в рядах 1 и 2 ТНД, оптимизированы схемы охлаждения, улучшена конструкция бандажа. <b>Переключение M↔XL — онлайн, кнопкой у оператора</b>"}, {"p": "MXL3", "m": "<b>только GT26</b>", "ap": "Любой GT26 Rating 2006 независимо от того, был ли MXL2; до всех рейтингов 2011 с извлекаемыми EV-горелками", "wh": "Без модификации компонентов станции", "gt": "—", "cc": "+35 МВт ПГУ, +1,6% КПД, +4000 ч", "xl": "+22 МВт, +1,3%, +12 000 ч", "iv": "—", "c": "4 новых копья (lances) горелок SEV + низкочастотные демпферы; переработанные ступени 1 и 2 ТНД под повышенную температуру; частично переработанный компрессор; ретрофит серийной камеры SEV рейтинга 2011. Водород 0–45 об.% без потери характеристик. <b>Для AE-машин линейка другая: MXL → MXL2 → AirFlex (+ CMF++ и SAS-UP2 как компоненты)</b>"}, {"p": "AirFlex", "m": "AE94.3A", "ap": "До Rating 2010 и до SGT5-4000F Version 7", "wh": "При расширенной HGPI, <b>без раскрутки ротора</b>", "gt": "+11 МВт; с MXL2 в M-режиме +30 МВт", "cc": "+15 МВт ПГУ 1+1; с MXL2 +45 МВт, +0,5%/+0,8%", "xl": "—", "iv": "—", "c": "3D-переработка первых 6 ступеней компрессора; усиленные НА передней и средней секции; перетрассировка линий сброса. Статус: документация 2024, первое железо Q4 2025, квалификация компонентов завершена в 2025"}], "upg_notes": ["<b>Оговорка производителя, которую надо переносить в ТКП:</b> «Reference values in new, clean and ISO conditions, specific data to be evaluated case by case». Заявленные приросты даны для новой чистой машины в ISO-условиях и подлежат пересчёту под конкретный объект.", "<b>При сравнении обязательно указывать уровень.</b> GT26 MXL2 даёт +25 МВт на ПГУ, а AE94.3A MXL2 — +25 МВт на ГТУ и +45 МВт на ПГУ. Смешение уровней даёт разницу почти вдвое.", "<b>«E-UP» и «Constant Pressure Ratio» в документах Ansaldo не встречаются.</b> E-UP — программа Sulzer (сторонний ретрофит), не Ansaldo. Не смешивать.", "<b>Пакеты гибкости AE94.3A.</b> Regulating blow off + IGV turn down + Anti-icing = MEL −40 МВт. CO Catalyst = ещё −20 МВт MEL и регулирование до 30 МВт/мин при полностью закрытых ВНА. Purge Credit (NFPA 85) — кредит продувки до 192 ч, экономия до 17 мин холодного пуска. Fast start-up — пуск за 17 мин.", "<b>GT26 eLPL / eLLO.</b> eLPL — последовательное отключение горелок SEV: ПГУ ниже 20% нагрузки при КПД 45%. eLLO — работа только первой камеры. Итог MEL &lt;20%, рабочий диапазон &gt;80%. Fuel Flexibility: C2+ 0–16; H₂ 0–45%; индекс Воббе 31–52 МДж/м³ (штатно 36–52). ИК-датчики с откликом 20 с против ~15 мин у хроматографов. H₂ 0–25% на железе Rating 2006/MXL2; до 45% — только на железе MXL3.", "<b>Водород по моделям без модификаций железа:</b> GT36 — 70%, GT26 — 45%, AE94.3A — 40%, AE94.2 — 40%, AE64.3A — 40%. Цель 100% к 2030. Проект FLEX4H2 (бюджет ~8,7 млн €, лидер Ansaldo): в 2025 подтверждена работа на 100% H₂ на полной нагрузке со снижением риска проскока пламени.", "<b>AutoTune</b> — онлайн-оптимизация, самообучающийся тюнинг, предсказание неустойчивостей; 50+ инсталляций, полностью ретрофитный. <b>Control System Upgrade</b> — миграция с ABB Symphony Harmony/Plus, AC800Xa, ADVANT Egatrol/Turbotrol; Alstom ALSPA; Siemens TXP, T2000, T3000; Emerson DeltaV, Ovation. Защита SIL3, предтест на эмуляторах ГТУ и real-time симуляторах.", "<b>Референс Brindisi</b> (2 блока ПГУ, H₂ с соседнего химзавода, коммерческая эксплуатация с 2006): 2010 — 15% H₂, NOx &lt;25 ppm, 13 МВт/мин; 2017 — NOx &lt;15 ppm, 22 МВт/мин; 2022 — 25% H₂, ~130 МВт, 30 МВт/мин. Наработка &gt;260 000 EOH / 670 пусков (2022), 300 000 EOH (2023)."], "upg_refs": [{"y": "2023", "o": "Maxima Centrale / Flevo unit 5 (Нидерланды)", "w": "1-й MXL3, КПД ПГУ &gt;60%. Заказчик после него решил апгрейдить все три остальных GT26. В том же году ещё 2 заказа на MXL3"}, {"y": "2023", "o": "Turbigo (Италия)", "w": "AE94.3A-MXL2 + генератор"}, {"y": "2022–23", "o": "A2A Piacenza (Италия)", "w": "CMF++ + SAS-UP2"}, {"y": "2024", "o": "Combigolfe (ENGIE, Франция)", "w": "2-й MXL3, завершён май 2025: <b>+31 МВт, +2,3% КПД, H₂ до 45%</b>"}, {"y": "2024", "o": "парк AE94.2", "w": "3× MXL2 + 2× MXL2 light"}, {"y": "2025", "o": "Alpiq San Severo (Италия)", "w": "октябрь 2025: <b>+43 МВт</b>, готовность к 25% H₂"}, {"y": "—", "o": "Leinì (Италия)", "w": "Замена AE94.3A на AE94.3A-MXL2 + новый генератор"}], "repair_stages": [{"s": "1. Strip", "w": "Входной контроль, дробеструйная обработка, химическое снятие покрытий, УЗ-очистка"}, {"s": "2. Assess", "w": "Визуальный контроль; ЛЮМ (fluorescent penetrant); цветная дефектоскопия (red dye); вихретоковый; УЗ-толщинометрия; КИМ и 3D-скан; металлография; продувка (airflow); <b>цифровая рентгенография</b>"}, {"s": "3. Repair", "w": "Ручной TIG; лазерная наплавка LMD; <b>фторидная ионная очистка (FIC)</b>; пайка с узким зазором; оверлейная пайка; шлифовка/blending; CNC-шлифовка и фрезеровка; ЭЭО и однокоординатная ЭЭО-прошивка охлаждающих отверстий; лазерная прошивка; <b>замена сот</b>; <b>купонный ремонт</b>; вакуумная термообработка"}, {"s": "4. Coat", "w": "VPS (вакуумно-плазменное); HVOF; APS (атмосферно-плазменное); шликерный алюминид; CVD-алюминид; дуговое напыление двойной проволокой"}, {"s": "5. Completion", "w": "Сборка навесных; металлографическая лаборатория; SEM и оптическая микроскопия; <b>моментное взвешивание и подбор порядка установки по венцу (moment weight &amp; sequencing)</b>; частотный анализ; размерный контроль в оснастке; КИМ; продувка"}], "repair_notes": ["<b>Аддитивные технологии.</b> Купонный ремонт + селективное лазерное сплавление (SLM). В 2023 запущены два проекта аддитивного производства: массовый ремонт статорных компонентов по SLM и ручная лазерная сварка никелевых сплавов; выпущены расчётные данные и ТУ на материал <b>SLM IN738</b>.", "<b>multireco</b> — продукт продления ресурса. <b>Число циклов Ansaldo нигде не раскрывает</b> (проверено по всем 25 доступным документам).", "<b>Роторы.</b> Ремонт роторов, корпусов, статоров и камер сгорания идёт на том же оборудовании, что и производство новых узлов. Стандартный ремонт ротора включая переоблопачивание компрессора и покрытия. Rotor RLA — продление ресурса ротора: НК поверхностных и объёмных дефектов, характеризация материала, <b>полные 3D-МКЭ модели (тепловая + прочностная) с подстановкой реальной истории эксплуатации конкретной машины</b>.", "<b>Контрактные схемы, сокращающие простой.</b> Pit-stop outage — стратегические компоненты (например облопаченный ротор) доставлены на площадку ДО начала ремонта. Off-line reconditioning резервных стратегических компонентов. <b>Аренда стратегических компонентов</b> как альтернатива покупке. Parts pooling."], "insp_types": [{"t": "A/B Minor-Short", "d": "&lt;1 недели", "w": "Только визуальный. ГТУ: камера сгорания, 1-я и 4-я ступени турбины, 1-я ступень компрессора, выхлопной тракт, фильтр-камера и КВОУ. При humming — короткая инспекция камеры сгорания и 1-й ступени турбины"}, {"t": "B HGPI-Intermediate", "d": "3–5 недель", "w": "Визуальный + механические работы и размерный контроль + замена или восстановление лопаток и НА турбины. <b>Ротор остаётся в статорных частях</b> — снимается только обойма НА турбины"}, {"t": "C Major", "d": "5–7 недель", "w": "Всё из HGPI + снятие статорных частей, инспекция лопаток и НА компрессорной И турбинной частей. <b>Ротор извлекается</b> для визуального контроля, НК и fact finding"}], "repair_centres": [{"n": "Genoa Repair Center (GRC)", "a": "Via N. Lorenzi 8, 16152 Генуя", "w": "Лопатки и НА сквозным циклом, центр компетенции по роторным и статорным деталям. <b>~5 500 горячих лопаток в год после расширения</b> (расширение запущено 2022, оборудование смонтировано 2023, релэйаут фазы 1 выполнен). Обновлён парк ЭЭО-станков"}, {"n": "Ansaldo Energia Gulf Repair Center", "a": "Абу-Даби", "w": "Лопатки и НА сквозным циклом. В 2023 открыт интегрированный центр поддержки 24/7"}, {"n": "MESH — Middle East Service Hub", "a": "Дубай", "w": "Стратегические компоненты ГТУ и ПТУ"}, {"n": "AGT Repair Center", "a": "Шанхай (юрлицо AGTT, СП с Shanghai Electric)", "w": "Лопатки и НА для рынка КНР"}, {"n": "Управление и диагностика", "a": "—", "w": "Ремонтами управляет Integrated Plant Support (IPS); Генуя и Абу-Даби работают параллельно. Диагностические центры: &gt;130 000 информационных пакетов, скачиваемых ежесекундно. Единственные опубликованные контакты: service@ansaldoenergia.com, +39 010 6551"}], "cast_rank": [{"r": "1", "n": "CPP (Consolidated Precision Products)", "g": "Лопатки ГТУ <b>&gt;1220 мм</b> («over four feet»), «industry's largest directionally solidified turbine blades and vanes»", "w": "EQX + DS + SX (multi-wall); свои керамические стержни (Poly6) и воск (AirPower). 20+ заводов, 5500+ чел., HQ Cleveland OH. <b>Плюс покупает литейный бизнес GF Precicast</b>", "a": "закрыт для РФ"}, {"r": "2", "n": "Doncasters", "g": "Габарит <b>до 1,2 м</b>; вакуумная плавка до 350 кг, воздушная до 500 кг", "w": "EQX + DS + SX, свои керамические стержни, мастер-плав (Ross &amp; Catherall, Killamarsh), HIP, цифровая радиография. 3000+ чел., 14 заводов: Chard (Somerset), Bochum (DE), Deritend (Droitwich), Oxford AL (US), UPM Casting (MX). <b>Ansaldo Energia в проспекте IPO на NYSE</b>. +44 1460 260600", "a": "закрыт для РФ"}, {"r": "3", "n": "PCC Airfoils (Precision Castparts / Berkshire)", "g": "Deer Creek (Milwaukie OR): <b>7–113 кг</b> сопловые сегменты ГТУ. Корпорация PCC — крупнейшая в мире отливка Ø1930 мм", "w": "SX, DS, Equiax. Площадки: Mentor OH (190 тыс. кв. футов, преимущественно ГТУ), Minerva OH, Douglas GA, SMP Wickliffe OH. AS9100, ISO9001, NADCAP по площадкам", "a": "закрыт для РФ"}, {"r": "4", "n": "Howmet Aerospace", "g": "Габариты не публикует", "w": "Engine Products = «world-class producer of aero engine and industrial gas turbine components, including airfoils, rings, disks and forgings». 14 площадок в США + 13 стран; площадки помечены «Aerospace and Industrial Gas Turbine Casting»", "a": "закрыт для РФ"}, {"r": "5", "n": "Zollern", "g": "<b>Потолок: масса детали до 100 кг, рабочее пространство 600×600×550 мм</b> — потолок пера ~500–550 мм. Средние ГТУ да, тяжёлые F/H-класса нет", "w": "Вакуумное литьё по выплавляемым моделям EQX + DS + SX; сплавы GMR 235, Inconel 713C и LC, Inconel 100, MAR M246, MAR M247 LC, Hastelloy. Площадки: Laucherthal/Sigmaringendorf (DE, HQ), Ravne (SI, мастер-плав), Vermoim-Maia (PT). &gt;1000 чел. в литейном дивизионе. NADCAP NDT + Welding", "a": "ЕС"}, {"r": "6", "n": "Deloro Microfusione", "g": "Макс. валовая масса отливки в вакууме <b>180 кг</b> (не 75, как значилось раньше)", "w": "<b>DS/SX не заявлены → только равноосная кристаллизация.</b> 31 000 м², 193 сотрудника, с 1948 г. NADCAP только на НК, не на литьё", "a": "ЕС"}, {"r": "—", "n": "PBS Velká Bíteš", "g": "Габарит мелкий (ВСУ, малые турбины)", "w": "«One of the leading European foundries specializing in investment casting of nickel- and cobalt-based superalloys». DS/SX нет. AS 9100, ISO 9001, ISO 14001, NADCAP, AQAP 2110", "a": "ЕС"}, {"r": "—", "n": "Chromalloy", "g": "—", "w": "Только LM2500/LM6000, авиапроизводные", "a": "закрыт"}], "cast_notes": ["<b>Реальных литейщиков крупных DS-лопаток тяжёлых ГТУ в мире три-четыре</b> — CPP, Doncasters, PCC Airfoils, Howmet. Все закрыты для РФ. Это и есть настоящее узкое место всей темы: не «где купить деталь», а «кто в принципе умеет её отлить».", "<b>Wuxi Turbine Blade (WTB) — не литейщик.</b> Ключевая поправка. На собственной англоязычной странице «Gas Turbine Components» дословно: «Have the capability of full manufacturing processes for turbine blades <b>after casting</b> (grinding, vacuum heat treatment, drilling, sheet metal forming, assembly welding, vacuum brazing, coating and inspection)». WTB кует лопатки компрессора, диски компрессора и турбины и финишно обрабатывает литые турбинные лопатки. Ansaldo Energia в списке клиентов — да, но <b>за ковку и механообработку, а не за литьё горячей части</b>.", "<b>Кто прямо называет Ansaldo или Siemens клиентом.</b> WTB — Ansaldo Energia и Siemens Energy в Main Customers; новость 02.09.2026 — юбилей 20 лет сотрудничества с Siemens Energy. Полный список клиентов WTB: GE Vernova, Siemens Energy, Mitsubishi Power, Ansaldo Energia, Doosan Enerbility, Toshiba, BHEL, Arabelle, Rolls-Royce, Honeywell, GE Aerospace, Airbus, Collins, FACC. Huishan Ave 1800, Уси, 230 000 м², регистрационный капитал 713 млн юаней, с 1978 г., +86-510-85727135, Marketing@turblade.com. Doncasters — Ansaldo Energia в проспекте IPO (на самом сайте клиенты не перечислены).", "<b>C*Blade не льёт</b> — только ковка (молоты до 50 000 кгм) и 5-осевая механообработка. Лопатки ЦНД до 1800 мм. AS 9100D.", "<b>GF Precicast вышла из литейного бизнеса</b> — сайты сняты: precicast.ch редиректит на georgfischer.com, gfcs.com редиректит на nemak.com."], "forge_disc": [{"n": "Saarschmiede", "c": "Фёльклинген, Германия", "w": "<b>Профиль совпадает точнее всех.</b> Прессы 120 МН (~12 000 т) и 85 МН; ЭДП UHP 125 т; ВИП 16 т; ВДП 6 и 30 т; ЭШП; подрядная обработка &gt;100 т, &gt;20 м, Ø до 4 м. Ключевое: <b>автоматизированный УЗК-контроль именно деталей дискового типа</b> и <b>4 стенда горячей разгонной балансировки роторов</b> — такое оборудование ставят только под роторные диски и валы турбин. Исторически площадка под Siemens V-серию", "k": "Marouane Enhari, Head of Sales Power Generation, +49 6898 102431, m.enhari@saarschmiede.com; Stefan Ackermann +49 6898 104367. Bismarckstr. 57-59, 66333"}, {"n": "Divisione Fucine, Acciai Speciali Terni (Arvedi)", "c": "Терни, Италия", "w": "<b>Единственный, кто прямым текстом пишет «Alberi e Dischi per turbine a gas»</b> (валы и диски для газовых турбин). Слиток 530 т вакуумной разливки, 450 т сифон; отгрузка до 260 т. Пресс 12 600 т + манипулятор 700 т·м; пресс 5000 т; 2×ЭДП 180 т; ASEA-SKF 180 т; 2×AOD 140 т; VD/VOD 140 т; 13 горизонтальных ЧПУ-токарных до 360 т, 5 вертикальных 250 т, 2 шлифовальных 300 т; автоматический УЗК валов до 150 т. Плюс география: Италия, а Ansaldo заявляет 80% цепочки поставок в Италии", "k": "V.le B. Brin 218, 05100 Terni; +39 0744 4881"}, {"n": "Aubert &amp; Duval", "c": "Франция", "w": "Единственный в Европе с полноценной линейкой Ni-суперсплавов под диски: <b>PER718, PER706, PER3, PER72</b> (= Inconel 718/706), <b>AD730</b> (Ni-суперсплав до 750 °C), MLX17. Прямо перечисляет «диски, валы, ступицы роторов» для наземных турбин, «от 2-3 МВт до &gt;500 МВт». Это поставщик для горячих ступеней", "k": "—"}, {"n": "Второй эшелон", "c": "JP / KR / UK / IN / IT", "w": "<b>JSW</b> — моноблочные роторные валы генераторов. <b>Doosan Enerbility</b> — поковки &gt;100 т, стальное литьё &gt;200 т, своя ГТУ DGT6-300H. <b>Sheffield Forgemasters</b> — диски до Ø5080 мм, слиток до 300 т, прессы 10 000 и 4500 т, механообработка до 400 т, крупнейший в UK 5-осевой карусельный BOST VTL, <b>но ЭШП нет и Ni-линии нет</b> — годен для холодной части и компрессора, не для горячих дисков; собственность МО Великобритании. <b>Bharat Forge</b> — линии прессов 1600–16 000 т, молот 80 т·м, «Disc» в каталоге Power. <b>FOMAS</b> — слиток 125 т ЭШП (= 170 т обычный), поковка Ø5250×13 000 мм, кольца до 25 т", "k": "—"}, {"n": "Проверены и не подходят", "c": "IT / SE / US", "w": "<b>Forgital</b> (Вело-д'Астико) — бесшовные раскатные кольца Ø220–8300 мм до 45 т, <b>дисков ротора нет</b>. <b>GIVA Group</b> (19 заводов на севере Италии) — 15 прессов свободной ковки, 6 кольцепрокатных станов. <b>ASONEXT/ASOFORGE</b> (Оспиталетто) — только стали, Ni-суперсплавов нет. <b>Björneborg Steel</b> (Швеция, с 1656 г.) — валы, диски, кольца + чистовая механообработка «в сотые доли мм»; энергетика = генераторы, не горячая часть. <b>Ellwood, Scot Forge, Canton Drop Forge</b> (США) — габарит диска тяжёлой ГТУ вне профиля", "k": "—"}], "hirth": ["<b>Позиция «диск ротора» распадается на две компетенции, и ни одна компания публично не заявляет обе сразу.</b>", "<b>(1) Поковка-заготовка диска</b> — открытый рынок есть: Saarschmiede, Терни, Aubert &amp; Duval, JSW, FOMAS.", "<b>(2) Нарезка хиртового венца</b> — торцевые радиальные зубья с биением в единицы микрон на диске Ø1,2–2,2 м. В мире это делают <b>сами OEM у себя</b>: Ansaldo (завод Campi, 800 станков), Siemens Energy (Берлин/Мюльхайм), MHI (Такасаго), Doosan (Чханвон), GE (Гринвилл). <b>На открытом рынке хирт не рекламирует никто.</b> Ближе всех по классу станков Sheffield Forgemasters, но зуборезку они не заявляют.", "<b>Товарная схема, если позиция когда-нибудь понадобится:</b> заготовка от Saarschmiede / Терни / A&amp;D / JSW, а хиртовый венец режет либо OEM, либо узкий специализированный механообрабатывающий цех (в Италии это класс Bruno Presezzi — проверить не удалось, сайт закрыт бот-защитой).", "<b>Контекст по заводу Campi (Генуя):</b> 219 000 м², 800 станков, делает роторы ГТ и ПТ, лопатки, генераторы. Сварка SAW применяется «для набора ротора» (rotor stacking) — это про сварной ротор GT26/GT36 (наследие Alstom). Диски с хиртовым венцом — линия AE94.2/AE94.3A. Вход в поставщики — закрытый портал квалификации <b>vendorhub.ansaldoenergia.com</b>."], "kvou_geom": ["<b>Отраслевой стандарт геометрии импульсных КВОУ: посадочный Ø324 мм × высота 660 мм</b> (12,75″ × 26″). Всё остальное — вариации большого торца. Комплект = конус 445→324×660 или 406→324×660 + цилиндр 324×324×660. Обе позиции по 660 мм. Китайские обозначения GTG 445 / GTG 324 кодируют именно большой диаметр.", "<b>Второй тип — кольцевой цилиндр (не конус).</b> Пример: ФОЛТЕР ФЭП-445×355×660-05-02 — наружный посадочный Ø445, внутренний Ø355, длина 660, Ø по фланцу 476. Класс F8 по ГОСТ Р ЕН 779-2014, площадь 21 м², миниплиссированный с микроволоконным покрытием. Расход 3400 м³/ч. Сопротивление начальное 158 Па, конечное 450 Па. −60…+80 °C, влажность до 100%, УХЛ2 по ГОСТ 15150. В комплекте вкладыш-предфильтр ФМ-ФЭП М5 1170×660×20-Х1 (класс M5, ≥0,8 м², толщина 20 мм, оборачивается вокруг картриджа). <b>Прямо объявлен эквивалентом Donaldson P190848 (фильтр) и P190844 (вкладыш).</b> ⚠ Расхождение снять у поставщика: в названии карточки «445х335х660», в паспорте «445×355×660».", "<b>Панельные и кассетные (статические КВОУ).</b> ФяС-КТ (ФОЛТЕР) F6–F9 — сечения 592×592, 287×592, 490×592 мм; ФяР-С пухоуловитель 595×595×5,0; ФяС-КО (G4) фланец в фланец к ФяС-КТ; Camfil CamGT 3V-600 / 3V-440 / 4V-300 — цифра после V = глубина в мм, сечение 592×592.", "<b>Серия Donaldson P19xxxx — де-факто отраслевой стандарт номеров:</b> P190848, P190844, P191177, P191178, P191280, P191281. <b>Если снять с корпуса или из формуляра станции хотя бы один из этих номеров — подбор схлопывается до одной строки.</b>"], "kvou_sizes": [{"pn": "TN11602601", "up": "Ø 406", "lo": "Ø 324", "h": "660", "s": "23 м²"}, {"pn": "TN11272600", "up": "Ø 324", "lo": "Ø 324, отверстие 14/25 мм", "h": "660", "s": "21 м²"}, {"pn": "TN11752601", "up": "Ø 445", "lo": "Ø 324", "h": "660", "s": "25 м²"}, {"pn": "ФЭП-445×355×660-05-02 (ФОЛТЕР)", "up": "Ø 445 наружный, Ø 476 по фланцу", "lo": "Ø 355 внутренний", "h": "660", "s": "21 м², класс F8, 3400 м³/ч, ΔP 158 → 450 Па"}], "kvou_econ": ["<b>1″ в.ст. (250 Па) перепада = −0,375% мощности ГТУ и +0,125% удельного расхода тепла</b> (данные Camfil). Это база для любого обоснования замены перед заказчиком.", "<b>Оптимум замены — 1,6″ в.ст. (~400 Па), примерно 8000 ч:</b> минимум совокупной стоимости владения, ложится на плановые остановы.", "Рекомендуемый максимум изготовителя — 2,4″ в.ст. (~600 Па), ~13 000 ч → <b>+4,6%</b> к эксплуатационным затратам. Верхний предел OEM — 5″ в.ст. (~1250 Па), ~24 000 ч → <b>+39%</b> затрат против оптимума.", "Обычная практика отрасли — <b>18–24 месяца</b> между заменами. Срабатывание аварийки по ΔP выдёргивает станцию в неплановый останов — это дороже самих фильтров.", "ФОЛТЕР: сопротивление входа 40 Па; новые компактные системы снижают суммарное сопротивление трёх ступеней на 80 Па; ступень грубой очистки (G4) — полгода в типовой системе и не менее года в новой.", "<b>Стандарты для ТЗ.</b> ISO 29461-1 — первый специализированный стандарт эффективности фильтров именно для турбомашин (механическая эффективность и пылеёмкость); Camfil TurboPulse уже маркируется ISO 29461-1:2021. Сопутствующие: EN 1822 (EPA/HEPA E10–H14), ISO 16890 (ePM1/ePM10). В РФ: ГОСТ Р ЕН 779-2014 (классы F), ГОСТ 15150 (климатическое исполнение)."], "kvou_makers": [{"n": "Jiangsu HQA (Huaqiang)", "c": "КНР, Янчжун", "w": "<b>Самый сильный канал.</b> Делает и КВОУ целиком, и сами фильтроэлементы (GT Panel / GT Cartridge / GT Cassette). Линейки КВОУ разбиты ПО OEM: <b>отдельная серия «Ansaldo»</b>, плюс Siemens, Mitsubishi, GE. <b>Три референции по AE94.3A: Shanghai, Yuhai, Zhangjiagang</b>", "k": "No. 900 Yihe Rd, Xinba, Yangzhong, Zhenjiang 212212 · +86 511 8842 8891 · hqaair.com", "a": "да"}, {"n": "Shanghai Thenow Purification", "c": "КНР, Шанхай", "w": "Комплекты конус+цилиндр, twist-lock, OEM/ODM, публикует таблицу размеров, называет GE, Solar, Siemens, Alstom. Среды: целлюлоза+синтетика/F9, 100% синтетика/F9, +нано/F9, +нано+FR/F9, 100% синтетика+ePTFE/<b>H10</b>", "k": "No. 59 Linsheng Rd, Jinshan, Шанхай · TÜV Rheinland audited", "a": "да"}, {"n": "Jiangsu Renhe Environment  (Ansaldo)", "units": "2", "year": "12.2026 (план)", "note": "2×270 МВт, в стройке. Ближайший «свой» рынок с новым парком Ansaldo", "src": ""}, {"plant": "Мингечевир «8 Ноября»", "owner": "Azerenerji, Азербайджан", "model": "AE94.3A (Ansaldo)", "units": "4", "year": "24.06.2025", "note": "4×320 МВт (1280 ГТУ / 1880 ПГУ), контракт €160 млн, сжигание до 40% водорода. Свежий парк — потребность в ЗИП появится через 3-5 лет", "src": ""}, {"plant": "Берёзовская ГРЭС, Лукомльская ГРЭС", "owner": "Беларусь", "model": "SGT5-4000F", "units": "2", "year": "2014", "note": "По 427 МВт", "src": ""}, {"plant": "Ереван-2", "owner": "Армения", "model": "SGT5-2000E", "units": "1", "year": "—", "note": "250 МВт", "src": ""}], "fleet_notes": ["<b>Итог по парку.</b> В России 13 машин семейства 64.3A на шести площадках, из них <b>12 постройки Ansaldo Energia</b>. Машин AE94.2 производства Ansaldo в РФ нет — семейство «.2» представлено пятью V94.2 постройки Siemens и 18 машинами ГТЭ-160 ЛМЗ. Плюс ~13 машин SGT5-4000F и ~8 машин наследия Alstom. Это и есть весь адресуемый рынок.", "<b>Уфа и Казань — гипотеза не подтвердилась.</b> Ни в одном источнике машин V64.3A или Ansaldo на уфимских и казанских ТЭЦ не зафиксировано. Перечень площадок 64.3A выше исчерпывающий.", "<b>Взаимозаменяемость — подтверждена самой Ansaldo, дословно.</b> Брошюра MXL2 для AE94.2: «The new set of hot gas path parts are applicable to <b>all versions of AE/V 94.2 and SGT5-2000E</b>… fully retrofittable during a programmed Major Overhaul, without de-stacking of the turbine rotor». То же для AE94.3A — «all versions of AE/V94.3A and SGT5-4000F». Определяющий параметр — <b>версия машины, а не бренд завода</b>.", "<b>Ещё сильнее — реальный проект на машинах Siemens.</b> Кейс A2A Piacenza (Италия, 840 МВт, 2005): две ГТУ прямо помечены в документации Ansaldo как «V94.3A V4, OEM: Siemens». LTSA с Ansaldo активирован в 2020, инспекции горячего тракта 2021-2023. На машины Siemens установлены пакеты Ansaldo CMF++ и SAS-UP2: новые диски компрессора CD1-CD5, новый корпус CVC1, опорный подшипник, доработки воздухозаборника и промежуточного вала, камера сгорания SAS-UP2 с акустическими демпферами, турбина MXL. Результат +23 МВт на каждую ГТУ, +66 МВт по ПГУ. То есть Ansaldo штатно и коммерчески переоснащает машины Siemens вплоть до дисков компрессора.", "<b>Где граница проходит на самом деле.</b> AE94.2 и AE64.3A — <b>разные машины, пересечения по ЗИП нет вообще</b>: две силосные камеры против кольцевой, 16 ступеней компрессора против 15, прямой привод 3000 об/мин против редукторного 5400, 160-190 МВт против 80. AE64.3A — родня по F-классу «.3A», а не по «.2»: Ansaldo прямо описывает её как «scaled-down compressor and combustion section from the AE94.3A».", "<b>ГТЭ-160 — особый случай.</b> Машина производится «без изменений по лицензии» Siemens, то есть геометрия и интерфейсы — это V94.2, и детали соответствующей версии должны садиться. Но локализовано >60% компонентов с заменой на российские материалы-аналоги, номенклатура номеров собственная, а материалы и сертификаты расходятся. При подборе горячей части это отдельный риск по жаропрочным сплавам и покрытиям.", "<b>Доноры — где искать б/у.</b> Приоритет A (законсервированы, ГВТ на месте): Baiji Gas, Ирак — 4× SGT5-2000E 159 МВт; Aksa Antalya блок 1, Турция — SGT5-4000F, без выработки с 2020; Vilvoorde, Бельгия — SGT5-4000F, вывод 2025. Приоритет B (выведены): Otahuhu B, Новая Зеландия — V94.3A(2) 404 МВт, выведена 09.2015; Barry, Уэльс — V94.2 постройки Ansaldo; CNOOC Shenzhen блок 4, Китай — V94.2. Приоритет C (плановый вывод): Coryton, UK — 2× GT26, <b>2026 год</b>; Fujairah F2, ОАЭ — GT26, 2031. Приоритет D (отменённые проекты, оборудование могло быть заказано): Derna Gas, Ливия — 6× SGT5-2000E; Varna блоки 7-8, Болгария; Yashma, Азербайджан.", "<b>Витринного рынка V-серии не существует.</b> Проверенные брокерские площадки (powerplantsonline, USP&amp;E, Salvex, ReflowX, Genloop) держат в основном GE, P&amp;W и Westinghouse. Сделки по V- NERGIA S.P.A.", "im": "ООО «АЭР»", "what": "Запасные части для ремонта и обслуживания ГТУ AE64.3A, 65 МВт", "kg": "6*8,9", "co": "IT"}, {"date": "16.07.2024", "ex": "ANSALDO ENERGIA S.P.A.", "im": "ООО «АЭР»", "what": "Запасные части для ремонта и обслуживания ГТУ AE64.3A, 65 МВт", "kg": "95,4", "co": "IT"}, {"date": "13.08.2024", "ex": "ANSALDO ENERGIA S.P.A.", "im": "ООО «АЭР»", "what": "Запасные части для ремонта и обслуживания ГТУ AE64.3A, 65 МВт", "kg": "3*4,6", "co": "IT"}], "notes": ["<b>Главный вывод из нашей таможни.</b> Ansaldo Energia S.p.A. напрямую возила ЗИП AE64.3A на свою российскую дочку ООО «АЭР» <b>вплоть до августа 2024</b> — то есть спустя два с половиной года после начала санкций и за год с лишним до полного запрета. Все поставки на условиях FCA Генуя, в евро, код ТН ВЭД 8411990098. Схема включала и обратный цикл: вывоз изношенных лопаток в Италию на ремонт и ввоз их же после восстановления. Это подтверждает, что до октября 2025 канал был легален, а значит склад в РФ реально существует.", "<b>Второй канал — итальянский, но не Ansaldo.</b> SAMIC S.p.A. в сентябре 2023 поставила ремонтные части для ГТЭ-160 через Литву на ООО «ГЭХ Сервис газовых турбин» — того же заказчика, для которого мы делали X и L-кольца. SAMIC заявляет на сайте «hot gas parts, inner liners, U-ducts, heat shields, vane carriers» и корпуса горячего газа из Inconel. Это готовый профильный контакт по камере сгорания V-серии.", "<b>Третий канал — швейцарско-вьетнамский по Alstom.</b> Части GT13E2 для Челябинской ТЭЦ-4 шли через ООО «ДЖИИ РУС» с отправлением из <b>Вьетнама</b> при происхождении Швейцария и Италия. Отдельно любопытно, что вывоз на постгарантийный ремонт и обратный ввоз оформлялись как самостоятельные декларации — та же схема, что у Ansaldo с лопатками.", "<b>Что говорит наша воронка.</b> Двенадцать сделок по семейству с декабря 2023 года, из них шесть — по одной машине ТТЭЦ-1 «Форвард Энерго». По ключевой позиции (лопатки) — восемь запросов и ноль коммерческих предложений. Единственный, кто не отказал сразу, — итальянская GTS S.p.A. (General Turbine Solutions, Grassobbio, VAT 06473320965), заявляющая <b>реверс-инжиниринг снятых с производства деталей прямо на площадке заказчика</b> и сертификацию Achilles UVDB. Этот контакт надо доводить."]}, "subs": [{"title": "Литьё горячей части — доказанные поставщики Ansaldo", "cls": "t1", "intro": "Высокая уверенность означает, что поставщик или Ansaldo сами публично называют друг друга: список клиентов на сайте, совместный доклад, кейс-стади или пресс-релиз.", "rows": [{"name": "GF Precicast Industrial (GF Casting Solutions)", "country": "Швейцария / Румыния", "what": "Точное литьё суперсплавов: лопатки, сопловые аппараты, детали горячего тракта. Равноосная кристаллизация, направленная кристаллизация и <b>монокристалл</b>, отливка до 250 кг. Площадки Novazzano, Stabio (CH) и Arad (RO), ~600 чел.", "proof": "В карточке швейцарского литейного союза список клиентов: «ABB Turbo, Alstom, <b>Ansaldo</b>, Astrium, Avio, ITP, MAN, PSM, Rolls-Royce, Siemens, Turbocare»", "site": "gfcs.com", "email": "", "access": "низкая"}, {"name": "Consolidated Precision Products (CPP)", "country": "США", "what": "Покупатель литейного бизнеса Precicast у Georg Fischer", "proof": "Ad-hoc сообщение GF от 07.07.2026 о продаже аэрокосмического и IGT-литейного бизнеса; закрытие к концу 2026", "site": "cppcorp.com", "email": "", "access": "низкая"}, {"name": "Doncasters Group", "country": "Великобритания", "what": "Вертикально интегрированное точное литьё лопаток и сопловых, конструкционные отливки, Ni/Co-суперсплавы. Все три исполнения: equiaxed, DS, монокристалл", "proof": "Проспект IPO на NYSE: «Doncasters serves major OEMs including GE Aerospace, Pratt &amp; Whitney, Rolls-Royce, Safran, Honeywell, Siemens Energy, GE Vernova, <b>Ansaldo Energia</b>, Doosan»", "site": "doncasters.com", "email": "", "access": "низкая"}, {"name": "Wuxi Turbine Blade (WTB)", "country": "Китай, Уси", "what": "<b>Не литейка:</b> ковка заготовок и финишная механообработка лопаток паровых и газовых турбин, крупнейший в КНР, >300 тыс. лопаток в год. Входит в Shanghai Electric Group", "proof": "Страница «Main Customers» прямо перечисляет: «Shanghai Electric, GE Vernova, Siemens Energy, Arabelle, Mitsubishi Power, Toshiba, BHEL, Doosan Enerbility, <b>Ansaldo Energia</b>, GE Aerospace, Rolls-Royce»", "site": "turblade.com/en/customers.html", "email": "", "access": "<b>высокая</b>"}, {"name": "Deloro Microfusione (быв. Microfusione Stellite)", "country": "Италия, Pieve Emanuele", "what": "Литьё по выплавляемым моделям в Ni- и Co-суперсплавах: лопатки, сопловые аппараты, <b>тепловые экраны</b> и компоненты камеры сгорания. <b>Максимум вакуумного литья 180 кг</b> (не 75), только равноосная кристаллизация. 4 печи, 15 000 м², ~180 чел., NADCAP по рентгену и ЛЮМ", "proof": "Опыт по промышленным ГТ с 1970-х, по лопаткам с середины 1980-х; итальянский кластер", "site": "deloro.com", "email": "microfusione@deloro.com", "access": "низкая"}, {"name": "Yingliu AeroTech", "country": "Китай", "what": "Литьё и механообработка деталей горячей части", "proof": "китайский кластер поставщиков IGT", "site": "yingliu.com.cn", "email": "", "access": "<b>высокая</b>"}, {"name": "Howmet Aerospace, Precision Castparts, Zollern, PBS Velká Bíteš, TPC Components", "country": "США / Германия / Чехия / Швеция", "what": "Крупнейшие мировые литейщики IGT", "proof": "<b>Проверено адресно — публичных доказательств связи с Ansaldo нет.</b> У Zollern в списке клиентов BMTS, BorgWarner, Continental, IHI, MHI, MTU — Ansaldo отсутствует", "site": "", "email": "", "access": "низкая"}]}, {"title": "Поковки, диски и роторы", "cls": "t3", "intro": "Ни по одной компании публичного подтверждения связи с Ansaldo нет. Ниже — кандидаты по технологической пригодности и географической близости, которых надо проверять через Vendor Hub или прямым опросом.", "rows": [{"name": "Società delle Fucine (Acciai Speciali Terni)", "country": "Италия, Терни", "what": "«Shafts, spindles and discs for welded or hot clamped rotors… <b>shafts and discs for gas turbines</b>». Слитки до 530 т, пресс 12 600 т", "proof": "Профиль подтверждён; названный клиент — Siemens (вал ЦВД крупнейшей паровой турбины). Ansaldo не назван", "site": "acciaiterni.it", "email": "", "access": "низкая"}, {"name": "Lucchini RS", "country": "Италия", "what": "«Discs for gas turbines, rotor shafts, generator shafts»", "proof": "профиль продукции; Ansaldo не назван", "site": "lucchinirs.com", "email": "", "access": "низкая"}, {"name": "Forgital Group, FOMAS Group, Forgiatura A. Vienna (GIVA)", "country": "Италия", "what": "Кольцевые и near-net-shape поковки для энергетики", "proof": "итальянский кластер, Ansaldo не назван", "site": "", "email": "", "access": "низкая"}, {"name": "Saarschmiede", "country": "Германия", "what": "Роторные поковки из Alloy 617/263", "proof": "референсы — Toshiba, Siemens SST-800, NET Power. <b>Ansaldo не назван</b>", "site": "saarschmiede.com", "email": "", "access": "низкая"}, {"name": "Bharat Forge", "country": "Индия", "what": "Тяжёлые поковки", "proof": "признаков горячей части ГТУ не найдено", "site": "bharatforge.com", "email": "", "access": "средняя"}]}, {"title": "Покрытия и ремонт лопаток", "cls": "t2", "intro": "Ключевой факт: покрытия и ремонт лопаток Ansaldo держит внутри — собственные ремцентры в Генуе и Абу-Даби, ~3000 лопаток в год. Внешние подрядчики по этой позиции публично не подтверждены.", "rows": [{"name": "Ansaldo Energia Repair Centers", "country": "Италия, ОАЭ", "what": "Съём отработанных покрытий, инспекция, восстановление 3D-печатью, повторное нанесение. Технологии: TIG, лазерная наплавка LMD, фторидная ионная очистка, пайка, ЭЭО-прошивка охлаждающих отверстий, замена сот, купонный ремонт, вакуумная термообработка; покрытия VPS, HVOF, APS, шликерный и CVD-алюминид", "proof": "собственные площадки Ansaldo; продукт «multireco» — многократное восстановление", "site": "ansaldoenergia.com/know-how-enabler
