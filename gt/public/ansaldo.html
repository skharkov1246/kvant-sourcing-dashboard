с перевозчиком. Для роторов и корпусов — транспортёры.", "<b>ГОСТ 9.014-78</b> — временная противокоррозионная защита: 16 вариантов ВЗ-1…ВЗ-16 (ВЗ-10…ВЗ-16 — осушители и летучие ингибиторы, т.е. VCI), 9 вариантов внутренней упаковки ВУ-1…ВУ-8, срок защиты от 1 года до 20 лет.", "<b>ГОСТ 23216-78</b> — категории упаковки КУ-1…КУ-4 (КУ-4 — герметичная, полная защита); категории условий транспортирования ОЛ/Л/С/Ж, предельные сроки от 1 до 6 мес.", "<b>ГОСТ 26653-2015</b> — коэффициенты динамических нагрузок для расчёта крепления: авто 0,8 (продольно), ж/д 0,5, море 0,3–0,4, авиа 1,0.", "<b>ГОСТ 10198-91</b> — деревянные ящики массой 200–20 000 кг, типы I–VIII; раскосы обязательны при высоте >600 мм, угол 20–60°.", "<b>МСФМ 15 (ISPM 15) — обязательно для всей деревянной тары толщиной >6 мм.</b> Термообработка HT: 56 °C в толще древесины ≥30 мин, либо фумигация бромистым метилом. Древесина окорённая. Клеймо: символ IPPC + код страны + номер обработчика + метод (HT/MB). НЕ требуют обработки: фанера, OSB, ДСП, дерево тоньше 6 мм, пластиковые поддоны. <b>Нечитаемое клеймо = задержка на фитоконтроле, а это 4 185–27 900 ₽/сут за OOG-место.</b> Клеймо включать в приёмку по фотоотчёту ДО отгрузки.", "<b>Консервация в ТЗ:</b> гарантийный срок консервации не менее «срок транзита + 6 месяцев». Для проточной части и посадочных поверхностей — летучие ингибиторы (VCI) вместо густых смазок, чтобы исключить расконсервацию перед монтажом. Барьер: VCI-плёнка/чехол, герметизация сваркой шва; при жёстких требованиях — вакуум в алюмополимерную фольгу (КУ-4 / ВУ-8). Силикагель с расчётом по объёму + индикатор влажности с окном для контроля без вскрытия.", "<b>Индикаторы:</b> ударные (ShockWatch) и наклонные (TiltWatch) — с указанием в ТЗ порога срабатывания в g, количества и точек наклейки, с фотофиксацией при отгрузке."], "log_cos": [{"n": "FESCO / ДВМП", "w": "19 морских линий, 110+ портов; интермодал через Владивосток, Новороссийск, СПб; <b>отдельное направление проектной и негабаритной логистики</b> «от завода-изготовителя до установки»; 30+ судов, 6 терминалов, ВМТП; таможенное оформление", "k": "8-800-23-444-99; <b>проектные грузы projects@fesco.com</b>; Новороссийск +7 8617 62-01-29"}, {"n": "IFCG («Ай-Эф-Си-Джи Рус»)", "w": "<b>Таможенный брокер и классификация ТН ВЭД — профильно.</b> Декларирование, разрешительная документация (лицензии, нотификации, ЕАС, экспортный контроль), <b>оспаривание решений таможни, аудит контрактов.</b> 17 лет, 7 500+ ДТ, 50 000+ разрешений", "k": "+7 495 544-59-00; отдел таможни доб. 400, customs@ifcg.ru"}, {"n": "Волга-Днепр", "w": "Авиаперевозка сверхтяжёлого негабарита: Ан-124-100 (120 т) и Ил-76ТД-90ВД; чартер, мультимодаль", "k": "+7 495 755-6850; sales@volga-dnepr.com; Пекин +86 10 8447 5502, apac.sales@volga-dnepr.com"}, {"n": "NOVELCO", "w": "Авиа, авто, море, ж/д; Китай, Турция, ОАЭ, <b>Иран</b>, СНГ; таможенное оформление, агентские услуги с конверсией от 1,5%", "k": "8-800-600-42-30, order@novelco.ru"}, {"n": "Совфрахт", "w": "Морские и речные перевозки, <b>Арктика и Каспий</b>, морское агентирование; профильна для коридора Север–Юг", "k": "+7 495 258-27-41, general@sovfracht.ru"}, {"n": "ОТЛК ЕРА", "w": "Ж/д контейнерные поезда Китай — Европа/Россия; ~485 поездов/мес, ~9 270 платформ, сохранность 99,998%. Погранпереходы Забайкальск, Достык, Алтынколь, Наушки", "k": "+7 495 995-95-91, utlc@utlc.com"}, {"n": "STALOGISTIC", "w": "14 офисов в 8 странах, 600+ чел.; ж/д, море, авто, авиа; <b>проектная логистика тяжёлых грузов</b>; Китай, Центральная Азия (Казахстан, Узбекистан), ЮВА; 540+ маршрутов", "k": "+375 17 270-49-79, sta@stalogistic.com"}, {"n": "ТПП РФ", "w": "Сертификаты происхождения СТ-1 (срок действия 12 мес.), форма А, общая форма; <b>экспертиза страны происхождения</b> (2000+ экспертов); удостоверение форс-мажора", "k": "+7 495 620-00-09; экспертиза +7 495 620-05-36; Москва, Ильинка 6/1"}, {"n": "Рускон (группа Дело)", "w": "Контейнерные перевозки, Китай / Индия / Турция / ОАЭ, мультимодаль, негабарит, таможенное оформление. Хабы Москва и Новороссийск", "k": "сайт отдаёт 403 из-за границы — контакты уточнять с российского IP"}], "log_steps": ["<b>Зафиксировать код ДО контрактации.</b> Определить мощность ГТУ-адресата → выбрать между 8411 99 001 9 (5–50 МВт), 8411 99 009 2 (>50 МВт, с подтверждением целевого назначения) и 8411 99 009 8. Внести формулировку в спецификацию контракта.", "<b>Подать на предварительное классификационное решение</b> — 5 000 ₽, до 90 дней, действует 3 года. При поставке партиями — параллельно решение о классификации в несобранном виде (ст. 16 ФЗ-289).", "<b>Проверить происхождение.</b> Иран, Сербия, Вьетнам дают 0%; Китай, Индия, Турция — 5%. Поставить на контроль вступление в силу соглашения с ОАЭ. <b>Оговорка: реэкспорт через Иран/ОАЭ преференций не даёт</b> — нужен реальный критерий происхождения. Товар китайского происхождения, отгруженный из Джебель-Али, остаётся китайским.", "<b>Включить упаковочный чек-лист в ТЗ</b> и потребовать фотоотчёт с клеймом ISPM 15 и установленными индикаторами до отгрузки.", "<b>Считать бюджет с учётом OOG-надбавок</b> и планировать вывоз из порта в первые 3 суток (бесплатное хранение OOG — 3 суток, не 5).", "<b>Котировки</b> запрашивать сразу у FESCO (projects@fesco.com) и минимум одного независимого проектного логиста; для срочных позиций — параллельно у Волга-Днепр."], "rfq": {"rules": ["<b>Правило 1. Идентифицировать машину, а не модель.</b> Отраслевой стандарт — три компонента: позиционное обозначение детали + версия горячего тракта + заводской номер ГТУ. Запрос «лопатка 1 ступени AE64.3A» без версии и серийника не отработает ни один поставщик — именно поэтому мы получили восемь отказов подряд.", "<b>Правило 2. Использовать позиционные коды.</b> TLa1, TLa2, TLa3, TLa4 — рабочие (роторные) лопатки турбины по ступеням; TLe1…TLe4 — сопловые (статорные). Это немецкая система Siemens, она реально фигурирует в тендерной документации европейских эксплуатантов и понятна любому профильному поставщику.", "<b>Правило 3. Указывать версию.</b> Для V94.2/ГТЭ-160 — Version 3, 4, 5, 6 или 7. Для AE-машин Ansaldo — «Rating &lt;год&gt;», для Siemens — «Version N». Одноимённые детали разных версий физически различаются.", "<b>Правило 4. Различать 64.3A и 94.3A.</b> Обе имеют 15-ступенчатый компрессор, кольцевую камеру с керамическими плитками, 24 горелки, 4-ступенчатую турбину и ротор с хиртовыми зубьями — это не признаки для идентификации. Различает: расход 215 против 755 кг/с, наличие редуктора (только 64.3A) и число ступеней компрессора у ранних машин.", "<b>Правило 5. Не употреблять несуществующие обозначения.</b> «HR3» как имя горелки, «AE94.3A4» и «AE94.3A5» как индексы версий в документации OEM отсутствуют. Их появление в запросе сразу помечает его как непрофессиональный.", "<b>Правило 6. Прикладывать наработку.</b> Эквивалентные часы (EOH) и число пусков определяют, какая ревизия детали нужна и годится ли восстановление. Без них поставщик не сможет предложить ремонт вместо покупки.", "<b>Правило 7. Когда чертежей нет — давать обмеры.</b> Для лопатки: число зубьев ёлочного замка, хорда, высота пера, толщина стенки, схема и число охлаждающих отверстий, тип покрытия, твёрдость, спектральный анализ материала. Для редуктора: <b>межосевое расстояние</b> (710 или 800 мм — это и решает спор TX71 против TX80), число зубьев шестерни и колеса, нормальный модуль, угол наклона, ширина венца, диаметры шеек, тип и число сегментов подшипника, отпечаток пятна контакта.", "<b>Правило 8. 3D-скан окупается.</b> Это единственный способ корректно поставить задачу китайскому или индийскому изготовителю. Практика David Brown Santasalo: структурированное сканирование вращающихся частей за срок менее 10 часов прямо в окно останова, корпус при этом сохраняется и присоединительные размеры не трогаются."], "template": "<b>Шаблон запроса (англ.)</b><br><br>Subject: RFQ — Hot gas path parts for Ansaldo AE64.3A / Siemens V64.3A (SGT-1000F), unit S/N &lt;номер&gt;<br><br>We operate an Ansaldo AE64 document.getElementById('tabs').innerHTML = PANES.map((p,i)=>`<button class="tab${i?'':' on'}" data-i="${i}">${esc(p[0])}</button>`).join('');
document.getElementById('panes').innerHTML = PANES.map((p,i)=>`<div class="pane${i?'':' on'}" id="p${i}">${i?'':p[1]()}</div>`).join('');
function showPane(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on', j===i));
  document.querySelectorAll('.pane').forEach((p,j)=>{
    if(j===i && !p.dataset.built && j) { p.innerHTML = PANES[j][1](); p.dataset.built='1'; }
    p.classList.toggle('on', j===i);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('.tab'); if(!b) return;
  showPane(+b.dataset.i);
});
const goTab = title => { const i = PANES.findIndex(p=>p[0]===title); if(i>=0) showPane(i); };

/* --- навигатор: связанные выпадающие списки --- */
const MODELS = D.nav_oem.flatMap(o => o.models.map(m => ({...m, oem:o.o, co:o.co, role:o.role})));
const TYPES = D.nav_types;
const typeOf = t => TYPES.find(x=>x.t===t) || {w:[]};
const fill = (el, items, cur, all) => {
  el.innerHTML = `<option value="">${all}</option>` + items.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
};
const sel = {oem:'', mod:'', typ:''};
function navRender(){
  const eOem=document.getElementById('fOem'), eMod=document.getElementById('fMod'), eTyp=document.getElementById('fTyp');
  if(!eOem) return;
  let pool = MODELS;
  if(sel.oem) pool = pool.filter(m=>m.oem===sel.oem);
  if(sel.typ) pool = pool.filter(m=>m.ty.includes(sel.typ));
  if(sel.mod && !pool.some(m=>m.m===sel.mod)) sel.mod='';
  const oems = D.nav_oem.map(o=>o.o).filter(o => !sel.typ || MODELS.some(m=>m.oem===o && m.ty.includes(sel.typ)));
  const typs = TYPES.map(t=>t.t).filter(t => pool.some(m=>m.ty.includes(t)));
  fill(eOem, oems, sel.oem, '— все производители —');
  fill(eMod, pool.map(m=>m.m), sel.mod, `— все модели (${pool.length}) —`);
  fill(eTyp, typs, sel.typ, '— все узлы —');

  const out = document.getElementById('navOut');
  const jumps = list => [...new Set(list)].map(t=>`<button class="jump" data-t="${esc(t)}">${esc(t)} →</button>`).join('');
  const one = MODELS.find(m=>m.m===sel.mod);
  if(one){
    const shown = sel.typ ? [sel.typ] : one.ty;
    out.innerHTML = `<div class="mcard2">
      <h3>${esc(one.m)}</h3>
      <div class="al">${esc(one.oem)} · ${esc(one.co)}${one.al&&one.al!=='—'?' · также известна как '+esc(one.al):''}</div>
      <div class="mspec">
        <div><b>Класс</b>${esc(one.cl)}</div><div><b>Мощность и КПД</b>${esc(one.p)}</div>
        <div><b>Камера сгорания</b>${esc(one.cmb)}</div><div><b>Проточная часть</b>${esc(one.st)}</div>
      </div>
      <div><b>Узлы на этой машине (${one.ty.length}):</b><br>${one.ty.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
      <div style="margin-top:10px"><b>Где читать${sel.typ?' по узлу «'+esc(sel.typ)+'»':''}:</b><br>${jumps(shown.flatMap(t=>typeOf(t).w))}</div>
    </div>
    <div class="box warn"><b>Ловушки этой машины.</b> ${one.tr}</div>
    <h2>Узлы модели ${esc(one.m)}</h2>` + T(['Узел','Код / обозначение','EN-термин для RFQ','Где читать'],
      shown.map(t=>{const x=typeOf(t); return [`<span class="cn">${esc(t)}</span>`, esc(x.c||''), esc(x.en||''), jumps(x.w)];}));
  } else {
    out.innerHTML = `<h2>Модели${sel.oem?' — '+esc(sel.oem):''}${sel.typ?', где есть узел «'+esc(sel.typ)+'»':''} (${pool.length})</h2>`
      + T(['Производитель','Модель','Другие имена','Класс','Мощность','Узлов','Где читать'],
        pool.map(m=>[esc(m.oem), `<span class="cn">${esc(m.m)}</span>`, esc(m.al), esc(m.cl), esc(m.p), String(m.ty.length),
          jumps((sel.typ?[sel.typ]:m.ty).flatMap(t=>typeOf(t).w))]))
      + '<h2>Узлы и типы оборудования</h2>' + T(['Узел','Код / обозначение','EN-термин для RFQ','На каких моделях','Где читать'],
        TYPES.filter(x=>!sel.typ||x.t===sel.typ).map(x=>{
          const ms = pool.filter(m=>m.ty.includes(x.t)).map(m=>m.m);
          return [`<span class="cn">${esc(x.t)}</span>`, esc(x.c), esc(x.en),
            ms.length?ms.map(v=>`<span class="chip">${esc(v)}</span>`).join(''):'<span class="mut">—</span>', jumps(x.w)];
        }).filter(r=>r[3].indexOf('—')<0||sel.typ));
  }
}
document.getElementById('panes').addEventListener('change', ev => {
  if(ev.target.id==='fOem'){ sel.oem=ev.target.value; sel.mod=''; }
  else if(ev.target.id==='fMod') sel.mod=ev.target.value;
  else if(ev.target.id==='fTyp') sel.typ=ev.target.value;
  else return;
  navRender();
});
document.getElementById('panes').addEventListener('click', ev => {
  const j = ev.target.closest('.jump');
  if(j){ goTab(j.dataset.t); return; }
  if(ev.target.id==='fReset'){ sel.oem=sel.mod=sel.typ=''; navRender(); }
});
navRender();
