 FL), Ansaldo Thomassen B.V. (Rheden), PSM Japan, Ansaldo Energia Korea, Mexico, Brasil. Выручка периметра €205,6 млн (2020)", "src": "https://www.clearygottlieb.com/news-and-insights/news-listing/hanwhas-acquisition-of-aftermarket-gas-turbine-business-of-ansaldo-energia"}, {"year": "2023", "what": "18.06 — санкции США запрещают американским компаниям оказывать инжиниринговые услуги в РФ", "src": ""}, {"year": "2025", "what": "Июль, 18-й пакет ЕС — немедленный запрет экспорта запчастей ГТУ по коду 841199 в РФ и Белоруссию, с запретом сервиса и ТО. Отгрузка по контрактам до 20.07.2025 — только до 20.10.2025", "src": "Отчётность Ansaldo Energia 2025"}, {"year": "2025", "what": "23.10 — Регламент (ЕС) 2025/2033 (19-й пакет) вносит товарную позицию <b>8411 целиком</b> в Приложение XXIII Регламента 833/2014. Без «ex», без порогов мощности, без изъятий для энергетики", "src": "https://eur-lex.europa.eu/eli/reg/2014/833/2026-04-24/eng"}, {"year": "2026", "what": "01.04 — возврат к прибыли, промышленный план 2026-2030. 20.07 — заказ на 8 AE64.3A для дата-центра в Техасе. 01.09 — TÜV SÜD сертифицирует GT36 на 70% H₂, DNV валидирует AE94.3A на HVO", "src": ""}], "sites": [{"name": "Генуя, Campi", "country": "Италия", "what": "Историческая площадка, Via Nicola Lorenzi 8. 219 000 м² общей, 131 000 м² застроенной, ~800 станков, ~570 чел. производства. Campi 1 — сборка средних и крупных турбин, сборка камер сгорания, механообработка роторов генераторов. Campi 2 — генераторы: медные шины статоров, статоры, испытания перед отгрузкой. Электроэрозионная обработка профилей лопаток, TIG, сварка под флюсом. Ротор GT36 — ~160 т, длина ~14 м", "src": "https://www.ansaldoenergia.com/know-how-enablers/manufacturing/factory"}, {"name": "Генуя, Fegino", "country": "Италия", "what": "Реконструирован в 2017. Механообработка роторов турбин, высокоскоростная испытательная камера роторов (spin pit), обработка, контроль и установка лопаток. <b>HGP Genoa Repair Centre</b> — электроэрозия, 3D-ремонт  Hub (MESH) — 120 оснащённых техников, аварийный выезд; филиал в Al Markaziya ведёт удалённую диагностику IPS: 33 ГВт под мониторингом — 106 газовых турбин, 42 паровых, 132 генератора", "src": "https://www.ansaldoenergia.com/know-how-enablers/manufacturing/repair-center"}, {"name": "Шанхай", "country": "Китай", "what": "Два СП: Shanghai Electric Gas Turbine Co. (SEGT) — Ansaldo 40%, выручка €168,2 млн (2025), собственный капитал отрицательный (−€3,4 млн); Ansaldo Gas Turbines High Technology (AGTT) — Ansaldo 60%, выручка €12,6 млн. Роль СП — финальная сборка, закупка вспомогательного оборудования в КНР, продажи. <b>Горячая часть в Китае НЕ локализована</b> — идёт из Генуи, поток ~€80 млн в год", "src": ""}, {"name": "Rheden", "country": "Нидерланды", "what": "<b>БОЛЬШЕ НЕ ANSALDO.</b> Ansaldo Thomassen B.V. продана Hanwha 29.06.2021 → Thomassen Energy B.V., Havelandseweg 8-d, 6991 GS Rheden, KvK 24272908, +31 26 497 5800, info@thomassen.psm.com. Профиль — рамы GE (Frame 5, 6B, 7B/E/EA, 9E, 6F) и Siemens/Westinghouse 501D. Машин Ansaldo в номенклатуре нет", "src": "https://thomassen.energy/about/"}]}, "models": [{"name": "AE94.2", "legacy": "V94.2 / SGT5-2000E", "cls": "E", "power": "190 МВт", "eff": "36,8%", "cc_eff": "55,8 / 56,2%", "rpm": "3000", "stages": "16 / 4", "combustor": "2 силосные камеры, по 8 гибридных горелок (16 всего), футеровка индивидуально заменяемыми плитками", "fleet": "120+ ед., >10 млн EOH. Плюс версия <b>AE94.2K</b> под низкокалорийные топлива (до 4000 кДж/кг и ниже) — синтез-газы, доменный и коксовый газ"}, {"name": "AE64.3A", "legacy": "V64.3A / SGT-1000F", "cls": "малый F", "power": "78 МВт", "eff": "36,9%", "cc_eff": "55,7 / 56,4%", "rpm": "5400 + редуктор", "stages": "15 / 4", "combustor": "кольцевая, 24 сухие двухтопливные горелки, индивидуально заменяемые плитки", "fleet": "73 ед., >4 млн EOH. Единственная редукторная машина семейства — работает и на 50, и на 60 Гц"}, {"name": "AE94.3A", "legacy": "V94.3A / SGT5-4000F", "cls": "F", "power": "340 МВт", "eff": "40,3%", "cc_eff": "60,0 / 60,3%", "rpm": "3000", "stages": "15 / 4", "combustor": "кольцевая «walk-in», 24 горелки DLN премикс (газ и жидкое), керамические плитки", "fleet": "96 ед. (80 в ПГУ + 16 в открытом цикле), >5 млн EOH. У Siemens по этой платформе продано 380+ машин, >29 млн EOH"}, {"name": "GT26", "legacy": "Alstom", "cls": "Advanced F", "power": "370 МВт", "eff": "41%", "cc_eff": "61,0 / 61,2%", "rpm": "3000", "stages": "22 / 1 ВД + 4 НД", "combustor": "последовательное сжигание: кольцевая EV (24 горелки) → ТВД → кольцевая SEV (24 горелки). Всего 48 горелок", "fleet": "110 ед., из них 78 на технологии Ansaldo, >9 млн EOH. Эмиссионно-соответствующая работа до 15% нагрузки ПГУ"}, {"name": "GT36-S5", "legacy": "—", "cls": "H", "power": "563 МВт", "eff": "43,0%", "cc_eff": "62,6 / 62,8%", "rpm": "3000", "stages": "15 / 4", "combustor": "can-annular с последовательным сжиганием (CPSC), 16 жаровых труб на 50 Гц (12 на 60 Гц), технология FlameSheet", "fleet": "5 ед. (Marghera Levante, Presenzano, Tavazzano, Fusina — Италия; Minhang — Китай), >80 000 EOH к 07.2026, первая инспекция B1 пройдена. Сертификат TÜV SÜD на 70% H₂"}, {"name": "GT36-S6", "legacy": "—", "cls": "H", "power": "369 МВт", "eff": "42,3%", "cc_eff": "~62,3%", "rpm": "3600", "stages": "15 / 4", "combustor": "то же, 12 жаровых труб", "fleet": "версия 60 Гц; коммерческих заказов подтвердить не удалось"}, {"name": "AE-T100", "legacy": "Turbec", "cls": "микро", "power": "100 кВт", "eff": "30%", "cc_eff": "до 90% (когенерация)", "rpm": "70 000", "stages": "1 / 1", "combustor": "одна камера типа CAN, 4,5 бар абс., TIT 950 °C", "fleet": "действующий продукт. Версии NG (газ), B (биогаз), E (внешний подвод тепла), исполнения Power only и CHP. Испытана на смеси до 80% H₂"}], "model_notes": ["<b>Что Ansaldo не публикует.</b> Для тяжёлых ГТУ в брошюрах нет степени сжатия, оборотов, температуры на входе в турбину, массы и габаритов. Ближайшие проверяемые ориентиры — паспорта Siemens на ту же платформу: SGT5-2000E — π*=12,8:1, 198 МВт / 37,6%, 558 кг/с, 536 °C; SGT5-4000F — π*=20,1:1 (329 МВт / 41%) или 21,0:1 (385 МВт / 41,5%), 724 и 800 кг/с, 599 и 619 °C, масса 318-322 т, габарит 10,8×5,2×4,8 м. Учтите: Ansaldo даёт net, Siemens — gross, напрямую цифры не сравнимы.", "<b>Версии — главный параметр подбора, важнее бренда.</b> Для V94.2 / SGT5-2000E официально существуют версии 3, 4, 5, 6, 7 — заказывать деталь без указания версии бессмысленно, физически различаются даже одноимённые лопатки. Ansaldo нумерует свои машины «Rating &lt;год&gt;» (например Rating 2010), Siemens — «Version N». Апгрейд MXL2 применим ко всем версиям; апгрейд компрессора AirFlex — только до Rating 2010 / Version 7 включительно.", "<b>Материалы горячей части V94.2 (по каталогу Sulzer, версии 3-6).</b> Рабочие лопатки 1-3 ступеней — Inconel 738LC, 4-й ступени — <b>Inconel 792</b>. Лопатка 1 ст. — MCrAlY + TBC снаружи, алюминидная диффузия внутри, тонкостенная; 2 ст. — MCrAlY, 12 охлаждающих отверстий. Сопловые 1-2 ст. — Inconel 738LC с MCrAlY + TBC; 3 ст. — у OEM был IN939, Sulzer заменил на 738LC ради ползучести.", "<b>Материалы горячей части AE64.3A (по каталогу Sulzer).</b> Рабочая лопатка 1 ст. — Ni-суперсплав направленной кристаллизации, полное внешнее TBC + внутренний алюминид, конвективно-плёночное охлаждение, 3D-профиль; 2 ст. — то же; 3 ст. — MCrAlY + внутренний алюминид, 15 радиальных охлаждающих отверстий электроэрозией. Сопловая 1 ст. — <b>Co-суперсплав</b>, 100% TBC + внутренний алюминид, веерные плёночные отверстия, showerhead, импинджмент; 2 ст. — Ni-суперсплав, 100% TBC, змеевиковое охлаждение; 3 ст. — MCrAlY + алюминид.", "<b>Апгрейды — это и есть каталог горячей части.</b> MXL2 для AE94.3A включает новую камеру сгорания с SAS-UP2, обойму сопловых аппаратов, рабочие и сопловые лопатки всех четырёх ступеней, уплотнительные кольца и новые покрытия (улучшенный подслой + увеличенная толщина TBC + высокопористый слой). Эффект в M-режиме: ГТ +25 МВт, +0,7% КПД; ПГУ 1+1 +45 МВт, +1,5%. В XL-режиме — +16 тыс. EOH к межремонтному интервалу. Для AE94.2 MXL2 даёт +1,4% КПД и интервал ТО до 50 тыс. EOH без расстыковки ротора и без изменений дисков."], "naming": [{"s": "V94.2", "a": "AE94.2 (+ AE94.2K)", "cn": "сборка Shanghai Electric", "ru": "<b>ГТЭ-160</b> — ЛМЗ / «Силовые машины» по лицензии Siemens с 1992, право продавать под своей маркой с 2001", "note": "В Иране та же машина — MAPNA MGT-70 (V94.2-5, 162 МВт), апгрейд MGT-70(3) до 185 МВт / 36,4%. Мировой парк семейства ~585 машин"}, {"s": "V94.3A", "a": "AE94.3A", "cn": "SEGT (финальная сборка)", "ru": "нет лицензии; в РФ стоят машины постройки Siemens", "note": "Ansaldo штатно переоснащает машины Siemens своими деталями — см. кейс A2A Piacenza"}, {"s": "V64.3A / SGT-1000F", "a": "AE64.3A", "cn": "SEGT", "ru": "нет лицензии", "note": "Разрабатывалась Siemens KWU <b>совместно с Ansaldo</b>. В РФ 13 машин, из них 12 постройки Ansaldo"}, {"s": "V84.2", "a": "нет", "cn": "—", "ru": "—", "note": "60-Гц сестра V94.2, Siemens SGT6-2000E"}, {"s": "V84.3A", "a": "нет", "cn": "—", "ru": "—", "note": "60-Гц сестра V94.3A, Siemens SGT6-4000F"}, {"s": "— (Alstom)", "a": "GT26, GT36", "cn": "GT36-S5 на Minhang", "ru": "GT26 — ТЭЦ-26 «Мосэнерго» блок 8 (288 МВт, 2011)", "note": "Наследие Alstom, куплено у GE в 2016. GT13E2 осталась у GE Vernova"}], "parts": [{"ru": "Рабочая лопатка турбины, ступени 1-4", "en": "Turbine blade / <b>TLa1, TLa2, TLa3, TLa4</b> (Turbinenlaufschaufel Stufe 1-4)", "qty": "комплект ряда", "life": "1 и 2 ст. на V94.2 v.3 — только замена, не ремонт", "note": "Немецкая позиционная система Siemens, реально используется в тендерах ESB (Ирландия). Это и есть рабочий идентификатор вместо парт-номера"}, {"ru": "Сопловая (направляющая) лопатка, ступени 1-4", "en": "Turbine vane / <b>TLe1, TLe2, TLe3, TLe4</b> (Turbinenleitschaufel Stufe 1-4)", "qty": "комплект ряда", "life": "все четыре ступени ремонтопригодны", "note": "В ремонтном лоте ESB TR810 — сопловые всех 4 ступеней плюс рабочие 3 и 4"}, {"ru": "Разъёмные уплотнительные кольца ступеней 2 и 3", "en": "Divided Seal Rings for Stages 2, 3", "qty": "комплект", "life": "—", "note": "Идут в комплекте с лопаточным аппаратом"}, {"ru": "Гибридная горелка", "en": "Dry-Low-NOx hybrid burner / H-burner", "qty": "AE94.2 — 16 (8×2 камеры); AE94.3A и AE64.3A — 24; GT26 — 48 (24 EV + 24 SEV)", "life": "полная замена комплекта при капремонте под BAT-NOx", "note": "Обозначение «HR3» в брошюрах Ansaldo и Siemens не встречается — не использовать в RFQ"}, {"ru": "Керамические плитки камеры сгорания", "en": "Ceramic tiles", "qty": "число на камеру OEM не публикует", "life": "как правило одноразовые", "note": "<b>Самая узкая позиция корзины.</b> Керамику публично не заявляет ни один из проверенных изготовителей — запрашивать по чертежу у Schunk (RB-SiC до 1380 °C, NB-SiC до 1470 °C), Saint-Gobain, Rauschert"}, {"ru": "Держатели плиток, основания под плитки", "en": "Brick holders, Base for tiles / Supporti refrattari, Basi per piastrelle", "qty": "по числу плиток", "life": "—", "note": "Единственный публичный изготовитель этой номенклатуры — <b>GFM S.p.A.</b> (Mapello, Италия)"}, {"ru": "Сегменты и пластины камеры сгорания", "en": "Segments and plates for combustion chamber", "qty": "—", "life": "—", "note": "GFM S.p.A."}, {"ru": "Жаровая труба", "en": "Flame tube / combustion liner", "qty": "по числу камер", "life": "2-4 цикла восстановления (экспертная оценка)", "note": "Материал по каталогу Sulzer — сталь 16Mo3, с кольцами крепления и держателями плиток"}, {"ru": "Смесительная камера", "en": "Mixing chamber", "qty": "по числу камер", "life": "—", "note": "Inconel 617, кольцо охлаждения со <b>144 каналами</b>. Делают Sulzer и Paya Mavad (Иран)"}, {"ru": "Корпус горячего газа", "en": "Hot gas casing", "qty": "—", "life": "—", "note": "Inconel 617, TBC по внутренней втулке"}, {"ru": "K-кольца, L-кольца", "en": "K-rings, L-rings", "qty": "комплект", "life": "—", "note": "Наша сделка 5216 — «X и L-кольца для ГТУ ГТЭ-160». Делают Sulzer и Paya Mavad"}, {"ru": "Кольца охлаждения, зубчатые кольца", "en": "Cooling rings, castellation rings", "qty": "—", "life": "—", "note": "Опционально hard-face покрытие против фреттинга"}, {"ru": "Верхние и нижние плиты горелок", "en": "Upper / lower burner plates", "qty": "по числу горелок", "life": "—", "note": ""}, {"ru": "Диагональные завихрители", "en": "Diagonal swirlers", "qty": "по числу горелок", "life": "—", "note": ""}, {"ru": "Вставки горелок", "en": "Burner inserts", "qty": "по числу горелок", "life": "—", "note": "GFM S.p.A. заявляет прямо"}, {"ru": "Тепловые экраны, сегменты направляющего кольца", "en": "Heat shields, ring segments", "qty": "—", "life": "—", "note": "Sung-il (Корея) льёт эту номенклатуру; в нашей таможне AE64.3A ввозились «сегменты направляющего кольца»"}, {"ru": "Обойма сопловых аппаратов", "en": "Turbine vane carrier", "qty": "1", "life": "меняется в составе MXL2", "note": "В кейсе Piacenza Ansaldo меняла на машине Siemens вплоть до дисков компрессора CD1-CD5 и корпуса CVC1"}, {"ru": "Лопатки и направляющие компрессора, ВНА", "en": "Compressor blades / vanes, IGV", "qty": "15 или 16 ступеней", "life": "—", "note": "AirFlex — 3D-редизайн первых 6 ступеней AE94.3A"}, {"ru": "Редуктор (только AE64.3A)", "en": "Flender-Graffenstaden TX71/1C или TX80/1C", "qty": "1", "life": "капремонт по 100-128 тыс. часов", "note": "Кинематика 5400→3000 об/мин, i=1,8. Квилл-шафт, 5 подшипников. Альтернативы: MAAG тип HET (85 МВт), RENK Turbo Gear Unit"}, {"ru": "Фильтроэлементы КВОУ", "en": "Air intake filter elements", "qty": "по проекту", "life": "регламентная замена", "note": "Наша сделка 10348. Подбор по посадочному размеру, а не по OEM-номеру"}], "parts_notes": ["<b>Публичного каталога парт-номеров Ansaldo и Siemens для V-серии не существует.</b> Проверено по тендерам, каталогам и брошюрам — 8-10-значные материальные коды OEM нигде не публикуются. Вместо них отраслевой стандарт идентификации — три компонента: <b>позиционное обозначение (TLa1…TLe4) + версия горячего тракта + заводской номер машины</b>. Ansaldo и Siemens подбирают деталь по серийнику и ревизии, потому что одна и та же «лопатка 1 ступени» физически различается между версиями 3-7.", "<b>Что известно про форматы номеров.</b> У российского поставщика INTECH GmbH опубликованы реальные номера вида <b>A2A50006473</b> и <b>A2A50006106</b> для V94.2 (SGT5-2000E) — формат «A2A» + 8 цифр, похоже на внутренний код Siemens/KWU. В руководстве «Gas Turbine Description V94.2» встречаются документные номера вида W 3.1-1350-9425 (Burner Assembly) и W 3.1-3345-0001 (Hybrid Burner). Использовать как ориентир формата, не как готовый заказной номер.", "<b>Обозначения, которые реально работают в переписке:</b> TLa1-TLa4 и TLe1-TLe4 (лопатки и сопловые по ступеням), <b>Version 3/4/5/6/7</b> (ревизия горячего тракта V94.2), <b>41 MAC</b> (концепция ТО Siemens на 41 000 EOH — детали маркируются «compatible with 41 MAC»), <b>SAS-UP2</b> (новая камера сгорания AE94.3A в пакете MXL2), MXL2 / M-mode / XL-mode (апгрейд-пакеты AE-машин; <b>MXL3 существует только для GT26</b>, на AE94.2 и AE94.3A его нет), <b>TX80/1C</b> (редуктор Flender для AE64.3A), <b>eHGPI</b> (расширенная инспекция горячего тракта — закупается как отдельный тип работ).", "<b>Количества по ступеням OEM не публикует</b> — ни Ansaldo, ни Siemens, ни независимые. Комплектность берётся только из ведомости ЗИП конкретной машины по заводскому номеру и версии. Единственный числовой след в открытых источниках: в разборе разрушения лопаток SGT6-2000E фигурирует партия 89 рабочих лопаток 1 ступени, из них 64 признаны неремонтопригодными и 25 восстановлены — то есть <b>72% брака</b> при дефектации.", "<b>Интервалы обслуживания.</b> AE94.2 — 41 тыс. EOH по горячей части (с MXL2 до 50 тыс.); AE64.3A — 33 тыс. EOH; AE94.3A — до 5 лет между капремонтами, с MXL2 интервал до 41 тыс. EOH; GT26 — 32 тыс. ч, с MXL2 до 40 тыс. EOH. Реальные цифры из польских тендеров PGE: капремонт AE64.3A выполнялся <b>после 100 000 и после 128 000 часов наработки</b>, средние осмотры — примерно каждые 8 000 часов. Шкала для E-класса: малый осмотр 8 тыс. EOH, HGPI 41 тыс. EOH, капремонт 100-110 тыс.", "<b>Формула пересчёта эквивалентных часов (EOH) непублична.</b> Коэффициенты за пуск, срыв нагрузки, вид топлива, впрыск воды и пиковый режим у Siemens и Ansaldo закрыты. Панель ASME отмечала, что все OEM считают по-разному, иногда по-разному от площадки к площадке, и реальная разница в стоимости возникает между 20 и 30 часами на пуск. Отраслевая практика (оценка): нормальный пуск ≈10-20 EOH, аварийный останов ≈100+ EOH, жидкое топливо — множитель ~1,5-2. Цифры для контракта брать только из своего договора.", "<b>Что ремонтируют, а что меняют.</b> Из состава ремонтного лота ESB TR810 по V94.2 v.3: ремонтируются рабочие лопатки 3 и 4 ступеней и сопловые всех четырёх; <b>рабочие лопатки 1 и 2 ступеней в ремонт не идут — только новые</b>. Технологии ремонта Ansaldo Global Repair: ручной TIG, лазерная наплавка (LMD), фторидная ионная очистка (FIC), пайка с узким зазором и оверлейная, ЭЭО-прошивка охлаждающих отверстий, замена сот, купонный ремонт, вакуумная термообработка; покрытия VPS, HVOF, APS, шликерный и CVD-алюминид. Отдельный продукт «multireco» — продление ресурса многократным восстановлением, число циклов не публикуется."], "prices": [{"item": "Новый полный комплект лопаточного аппарата на одну V94.2 v.3: TLa1-TLa4 + TLe1-TLe4 + разъёмные уплотнительные кольца 2 и 3 ст. + монтажный крепёж", "val": "€5 000 000", "basis": "оценочная стоимость закупки ESB, ТЭЦ Poolbeg CG14, 2023", "src": "https://ted.europa.eu/en/notice/-/detail/772841-2023"}, {"item": "Ремонт 6 позиций V94.2 v.3 (TLa3, TLa4, TLe1-TLe4)", "val": "€750 000", "basis": "закупка ESB 2023, победитель EthosEnergy Light Turbines Ltd (2026)", "src": "https://ted.europa.eu/en/notice/-/detail/757055-2023"}, {"item": "Капремонт AE64.3A после 128 000 часов + редуктор TX80/1C + сервис 2023-2027", "val": "€8 288 750", "basis": "PGE Rzeszów, 2022, победитель Ansaldo Energia", "src": "https://ted.europa.eu/en/notice/-/detail/567315-2022"}, {"item": "Капремонт AE64.3A после 100 000 часов + сервис на 25 000 часов, вкл. полную замену комплекта горелок под BAT-NOx", "val": "€4 345 000", "basis": "PGE <b>Rzeszów</b>, тендер 27142-2018, победитель Ansaldo Energia (ранее ошибочно значилось Bełchatów)", "src": "https://ted.europa.eu/en/notice/-/detail/27142-2018"}, {"item": "Капремонт V94.2 + сервис 2025-2031", "val": "€14 191 220", "basis": "ТЭЦ Lublin Wrotków, 2024, победитель Ansaldo Energia", "src": "https://ted.europa.eu/en/notice/-/detail/607763-2024"}, {"item": "ТО V94.2 включая расширенный ремонт eHGPI", "val": "€12 666 640 (рамка до €75 млн)", "basis": "HEP, TE-TO Sisak, Хорватия, 2025, победитель Siemens Energy", "src": "https://ted.europa.eu/en/notice/-/detail/416550-2025"}, {"item": "Капремонт ПАРОВОЙ турбины (не ГТ)", "val": "€3 078 180", "basis": "Ørsted, Avedøre, Дания, 2026, победитель Ansaldo Energia. <b>Как якорь по V94.2 не годится</b> — это паровая турбина; оставлено для полноты картины по контрактам Ansaldo", "src": "https://ted.europa.eu/en/notice/-/detail/48859-2026"}, {"item": "LTSA на ПГУ с SGT5-4000F", "val": "€103 822 000", "basis": "Počerady, Чехия, 2019, Siemens", "src": "https://ted.europa.eu/en/notice/-/detail/169062-2019"}, {"item": "Комплект горячего тракта машины 150-200 МВт (исторический ориентир)", "val": "$1,5-2,5 млн", "basis": "ASME / Global Gas Turbine News, 2001. К 2023 цена выросла примерно в 2-2,5 раза", "src": "https://files.asme.org/igti/knowledge/articles/13047.pdf"}, {"item": "Комплект деталей камеры сгорания low-NOx (исторический ориентир)", "val": "$450-650 тыс. и выше", "basis": "там же, 2001", "src": ""}, {"item": "Срок поставки нового комплекта лопаток и сопловых V94.2", "val": "12 месяцев", "basis": "длительность контракта в извещении ESB TR4503", "src": "https://ted.europa.eu/en/notice/-/detail/713460-2025"}, {"item": "Срок ремонта комплекта лопаток", "val": "12 месяцев по контракту; 4-8 мес. «от снятия до возврата» (оценка)", "basis": "контракт ESB TR810", "src": ""}, {"item": "Экономия от восстановления против новых деталей", "val": "до 70%", "basis": "данные ЗТСР (ныне «ТурбоСервис Рус»), центр в Екатеринбурге", "src": "https://ritm-magazine.com/ru/public/turbiny-zarubezhnye-servis-rossiyskiy"}], "alstom_gt": [{"m": "GT26", "sp": "Компрессор 22 ступени осевой, 4 ряда VGV. Камера EV кольцевая, <b>24 горелки</b>. ТВД 1 ступень, воздушное охлаждение. Камера SEV кольцевая, <b>24 горелки</b>. ТНД 4 ступени, воздушное охлаждение. Цельный сварной ротор, генератор с холодного конца", "p": "ПЦ 370 МВт / 41,0%; выхлоп 741 кг/с, 635 °C. ПГУ 1+1: 540 МВт / 61,0%; 2+1: 1 083 МВт / 61,2%. Разгрузка до 15% (1+1) и 8% (2+1). NOx до 15 ppm сухой. H₂ до 45% об.", "f": "110 машин, <b>78 с технологией Ansaldo</b>, >9 млн EOH. GE Vernova по своей стороне: «более 100 машин», 37 ГВт, 21 страна", "i": "HGPI <b>32 000 ч</b>. Онлайн-переключение Performance Optimized ↔ Maintenance Cost Optimized даёт до +30% времени между инспекциями"}, {"m": "GT36-S5", "sp": "<b>15 ступеней</b> компрессора, 4 VGV. Cannular sequential combustor chamber (CPSC). <b>4-ступенчатая</b> воздушно-охлаждаемая турбина. Цельный сварной ротор, генератор с холодного конца", "p": "ПЦ <b>563 МВт / 43,0%</b>, выхлоп 1 065 кг/с, 630 °C. ПГУ 1+1: 800 МВт / 62,6%; 2+1: 1 605 МВт / 62,8%. Turndown 20/10%, low-load parking 10/5%. NOx 25 ppm (опция 15). <b>H₂ до 70% об.</b>, разработка до 100%", "f": "<b>5 машин.</b> Первый пуск ноябрь 2022. Парк превысил 80 000 EOH, на лидере — Edison, Marghera Levante (Италия) — выполнена первая инспекция B1", "i": "⚠ «16 жаровых труб на 50 Гц» — <b>не подтверждено</b>, брошюра ограничивается словом «cannular»"}, {"m": "GT13E2", "sp": "Горелки EV <b>72 шт.</b> штатно; апгрейд AEV — <b>48 AEV вместо 72 EV</b>. TIT 1 250 °C (MXL). ⚠ Точное число ступеней компрессора и турбины по доступным первоисточникам подтвердить не удалось", "p": "Интервал TBO <b>36 000 EOH</b> (OEM MXL) → 48 000 (пакет Sulzer). GE MXL2: до 48 000 EOH, +15 МВт, +1,5% КПД ПГУ (абс.), >1,2 млн ч опыта парка", "f": "<b>КЛЮЧЕВОЕ: GT13E2 ОСТАЛАСЬ У GE, а не перешла к Ansaldo.</b> В каталоге новых машин Ansaldo её нет. У GE Vernova — целый раздел апгрейдов", "i": "Инспекция типа «C» = Major (капремонт). C/Major требуется для: AEV-горелок; upflow-компрессора (с выемкой ротора из корпуса, 28 дней); RRP (Radial Rotor Positioning); EV-alpha горелок"}, {"m": "GT11N", "sp": "Ротор ~30 т, <b>1 250+ лопаток компрессора в 18 ступенях, 400+ лопаток турбины в 5 ступенях</b> (данные Doosan, AOG-2019)", "p": "—", "f": ">150 машин в мире, ~60% в США, Канаде и Мексике", "i": "—"}], "alstom_upg": [{"n": "MXL2 (GT26)", "b": "Rating 2006 и ранее", "iv": "<b>40 000 EOH</b>", "m": "M-режим: +25 МВт ПГУ, +0,8% КПД, +4 000 ч", "x": "XL-режим: +12 МВт, +0,5%, +12 000 ч. Итог до 456 МВт / 59,8% ПГУ", "c": "Перепроектированы все 4 ступени ТНД: 3D-профилирование, увеличен диаметр тракта на выходе турбины, усиленное ТЗП, <b>снижено число сопловых лопаток в рядах 1 и 2 ТНД</b> (меньше охлаждающего воздуха), оптимизировано охлаждение всех компонентов, улучшены бандажи (меньше перетечек через торцы)"}, {"n": "MXL3 (только GT26)", "b": "MXL2; любой Rating 2006, все до 2011 с извлекаемыми EV-горелками", "iv": "—", "m": "M-режим: +35 МВт, +1,6%, +4 000 ч", "x": "XL-режим: +22 МВт, +1,3%, +12 000 ч. Уровень H-class; H₂ 0–45% об.", "c": "Новые <b>ланцеты SEV-горелок + низкочастотные демпферы</b>; перепроектированы ступени 1 и 2 ТНД под повышенную температуру; частично перепроектирован компрессор для устойчивости; ретрофит камеры SEV от Rating 2011. Совместим с eLPL/eLLO и Fuel Flexibility Package"}, {"n": "GT26 HE (конкурирующий, от GE Vernova)", "b": "GT26", "iv": "32 000 ч, при оптимальной эксплуатации <b>до 44 000 EOH</b>", "m": "+2% КПД ПГУ, до +25 МВт, −5% CO₂", "x": "Монтаж 60 дней, требует C-инспекции (Major)", "c": "Парк: 11 машин в работе, 15 датель.", "<b>Конференции.</b> 8-я — 15-17 июля 2025, Niagara Falls, NY (тур на завод Liburdi в Dundas). 9-я — <b>28-30 июля 2026, Houston Marriott Marquis</b>, в четверг тур на завод TRS Services. Каталог поставщиков — aogusers.com/2026-aog-solutions-providers/.", "<b>Состояние рынка по итогам AOG-2025</b> (прямые цитаты участников): сроки поставки некоторых деталей <b>3-5 лет</b>; <b>EV-горелка — 99 недель</b>; турбины до 5 лет; часть OEM вообще не подаёт предложения на некоторые позиции; лейтмотив «<b>если есть запас — держите его</b>»; почти никто из участников не работает в базовом режиме; главные проблемы — определение конца ресурса, устаревание и доступность деталей.", "<b>Спонсоры и экспоненты</b> — готовый список адресатов: ABB, Arnold Group, Camfil Power Systems, GE Vernova, Groome Industrial, Hughes Technical Services, MD&A, National Electric Coil, Sung-Il Turbine, TRS Services, AGT Services, AIM Power Consulting, Allied PG, Doosan Turbomachinery Services, Emerson, Freudenberg Filter, Gulf Turbine, K-Machine, Liburdi, Mee Industries, Petrotech, PFE, Saltek, Turbo Blading.", "<b>Для РФ:</b> организация американской юрисдикции с участием GE Vernova; практический доступ российских эксплуатантов закрыт. Ценность — как карта живых независимых поставщиков и как источник рыночных сроков."], "ge_split": ["<b>Первоисточник — решение ЕК по делу M.7278 GE/Alstom, пресс-релиз IP/15/5606 от 08.09.2015.</b>", "<b>Ansaldo получила ровно пять позиций:</b> (1) технологию тяжёлых ГТУ Alstom для GT26 и GT36 — существующие апгрейды и pipeline будущих, «excluding essentially only the technology for Alstom's older <b>GT 13</b> model»; (2) значительное число R&D-инженеров Alstom; (3) два испытательных стенда GT26 и GT36 в Бирре (Швейцария); (4) долгосрочные сервисные контракты на 34 машины GT26; (5) сервисный бизнес PSM (Флорида).", "<b>У GE остался весь остальной установленный парк Alstom и его сервис.</b> Каталог апгрейдов GE Vernova: GT8C-XL, GT11N2-M, GT11NM-XL/XP, GT11NMC- "owner": "—", "model": "SGT5-2000E", "units": "2 + 2", "year": "2018-2019", "note": "Машины СТГТ. Число по Таврической выведено по симметрии проекта", "src": ""}, {"plant": "ТЭЦ-26 «Мосэнерго», блок 8", "owner": "Мосэнерго", "model": "GT26 (Alstom)", "units": "1", "year": "2011", "note": "ПГУ-424, 288 МВт — первый в России объект Alstom «под ключ». Сервисное наследие теперь у Ansaldo", "src": ""}, {"plant": "Челябинская ТЭЦ-4, Молжаниновская ПГУ, Новогорьковская ТЭЦ, Нижнетуринская ГРЭС, Академическая ТЭЦ", "owner": "Форвард Энерго, Т Плюс", "model": "GT13E2 (Alstom)", "units": "~7", "year": "2013-2016", "note": "По нашей таможне части GT13E2 ввозились через ООО «ДЖИИ РУС» из Вьетнама и Швейцарии в 2023-2024, экспортёры ALSTOM, ABB GROUP, GE ENERGY SWITZERLAND. Инспекция типа «C» на Новогорьковской — 2019 г. на 36 000 часах", "src": ""}, {"plant": "Алматы ТЭЦ-3", "owner": "Самрук-Энерго, Казахстан", "model": "AE94.2 (Ansaldo)", "units": "2", "year": "12.2026 (план)", "note": "2×270 МВт, в стройке. Ближайший «свой» рынок с новым парком Ansaldo", "src": ""}, {"plant": "Мингечевир «8 Ноября»", "owner": "Azerenerji, Азербайджан", "model": "AE94.3A (Ansaldo)", "units": "4", "year": "24.06.2025", "note": "4×320 МВт (1280 ГТУ / 1880 ПГУ), контракт €160 млн, сжигание до 40% водорода. Свежий парк — потребность в ЗИП появится через 3-5 лет", "src": ""}, {"plant": "Берёзовская ГРЭС, Лукомльская ГРЭС", "owner": "Беларусь", "model": "SGT5-4000F", "units": "2", "year": "2014", "note": "По 427 МВт", "src": ""}, {"plant": "Ереван-2", "owner": "Армения", "model": "SGT5-2000E", "units": "1", "year": "—", "note": "250 МВт", "src": ""}], "fleet_notes": ["<b>Итог по парку.</b> В России 13 машин семейства 64.3A на шести площадках, из них <b>12 постройки Ansaldo Energia</b>. Машин AE94.2 производства Ansaldo в РФ нет — семейство «.2» представлено пятью V94.2 постройки Siemens и 18 машинами ГТЭ-160 ЛМЗ. Плюс ~13 машин SGT5-4000F и ~8 машин наследия Alstom. Это и есть весь адресуемый рынок.", "<b>Уфа и Казань — гипотеза не подтвердилась.</b> Ни в одном источнике машин V64.3A или Ansaldo на уфимских и казанских ТЭЦ не зафиксировано. Перечень площадок 64.3A выше исчерпывающий.", "<b>Взаимозаменяемость — подтверждена самой Ansaldo, дословно.</b> Брошюра MXL2 для AE94.2: «The new set of hot gas path parts are applicable to <b>all versions of AE/V 94.2 and SGT5-2000E</b>… fully retrofittable during a programmed Major Overhaul, without de-stacking of the turbine rotor». То же для AE94.3A — «all versions of AE/V94.3A and SGT5-4000F». Определяющий параметр — <b>версия машины, а не бренд завода</b>.", "<b>Ещё сильнее — реальный проект на машинах Siemens.</b> Кейс A2A Piacenza (Италия, 840 МВт, 2005): две ГТУ прямо помечены в документации Ansaldo как «V94.3A V4, OEM: Siemens». LTSA с Ansaldo активирован в 2020, инспекции горячего тракта 2021-2023. На машины Siemens установлены пакеты Ansaldo CMF++ и SAS-UP2: новые диски компрессора CD1-CD5, новый корпус CVC1, опорный подшипник, доработки воздухозаборника и промежуточного вала, камера сгорания SAS-UP2 с акустическими демпферами, турбина MXL. Результат +23 МВт на каждую ГТУ, +66 МВт по ПГУ. То есть Ansaldo штатно и коммерчески переоснащает машины Siemens вплоть до дисков компрессора.", "<b>Где граница проходит на самом деле.</b> AE94.2 и AE64.3A — <b>разные машины, пересечения по ЗИП нет вообще</b>: две силосные камеры против кольцевой, 16 ступеней компрессора против 15, прямой привод 3000 об/мин против редукторного 5400, 160-190 МВт против 80. AE64.3A — родня по F-классу «.3A», а не по «.2»: Ansaldo прямо описывает её как «scaled-down compressor and combustion section from the AE94.3A».", "<b>ГТЭ-160 — особый случай.</b> Машина производится «без изменений по лицензии» Siemens, то есть геометрия и интерфейсы — это V94.2, и детали соответствующей версии должны садиться. Но локализовано >60% компонентов с заменой на российские материалы-аналоги, номенклатура номеров собственная, а материалы и сертификаты расходятся. При подборе горячей части это отдельный риск по жаропрочным сплавам и покрытиям.", "<b>Доноры — где искать б/у.</b> Приоритет A (законсервированы, ГВТ на месте): Baiji Gas, Ирак — 4× SGT5-2000E 159 МВт; Aksa Antalya блок 1, Турция — SGT5-4000F, без выработки с 2020; Vilvoorde, Бельгия — SGT5-4000F, вывод 2025. Приоритет B (выведены): Otahuhu B, Новая Зеландия — V94.3A(2) 404 МВт, выведена 09.2015; Barry, Уэльс — V94.2 постройки Ansaldo; CNOOC Shenzhen блок 4, Китай — V94.2. Приоритет C (плановый вывод): Coryton, UK — 2× GT26, <b>2026 год</b>; Fujairah F2, ОАЭ — GT26, 2031. Приоритет D (отменённые проекты, оборудование могло быть заказано): Derna Gas, Ливия — 6× SGT5-2000E; Varna блоки 7-8, Болгария; Yashma, Азербайджан.", "<b>Витринного рынка V-серии не существует.</b> Проверенные брокерские площадки (powerplantsonline, USP&amp;E, Salvex, ReflowX, Genloop) держат в основном GE, P&amp;W и Westinghouse. Сделки по V-серии идут прямыми контактами с эксплуатантами и через пользовательскую конференцию. Единичные подтверждённые лоты: комплектный блок ПГУ 200 МВт с V94.2 (Genloop), «v943a2 Siemens/Ansaldo turbine spares» на Industrial Marine Power от 21.05.2026, две V94.3A(2) 2004 года с наработкой 105 000 ч в КНР (ReflowX)."], "trace": {"deals": [{"id": "5216", "date": "15.12.2023", "what": "X и L-кольца для ГТУ ГТЭ-160, ООО «ГЭХ Сервис газовых турбин»", "who": "—", "res": "закрыта"}, {"id": "7148", "date": "14.04.2024", "what": "ЗИП к ГТУ SGT5-4000F, Няганская ГРЭС «Форвард Энерго»", "who": "—", "res": "закрыта"}, {"id": "10348", "date": "29.10.2024", "what": "Фильтр КВОУ ГТУ Ansaldo V64.3A", "who": "—", "res": "закрыта"}, {"id": "16468", "date": "02.09.2025", "what": "ЗИП для ГТУ V64.3А, ТТЭЦ-1 «Форвард Энерго»", "who": "один запрос без адресата", "res": "новый запрос"}, {"id": "16536", "date": "04.09.2025", "what": "ЗИП для ГТУ V64.3А, ТТЭЦ-1 «Форвард Энерго»", "who": "—", "res": "закрыта"}, {"id": "16974", "date": "26.09.2025", "what": "ЗИП к SGT5-4000F для Мосэнерго 7 ПАО «Мосэнерго»</b>", "kg": "14,0", "co": "IT"}, {"date": "13.02.2023", "ex": "ANSALDO ENERGIA SPA", "im": "ООО «АЭР»", "what": "Б/у части АЕ64.3A — рабочая (роторная) лопатка, без ремонта", "kg": "0,7", "co": "IT"}, {"date": "07.07.2023", "ex": "ALSTOM / ABB GROUP", "im": "ООО «ДЖИИ РУС»", "what": "Части ГТУ <b>GT13E2 182 МВт, Челябинская ТЭЦ-4 ПАО «Фортум»</b> — ввоз в неизменном состоянии и вывоз на постгарантийный ремонт", "kg": "5*9,0", "co": "VN"}, {"date": "12.09.2023", "ex": "<b>SAMIC S.P.A.</b>", "im": "ООО «ГЭХ Сервис газовых турбин»", "what": "Части для ремонта ГТУ мод. <b>SGT5-2000E / ГТЭ-160, 187 МВт</b>", "kg": "6*8,2", "co": "LT"}, {"date": "27.03.2024", "ex": "GE ENERGY SWITZERLAND", "im": "ООО «ДЖИИ РУС»", "what": "Статорная лопатка 2-й ступени ГТУ GT13E2 180 МВт; передний сегмент термозащитного экрана камеры сгорания GT13E2", "kg": "1*07,0", "co": "CH/IT"}, {"date": "16.07.2024", "ex": "ANSALDO ENERGIA S.P.A.", "im": "ООО «АЭР»", "what": "Запасные части для ремонта и обслуживания ГТУ AE64.3A, 65 МВт", "kg": "6*8,9", "co": "IT"}, {"date": "16.07.2024", "ex": "ANSALDO ENERGIA S.P.A.", "im": "ООО «АЭР»", "what": "Запасные части для ремонта и обслуживания ГТУ AE64.3A, 65 МВт", "kg": "95,4", "co": "IT"}, {"date": "13.08.2024", "ex": "ANSALDO ENERGIA S.P.A.", "im": "ООО «АЭР»", "what": "Запасные части для ремонта и обслуживания ГТУ AE64.3A, 65 МВт", "kg": "3*4,6", "co": "IT"}], "notes": ["<b>Главный вывод из нашей таможни.</b> Ansaldo Energia S.p.A. напрямую возила ЗИП AE64.3A на свою российскую дочку ООО «АЭР» <b>вплоть до августа 2024</b> — то есть спустя два с половиной года после начала санкций и за год с лишним до полного запрета. Все поставки на условиях FCA Генуя, в евро, код ТН ВЭД 8411990098. Схема включала и обратный цикл: вывоз изношенных лопаток в Италию на ремонт и ввоз их же после восстановления. Это подтверждает, что до октября 2025 канал был легален, а значит склад в РФ реально существует.", "<b>Второй канал — итальянский, но не Ansaldo.</b> SAMIC S.p.A. в сентябре 2023 поставила ремонтные части для ГТЭ-160 через Литву на ООО «ГЭХ Сервис газовых турбин» — того же заказчика, для которого мы делали X и L-кольца. SAMIC заявляет на сайте «hot gas parts, inner liners, U-ducts, heat shields, vane carriers» и корпуса горячего газа из Inconel. Это готовый профильный контакт по камере сгорания V-серии.", "<b>Третий канал — швейцарско-вьетнамский по Alstom.</b> Части GT13E2 для Челябинской ТЭЦ-4 шли через ООО «ДЖИИ РУС» с отправлением из <b>Вьетнама</b> при происхождении Швейцария и Италия. Отдельно любопытно, что вывоз на постгарантийный ремонт и обратный ввоз оформлялись как самостоятельные декларации — та же схема, что у Ansaldo с лопатками.", "<b>Что говорит наша воронка.</b> Двенадцать сделок по семейству с декабря 2023 года, из них шесть — по одной машине ТТЭЦ-1 «Форвард Энерго». По ключевой позиции (лопатки) — восемь запросов и ноль коммерческих предложений. Единственный, кто не отказал сразу, — итальянская GTS S.p.A. (General Turbine Solutions, Grassobbio, VAT 06473320965), заявляющая <b>реверс-инжиниринг снятых с производства деталей прямо на площадке заказчика</b> и сертификацию Achilles UVDB. Этот контакт надо доводить."]}, "subs": [{"title": "Литьё горячей части — доказанные поставщики Ansaldo", "cls": "t1", "intro": "Высокая уверенность означает, что поставщик или Ansaldo сами публично называют друг друга: список клиентов на сайте, совместный доклад, кейс-стади или пресс-релиз.", "rows": [{"name": "GF Precicast Industrial (GF Casting Solutions)", "country": "Швейцария / Румыния", "what": "Точное литьё суперсплавов: лопатки, сопловые аппараты, детали горячего тракта. Равноосная кристаллизация, направленная кристаллизация и <b>монокристалл</b>, отливка до 250 кг. Площадки Novazzano, Stabio (CH) и Arad (RO), ~600 чел.", "proof": "В карточке швейцарского литейного союза список клиентов: «ABB Turbo, Alstom, <b>Ansaldo</b>, Astrium, Avio, ITP, MAN, PSM, Rolls-Royce, Siemens, Turbocare»", "site": "gfcs.com", "email": "", "access": "низкая"}, {"name": "Consolidated Precision Products (CPP)", "country": "США", "what": "Покупатель литейного бизнеса Precicast у Georg Fischer", "proof": "Ad-hoc сообщение GF от 07.07.2026 о продаже аэрокосмического и IGT-литейного бизнеса; закрытие к концу 2026", "site": "cppcorp.com", "email": "", "access": "низкая"}, {"name": "Doncasters Group", "country": "Великобритания", "what": "Вертикально интегрированное точное литьё лопаток и сопловых, конструкционные отливки, Ni/Co-суперсплавы. Все три исполнения: equiaxed, DS, монокристалл", "proof": "Проспект IPO на NYSE: «Doncasters serves major OEMs including GE Aerospace, Pratt &amp; Whitney, Rolls-Royce, Safran, Honeywell, Siemens Energy, GE Vernova, <b>Ansaldo Energia</b>, Doosan»", "site": "doncasters.com", "email": "", "access": "низкая"}, {"name": "Wuxi Turbine Blade (WTB)", "country": "Китай, Уси", "what": "<b>Не литейка:</b> ковка заготовок и финишная механообработка лопаток паровых и газовых турбин, крупнейший в КНР, >300 тыс. лопаток в год. Входит в Shanghai Electric Group", "proof": "Страница «Main Customers» прямо перечисляет: «Shanghai Electric, GE Vernova, Siemens Energy, Arabelle, Mitsubishi Power, Toshiba, BHEL, Doosan Enerbility, <b>Ansaldo Energia</b>, GE Aerospace, Rolls-Royce»", "site": "turblade.com/en/customers.html", "email": "", "access": "<b>высокая</b>"}, {"name": "Deloro Microfusione (быв. Microfusione Stellite)", "country": "Италия, Pieve Emanuele", "what": "Литьё по выплавляемым моделям в Ni- и Co-суперсплавах: лопатки, сопловые аппараты, <b>тепловые экраны</b> и компоненты камеры сгорания. <b>Максимум вакуумного литья 180 кг</b> (не 75), только равноосная кристаллизация. 4 печи, 15 000 м², ~180 чел., NADCAP по рентгену и ЛЮМ", "proof": "Опыт по промышленным ГТ с 1970-х, по лопаткам с середины 1980-х; итальянский кластер", "site": "deloro.com", "email": "microfusione@deloro.com", "access": "низкая"}, {"name": "Yingliu AeroTech", "country": "Китай", "what": "Л Индия", "what": "Тяжёлые поковки", "proof": "признаков горячей части ГТУ не найдено", "site": "bharatforge.com", "email": "", "access": "средняя"}]}, {"title": "Покрытия и ремонт лопаток", "cls": "t2", "intro": "Ключевой факт: покрытия и ремонт лопаток Ansaldo держит внутри — собственные ремцентры в Генуе и Абу-Даби, ~3000 лопаток в год. Внешние подрядчики по этой позиции публично не подтверждены.", "rows": [{"name": "Ansaldo Energia Repair Centers", "country": "Италия, ОАЭ", "what": "Съём отработанных покрытий, инспекция, восстановление 3D-печатью, повторное нанесение. Технологии: TIG, лазерная наплавка LMD, фторидная ионная очистка, пайка, ЭЭО-прошивка охлаждающих отверстий, замена сот, купонный ремонт, вакуумная термообработка; покрытия VPS, HVOF, APS, шликерный и CVD-алюминид", "proof": "собственные площадки Ansaldo; продукт «multireco» — многократное восстановление", "site": "ansaldoenergia.com/know-how-enablers/manufacturing/repair-center", "email": "", "access": "низкая"}, {"name": "Sulzer (Turbo Services)", "country": "Швейцария / Нидерланды", "what": "<b>Единственный, кто публично изготавливает ВСЮ номенклатуру V94.2 и AE64.3A.</b> Стриппинг химический; TIG в аргоновом глов-боксе; лазерная сварка для DS/SX; вакуумная пайка >1100 °C; вскрытие и калибровка охлаждающих отверстий EDM + flow-test; покрытия APS, HVOF, LPPS/VPS MCrAlY (марки H11, H16), CVD и pack cementation алюминид внутренних полостей", "proof": "Отдельные брошюры: «Blades equivalent to Siemens <b>V64.3A/SGT-1000 and Ansaldo AE64.3A</b>», «Vanes equivalent to…», «New Parts Manufacturing equivalent to Siemens V94.2 / SGT5-2000E»", "site": "sulzer.com/en/shared/services/gas-turbine-parts", "email": "sulzertsvenlo@sulzer.com", "access": "низкая"}, {"name": "MAPA Turbines", "country": "Польша, Люблин", "what": "<b>Самое широкое покрытие моделей Ansaldo среди независимых.</b> APS, HVOF, диффузионные и жертвенные покрытия; TIG/MIG/лазерная сварка; высокотемпературная пайка; вакуумная и воздушная термо обавляет: (a) техническую помощь, брокерские и иные услуги, связанные с этими товарами и с их изготовлением, обслуживанием и использованием; (b) финансирование; (c) <b>продажу, лицензирование или иную передачу прав интеллектуальной собственности и коммерческих тайн, предоставление прав доступа к материалам и информации</b> — то есть передача чертежей, ТУ и ремонтных технологий тоже запрещена. Действующие изъятия (дипмиссии, гуманитарные ситуации, титан для авиации, «Сахалин-2») к энергетическим ГТУ не относятся.", "<b>Переходные окна закрыты полностью.</b> Под-приложения XXIIIA–XXIIIG упразднены вместе с переходными пунктами статьи 3k. Единственное действующее переходное положение — п. 3al (Регламент 2026/506 от 23.04.2026): исполнение до 25.07.2026 контрактов, заключённых до 24.04.2026, по кодам Приложения XXIIIH. <b>Позиции 8411 в XXIIIH нет, и срок истёк.</b> Контрактных лазеек больше не осталось.", "<b>США жёстче и раньше.</b> Supplement No. 4 к 15 CFR Part 746 включает коды 841181, 841182, 841191 и <b>841199</b> — лицензия BIS требуется на экспорт, реэкспорт и внутрироссийскую передачу, независимо от мощности. Введено правилом BIS от 11.05.2022 и расширено 25.01.2024. Отдельно: с 18.06.2023 американским компаниям запрещено оказывать инжиниринговые услуги в РФ.", "<b>Ввоз в ЕС из России тоже закрыт</b> — Приложение XXI, статья 3i, позиция <b>«Ex 8411, кроме частей ТРД/ТВД кода 8411 91 00»</b>. Введена Регламентом 2022/576 от 08.04.2022 (5-й пакет), текущая редакция задана Регламентом 2023/2878 от 18.12.2023. Это важно для схем с ремонтом в третьих странах: вывезти изношенную деталь из РФ в ЕС на восстановление легально нельзя. Ремонтный контур надо строить вне ЕС.", "<b>Российская сторона — здесь главная ловушка.</b> Позиция 8411 действительно включена в перечень для параллельного импорта (приказ Минпромторга № 2701 от 21.07.2023, зарег. Минюстом 04.08.2023 № 74633), но <b>пункт 282 читается дословно: «8411 — GENERAL ELECTRIC (GE)»</b>. Больше ни одного бренда. , 84111280, 84112100, 84112220, 84112280, 84118100, 84118220, 84118260, 84118280, 84119900. <b>Кода 84119100 нет</b>", "w": "—", "x": "Перечень построен на 8-значных кодах с разбивкой по тяге и мощности, тогда как ЕС применяет единую строку «Ex 8411» с текстовой оговоркой. Охват совпадает, администрирование иное"}, {"j": "Великобритания — двойное назначение", "a": "Schedule 2A, коды 9A991 и 9B991", "s": "9A991(c): авиационные ГТД и специально спроектированные компоненты. 9B991: оборудование и оснастка для изготовления или измерения лопаток, сопловых и бандажных отливок", "w": "—", "x": "Британские эквиваленты X.A.VII.002 и X.B.VII.002 ЕС"}, {"j": "Швейцария — импорт", "a": "Anhang 20, ст. 14c абз. 1, SR 946.231.176.72", "s": "<b>ex 8411</b>, кроме частей ТРД/ТВД 8411 91 00 — <b>формулировка дословно совпадает с ЕС</b>", "w": "Ред. по V vom 19. Aug. 2026 (AS 2026 424)", "x": "Разрешения выдаёт SECO (ст. 30 и далее), а не органы государств-членов"}, {"j": "Швейцария — авиация", "a": "Anhang 3", "s": "841111, 841112, 841121, 841122, 841191 — <b>тот же набор из пяти подсубпозиций, что и в части D Прил. XI ЕС</b>", "w": "—", "x": "—"}, {"j": "Швейцария — оккупированные территории", "a": "Anhang 7, ст. 14 абз. 1 и 2", "s": "<b>8411 целиком</b> — запрет продажи, поставки, вывоза и транзита для территорий по Anhang 6", "w": "Ред. по V vom 14. Mai 2025 (AS 2025 310)", "x": "В ЕС аналогичные меры вынесены в отдельные регламенты (692/2014 и 2022/263), а не в 833/2014"}, {"j": "Швейцария — ⚠ ПРОБЕЛ", "a": "Anhang 23 «Güter für die Stärkung der Industrie», ст. 11a абз. 1", "s": "<b>Содержание не публикуется в полном тексте</b> — «Der Inhalt dieses Anhangs wird in der AS und in der SR nur durch Verweis veröffentlicht»", "w": "—", "x": "<b>Наличие или отсутствие 8411 установить по опубликованному тексту нельзя. Это швейцарское зеркало Прил. XXIII — проверять отдельно перед каждой сделкой</b>"}, {"j": "Россия — параллельный импорт", "a": "Приказ Минпромторга № 2701 от 21.07.2023, группа 84, <b>пункт 282</b>", "s": "<b>«282) 8411 — GENERAL ELECTRIC (GE)»</b>", "w": "Минюст 04.08.2023 № 74633, опубл. 0001202308040119. Приказ № 4611 от 08.10.2024 прямо исключил из п. 282 слова «, HYUNDAI, KIA». Приказы № 1572 от 01.04.2025 и № 4769 от 26.09.2025 п. 282 не затрагивают", "x": "<b>КРИТИЧНО ДЛЯ НАС: по позиции 8411 параллельный импорт легализован ТОЛЬКО для продукции General Electric. На Ansaldo, Siemens, Alstom исключение из ст. 1487 ГК РФ НЕ распространяется</b> — то есть ввоз оригинальных деталей этих брендов без согласия правообладателя несёт риск по товарному знаку (ст. 1252, 1515 ГК). Соседние пункты 281) 8409, 283) 8412, 284) 8413, 285) 8414 несут перечни из десятков брендов — узость п. 282 намеренная"}], "legal_notes": ["<b>Самый практический вывод.</b> Ansaldo нет в перечне разрешённого параллельного импорта по 8411 (там только GE). Значит: канал «оригинал Ansaldo через третью страну» юридически уязвим внутри РФ по товарному знаку, независимо от санкционной стороны. Три следствия: (1) продавать заказчику надо восстановленную деталь или деталь независимого изготовителя, а не «оригинал в коробке»; (2) поставки от <b>ООО «Ансальдо Энерджиа Раша»</b> (склад в РФ, распродажа заявлена на 2026) этой проблемы не имеют — товар уже введён в оборот правообладателем на территории РФ; (3) при работе с GE-парком (LM6000, Frame 6B, MS5002E, а также весь парк Alstom, оставшийся у GE) параллельный импорт по 8411 легален.", "<b>De minimis США — 25%, а не 10%.</b> Россия не входит в Country Group E:1/E:2 (§ 734.4(d)), поэтому для неё действует порог 25%. Случаев «no de minimis» из § 734.4(a) для позиции 8411 не предусмотрено.", "<b>FDP по 8411 не срабатывает автоматически.</b> Товарный охват правила Russia/Belarus FDP (§ 734.9(f)) отсылает к Supplement No. 6 и 7, а не к Supp. 4/5. Изделия 8411, классифицируемые как EAR99 и попавшие под контроль только по HTS-спискам Supp. 4/5, правилом FDP не захватываются, если не имеют ECCN на CCL и не поименованы в Supp. 6/7. Лицензионное требование § 746.8(a)(5)/(a)(7) при этом действует для товаров, уже подпадающих под EAR по иным основаниям.", "<b>Переходные окна ЕС закрыты.</b> Под-приложения XXIIIA–XXIIIG упразднены. Единственное действующее переходное положение — п. 3al (Рег. 2026/506): исполнение до 25.07.2026 контрактов, заключённых до 24.04.2026, по кодам Прил. XXIIIH. <b>Позиции 8411 в XXIIIH нет, и срок уже истёк.</b>", "<b>Изъятие, которое формально применимо к 8411.</b> П. 5b ст. 3k (Рег. 2026/506 от 23.04.2026): компетентные органы могут разрешить поставку товаров глав ТН ВЭД <b>72, 84, 85 и 90</b> из Прил. XXIII, если это строго необходимо для производства титановых изделий для авиационной промышленности, для которых нет альтернативного источника. Плюс п. 4a — неармейское применение для чрезвычайных ситуаций в сфере здравоохранения, срочного предотвращения событий с серьёзным воздействием на здоровье, безопасность или окружающую среду, реагирования на стихийные бедствия. Оба — узкие, но существующие двери.", "<b>Предварительное классификационное решение — ст. 21–25 ТК ЕАЭС.</b> Обязательно для декларанта и таможни (ст. 21(4)). Принимается <b>по каждому наименованию товара, включающему определённую марку, модель, артикул и модификацию</b> (ст. 23(4)) — для ГТУ это отдельное решение на каждую модель. Срок 90 календарных дней (ст. 25(1)), действует 3 года (ст. 25(2)). Запрос допинформации — не позднее 30 к.д., ответ — не позднее 60 к.д. (ст. 24(3)).", "<b>Ставки:</b> 8411 91 000 1 и 8411 91 000 2 (части ТРД/ТВД) — пошлина <b>0%</b>; 8411 99 001 1 и 001 9 — <b>5%</b>. НДС по всем — <b>22%</b>. Экспорт беспошлинно.", "⚠ <b>Пробелы, требующие отдельной проверки перед сделкой:</b> (1) швейцарское Anhang 23 — содержание публикуется только отсылкой; (2) полное дерево подсубпозиций 8411 99 ЕТТ ЕАЭС и ставка по 8411 99 009 1 — порталы ЕЭК и ФТС недоступны извне; (3) действующие правила определения происхождения ЕАЭС (СТ-1, форма А) и перечень стран-бенефициаров."], "customs_codes ки по 3 т, четыре тельфера на 30 т"}], "oog_costs": [{"i": "Фрахт Шанхай/Нинбо/Хайфон/Хошимин → Новороссийск, FIOS", "v": "20'DC — 5 300 USD; 40'HC — 7 500 USD"}, {"i": "Надбавка за тяжёлый контейнер (HWS), 20DC > 20 т брутто", "v": "+300 USD/конт."}, {"i": "THC Новороссийск, стандартный контейнер", "v": "48 562 ₽ (20'DC) / 52 080 ₽ (40'HC)"}, {"i": "THC OOG / нестандартный контейнер", "v": "67 830 ₽ (в 1,3 раза дороже)"}, {"i": "Хранение OOG в порту", "v": "1–3 сут бесплатно (вместо 5 для стандарта); 4–10 сут — 4 185 ₽/сут (20') — 8 370 ₽/сут (40'); 11–15 сут — 6 280 / 12 560 ₽; с 16-х — 13 950 / 27 900 ₽ в сутки"}, {"i": "Досмотр (по требованию таможни)", "v": "19 185 ₽"}, {"i": "Сканирование МИДК (стандарт / OOG)", "v": "10 460 ₽ / 17 440 ₽"}, {"i": "Дополнительный подъём OOG-контейнера", "v": "8 700 ₽"}, {"i": "Перетарка груза из/в контейнер", "v": "49 140 ₽"}, {"i": "Демередж по импорту", "v": "1–14 сут бесплатно; 15–20 сут 15/30 USD; с 21-х 30/60 USD в сутки"}], "pack_rules": ["<b>Габариты авто (ПП РФ №2200 от 21.12.2020):</b> длина 12 м (одиночное ТС), 20 м (автопоезд); ширина 2,55 м; высота 4,0 м; свес за задний габарит ≤2 м. Массы автопоезда: 3-осный 28 т, 4-осный 36 т, 5-осный 40 т, 6+ осей 44 т. <b>Ротор ГТУ 60 т — заведомо тяжеловесная перевозка:</b> спецразрешение, модульный трал, согласование маршрута, оценка мостов.", "<b>Габариты ж/д (ГОСТ 9238-2013):</b> габарит Т — ширина 3250 мм, высота до 4700 мм над УГР. Сверх габарита погрузки — негабаритный груз со степенями негабаритности по зонам, согласование схемы размещения и крепления с перевозчиком. Для роторов и корпусов — транспортёры.", "<b>ГОСТ 9.014-78</b> — временная противокоррозионная защита: 16 вариантов ВЗ-1…ВЗ-16 (ВЗ-10…ВЗ-16 — осушители и летучие ингибиторы, т.е. VCI), 9 вариантов внутренней упаковки ВУ-1…ВУ-8, срок защиты от 1 года до 20 лет.", "<b>ГОСТ 23216-78</b> — категории упаковки КУ-1…КУ-4 (КУ-4 — герметичная, полная защита); категории условий транспортирования ОЛ/Л/С/Ж, предельные сроки от 1 до 6 мес.", "<b>ГОСТ 26653-2015</b> — коэффициенты динамических нагрузок для расчёта крепления: авто 0,8 (продольно), ж/д 0,5, море 0,3–0,4, авиа 1,0.", "<b>ГОСТ 10198-91</b> — деревянные ящики массой 200–20 000 кг, типы I–VIII; раскосы обязательны при высоте >600 мм, угол 20–60°.", "<b>МСФМ 15 (ISPM 15) — обязательно для всей деревянной тары толщиной >6 мм.</b> Термообработка HT: 56 °C в толще древесины ≥30 мин, либо фумигация бромистым метилом. Древесина окорённая. Клеймо: символ IPPC + код страны + номер обработчика + метод (HT/MB). НЕ требуют обработки: фанера, OSB, ДСП, дерево тоньше 6 мм, пластиковые поддоны. <b>Нечитаемое клеймо = задержка на фитоконтроле, а это 4 185–27 900 ₽/сут за OOG-место.</b> Клеймо включать в приёмку по фотоотчёту ДО отгрузки.", "<b>Консервация в ТЗ:</b> гарантийный срок консервации не менее «срок транзита + 6 месяцев». Для проточной части и посадочных поверхностей — летучие ингибиторы (VCI) вместо густых смазок, чтобы исключить расконсервацию перед монтажом. Барьер: VCI-плёнка/чехол, герметизация сваркой шва; при жёстких требованиях — вакуум в алюмополимерную фольгу (КУ-4 / ВУ-8). Силикагель с расчётом по объёму + индикатор влажности с окном для контроля без вскрытия.", "<b>Индикаторы:</b> ударные (ShockWatch) и наклонные (TiltWatch) — с указанием в ТЗ порога срабатывания в g, количества и точек наклейки, с фотофиксацией при отгрузке."], "log_cos": [{"n": "FESCO / ДВМП", "w": "19 морских линий, 110+ портов; интермодал через Владивосток, Новороссийск, СПб; <b>отдельное направление проектной и негабаритной логистики</b> «от завода-изготовителя до установки»; 30+ судов, 6 терминалов, ВМТП; таможенное оформление", "k": "8-800-23-444-99; <b>проектные грузы projects@fesco.com</b>; Новороссийск +7 8617 62-01-29"}, {"n": "IFCG («Ай-Эф-Си-Джи Рус»)", "w": "<b>Таможенный брокер и классификация ТН ВЭД — профильно.</b> Декларирование, разрешительная документация (лицензии, нотификации, ЕАС, экспортный контроль), <b>оспаривание решений таможни, аудит контрактов.</b> 17 лет, 7 500+ ДТ, 50 000+ разрешений", "k": "+7 495 544-59-00; отдел таможни доб. 400, customs@ifcg.ru"}, {"n": "Волга-Днепр", "w": "Авиаперевозка сверхтяжёлого негабарита: Ан-124-100 (120 т) и Ил-76ТД-90ВД; чартер, мультимодаль", "k": "+7 495 755-6850; sales@volga-dnepr.com; Пекин +86 10 8447 5502, apac.sales@volga-dnepr.com"}, {"n": "NOVELCO", "w": "Авиа, авто, море, ж/д; Китай, Турция, ОАЭ, <b>Иран</b>, СНГ; таможенное оформление, агентские услуги с конверсией от 1,5%", "k": "8-800-600-42-30, order@novelco.ru"}, {"n": "Совфрахт", "w": "Морские и речные перевозки, <b>Арктика и Каспий</b>, морское агентирование; профильна для коридора Север–Юг", "k": "+7 495 258-27-41, general@sovfracht.ru"}, {"n": "ОТЛК ЕРА", "w": "Ж/д контейнерные поезда Китай — Европа/Россия; ~485 поездов/мес, ~9 270 платформ, сохранность 99,998%. Погранпереходы Забайкальск, Достык, Алтынколь, Наушки", "k": "+7 495 995-95-91, utlc@utlc.com"}, {"n": "STALOGISTIC", "w": "14 офисов в 8 странах, 600+ чел.; ж/д, море, авто, авиа; <b>проектная логистика тяжёлых грузов</b>; Китай, Центральная Азия (Казахстан, Узбекистан), ЮВА; 540+ маршрутов", "k": "+375 17 270-49-79, sta@stalogistic.com"}, {"n": "ТПП РФ", "w": "Сертификаты происхождения СТ-1 (срок действия 12 мес.), форма А, общая форма; <b>экспертиза страны происхождения</b> (2000+ экспертов); удостоверение форс-мажора", "k": "+7 495 620-00-09; экспертиза +7 495 620-05-36; Москва, Ильинка 6/1"}, {"n": "Рускон (группа Дело)", "w": "Контейнерные перевозки, Китай / Индия / Турция / ОАЭ, мультимодаль, негабарит, таможенное оформление. Хабы Москва и Новороссийск", "k": "сайт отдаёт 403 из-за границы — контакты уточнять с российского IP"}], "log_steps": ["<b>Зафиксировать код ДО контрактации.</b> Определить мощность ГТУ-адресата → выбрать между 8411 99 001 9 (5–50 МВт), 8411 99 009 2 (>50 МВт, с подтверждением целевого назначения) и 8411 99 009 8. Внести формулировку в спецификацию контракта.", "<b>Подать на предварительное классификационное решение</b> — 5 000 ₽, до 90 дней, действует 3 года. При поставке партиями — параллельно решение о классификации в несобранном виде (ст. 16 ФЗ-289).", "<b>Проверить происхождение.</b> Иран, Сербия, Вьетнам дают 0%; Китай, Индия, Турция — 5%. Поставить на контроль вступление в силу соглашения с ОАЭ. <b>Оговорка: реэкспорт через Иран/ОАЭ преференций не даёт</b> — нужен реальный критерий происхождения. Товар китайского происхождения, отгруженный из Джебель-Али, остаётся китайским.", "<b>Включить упаковочный чек-лист в ТЗ</b> и потребовать фотоотчёт с клеймом ISPM 15 и установленными индикаторами до отгрузки.", "<b>Считать бюджет с учётом OOG-надбавок</b> и планировать вывоз из порта в первые 3 суток (бесплатное хранение OOG — 3 суток, не 5).", "<b>Котировки</b> запрашивать сразу у FESCO (projects@fesco.com) и минимум одного независимого проектного логиста; для срочных позиций — параллельно у Волга-Днепр."], "rfq": {"rules": ["<b>Правило 1. Идентифицировать машину, а не модель.</b> Отраслевой стандарт — три компонента: позиционное обозначение детали + версия горячего тракта + заводской номер ГТУ. Запрос «лопатка 1 ступени AE64.3A» без версии и серийника не отработает ни один поставщик — именно поэтому мы получили восемь отказов подряд.", "<b>Правило 2. Использовать позиционные коды.</b> TLa1, TLa2, TLa3, TLa4 — рабочие (роторные) лопатки турбины по ступеням; TLe1…TLe4 — сопловые (статорные). Это немецкая система Siemens, она реально фигурирует в тендерной документации европейских эксплуатантов и понятна любому профильному поставщику.", "<b>Правило 3. Указывать версию.</b> Для V94.2/ГТЭ-160 — Version 3, 4, 5, 6 или 7. Для AE-машин Ansaldo — «Rating &lt;год&gt;», для Siemens — «Version N». Одноимённые детали разных версий физически различаются.", "<b>Правило 4. Различать 64.3A и 94.3A.</b> Обе имеют 15-ступенчатый компрессор, кольцевую камеру с керамическими плитками, 24 горелки, 4-ступенчатую турбину и ротор с хиртовыми зубьями — это не признаки для идентификации. Различает: расход 215 против 755 кг/с, наличие редуктора (только 64.3A) и число ступеней компрессора у ранних машин.", "<b>Правило 5. Не употреблять несуществующие обозначения.</b> «HR3» как имя горелки, «AE94.3A4» и «AE94.3A5» как индексы версий в документации OEM отсутствуют. Их появление в запросе сразу помечает его как непрофессиональный.", "<b>Правило 6. Прикладывать наработку.</b> Эквивалентные часы (EOH) и число пусков определяют, какая ревизия детали нужна и годится ли восстановление. Без них поставщик не сможет предложить ремонт вместо покупки.", "<b>Правило 7. Когда чертежей нет — давать обмеры.</b> Для лопатки: число зубьев ёлочного замка, хорда, высота пера, толщина стенки, схема и число охлаждающих отверстий, тип покрытия, твёрдость, спектральный анализ материала. Для редуктора: <b>межосевое расстояние</b> (710 или 800 мм — это и решает спор TX71 против TX80), число зубьев шестерни и колеса, нормальный модуль, угол наклона, ширина венца, диаметры шеек, тип и число сегментов подшипника, отпечаток пятна контакта.", "<b>Правило 8. 3D-скан окупается.</b> Это единственный способ корректно поставить задачу китайскому или индийскому изготовителю. Практика David Brown Santasalo: структурированное сканирование вращающихся частей за срок менее 10 часов прямо в окно останова, корпус при этом сохраняется и присоединительные размеры не трогаются."], "template": "<b>Шаблон запроса (англ.)</b><br><br>Subject: RFQ — Hot gas path parts for Ansaldo AE64.3A / Siemens V64.3A (SGT-1000F), unit S/N &lt;номер&gt;<br><br>We operate an Ansaldo AE64.3A gas turbine (Siemens designation V64.3A / SGT-1000F), rated 65-80 MW, installed at &lt;станция&gt;, unit serial number &lt;номер&gt;, commissioned &lt;год&gt;, current operating hours &lt;EOH&gt;, equivalent starts &lt;число&gt;, hot gas path revision &lt;версия&gt;.<br><br>We request a quotation for the following positions:<br>1. TLa1 — turbine blade row 1 — qty &lt;n&gt; — new / refurbished<br>2. TLe1 — turbine vane row 1 — qty &lt;n&gt; — new / refurbished<br>3. Ring segments, stage &lt;n&gt; — qty &lt;n&gt;<br>4. Ceramic tiles and tile holders (brick holders) for the annular combustion chamber<br>5. Hybrid burner assemblies — qty 24<br><br>Please state for each position: lead time, material and coating specification, whether the part is OEM, OEM-equivalent or reverse-engineered, certification and traceability provided, and whether refurbishment of our removed parts is an option.<br><br>Drawings are not available on our side. Dimensional data, material analysis and 3D scans of the removed parts can be provided on request.<br><br><i>Прикладывать: фото шильдика машины, фото детали с масштабной линейкой, таблицу обмеров.</i>"}, "sources": [{"what": "Консолидированная отчётность Ansaldo Energia 2025 — акционеры, финансы, периметр, планы Ansaldo Russia", "url": "https://www.ansaldoenergia.com/fileadmin/documenti/WEB_Ansaldo_bilancio_AEN_CONSOLIDATO_ENG_20260622.pdf"}, {"what": "Отчётность 2024", "url": "https://www.ansaldoenergia.com/fileadmin/documenti/Ansaldo_Energia_Consolidated_Financial_Statements_2024.pdf"}, {"what": "Отчётность 2021 — цена продажи PSM и Thomassen корейцам", "url": "https://www.ansaldoenergia.com/fileadmin/Brochure/Ansaldo_Energia_Consolidated_Financial_Statement_2021__ENGL_.pdf"}, {"what": "Результаты 2025 и промышленный план 2026-2030", "url": "https://www.ansaldoenergia.com/about-us/media-center/power-generation-news-insights/detail-news/ansaldo-energia-back-to-profit-the-board-of-directors-approves-the-draft-2025-financial-statements-and-the-2026-2030-industrial-plan"}, {"what": "Арбитраж ICC: неограниченные права Ansaldo на технологию Siemens", "url": "https://www.powermag.com/ansaldo-energia-wins-arbitration-dispute-over-siemens-gas-turbine-patents/"}, {"what": "То же, пресс-релиз Ansaldo", "url": "https://www.ansaldoenergia.com/about-us/media-center/press-releases/detail-press-releases/icc-arbitral-tribunal-confirms-ansaldos-unlimited-rights-to-use-siem  ['АСУ ТП и арматура', () => D.controls.map(g=>`<h2>${esc(g.g)}</h2>` + T(['Позиция','Кто','Что это','Где у нас','Доступность'],
      g.rows.map(x=>[`<span class="cn">${esc(x.n)}</span>`, esc(x.who), x.what, x.ru, esc(x.av)]))).join('')
    + D.controls_notes.map(t=>`<div class="box">${t}</div>`).join('')],
 ['Санкции и каналы', () => D.sanctions.intro.map(t=>`<div class="box crit">${t}</div>`).join('')
    + T(['Канал','Как работает','Что реально получим','Риск','Первый шаг'],
      D.channels.map(x=>[`<span class="cn">${esc(x.name)}</span>`, x.how, x.what, esc(x.risk||''), x.step||'']))],
 ['Право и экспортконтроль', () => T(['Юрисдикция','Инструмент','Охват 8411','Дата введения','Что это значит'],
      D.legal_map.map(x=>[`<span class="cn">${esc(x.j)}</span>`, esc(x.a), x.s, x.w, x.x]))
    + D.legal_notes.map(t=>`<div class="box crit">${t}</div>`).join('')],
 ['Логистика и таможня', () => '<h2>Коды ТН ВЭД и ставки</h2>' + T(['Код','Наименование','Пошлина','НДС','Примечание'],
      D.customs_codes.map(x=>[`<span class="cn">${esc(x.c)}</span>`, esc(x.n), `<span class="cn">${esc(x.d)}</span>`, esc(x.v), x.x]))
    + '<h2>Где переклассифицируют</h2>' + D.customs_risk.map(t=>`<div class="box warn">${t}</div>`).join('')
    + '<h2>Торговые соглашения ЕАЭС — что даёт по 8411</h2>' + T(['Партнёр','Тип','В силе с','Что по 8411','Сертификат'],
      D.trade_prefs.map(x=>[`<span class="cn">${esc(x.p)}</span>`, esc(x.t), esc(x.in), x.r, esc(x.s)]))
    + '<h2>Маршруты и сроки</h2>' + T(['Маршрут','Сервис','Транзит','Частота / примечание'],
      D.routes.map(x=>[`<span class="cn">${esc(x.f)}</span>`, esc(x.s), `<span class="cn">${esc(x.t)}</span>`, esc(x.q)]))
    + '<h2>Стоимость: надбавки за негабарит (тариф FESCO FBSS, 08.2026)</h2>' + T(['Позиция','Ставка'],
      D.oog_costs.map(x=>[esc(x.i), `<span class="cn">${esc(x.v)}</span>`]))
    + '<h2>Габариты, упаковка, консервация</h2>' + D.pack_rules.map(t=>`<div class="box">${t}</div>`).join('')
    + '<h2>Логисты и брокеры</h2>' + T(['Компания','Что делает','Контакт'],
      D.log_cos.map(x=>[`<span class="cn">${esc(x.n)}</span>`, x.w, esc(x.k)]))
    + '<h2>Порядок действий</h2><ol class="ls">' + D.log_steps.map(t=>`<li>${t}</li>`).join('') + '</ol>'],
 ['Как писать RFQ', () => D.rfq.rules.map(t=>`<div class="box warn">${t}</div>`).join('') + (D.rfq.template?`<div class="box">${D.rfq.template}</div>`:'')],
 ['Источники', () => T(['№','Что подтверждает','Ссылка'],
    D.sources.map((s,i)=>[String(i+1), esc(s.what), `<a href="${esc(s.url)}" rel="noreferrer noopener" target="_blank"><span class="src">${esc(s.url)}</span></a>`]))],
];

document.getElementById('tabs').innerHTML = PANES.map((p,i)=>`<button class="tab${i?'':' on'}" data-i="${i}">${esc(p[0])}</button>`).join('');
document.getElementById('panes').innerHTML = PANES.map((p,i)=>`<div class="pane${i?'':' on'}" id="p${i}">${i?'':p[1]()}</div>`).join('');
document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('.tab'); if(!b) return;
  const i = +b.dataset.i;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t===b));
  document.querySelectorAll('.pane').forEach((p,j)=>{
    if(j===i && !p.dataset.built && j) { p.innerHTML = PANES[j][1](); p.dataset.built='1'; }
    p.classList.toggle('on', j===i);
  });
});
</script>
